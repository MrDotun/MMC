<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind Masters | Chess Class</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { 
            --primary: #2D1B4D; 
            --secondary: #4ade80; 
            --bg: #0f172a; 
            --text: #f8fafc; 
            --card: #1e293b; 
            --danger: #ef4444; 
            --gold: #fbbf24; 
            --glass: rgba(30, 41, 59, 0.7);
        }
        
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 440px; background: var(--glass); padding: 25px; border-radius: 28px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(15px); margin-bottom: 20px; }
        .hidden { display: none !important; }
        #password-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .pass-card { background: var(--card); padding: 40px 30px; border-radius: 24px; border: 1px solid var(--gold); text-align: center; width: 320px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 14px 20px; border-radius: 16px; margin-bottom: 20px; }
        .live-badge { background: var(--danger); color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .master-badge { background: var(--gold); color: #000; padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 900; }
        #board-wrapper { position: relative; width: 100%; margin-bottom: 15px; }
        #masterBoard { border: 6px solid #1e293b; border-radius: 12px; width: 100%; }
        #drawingCanvas { position: absolute; top: 6px; left: 6px; z-index: 10; pointer-events: none; }
        .analysis-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .tool-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 12px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .pgn-section { margin-top: 15px; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 10px; }
        textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 10px; box-sizing: border-box; }
        .btn { padding: 16px; cursor: pointer; border-radius: 14px; border: none; background: linear-gradient(135deg, #4c1d95 0%, #2D1B4D 100%); color: var(--secondary); font-weight: 800; width: 100%; margin-top: 10px; }
        .btn-gold { background: var(--gold); color: #000; }
        #master-chat-box { height: 100px; overflow-y: auto; font-size: 12px; margin-bottom: 12px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary); margin: 20px 0; font-weight: 900; letter-spacing: 4px;">MIND MASTERS</h1>

    <div id="password-overlay" class="hidden">
        <div class="pass-card">
            <h2 style="color: var(--gold);">Security Gate</h2>
            <input type="password" id="access-key" placeholder="••••" style="text-align: center; font-size: 24px; width: 80%; background: #000; color: #fff; border: 1px solid var(--gold); padding: 10px; border-radius: 10px;">
            <button class="btn btn-gold" onclick="verifyAccess()">AUTHORIZE</button>
        </div>
    </div>

    <div id="section-lobby" class="container">
        <input type="text" id="user-display-name" placeholder="Enter your name..." style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; background:rgba(0,0,0,0.3); color:white; border:1px solid rgba(255,255,255,0.1);">
        <button class="btn btn-gold" onclick="showPassScreen()">🚀 JOIN SESSION</button>
    </div>

    <div id="section-masterclass" class="container hidden">
        <div class="status-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="live-badge">LIVE</div>
                <span id="role-text">STUDENT</span>
            </div>
            <div id="mic-status">🎤 Muted</div>
        </div>

        <div id="board-wrapper">
            <div id="masterBoard"></div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div id="master-admin-panel" class="hidden">
            <div class="analysis-tools">
                <button class="tool-btn" onclick="masterBoard.start()">🔄 RESET</button>
                <button class="tool-btn" onclick="toggleDrawMode()">✏️ DRAW</button>
                <button class="tool-btn" onclick="clearDrawings()">🧹 ERASE</button>
                <button class="tool-btn" onclick="emptyBoard()">🕳️ EMPTY</button>
            </div>
            <div class="pgn-section">
                <textarea id="pgn-input" placeholder="Paste PGN..."></textarea>
                <button class="tool-btn" style="width:100%; margin-top:5px;" onclick="loadPgn()">📥 LOAD PGN</button>
            </div>
        </div>

        <div id="chat-container" style="margin-top:15px;">
            <div id="master-chat-box"></div>
            <input type="text" id="master-chat-input" placeholder="Type..." style="width:100%; padding:10px; border-radius:10px; background:rgba(0,0,0,0.3); color:white;">
        </div>
        <button class="btn" style="background:transparent; border:1px solid #444;" onclick="location.reload()">EXIT</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", projectId: "assignments-de95a" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myData = { name: "" }; 
        let masterBoard = null;
        let isCoach = false;
        let localStream = null;

        function showPassScreen() { 
            myData.name = $("#user-display-name").val() || "Guest";
            $("#password-overlay").removeClass("hidden"); 
        }

        async function verifyAccess() {
            const pass = $("#access-key").val();
            if (pass === "dotun1234") {
                isCoach = true;
                $("#master-admin-panel").removeClass("hidden");
                $("#role-text").html('<span class="master-badge">COACH</span>');
            }
            $("#password-overlay, #section-lobby").addClass("hidden");
            $("#section-masterclass").removeClass("hidden");
            
            initBoard();
            initAudio(); // Hardware wake-up
        }

        async function initAudio() {
            try {
                // Request mic permission
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // Feedback loop so you can HEAR it works on one phone
                const audio = new Audio();
                audio.srcObject = localStream;
                audio.play(); 
                $("#mic-status").text("🎤 LIVE").css("color", "var(--secondary)");
            } catch (e) {
                $("#mic-status").text("⚠️ Blocked").css("color", "var(--danger)");
            }
        }

        function initBoard() {
            masterBoard = ChessBoard('masterBoard', {
                draggable: true,
                dropOffBoard: 'trash',
                sparePieces: true,
                position: 'start',
                onDrop: () => {
                    db.collection("live_class").doc("room1").set({ fen: masterBoard.fen() });
                }
            });
            db.collection("live_class").doc("room1").onSnapshot(doc => {
                if(doc.exists && doc.data().fen !== masterBoard.fen()) masterBoard.position(doc.data().fen);
            });
        }

        function loadPgn() {
            const game = new Chess();
            if(game.load_pgn($("#pgn-input").val())) masterBoard.position(game.fen());
        }

        function toggleDrawMode() { /* Drawing logic here */ }
        function clearDrawings() { /* Clear canvas here */ }
        function emptyBoard() { masterBoard.clear(); }
    </script>
</body>
</html>
