<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GM Variation Master Pro | Decipher Chess Academy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chunk-card { border-left: 4px solid #d4af37; transition: all 0.2s; cursor: pointer; }
        .chunk-card.completed { border-left-color: #10b981; opacity: 0.5; }
        textarea { background: #0f172a !important; border: 1px solid #334155 !important; font-family: 'Fira Code', monospace; scrollbar-width: thin; }
        textarea:focus { border-color: #d4af37 !important; outline: none; }
        #progress-fill { height: 100%; background: #d4af37; width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* Live Call Styles */
        .call-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.3); border: 1px solid #d4af37; }
        .recording-pulse { animation: pulse 1s infinite; background: #ef4444 !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-6">
            <div>
                <h1 class="text-3xl font-bold gold-text tracking-tight italic">DECIPHER <span class="text-white not-italic">GM-MASTER PRO</span></h1>
                <p class="text-slate-400 text-sm font-light uppercase tracking-widest">Precision 3-Move Stride + Voice Comms</p>
            </div>
            <nav class="flex gap-2 p-1 bg-slate-900 rounded-lg">
                <button onclick="switchTab('fragmenter')" id="tab-f" class="px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg">1. Fragmenter</button>
                <button onclick="switchTab('reassembler')" id="tab-r" class="px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white">2. Re-assembler</button>
            </nav>
        </header>

        <div class="glass p-4 rounded-2xl mb-6 flex flex-col md:flex-row items-center gap-4">
            <div id="call-controls" class="flex-1 flex items-center justify-between w-full">
                <div class="flex items-center gap-3">
                    <div id="connection-status" class="w-3 h-3 rounded-full bg-red-500"></div>
                    <span id="status-text" class="text-[10px] uppercase font-bold tracking-widest text-slate-400">System Offline</span>
                </div>
                <div class="flex gap-2">
                    <button id="start-call-btn" onclick="initLiveComms()" class="px-4 py-2 bg-emerald-600 text-white text-[10px] font-bold rounded-lg uppercase">Initialize Live</button>
                    <button id="mic-toggle" onclick="toggleMute()" class="px-4 py-2 bg-slate-700 text-white text-[10px] font-bold rounded-lg uppercase hidden">Mute Mic</button>
                </div>
            </div>
            <div class="h-10 w-[1px] bg-slate-700 hidden md:block"></div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <button id="vn-btn" onclick="toggleVN()" class="w-10 h-10 flex items-center justify-center bg-slate-800 rounded-full border border-slate-600">🎤</button>
                <div id="vn-status" class="text-[10px] text-slate-500 uppercase font-bold">Mic Standby</div>
            </div>
        </div>

        <div id="view-fragmenter" class="space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-xs font-bold uppercase text-slate-500">Master PGN Input</label>
                    <div class="text-right">
                        <div id="stats" class="text-[10px] text-slate-400 uppercase tracking-widest">Ready</div>
                        <div class="w-48 h-1 bg-slate-800 mt-1 rounded-full overflow-hidden"><div id="progress-fill"></div></div>
                    </div>
                </div>
                <textarea id="pgn-input" rows="6" class="w-full p-4 rounded-xl text-sm mb-4" placeholder="Paste PGN here..."></textarea>
                
                <div class="flex flex-wrap gap-3">
                    <button onclick="processPgn()" class="px-6 py-3 bg-white text-black font-bold rounded-xl hover:bg-slate-200 uppercase text-xs">Initialize Engine</button>
                    <button onclick="copyNextBatch()" id="batch-btn" class="px-6 py-3 gold-bg rounded-xl font-bold hidden uppercase text-xs">Copy Next 10</button>
                    <button onclick="copyAllRemaining()" id="all-btn" class="px-6 py-3 bg-slate-800 text-white rounded-xl font-bold hidden uppercase text-xs">Copy All Remaining</button>
                    <button onclick="clearAll()" class="px-6 py-3 bg-red-900/30 text-red-400 rounded-xl font-bold uppercase text-xs">Reset</button>
                </div>
            </div>
            <div id="chunks-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
        </div>

        <div id="view-reassembler" class="hidden space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 1: Paste Gemini's Chat/JSON</label>
                        <textarea id="ai-json" rows="14" class="w-full p-4 rounded-xl text-xs" placeholder="Paste the entire Gemini response here..."></textarea>
                    </div>
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 2: Final Re-Assembled PGN</label>
                        <textarea id="final-pgn" rows="14" class="w-full p-4 rounded-xl text-xs text-emerald-400" readonly></textarea>
                        <div class="flex gap-2">
                            <button onclick="copyToClipboard('final-pgn')" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase">Copy Final</button>
                            <button onclick="downloadPgn()" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase">Download</button>
                        </div>
                    </div>
                </div>
                <button onclick="rebuildPgn()" class="mt-6 w-full py-4 gold-bg rounded-xl font-bold uppercase tracking-widest shadow-lg shadow-yellow-900/20">Inject Annotations & Rebuild File</button>
            </div>
        </div>
    </div>

    <audio id="peer-audio-output" playsinline autoplay></audio>

    <script>
        // --- FIREBASE & PEERJS CONFIGURATION ---
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let peer;
        let myStream;
        let isMuted = false;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function initLiveComms() {
            // Prime audio for mobile Chrome
            const audioOut = document.getElementById('peer-audio-output');
            audioOut.play().catch(() => {});

            try {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                $("#start-call-btn").addClass("hidden");
                $("#mic-toggle").removeClass("hidden");
                $("#connection-status").removeClass("bg-red-500").addClass("bg-emerald-500");
                $("#status-text").text("Comms Active").addClass("text-emerald-500");

                peer = new Peer();
                peer.on('open', (id) => {
                    db.collection("special_rooms").doc("masterclass_arena").update({ currentStudentPeer: id });
                });

                peer.on('call', (call) => {
                    call.answer(myStream);
                    call.on('stream', (remoteStream) => {
                        audioOut.srcObject = remoteStream;
                        audioOut.play();
                    });
                });

                // Voice Note setup
                mediaRecorder = new MediaRecorder(myStream);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => { sendVN(reader.result); audioChunks = []; };
                };

            } catch (err) {
                alert("Please enable microphone access for live teaching.");
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            myStream.getAudioTracks()[0].enabled = !isMuted;
            $("#mic-toggle").text(isMuted ? "Unmute Mic" : "Mute Mic").toggleClass("bg-red-600");
        }

        function toggleVN() {
            if (!isRecording) {
                audioChunks = [];
                mediaRecorder.start();
                isRecording = true;
                $("#vn-btn").addClass("recording-pulse");
                $("#vn-status").text("Recording...").addClass("text-red-500");
            } else {
                mediaRecorder.stop();
                isRecording = false;
                $("#vn-btn").removeClass("recording-pulse");
                $("#vn-status").text("Mic Standby").removeClass("text-red-500");
            }
        }

        function sendVN(base64) {
            db.collection("special_rooms").doc("masterclass_arena").collection("messages").add({
                name: "Coach",
                audio: base64,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        // --- ORIGINAL PGN LOGIC ---
        let globalChunks = [];
        let pgnTokens = [];
        let currentBatchStart = 0;

        window.onload = () => {
            const saved = localStorage.getItem('gm_master_state');
            if (saved) {
                const state = JSON.parse(saved);
                document.getElementById('pgn-input').value = state.original;
                processPgn(true);
                currentBatchStart = state.batchStart;
                updateUI();
            }
        };

        function switchTab(tab) {
            document.getElementById('view-fragmenter').classList.toggle('hidden', tab !== 'fragmenter');
            document.getElementById('view-reassembler').classList.toggle('hidden', tab !== 'reassembler');
            document.getElementById('tab-f').className = tab === 'fragmenter' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
            document.getElementById('tab-r').className = tab === 'reassembler' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
        }

        function processPgn(isLoad = false) {
            const input = document.getElementById('pgn-input').value;
            if (!input) return;

            pgnTokens = input.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|[a-zA-Z0-9\-+=#$?!/]+)/g) || [];
            
            let chunks = [];
            let moveNumber = 0;
            let variationLevel = 0;
            let currentPath = [];
            let depthPlyCounts = { 0: 0 }; 
            let justClosedVariation = false;

            pgnTokens.forEach((token, index) => {
                if (token === "(") { variationLevel++; depthPlyCounts[variationLevel] = 0; return; }
                if (token === ")") { variationLevel--; justClosedVariation = true; return; }
                const isMoveNum = /^\d+\./.test(token);
                if (isMoveNum) { moveNumber = parseInt(token); return; }

                const isMove = /^[a-zA-Z]/.test(token) && !token.startsWith('{') && !token.startsWith('[');
                if (isMove) {
                    depthPlyCounts[variationLevel]++;
                    currentPath.push(token);
                    if (moveNumber > 5 || variationLevel > 0) {
                        let evalSymbol = "";
                        let nextToken = pgnTokens[index + 1];
                        if (nextToken && (nextToken.startsWith('$') || /^[!?]+$/.test(nextToken))) { evalSymbol = ` ${nextToken}`; }
                        const hasImportantSymbol = token.includes('!') || token.includes('?') || evalSymbol.includes('!') || evalSymbol.includes('?');
                        const isFirstMoveOfVariation = (variationLevel > 0 && depthPlyCounts[variationLevel] === 1);
                        const isStrideMove = (depthPlyCounts[variationLevel] % 6 === 0) || isFirstMoveOfVariation || justClosedVariation;

                        if (isStrideMove || hasImportantSymbol) {
                            let subsequent = [];
                            for(let i = index + 1; i < index + 15 && i < pgnTokens.length; i++) {
                                if (!pgnTokens[i].startsWith('{')) subsequent.push(pgnTokens[i]);
                            }
                            chunks.push({
                                id: `CHUNK_${chunks.length}`,
                                target: token + evalSymbol,
                                tokenIndex: index,
                                context: currentPath.slice(-15).join(" "),
                                future: subsequent.join(" ")
                            });
                            justClosedVariation = false; 
                        }
                    }
                }
            });

            globalChunks = chunks;
            if (!isLoad) currentBatchStart = 0;
            document.getElementById('batch-btn').classList.remove('hidden');
            document.getElementById('all-btn').classList.remove('hidden');
            updateUI();
            saveState();
        }

        function formatBatch(start, end) {
            const batch = globalChunks.slice(start, end).map(c => 
                `ID: ${c.id}\nContext: ${c.context}\nTARGET: ${c.target}\nSubsequent: ${c.future}`
            ).join("\n---\n");

            return `Role: 2700 ELO GM. Task: Deep positional analysis.\nFORMAT: ONLY JSON\n{"CHUNK_ID": "Your Analysis"}\n\n${batch}`;
        }

        function copyNextBatch() {
            const end = Math.min(currentBatchStart + 10, globalChunks.length);
            navigator.clipboard.writeText(formatBatch(currentBatchStart, end));
            currentBatchStart = end;
            updateUI();
            saveState();
            alert("Batch Copied!");
        }

        function copyAllRemaining() {
            navigator.clipboard.writeText(formatBatch(currentBatchStart, globalChunks.length));
            currentBatchStart = globalChunks.length;
            updateUI();
            saveState();
            alert("Full Game Copied!");
        }

        function rebuildPgn() {
            const raw = document.getElementById('ai-json').value;
            let aiData = {};
            const matches = raw.match(/\{[\s\S]*?\}/g);
            if (matches) {
                matches.forEach(m => {
                    try { Object.assign(aiData, JSON.parse(m)); } catch(e){}
                });
            }
            let workingTokens = [...pgnTokens];
            const sortedIds = Object.keys(aiData).sort((a,b) => {
                const idxA = globalChunks.find(c => c.id === a)?.tokenIndex || 0;
                const idxB = globalChunks.find(c => c.id === b)?.tokenIndex || 0;
                return idxB - idxA;
            });
            sortedIds.forEach(id => {
                const chunk = globalChunks.find(c => c.id === id);
                if (chunk) { workingTokens[chunk.tokenIndex] += ` { ${aiData[id]} }`; }
            });
            document.getElementById('final-pgn').value = workingTokens.join(" ");
        }

        function updateUI() {
            const container = document.getElementById('chunks-container');
            container.innerHTML = "";
            globalChunks.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = `chunk-card glass p-2 rounded-lg ${i < currentBatchStart ? 'completed' : ''}`;
                div.innerHTML = `<p class="text-[8px] gold-text font-bold">${c.id}</p><p class="text-[10px] truncate">${c.target}</p>`;
                container.appendChild(div);
            });
            const perc = (currentBatchStart / globalChunks.length) * 100 || 0;
            document.getElementById('progress-fill').style.width = perc + "%";
            document.getElementById('stats').innerText = `${currentBatchStart}/${globalChunks.length} KEY POSITIONS`;
        }

        function saveState() {
            localStorage.setItem('gm_master_state', JSON.stringify({
                original: document.getElementById('pgn-input').value,
                batchStart: currentBatchStart
            }));
        }

        function clearAll() { localStorage.removeItem('gm_master_state'); location.reload(); }
        function copyToClipboard(id) { navigator.clipboard.writeText(document.getElementById(id).value); alert("Copied!"); }
        function downloadPgn() {
            const blob = new Blob([document.getElementById('final-pgn').value], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "GM_Variation_Analysis.pgn";
            a.click();
        }
    </script>
</body>
</html>
