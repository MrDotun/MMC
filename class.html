</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Chess Class</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>

    <style>
        :root { --primary: #2D1B4D; --secondary: #4ade80; --bg: #0f172a; --text: #f8fafc; --card: #1e293b; --danger: #ef4444; --gold: #fbbf24; }
        
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); color: var(--text); margin: 0; padding: 15px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        .container { width: 100%; max-width: 420px; background: rgba(30, 41, 59, 0.8); padding: 25px; border-radius: 24px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(12px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        #password-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.9); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .pass-card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--gold); text-align: center; width: 300px; }

        .master-arena-card { border: 1px solid rgba(251, 191, 36, 0.4); background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 1)); }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.4); padding: 12px 18px; border-radius: 30px; margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .live-badge { background: var(--danger); color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .master-badge { background: var(--gold); color: #000; padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: 900; text-transform: uppercase; }

        #masterBoard { border: 4px solid #1e293b; border-radius: 12px; box-shadow: 0 0 25px rgba(0,0,0,0.5); width: 100%; cursor: pointer; }
        
        /* Highlight for click-to-move */
        .highlight-sq { box-shadow: inset 0 0 3px 3px yellow; }

        .analysis-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
        .tool-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .tool-btn:hover { background: rgba(251, 191, 36, 0.15); border-color: var(--gold); }

        .btn { padding: 16px; cursor: pointer; border-radius: 12px; border: none; background: linear-gradient(135deg, #2D1B4D 0%, #4c1d95 100%); color: var(--secondary); font-weight: 800; width: 100%; text-transform: uppercase; transition: 0.3s; font-size: 12px; margin-top: 10px; }
        .btn-gold { background: var(--gold); color: #000; }

        #participants-list { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; margin: 10px 0; font-size: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .participant-item { display: flex; justify-content: space-between; margin-bottom: 4px; color: #94a3b8; }

        #chat-container { margin-top: 15px; background: rgba(2, 6, 23, 0.6); border-radius: 12px; padding: 10px; border-top: 2px solid var(--gold); }
        #master-chat-box { height: 120px; overflow-y: auto; font-size: 11px; margin-bottom: 10px; scroll-behavior: smooth; }
        .chat-msg { margin-bottom: 6px; color: #cbd5e1; }
        .chat-user { font-weight: bold; margin-right: 5px; color: var(--secondary); }
        .chat-coach { color: var(--gold) !important; text-shadow: 0 0 5px rgba(251, 191, 36, 0.3); }
        .chat-input-wrap { display: flex; gap: 5px; }
        input { flex: 1; background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; font-size: 12px; }

        .mic-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--secondary); color: white; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .mic-off { border-color: var(--danger); color: var(--danger); }
    </style>
</head>
<body>

    <h1 id="main-title" style="color: var(--secondary); margin-bottom: 25px; font-style: italic; letter-spacing: 2px; text-align: center;">MIND MASTERS LIVE CLASS</h1>

    <div id="password-overlay" class="hidden">
        <div class="pass-card">
            <h2 style="color: var(--gold); margin-top: 0;">Access Security</h2>
            <input type="password" id="access-key" placeholder="Enter Key..." style="width: 80%; margin-bottom: 15px; text-align: center;">
            <button class="btn btn-gold" onclick="verifyAccess()">ENTER STUDIO</button>
        </div>
    </div>

    <div id="section-lobby" class="container">
        <h3 style="text-align: center; letter-spacing: 2px;">ACADEMY LOBBY</h3>
        <button class="btn btn-gold" onclick="showPassScreen()">🎓 JOIN LIVE SESSION</button>
    </div>

    <div id="section-masterclass" class="container master-arena-card hidden">
        <div class="status-bar" id="audio-status-bar">
            <div style="display:flex; align-items:center; gap:8px;">
                <div class="live-badge">LIVE</div>
                <span id="role-text" style="font-size: 11px; font-weight: bold; color: var(--gold);">STUDENT</span>
            </div>
            <div id="mic-control-area"></div>
        </div>

        <div id="masterBoard"></div>

        <div id="participants-panel">
            <p style="font-size: 10px; font-weight: bold; color: var(--secondary); margin-bottom: 5px;">PARTICIPANTS</p>
            <div id="participants-list"></div>
        </div>

        <div id="master-admin-panel" class="hidden">
            <div class="analysis-tools">
                <button class="tool-btn" onclick="syncMasterPosition('start')">🔄 RESET</button>
                <button class="tool-btn" onclick="masterBoard.flip()">🔄 FLIP</button>
                <button class="tool-btn" onclick="muteAllStudents()" style="color:var(--danger)">🔇 MUTE ALL</button>
                <button class="tool-btn" onclick="unmuteAllStudents()" style="color:var(--secondary)">🔊 UNMUTE ALL</button>
            </div>
        </div>

        <div id="chat-container">
            <div id="master-chat-box"></div>
            <div class="chat-input-wrap">
                <input type="text" id="master-chat-input" placeholder="Say something..." onkeypress="if(event.key === 'Enter') sendMasterChat()">
                <button class="btn" style="width: 60px; padding: 10px; margin:0;" onclick="sendMasterChat()">SEND</button>
            </div>
        </div>

        <button class="btn" style="margin-top:20px; background: transparent; border: 1px solid #334155; color: #64748b;" onclick="exitStudio()">LEAVE CLASS</button>
    </div>

    <div id="jitsi-container" style="display:none;"></div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myData = { name: "Student_" + Math.floor(Math.random()*1000), id: Math.random().toString(36).substr(2, 9) }; 
        let masterBoard = null;
        let isCoach = false;
        let jitsiAPI = null;
        let micOn = false;
        
        // CLICK TO MOVE VARIABLES
        let sourceSquare = null;

        function showPassScreen() { $("#password-overlay").removeClass("hidden"); }

        async function verifyAccess() {
            const pass = $("#access-key").val();
            if (pass === "dotun1234") {
                isCoach = true;
                myData.name = "Coach Dotun";
                $("#master-admin-panel").removeClass("hidden");
                $("#role-text").html('<span class="master-badge">COACH</span>');
            } else if (pass.length > 2) {
                isCoach = false;
                $("#role-text").text("STUDENT VIEW");
            } else { alert("Invalid Key"); return; }

            $("#password-overlay").addClass("hidden");
            $("#section-lobby").addClass("hidden");
            $("#section-masterclass").removeClass("hidden");
            $("#main-title").text("MIND MASTERS CHESS CLASS");

            initBoard();
            initAudio();
            renderMicUI();
        }

        function initBoard() {
            if(masterBoard) masterBoard.destroy();
            
            const config = {
                draggable: false, // Explicitly set to false for click-to-move
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            masterBoard = ChessBoard('masterBoard', config);

            // CLICK TO MOVE LOGIC
            $('#masterBoard').on('click', '.square-55d63', function() {
                if (!isCoach) return; // Only coach can move

                const square = $(this).data('square');
                const piece = masterBoard.position()[square];

                // Remove previous highlights
                $('#masterBoard .square-55d63').removeClass('highlight-sq');

                if (sourceSquare === null) {
                    if (piece) {
                        sourceSquare = square;
                        $(this).addClass('highlight-sq');
                    }
                } else {
                    // Execute move
                    const newPos = masterBoard.position();
                    const movingPiece = newPos[sourceSquare];
                    delete newPos[sourceSquare];
                    newPos[square] = movingPiece;

                    masterBoard.position(newPos);
                    
                    // Sync to Firebase
                    db.collection("special_rooms").doc("masterclass_arena").set({
                        fen: ChessBoard.objToFen(newPos),
                        lastUpdate: Date.now()
                    }, {merge: true});

                    sourceSquare = null;
                }
            });

            db.collection("special_rooms").doc("masterclass_arena").onSnapshot(doc => {
                const d = doc.data();
                if (d && d.fen && masterBoard.fen() !== d.fen) masterBoard.position(d.fen);
                if (!isCoach && d) {
                    if(d.globalMute > (myData.lastCmd || 0)) { if(micOn) handleMicToggle(); myData.lastCmd = d.globalMute; }
                    if(d.globalUnmute > (myData.lastCmd || 0)) { if(!micOn) handleMicToggle(); myData.lastCmd = d.globalUnmute; }
                }
            });

            // Chat Sync
            db.collection("special_rooms").doc("masterclass_arena").collection("chat")
                .orderBy("time", "desc").limit(30).onSnapshot(snap => {
                    let html = "";
                    snap.docs.reverse().forEach(doc => {
                        const m = doc.data();
                        html += `<div class="chat-msg"><span class="chat-user ${m.isCoach ? 'chat-coach' : ''}">${m.user}:</span> ${m.text}</div>`;
                    });
                    const box = document.getElementById('master-chat-box');
                    box.innerHTML = html; box.scrollTop = box.scrollHeight;
                });
        }

        // --- AUDIO & UI UTILS ---
        function renderMicUI() {
            $("#mic-control-area").html(`<button id="mic-toggle-btn" class="mic-btn ${isCoach ? '' : 'mic-off'}" onclick="handleMicToggle()">${isCoach ? '🎤' : '🔇'}</button>`);
        }

        function handleMicToggle() {
            if(!jitsiAPI) return;
            jitsiAPI.executeCommand('toggleAudio');
            micOn = !micOn;
            $("#mic-toggle-btn").toggleClass("mic-off", !micOn).text(micOn ? "🎤" : "🔇");
        }

        function muteAllStudents() { if(isCoach) db.collection("special_rooms").doc("masterclass_arena").update({ globalMute: Date.now() }); }
        function unmuteAllStudents() { if(isCoach) db.collection("special_rooms").doc("masterclass_arena").update({ globalUnmute: Date.now() }); }

        function initAudio() {
            jitsiAPI = new JitsiMeetExternalAPI("meet.jit.si", {
                roomName: "MindMasters_Arena_2026",
                width: '100%', height: 0,
                parentNode: document.querySelector('#jitsi-container'),
                userInfo: { displayName: myData.name },
                configOverwrite: { startWithAudioMuted: !isCoach, startWithVideoMuted: true, prejoinPageEnabled: false },
            });
            micOn = isCoach;
            setInterval(() => {
                const list = jitsiAPI.getParticipantsInfo();
                let html = `<div class="participant-item"><span>${myData.name} (You)</span> <span>🟢</span></div>`;
                list.forEach(p => { html += `<div class="participant-item"><span>${p.displayName || 'Guest'}</span> <span>🟢</span></div>`; });
                $("#participants-list").html(html);
            }, 5000);
        }

        function syncMasterPosition(fen) {
            if(!isCoach) return;
            if(fen === 'start') masterBoard.start();
            setTimeout(() => { db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() }); }, 100);
        }

        async function sendMasterChat() {
            const txt = $("#master-chat-input").val().trim();
            if(!txt) return;
            await db.collection("special_rooms").doc("masterclass_arena").collection("chat").add({
                user: myData.name, text: txt, isCoach: isCoach, time: Date.now()
            });
            $("#master-chat-input").val("");
        }

        function exitStudio() { if(confirm("Exit?")) { if(jitsiAPI) jitsiAPI.dispose(); location.reload(); } }
    </script>
</body>
</html>
