<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind Masters | Chess Class</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>

    <style>
        :root { --primary: #2D1B4D; --secondary: #4ade80; --bg: #0f172a; --text: #f8fafc; --card: #1e293b; --danger: #ef4444; --gold: #fbbf24; }
        
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); color: var(--text); margin: 0; padding: 15px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        .container { width: 100%; max-width: 420px; background: rgba(30, 41, 59, 0.8); padding: 25px; border-radius: 24px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(12px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        #password-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.9); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .pass-card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--gold); text-align: center; width: 300px; }

        .master-arena-card { border: 1px solid rgba(251, 191, 36, 0.4); background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 1)); }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.4); padding: 12px 18px; border-radius: 30px; margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .live-badge { background: var(--danger); color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .master-badge { background: var(--gold); color: #000; padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: 900; text-transform: uppercase; }

        /* Board & Drawing Wrapper */
        #board-wrapper { position: relative; width: 100%; touch-action: none; margin-bottom: 15px; }
        #masterBoard { border: 4px solid #1e293b; border-radius: 12px; box-shadow: 0 0 25px rgba(0,0,0,0.5); width: 100%; }
        #drawingCanvas { position: absolute; top: 4px; left: 4px; z-index: 10; pointer-events: none; border-radius: 8px; }
        
        /* Updated: Control canvas interactions via draw-mode class instead of coach-mode */
        .draw-mode #drawingCanvas { pointer-events: auto; }
        .draw-active { background: var(--secondary) !important; color: #000 !important; }

        .analysis-tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 15px 0; }
        .tool-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }

        .btn { padding: 16px; cursor: pointer; border-radius: 12px; border: none; background: linear-gradient(135deg, #2D1B4D 0%, #4c1d95 100%); color: var(--secondary); font-weight: 800; width: 100%; text-transform: uppercase; transition: 0.3s; font-size: 12px; margin-top: 10px; }
        .btn-gold { background: var(--gold); color: #000; }

        #participants-list { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; margin: 10px 0; font-size: 12px; min-height: 20px; }
        .participant-item { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .participant-item:last-child { border-bottom: none; }
        
        #chat-container { margin-top: 15px; background: rgba(2, 6, 23, 0.6); border-radius: 12px; padding: 10px; border-top: 2px solid var(--gold); }
        #master-chat-box { height: 120px; overflow-y: auto; font-size: 11px; margin-bottom: 10px; }
        .chat-input-wrap { display: flex; gap: 5px; }
        input { flex: 1; background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <h1 id="main-title" style="color: var(--secondary); margin-bottom: 25px; font-style: italic; letter-spacing: 2px; text-align: center;">MIND MASTERS LIVE CLASS</h1>

    <div id="password-overlay" class="hidden">
        <div class="pass-card">
            <h2 style="color: var(--gold); margin-top: 0;">Access Security</h2>
            <input type="password" id="access-key" placeholder="Enter Key..." style="width: 80%; margin-bottom: 15px; text-align: center;">
            <button class="btn btn-gold" onclick="verifyAccess()">ENTER STUDIO</button>
        </div>
    </div>

    <div id="section-lobby" class="container">
        <h3 style="text-align: center; letter-spacing: 2px;">ACADEMY LOBBY</h3>
        <button class="btn btn-gold" onclick="showPassScreen()">🎓 JOIN LIVE SESSION</button>
    </div>

    <div id="section-masterclass" class="container master-arena-card hidden">
        <div class="status-bar" id="audio-status-bar">
            <div style="display:flex; align-items:center; gap:8px;">
                <div class="live-badge">LIVE</div>
                <span id="role-text" style="font-size: 11px; font-weight: bold; color: var(--gold);">STUDENT</span>
            </div>
            <div id="mic-control-area"></div>
        </div>

        <div id="board-wrapper">
            <div id="masterBoard"></div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div id="participants-panel">
            <p style="font-size: 10px; font-weight: bold; color: var(--secondary); margin-bottom: 5px;">PARTICIPANTS</p>
            <div id="participants-list"><i>Waiting for others...</i></div>
        </div>

        <div id="master-admin-panel" class="hidden">
            <div class="analysis-tools">
                <button class="tool-btn" onclick="syncMasterPosition('start')">🔄 RESET</button>
                <button id="toggle-draw-btn" class="tool-btn" onclick="toggleDrawMode()">🖱️ MOVE</button>
                <button class="tool-btn" onclick="clearDrawings()" style="color:var(--danger)">🧹 CLEAR</button>
            </div>
        </div>

        <div id="chat-container">
            <div id="master-chat-box"></div>
            <div class="chat-input-wrap">
                <input type="text" id="master-chat-input" placeholder="Say something...">
                <button class="btn" style="width: 60px; padding: 10px; margin:0;" onclick="sendMasterChat()">SEND</button>
            </div>
        </div>

        <button class="btn" style="margin-top:20px; background: transparent; border: 1px solid #334155; color: #64748b;" onclick="exitStudio()">LEAVE CLASS</button>
    </div>

    <div id="jitsi-container" style="display:none;"></div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Prompt user for their name if they are a student
        let tempName = prompt("Enter your name for the class:", "Student_" + Math.floor(Math.random()*1000));
        if(!tempName) tempName = "Student_" + Math.floor(Math.random()*1000);
        
        let myData = { name: tempName, id: Math.random().toString(36).substr(2, 9) }; 
        let masterBoard = null;
        let isCoach = false;
        let isDrawMode = false; // Tracks if coach is currently drawing or moving pieces
        let jitsiAPI = null;
        let micOn = false;
        let activeParticipants = {}; // Stores live user names
        
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        function showPassScreen() { $("#password-overlay").removeClass("hidden"); }

        async function verifyAccess() {
            const pass = $("#access-key").val();
            if (pass === "dotun1234") {
                isCoach = true;
                myData.name = "Coach Dotun";
                $("#master-admin-panel").removeClass("hidden");
                $("#role-text").html('<span class="master-badge">COACH</span>');
                // Note: removed adding 'coach-mode' here, replaced by toggleDrawMode logic
            } else if (pass === "1122") {
                isCoach = false;
                $("#role-text").text("STUDENT VIEW");
            } else { alert("Invalid Key"); return; }

            $("#password-overlay").addClass("hidden");
            $("#section-lobby").addClass("hidden");
            $("#section-masterclass").removeClass("hidden");
            initBoard();
            initAudio();
            initCanvas();
            renderMicUI();
        }

        // --- NEW: TOGGLE DRAW/MOVE MODE ---
        function toggleDrawMode() {
            if (!isCoach) return;
            isDrawMode = !isDrawMode;
            
            if (isDrawMode) {
                $("#section-masterclass").addClass("draw-mode");
                $("#toggle-draw-btn").addClass("draw-active").html("✏️ DRAW");
            } else {
                $("#section-masterclass").removeClass("draw-mode");
                $("#toggle-draw-btn").removeClass("draw-active").html("🖱️ MOVE");
            }
        }

        function initCanvas() {
            const board = document.getElementById('masterBoard');
            canvas.width = board.clientWidth - 8;
            canvas.height = board.clientHeight - 8;
        }

        // --- MOBILE & MOUSE DRAWING LOGIC ---
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handleStart(e) {
            if(!isCoach || !isDrawMode) return;
            drawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function handleMove(e) {
            if(!drawing || !isCoach || !isDrawMode) return;
            const pos = getPos(e);
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#4ade80';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        }

        function handleEnd() {
            if(!drawing || !isCoach || !isDrawMode) return;
            drawing = false;
            db.collection("special_rooms").doc("masterclass_arena").update({ drawing: canvas.toDataURL() });
        }

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        
        // Touch Listeners
        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd);

        function clearDrawings() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            db.collection("special_rooms").doc("masterclass_arena").update({ drawing: null });
        }

        function initBoard() {
            masterBoard = ChessBoard('masterBoard', {
                draggable: isCoach,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDrop: () => {
                    setTimeout(() => {
                        db.collection("special_rooms").doc("masterclass_arena").set({ fen: masterBoard.fen() }, {merge: true});
                    }, 100);
                }
            });

            db.collection("special_rooms").doc("masterclass_arena").onSnapshot(doc => {
                const d = doc.data();
                if(!d) return;
                // Move board if FEN changed and coach didn't just move it
                if(d.fen && masterBoard.fen() !== d.fen) masterBoard.position(d.fen);
                
                // Sync Drawings for students
                if(!isCoach && d.drawing) {
                    const img = new Image();
                    img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0); };
                    img.src = d.drawing;
                } else if (!isCoach && !d.drawing) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            });
        }

        function renderMicUI() {
            $("#mic-control-area").html(`<button id="mic-toggle-btn" class="mic-btn ${isCoach ? '' : 'mic-off'}" onclick="handleMicToggle()">${isCoach ? '🎤' : '🔇'}</button>`);
        }

        function handleMicToggle() {
            if(!jitsiAPI) return;
            jitsiAPI.executeCommand('toggleAudio');
            micOn = !micOn;
            $("#mic-toggle-btn").toggleClass("mic-off", !micOn).text(micOn ? "🎤" : "🔇");
        }

        // --- NEW: PARTICIPANT TRACKING LOGIC ---
        function renderParticipants() {
            const listDiv = document.getElementById('participants-list');
            const keys = Object.keys(activeParticipants);
            
            if(keys.length === 0) {
                listDiv.innerHTML = "<i>Only you are here.</i>";
                return;
            }
            
            let html = "";
            keys.forEach(id => {
                html += `<div class="participant-item">👤 ${activeParticipants[id]}</div>`;
            });
            listDiv.innerHTML = html;
        }

        function initAudio() {
            jitsiAPI = new JitsiMeetExternalAPI("meet.jit.si", {
                roomName: "MindMasters_Arena_2026",
                width: '100%', height: 0,
                parentNode: document.querySelector('#jitsi-container'),
                userInfo: { displayName: myData.name },
                configOverwrite: { startWithAudioMuted: !isCoach, startWithVideoMuted: true },
            });
            micOn = isCoach;

            // Track when you join
            jitsiAPI.addEventListener('videoConferenceJoined', (e) => {
                activeParticipants[e.id] = myData.name + " (You)";
                renderParticipants();
            });

            // Track when others join
            jitsiAPI.addEventListener('participantJoined', (e) => {
                activeParticipants[e.id] = e.displayName || "Unknown Student";
                renderParticipants();
            });

            // Track when others leave
            jitsiAPI.addEventListener('participantLeft', (e) => {
                delete activeParticipants[e.id];
                renderParticipants();
            });
        }

        function syncMasterPosition(fen) {
            if(!isCoach) return;
            if(fen === 'start') masterBoard.start();
            setTimeout(() => { db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() }); }, 100);
        }

        function exitStudio() { if(confirm("Exit?")) { if(jitsiAPI) jitsiAPI.dispose(); location.reload(); } }
    </script>
</body>
</html>
