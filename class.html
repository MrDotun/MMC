<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind Masters | Chess Class</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>

    <style>
        :root { 
            --primary: #2D1B4D; 
            --secondary: #4ade80; 
            --bg: #0f172a; 
            --text: #f8fafc; 
            --card: #1e293b; 
            --danger: #ef4444; 
            --gold: #fbbf24; 
            --glass: rgba(30, 41, 59, 0.7);
        }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .container { 
            width: 100%; 
            max-width: 440px; 
            background: var(--glass); 
            padding: 25px; 
            border-radius: 28px; 
            box-sizing: border-box; 
            border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(15px); 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            margin-bottom: 20px; 
        }
        .hidden { display: none !important; }
        
        #password-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
        .pass-card { background: var(--card); padding: 40px 30px; border-radius: 24px; border: 1px solid var(--gold); text-align: center; width: 320px; box-shadow: 0 0 40px rgba(251, 191, 36, 0.1); }

        .master-arena-card { border: 1px solid rgba(251, 191, 36, 0.2); }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 14px 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        
        .live-badge { background: var(--danger); color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .master-badge { background: var(--gold); color: #000; padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 900; }

        #board-wrapper { position: relative; width: 100%; touch-action: none; margin-bottom: 15px; }
        #masterBoard { border: 6px solid #1e293b; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 100%; }
        #drawingCanvas { position: absolute; top: 6px; left: 6px; z-index: 10; pointer-events: none; border-radius: 8px; }
        
        .draw-mode #drawingCanvas { pointer-events: auto; }
        .draw-active { background: var(--secondary) !important; color: #000 !important; }
        .setup-active { border: 4px solid var(--gold) !important; }

        .analysis-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .tool-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 12px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .pgn-section { margin-top: 15px; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 10px; }
        .pgn-nav { display: flex; gap: 5px; margin-top: 8px; }
        .pgn-nav button { flex: 1; padding: 10px; font-size: 14px; background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; cursor: pointer; }

        .btn { padding: 16px; cursor: pointer; border-radius: 14px; border: none; background: linear-gradient(135deg, #4c1d95 0%, #2D1B4D 100%); color: var(--secondary); font-weight: 800; width: 100%; text-transform: uppercase; transition: 0.3s; font-size: 12px; margin-top: 10px; letter-spacing: 1px; }
        .btn-gold { background: var(--gold); color: #000; }

        #participants-list { background: rgba(0,0,0,0.2); border-radius: 16px; padding: 15px; margin: 10px 0; font-size: 13px; }
        .participant-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        /* NEW STYLES FOR COACH CONTROLS */
        .p-actions { display: flex; gap: 5px; }
        .p-btn { padding: 5px 8px; border-radius: 6px; border: none; font-size: 9px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .move-btn { background: var(--secondary); color: #000; }
        .move-btn.active { background: var(--danger); color: #fff; }
        .mute-btn { background: #475569; color: white; }
        .kick-btn { background: #b91c1c; color: white; }

        #chat-container { margin-top: 15px; background: rgba(2, 6, 23, 0.4); border-radius: 16px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        #master-chat-box { height: 100px; overflow-y: auto; font-size: 12px; margin-bottom: 12px; padding-right: 5px; }
        .chat-msg { margin-bottom: 5px; line-height: 1.4; }
        .chat-name { color: var(--gold); font-weight: bold; margin-right: 5px; }
        input, textarea { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; width: 100%; box-sizing: border-box; font-family: inherit;}
        .chat-input-wrap { display: flex; gap: 8px; }
        .chat-input-wrap input { margin-bottom: 0; }
    </style>
</head>
<body oncontextmenu="return false;">

    <h1 id="main-title" style="color: var(--secondary); margin: 20px 0; font-weight: 900; letter-spacing: 4px; text-align: center; text-shadow: 0 4px 10px rgba(0,0,0,0.3);">MIND MASTERS</h1>

    <div id="password-overlay" class="hidden">
        <div class="pass-card">
            <h2 style="color: var(--gold); margin-top: 0; letter-spacing: 1px;">Security Gate</h2>
            <input type="password" id="access-key" placeholder="••••" style="text-align: center; font-size: 24px; letter-spacing: 8px;">
            <button class="btn btn-gold" onclick="verifyAccess()">AUTHORIZE</button>
        </div>
    </div>

    <div id="section-lobby" class="container">
        <h3 style="text-align: center; color: var(--gold); letter-spacing: 2px;">VIRTUAL CAMPUS</h3>
        <p style="text-align: center; font-size: 13px; opacity: 0.8; margin-bottom: 25px;">Ready to master the board?</p>
        <input type="text" id="user-display-name" placeholder="Enter your name...">
        <button class="btn btn-gold" onclick="showPassScreen()">🚀 JOIN SESSION</button>
    </div>

    <div id="section-masterclass" class="container master-arena-card hidden">
        <div class="status-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="live-badge">LIVE</div>
                <span id="role-text">STUDENT</span>
            </div>
            <div id="mic-control-area"></div>
        </div>

        <div id="board-wrapper">
            <div id="masterBoard"></div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div id="master-admin-panel" class="hidden">
            <div class="analysis-tools">
                <button class="tool-btn" onclick="syncMasterPosition('start')">🔄 RESET POS</button>
                <button id="setup-mode-btn" class="tool-btn" onclick="toggleSetupMode()">🧩 SETUP MODE</button>
                <button id="toggle-draw-btn" class="tool-btn" onclick="toggleDrawMode()">✏️ PIECE MODE</button>
                <button class="tool-btn" onclick="clearDrawings()" style="color:var(--gold)">🧹 ERASE ALL</button>
                <button class="tool-btn" onclick="emptyBoard()" style="color:var(--danger)">🕳️ EMPTY BOARD</button>
            </div>

            <div class="pgn-section">
                <p style="font-size: 10px; color: var(--secondary); margin-bottom: 5px; font-weight: bold;">PGN TEACHING TOOL</p>
                <textarea id="pgn-input" placeholder="Paste PGN here..." style="height: 60px; font-size: 11px;"></textarea>
                
                <div style="display: flex; gap: 5px;">
                    <button class="tool-btn" style="flex:1" onclick="loadPgnData()">📥 LOAD TEXT</button>
                    <button class="tool-btn" style="flex:1" onclick="document.getElementById('pgn-file').click()">📁 UPLOAD PGN</button>
                </div>
                <input type="file" id="pgn-file" accept=".pgn" style="display:none" onchange="handleFileUpload(event)">

                <div class="pgn-nav">
                    <button onclick="pgnMove('start')">⏮</button>
                    <button onclick="pgnMove('prev')">◀</button>
                    <button onclick="pgnMove('next')">▶</button>
                    <button onclick="pgnMove('end')">⏭</button>
                </div>
            </div>
        </div>

        <div id="participants-panel">
            <p style="font-size: 11px; font-weight: 800; color: var(--secondary); margin-bottom: 10px; letter-spacing: 1px;">ACTIVE MINDS</p>
            <div id="participants-list"></div>
        </div>

        <div id="chat-container">
            <div id="master-chat-box"></div>
            <div class="chat-input-wrap">
                <input type="text" id="master-chat-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMasterChat()">
                <button class="btn" style="width: 80px; padding: 12px; margin:0;" onclick="sendMasterChat()">SEND</button>
            </div>
        </div>

        <button class="btn" style="margin-top:20px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8;" onclick="exitStudio()">EXIT CLASS</button>
    </div>

    <div id="jitsi-container" style="display:none;"></div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myData = { name: "", id: "" }; 
        let masterBoard = null;
        let isCoach = false;
        let isDrawMode = false;
        let isSetupMode = false;
        let authorizedMovers = []; 
        let jitsiAPI = null;
        let micOn = false;
        let activeParticipants = {}; 
        
        let teachingGame = new Chess();
        let moveHistory = [];
        let currentMoveIndex = -1;

        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        function showPassScreen() { 
            const name = $("#user-display-name").val();
            if(!name) { alert("Please enter your name"); return; }
            myData.name = name;
            $("#password-overlay").removeClass("hidden"); 
        }

        async function verifyAccess() {
            const pass = $("#access-key").val();
            if (pass === "dotun1234") {
                isCoach = true;
                myData.name = "Coach Dotun";
                $("#master-admin-panel").removeClass("hidden");
                $("#role-text").html('<span class="master-badge">COACH</span>');
            } else if (pass === "1122") {
                isCoach = false;
                $("#role-text").text("STUDENT VIEW");
            } else { alert("Invalid Key"); return; }

            $("#password-overlay").addClass("hidden");
            $("#section-lobby").addClass("hidden");
            $("#section-masterclass").removeClass("hidden");
            initBoard();
            initAudio();
            initCanvas();
            renderMicUI();
            initChat(); 
        }

        function initChat() {
            db.collection("special_rooms").doc("masterclass_arena")
              .collection("messages").orderBy("timestamp", "asc")
              .onSnapshot(snapshot => {
                  const chatBox = $("#master-chat-box");
                  chatBox.empty();
                  snapshot.forEach(doc => {
                      const msg = doc.data();
                      chatBox.append(`<div class="chat-msg"><span class="chat-name">${msg.sender}:</span><span>${msg.text}</span></div>`);
                  });
                  chatBox.scrollTop(chatBox[0].scrollHeight);
              });
        }

        function sendMasterChat() {
            const input = $("#master-chat-input");
            const text = input.val().trim();
            if (!text) return;

            db.collection("special_rooms").doc("masterclass_arena")
              .collection("messages").add({
                  sender: myData.name,
                  text: text,
                  timestamp: firebase.firestore.FieldValue.serverTimestamp()
              });
            input.val("");
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                $("#pgn-input").val(e.target.result);
                loadPgnData(); 
            };
            reader.readAsText(file);
        }

        function toggleDrawMode() {
            if (!isCoach) return;
            isDrawMode = !isDrawMode;
            if (isDrawMode) {
                $("#section-masterclass").addClass("draw-mode");
                $("#toggle-draw-btn").addClass("draw-active").html("✏️ DRAW MODE");
            } else {
                $("#section-masterclass").removeClass("draw-mode");
                $("#toggle-draw-btn").removeClass("draw-active").html("🖱️ PIECE MODE");
            }
        }

        function toggleSetupMode() {
            if (!isCoach) return;
            isSetupMode = !isSetupMode;
            const currentFen = masterBoard.fen();
            initBoard(currentFen); 
            if(isSetupMode) {
                $("#setup-mode-btn").addClass("draw-active").text("✅ SAVE POS");
                $("#masterBoard").addClass("setup-active");
            } else {
                $("#setup-mode-btn").removeClass("draw-active").text("🧩 SETUP MODE");
                $("#masterBoard").removeClass("setup-active");
            }
        }

        function initCanvas() {
            const board = document.getElementById('masterBoard');
            canvas.width = board.clientWidth - 12;
            canvas.height = board.clientHeight - 12;
        }

        function clearDrawings() {
            if(!isCoach) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            db.collection("special_rooms").doc("masterclass_arena").update({ drawing: null });
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handleStart(e) {
            if(!isCoach || !isDrawMode) return;
            drawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function handleMove(e) {
            if(!drawing || !isCoach || !isDrawMode) return;
            const pos = getPos(e);
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#4ade80';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        }

        function handleEnd() {
            if(!drawing || !isCoach || !isDrawMode) return;
            drawing = false;
            db.collection("special_rooms").doc("masterclass_arena").update({ drawing: canvas.toDataURL() });
        }

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd);

        function loadPgnData() {
            const pgn = $("#pgn-input").val();
            if(!pgn) return;
            if (teachingGame.load_pgn(pgn)) {
                moveHistory = teachingGame.history();
                teachingGame.reset();
                currentMoveIndex = -1;
                syncMasterPosition(teachingGame.fen());
            } else {
                alert("Invalid PGN format.");
            }
        }

        function pgnMove(dir) {
            if(!isCoach) return;
            if(dir === 'start') currentMoveIndex = -1;
            else if(dir === 'end') currentMoveIndex = moveHistory.length - 1;
            else if(dir === 'next' && currentMoveIndex < moveHistory.length - 1) currentMoveIndex++;
            else if(dir === 'prev' && currentMoveIndex >= 0) currentMoveIndex--;

            teachingGame.reset();
            for(let i=0; i <= currentMoveIndex; i++) {
                teachingGame.move(moveHistory[i]);
            }
            syncMasterPosition(teachingGame.fen());
        }

        function emptyBoard() {
            if(!isCoach) return;
            masterBoard.clear();
            setTimeout(() => { db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() }); }, 100);
        }

        function initBoard(pos = 'start') {
            const config = {
                draggable: true,
                position: pos,
                sparePieces: isSetupMode,
                dropOffBoard: isSetupMode ? 'trash' : 'snapback',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDragStart: (source, piece, position, orientation) => {
                    // Coach can always move. Authorized students can move.
                    if (isCoach) return true;
                    if (authorizedMovers.includes(myData.id)) return true;
                    return false;
                },
                onDrop: (source, target) => {
                    setTimeout(() => {
                        db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() });
                    }, 100);
                }
            };
            
            if (masterBoard) masterBoard.destroy();
            masterBoard = ChessBoard('masterBoard', config);

            if (!window.firebaseInitialized) {
                db.collection("special_rooms").doc("masterclass_arena").onSnapshot(doc => {
                    const d = doc.data();
                    if(!d) return;
                    if(d.fen && masterBoard.fen() !== d.fen) masterBoard.position(d.fen);
                    
                    // Sync authorized movers from DB
                    authorizedMovers = d.authorizedMovers || [];
                    renderParticipants();

                    if(!isCoach && d.drawing) {
                        const img = new Image();
                        img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0); };
                        img.src = d.drawing;
                    } else if (!isCoach && !d.drawing) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                });
                window.firebaseInitialized = true;
            }
        }

        function renderMicUI() {
            $("#mic-control-area").html(`<button id="mic-toggle-btn" class="mic-btn ${isCoach ? '' : 'mic-off'}" style="background:none; border:none; cursor:pointer; font-size:20px;" onclick="handleMicToggle()">${isCoach ? '🎤' : '🔇'}</button>`);
        }

        function handleMicToggle() {
            if(!jitsiAPI) return;
            jitsiAPI.executeCommand('toggleAudio');
            micOn = !micOn;
            $("#mic-toggle-btn").toggleClass("mic-off", !micOn).text(micOn ? "🎤" : "🔇");
        }

        function renderParticipants() {
            const listDiv = document.getElementById('participants-list');
            const keys = Object.keys(activeParticipants);
            if(keys.length === 0) {
                listDiv.innerHTML = "<i style='opacity:0.5'>Classroom empty...</i>";
                return;
            }
            let html = "";
            keys.forEach(id => {
                const hasMoveAccess = authorizedMovers.includes(id);
                html += `<div class="participant-item">
                    <span>👤 ${activeParticipants[id]} ${hasMoveAccess ? '⚡' : ''}</span>
                    ${isCoach && !activeParticipants[id].includes("Coach") ? `
                        <div class="p-actions">
                            <button class="p-btn move-btn ${hasMoveAccess ? 'active' : ''}" onclick="toggleMoveAccess('${id}')">
                                ${hasMoveAccess ? 'Disable Move' : 'Enable Move'}
                            </button>
                            <button class="p-btn mute-btn" onclick="muteUser('${id}')">Mute</button>
                            <button class="p-btn kick-btn" onclick="kickUser('${id}')">Kick</button>
                        </div>
                    ` : ''}
                </div>`;
            });
            listDiv.innerHTML = html;
        }

        function toggleMoveAccess(id) {
            let newMovers = [...authorizedMovers];
            if (newMovers.includes(id)) {
                newMovers = newMovers.filter(item => item !== id);
            } else {
                newMovers.push(id);
            }
            db.collection("special_rooms").doc("masterclass_arena").update({ authorizedMovers: newMovers });
        }

        function muteUser(id) { jitsiAPI.executeCommand('muteParticipant', id); }
        function kickUser(id) { if(confirm("Remove this student?")) jitsiAPI.executeCommand('kickParticipant', id); }

        function initAudio() {
            jitsiAPI = new JitsiMeetExternalAPI("meet.jit.si", {
                roomName: "MindMasters_Chess_2026",
                width: '100%', height: 0,
                parentNode: document.querySelector('#jitsi-container'),
                userInfo: { displayName: myData.name },
                configOverwrite: { startWithAudioMuted: !isCoach, startWithVideoMuted: true },
            });
            micOn = isCoach;

            jitsiAPI.addEventListener('videoConferenceJoined', (e) => {
                myData.id = e.id; 
                activeParticipants[e.id] = myData.name + " (You)";
                renderParticipants();
            });
            jitsiAPI.addEventListener('participantJoined', (e) => {
                activeParticipants[e.id] = e.displayName || "Guest";
                renderParticipants();
            });
            jitsiAPI.addEventListener('participantLeft', (e) => {
                delete activeParticipants[e.id];
                renderParticipants();
            });
        }

        function syncMasterPosition(fen) {
            if(!isCoach) return;
            if(fen === 'start') masterBoard.start();
            else masterBoard.position(fen);
            setTimeout(() => { db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() }); }, 100);
        }

        function exitStudio() { if(confirm("Leave the room?")) { if(jitsiAPI) jitsiAPI.dispose(); location.reload(); } }
    </script>
</body>
</html>
