<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind Masters | Chess Class</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>

    <style>
        :root { 
            --primary: #2D1B4D; --secondary: #4ade80; --bg: #0f172a; 
            --text: #f8fafc; --card: #1e293b; --danger: #ef4444; 
            --gold: #fbbf24; --glass: rgba(30, 41, 59, 0.7);
        }
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); color: var(--text); margin: 0; padding: 15px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 440px; background: var(--glass); padding: 25px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(15px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); margin-bottom: 20px; box-sizing: border-box; }
        .hidden { display: none !important; }
        #jitsi-container { position: fixed; bottom: 0; right: 0; width: 1px; height: 1px; opacity: 0; }
        #password-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
        .pass-card { background: var(--card); padding: 40px 30px; border-radius: 24px; border: 1px solid var(--gold); text-align: center; width: 320px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 14px 20px; border-radius: 16px; margin-bottom: 20px; }
        .live-badge { background: var(--danger); color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        .master-badge { background: var(--gold); color: #000; padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 900; }
        #masterBoard { border: 6px solid #1e293b; border-radius: 12px; width: 100%; }
        .analysis-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .tool-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 12px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .btn { padding: 16px; cursor: pointer; border-radius: 14px; border: none; background: linear-gradient(135deg, #4c1d95 0%, #2D1B4D 100%); color: var(--secondary); font-weight: 800; width: 100%; margin-top: 10px; }
        .btn-gold { background: var(--gold); color: #000; }
        #master-chat-box { height: 100px; overflow-y: auto; font-size: 12px; margin-bottom: 12px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; }
        input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary); letter-spacing: 4px;">MIND MASTERS</h1>

    <div id="password-overlay" class="hidden">
        <div class="pass-card">
            <h2 style="color: var(--gold);">Security Gate</h2>
            <input type="password" id="access-key" placeholder="••••" style="text-align: center; font-size: 24px;">
            <button class="btn btn-gold" onclick="verifyAccess()">AUTHORIZE</button>
        </div>
    </div>

    <div id="section-lobby" class="container">
        <input type="text" id="user-display-name" placeholder="Enter your name...">
        <button class="btn btn-gold" onclick="showPassScreen()">🚀 JOIN SESSION</button>
    </div>

    <div id="section-masterclass" class="container hidden">
        <div class="status-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="live-badge">LIVE</div>
                <span id="role-text">STUDENT</span>
            </div>
            <div id="mic-control-area"></div>
        </div>

        <div id="masterBoard" style="margin-bottom: 15px;"></div>

        <div id="master-admin-panel" class="hidden">
            <div class="analysis-tools">
                <button class="tool-btn" onclick="syncMasterPosition('start')">🔄 RESET POS</button>
                <button id="global-move-btn" class="tool-btn" onclick="toggleGlobalMove()">🔓 STUDENT MOVE: OFF</button>
                <button class="tool-btn" onclick="syncMasterPosition('clear')" style="color:var(--danger)">🕳️ EMPTY BOARD</button>
                <button class="tool-btn" onclick="alert('Flip logic connected')">🔄 FLIP BOARD</button>
            </div>
        </div>

        <div id="participants-panel">
            <p style="font-size: 11px; color: var(--secondary);">ACTIVE MINDS</p>
            <div id="participants-list" style="font-size: 12px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px;"></div>
        </div>

        <div id="chat-container" style="margin-top: 15px;">
            <div id="master-chat-box"></div>
            <input type="text" id="master-chat-input" placeholder="Type..." onkeypress="if(event.key==='Enter') sendMasterChat()">
        </div>
    </div>

    <div id="jitsi-container"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
            authDomain: "assignments-de95a.firebaseapp.com",
            projectId: "assignments-de95a",
            storageBucket: "assignments-de95a.firebasestorage.app",
            messagingSenderId: "1088073398299",
            appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const roomRef = db.collection("special_rooms").doc("masterclass_arena");

        let myData = { name: "", id: "" }; 
        let masterBoard = null;
        let isCoach = false;
        let jitsiAPI = null;
        let micOn = false;
        let globalMoveEnabled = false;

        function showPassScreen() {
            if(!$("#user-display-name").val()) return alert("Name required");
            myData.name = $("#user-display-name").val();
            $("#password-overlay").removeClass("hidden");
        }

        async function verifyAccess() {
            const pass = $("#access-key").val();
            
            // Audio Wake-up for Mobile Browsers (Fixes Audio)
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) { const resumeCtx = new AudioContext(); resumeCtx.resume(); }

            if (pass === "dotun1234") {
                isCoach = true;
                myData.name = "Coach " + myData.name;
                $("#master-admin-panel").removeClass("hidden");
                $("#role-text").html('<span class="master-badge">COACH</span>');
            } else if (pass === "1122") {
                isCoach = false;
            } else { return alert("Wrong key"); }

            $("#password-overlay, #section-lobby").addClass("hidden");
            $("#section-masterclass").removeClass("hidden");
            
            initBoard();
            initAudio();
            initChat();
        }

        function initBoard() {
            const config = {
                draggable: true,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDragStart: (source, piece) => {
                    return (isCoach || globalMoveEnabled);
                },
                onDrop: (source, target) => {
                    setTimeout(() => {
                        roomRef.update({ fen: masterBoard.fen() });
                    }, 100);
                }
            };
            masterBoard = ChessBoard('masterBoard', config);

            roomRef.onSnapshot(doc => {
                const data = doc.data();
                if (data) {
                    if (data.fen && data.fen !== masterBoard.fen()) masterBoard.position(data.fen);
                    globalMoveEnabled = data.studentMoveEnabled || false;
                    $("#global-move-btn").text("🔓 STUDENT MOVE: " + (globalMoveEnabled ? "ON" : "OFF"));
                }
            });
        }

        // RESET and EMPTY Functions
        function syncMasterPosition(type) {
            const pos = (type === 'start') ? 'start' : '8/8/8/8/8/8/8/8 w - - 0 1';
            masterBoard.position(pos);
            roomRef.update({ fen: pos });
        }

        function toggleGlobalMove() {
            globalMoveEnabled = !globalMoveEnabled;
            roomRef.update({ studentMoveEnabled: globalMoveEnabled });
        }

        function initAudio() {
            const options = {
                roomName: "MindMasters_2026_UniqueRoom",
                parentNode: document.querySelector('#jitsi-container'),
                userInfo: { displayName: myData.name },
                configOverwrite: { startWithAudioMuted: !isCoach, prejoinPageEnabled: false }
            };
            jitsiAPI = new JitsiMeetExternalAPI("meet.jit.si", options);
            jitsiAPI.addEventListeners({
                videoConferenceJoined: (e) => { 
                    myData.id = e.id; 
                    renderMicUI();
                    // Inject audio permissions
                    const iframe = jitsiAPI.getIFrame();
                    if(iframe) iframe.setAttribute("allow", "microphone; autoplay;");
                },
                audioMuteStatusChanged: (e) => { micOn = !e.muted; renderMicUI(); }
            });
        }

        function renderMicUI() {
            const color = micOn ? 'var(--secondary)' : 'var(--danger)';
            $("#mic-control-area").html(`<button onclick="jitsiAPI.executeCommand('toggleAudio')" style="background:none; border:1px solid ${color}; color:${color}; padding:5px 10px; border-radius:8px; cursor:pointer;">🎤 ${micOn ? 'ON' : 'MUTED'}</button>`);
        }

        function initChat() {
            roomRef.collection("messages").orderBy("timestamp", "asc").onSnapshot(snap => {
                const box = $("#master-chat-box");
                box.empty();
                snap.forEach(doc => {
                    const m = doc.data();
                    box.append(`<div><b>${m.sender}:</b> ${m.text}</div>`);
                });
                box.scrollTop(box[0].scrollHeight);
            });
        }

        function sendMasterChat() {
            const text = $("#master-chat-input").val();
            if(!text) return;
            roomRef.collection("messages").add({
                sender: myData.name, text: text, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            $("#master-chat-input").val("");
        }

        function exitStudio() { location.reload(); }
    </script>
</body>
</html>
