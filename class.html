<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind Masters | Chess Class</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>

    <style>
        :root { 
            --primary: #2D1B4D; 
            --secondary: #4ade80; 
            --bg: #0f172a; 
            --text: #f8fafc; 
            --card: #1e293b; 
            --danger: #ef4444; 
            --gold: #fbbf24; 
            --glass: rgba(30, 41, 59, 0.7);
        }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .container { 
            width: 100%; 
            max-width: 440px; 
            background: var(--glass); 
            padding: 25px; 
            border-radius: 28px; 
            box-sizing: border-box; 
            border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(15px); 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            margin-bottom: 20px; 
        }
        .hidden { display: none !important; }
        
        #jitsi-container { position: fixed; top: 0; left: 0; width: 1px; height: 1px; z-index: -1; overflow: hidden; pointer-events: none; }

        #password-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
        .pass-card { background: var(--card); padding: 40px 30px; border-radius: 24px; border: 1px solid var(--gold); text-align: center; width: 320px; box-shadow: 0 0 40px rgba(251, 191, 36, 0.1); }

        .master-arena-card { border: 1px solid rgba(251, 191, 36, 0.2); }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 14px 20px; border-radius: 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
        
        .live-badge { background: var(--danger); color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .master-badge { background: var(--gold); color: #000; padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 900; }

        .top-vn-bar { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.4); padding: 10px 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px; transition: background 0.5s; }
        .top-vn-bar.new-note { background: rgba(251, 191, 36, 0.3); }
        .latest-audio-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }

        #board-wrapper { position: relative; width: 100%; touch-action: none; margin-bottom: 15px; }
        #masterBoard { border: 6px solid #1e293b; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 100%; }
        #drawingCanvas { position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none; border-radius: 8px; }
        
        /* Piece Selector Styling */
        #piece-selector { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--gold); }
        .spare-piece-item { width: 35px; height: 35px; cursor: pointer; transition: transform 0.2s; }
        .spare-piece-item:hover { transform: scale(1.2); }

        .analysis-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .tool-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 12px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }

        .pgn-section { margin-top: 15px; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 10px; }
        .pgn-nav { display: flex; gap: 5px; margin-top: 8px; }
        .pgn-nav button { flex: 1; padding: 10px; font-size: 14px; background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; cursor: pointer; }

        .btn { padding: 16px; cursor: pointer; border-radius: 14px; border: none; background: linear-gradient(135deg, #4c1d95 0%, #2D1B4D 100%); color: var(--secondary); font-weight: 800; width: 100%; text-transform: uppercase; transition: 0.3s; font-size: 12px; margin-top: 10px; letter-spacing: 1px; }
        .btn-gold { background: var(--gold); color: #000; }

        #participants-list { background: rgba(0,0,0,0.2); border-radius: 16px; padding: 15px; margin: 10px 0; font-size: 13px; }
        .participant-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

        #chat-container { margin-top: 15px; background: rgba(2, 6, 23, 0.4); border-radius: 16px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        #master-chat-box { height: 150px; overflow-y: auto; font-size: 12px; margin-bottom: 12px; padding-right: 5px; }
        .chat-msg { margin-bottom: 12px; line-height: 1.4; display: flex; flex-direction: column; position: relative; }
        .chat-name { color: var(--gold); font-weight: bold; margin-bottom: 4px; }
        
        input, textarea { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; width: 100%; box-sizing: border-box; font-family: inherit;}
        .chat-input-wrap { display: flex; gap: 8px; align-items: center; }
        .chat-input-wrap input { margin-bottom: 0; }

        .vn-btn { background: #334155; color: white; border: none; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; position: relative;}
        .vn-btn.recording { background: var(--danger); animation: pulse 1s infinite; }
        .rec-label { position: absolute; bottom: -18px; font-size: 8px; color: var(--danger); font-weight: 900; white-space: nowrap; }
        
        audio { height: 35px; width: 100%; margin-top: 5px; filter: hue-rotate(90deg) brightness(1.5); }
        .latest-audio-wrap audio { margin-top: 0; height: 28px; }
        .del-msg { background: none; border: none; color: var(--danger); font-size: 14px; cursor: pointer; position: absolute; right: 0; top: 0; padding: 5px;}
        
        .mode-selector { display: flex; gap: 10px; margin-bottom: 10px; }
        .mode-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; font-size: 10px; cursor: pointer; }
        .mode-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(251, 191, 36, 0.1); }
    </style>
</head>
<body oncontextmenu="return false;">

    <h1 style="color: var(--secondary); margin: 20px 0; font-weight: 900; letter-spacing: 4px; text-align: center;">MIND MASTERS</h1>

    <div id="password-overlay" class="hidden">
        <div class="pass-card">
            <h2 style="color: var(--gold);">Security Gate</h2>
            <input type="password" id="access-key" placeholder="••••" style="text-align: center; font-size: 24px; letter-spacing: 8px;">
            <button class="btn btn-gold" onclick="verifyAccess()">AUTHORIZE</button>
        </div>
    </div>

    <div id="section-lobby" class="container">
        <h3 style="text-align: center; color: var(--gold);">VIRTUAL CAMPUS</h3>
        <input type="text" id="user-display-name" placeholder="Enter your name...">
        <button class="btn btn-gold" onclick="showPassScreen()">🚀 JOIN SESSION</button>
    </div>

    <div id="section-masterclass" class="container master-arena-card hidden">
        <div class="status-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="live-badge">LIVE</div>
                <span id="role-text">STUDENT</span>
            </div>
            <div id="mic-control-area"></div>
        </div>

        <div id="student-mode-controls" class="mode-selector hidden">
            <button id="btn-play-mode" class="mode-btn active" onclick="setBoardMode('play')">🎮 PLAY MODE</button>
            <button id="btn-analysis-mode" class="mode-btn" onclick="setBoardMode('analysis')">🧪 ANALYSIS</button>
            <button id="btn-setup-mode-student" class="mode-btn" onclick="toggleSetupMode()">🧩 SETUP</button>
        </div>

        <div class="top-vn-bar" id="notif-bar">
            <div style="position:relative; display:flex; flex-direction:column; align-items:center; gap:5px;">
                <button id="top-vn-btn" class="vn-btn" onclick="toggleVN()">🎤</button>
                <button id="cancel-vn-btn" class="hidden" onclick="cancelRecording()" style="background:var(--danger); border:none; color:white; font-size:8px; padding:2px 5px; border-radius:4px; cursor:pointer;">CANCEL</button>
                <span id="rec-indicator" class="rec-label hidden">RECORDING...</span>
            </div>
            <div id="latest-audio-container" class="latest-audio-wrap">
                <span style="font-size: 11px; color: #94a3b8; font-style: italic;">No voice notes yet...</span>
            </div>
        </div>

        <div id="piece-selector" class="hidden">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wP.png" class="spare-piece-item" onclick="selectPiece('wP')">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wN.png" class="spare-piece-item" onclick="selectPiece('wN')">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wB.png" class="spare-piece-item" onclick="selectPiece('wB')">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wR.png" class="spare-piece-item" onclick="selectPiece('wR')">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wQ.png" class="spare-piece-item" onclick="selectPiece('wQ')">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wK.png" class="spare-piece-item" onclick="selectPiece('wK')">
            <div style="width: 100%; height: 2px; background: rgba(255,255,255,0.1); margin: 5px 0;"></div>
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/bP.png" class="spare-piece-item" onclick="selectPiece('bP')">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/bN.png" class="spare-piece-item" onclick="selectPiece('bN')">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/bB.png" class="spare-piece-item" onclick="selectPiece('bB')">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/bR.png" class="spare-piece-item" onclick="selectPiece('bR')">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/bQ.png" class="spare-piece-item" onclick="selectPiece('bQ')">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/bK.png" class="spare-piece-item" onclick="selectPiece('bK')">
            <button class="tool-btn" style="width: 40px; padding: 5px; background: var(--danger);" onclick="emptyBoard()">🗑️</button>
        </div>

        <div id="board-wrapper">
            <div id="masterBoard"></div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div id="master-admin-panel" class="hidden">
            <div class="analysis-tools">
                <button class="tool-btn" onclick="syncMasterPosition('start')">🔄 RESET POS</button>
                <button id="global-move-btn" class="tool-btn" onclick="toggleGlobalMove()">🔓 STUDENT MOVE</button>
                <button id="setup-mode-btn-coach" class="tool-btn" onclick="toggleSetupMode()">🧩 SETUP MODE</button>
                <button id="toggle-draw-btn" class="tool-btn" onclick="toggleDrawMode()">✏️ DRAW MODE</button>
                <button class="tool-btn" onclick="clearDrawings()" style="color:var(--gold)">🧹 ERASE ALL</button>
                <button class="tool-btn" onclick="emptyBoard()" style="color:var(--danger)">🕳️ EMPTY BOARD</button>
            </div>

            <div class="pgn-section">
                <p style="font-size: 10px; color: var(--secondary); margin-bottom: 5px; font-weight: bold;">PGN TEACHING TOOL</p>
                <textarea id="pgn-input" placeholder="Paste PGN here..."></textarea>
                <div style="display: flex; gap: 5px;">
                    <button class="tool-btn" style="flex:1" onclick="loadPgnData()">📥 LOAD TEXT</button>
                    <button class="tool-btn" style="flex:1" onclick="document.getElementById('pgn-file').click()">📁 UPLOAD PGN</button>
                </div>
                <input type="file" id="pgn-file" accept=".pgn" style="display:none" onchange="handleFileUpload(event)">

                <div class="pgn-nav">
                    <button onclick="pgnMove('start')">⏮</button>
                    <button onclick="pgnMove('prev')">◀</button>
                    <button onclick="pgnMove('next')">▶</button>
                    <button onclick="pgnMove('end')">⏭</button>
                </div>
            </div>
        </div>

        <div id="participants-panel">
            <p style="font-size: 11px; font-weight: 800; color: var(--secondary); margin-bottom: 10px; letter-spacing: 1px;">ACTIVE MINDS</p>
            <div id="participants-list"></div>
        </div>

        <div id="chat-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <p style="font-size: 11px; font-weight: 800; color: var(--secondary); margin: 0; letter-spacing: 1px;">SESSION CHAT</p>
                <button id="admin-clear-btn" class="hidden" onclick="clearFullChat()" style="color: var(--danger); background:none; border:none; font-size:9px; cursor:pointer;">WIPE</button>
            </div>
            <div id="master-chat-box"></div>
            <div class="chat-input-wrap">
                <input type="text" id="master-chat-input" placeholder="Type..." onkeypress="if(event.key==='Enter') sendMasterChat()">
                <button class="btn" style="width: 60px; padding: 12px; margin:0;" onclick="sendMasterChat()">➤</button>
            </div>
        </div>

        <button class="btn" style="margin-top:20px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8;" onclick="location.reload()">EXIT CLASS</button>
    </div>

    <div id="jitsi-container"></div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myData = { name: "", id: "" }; 
        let masterBoard = null;
        let game = new Chess();
        let isCoach = false;
        let jitsiAPI = null;
        let micOn = false;
        let activeParticipants = {}; 
        let studentBoardMode = 'play'; 
        let isDrawing = false;
        let drawModeActive = false;
        let setupModeActive = false;

        // Voice Note Engine Variables
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let wasCancelled = false;

        // Drawing Setup
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');

        function showPassScreen() { 
            const name = $("#user-display-name").val();
            if(!name) return;
            myData.name = name;
            $("#password-overlay").removeClass("hidden"); 
        }

        async function verifyAccess() {
            const pass = $("#access-key").val();
            if (pass === "dotun1234") {
                isCoach = true;
                myData.name = "Coach Dotun";
                $("#master-admin-panel, #admin-clear-btn").removeClass("hidden");
                $("#role-text").html('<span class="master-badge">COACH</span>');
            } else if (pass === "1122") {
                isCoach = false;
                $("#role-text").text("STUDENT");
                $("#student-mode-controls").removeClass("hidden");
            } else { alert("Invalid Key"); return; }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    if(wasCancelled) {
                        audioChunks = [];
                        wasCancelled = false;
                        return;
                    }
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => { sendVN(reader.result); audioChunks = []; };
                };
            } catch (err) { console.warn("Microphone access denied."); }

            $("#password-overlay").addClass("hidden");
            $("#section-lobby").addClass("hidden");
            $("#section-masterclass").removeClass("hidden");
            
            initBoard();
            initDrawingSync();
            initAudio(); 
            initChat(); 
            renderMicUI();
        }

        function toggleVN() {
            if (!mediaRecorder) { alert("Microphone not detected."); return; }
            if (!isRecording) {
                audioChunks = [];
                wasCancelled = false;
                mediaRecorder.start();
                isRecording = true;
                $("#top-vn-btn").addClass("recording").text("🛑");
                $("#rec-indicator").removeClass("hidden");
                $("#cancel-vn-btn").removeClass("hidden");
            } else {
                mediaRecorder.stop();
                isRecording = false;
                $("#top-vn-btn").removeClass("recording").text("🎤");
                $("#rec-indicator").addClass("hidden");
                $("#cancel-vn-btn").addClass("hidden");
            }
        }

        function cancelRecording() {
            if(isRecording) {
                wasCancelled = true;
                mediaRecorder.stop();
                isRecording = false;
                $("#top-vn-btn").removeClass("recording").text("🎤");
                $("#rec-indicator").addClass("hidden");
                $("#cancel-vn-btn").addClass("hidden");
                audioChunks = [];
            }
        }

        function sendVN(base64) {
            db.collection("special_rooms").doc("masterclass_arena").collection("messages").add({
                sender: myData.name, 
                audio: base64, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function deleteMsg(id) {
            if(confirm("Delete message?")) {
                db.collection("special_rooms").doc("masterclass_arena").collection("messages").doc(id).delete();
            }
        }

        function initChat() {
            db.collection("special_rooms").doc("masterclass_arena").collection("messages").orderBy("timestamp", "asc")
              .onSnapshot(snap => {
                  const box = $("#master-chat-box");
                  const bar = $("#notif-bar");
                  box.empty();
                  let latestAudioHTML = `<span style="font-size: 11px; color: #94a3b8; font-style: italic;">No voice notes yet...</span>`;
                  let hasNew = false;

                  snap.forEach(doc => {
                      const msg = doc.data();
                      const id = doc.id;
                      let content = msg.audio ? `<audio controls src="${msg.audio}"></audio>` : `<span>${msg.text}</span>`;
                      box.append(`<div class="chat-msg"><span class="chat-name">${msg.sender}</span>${content}<button class="del-msg" onclick="deleteMsg('${id}')">🗑️</button></div>`);
                      
                      if(msg.audio) {
                          hasNew = true;
                          latestAudioHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;"><span style="font-size:10px; color:var(--gold); font-weight:bold;">▶ ${msg.sender}'s Note</span></div><audio controls src="${msg.audio}"></audio>`;
                      }
                  });
                  
                  if(hasNew) {
                      bar.addClass("new-note");
                      setTimeout(() => bar.removeClass("new-note"), 2000);
                  }
                  $("#latest-audio-container").html(latestAudioHTML);
                  box.scrollTop(box[0].scrollHeight);
              });
        }

        function sendMasterChat() {
            const text = $("#master-chat-input").val().trim();
            if(!text) return;
            db.collection("special_rooms").doc("masterclass_arena").collection("messages").add({
                sender: myData.name, 
                text: text, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            $("#master-chat-input").val("");
        }

        // Chess & Drawing Logic
        function initBoard() {
            const config = {
                draggable: true,
                dropOffBoard: 'trash',
                sparePieces: false,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDrop: (source, target) => {
                    if (!setupModeActive && studentBoardMode === 'play') {
                        let move = game.move({ from: source, to: target, promotion: 'q' });
                        if (move === null) return 'snapback';
                    }
                    setTimeout(() => {
                        db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() });
                    }, 100);
                }
            };
            masterBoard = ChessBoard('masterBoard', config);
            resizeCanvas();
            db.collection("special_rooms").doc("masterclass_arena").onSnapshot(doc => {
                const data = doc.data();
                if(data?.fen && masterBoard.fen() !== data.fen) { 
                    masterBoard.position(data.fen); 
                    game.load(data.fen);
                }
            });
        }

        function setBoardMode(mode) {
            studentBoardMode = mode;
            $(".mode-btn").removeClass("active");
            if(mode === 'play') {
                $("#btn-play-mode").addClass("active");
                masterBoard.start();
                game.reset();
                db.collection("special_rooms").doc("masterclass_arena").update({ fen: 'start' });
            } else {
                $("#btn-analysis-mode").addClass("active");
            }
        }

        function toggleSetupMode() {
            setupModeActive = !setupModeActive;
            const currentFen = masterBoard.fen();
            
            // Re-initialize board with sparePieces enabled/disabled
            const config = {
                draggable: true,
                dropOffBoard: 'trash',
                sparePieces: setupModeActive,
                position: currentFen,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDrop: (source, target) => {
                    setTimeout(() => {
                        db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() });
                    }, 100);
                }
            };
            masterBoard = ChessBoard('masterBoard', config);
            
            if(setupModeActive) {
                $("#piece-selector").removeClass("hidden");
                $("#setup-mode-btn-coach, #btn-setup-mode-student").addClass("active").css("border-color", "var(--gold)");
            } else {
                $("#piece-selector").addClass("hidden");
                $("#setup-mode-btn-coach, #btn-setup-mode-student").removeClass("active").css("border-color", "");
                game.load(masterBoard.fen());
            }
        }

        function resizeCanvas() {
            const board = document.getElementById('masterBoard');
            canvas.width = board.clientWidth;
            canvas.height = board.clientHeight;
        }

        function toggleDrawMode() {
            drawModeActive = !drawModeActive;
            canvas.style.pointerEvents = drawModeActive ? 'auto' : 'none';
            $("#toggle-draw-btn").css("border-color", drawModeActive ? "var(--gold)" : "");
        }

        // DRAWING LOGIC (Desktop + Mobile Touch)
        function startDrawing(e) {
            if (!drawModeActive) return;
            isDrawing = true;
            ctx.beginPath();
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            ctx.moveTo(x, y);
        }

        function moveDrawing(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            ctx.lineTo(x, y);
            ctx.strokeStyle = '#fbbf24'; 
            ctx.lineWidth = 4; 
            ctx.lineCap = 'round'; 
            ctx.stroke();
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            db.collection("special_rooms").doc("masterclass_arena").update({ drawing: canvas.toDataURL() });
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', moveDrawing);
        canvas.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', moveDrawing);
        canvas.addEventListener('touchend', stopDrawing);

        function clearDrawings() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            db.collection("special_rooms").doc("masterclass_arena").update({ drawing: null });
        }

        function initDrawingSync() {
            db.collection("special_rooms").doc("masterclass_arena").onSnapshot(doc => {
                const data = doc.data();
                if (data?.drawing) {
                    const img = new Image();
                    img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0); };
                    img.src = data.drawing;
                } else { ctx.clearRect(0, 0, canvas.width, canvas.height); }
            });
        }

        function syncMasterPosition(pos) { 
            masterBoard.position(pos); game.load(masterBoard.fen());
            db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() });
        }

        function emptyBoard() { 
            masterBoard.clear(); game.clear();
            db.collection("special_rooms").doc("masterclass_arena").update({ fen: '8/8/8/8/8/8/8/8 w - - 0 1' });
        }

        function initAudio() {
            const domain = "meet.jit.si";
            const options = {
                roomName: "MindMasters_Chess_Pro_2026",
                width: "100%", height: 1,
                parentNode: document.querySelector('#jitsi-container'),
                userInfo: { displayName: myData.name }
            };
            jitsiAPI = new JitsiMeetExternalAPI(domain, options);
            jitsiAPI.addEventListeners({
                videoConferenceJoined: (e) => { myData.id = e.id; activeParticipants[e.id] = myData.name + " (You)"; renderParticipants(); renderMicUI(); },
                participantJoined: (e) => { activeParticipants[e.id] = e.displayName; renderParticipants(); },
                participantLeft: (e) => { delete activeParticipants[e.id]; renderParticipants(); },
                audioMuteStatusChanged: (e) => { micOn = !e.muted; renderMicUI(); }
            });
        }

        function renderMicUI() {
            const color = micOn ? 'var(--secondary)' : 'var(--danger)';
            $("#mic-control-area").html(`<button onclick="jitsiAPI.executeCommand('toggleAudio')" style="background:none; border:1px solid ${color}; color:${color}; padding:5px 10px; border-radius:8px; cursor:pointer; font-size:10px;">LIVE MIC: ${micOn ? 'ON' : 'OFF'}</button>`);
        }

        function renderParticipants() {
            let html = "";
            Object.keys(activeParticipants).forEach(id => { html += `<div class="participant-item">👤 ${activeParticipants[id]}</div>`; });
            $("#participants-list").html(html);
        }

        function clearFullChat() { if(confirm("Clear all?")) { db.collection("special_rooms").doc("masterclass_arena").collection("messages").get().then(s => s.forEach(d => d.ref.delete())); } }
        function toggleGlobalMove() {}
        function loadPgnData() {}
        function pgnMove(dir) {}
        function handleFileUpload(e) {}
    </script>
</body>
</html>
