<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Masterclass Studio</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>

    <style>
        :root { --primary: #2D1B4D; --secondary: #4ade80; --bg: #0f172a; --text: #f8fafc; --card: #1e293b; --danger: #ef4444; --gold: #fbbf24; }
        
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); color: var(--text); margin: 0; padding: 15px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        .container { width: 100%; max-width: 420px; background: rgba(30, 41, 59, 0.8); padding: 20px; border-radius: 20px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(12px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        .master-arena-card { border: 1px solid rgba(251, 191, 36, 0.4); background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 1)); }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.4); padding: 10px 15px; border-radius: 30px; margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .live-badge { background: var(--danger); color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .master-badge { background: var(--gold); color: #000; padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: 900; text-transform: uppercase; }

        #masterBoard { border: 4px solid #1e293b; border-radius: 8px; box-shadow: 0 0 25px rgba(0,0,0,0.5); }

        .analysis-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
        .tool-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .tool-btn:hover { background: rgba(251, 191, 36, 0.15); border-color: var(--gold); }

        .btn { padding: 16px; cursor: pointer; border-radius: 12px; border: none; background: linear-gradient(135deg, #2D1B4D 0%, #4c1d95 100%); color: var(--secondary); font-weight: 800; width: 100%; text-transform: uppercase; transition: 0.3s; font-size: 12px; }

        #chat-container { margin-top: 15px; background: rgba(2, 6, 23, 0.6); border-radius: 12px; padding: 10px; border-top: 2px solid var(--gold); }
        #master-chat-box { height: 120px; overflow-y: auto; font-size: 11px; margin-bottom: 10px; scroll-behavior: smooth; }
        .chat-msg { margin-bottom: 6px; color: #cbd5e1; }
        .chat-user { font-weight: bold; margin-right: 5px; color: var(--secondary); }
        .chat-coach { color: var(--gold) !important; text-shadow: 0 0 5px rgba(251, 191, 36, 0.3); }
        .chat-input-wrap { display: flex; gap: 5px; }
        input { flex: 1; background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; font-size: 12px; }

        .mic-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--secondary); color: white; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .mic-off { border-color: var(--danger); color: var(--danger); }
    </style>
</head>
<body>

    <h1 id="main-title" style="color: var(--secondary); margin-bottom: 25px; font-style: italic; letter-spacing: 4px;">ARENA</h1>

    <div id="section-lobby" class="container">
        <h3>ACADEMY LOBBY</h3>
        <button class="btn" style="background: var(--gold); color: #000; margin-bottom: 15px;" onclick="enterMasterclass()">
            🎓 OPEN MASTERCLASS STUDIO
        </button>
        <p style="text-align: center; font-size: 10px; color: #64748b;">Join Coach Dotun's Live Session</p>
    </div>

    <div id="section-masterclass" class="container master-arena-card hidden">
        <div class="status-bar" id="audio-status-bar" style="border-color: var(--secondary);">
            <div style="display:flex; align-items:center; gap:8px;">
                <div class="live-badge" id="audio-indicator" style="background: #4ade80;">AUDIO</div>
                <span id="role-text" style="font-size: 11px; font-weight: bold; color: var(--gold);">STUDENT VIEW</span>
            </div>
            <div id="mic-control-area">
                </div>
        </div>

        <div id="masterBoard" style="width: 100%;"></div>

        <div id="master-admin-panel" class="hidden">
            <div class="analysis-tools">
                <button class="tool-btn" onclick="syncMasterPosition('start')">🔄 RESET</button>
                <button class="tool-btn" onclick="masterBoard.flip()">🔄 FLIP</button>
                <button class="tool-btn" onclick="clearMasterBoard()" style="color:var(--danger)">🗑️ CLEAR</button>
                <button class="tool-btn" onclick="copyFEN()">📋 FEN</button>
            </div>
            <p style="text-align:center; font-size:9px; color: var(--secondary);">FREE-MOVE ANALYSIS ENABLED</p>
        </div>

        <div id="chat-container">
            <div id="master-chat-box"></div>
            <div class="chat-input-wrap">
                <input type="text" id="master-chat-input" placeholder="Type here..." onkeypress="if(event.key === 'Enter') sendMasterChat()">
                <button class="btn" style="width: 60px; padding: 10px;" onclick="sendMasterChat()">SEND</button>
            </div>
        </div>

        <button class="btn" style="margin-top:15px; background: transparent; border: 1px solid #334155;" onclick="exitStudio()">EXIT STUDIO</button>
    </div>

    <div id="jitsi-container" style="display:none;"></div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myData = { name: "User_" + Math.floor(Math.random()*100) }; 
        let masterBoard = null;
        let isCoach = false;
        let jitsiAPI = null;
        let micOn = false;

        async function enterMasterclass() {
            const pass = prompt("Enter Access Key:");
            
            if (pass === "dotun1234") {
                isCoach = true;
                myData.name = "Coach Dotun";
                $("#master-admin-panel").removeClass("hidden");
                $("#role-text").html('<span class="master-badge">COACH</span>');
            } else {
                isCoach = false;
                $("#master-admin-panel").addClass("hidden");
                $("#role-text").text("STUDENT VIEW");
            }

            $("#section-lobby").addClass("hidden");
            $("#section-masterclass").removeClass("hidden");
            $("#main-title").text("STUDIO");

            initBoard();
            initAudio();
            renderMicUI();
        }

        function renderMicUI() {
            // Coach and Students both get a toggle, but default behavior differs
            const initialIcon = isCoach ? '🎤' : '🔇';
            $("#mic-control-area").html(`
                <button id="mic-toggle-btn" class="mic-btn ${isCoach ? '' : 'mic-off'}" onclick="handleMicToggle()">
                    ${initialIcon}
                </button>
            `);
        }

        function handleMicToggle() {
            if(!jitsiAPI) return;
            jitsiAPI.executeCommand('toggleAudio');
            micOn = !micOn;
            
            const btn = $("#mic-toggle-btn");
            if(micOn) {
                btn.removeClass("mic-off").text("🎤");
            } else {
                btn.addClass("mic-off").text("🔇");
            }
        }

        function initBoard() {
            if(masterBoard) masterBoard.destroy();
            
            masterBoard = ChessBoard('masterBoard', {
                draggable: isCoach,
                dropOffBoard: 'trash',
                sparePieces: isCoach,
                position: 'start',
                onDrop: (source, target, piece, newPos) => {
                    setTimeout(() => {
                        const fen = ChessBoard.objToFen(newPos);
                        db.collection("special_rooms").doc("masterclass_arena").set({
                            fen: fen,
                            lastUpdate: Date.now(),
                            coach: "Coach Dotun"
                        });
                    }, 100);
                },
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            db.collection("special_rooms").doc("masterclass_arena").onSnapshot(doc => {
                const d = doc.data();
                if (d && d.fen && masterBoard.fen() !== d.fen) {
                    masterBoard.position(d.fen);
                }
            });

            db.collection("special_rooms").doc("masterclass_arena").collection("chat")
                .orderBy("time", "desc").limit(30).onSnapshot(snap => {
                    let html = "";
                    snap.docs.reverse().forEach(doc => {
                        const m = doc.data();
                        const coachClass = (m.user === "Coach Dotun" || m.isCoach) ? 'chat-coach' : '';
                        html += `<div class="chat-msg"><span class="chat-user ${coachClass}">${m.user}:</span> ${m.text}</div>`;
                    });
                    const box = document.getElementById('master-chat-box');
                    box.innerHTML = html;
                    box.scrollTop = box.scrollHeight;
                });
        }

        function initAudio() {
            const domain = "meet.jit.si";
            const options = {
                roomName: "MindMasters_Masterclass_Arena_2026",
                width: '100%', height: 0,
                parentNode: document.querySelector('#jitsi-container'),
                userInfo: { displayName: myData.name },
                configOverwrite: { 
                    startWithAudioMuted: !isCoach, // Students muted by default
                    startWithVideoMuted: true,
                    prejoinPageEnabled: false
                },
            };
            jitsiAPI = new JitsiMeetExternalAPI(domain, options);
            
            // Sync initial state
            micOn = isCoach;
        }

        function syncMasterPosition(fen) {
            if(!isCoach) return;
            if(fen === 'start') masterBoard.start();
            setTimeout(() => {
                db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() });
            }, 100);
        }

        function clearMasterBoard() {
            if(isCoach && confirm("Clear Board?")) {
                masterBoard.clear();
                syncMasterPosition(masterBoard.fen());
            }
        }

        function copyFEN() {
            navigator.clipboard.writeText(masterBoard.fen());
            alert("FEN Copied!");
        }

        async function sendMasterChat() {
            const txt = $("#master-chat-input").val().trim();
            if(!txt) return;
            await db.collection("special_rooms").doc("masterclass_arena").collection("chat").add({
                user: myData.name,
                text: txt,
                isCoach: isCoach,
                time: Date.now()
            });
            $("#master-chat-input").val("");
        }

        function exitStudio() {
            if(jitsiAPI) jitsiAPI.dispose();
            location.reload();
        }
    </script>
</body>
</html>
