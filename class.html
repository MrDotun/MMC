<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind Masters | Chess Class</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>

    <style>
        :root { 
            --primary: #2D1B4D; 
            --secondary: #4ade80; 
            --bg: #0f172a; 
            --text: #f8fafc; 
            --card: #1e293b; 
            --danger: #ef4444; 
            --gold: #fbbf24; 
            --glass: rgba(30, 41, 59, 0.7);
        }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .container { 
            width: 100%; 
            max-width: 440px; 
            background: var(--glass); 
            padding: 25px; 
            border-radius: 28px; 
            box-sizing: border-box; 
            border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(15px); 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            margin-bottom: 20px; 
        }
        .hidden { display: none !important; }
        
        #jitsi-container { 
            position: fixed; 
            bottom: 0;
            right: 0;
            width: 10px; 
            height: 10px; 
            z-index: -1; 
            opacity: 0.01;
            overflow: hidden;
        }

        #password-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
        .pass-card { background: var(--card); padding: 40px 30px; border-radius: 24px; border: 1px solid var(--gold); text-align: center; width: 320px; box-shadow: 0 0 40px rgba(251, 191, 36, 0.1); }

        .master-arena-card { border: 1px solid rgba(251, 191, 36, 0.2); }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 14px 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        
        .live-badge { background: var(--danger); color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .master-badge { background: var(--gold); color: #000; padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 900; }

        #board-wrapper { position: relative; width: 100%; touch-action: none; margin-bottom: 15px; }
        #masterBoard { border: 6px solid #1e293b; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 100%; }
        #drawingCanvas { position: absolute; top: 6px; left: 6px; z-index: 10; pointer-events: none; border-radius: 8px; }
        
        .draw-mode #drawingCanvas { pointer-events: auto; }
        .draw-active { background: var(--secondary) !important; color: #000 !important; }
        .setup-active { border: 4px solid var(--gold) !important; }

        .analysis-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .tool-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 12px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .pgn-section { margin-top: 15px; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 10px; }
        .pgn-nav { display: flex; gap: 5px; margin-top: 8px; }
        .pgn-nav button { flex: 1; padding: 10px; font-size: 14px; background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; cursor: pointer; }

        .btn { padding: 16px; cursor: pointer; border-radius: 14px; border: none; background: linear-gradient(135deg, #4c1d95 0%, #2D1B4D 100%); color: var(--secondary); font-weight: 800; width: 100%; text-transform: uppercase; transition: 0.3s; font-size: 12px; margin-top: 10px; letter-spacing: 1px; }
        .btn-gold { background: var(--gold); color: #000; }

        #participants-list { background: rgba(0,0,0,0.2); border-radius: 16px; padding: 15px; margin: 10px 0; font-size: 13px; }
        .participant-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        #chat-container { margin-top: 15px; background: rgba(2, 6, 23, 0.4); border-radius: 16px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        #master-chat-box { height: 100px; overflow-y: auto; font-size: 12px; margin-bottom: 12px; padding-right: 5px; }
        .chat-msg { margin-bottom: 5px; line-height: 1.4; }
        .chat-name { color: var(--gold); font-weight: bold; margin-right: 5px; }
        input, textarea { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; width: 100%; box-sizing: border-box; font-family: inherit;}
        .chat-input-wrap { display: flex; gap: 8px; }
        .chat-input-wrap input { margin-bottom: 0; }
    </style>
</head>
<body oncontextmenu="return false;">

    <h1 id="main-title" style="color: var(--secondary); margin: 20px 0; font-weight: 900; letter-spacing: 4px; text-align: center; text-shadow: 0 4px 10px rgba(0,0,0,0.3);">MIND MASTERS</h1>

    <div id="password-overlay" class="hidden">
        <div class="pass-card">
            <h2 style="color: var(--gold); margin-top: 0; letter-spacing: 1px;">Security Gate</h2>
            <input type="password" id="access-key" placeholder="••••" style="text-align: center; font-size: 24px; letter-spacing: 8px;">
            <button class="btn btn-gold" onclick="verifyAccess()">AUTHORIZE</button>
        </div>
    </div>

    <div id="section-lobby" class="container">
        <h3 style="text-align: center; color: var(--gold); letter-spacing: 2px;">VIRTUAL CAMPUS</h3>
        <input type="text" id="user-display-name" placeholder="Enter your name...">
        <button class="btn btn-gold" onclick="showPassScreen()">🚀 JOIN SESSION</button>
    </div>

    <div id="section-masterclass" class="container master-arena-card hidden">
        <div class="status-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="live-badge">LIVE</div>
                <span id="role-text">STUDENT</span>
            </div>
            <div id="mic-control-area"></div>
        </div>

        <div id="board-wrapper">
            <div id="masterBoard"></div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div id="master-admin-panel" class="hidden">
            <div class="analysis-tools">
                <button class="tool-btn" onclick="syncMasterPosition('start')">🔄 RESET POS</button>
                <button id="global-move-btn" class="tool-btn" onclick="toggleGlobalMove()">🔓 STUDENT MOVE</button>
                <button id="setup-mode-btn" class="tool-btn" onclick="toggleSetupMode()">🧩 SETUP MODE</button>
                <button id="toggle-draw-btn" class="tool-btn" onclick="toggleDrawMode()">✏️ PIECE MODE</button>
                <button class="tool-btn" onclick="clearDrawings()" style="color:var(--gold)">🧹 ERASE ALL</button>
                <button class="tool-btn" onclick="emptyBoard()" style="color:var(--danger)">🕳️ EMPTY BOARD</button>
            </div>
        </div>

        <div id="participants-panel">
            <p style="font-size: 11px; font-weight: 800; color: var(--secondary); margin-bottom: 10px; letter-spacing: 1px;">ACTIVE MINDS</p>
            <div id="participants-list"></div>
        </div>

        <div id="chat-container">
            <div id="master-chat-box"></div>
            <div class="chat-input-wrap">
                <input type="text" id="master-chat-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMasterChat()">
                <button class="btn" style="width: 80px; padding: 12px; margin:0;" onclick="sendMasterChat()">SEND</button>
            </div>
        </div>

        <button class="btn" style="margin-top:20px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8;" onclick="exitStudio()">EXIT CLASS</button>
    </div>

    <div id="jitsi-container"></div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myData = { name: "", id: "" }; 
        let masterBoard = null;
        let isCoach = false;
        let jitsiAPI = null;
        let micOn = false;
        let activeParticipants = {}; 
        let globalMove = false;

        function showPassScreen() { 
            const name = $("#user-display-name").val();
            if(!name) { alert("Please enter your name"); return; }
            myData.name = name;
            $("#password-overlay").removeClass("hidden"); 
        }

        async function verifyAccess() {
            const pass = $("#access-key").val();
            if (pass === "dotun1234") {
                isCoach = true;
                myData.name = "Coach Dotun";
                $("#master-admin-panel").removeClass("hidden");
                $("#role-text").html('<span class="master-badge">COACH</span>');
            } else if (pass === "1122") {
                isCoach = false;
                $("#role-text").text("STUDENT VIEW");
            } else { alert("Invalid Key"); return; }

            // REPO FIX: Wake up hardware audio context during button click
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) { new AudioContext().resume(); }
                await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (err) { console.warn("Mic pre-check failed"); }

            $("#password-overlay").addClass("hidden");
            $("#section-lobby").addClass("hidden");
            $("#section-masterclass").removeClass("hidden");
            
            initBoard();
            initAudio(); 
            initChat(); 
            renderMicUI();
        }

        function initAudio() {
            const domain = "meet.jit.si";
            const options = {
                roomName: "MindMasters_Arena_Secure_Room_2026",
                width: "100%", 
                height: "100%",
                parentNode: document.querySelector('#jitsi-container'),
                userInfo: { displayName: myData.name },
                configOverwrite: { 
                    startWithAudioMuted: false, // Forces the browser to ask for mic
                    startWithVideoMuted: true,
                    prejoinPageEnabled: false,
                    disableDeepLinking: true
                },
                interfaceConfigOverwrite: { TOOLBAR_BUTTONS: [] }
            };

            jitsiAPI = new JitsiMeetExternalAPI(domain, options);

            jitsiAPI.addEventListeners({
                videoConferenceJoined: (e) => {
                    myData.id = e.id; 
                    activeParticipants[e.id] = myData.name + " (You)";
                    renderParticipants();
                    
                    // REPO FIX: Inject "allow" attribute to punch through iframe security
                    const iframe = jitsiAPI.getIFrame();
                    if (iframe) { iframe.setAttribute("allow", "microphone; autoplay;"); }
                    
                    if(isCoach) { setTimeout(() => { jitsiAPI.executeCommand('unmute'); }, 1000); }
                    renderMicUI();
                },
                participantJoined: (e) => {
                    activeParticipants[e.id] = e.displayName || "Guest";
                    renderParticipants();
                },
                participantLeft: (e) => {
                    delete activeParticipants[e.id];
                    renderParticipants();
                },
                audioMuteStatusChanged: (e) => {
                    micOn = !e.muted;
                    renderMicUI();
                }
            });
        }

        function renderMicUI() {
            const isReady = !!jitsiAPI;
            const color = !isReady ? '#64748b' : (micOn ? 'var(--secondary)' : 'var(--danger)');
            const icon = !isReady ? '⌛ CONNECTING' : (micOn ? '🎤 ON' : '🔇 MUTED');
            $("#mic-control-area").html(`
                <button style="background: rgba(255,255,255,0.05); border: 1px solid ${color}; padding: 8px 15px; border-radius: 12px; cursor:pointer; font-size:12px; font-weight:bold; color:${color};" onclick="handleMicToggle()">
                    ${icon}
                </button>
            `);
        }

        function handleMicToggle() { if(jitsiAPI) jitsiAPI.executeCommand('toggleAudio'); }

        function initBoard(pos = 'start') {
            const config = {
                draggable: true,
                position: pos,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDragStart: () => (isCoach || globalMove),
                onDrop: () => {
                    setTimeout(() => {
                        db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() });
                    }, 100);
                }
            };
            if (masterBoard) masterBoard.destroy();
            masterBoard = ChessBoard('masterBoard', config);
            db.collection("special_rooms").doc("masterclass_arena").onSnapshot(doc => {
                const d = doc.data();
                if(d && d.fen && masterBoard.fen() !== d.fen) masterBoard.position(d.fen);
                if(d) globalMove = d.studentMoveEnabled || false;
            });
        }

        function initChat() {
            db.collection("special_rooms").doc("masterclass_arena").collection("messages").orderBy("timestamp", "asc").onSnapshot(snap => {
                const box = $("#master-chat-box");
                box.empty();
                snap.forEach(doc => {
                    const msg = doc.data();
                    box.append(`<div class="chat-msg"><span class="chat-name">${msg.sender}:</span><span>${msg.text}</span></div>`);
                });
                box.scrollTop(box[0].scrollHeight);
            });
        }

        function sendMasterChat() {
            const text = $("#master-chat-input").val().trim();
            if(!text) return;
            db.collection("special_rooms").doc("masterclass_arena").collection("messages").add({
                sender: myData.name, text: text, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            $("#master-chat-input").val("");
        }

        function renderParticipants() {
            let html = "";
            Object.keys(activeParticipants).forEach(id => {
                html += `<div class="participant-item"><span>👤 ${activeParticipants[id]}</span></div>`;
            });
            $("#participants-list").html(html || "<i style='opacity:0.5'>Waiting...</i>");
        }

        function exitStudio() { location.reload(); }
    </script>
</body>
</html>
