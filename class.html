<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind Masters | Chess Class</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root { 
            --primary: #2D1B4D; 
            --secondary: #4ade80; 
            --bg: #0f172a; 
            --text: #f8fafc; 
            --card: #1e293b; 
            --danger: #ef4444; 
            --gold: #fbbf24; 
            --glass: rgba(30, 41, 59, 0.7);
        }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            touch-action: manipulation;
            overflow-x: hidden;
        }
        
        .container { 
            width: 100%; 
            max-width: 440px; 
            background: var(--glass); 
            padding: 25px; 
            border-radius: 28px; 
            box-sizing: border-box; 
            border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(15px); 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            margin-bottom: 20px; 
        }
        .hidden { display: none !important; }
        
        /* New Call Control Bar */
        .call-controls-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.4);
            padding: 10px 15px;
            border-radius: 16px;
            margin-bottom: 10px;
            border: 1px solid var(--secondary);
        }

        #password-overlay { 
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%); 
            z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px); 
        }
        .pass-card { 
            background: rgba(30, 41, 59, 0.4); 
            padding: 40px 30px; 
            border-radius: 32px; 
            border: 1px solid rgba(251, 191, 36, 0.3); 
            text-align: center; 
            width: 350px; 
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(251, 191, 36, 0.05); 
            backdrop-filter: blur(20px);
        }
        .welcome-text { color: var(--gold); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
        .classroom-name { color: #fff; font-size: 24px; font-weight: 900; margin-bottom: 25px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .pass-input { 
            text-align: center; font-size: 24px; letter-spacing: 12px; 
            background: rgba(0,0,0,0.4) !important; border: 1px solid rgba(251, 191, 36, 0.2) !important;
            padding: 15px !important; border-radius: 16px !important; margin-bottom: 20px !important;
            color: var(--gold) !important; transition: 0.3s;
        }

        .master-arena-card { border: 1px solid rgba(251, 191, 36, 0.2); }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 14px 20px; border-radius: 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
        
        .live-badge { background: var(--danger); color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .master-badge { background: var(--gold); color: #000; padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 900; }

        .top-vn-bar { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.4); padding: 10px 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px; transition: background 0.5s; }
        .latest-audio-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }

        #board-wrapper { position: relative; width: 100%; margin-bottom: 15px; touch-action: none; }
        #masterBoard { 
            border: 6px solid #1e293b; 
            border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            width: 100%; 
            touch-action: none; 
        }
        #drawingCanvas { position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none; border-radius: 8px; }

        .analysis-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .tool-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 12px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.15); }

        .btn { padding: 16px; cursor: pointer; border-radius: 14px; border: none; background: linear-gradient(135deg, #4c1d95 0%, #2D1B4D 100%); color: var(--secondary); font-weight: 800; width: 100%; text-transform: uppercase; transition: 0.3s; font-size: 12px; margin-top: 10px; letter-spacing: 1px; }
        .btn-gold { background: var(--gold); color: #000; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3); }

        #chat-container { margin-top: 15px; background: rgba(2, 6, 23, 0.4); border-radius: 16px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        #master-chat-box { height: 150px; overflow-y: auto; font-size: 12px; margin-bottom: 12px; padding-right: 5px; }
        .chat-name { color: var(--gold); font-weight: bold; margin-bottom: 4px; }
        
        input, textarea { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; width: 100%; box-sizing: border-box; font-family: inherit;}
        .chat-input-wrap { display: flex; gap: 8px; align-items: center; }

        .vn-btn { background: #334155; color: white; border: none; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; position: relative;}
        .vn-btn.recording { background: var(--danger); animation: pulse 1s infinite; }
        .rec-label { position: absolute; bottom: -18px; font-size: 8px; color: var(--danger); font-weight: 900; white-space: nowrap; }
        
        audio { height: 35px; width: 100%; margin-top: 5px; filter: hue-rotate(90deg) brightness(1.5); }
        .del-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; margin-left: 5px; vertical-align: middle;}
        .highlight-square { box-shadow: inset 0 0 3px 3px yellow; }

        .call-btn-small { background: var(--secondary); color: black; border: none; padding: 5px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 10px; }
        .mute-btn-small { background: #555; color: white; border: none; padding: 5px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 10px; }
        .danger-btn-small { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 10px; }
        
        /* New Styles for PGN/PDF Viewer */
        .pgn-move-active { background: var(--secondary); color: #000; padding: 2px 4px; border-radius: 4px; font-weight: bold; }
        .pgn-move { cursor: pointer; padding: 2px; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary); margin: 20px 0; font-weight: 900; letter-spacing: 4px; text-align: center;">MIND MASTERS</h1>

    <div id="password-overlay" class="hidden">
        <div class="pass-card">
            <div class="welcome-text">Welcome to</div>
            <div class="classroom-name">Mr Dotun Chess Classroom</div>
            <div style="font-size: 40px; margin-bottom: 20px;">🏰</div>
            <input type="password" id="access-key" class="pass-input" placeholder="••••" maxlength="10">
            <button class="btn btn-gold" onclick="verifyAccess()">ENTER ARENA</button>
            <p style="font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 20px;">SECURITY AUTHORIZATION REQUIRED</p>
        </div>
    </div>

    <div id="section-lobby" class="container">
        <h3 style="text-align: center; color: var(--gold);">VIRTUAL CAMPUS</h3>
        <input type="text" id="user-display-name" placeholder="Enter your name...">
        <button class="btn btn-gold" onclick="showPassScreen()">🚀 JOIN SESSION</button>
    </div>

    <div id="section-masterclass" class="container master-arena-card hidden">
        
        <div id="coach-call-bar" class="call-controls-bar hidden">
            <span id="student-presence-indicator" style="font-size: 12px; color: var(--danger); font-weight: 900;">STUDENT OFFLINE</span>
            <div style="display:flex; gap:5px;">
                <button id="call-toggle-btn" class="call-btn-small" onclick="handleCallStart()" disabled style="opacity: 0.5;">📞 START CALL</button>
                <button id="mute-toggle-btn" class="mute-btn-small hidden" onclick="toggleMute()">🎤 MUTE</button>
                <button id="cut-call-btn" class="danger-btn-small hidden" onclick="cutCall()">🛑 CUT</button>
            </div>
        </div>
        <div id="student-call-status" class="call-controls-bar hidden">
             <span id="call-status-text" style="font-size: 12px;">Waiting for Coach...</span>
        </div>

        <div class="status-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="live-badge">LIVE</div>
                <span id="role-text">STUDENT</span>
            </div>
            <div id="mic-control-area"></div>
        </div>

        <div class="top-vn-bar" id="notif-bar">
            <div style="position:relative; display:flex; flex-direction:column; align-items:center; gap:5px;">
                <button id="top-vn-btn" class="vn-btn" onclick="toggleVN()">🎤</button>
                <button id="cancel-vn-btn" class="hidden" onclick="cancelRecording()" style="background:var(--danger); border:none; color:white; font-size:8px; padding:2px 5px; border-radius:4px; cursor:pointer;">CANCEL</button>
                <span id="rec-indicator" class="rec-label hidden">RECORDING...</span>
            </div>
            <div id="latest-audio-container" class="latest-audio-wrap">
                <span style="font-size: 11px; color: #94a3b8; font-style: italic;">No voice notes yet...</span>
            </div>
        </div>

        <div id="board-wrapper">
            <div id="masterBoard"></div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div id="shared-pgn-display" class="hidden" style="background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; margin-bottom: 15px; font-size: 14px; max-height: 120px; overflow-y: auto; line-height: 1.6;"></div>
        <div id="shared-pdf-display" class="hidden" style="margin-bottom: 15px; text-align: center; background: #fff; border-radius: 8px; padding: 5px; overflow: hidden;">
            <canvas id="pdf-render-canvas" style="max-width: 100%; height: auto;"></canvas>
        </div>

        <div id="student-tools" class="analysis-tools">
            <button class="tool-btn" onclick="syncMasterPosition('start')">🔄 RESET POS</button>
            <button class="tool-btn" onclick="flipBoard()">🔃 FLIP BOARD</button>
            <button id="setup-mode-btn" class="tool-btn" onclick="toggleSetupMode()">🧩 SETUP MODE</button>
            <button id="student-clear-btn" class="tool-btn hidden" onclick="emptyBoard()" style="color:var(--danger); grid-column: span 2;">🕳️ CLEAR BOARD</button>
        </div>

        <div id="master-admin-panel" class="hidden">
            <div class="analysis-tools" style="margin-top: 0;">
                <button id="toggle-draw-btn" class="tool-btn" onclick="toggleDrawMode()">✏️ DRAW MODE</button>
                <button class="tool-btn" onclick="clearDrawing()">🧼 ERASE LINES</button>
                <button class="tool-btn" onclick="emptyBoard()" style="color:var(--danger);">🕳️ EMPTY BOARD</button>
                <button class="tool-btn" onclick="clearMedia()" style="color:var(--danger);">🧹 CLEAR PGN/PDF</button>
                
                <div style="grid-column: span 2; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                    <div style="font-size: 10px; color: var(--gold); margin-bottom: 5px; font-weight: bold;">PGN LOADER</div>
                    <textarea id="pgn-input" placeholder="Paste PGN here to teach..." style="height: 50px; font-size: 12px; padding: 8px; margin-bottom: 5px;"></textarea>
                    <div style="display: flex; gap: 5px;">
                        <button class="tool-btn" style="flex: 1; padding: 8px;" onclick="loadCoachPGN()">📥 LOAD PGN</button>
                        <button class="tool-btn" style="flex: 1; padding: 8px;" onclick="prevPgnMove()">◀ PREV</button>
                        <button class="tool-btn" style="flex: 1; padding: 8px;" onclick="nextPgnMove()">NEXT ▶</button>
                    </div>
                </div>

                <div style="grid-column: span 2; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                    <div style="font-size: 10px; color: var(--gold); margin-bottom: 5px; font-weight: bold;">PDF BOOK VIEWER</div>
                    <input type="file" id="pdf-upload" accept="application/pdf" style="font-size: 11px; padding: 8px; border: none; background: rgba(255,255,255,0.1);">
                    <div style="display: flex; gap: 5px; margin-top: 5px;">
                        <button class="tool-btn" style="flex: 1; padding: 8px;" onclick="prevPdfPage()">◀ PREV PAGE</button>
                        <span id="pdf-page-indicator" style="display: flex; align-items: center; font-size: 12px; font-weight: bold; padding: 0 10px;">- / -</span>
                        <button class="tool-btn" style="flex: 1; padding: 8px;" onclick="nextPdfPage()">NEXT PAGE ▶</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="chat-container">
            <div id="master-chat-box"></div>
            <div class="chat-input-wrap">
                <input type="text" id="master-chat-input" placeholder="Type..." onkeypress="if(event.key==='Enter') sendMasterChat()">
                <button class="btn" style="width: 60px; padding: 12px; margin:0;" onclick="sendMasterChat()">➤</button>
            </div>
        </div>
        <button class="btn" style="margin-top:20px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8;" onclick="location.reload()">EXIT CLASS</button>
    </div>

    <audio id="peer-audio-output" autoplay></audio>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myData = { name: "" }; 
        let masterBoard = null;
        let isCoach = false;
        let isDrawing = false;
        let drawModeActive = false;
        let setupModeActive = false;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let wasCancelled = false;
        let clickSource = null;
        let isFlipped = false;

        let peer;
        let myStream;
        let currentCall;
        let isMuted = false;

        // PGN Control Variables
        let pgnGame = new Chess();
        let pgnMovesList = [];
        let currentPgnIndex = -1;

        // PDF Control Variables
        let pdfDoc = null;
        let pdfPageNum = 1;
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');

        function showPassScreen() { 
            const name = $("#user-display-name").val();
            if(!name) return;
            myData.name = name;
            $("#password-overlay").removeClass("hidden"); 
        }

        // --- UPDATED: verifyAccess ---
        async function verifyAccess() {
            const pass = $("#access-key").val();
            if (pass === "dotun1234") {
                isCoach = true;
                myData.name = "Coach Dotun";
                $("#master-admin-panel, #coach-call-bar").removeClass("hidden");
                $("#role-text").html('<span class="master-badge">COACH</span>');
                monitorStudentPresence(); // Coach starts watching student status
            } else if (pass === "1122") {
                isCoach = false;
                $("#role-text").text("STUDENT");
                $("#student-call-status").removeClass("hidden");
                setStudentPresence("online"); // Student marks self online
            } else { alert("Invalid Key"); return; }

            try {
                // Audio loop fix: Echo Cancellation added
                myStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });
                initPeerCommunication();
                
                mediaRecorder = new MediaRecorder(myStream);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    if(wasCancelled) { audioChunks = []; wasCancelled = false; return; }
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => { sendVN(reader.result); audioChunks = []; };
                };
            } catch (err) { 
                console.error("Mic error:", err); 
                // Hang fix: Initialize peer even if mic errors out
                alert("Please allow microphone access to use the audio call feature.");
                initPeerCommunication();
            }

            $("#password-overlay").addClass("hidden");
            $("#section-lobby").addClass("hidden");
            $("#section-masterclass").removeClass("hidden");
            
            initBoard();
            initDrawingSync();
            initChat(); 
        }

        // --- PRESENCE LOGIC ---
        function setStudentPresence(status) {
            const presenceRef = db.collection("special_rooms").doc("presence_status");
            presenceRef.set({
                status: status,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            // Set to offline if student leaves/closes tab
            window.addEventListener('beforeunload', () => {
                presenceRef.update({ status: "offline" });
            });
        }

        function monitorStudentPresence() {
            db.collection("special_rooms").doc("presence_status").onSnapshot(doc => {
                const data = doc.data();
                const indicator = $("#student-presence-indicator");
                const callBtn = $("#call-toggle-btn");

                if (data && data.status === "online") {
                    indicator.text("STUDENT ONLINE").css("color", "var(--secondary)");
                    callBtn.prop("disabled", false).css("opacity", "1");
                } else {
                    indicator.text("STUDENT OFFLINE").css("color", "var(--danger)");
                    callBtn.prop("disabled", true).css("opacity", "0.5");
                }
            });
        }

        // --- UPDATED: initPeerCommunication ---
        function initPeerCommunication() {
            // Silence fix: Adding STUN servers
            peer = new Peer({
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });
            
            peer.on('open', (id) => {
                if(!isCoach) {
                    db.collection("special_rooms").doc("masterclass_arena").update({ currentStudentPeer: id });
                }
            });

            peer.on('call', (call) => {
                currentCall = call;
                call.answer(myStream); 
                if(!isCoach) $("#call-status-text").text("Connected to Coach").css("color", "var(--secondary)");
                
                call.on('stream', (remoteStream) => {
                    const audioEl = document.getElementById('peer-audio-output');
                    audioEl.srcObject = remoteStream;
                    // Silence fix: Autoplay enforcement
                    audioEl.play().catch(e => console.log("Audio play blocked by browser:", e));
                });
                
                call.on('close', () => { resetCallUI(); });
            });
        }

        // --- UPDATED: handleCallStart ---
        function handleCallStart() {
            db.collection("special_rooms").doc("masterclass_arena").get().then((doc) => {
                const data = doc.data();
                if(data.currentStudentPeer) {
                    const call = peer.call(data.currentStudentPeer, myStream);
                    currentCall = call;
                    $("#call-toggle-btn").addClass("hidden");
                    $("#mute-toggle-btn, #cut-call-btn").removeClass("hidden");
                    
                    call.on('stream', (remoteStream) => {
                        const audioEl = document.getElementById('peer-audio-output');
                        audioEl.srcObject = remoteStream;
                        // Silence fix: Autoplay enforcement
                        audioEl.play().catch(e => console.log("Audio play blocked by browser:", e));
                    });
                }
            });
        }

        function toggleMute() {
            isMuted = !isMuted;
            myStream.getAudioTracks()[0].enabled = !isMuted;
            $("#mute-toggle-btn").text(isMuted ? "🎤 UNMUTE" : "🎤 MUTE")
                                 .css("background", isMuted ? "var(--danger)" : "#555");
        }

        function cutCall() {
            if(currentCall) currentCall.close();
            resetCallUI();
        }

        function resetCallUI() {
            $("#call-toggle-btn").removeClass("hidden");
            $("#mute-toggle-btn, #cut-call-btn").addClass("hidden");
            if(!isCoach) $("#call-status-text").text("Call Disconnected").css("color", "var(--danger)");
        }

        function initBoard() {
            const config = {
                orientation: isFlipped ? 'black' : 'white',
                draggable: true, dropOffBoard: 'snapback', position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDrop: (source, target) => {
                    setTimeout(() => { db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() }); }, 100);
                }
            };
            masterBoard = ChessBoard('masterBoard', config);
            document.getElementById('masterBoard').addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
            $('#masterBoard').on('click', '.square-55d63', function() {
                if (setupModeActive) return;
                const square = $(this).attr('data-square');
                const boardPos = masterBoard.position();
                if (!clickSource) {
                    if (boardPos[square]) {
                        clickSource = square;
                        $('.square-55d63').removeClass('highlight-square');
                        $(this).addClass('highlight-square');
                    }
                } else {
                    const move = clickSource + '-' + square;
                    masterBoard.move(move);
                    $('.square-55d63').removeClass('highlight-square');
                    setTimeout(() => { db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() }); }, 100);
                    clickSource = null;
                }
            });
            
            db.collection("special_rooms").doc("masterclass_arena").onSnapshot(doc => {
                const data = doc.data();
                if(data?.fen && masterBoard.fen() !== data.fen) { masterBoard.position(data.fen); }
                
                // Sync PGN Viewer
                if (data?.pgnText !== undefined) {
                    if (data.pgnText === "") {
                        $("#shared-pgn-display").addClass("hidden");
                    } else {
                        $("#shared-pgn-display").removeClass("hidden");
                        const tempChess = new Chess();
                        tempChess.load_pgn(data.pgnText);
                        const moves = tempChess.history();
                        
                        // Maintain coach state if page was refreshed
                        pgnMovesList = moves;
                        currentPgnIndex = data.pgnCurrentIndex !== undefined ? data.pgnCurrentIndex : -1;
                        
                        let html = "";
                        for(let i=0; i<moves.length; i++) {
                            if(i % 2 === 0) html += ` <span style="color:var(--gold); font-weight:bold;">${(i/2)+1}.</span> `;
                            if(i === currentPgnIndex) {
                                html += `<span class="pgn-move pgn-move-active">${moves[i]}</span> `;
                            } else {
                                html += `<span class="pgn-move">${moves[i]}</span> `;
                            }
                        }
                        $("#shared-pgn-display").html(html);
                        
                        // Auto scroll to active move
                        const displayDiv = document.getElementById("shared-pgn-display");
                        const activeEl = displayDiv.querySelector(".pgn-move-active");
                        if(activeEl) {
                            displayDiv.scrollTop = activeEl.offsetTop - displayDiv.offsetTop - 20;
                        }
                    }
                }

                // Sync PDF Viewer
                if (data?.sharedPdfUrl) {
                    $("#shared-pdf-display").removeClass("hidden");
                    const pCanvas = document.getElementById('pdf-render-canvas');
                    const pCtx = pCanvas.getContext('2d');
                    const img = new Image();
                    img.onload = () => {
                        pCanvas.width = img.width;
                        pCanvas.height = img.height;
                        pCtx.drawImage(img, 0, 0);
                    };
                    img.src = data.sharedPdfUrl;
                } else if (data?.sharedPdfUrl === null || data?.sharedPdfUrl === "") {
                    $("#shared-pdf-display").addClass("hidden");
                }
            });
            setTimeout(resizeCanvas, 500);
        }

        // --- PGN LOGIC ---
        function loadCoachPGN() {
            const pgnText = $("#pgn-input").val();
            if(!pgnText) return;
            const valid = pgnGame.load_pgn(pgnText);
            if(!valid) { alert("Invalid PGN Format"); return; }
            pgnMovesList = pgnGame.history();
            currentPgnIndex = -1;
            
            db.collection("special_rooms").doc("masterclass_arena").update({
                pgnText: pgnText,
                pgnCurrentIndex: currentPgnIndex
            });
            
            const tempStart = new Chess();
            syncMasterPosition(tempStart.fen());
        }

        function applyPgnState() {
            const temp = new Chess();
            for(let i = 0; i <= currentPgnIndex; i++) {
                temp.move(pgnMovesList[i]);
            }
            syncMasterPosition(temp.fen());
            db.collection("special_rooms").doc("masterclass_arena").update({
                pgnCurrentIndex: currentPgnIndex
            });
        }

        function prevPgnMove() {
            if(currentPgnIndex < 0) return;
            currentPgnIndex--;
            applyPgnState();
        }

        function nextPgnMove() {
            if(currentPgnIndex >= pgnMovesList.length - 1) return;
            currentPgnIndex++;
            applyPgnState();
        }

        // --- PDF LOGIC ---
        document.getElementById('pdf-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file.type !== 'application/pdf') return;
            const fileReader = new FileReader();
            fileReader.onload = function() {
                const typedarray = new Uint8Array(this.result);
                pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                    pdfDoc = pdf;
                    pdfPageNum = 1;
                    renderPdfPage(pdfPageNum);
                });
            };
            fileReader.readAsArrayBuffer(file);
        });

        function renderPdfPage(num) {
            pdfDoc.getPage(num).then(page => {
                const pCanvas = document.getElementById('pdf-render-canvas');
                const pCtx = pCanvas.getContext('2d');
                // Scale 1.0 to ensure output data URL is well under Firestore 1MB limit
                const viewport = page.getViewport({scale: 1.0}); 
                pCanvas.height = viewport.height;
                pCanvas.width = viewport.width;

                const renderContext = {
                    canvasContext: pCtx,
                    viewport: viewport
                };
                page.render(renderContext).promise.then(() => {
                    $("#shared-pdf-display").removeClass("hidden");
                    $("#pdf-page-indicator").text(`${pdfPageNum} / ${pdfDoc.numPages}`);
                    // Convert to JPEG Data URL for Firebase Sync (quality 0.6)
                    const dataUrl = pCanvas.toDataURL("image/jpeg", 0.6);
                    db.collection("special_rooms").doc("masterclass_arena").update({
                        sharedPdfUrl: dataUrl
                    });
                });
            });
        }

        function prevPdfPage() {
            if(pdfPageNum <= 1 || !pdfDoc) return;
            pdfPageNum--;
            renderPdfPage(pdfPageNum);
        }

        function nextPdfPage() {
            if(!pdfDoc || pdfPageNum >= pdfDoc.numPages) return;
            pdfPageNum++;
            renderPdfPage(pdfPageNum);
        }

        // --- FIXED CUTOFF: clearMedia() ---
        function clearMedia() {
            $("#pgn-input").val("");
            $("#pdf-upload").val("");
            pdfDoc = null;
            $("#pdf-page-indicator").text("- / -");
            db.collection("special_rooms").doc("masterclass_arena").update({
                pgnText: "",
                sharedPdfUrl: null
            });
        }
    </script>
</body>
</html>
