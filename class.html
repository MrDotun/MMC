<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind Masters | Chess Class</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>

    <style>
        :root { 
            --primary: #2D1B4D; 
            --secondary: #4ade80; 
            --bg: #0f172a; 
            --text: #f8fafc; 
            --card: #1e293b; 
            --danger: #ef4444; 
            --gold: #fbbf24; 
            --glass: rgba(30, 41, 59, 0.7);
        }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .container { 
            width: 100%; 
            max-width: 440px; 
            background: var(--glass); 
            padding: 25px; 
            border-radius: 28px; 
            box-sizing: border-box; 
            border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(15px); 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            margin-bottom: 20px; 
        }
        .hidden { display: none !important; }
        
        #jitsi-container { 
            position: fixed; top: 0; left: 0; width: 1px; height: 1px; z-index: -1; overflow: hidden; pointer-events: none;
        }

        #password-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
        .pass-card { background: var(--card); padding: 40px 30px; border-radius: 24px; border: 1px solid var(--gold); text-align: center; width: 320px; box-shadow: 0 0 40px rgba(251, 191, 36, 0.1); }

        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 14px 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        
        .live-badge { background: var(--danger); color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .master-badge { background: var(--gold); color: #000; padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 900; }

        #board-wrapper { position: relative; width: 100%; touch-action: none; margin-bottom: 15px; }
        #masterBoard { border: 6px solid #1e293b; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 100%; }
        
        .analysis-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .tool-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 12px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }

        .pgn-section { margin-top: 15px; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 10px; }
        .pgn-nav { display: flex; gap: 5px; margin-top: 8px; }
        .pgn-nav button { flex: 1; padding: 10px; font-size: 14px; background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; }

        .btn { padding: 16px; cursor: pointer; border-radius: 14px; border: none; background: linear-gradient(135deg, #4c1d95 0%, #2D1B4D 100%); color: var(--secondary); font-weight: 800; width: 100%; text-transform: uppercase; transition: 0.3s; font-size: 12px; margin-top: 10px; letter-spacing: 1px; }
        .btn-gold { background: var(--gold); color: #000; }

        #chat-container { margin-top: 15px; background: rgba(2, 6, 23, 0.4); border-radius: 16px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        #master-chat-box { height: 120px; overflow-y: auto; font-size: 12px; margin-bottom: 12px; padding-right: 5px; }
        .chat-msg { margin-bottom: 8px; line-height: 1.4; display: flex; flex-direction: column; }
        .chat-name { color: var(--gold); font-weight: bold; margin-bottom: 2px; }
        
        input, textarea { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; width: 100%; box-sizing: border-box; }
        .chat-input-wrap { display: flex; gap: 8px; align-items: center; }
        
        /* Voice Note Specific Styles */
        .voice-btn { background: #334155; color: white; border: none; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .voice-btn.recording { background: var(--danger); animation: pulse 1s infinite; }
        audio { height: 30px; width: 100%; max-width: 200px; margin-top: 4px; border-radius: 8px; filter: invert(100%) hue-rotate(180deg) brightness(1.5); }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary); margin: 20px 0; font-weight: 900; letter-spacing: 4px; text-align: center;">MIND MASTERS</h1>

    <div id="password-overlay" class="hidden">
        <div class="pass-card">
            <h2 style="color: var(--gold);">Security Gate</h2>
            <input type="password" id="access-key" placeholder="••••" style="text-align: center; font-size: 24px; letter-spacing: 8px;">
            <button class="btn btn-gold" onclick="verifyAccess()">AUTHORIZE</button>
        </div>
    </div>

    <div id="section-lobby" class="container">
        <h3 style="text-align: center; color: var(--gold);">VIRTUAL CAMPUS</h3>
        <input type="text" id="user-display-name" placeholder="Enter your name...">
        <button class="btn btn-gold" onclick="showPassScreen()">🚀 JOIN SESSION</button>
    </div>

    <div id="section-masterclass" class="container hidden">
        <div class="status-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="live-badge">LIVE</div>
                <span id="role-text">STUDENT</span>
            </div>
            <div id="mic-status-text" style="font-size: 10px; opacity: 0.6;"></div>
        </div>

        <div id="board-wrapper">
            <div id="masterBoard"></div>
        </div>

        <div id="master-admin-panel" class="hidden">
            <div class="analysis-tools">
                <button class="tool-btn" onclick="masterBoard.start()">🔄 RESET</button>
                <button class="tool-btn" onclick="masterBoard.clear()">🕳️ EMPTY</button>
            </div>
        </div>

        <div id="chat-container">
            <div id="master-chat-box"></div>
            <div class="chat-input-wrap">
                <button id="voice-record-btn" class="voice-btn" onclick="toggleRecording()">🎤</button>
                <input type="text" id="master-chat-input" placeholder="Type..." onkeypress="if(event.key==='Enter') sendMasterChat()">
                <button class="btn" style="width: 60px; margin:0; padding:12px;" onclick="sendMasterChat()">➤</button>
            </div>
        </div>

        <button class="btn" style="margin-top:20px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8;" onclick="location.reload()">EXIT</button>
    </div>

    <div id="jitsi-container"></div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myData = { name: "", id: "" }; 
        let masterBoard = null;
        let isCoach = false;
        
        // Voice Note Variables
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function showPassScreen() { 
            const name = $("#user-display-name").val();
            if(!name) { alert("Enter Name"); return; }
            myData.name = name;
            $("#password-overlay").removeClass("hidden"); 
        }

        async function verifyAccess() {
            const pass = $("#access-key").val();
            if (pass === "dotun1234") {
                isCoach = true;
                myData.name = "Coach Dotun";
                $("#master-admin-panel").removeClass("hidden");
                $("#role-text").html('<span class="master-badge">COACH</span>');
            } else if (pass === "1122") {
                isCoach = false;
                $("#role-text").text("STUDENT");
            } else { alert("Wrong Key"); return; }

            // Initialize Microphone for Voice Notes
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        sendAudioMessage(reader.result);
                    };
                };
                $("#mic-status-text").text("Mic Ready");
            } catch (err) {
                $("#mic-status-text").text("Mic Blocked");
            }

            $("#password-overlay").addClass("hidden");
            $("#section-lobby").addClass("hidden");
            $("#section-masterclass").removeClass("hidden");
            
            initBoard();
            initChat(); 
        }

        function toggleRecording() {
            if (!mediaRecorder) { alert("Mic not available"); return; }
            if (!isRecording) {
                audioChunks = [];
                mediaRecorder.start();
                isRecording = true;
                $("#voice-record-btn").addClass("recording").text("🛑");
            } else {
                mediaRecorder.stop();
                isRecording = false;
                $("#voice-record-btn").removeClass("recording").text("🎤");
            }
        }

        function sendAudioMessage(base64Data) {
            db.collection("special_rooms").doc("masterclass_arena").collection("messages").add({
                sender: myData.name,
                audio: base64Data,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function sendMasterChat() {
            const text = $("#master-chat-input").val().trim();
            if(!text) return;
            db.collection("special_rooms").doc("masterclass_arena").collection("messages").add({
                sender: myData.name,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            $("#master-chat-input").val("");
        }

        function initChat() {
            db.collection("special_rooms").doc("masterclass_arena").collection("messages").orderBy("timestamp", "asc")
              .onSnapshot(snap => {
                  const box = $("#master-chat-box");
                  box.empty();
                  snap.forEach(doc => {
                      const msg = doc.data();
                      let content = msg.text ? `<span>${msg.text}</span>` : `
                        <audio controls>
                            <source src="${msg.audio}" type="audio/webm">
                        </audio>`;
                      
                      box.append(`
                        <div class="chat-msg">
                            <span class="chat-name">${msg.sender}</span>
                            ${content}
                        </div>`);
                  });
                  box.scrollTop(box[0].scrollHeight);
              });
        }

        function initBoard() {
            masterBoard = ChessBoard('masterBoard', {
                draggable: true,
                position: 'start',
                onDrop: (source, target) => {
                    setTimeout(() => {
                        db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() });
                    }, 100);
                }
            });
            db.collection("special_rooms").doc("masterclass_arena").onSnapshot(doc => {
                const d = doc.data();
                if(d && d.fen && masterBoard.fen() !== d.fen) masterBoard.position(d.fen);
            });
        }
    </script>
</body>
</html>
