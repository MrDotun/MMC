<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Dotun's Chess Corner</title>
    <style>
        :root {
            --light-purple: #f3e8ff;
            --soft-green: #dcfce7;
            --deep-purple: #6b21a8;
            --bold-green: #15803d;
            --white: #ffffff;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background-color: var(--light-purple);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-card {
            background: var(--white);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 0px var(--soft-green);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 4px solid var(--deep-purple);
        }

        h1 {
            color: var(--deep-purple);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--bold-green);
            font-weight: bold;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn {
            display: block;
            padding: 20px;
            text-decoration: none;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 15px;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0px rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.1);
        }

        /* Mr Dotun Class Button */
        .btn-class {
            background-color: var(--bold-green);
            color: white;
        }

        .btn-class:hover {
            background-color: #166534;
        }

        /* Puzzles Button */
        .btn-puzzles {
            background-color: var(--deep-purple);
            color: white;
        }

        .btn-puzzles:hover {
            background-color: #581c87;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>🏆 Chess Kids 🏆</h1>
        <p class="subtitle">Join the fun and start playing!</p>

        <div class="button-container">
            <a href="https://lichess.org/class" target="_blank" class="btn btn-class">
                🏫 Mr. Dotun's Class
            </a>

            <a href="https://lichess.org/training" target="_blank" class="btn btn-puzzles">
                🧩 Solve Puzzles
            </a>
        </div>

        <p class="footer-note">No login needed for puzzles! Just click and play.</p>
    </div>

</body>
</html>
