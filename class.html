<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind Masters | Chess Class</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>

    <style>
        :root { 
            --primary: #2D1B4D; --secondary: #4ade80; --bg: #0f172a; --text: #f8fafc; 
            --card: #1e293b; --danger: #ef4444; --gold: #fbbf24; --glass: rgba(30, 41, 59, 0.7);
        }
        
        body { 
            font-family: 'Inter', sans-serif; background: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); 
            color: var(--text); margin: 0; padding: 15px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; 
        }
        
        .container { width: 100%; max-width: 440px; background: var(--glass); padding: 25px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(15px); margin-bottom: 20px; box-sizing: border-box; }
        .hidden { display: none !important; }
        
        #board-wrapper { position: relative; width: 100%; touch-action: none; margin-bottom: 15px; }
        #masterBoard { border: 6px solid #1e293b; border-radius: 12px; width: 100%; }
        #drawingCanvas { position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none; }

        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 14px 20px; border-radius: 16px; margin-bottom: 12px; }
        .live-badge { background: var(--danger); color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .btn { padding: 16px; cursor: pointer; border-radius: 14px; border: none; background: linear-gradient(135deg, #4c1d95 0%, #2D1B4D 100%); color: var(--secondary); font-weight: 800; width: 100%; text-transform: uppercase; font-size: 12px; margin-top: 10px; }
        .btn-gold { background: var(--gold); color: #000; }
        
        .analysis-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .tool-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 12px; border-radius: 12px; font-size: 10px; font-weight: 700; cursor: pointer; }
        .tool-btn.active { background: var(--gold); color: #000; }

        #master-chat-box { height: 150px; overflow-y: auto; font-size: 12px; margin-bottom: 12px; }
        .chat-msg { margin-bottom: 10px; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; position: relative; }
        .delete-btn { color: var(--danger); font-size: 9px; cursor: pointer; float: right; text-decoration: underline; }
        
        .vn-btn { background: #334155; color: white; border: none; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; font-size: 18px; }
        .vn-btn.recording { background: var(--danger); }
        audio { height: 30px; width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary); margin: 20px 0; font-weight: 900; letter-spacing: 4px;">MIND MASTERS</h1>

    <div id="section-lobby" class="container">
        <input type="text" id="user-display-name" placeholder="Enter your name...">
        <input type="password" id="access-key" placeholder="Enter Key (dotun1234 or 1122)" style="margin-top:10px; width:100%; padding:12px; border-radius:12px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:white;">
        <button class="btn btn-gold" onclick="verifyAccess()">🚀 JOIN SESSION</button>
    </div>

    <div id="section-masterclass" class="container hidden">
        <div class="status-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="live-badge">LIVE</div>
                <span id="role-text">STUDENT</span>
            </div>
            <div id="mic-control-area"></div>
        </div>

        <div class="top-vn-bar" style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
            <button id="top-vn-btn" class="vn-btn" onclick="toggleVN()">🎤</button>
            <div id="latest-audio-container" style="flex:1; font-size:11px; color:#94a3b8;">No voice notes...</div>
        </div>

        <div id="board-wrapper">
            <div id="masterBoard"></div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div class="analysis-tools">
            <button id="toggle-draw-btn" class="tool-btn" onclick="toggleDrawMode()">✏️ DRAW MODE</button>
            <button class="tool-btn" onclick="clearLines()">🧹 CLEAR LINES</button>
            <button class="tool-btn" onclick="syncMasterPosition('start')">🔄 RESET BOARD</button>
            <button id="setup-btn" class="tool-btn" onclick="toggleSetupMode()">🧩 SETUP PIECES</button>
        </div>

        <div id="chat-container" style="background: rgba(0,0,0,0.2); padding:15px; border-radius:16px;">
            <div id="master-chat-box"></div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="master-chat-input" placeholder="Chat..." style="flex:1; padding:10px; border-radius:8px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:white;">
                <button onclick="sendMasterChat()" style="background:var(--gold); border:none; border-radius:8px; padding:0 15px;">➤</button>
            </div>
        </div>
    </div>

    <div id="jitsi-container" style="display:none;"></div>

    <script>
        // --- CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
            authDomain: "assignments-de95a.firebaseapp.com",
            projectId: "assignments-de95a",
            storageBucket: "assignments-de95a.firebasestorage.app",
            messagingSenderId: "1088073398299",
            appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myName = "";
        let masterBoard = null;
        let isCoach = false;
        let drawModeActive = false;
        let isDrawing = false;
        let setupMode = false;
        let mediaRecorder;
        let audioChunks = [];

        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');

        async function verifyAccess() {
            const name = $("#user-display-name").val();
            const pass = $("#access-key").val();
            if(!name || !pass) return alert("Fill all fields");

            myName = name;
            if(pass === "dotun1234") { isCoach = true; myName = "Coach " + name; }
            
            $("#section-lobby").addClass("hidden");
            $("#section-masterclass").removeClass("hidden");
            $("#role-text").text(isCoach ? "COACH" : "STUDENT");

            initBoard();
            initDrawing();
            initAudio();
            initChat();
            setupRecorder();
        }

        // --- CHESS LOGIC ---
        function initBoard() {
            const config = {
                draggable: true,
                dropOffBoard: 'snapback',
                position: 'start',
                // FIX FOR BROKEN PIECES: Use online images
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDrop: (source, target) => {
                    setTimeout(() => {
                        db.collection("special_rooms").doc("class_data").update({ fen: masterBoard.fen() });
                    }, 150);
                }
            };
            masterBoard = ChessBoard('masterBoard', config);

            db.collection("special_rooms").doc("class_data").onSnapshot(doc => {
                const data = doc.data();
                if(data?.fen && data.fen !== masterBoard.fen()) masterBoard.position(data.fen);
            });
            resizeCanvas();
        }

        function toggleSetupMode() {
            setupMode = !setupMode;
            const currentPos = masterBoard.fen();
            masterBoard = ChessBoard('masterBoard', {
                draggable: true,
                dropOffBoard: 'trash',
                sparePieces: setupMode,
                position: currentPos,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDrop: (source, target) => {
                    setTimeout(() => { db.collection("special_rooms").doc("class_data").update({ fen: masterBoard.fen() }); }, 150);
                }
            });
            $("#setup-btn").toggleClass("active", setupMode);
        }

        function syncMasterPosition(pos) {
            masterBoard.position(pos);
            db.collection("special_rooms").doc("class_data").update({ fen: masterBoard.fen() });
        }

        // --- DRAWING LOGIC ---
        function initDrawing() {
            db.collection("special_rooms").doc("class_data").onSnapshot(doc => {
                const data = doc.data();
                if (data?.drawing) {
                    const img = new Image();
                    img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
                    img.src = data.drawing;
                } else { ctx.clearRect(0,0,canvas.width,canvas.height); }
            });
        }

        function toggleDrawMode() {
            drawModeActive = !drawModeActive;
            canvas.style.pointerEvents = drawModeActive ? 'auto' : 'none';
            $("#toggle-draw-btn").toggleClass("active", drawModeActive);
        }

        function clearLines() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            db.collection("special_rooms").doc("class_data").update({ drawing: null });
        }

        function resizeCanvas() {
            const b = document.getElementById('masterBoard');
            canvas.width = b.clientWidth; canvas.height = b.clientHeight;
        }

        canvas.onmousedown = (e) => { if(!drawModeActive) return; isDrawing=true; ctx.beginPath(); };
        canvas.onmousemove = (e) => {
            if(!isDrawing) return;
            const r = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - r.left, e.clientY - r.top);
            ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 4; ctx.stroke();
        };
        canvas.onmouseup = () => { 
            if(isDrawing) { isDrawing=false; db.collection("special_rooms").doc("class_data").update({ drawing: canvas.toDataURL() }); } 
        };

        // --- VOICE / CHAT LOGIC ---
        function setupRecorder() {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        db.collection("special_rooms").doc("class_data").collection("msgs").add({
                            sender: myName, audio: reader.result, time: Date.now()
                        });
                        audioChunks = [];
                    };
                };
            });
        }

        function toggleVN() {
            if(mediaRecorder.state === "inactive") {
                mediaRecorder.start(); $("#top-vn-btn").addClass("recording").text("🛑");
            } else {
                mediaRecorder.stop(); $("#top-vn-btn").removeClass("recording").text("🎤");
            }
        }

        function initChat() {
            db.collection("special_rooms").doc("class_data").collection("msgs").orderBy("time", "asc").onSnapshot(snap => {
                const box = $("#master-chat-box");
                box.empty();
                snap.forEach(doc => {
                    const m = doc.data();
                    const isMine = m.sender === myName || isCoach;
                    const del = isMine ? `<span class="delete-btn" onclick="deleteMsg('${doc.id}')">Delete</span>` : '';
                    let content = m.audio ? `<audio controls src="${m.audio}"></audio>` : `<span>${m.text}</span>`;
                    box.append(`<div class="chat-msg"><b>${m.sender}</b> ${del}<br>${content}</div>`);
                });
                box.scrollTop(box[0].scrollHeight);
            });
        }

        function deleteMsg(id) {
            db.collection("special_rooms").doc("class_data").collection("msgs").doc(id).delete();
        }

        function sendMasterChat() {
            const t = $("#master-chat-input").val();
            if(!t) return;
            db.collection("special_rooms").doc("class_data").collection("msgs").add({
                sender: myName, text: t, time: Date.now()
            });
            $("#master-chat-input").val("");
        }

        function initAudio() {
            const api = new JitsiMeetExternalAPI("meet.jit.si", {
                roomName: "MindMasters_Chess_2026",
                width: 1, height: 1, parentNode: document.querySelector('#jitsi-container')
            });
            $("#mic-control-area").html(`<button onclick="alert('Mic controlled via Jitsi')" class="tool-btn">🎤 AUDIO ACTIVE</button>`);
        }
    </script>
</body>
</html>
