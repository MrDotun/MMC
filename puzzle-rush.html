<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Dotun's Puzzle Rush Arena</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #1e1b4b; --secondary: #fbbf24; --accent: #4ade80; --bg: #0f172a; --danger: #ef4444; --timer: #f43f5e; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        #board-container { width: 350px; max-width: 95vw; margin: 10px auto; border: 4px solid var(--secondary); border-radius: 12px; overflow: hidden; transition: 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; }
        .hidden { display: none !important; }
        
        .btn { padding: 12px 20px; margin: 5px; cursor: pointer; border-radius: 8px; border: 2px solid var(--secondary); background: var(--primary); color: var(--secondary); font-weight: bold; width: 100%; transition: 0.2s; box-sizing: border-box; outline: none; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { background: var(--secondary); color: var(--primary); transform: translateY(-2px); }
        .btn-start { background: var(--accent); color: var(--primary); border-color: white; margin-top: 15px; font-size: 1.2em; }
        
        #task-text { background: #1e293b; padding: 10px; border-radius: 8px; border-bottom: 4px solid var(--accent); margin-bottom: 10px; width: 350px; max-width: 90vw; text-align: center; font-weight: bold; font-size: 1.1em; min-height: 40px; transition: 0.3s; }
        
        /* Highlight states */
        .highlight-selected { background-color: rgba(251, 191, 36, 0.6) !important; }
        .correct-flash { border-color: var(--accent) !important; box-shadow: 0 0 30px var(--accent); }
        .wrong-flash { border-color: var(--danger) !important; box-shadow: 0 0 30px var(--danger); }
        
        /* Notifications overlay */
        #applause-notif { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--accent); color: var(--primary); padding: 15px 25px; border-radius: 50px; font-weight: 900; z-index: 100; pointer-events: none; opacity: 0; transition: 0.2s; text-align: center; font-size: 1.2em; width: 80%; box-sizing: border-box; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #encourage-notif { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--danger); color: white; padding: 15px 25px; border-radius: 50px; font-weight: 900; z-index: 100; pointer-events: none; opacity: 0; transition: 0.2s; text-align: center; font-size: 1.2em; width: 80%; box-sizing: border-box; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        /* Timer and Score UI */
        .stats-bar { display: flex; justify-content: space-between; width: 350px; max-width: 95vw; margin-bottom: 10px; align-items: center; }
        .timer-box { font-size: 2em; font-weight: 900; color: var(--timer); text-shadow: 0 0 10px rgba(244, 63, 94, 0.5); font-family: monospace; }
        .score-box { font-size: 1.5em; font-weight: bold; color: var(--accent); }

        /* Avatars */
        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .avatar-btn { font-size: 2em; background: #1e293b; border: 2px solid transparent; border-radius: 12px; cursor: pointer; padding: 5px; transition: 0.2s; text-align: center; }
        .avatar-btn.selected { border-color: var(--secondary); background: rgba(251, 191, 36, 0.2); transform: scale(1.1); }

        /* Modals */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--primary); padding: 25px; border-radius: 16px; border: 3px solid var(--secondary); z-index: 2000; width: 85%; max-height: 80vh; overflow-y: auto; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        
        .leaderboard-entry { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #334155; cursor: pointer; transition: 0.2s; border-radius: 8px; }
        .leaderboard-entry:hover { background: #334155; }
        .leaderboard-left { display: flex; align-items: center; gap: 12px; }
        .leaderboard-avatar { font-size: 1.8em; }
        
        .profile-card { text-align: center; }
        .profile-avatar { font-size: 4em; margin-bottom: 10px; }
        .profile-name { font-size: 1.5em; color: var(--secondary); font-weight: bold; margin-bottom: 5px; }
        .profile-class { color: #94a3b8; font-size: 1.1em; margin-bottom: 15px; }
        .profile-score { font-size: 2em; color: var(--accent); font-weight: 900; }
    </style>
</head>
<body>

    <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="color: var(--secondary); margin: 0; font-size: 1.8em; text-transform: uppercase;">Mr Dotun's</h1>
        <h2 style="color: white; margin: 0; font-weight: 300; letter-spacing: 4px;">PUZZLE RUSH ARENA</h2>
    </div>

    <div id="setup-area" style="width: 100%; max-width: 400px;">
        <div style="text-align: center; font-size: 1.2em; color: #94a3b8; margin-bottom: 15px;" id="data-status">
            Loading Puzzles...
        </div>

        <input type="text" id="studentName" placeholder="Enter Full Name" style="width:100%; padding:15px; margin-bottom:10px; border-radius:8px; border:2px solid var(--secondary); background:#1e293b; color:white; box-sizing: border-box; font-size: 16px; text-align: center;">
        <input type="text" id="studentClass" placeholder="Enter Class (e.g., Grade 4)" style="width:100%; padding:15px; margin-bottom:10px; border-radius:8px; border:2px solid var(--secondary); background:#1e293b; color:white; box-sizing: border-box; font-size: 16px; text-align: center;">
        
        <h3 style="text-align: center; color: var(--secondary); margin-bottom: 5px;">Choose Your Avatar</h3>
        <div class="avatar-grid" id="avatar-container">
            <div class="avatar-btn" onclick="selectAvatar('🐶', this)">🐶</div>
            <div class="avatar-btn" onclick="selectAvatar('🐱', this)">🐱</div>
            <div class="avatar-btn" onclick="selectAvatar('🦁', this)">🦁</div>
            <div class="avatar-btn" onclick="selectAvatar('🦊', this)">🦊</div>
            <div class="avatar-btn" onclick="selectAvatar('🐸', this)">🐸</div>
            <div class="avatar-btn" onclick="selectAvatar('🐼', this)">🐼</div>
            <div class="avatar-btn" onclick="selectAvatar('🦄', this)">🦄</div>
            <div class="avatar-btn" onclick="selectAvatar('🦖', this)">🦖</div>
        </div>

        <button id="start-btn" class="btn btn-start" onclick="startRush()" disabled>🚀 START 5-MIN RUSH</button>
        <button class="btn" style="border-color: #6366f1; color: #6366f1; margin-top: 15px; font-size: 0.9em;" onclick="fetchLeaderboard()">🏆 Arena Leaderboard</button>
    </div>

    <div id="game-area" class="hidden">
        <div class="stats-bar">
            <div class="score-box">🔥 <span id="current-score">0</span></div>
            <div class="timer-box" id="timer-display">5:00</div>
        </div>
        
        <div id="task-text">Finding Puzzle...</div>
        
        <div id="board-container">
            <div id="myBoard"></div>
            <div id="applause-notif">EXCELLENT! 👏</div>
            <div id="encourage-notif">KEEP GOING! 🏃‍♂️</div>
        </div>
    </div>

    <div id="post-game" class="hidden" style="text-align: center; width: 95%; max-width: 400px;">
        <h2 style="color:var(--secondary); font-size: 2.5em; margin-bottom: 10px;">TIME'S UP!</h2>
        <h3 style="margin: 20px 0; font-size: 1.5em;">You solved: <br><span id="final-points" style="color:var(--accent); font-size: 2.5em;">0</span> <br>Puzzles</h3>
        <button class="btn btn-start" onclick="fetchLeaderboard()">🏆 View Leaderboard</button>
        <button class="btn" style="border-color: #94a3b8; color: #94a3b8;" onclick="location.reload()">🔄 Play Again</button>
    </div>

    <div id="leaderboard-modal" class="modal hidden">
        <h2 style="color:var(--secondary); text-align: center; margin-top: 0;">🏆 ARENA CHAMPIONS</h2>
        <p style="text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: -10px;">Click a player to view profile</p>
        <div id="leaderboard-data" style="margin-bottom: 20px;"></div>
        <button class="btn" onclick="closeModal('leaderboard-modal')">CLOSE</button>
    </div>

    <div id="profile-modal" class="modal hidden">
        <div class="profile-card">
            <div class="profile-avatar" id="prof-avatar">🦁</div>
            <div class="profile-name" id="prof-name">Player Name</div>
            <div class="profile-class" id="prof-class">Class</div>
            <div>Top Rush Score:</div>
            <div class="profile-score" id="prof-score">0</div>
        </div>
        <button class="btn" onclick="closeModal('profile-modal')" style="margin-top: 25px;">BACK</button>
    </div>

    <script>
        // === FIREBASE INITIALIZATION ===
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        // === ARRAYS & VARIABLES ===
        const funnyComments = [
            "Genius! 🧠", "Boom! 💥", "Magnus? Is that you? 😲", "Unstoppable! 🚂", "On Fire! 🔥",
            "Legendary! ⭐", "Calculated! 🎯", "Checkmate! 😎", "Bravo! 👏", "Brilliant! 💡",
            "Too Fast! ⚡", "Eagle Vision! 🦅", "Spectacular! 🌟", "Ninja Moves! 🥷", "Ice Cold! ❄️"
        ];
        
        const encouragingComments = [
            "Oops, Next! 🏃‍♂️", "Keep Pushing! 💪", "Shake it off! 🚀", "Stay Focused! 👀", 
            "Almost! 🤏", "Don't Give Up! ❤️", "Next Puzzle! ⏭️", "Speed Up! 🏎️"
        ];

        let allQuestions = []; 
        let rushQueue = [];
        let game = new Chess();
        let board;
        
        let pName = "", pClass = "", pAvatar = "";
        let score = 0;
        let currentIdx = 0;
        let squareSelected = null;
        let canInteract = false;
        
        let timerInterval;
        let timeLeft = 300; // 5 Minutes in seconds

        // === DATA LOADING ===
        async function summonWorkstationData() {
            const URL_MATE_1 = "https://raw.githubusercontent.com/MrDotun/MMC/refs/heads/main/csvjson.json";
            const statusDisplay = document.getElementById('data-status');
            
            try {
                const res = await fetch(URL_MATE_1);
                if (res.ok) {
                    const data = await res.json();
                    data.forEach((item) => {
                        const moveStr = item.solution || item.best;
                        if (item.fen && moveStr) {
                            const fen = item.fen.trim();
                            const isWhite = fen.split(' ')[1] === 'w';
                            allQuestions.push({
                                task: isWhite ? "White to Move: Deliver Mate!" : "Black to Move: Deliver Mate!",
                                fen: fen, 
                                expectedMoves: [moveStr.replace(/1\.\s+/g, '').split(' ')[0].trim()]
                            });
                        }
                    });
                    
                    if (allQuestions.length > 0) { 
                        statusDisplay.innerHTML = `<span style="color:var(--accent)">✔️ Loaded ${allQuestions.length} Puzzles!</span>`;
                        document.getElementById('start-btn').disabled = false;
                    } else { 
                        statusDisplay.innerText = "No puzzle data found."; 
                    }
                }
            } catch (e) { 
                statusDisplay.innerText = "Offline. Please check data source."; 
            }
        }
        summonWorkstationData();

        // === SETUP LOGIC ===
        function selectAvatar(emoji, element) {
            pAvatar = emoji;
            document.querySelectorAll('.avatar-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
        }

        // Fisher-Yates Shuffle
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // === GAME LOGIC ===
        function startRush() {
            pName = document.getElementById('studentName').value.trim();
            pClass = document.getElementById('studentClass').value.trim(); 
            
            if(!pName || !pClass) { alert("Please enter both Name and Class."); return; }
            if(!pAvatar) { alert("Please choose an Avatar!"); return; }
            
            // Randomize puzzles for this run
            rushQueue = shuffleArray(allQuestions);
            currentIdx = 0;
            score = 0;
            timeLeft = 300;
            
            document.getElementById("setup-area").classList.add("hidden");
            document.getElementById("game-area").classList.remove("hidden");
            
            updateScoreUI();
            updateTimerUI();
            
            // Start Timer
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) { endGame(); }
            }, 1000);

            loadPuzzle();
        }

        function loadPuzzle() {
            if (currentIdx >= rushQueue.length) { endGame(); return; } // Out of puzzles (unlikely)
            
            canInteract = true;
            squareSelected = null;
            
            const q = rushQueue[currentIdx];
            document.getElementById("task-text").innerText = q.task;
            
            game.load(q.fen);
            board = Chessboard('myBoard', {
                draggable: false, 
                position: q.fen,
                orientation: game.turn() === 'b' ? 'black' : 'white',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            
            // Re-bind clicks
            setTimeout(() => { 
                $('.square-55d63').off('click').on('click', handleSquareClick); 
            }, 50);
        }

        function handleSquareClick() {
            if (!canInteract) return;
            const sq = $(this).attr('data-square');
            
            if(!squareSelected) {
                const piece = game.get(sq);
                if(piece && piece.color === game.turn()) { 
                    squareSelected = sq; 
                    $(`.square-${sq}`).addClass('highlight-selected'); 
                }
            } else {
                const source = squareSelected;
                const target = sq;
                $('.square-55d63').removeClass('highlight-selected');
                squareSelected = null;

                const moveAttempt = game.move({ from: source, to: target, promotion: 'q' });
                if (moveAttempt === null) return; 

                const expectedMove = rushQueue[currentIdx].expectedMoves[0]; 
                
                canInteract = false; // Block inputs during transition
                
                if(moveAttempt.san === expectedMove || (source+target) === expectedMove || (source+target+'q') === expectedMove) {
                    // CORRECT
                    board.position(game.fen());
                    score++; 
                    updateScoreUI();
                    
                    const notif = document.getElementById('applause-notif');
                    notif.innerText = funnyComments[Math.floor(Math.random() * funnyComments.length)];
                    notif.style.opacity = '1';
                    $('#board-container').addClass('correct-flash');
                    
                    setTimeout(() => {
                        notif.style.opacity = '0';
                        $('#board-container').removeClass('correct-flash');
                        currentIdx++; 
                        loadPuzzle();
                    }, 600); // Very fast transition for rush
                } else {
                    // INCORRECT (Missed)
                    game.undo(); 
                    const notif = document.getElementById('encourage-notif');
                    notif.innerText = encouragingComments[Math.floor(Math.random() * encouragingComments.length)];
                    notif.style.opacity = '1';
                    $('#board-container').addClass('wrong-flash');
                    
                    setTimeout(() => {
                        notif.style.opacity = '0';
                        $('#board-container').removeClass('wrong-flash');
                        currentIdx++; 
                        loadPuzzle(); // Immediately jump to next without waiting
                    }, 800);
                }
            }
        }

        function updateScoreUI() {
            document.getElementById("current-score").innerText = score;
        }

        function updateTimerUI() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const display = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            const timerBox = document.getElementById("timer-display");
            timerBox.innerText = display;
            
            // Turn red in last 30 seconds
            if(timeLeft <= 30) { timerBox.style.color = "red"; }
        }

        // === END GAME & DATABASE ===
        async function endGame() {
            clearInterval(timerInterval);
            canInteract = false;
            
            document.getElementById("game-area").classList.add("hidden");
            document.getElementById("post-game").classList.remove("hidden");
            document.getElementById("final-points").innerText = score;

            // Save to Firebase
            try {
                // Using a separate collection for the arena
                await db.collection("puzzle_rush_scores").add({
                    name: pName,
                    class: pClass, 
                    avatar: pAvatar,
                    score: score,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (e) { console.error("Error saving score:", e); }
        }

        // === LEADERBOARD & PROFILES ===
        function fetchLeaderboard() {
            const listArea = document.getElementById('leaderboard-data');
            listArea.innerHTML = "Fetching Arena stats...";
            document.getElementById("leaderboard-modal").classList.remove("hidden");

            // Fetch top 50 scores
            db.collection("puzzle_rush_scores")
              .orderBy("score", "desc")
              .limit(50)
              .get()
              .then(snap => {
                let html = "";
                // To handle duplicates nicely, we keep track of highest score per player locally
                let bestScores = {};
                
                snap.forEach(d => {
                    let s = d.data();
                    let key = (s.name + "-" + s.class).toLowerCase();
                    if (!bestScores[key] || s.score > bestScores[key].score) {
                        bestScores[key] = {
                            name: s.name, class: s.class, avatar: s.avatar || '♟️', score: s.score
                        };
                    }
                });

                // Convert back to array and sort
                let sortedBest = Object.values(bestScores).sort((a,b) => b.score - a.score);

                sortedBest.forEach((s, index) => {
                    // Pass data safely to onclick function via data attributes or strings
                    const nameEscaped = s.name.replace(/'/g, "\\'");
                    const classEscaped = s.class ? s.class.replace(/'/g, "\\'") : '';
                    
                    html += `<div class="leaderboard-entry" onclick="showProfile('${nameEscaped}', '${classEscaped}', '${s.avatar}', ${s.score})">
                        <div class="leaderboard-left">
                            <span style="color: #94a3b8; font-size: 0.9em;">#${index+1}</span>
                            <div class="leaderboard-avatar">${s.avatar}</div>
                            <div>
                                <div style="font-weight:bold; color:white;">${s.name}</div>
                                <div style="font-size:0.8em; color:#94a3b8;">${s.class || 'No Class'}</div>
                            </div>
                        </div>
                        <div style="text-align:right; align-self:center;">
                            <span style="color:var(--accent); font-weight:900; font-size:1.3em;">
                                ${s.score}
                            </span>
                        </div>
                    </div>`;
                });
                listArea.innerHTML = html || "No arena runs recorded yet. Be the first!";
            }).catch(err => {
                console.error("Error fetching:", err);
                listArea.innerHTML = "Error loading data. Check internet connection.";
            });
        }

        function showProfile(name, pclass, avatar, score) {
            document.getElementById("leaderboard-modal").classList.add("hidden");
            document.getElementById("prof-avatar").innerText = avatar;
            document.getElementById("prof-name").innerText = name;
            document.getElementById("prof-class").innerText = pclass;
            document.getElementById("prof-score").innerText = score;
            document.getElementById("profile-modal").classList.remove("hidden");
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add("hidden");
        }
    </script>
</body>
</html>
