<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Hair & Beauty Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; }
        .gold-text { color: #D4AF37; }
        .gold-bg { background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); }
        .luxury-font { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="p-4 md:max-w-md mx-auto">

    <header class="py-10 text-center">
        <h1 class="luxury-font text-4xl gold-text tracking-widest uppercase">Elite Hair</h1>
        <p class="text-gray-400 text-xs tracking-tighter mt-2 italic">100% Raw Vietnamese & Cambodian Hair</p>
    </header>

    <div class="space-y-8">
        
        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
            <img src="https://images.unsplash.com/photo-1595475884199-2287431590e3?auto=format&fit=crop&w=800&q=80" alt="Bone Straight" class="w-full h-64 object-cover">
            <div class="p-5">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xl font-semibold">Super Double Drawn</h3>
                    <span class="text-xs bg-white text-black px-2 py-1 rounded-full font-bold uppercase">Best Seller</span>
                </div>
                <p class="text-gray-400 text-sm mb-4">Bone Straight • 22 Inches • 3 Bundles + Closure</p>
                <div class="flex items-center justify-between mb-4">
                    <span class="text-2xl font-bold gold-text">₦285,000</span>
                </div>
                <button onclick="sendOrder('Bone Straight 22 Inch', '285,000')" class="w-full gold-bg text-black font-extrabold py-4 rounded-2xl hover:scale-95 transition-transform flex items-center justify-center gap-2">
                    ORDER VIA WHATSAPP
                </button>
            </div>
        </div>

        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
            <img src="https://images.unsplash.com/photo-1634449507606-570493e73452?auto=format&fit=crop&w=800&q=80" alt="Bouncy Curls" class="w-full h-64 object-cover">
            <div class="p-5">
                <h3 class="text-xl font-semibold mb-1 text-white">Bouncy Kim K Curls</h3>
                <p class="text-gray-400 text-sm mb-4">Water Wave • 14 Inches • HD Frontal Wig</p>
                <div class="flex items-center justify-between mb-4">
                    <span class="text-2xl font-bold gold-text">₦145,000</span>
                </div>
                <button onclick="sendOrder('Bouncy Kim K Curls', '145,000')" class="w-full gold-bg text-black font-extrabold py-4 rounded-2xl hover:scale-95 transition-transform flex items-center justify-center gap-2">
                    ORDER VIA WHATSAPP
                </button>
            </div>
        </div>

    </div>

    <footer class="mt-12 text-center text-gray-500 text-[10px] pb-10 uppercase tracking-widest">
        Designed by YourName • Optimized for Mobile
    </footer>

    <script>
        function sendOrder(name, price) {
            const phone = "2348025028105"; 
            const text = `Hello! I want to order the ${name} for ₦${price}. Is it available for delivery?`;
            const encodedText = encodeURIComponent(text);
            window.location.href = `https://wa.me/${phone}?text=${encodedText}`;
        }
    </script>
</body>
</html>
