<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Quest: The Purple Kingdom</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #4b0082, #2e8b57);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 { text-shadow: 2px 2px #000; margin-bottom: 10px; }

        #game-container {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 450px;
        }

        #board { width: 400px; margin: 0 auto; border: 5px solid #9370DB; border-radius: 5px; }

        .status-box {
            margin-top: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #message { color: #ffd700; height: 1.5em; }

        .quest-stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        button {
            background-color: #32CD32;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { background-color: #9370DB; }
    </style>
</head>
<body>

    <h1>Elo's Chess Quest 🛡️</h1>

    <div id="game-container">
        <div class="quest-stats">
            <span>Puzzle: <span id="current-puzzle">1</span>/30</span>
            <span>Score: <span id="score">0</span></span>
        </div>

        <div id="board"></div>

        <div class="status-box">
            <p id="instruction">Find the best move!</p>
            <p id="message">Welcome, Young Knight!</p>
            <button onclick="nextPuzzle()">Skip to Next Puzzle</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var currentIdx = 0;
        var score = 0;

        // Sample Puzzle Data (FEN position and the correct move in SAN)
        // You can add up to 30 puzzles here!
        const puzzles = [
            { fen: 'r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4', solution: 'Qxf7#', hint: 'Checkmate in one with the Queen!' },
            { fen: 'rnbqkbnr/ppppp1pp/8/5p1Q/4P3/8/PPPP1PPP/RNB1KBNR b KQkq - 1 2', solution: 'g6', hint: 'Block the check with a pawn!' },
            { fen: 'r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4', solution: 'O-O', hint: 'Get your King to safety (Castle)!' },
            { fen: '4r1k1/5ppp/8/8/8/8/5PPP/4R1K1 w - - 0 1', solution: 'Rxe8#', hint: 'Back rank checkmate!' },
            { fen: 'rnb1kbnr/pppp1ppp/8/4p3/6Pq/5P2/PPPPP2P/RNBQKBNR w KQkq - 1 3', solution: 'None', hint: 'Oh no! You got fooled. This is Fool\'s Mate.' }
        ];

        function onSnapEnd() {
            board.position(game.fen());
        }

        function makeMove(source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' 
            });

            if (move === null) return 'snapback';

            // Check if move matches solution
            if (move.san === puzzles[currentIdx].solution || (move.from + move.to) === puzzles[currentIdx].solution) {
                document.getElementById('message').innerText = "🌟 AMAZING! You found it!";
                score += 10;
                document.getElementById('score').innerText = score;
                setTimeout(nextPuzzle, 1500);
            } else {
                document.getElementById('message').innerText = "❌ Try again! " + puzzles[currentIdx].hint;
                game.undo();
                return 'snapback';
            }
        }

        function nextPuzzle() {
            currentIdx++;
            if (currentIdx >= puzzles.length) {
                document.getElementById('message').innerText = "🏆 QUEST COMPLETE! You are a Master!";
                return;
            }
            document.getElementById('current-puzzle').innerText = currentIdx + 1;
            document.getElementById('message').innerText = "New Challenge!";
            loadPuzzle();
        }

        function loadPuzzle() {
            game.load(puzzles[currentIdx].fen);
            board.position(puzzles[currentIdx].fen);
        }

        var config = {
            draggable: true,
            dropOffBoard: 'snapback',
            position: 'start',
            onDrop: makeMove,
            onSnapEnd: onSnapEnd
        };

        board = ChessBoard('board', config);
        loadPuzzle();

    </script>
</body>
</html>
