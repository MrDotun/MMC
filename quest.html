<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quest Arena | Mind Masters</title>

    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.1/dist/chessboard-1.0.1.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.1/dist/chessboard-1.0.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

    <style>
        :root { --bg: #1a1a2e; --panel: #2D1B4D; --green: #4ade80; --yellow: #FFEA00; }
        
        body { 
            background-color: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100vh;
            overflow: hidden;
        }

        .quest-container { 
            width: 90%; 
            max-width: 400px; 
            background: var(--panel); 
            border: 3px solid var(--green); 
            border-radius: 20px; 
            padding: 15px; 
            margin-top: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Stats & Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .lvl-tag { color: var(--green); font-weight: bold; font-size: 14px; }
        
        /* Board UI */
        #myBoard { 
            width: 100%; 
            margin: 10px 0; 
            border: 2px solid white; 
            border-radius: 5px; 
            touch-action: none; /* Prevents scrolling while playing */
        }

        /* Custom Click Highlights */
        .highlight-sq { box-shadow: inset 0 0 5px 5px var(--yellow) !important; }

        .status-msg { text-align: center; color: var(--yellow); font-weight: bold; font-size: 13px; margin: 5px 0; min-height: 1.2em; }
        
        .btn { 
            background: var(--green); 
            color: #1a1a2e; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            border-radius: 10px; 
            font-weight: bold; 
            text-transform: uppercase;
            cursor: pointer;
        }

        .xp-bar { background: #000; height: 8px; border-radius: 4px; margin-bottom: 10px; overflow: hidden; }
        .xp-fill { height: 100%; background: var(--green); width: 0%; transition: width 0.5s; }

        /* Victory Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: var(--panel); border: 3px solid var(--green); padding: 25px; border-radius: 20px; text-align: center; width: 80%; }
    </style>
</head>
<body>

    <div class="quest-container">
        <div class="header">
            <div id="lvl-txt" class="lvl-tag">LVL 1 PAWN</div>
            <div style="font-size: 16px;">🔥 <span id="streak-txt" style="color:var(--yellow)">1</span></div>
        </div>

        <div class="xp-bar"><div id="xp-fill" class="xp-fill"></div></div>
        <div class="status-msg" id="status">TAP A PIECE</div>
        
        <div id="myBoard"></div>
        
        <button class="btn" onclick="loadNewPuzzle()">Skip Mission</button>
    </div>

    <div id="v-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--green); margin: 0;">AWESOME!</h2>
            <div style="font-size: 50px; margin: 10px 0;">🏆</div>
            <p>Puzzle Solved! +25 XP</p>
            <button class="btn" onclick="closeVictory()">CONTINUE</button>
        </div>
    </div>

    <script>
        let board = null;
        let game = new Chess();
        let selectedSquare = null;
        let currentPuzzle = null;

        const puzzles = [
            { name: "Smothered Guard", fen: "6rk/6pp/8/8/8/8/5NPP/7K w - - 0 1", move: "f2f7" },
            { name: "Back Rank Mate", fen: "6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1", move: "d1d8" },
            { name: "The Sniper", fen: "1k6/8/8/8/8/8/1B6/1R5K w - - 0 1", move: "b2e5" }
        ];

        let state = JSON.parse(localStorage.getItem('mindMastersQuest')) || { xp: 0, level: 1, streak: 1 };

        function onSquareClick(square) {
            // First click: Selection
            if (selectedSquare === null) {
                let piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                    document.getElementById('status').innerText = "TAP TARGET SQUARE";
                }
                return;
            }

            // Second click: Move
            let move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
            
            if (move === null) {
                // If clicked another piece of same color, change selection
                let piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    $('.square-55d63').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                } else {
                    selectedSquare = null;
                    $('.square-55d63').removeClass('highlight-sq');
                }
            } else {
                // Move is legal
                board.position(game.fen());
                if ((move.from + move.to) === currentPuzzle.move) {
                    setTimeout(victory, 250);
                } else {
                    document.getElementById('status').innerText = "TRY AGAIN!";
                    setTimeout(() => { 
                        game.undo(); 
                        board.position(game.fen()); 
                    }, 600);
                }
                selectedSquare = null;
                $('.square-55d63').removeClass('highlight-sq');
            }
        }

        function victory() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.7 } });
            state.xp += 25;
            if (state.xp >= 100) { state.level++; state.xp = 0; }
            localStorage.setItem('mindMastersQuest', JSON.stringify(state));
            document.getElementById('v-modal').style.display = 'flex';
        }

        function loadNewPuzzle() {
            currentPuzzle = puzzles[Math.floor(Math.random() * puzzles.length)];
            game.load(currentPuzzle.fen);
            board.position(currentPuzzle.fen);
            document.getElementById('status').innerText = "MISSION: " + currentPuzzle.name;
            selectedSquare = null;
            $('.square-55d63').removeClass('highlight-sq');
        }

        function closeVictory() {
            document.getElementById('v-modal').style.display = 'none';
            updateUI();
            loadNewPuzzle();
        }

        function updateUI() {
            document.getElementById('lvl-txt').innerText = `LVL ${state.level} PAWN`;
            document.getElementById('xp-fill').style.width = state.xp + "%";
            document.getElementById('streak-txt').innerText = state.streak;
        }

        // Initialize Board
        board = Chessboard('myBoard', {
            position: 'start',
            draggable: false, // Click-to-move only
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        // Robust Click Handler
        $(document).on('click', '.square-55d63', function() {
            let square = $(this).data('square');
            onSquareClick(square);
        });

        $(window).resize(board.resize);
        updateUI();
        loadNewPuzzle();
    </script>
</body>
</html>
