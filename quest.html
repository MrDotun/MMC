<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elo's Chess Quest 🛡️</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #4b0082, #2e8b57);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }

        h1 { text-shadow: 2px 2px #000; margin: 10px 0; font-size: 1.8rem; }

        #game-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 95%;
            max-width: 420px;
        }

        .highlight-sq { box-shadow: inset 0 0 3px 3px yellow; }

        #board { width: 100%; border: 4px solid #9370DB; border-radius: 5px; }

        .status-box {
            margin-top: 15px;
            text-align: center;
            font-size: 1.1rem;
        }

        #message { color: #ffd700; height: 1.5em; font-weight: bold; }

        .quest-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }

        button {
            background-color: #32CD32;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 10px;
            width: 100%;
        }

        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <h1>Elo's Chess Quest 🛡️</h1>

    <div id="game-container">
        <div class="quest-stats">
            <span>Level: <span id="current-puzzle">1</span>/30</span>
            <span>⭐ Score: <span id="score">0</span></span>
        </div>

        <div id="board"></div>

        <div class="status-box">
            <p id="message">Click a piece to start!</p>
            <button onclick="nextPuzzle()">Skip Challenge</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var currentIdx = 0;
        var score = 0;
        var sourceSquare = null;

        // Corrected Puzzles
        const puzzles = [
            { fen: 'r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4', solution: 'O-O', hint: 'Jump your King to the side (Castle)!' },
            { fen: 'r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4', solution: 'Qxf7#', hint: 'Use your Queen to checkmate on f7!' }, // Corrected Level 2
            { fen: 'rnbqkbnr/ppppp1pp/8/5p1Q/4P3/8/PPPP1PPP/RNB1KBNR b KQkq - 1 2', solution: 'g6', hint: 'Move a pawn to block the Queen!' },
            { fen: '4r1k1/5ppp/8/8/8/8/5PPP/4R1K1 w - - 0 1', solution: 'Rxe8#', hint: 'The back row is empty!' },
            { fen: 'r1b1kbnr/pppp1ppp/2n5/4p3/2B1P2q/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4', solution: 'Nxh4', hint: 'Take their Queen with your Knight!' },
            { fen: 'rnbqkbnr/pp2pppp/3p4/2p5/2P5/2N5/PP1PPPPP/R1BQKBNR w KQkq - 0 3', solution: 'e4', hint: 'Take control of the center!' },
            { fen: 'r1b1k1nr/pppp1ppp/2n5/2b1p3/2B1P2q/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4', solution: 'Nxh4', hint: 'The Black Queen is hanging! Take it!' }, // Corrected Level 7
            { fen: 'rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 1 2', solution: 'Nc6', hint: 'Defend your pawn with your Knight!' },
            { fen: 'rnbqkbnr/pppp1ppp/8/8/3P4/8/PPP1PPPP/RNBQKBNR b KQkq - 0 1', solution: 'd5', hint: 'Match their center pawn!' },
            { fen: 'r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3', solution: 'a6', hint: 'Kick that Bishop away!' },
            { fen: 'rnbqkb1r/pppp1ppp/5n2/4p3/4P3/2N5/PPPP1PPP/R1BQKBNR w KQkq - 2 3', solution: 'Bc4', hint: 'Develop your Bishop!' },
            { fen: '2kr1bnr/ppp2ppp/2n5/3pp3/8/2N1P3/PPPP1PPP/R1B1KBNR w KQ - 0 1', solution: 'O-O-O', hint: 'Castle on the long side!' },
            { fen: 'rnbqkbnr/pp1p1ppp/8/2p1p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 0 3', solution: 'Nxe5', hint: 'Free pawn! Snap it up!' },
            { fen: 'rnbqk1nr/pppp1ppp/8/4p3/1b1PP3/2N5/PPP2PPP/R1BQKBNR b KQkq - 2 3', solution: 'exd4', hint: 'Take the center pawn!' },
            { fen: 'r1bqkbnr/pppp1ppp/n7/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3', solution: 'Bxa6', hint: 'Take the Knight and mess up their pawns!' },
            { fen: 'rnbqkbnr/ppp1pppp/8/3p4/8/2N5/PPPPPPPP/R1BQKBNR w KQkq - 0 2', solution: 'd4', hint: 'Claim the middle!' },
            { fen: 'r1bqkbnr/pppp1ppp/2n5/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq - 0 3', solution: 'exd4', hint: 'It is a pawn trade!' },
            { fen: '2r3k1/5ppp/8/8/8/8/5PPP/2R3K1 w - - 0 1', solution: 'Rxc8#', hint: 'Checkmate on the back rank!' },
            { fen: 'rnbqkbnr/pp1ppppp/2p5/8/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2', solution: 'd4', hint: 'Take the full center!' },
            { fen: 'rnbqkb1r/pppp1ppp/4pn2/8/3P4/5N2/PPP1PPPP/RNBQKB1R w KQkq - 2 3', solution: 'c4', hint: 'Start the Queen\'s Gambit!' },
            { fen: 'r1bqkbnr/pp1p1ppp/2n5/2p1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 2 4', solution: 'd3', hint: 'Protect your pawn.' },
            { fen: 'rnbqkb1r/ppp1pppp/5n2/3p4/2PP4/8/PP2PPPP/RNBQKBNR w KQkq - 1 3', solution: 'cxd5', hint: 'Trade pawns in the middle!' },
            { fen: 'rnbqkbnr/pp3ppp/2p1p3/3p4/3PP3/5N2/PPP2PPP/RNBQKB1R w KQkq - 0 4', solution: 'e5', hint: 'Push the pawn forward!' },
            { fen: 'rnbqkbnr/ppp2ppp/4p3/3p4/3PP3/8/PPP2PPP/RNBQKBNR w KQkq - 0 3', solution: 'Nc3', hint: 'Protect the center with your Knight!' },
            { fen: 'rnbqkbnr/pp2pppp/2p5/3p4/3PP3/8/PPP2PPP/RNBQKBNR w KQkq - 0 3', solution: 'exd5', hint: 'Exchange the pawns!' },
            { fen: '4r1k1/5ppp/8/8/8/8/5PPP/4R1K1 w - - 0 1', solution: 'Rxe8#', hint: 'Checkmate the King on the back row!' }, // Corrected Level 26
            { fen: 'rnbqkbnr/pppp1ppp/8/8/3P4/2N5/PPP1PPPP/R1BQKBNR b KQkq - 1 2', solution: 'd5', hint: 'Control the center!' },
            { fen: 'r1bqkbnr/pppp1ppp/2n5/4p3/4P3/2N5/PPPP1PPP/R1BQKBNR w KQkq - 2 3', solution: 'f4', hint: 'The Vienna Gambit!' },
            { fen: 'rnbqkb1r/pppp1ppp/5n2/4p3/2B1P3/8/PPPP1PPP/RNBQK1NR b KQkq - 3 3', solution: 'Nxe4', hint: 'A sneaky free pawn!' },
            { fen: 'k7/8/K7/1R6/8/8/8/8 w - - 0 1', solution: 'Rb6', hint: 'Move your Rook to b6 to wait!' }
        ];

        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight-sq');
        }

        function onSquareClick(square) {
            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    sourceSquare = square;
                    $( '#board .square-' + square ).addClass('highlight-sq');
                }
            } else {
                var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                removeHighlights();
                if (move === null) {
                    sourceSquare = null;
                    onSquareClick(square);
                    return;
                }
                board.position(game.fen());
                checkSolution(move);
                sourceSquare = null;
            }
        }

        function checkSolution(move) {
            let userMove = move.san;
            let correctMove = puzzles[currentIdx].solution;
            if (userMove === correctMove || (move.from + move.to) === correctMove) {
                document.getElementById('message').innerText = "🌟 FANTASTIC! +10 Points!";
                score += 10;
                document.getElementById('score').innerText = score;
                setTimeout(nextPuzzle, 1500);
            } else {
                document.getElementById('message').innerText = "❌ Oops! " + puzzles[currentIdx].hint;
                setTimeout(() => { game.undo(); board.position(game.fen()); }, 1000);
            }
        }

        function nextPuzzle() {
            currentIdx++;
            if (currentIdx >= puzzles.length) {
                document.getElementById('message').innerText = "🏆 YOU ARE A CHESS MASTER!";
                return;
            }
            document.getElementById('current-puzzle').innerText = currentIdx + 1;
            document.getElementById('message').innerText = "New Quest Unlocked!";
            loadPuzzle();
        }

        function loadPuzzle() {
            game.load(puzzles[currentIdx].fen);
            board.position(puzzles[currentIdx].fen);
        }

        var config = {
            draggable: false, 
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };

        board = ChessBoard('board', config);
        loadPuzzle();

        $(document).on('click', '.square-55d63', function() {
            var square = $(this).attr('data-square');
            onSquareClick(square);
        });
    </script>
</body>
</html>
