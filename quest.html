<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Arena | Mind Masters</title>

    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

    <style>
        :root { --bg: #1a1a2e; --panel: #2D1B4D; --green: #4ade80; --yellow: #FFEA00; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .quest-container { width: 100%; max-width: 420px; background: var(--panel); border: 3px solid var(--green); border-radius: 25px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        
        /* Highlight Square Style */
        .highlight-sq { box-shadow: inset 0 0 3px 3px var(--yellow); }
        
        #myBoard { width: 100%; margin: 15px 0; border: 2px solid white; border-radius: 8px; }
        .status-msg { text-align: center; color: var(--yellow); font-weight: bold; margin-bottom: 10px; font-size: 14px; height: 20px; }
        .btn { background: var(--green); color: #1a1a2e; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        .xp-bar { background: #000; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 15px; border: 1px solid #444; }
        .xp-fill { height: 100%; background: var(--green); width: 0%; transition: width 0.5s; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--panel); border: 4px solid var(--green); padding: 30px; border-radius: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="quest-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div id="lvl-txt" style="color: var(--green); font-weight: bold;">LVL 1 PAWN</div>
            <div style="font-size: 20px;">🔥 <span id="streak-txt" style="color:var(--yellow)">1</span></div>
        </div>

        <div class="xp-bar"><div id="xp-fill" class="xp-fill"></div></div>
        
        <div class="status-msg" id="status">SELECT A PIECE</div>
        <div id="myBoard"></div>
        
        <button class="btn" onclick="loadNewPuzzle()">SKIP TO NEXT MISSION</button>
    </div>

    <div id="victory-modal" class="modal">
        <div class="modal-content">
            <h1 style="color: var(--green);">EXCELLENT MOVE!</h1>
            <div style="font-size: 50px;">🌟</div>
            <p>Puzzle Solved! +25 XP</p>
            <button class="btn" onclick="closeVictory()">CONTINUE QUEST</button>
        </div>
    </div>

    <script>
        let board = null;
        let game = new Chess();
        let selectedSquare = null;
        
        const puzzles = [
            { name: "Back Rank Mate", fen: "6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1", move: "d1d8" },
            { name: "Smothered Guard", fen: "6rk/6pp/8/8/8/8/5NPP/7K w - - 0 1", move: "f2f7" },
            { name: "Discovery Attack", fen: "r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 1", move: "f3e5" }
        ];

        let state = JSON.parse(localStorage.getItem('mindMastersQuest')) || { xp: 0, level: 1, streak: 1 };

        function removeHighlights() {
            $('#myBoard .square-55d63').removeClass('highlight-sq');
        }

        function onSquareClick(square) {
            // First click: Selecting a piece
            if (selectedSquare === null) {
                let piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    $('#myBoard .square-' + square).addClass('highlight-sq');
                    document.getElementById('status').innerText = "WHERE WILL IT MOVE?";
                }
                return;
            }

            // Second click: Moving the piece
            let move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
            
            if (move === null) {
                // If clicked another of our own pieces, switch selection
                let piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    removeHighlights();
                    selectedSquare = square;
                    $('#myBoard .square-' + square).addClass('highlight-sq');
                } else {
                    removeHighlights();
                    selectedSquare = null;
                    document.getElementById('status').innerText = "SELECT A PIECE";
                }
            } else {
                // Check if move matches current puzzle solution
                let moveMade = move.from + move.to;
                if (moveMade === currentPuzzle.move) {
                    success();
                } else {
                    document.getElementById('status').innerText = "NOT QUITE! TRY AGAIN.";
                    setTimeout(() => { game.undo(); board.position(game.fen()); }, 500);
                }
                removeHighlights();
                selectedSquare = null;
            }
        }

        function success() {
            confetti({ particleCount: 100, spread: 70, colors: ['#4ade80', '#FFEA00'] });
            state.xp += 25;
            if (state.xp >= 100) { state.level++; state.xp = 0; }
            localStorage.setItem('mindMastersQuest', JSON.stringify(state));
            document.getElementById('victory-modal').style.display = 'flex';
        }

        function loadNewPuzzle() {
            currentPuzzle = puzzles[Math.floor(Math.random() * puzzles.length)];
            game.load(currentPuzzle.fen);
            board.position(currentPuzzle.fen);
            document.getElementById('status').innerText = "MISSION: " + currentPuzzle.name;
            selectedSquare = null;
            removeHighlights();
        }

        function closeVictory() {
            document.getElementById('victory-modal').style.display = 'none';
            updateUI();
            loadNewPuzzle();
        }

        function updateUI() {
            document.getElementById('lvl-txt').innerText = `LVL ${state.level} PAWN`;
            document.getElementById('xp-fill').style.width = state.xp + "%";
            document.getElementById('streak-txt').innerText = state.streak;
        }

        // Initialize Board with Piece Theme from Wikimedia
        board = Chessboard('myBoard', {
            position: 'start',
            draggable: false, // Set to false for Click-to-Move
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onSquareClick: onSquareClick
        });

        $(window).resize(board.resize);
        updateUI();
        loadNewPuzzle();
    </script>
</body>
</html>
