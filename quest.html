<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Arena | Mind Masters</title>

    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.1/dist/chessboard-1.0.1.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.1/dist/chessboard-1.0.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

    <style>
        :root { --bg: #1a1a2e; --panel: #2D1B4D; --green: #4ade80; --yellow: #FFEA00; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        .quest-container { width: 95%; max-width: 420px; background: var(--panel); border: 3px solid var(--green); border-radius: 25px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); margin-top: 10px; }
        
        /* Highlight Square Style */
        .highlight-white { background-color: rgba(255, 234, 0, 0.6) !important; }
        .highlight-black { background-color: rgba(255, 234, 0, 0.4) !important; }
        
        #myBoard { width: 100%; margin: 15px 0; border: 2px solid white; border-radius: 8px; }
        .status-msg { text-align: center; color: var(--yellow); font-weight: bold; margin-bottom: 10px; font-size: 14px; min-height: 20px; text-transform: uppercase; }
        .btn { background: var(--green); color: #1a1a2e; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 14px; }
        
        .xp-bar { background: #000; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 15px; border: 1px solid #444; }
        .xp-fill { height: 100%; background: var(--green); width: 0%; transition: width 0.5s; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--panel); border: 4px solid var(--green); padding: 30px; border-radius: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="quest-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div id="lvl-txt" style="color: var(--green); font-weight: bold; letter-spacing: 1px;">LVL 1 PAWN</div>
            <div style="font-size: 18px;">🔥 <span id="streak-txt" style="color:var(--yellow)">1</span></div>
        </div>

        <div class="xp-bar"><div id="xp-fill" class="xp-fill"></div></div>
        
        <div class="status-msg" id="status">TAP A PIECE TO BEGIN</div>
        <div id="myBoard"></div>
        
        <button class="btn" onclick="loadNewPuzzle()">SKIP MISSION</button>
    </div>

    <div id="victory-modal" class="modal">
        <div class="modal-content">
            <h1 style="color: var(--green);">MISSION SOLVED!</h1>
            <div style="font-size: 60px; margin: 15px 0;">🌟</div>
            <p>You earned +25 XP!</p>
            <button class="btn" onclick="closeVictory()">NEXT MISSION</button>
        </div>
    </div>

    <script>
        var board = null;
        var game = new Chess();
        var selectedSquare = null;
        var currentPuzzle = null;

        // Corrected Puzzles to match your screenshots
        const puzzles = [
            { name: "Smothered Guard", fen: "6rk/6pp/8/8/8/8/5NPP/7K w - - 1 1", move: "f2f7" },
            { name: "Discovery Attack", fen: "r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 1", move: "f3e5" },
            { name: "Back Rank Mate", fen: "6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1", move: "d1d8" }
        ];

        let state = JSON.parse(localStorage.getItem('mindMastersQuest')) || { xp: 0, level: 1, streak: 1 };

        function removeHighlights() {
            $('#myBoard .square-55d63').removeClass('highlight-white highlight-black');
        }

        function onSquareClick(square) {
            // 1. If no piece selected yet
            if (selectedSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    var isWhite = $('#myBoard .square-' + square).hasClass('white-1e1d7');
                    $('#myBoard .square-' + square).addClass(isWhite ? 'highlight-white' : 'highlight-black');
                    document.getElementById('status').innerText = "TAP TARGET SQUARE";
                }
                return;
            }

            // 2. If clicking the SAME square, deselect
            if (selectedSquare === square) {
                removeHighlights();
                selectedSquare = null;
                document.getElementById('status').innerText = "TAP A PIECE";
                return;
            }

            // 3. Try to move
            var move = game.move({ from: selectedSquare, to: square, promotion: 'q' });

            if (move === null) {
                // Check if we clicked another of our own pieces instead
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    removeHighlights();
                    selectedSquare = square;
                    var isWhite = $('#myBoard .square-' + square).hasClass('white-1e1d7');
                    $('#myBoard .square-' + square).addClass(isWhite ? 'highlight-white' : 'highlight-black');
                }
            } else {
                // Move is legal - check if it's the solution
                board.position(game.fen());
                if ((move.from + move.to) === currentPuzzle.move) {
                    setTimeout(success, 250);
                } else {
                    document.getElementById('status').innerText = "WRONG MOVE! TRY AGAIN.";
                    setTimeout(() => { 
                        game.undo(); 
                        board.position(game.fen()); 
                        document.getElementById('status').innerText = "TAP A PIECE";
                    }, 800);
                }
                removeHighlights();
                selectedSquare = null;
            }
        }

        function success() {
            confetti({ particleCount: 150, spread: 70, colors: ['#4ade80', '#FFEA00'] });
            state.xp += 25;
            if (state.xp >= 100) { state.level++; state.xp = 0; }
            localStorage.setItem('mindMastersQuest', JSON.stringify(state));
            document.getElementById('victory-modal').style.display = 'flex';
        }

        function loadNewPuzzle() {
            currentPuzzle = puzzles[Math.floor(Math.random() * puzzles.length)];
            game.load(currentPuzzle.fen);
            board.position(currentPuzzle.fen);
            document.getElementById('status').innerText = "MISSION: " + currentPuzzle.name;
            selectedSquare = null;
            removeHighlights();
        }

        function closeVictory() {
            document.getElementById('victory-modal').style.display = 'none';
            updateUI();
            loadNewPuzzle();
        }

        function updateUI() {
            let ranks = ["PAWN", "KNIGHT", "BISHOP", "ROOK", "QUEEN", "KING"];
            let rankLabel = ranks[(state.level - 1) % 6];
            document.getElementById('lvl-txt').innerText = `LVL ${state.level} ${rankLabel}`;
            document.getElementById('xp-fill').style.width = state.xp + "%";
            document.getElementById('streak-txt').innerText = state.streak;
        }

        // Configuration
        board = Chessboard('myBoard', {
            draggable: false, // Disabling drag for pure click-to-move
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        // Add Click Listener directly to the board container
        $('#myBoard').on('click', '.square-55d63', function() {
            var square = $(this).attr('data-square');
            onSquareClick(square);
        });

        $(window).resize(board.resize);
        updateUI();
        loadNewPuzzle();
    </script>
</body>
</html>
