<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECIPHER HYBRID V3 | GM Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .variation-card { border-left: 4px solid #334155; transition: 0.3s; }
        .variation-card:hover { border-left-color: #d4af37; background: rgba(30, 41, 59, 0.6); }
        textarea, input { background: #0f172a !important; border: 1px solid #1e293b !important; font-family: 'Fira Code', monospace; }
        textarea:focus, input:focus { border-color: #d4af37 !important; outline: none; box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 flex justify-between items-end border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-4xl font-black tracking-tighter italic gold-text">HYBRID <span class="text-white not-italic">V3 ENGINE</span></h1>
                <p class="text-slate-500 text-xs uppercase tracking-[0.3em] mt-1">Anchor Context + Multi-Branch Annotation</p>
            </div>
            <nav class="flex bg-slate-900/50 p-1 rounded-xl border border-slate-800">
                <button onclick="showTab('fragmenter')" id="btn-f" class="px-8 py-2.5 rounded-lg text-xs font-bold uppercase gold-bg transition-all">1. Fragmenter</button>
                <button onclick="showTab('reassembler')" id="btn-r" class="px-8 py-2.5 rounded-lg text-xs font-bold uppercase text-slate-500 hover:text-white transition-all">2. Reassembler</button>
            </nav>
        </header>

        <!-- FRAGMENTER VIEW -->
        <div id="view-fragmenter" class="space-y-8">
            <div class="glass p-8 rounded-3xl">
                <!-- MAIN LINE ANCHOR FIELD -->
                <div class="mb-6">
                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Main Line Anchor (Fixed Context)</label>
                    <input id="anchor-pgn" type="text" class="w-full p-4 mt-2 rounded-xl text-xs gold-text" 
                    placeholder="e.g., 1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Ba4 Nf6 5. O-O Be7">
                </div>

                <div class="flex justify-between items-center mb-4">
                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Branch PGN Input</label>
                    <span id="game-stats" class="text-[10px] gold-text font-bold uppercase">Ready</span>
                </div>
                <textarea id="main-pgn" rows="8" class="w-full p-6 rounded-2xl text-sm mb-6 shadow-inner" placeholder="Paste the specific branch or chapter moves here..."></textarea>
                
                <div class="flex gap-4">
                    <button onclick="processHybrid()" class="px-10 py-4 bg-white text-black font-black rounded-xl hover:bg-slate-200 uppercase text-xs tracking-widest transition-all">Generate GM Prompts</button>
                    <button onclick="clearState()" class="px-6 py-4 bg-red-950/20 text-red-400 font-bold rounded-xl border border-red-900/30 uppercase text-xs">Reset</button>
                </div>
            </div>

            <div id="variation-output" class="grid grid-cols-1 gap-6"></div>
        </div>

        <!-- REASSEMBLER VIEW -->
        <div id="view-reassembler" class="hidden">
            <div class="glass p-8 rounded-3xl grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-4">
                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">AI JSON Input</label>
                    <textarea id="ai-json" rows="18" class="w-full p-6 rounded-2xl text-xs" placeholder="Paste Gemini JSON blocks here..."></textarea>
                </div>
                <div class="space-y-4">
                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Rebuilt PGN Output</label>
                    <textarea id="final-pgn" rows="18" class="w-full p-6 rounded-2xl text-xs text-emerald-400" readonly></textarea>
                    <div class="flex gap-4">
                        <button onclick="copyToClipboard('final-pgn')" class="flex-1 py-4 bg-slate-800 text-xs font-bold rounded-xl uppercase tracking-widest hover:bg-slate-700">Copy Result</button>
                        <button onclick="downloadPgn()" class="flex-1 py-4 bg-emerald-600 text-white text-xs font-bold rounded-xl uppercase tracking-widest hover:bg-emerald-500 shadow-lg shadow-emerald-900/20">Download .PGN</button>
                    </div>
                </div>
            </div>
            <button onclick="rebuild()" class="w-full mt-6 py-5 gold-bg rounded-2xl font-black uppercase tracking-[0.2em] shadow-xl shadow-yellow-900/20">Inject Comments & Synthesize File</button>
        </div>
    </div>

    <script>
        let globalTokens = [];
        let allChunks = [];

        function showTab(tab) {
            document.getElementById('view-fragmenter').classList.toggle('hidden', tab !== 'fragmenter');
            document.getElementById('view-reassembler').classList.toggle('hidden', tab !== 'reassembler');
            document.getElementById('btn-f').className = tab === 'fragmenter' ? 'px-8 py-2.5 rounded-lg text-xs font-bold uppercase gold-bg' : 'px-8 py-2.5 rounded-lg text-xs font-bold uppercase text-slate-500 hover:text-white';
            document.getElementById('btn-r').className = tab === 'reassembler' ? 'px-8 py-2.5 rounded-lg text-xs font-bold uppercase gold-bg' : 'px-8 py-2.5 rounded-lg text-xs font-bold uppercase text-slate-500 hover:text-white';
        }

        function processHybrid() {
            const input = document.getElementById('main-pgn').value;
            if (!input) return;

            globalTokens = input.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|[a-zA-Z0-9\-+=#$?!/]+)/g) || [];
            allChunks = [];

            let moveCounter = 0;
            globalTokens.forEach((token, idx) => {
                const isMove = /^[a-zA-Z]/.test(token) && !token.startsWith('{') && !token.startsWith('[');
                if (isMove) {
                    moveCounter++;
                    const hasSymbol = token.includes('!') || token.includes('?') || (globalTokens[idx+1] && globalTokens[idx+1].startsWith('$'));
                    
                    if (moveCounter % 4 === 0 || hasSymbol || moveCounter < 10) {
                        allChunks.push({
                            id: `GM_${allChunks.length + 1}`,
                            target: token,
                            idx: idx,
                            context: globalTokens.slice(Math.max(0, idx - 12), idx).join(' '),
                            subsequent: globalTokens.slice(idx + 1, idx + 12).join(' ')
                        });
                    }
                }
            });

            renderVariations();
            document.getElementById('game-stats').innerText = `${allChunks.length} Key Positions Found`;
        }

        function createPrompt(batch) {
            const anchor = document.getElementById('anchor-pgn').value || "1. e4 e5 2. Nf3 Nc6 3. Bb5";
            const body = batch.map(b => `ID: ${b.id}\nContext: ${b.context}\nTARGET: ${b.target}\nSubsequent: ${b.subsequent}`).join('\n---\n');
            
            return `Pretend you're a 2600+ human GM writing a professional course on the Ruy Lopez for White. 
Annotate this branch.

Main Line Anchor (Game Context):
${anchor}

Task: Annotate these specific target moves.

Rules: 
- Translation: If a move has a symbol (e.g., $16, ±, ?!), explain the structural reason why.
- Comparisons: If a variation is in parentheses (), explain why it is better or worse than the main move.
- Vocabulary: Use "center", "structure", "exchange", "prophylactic", "initiative".
- BANNED WORDS: Strictly do NOT use "central", "structural", or "liquidate".
- Format: JSON ONLY.

${body}`;
        }

        function renderVariations() {
            const container = document.getElementById('variation-output');
            container.innerHTML = '<h2 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-4">Fragmented GM Batches</h2>';

            const batchSize = 10;
            for (let i = 0; i < allChunks.length; i += batchSize) {
                const batch = allChunks.slice(i, i + batchSize);
                const card = document.createElement('div');
                card.className = 'variation-card glass p-6 rounded-2xl';
                
                const promptText = createPrompt(batch);
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[10px] font-bold gold-text uppercase">Batch ${Math.floor(i/10) + 1}</span>
                        <button onclick="copyRaw('${btoa(unescape(encodeURIComponent(promptText)))}')" class="text-[10px] bg-white text-black px-4 py-1.5 rounded-full font-bold hover:invert uppercase">Copy GM Prompt</button>
                    </div>
                    <div class="grid grid-cols-5 gap-2">
                        ${batch.map(b => `<div class="text-[9px] bg-slate-900 p-2 rounded border border-slate-800 truncate text-slate-400"><b class="text-white">${b.target}</b></div>`).join('')}
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function rebuild() {
            const rawJson = document.getElementById('ai-json').value;
            let aiData = {};
            const matches = rawJson.match(/\{[\s\S]*?\}/g);
            if (matches) {
                matches.forEach(m => { try { Object.assign(aiData, JSON.parse(m)); } catch(e){} });
            }

            let resultTokens = [...globalTokens];
            const sortedKeys = Object.keys(aiData).sort((a,b) => {
                const idxA = allChunks.find(c => c.id === a)?.idx || 0;
                const idxB = allChunks.find(c => c.id === b)?.idx || 0;
                return idxB - idxA;
            });

            sortedKeys.forEach(key => {
                const chunk = allChunks.find(c => c.id === key);
                if (chunk) {
                    resultTokens[chunk.idx] += ` { ${aiData[key]} }`;
                }
            });

            document.getElementById('final-pgn').value = resultTokens.join(' ');
        }

        function copyRaw(b64) {
            navigator.clipboard.writeText(decodeURIComponent(escape(atob(b64))));
            alert("GM Prompt Copied with Main Line Context!");
        }

        function copyToClipboard(id) {
            const el = document.getElementById(id);
            el.select();
            document.execCommand('copy');
            alert("Rebuilt PGN Copied!");
        }

        function downloadPgn() {
            const text = document.getElementById('final-pgn').value;
            const blob = new Blob([text], { type: 'text/plain' });
            const anchor = document.createElement('a');
            anchor.download = 'GM_RuyLopez_Course.pgn';
            anchor.href = window.URL.createObjectURL(blob);
            anchor.click();
        }

        function clearState() { location.reload(); }
    </script>
</body>
</html>
