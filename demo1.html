<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal PGN Manager</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #eee; padding: 15px; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        textarea { width: 100%; height: 150px; background: #222; color: #ffcc00; border: 1px solid #444; border-radius: 8px; padding: 10px; font-family: monospace; box-sizing: border-box; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .label { color: #4db8ff; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .output-box { background: #000; padding: 12px; border-radius: 6px; margin: 10px 0; border: 1px solid #444; font-family: monospace; word-break: break-all; white-space: pre-wrap; font-size: 1rem; color: #ffcc00; }
        button { background: #007bff; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:active { background: #0056b3; }
        .copy-all { background: #28a745; margin-top: 20px; }
        .hint { font-size: 0.8rem; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>PGN Smart-Parser</h2>
    <textarea id="pgnInput" placeholder="Paste your full PGN here (including branches and symbols like ! and ?)..."></textarea>
    <button onclick="processPGN()">Parse PGN for Gemini</button>

    <div id="results" style="display:none;">
        <div class="card">
            <span class="label">Primary Main Line</span>
            <div id="mainLineOut" class="output-box"></div>
            <button onclick="copyText('mainLineOut')">Copy Main Line</button>
        </div>

        <div class="card" style="border-left: 4px solid #ff4d4d;">
            <span class="label">Decision Points & Branches</span>
            <div id="branchesOut" class="output-box"></div>
            <button onclick="copyText('branchesOut')">Copy All Branches</button>
            <p class="hint">This includes all moves with symbols (?, !, !?) for context.</p>
        </div>
    </div>
</div>

<script>
    function processPGN() {
        let raw = document.getElementById('pgnInput').value;
        
        // 1. Clean PGN: Remove comments in {} but KEEP symbols like ! ? and $
        let clean = raw.replace(/\{[\s\S]*?\}/g, "");

        // 2. Extract Main Line (Everything NOT in parentheses)
        let mainLine = clean;
        while (mainLine.includes('(')) {
            mainLine = mainLine.replace(/\([^()]*\)/g, "");
        }
        mainLine = mainLine.replace(/\s+/g, " ").trim();

        // 3. Extract Branches (Find all content inside parentheses)
        let branchRegex = /\(([^)]+)\)/g;
        let branches = [];
        let match;
        while ((match = branchRegex.exec(clean)) !== null) {
            branches.push("BRANCH: " + match[1].trim());
        }

        document.getElementById('mainLineOut').innerText = mainLine;
        document.getElementById('branchesOut').innerText = branches.join("\n\n");
        document.getElementById('results').style.display = "block";
    }

    function copyText(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text);
        alert("Copied!");
    }
</script>

</body>
</html>
