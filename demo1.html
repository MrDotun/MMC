<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DECIPHER HYBRID V3 | GM Architect</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <style>

        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }

        .gold-text { color: #d4af37; }

        .gold-bg { background-color: #d4af37; color: #1e293b; }

        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }

        .variation-card { border-left: 4px solid #334155; transition: 0.3s; }

        .variation-card:hover { border-left-color: #d4af37; background: rgba(30, 41, 59, 0.6); }

        textarea { background: #0f172a !important; border: 1px solid #1e293b !important; font-family: 'Fira Code', monospace; font-size: 13px; }

        textarea:focus { border-color: #d4af37 !important; outline: none; }

        ::-webkit-scrollbar { width: 4px; }

        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

    </style>

</head>

<body class="p-4 md:p-12">



    <div class="max-w-7xl mx-auto">

        <header class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-end border-b border-slate-800 pb-6 gap-4">

            <div>

                <h1 class="text-3xl font-black tracking-tighter italic gold-text">HYBRID <span class="text-white not-italic">V3 ENGINE</span></h1>

                <p class="text-slate-500 text-[10px] uppercase tracking-[0.3em] mt-1">Multi-Variation Branching + Full Path Context</p>

            </div>

            <nav class="flex bg-slate-900/50 p-1 rounded-xl border border-slate-800 w-full md:w-auto">

                <button onclick="showTab('fragmenter')" id="btn-f" class="flex-1 md:flex-none px-6 py-2 rounded-lg text-[10px] font-bold uppercase gold-bg transition-all">1. Fragmenter</button>

                <button onclick="showTab('reassembler')" id="btn-r" class="flex-1 md:flex-none px-6 py-2 rounded-lg text-[10px] font-bold uppercase text-slate-500 hover:text-white transition-all">2. Reassembler</button>

            </nav>

        </header>



        <!-- FRAGMENTER VIEW -->

        <div id="view-fragmenter" class="space-y-6">

            <div class="glass p-5 md:p-8 rounded-2xl">

                <div class="flex justify-between items-center mb-4">

                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Master PGN Input</label>

                    <span id="game-stats" class="text-[10px] gold-text font-bold uppercase tracking-tighter">Ready</span>

                </div>

                <textarea id="main-pgn" rows="6" class="w-full p-4 rounded-xl mb-6 shadow-inner" placeholder="Paste PGN here..."></textarea>

                <div class="flex flex-col md:flex-row gap-3">

                    <button onclick="processHybrid()" class="flex-1 py-4 bg-white text-black font-black rounded-xl hover:bg-slate-200 uppercase text-xs tracking-widest">Generate GM Prompts</button>

                    <button onclick="clearState()" class="px-6 py-4 bg-red-950/20 text-red-400 font-bold rounded-xl border border-red-900/30 uppercase text-xs">Reset</button>

                </div>

            </div>



            <div id="variation-output" class="grid grid-cols-1 gap-4 pb-20">

                <!-- Variations will be injected here -->

            </div>

        </div>



        <!-- REASSEMBLER VIEW -->

        <div id="view-reassembler" class="hidden">

            <div class="glass p-5 md:p-8 rounded-2xl grid grid-cols-1 md:grid-cols-2 gap-6">

                <div class="space-y-4">

                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">AI JSON Input</label>

                    <textarea id="ai-json" rows="12" class="w-full p-4 rounded-xl" placeholder="Paste all Gemini JSON blocks here..."></textarea>

                </div>

                <div class="space-y-4">

                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Rebuilt PGN Output</label>

                    <textarea id="final-pgn" rows="12" class="w-full p-4 rounded-xl text-emerald-400" readonly></textarea>

                    <div class="flex gap-3">

                        <button onclick="copyToClipboard('final-pgn')" class="flex-1 py-3 bg-slate-800 text-[10px] font-bold rounded-lg uppercase tracking-widest hover:bg-slate-700">Copy</button>

                        <button onclick="downloadPgn()" class="flex-1 py-3 bg-emerald-600 text-white text-[10px] font-bold rounded-lg uppercase tracking-widest hover:bg-emerald-500 shadow-lg shadow-emerald-900/20">Download</button>

                    </div>

                </div>

            </div>

            <button onclick="rebuild()" class="w-full mt-4 py-5 gold-bg rounded-xl font-black uppercase tracking-[0.2em] shadow-xl shadow-yellow-900/20">Synthesize PGN</button>

        </div>

    </div>



    <script>

        let globalTokens = [];

        let allChunks = [];



        function showTab(tab) {

            document.getElementById('view-fragmenter').classList.toggle('hidden', tab !== 'fragmenter');

            document.getElementById('view-reassembler').classList.toggle('hidden', tab !== 'reassembler');

            const activeClass = 'flex-1 md:flex-none px-6 py-2 rounded-lg text-[10px] font-bold uppercase gold-bg';

            const inactiveClass = 'flex-1 md:flex-none px-6 py-2 rounded-lg text-[10px] font-bold uppercase text-slate-500 hover:text-white';

            document.getElementById('btn-f').className = tab === 'fragmenter' ? activeClass : inactiveClass;

            document.getElementById('btn-r').className = tab === 'reassembler' ? activeClass : inactiveClass;

        }



        function processHybrid() {

            const input = document.getElementById('main-pgn').value;

            if (!input) return;



            // Refined Tokenizer: Better handling of variations and annotations

            globalTokens = input.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|[a-zA-Z0-9\-+=#$?!/]+)/g) || [];

            allChunks = [];



            let moveCounter = 0;

            let path = [];

            let stack = [];

            let variationTargets = [];



            globalTokens.forEach((token, idx) => {

                const isMove = /^[a-zA-Z]/.test(token) && !token.startsWith('{') && !token.startsWith('[');

                

                if (token === '(') {

                    stack.push([...path]);

                    let replacedMove = path.pop() || "the opening"; 

                    variationTargets.push(replacedMove);

                } else if (token === ')') {

                    if(stack.length > 0) {

                        path = stack.pop();

                        variationTargets.pop();

                    }

                } else if (isMove) {

                    let prefix = "";

                    if (idx > 0 && /^\d+\.{1,3}$/.test(globalTokens[idx-1])) {

                        prefix = globalTokens[idx-1] + " ";

                    }



                    let currentMoveStr = prefix + token;

                    let currentContext = path.join(' ');

                    let isVariation = variationTargets.length > 0;

                    let label = "";

                    

                    if (isVariation) {

                        const isStart = globalTokens[idx-1] === '(' || (globalTokens[idx-2] === '(' && /^\d+\.{1,3}$/.test(globalTokens[idx-1]));

                        label = isStart ? `\n[LINE: ALTERNATIVE VARIATION replacing ${variationTargets[variationTargets.length - 1]}]` : `\n[LINE: CONTINUATION OF VARIATION]`;

                    } else {

                        label = `\n[LINE: MAIN LINE]`;

                    }



                    path.push(currentMoveStr);

                    moveCounter++;



                    const nextToken = globalTokens[idx+1] || "";

                    const hasSymbol = token.includes('!') || token.includes('?') || nextToken.startsWith('$');

                    

                    if (moveCounter % 4 === 0 || hasSymbol || moveCounter < 10) {

                        allChunks.push({

                            id: `GM_${allChunks.length + 1}`,

                            target: token,

                            idx: idx,

                            context: currentContext + label,

                            subsequent: globalTokens.slice(idx + 1, idx + 6).join(' ')

                        });

                    }

                }

            });



            renderVariations();

            document.getElementById('game-stats').innerText = `${allChunks.length} Key Positions`;

        }



        function renderVariations() {

            const container = document.getElementById('variation-output');

            container.innerHTML = '<h2 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4">Fragmented Batches</h2>';



            const batchSize = 10;

            for (let i = 0; i < allChunks.length; i += batchSize) {

                const batch = allChunks.slice(i, i + batchSize);

                const card = document.createElement('div');

                card.className = 'variation-card glass p-5 rounded-xl';

                const prompt = createPrompt(batch);

                card.innerHTML = `

                    <div class="flex justify-between items-center mb-4">

                        <span class="text-[10px] font-bold gold-text">BATCH ${Math.floor(i/10) + 1}</span>

                        <button onclick="copyRaw('${btoa(prompt)}')" class="text-[9px] bg-white text-black px-4 py-1.5 rounded-full font-bold">COPY PROMPT</button>

                    </div>

                    <div class="flex flex-wrap gap-1.5">

                        ${batch.map(b => `<span class="text-[9px] bg-slate-900 px-2 py-1 rounded border border-slate-800 text-slate-400">${b.target}</span>`).join('')}

                    </div>

                `;

                container.appendChild(card);

            }

        }



        function createPrompt(batch) {

            const body = batch.map(b => `ID: ${b.id}\nContext: ${b.context}\nTARGET: ${b.target}\nSubsequent: ${b.subsequent}`).join('\n---\n');

            return `Role: Pretend you're a 2700+ human GM writing a course for Ruy Lopez for White 

Task: Ruy Lopez for White course (max 40 words) for these Ruy Lopez positions.

Tone: Simple English

Rules:

- Context shows moves from start.

- If Context says "ALTERNATIVE", explain why this choice was made instead of the main move.

- Use simple terms: "center", "structure", "exchange". 

- BANNED: "central", "structural", "liquidate".

- Format: JSON ONLY.



${body}`;

        }



        function rebuild() {

            const rawJson = document.getElementById('ai-json').value;

            let aiData = {};

            const matches = rawJson.match(/\{[\s\S]*?\}/g);

            if (matches) {

                matches.forEach(m => { try { Object.assign(aiData, JSON.parse(m)); } catch(e){} });

            }



            let resultTokens = [...globalTokens];

            

            // Critical Fix: Sort IDs numerically descending (GM_10 before GM_2)

            const sortedKeys = Object.keys(aiData).sort((a,b) => {

                const numA = parseInt(a.split('_')[1]);

                const numB = parseInt(b.split('_')[1]);

                return numB - numA;

            });



            sortedKeys.forEach(key => {

                const chunk = allChunks.find(c => c.id === key);

                if (chunk) {

                    resultTokens[chunk.idx] += ` { ${aiData[key]} }`;

                }

            });



            document.getElementById('final-pgn').value = resultTokens.join(' ').replace(/\s+/g, ' ');

        }



        function copyRaw(b64) {

            navigator.clipboard.writeText(atob(b64));

            alert("Batch Copied!");

        }



        function copyToClipboard(id) {

            const el = document.getElementById(id);

            el.select();

            document.execCommand('copy');

            alert("Copied!");

        }



        function downloadPgn() {

            const text = document.getElementById('final-pgn').value;

            if (!text) return;

            const blob = new Blob([text], { type: 'text/plain' });

            const anchor = document.createElement('a');

            anchor.download = 'Decipher_GM_Course.pgn';

            anchor.href = window.URL.createObjectURL(blob);

            anchor.click();

        }



        function clearState() {

            if(confirm("Clear all data?")) location.reload();

        }

    </script>

</body>

</html>
