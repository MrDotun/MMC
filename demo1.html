<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PGN Master Collector</title>
    <style>
        :root { --primary: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; max-width: 900px; margin: 30px auto; background: var(--bg); padding: 20px; }
        .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 150px; border: 2px solid #ddd; border-radius: 8px; padding: 10px; font-family: monospace; margin-bottom: 10px; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; }
        button { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-add { background: var(--primary); color: white; }
        .btn-clear { background: #e74c3c; color: white; }
        .btn-download { background: #3498db; color: white; width: 100%; margin-top: 20px; font-size: 1.1em; }
        #masterList { background: #2d3436; color: #fab1a0; padding: 15px; border-radius: 8px; white-space: pre-wrap; font-size: 12px; max-height: 400px; overflow-y: auto; }
        .count { float: right; font-size: 0.8em; color: #666; }
    </style>
</head>
<body>

    <div class="box">
        <h2>📥 PGN Master Collector <span id="gameCount" class="count">Games: 0</span></h2>
        <p>Paste the code block Gemini gives you here, then click "Add to Master".</p>
        
        <textarea id="singleInput" placeholder="Paste Gemini's annotated code block here..."></textarea>
        
        <div class="controls">
            <button class="btn-add" onclick="addGame()">Add to Master</button>
            <button class="btn-clear" onclick="clearAll()">Clear All</button>
        </div>

        <h3>Preview Master File:</h3>
        <div id="masterList">No games added yet...</div>

        <button class="btn-download" onclick="downloadPGN()">Download Complete PGN File</button>
    </div>

    <script>
        let allGames = [];

        function addGame() {
            const input = document.getElementById('singleInput').value.trim();
            if (!input) return;
            
            allGames.push(input);
            updateDisplay();
            document.getElementById('singleInput').value = '';
        }

        function updateDisplay() {
            const display = document.getElementById('masterList');
            const count = document.getElementById('gameCount');
            
            if (allGames.length === 0) {
                display.innerText = "No games added yet...";
                count.innerText = "Games: 0";
                return;
            }

            display.innerText = allGames.join('\n\n');
            count.innerText = `Games: ${allGames.length}`;
        }

        function clearAll() {
            if(confirm("Are you sure you want to clear the list?")) {
                allGames = [];
                updateDisplay();
            }
        }

        function downloadPGN() {
            if (allGames.length === 0) return alert("Add some games first!");
            const content = allGames.join('\n\n');
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Ruy_Lopez_Course_Master.pgn";
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
