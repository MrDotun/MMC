<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate | Mind Masters Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a0c12;color:#e2e8f0;margin:0;min-height:100vh}
@media print{
  body{background:#fff;color:#111}
  .no-print{display:none!important}
  #cert{box-shadow:none!important;border:4px solid #c9a227!important}
}
</style>
</head>
<body class="p-4 md:p-10">
<div class="no-print max-w-xl mx-auto mb-6 flex flex-wrap gap-2">
<a href="index.html" class="text-xs font-bold uppercase text-slate-400">← Home</a>
<button onclick="fillFromProgress()" class="bg-white/10 px-4 py-2 rounded-lg text-xs font-bold uppercase">Load my name</button>
<button onclick="window.print()" class="bg-amber-500 text-black px-4 py-2 rounded-lg text-xs font-black uppercase">Print / Save PDF</button>
</div>
<div id="cert" class="max-w-2xl mx-auto bg-gradient-to-br from-[#1a1520] to-[#0f1218] border-4 border-amber-500/50 rounded-2xl p-8 md:p-12 text-center shadow-2xl">
<p class="text-[10px] font-black uppercase tracking-[0.3em] text-amber-400 mb-4">Mind Masters Academy</p>
<h1 class="font-serif text-3xl md:text-4xl italic text-white mb-2">Certificate of Progress</h1>
<p class="text-slate-400 text-sm mb-8">This certifies that</p>
<p id="c-name" class="text-2xl md:text-3xl font-black text-amber-300 mb-6 border-b border-amber-500/30 pb-3 inline-block min-w-[200px]">Student Name</p>
<p class="text-slate-300 text-sm max-w-md mx-auto mb-6">has demonstrated dedication in chess training through quests, practice games, and academy challenges.</p>
<div class="flex justify-center gap-8 text-sm mb-8">
<div><div class="text-amber-400 font-black" id="c-level">Lv1</div><div class="text-[10px] uppercase text-slate-500">Level</div></div>
<div><div class="text-amber-400 font-black" id="c-xp">0 XP</div><div class="text-[10px] uppercase text-slate-500">Experience</div></div>
<div><div class="text-amber-400 font-black" id="c-wins">0</div><div class="text-[10px] uppercase text-slate-500">AI Wins</div></div>
</div>
<p class="text-xs text-slate-500" id="c-date"></p>
<p class="text-[10px] text-slate-600 mt-6 uppercase tracking-widest">www.mrdotun.name.ng · Season of Champions 2026</p>
</div>
<script>
function fillFromProgress(){
  try{
    const p=JSON.parse(localStorage.getItem('mm_progress')||'{}');
    const n=p.name||localStorage.getItem('mm_online_name')||'Student';
    const lv=Math.floor((p.xp||0)/100)+1;
    document.getElementById('c-name').textContent=n;
    document.getElementById('c-level').textContent='Lv'+lv;
    document.getElementById('c-xp').textContent=(p.xp||0)+' XP';
    document.getElementById('c-wins').textContent=p.aiWins||0;
  }catch(e){}
  document.getElementById('c-date').textContent=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
}
fillFromProgress();
</script>
</body>
</html>
