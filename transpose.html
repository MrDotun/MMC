<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transposition Finder v1.1 | Decipher Chess Academy</title>
    <!-- build: 2026-09-11-b -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #020617; color: #f8fafc; }
        .gold { color: #d4af37; }
        .glass { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); }
        textarea { background: #0f172a !important; border: 1px solid #334155 !important; color: #fff; font-family: ui-monospace, monospace; }
        textarea:focus { border-color: #d4af37 !important; outline: none; }
        .tr-card { border-left: 4px solid #d4af37; }
        .path { font-family: ui-monospace, monospace; font-size: 12px; color: #94a3b8; word-break: break-word; }
        .target { font-family: ui-monospace, monospace; font-size: 12px; color: #6ee7b7; word-break: break-word; }
        .fen { font-family: ui-monospace, monospace; font-size: 11px; color: #64748b; word-break: break-all; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <header>
            <h1 class="text-2xl font-bold gold tracking-tight">TRANSPOSITION FINDER <span class="text-slate-500 text-sm font-normal">v1.1</span></h1>
            <p class="text-slate-400 text-sm mt-1">Paste a repertoire PGN. Lists every <span class="text-emerald-400 font-semibold">tr / transposes</span> and which other line reaches the same position. Does not change the PGN.</p>
        </header>

        <div class="glass rounded-2xl p-5 space-y-4">
            <label class="text-xs font-bold uppercase text-slate-500">PGN input</label>
            <textarea id="pgn" rows="10" class="w-full p-4 rounded-xl text-sm" placeholder="Paste full chapter PGN (or several chapters) here..."></textarea>
            <div class="flex flex-wrap gap-3 items-center">
                <button onclick="analyze()" class="px-6 py-3 bg-white text-black font-bold rounded-xl text-xs uppercase hover:bg-slate-200">Find Transpositions</button>
                <label class="px-4 py-3 bg-slate-800 rounded-xl text-xs font-bold uppercase cursor-pointer hover:bg-slate-700">
                    Upload .pgn
                    <input type="file" accept=".pgn,.txt" class="hidden" onchange="handleFile(event)">
                </label>
                <button onclick="clearAll()" class="px-4 py-3 bg-red-900/40 text-red-300 rounded-xl text-xs font-bold uppercase">Clear</button>
                <span id="stats" class="text-[10px] text-slate-500 uppercase tracking-widest ml-auto">Ready</span>
            </div>
        </div>

        <div id="results" class="space-y-4 hidden"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        function handleFile(e) {
            const f = e.target.files[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
                document.getElementById('pgn').value = reader.result;
                analyze();
            };
            reader.readAsText(f);
        }

        function clearAll() {
            document.getElementById('pgn').value = '';
            document.getElementById('results').classList.add('hidden');
            document.getElementById('results').innerHTML = '';
            document.getElementById('stats').innerText = 'Ready';
        }

        function fenKey(fen) {
            if (!fen) return '';
            return fen.trim().split(/\s+/).slice(0, 4).join(' ');
        }

        function isTransposeText(s) {
            if (!s) return false;
            return /\btr\b|\btransposes?\b|\btranspose\b|\btransp\.?\b/i.test(s);
        }

        function normalizeFen(f) {
            try {
                const c = new Chess();
                if (c.load(f)) return c.fen();
            } catch (e) {}
            return f;
        }

        function analyze() {
            const input = document.getElementById('pgn').value;
            if (!input.trim()) {
                alert('Paste or upload a PGN first.');
                return;
            }

            const stats = document.getElementById('stats');
            stats.innerText = 'Parsing...';

            // Split into games/chapters if multiple
            const games = input.split(/\n\s*\n(?=\[Event)/).map(g => g.trim()).filter(Boolean);
            if (games.length === 0) games.push(input.trim());

            const allHits = []; // transposition reports
            let totalMoves = 0;
            let totalTr = 0;

            games.forEach((gamePgn, gameIdx) => {
                // Chapter title from headers
                let chapter = `Game ${gameIdx + 1}`;
                const w = gamePgn.match(/\[White\s+"([^"]*)"\]/i);
                const b = gamePgn.match(/\[Black\s+"([^"]*)"\]/i);
                const ev = gamePgn.match(/\[Event\s+"([^"]*)"\]/i);
                if (w || b) {
                    chapter = [w && w[1], b && b[1]].filter(Boolean).join(' — ');
                } else if (ev) {
                    chapter = ev[1];
                }

                const tokens = gamePgn.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|\$\d+|[a-zA-Z0-9\-+=#\/]+[?!]*)/g) || [];

                let chunks = [];
                let moveNumber = 0;
                let variationLevel = 0;
                let depthPlyCounts = { 0: 0 };
                let chess = new Chess();
                let stateStack = [];
                let currentFEN = chess.fen();
                let fenBeforeLastMove = currentFEN;
                let pathStack = [[]];
                let currentPath = [];
                let lastChunk = null;

                tokens.forEach((token, index) => {
                    if (token.startsWith('{') && token.endsWith('}')) {
                        const body = token.slice(1, -1).trim();
                        if (lastChunk) {
                            lastChunk.comment = (lastChunk.comment ? lastChunk.comment + ' ' : '') + body;
                            if (isTransposeText(body)) {
                                lastChunk.isTranspose = true;
                            }
                        }
                        return;
                    }
                    if (token === '(') {
                        variationLevel++;
                        depthPlyCounts[variationLevel] = 0;
                        stateStack.push({ current: currentFEN, beforeLast: fenBeforeLastMove });
                        pathStack.push([...currentPath]);
                        if (currentPath.length > 0) currentPath = currentPath.slice(0, -1);
                        chess.load(fenBeforeLastMove);
                        currentFEN = normalizeFen(chess.fen());
                        return;
                    }
                    if (token === ')') {
                        variationLevel--;
                        const state = stateStack.pop();
                        if (state) {
                            chess.load(state.current);
                            currentFEN = normalizeFen(chess.fen());
                            fenBeforeLastMove = normalizeFen(state.beforeLast);
                        }
                        currentPath = pathStack.pop() || [];
                        return;
                    }
                    if (/^\d+\./.test(token)) {
                        moveNumber = parseInt(token);
                        return;
                    }
                    if (token.startsWith('[') || token.startsWith('$')) return;

                    const isMove = /^[a-hA-ZRKNQBO]/.test(token);
                    if (!isMove) {
                        // bare tr after a move
                        if (lastChunk && isTransposeText(token)) {
                            lastChunk.isTranspose = true;
                            lastChunk.comment = (lastChunk.comment ? lastChunk.comment + ' ' : '') + token;
                        }
                        return;
                    }

                    depthPlyCounts[variationLevel] = (depthPlyCounts[variationLevel] || 0) + 1;
                    fenBeforeLastMove = normalizeFen(chess.fen());

                    let clean = token.replace(/[^a-zA-Z0-9=\+\-#O]/g, '');
                    let moveObj = chess.move(clean, { sloppy: true });
                    if (!moveObj) {
                        clean = clean.replace(/[+#]/g, '');
                        moveObj = chess.move(clean, { sloppy: true });
                    }
                    if (!moveObj) {
                        const alt = token.replace(/[!?]+$/g, '').replace(/\$\d+$/g, '').trim();
                        if (alt) moveObj = chess.move(alt, { sloppy: true });
                    }

                    let san = token.replace(/[!?$].*$/, '').trim();
                    if (moveObj) {
                        currentFEN = normalizeFen(chess.fen());
                        san = moveObj.san;
                        currentPath.push(san);
                    } else {
                        currentFEN = fenBeforeLastMove;
                        currentPath.push(san);
                    }

                    const pathArray = [...currentPath];
                    const pathStr = pathArray.length > 16
                        ? '...' + pathArray.slice(-16).join(' ')
                        : pathArray.join(' ');

                    const isFirst = variationLevel > 0 && depthPlyCounts[variationLevel] === 1;

                    const chunk = {
                        san,
                        moveNum: moveNumber,
                        target: token,
                        path: pathStr,
                        pathArray,
                        fenAfter: currentFEN,
                        key: fenKey(currentFEN),
                        isMainLine: variationLevel === 0,
                        variationLevel,
                        isVariationStart: isFirst,
                        isTranspose: false,
                        comment: '',
                        chapter
                    };

                    // peek next for bare tr
                    const next = tokens[index + 1];
                    if (next && isTransposeText(next) && !next.startsWith('{') && !next.startsWith('$')) {
                        chunk.isTranspose = true;
                        chunk.comment = next;
                    }

                    chunks.push(chunk);
                    lastChunk = chunk;
                    totalMoves++;
                });

                // Index FENs in this game
                const index = {};
                chunks.forEach((c, i) => {
                    if (!c.key) return;
                    if (!index[c.key]) index[c.key] = [];
                    index[c.key].push({ ...c, idx: i });
                });

                // Collect tr hits
                chunks.forEach(c => {
                    if (!c.isTranspose) return;
                    totalTr++;
                    const others = (index[c.key] || []).filter(h => h.idx !== undefined && (h.path !== c.path || h.variationLevel !== c.variationLevel));
                    // Prefer main line / lower level
                    others.sort((a, b) => {
                        if (a.isMainLine !== b.isMainLine) return a.isMainLine ? -1 : 1;
                        return a.variationLevel - b.variationLevel;
                    });
                    // Unique by path
                    const seen = new Set();
                    const unique = [];
                    for (const o of others) {
                        if (seen.has(o.path)) continue;
                        seen.add(o.path);
                        unique.push(o);
                        if (unique.length >= 6) break;
                    }

                    allHits.push({
                        chapter: c.chapter,
                        move: `${c.moveNum}. ${c.san}`,
                        path: c.path,
                        fen: c.fenAfter,
                        key: c.key,
                        comment: c.comment,
                        level: c.variationLevel,
                        targets: unique
                    });
                });
            });

            stats.innerText = `${totalMoves} moves · ${totalTr} transposition marks · ${games.length} chapter(s)`;

            const box = document.getElementById('results');
            box.classList.remove('hidden');

            if (allHits.length === 0) {
                box.innerHTML = `<div class="glass rounded-xl p-6 text-slate-400 text-sm">No <span class="text-emerald-400">tr / transposes</span> marks found in this PGN.</div>`;
                return;
            }

            box.innerHTML = allHits.map((h, i) => {
                const targetsHtml = h.targets.length
                    ? h.targets.map((t, j) => {
                        const tag = t.isMainLine ? 'main line' : `variation (level ${t.variationLevel})`;
                        return `<div class="target mt-1">${j + 1}. ${t.path} <span class="text-slate-500">— ${tag}</span></div>`;
                    }).join('')
                    : `<div class="text-amber-400/90 text-xs mt-1">No other line in this file reaches this position. Likely transposes to a different chapter not included in the paste.</div>`;

                return `
                <div class="glass tr-card rounded-xl p-5 space-y-2">
                    <div class="flex flex-wrap justify-between gap-2 items-baseline">
                        <span class="text-xs font-bold uppercase text-slate-500">${h.chapter}</span>
                        <span class="text-[10px] uppercase tracking-widest text-emerald-400 font-bold">tr #${i + 1}</span>
                    </div>
                    <div class="text-lg font-semibold text-white">${h.move}</div>
                    <div class="path">Line: ${h.path}</div>
                    ${h.comment ? `<div class="text-xs text-slate-400">Comment: ${h.comment}</div>` : ''}
                    <div class="pt-2 border-t border-slate-700">
                        <div class="text-[10px] font-bold uppercase text-slate-500 mb-1">Transposes to</div>
                        ${targetsHtml}
                    </div>
                    <div class="fen pt-1">FEN: ${h.fen}</div>
                </div>`;
            }).join('');
        }
    </script>
</body>
</html>
