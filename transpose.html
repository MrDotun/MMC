<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transposition Finder v2.1 | Decipher Chess Academy</title>
    <!-- build: 2026-09-11-d -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #020617; color: #f8fafc; }
        .gold { color: #d4af37; }
        .glass { background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(255,255,255,0.1); }
        textarea, input[type=text] { background: #0f172a !important; border: 1px solid #334155 !important; color: #fff; font-family: ui-monospace, monospace; }
        textarea:focus, input[type=text]:focus { border-color: #d4af37 !important; outline: none; }
        .tr-card { border-left: 4px solid #d4af37; }
        .match-exact { border-left-color: #34d399; }
        .match-near { border-left-color: #fbbf24; }
        .match-none { border-left-color: #64748b; }
        .path { font-family: ui-monospace, monospace; font-size: 11px; color: #94a3b8; word-break: break-word; }
        .target { font-family: ui-monospace, monospace; font-size: 11px; color: #6ee7b7; word-break: break-word; }
        .fen { font-family: ui-monospace, monospace; font-size: 10px; color: #64748b; word-break: break-all; }
        .board-box { width: 220px; max-width: 100%; }
        .chapter-head { border-bottom: 1px solid #334155; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto space-y-6">
        <header>
            <h1 class="text-2xl font-bold gold tracking-tight">TRANSPOSITION FINDER <span class="text-slate-500 text-sm font-normal">v2.1</span></h1>
            <p class="text-slate-400 text-sm mt-1">
                Upload <strong>all chapters</strong> of your repertoire. Finds every <span class="text-emerald-400 font-semibold">tr / transposes</span>,
                matches the same position (or 1–2 moves later) across chapters, shows a board, and reports results.
                <span class="text-slate-500">Does not modify your PGN.</span>
            </p>
        </header>

        <div class="glass rounded-2xl p-5 space-y-4">
            <div class="flex flex-wrap gap-3 items-center">
                <label class="px-5 py-3 bg-white text-black font-bold rounded-xl text-xs uppercase cursor-pointer hover:bg-slate-200">
                    Upload chapter PGNs (multi)
                    <input type="file" id="files" accept=".pgn,.txt" multiple class="hidden" onchange="handleFiles(event)">
                </label>
                <button onclick="analyze()" class="px-5 py-3 bg-yellow-600 text-black font-bold rounded-xl text-xs uppercase hover:bg-yellow-500">Analyze All</button>
                <button onclick="exportReport()" id="btn-export" class="px-4 py-3 bg-slate-800 rounded-xl text-xs font-bold uppercase hover:bg-slate-700 hidden">Copy Report</button>
                <button onclick="clearAll()" class="px-4 py-3 bg-red-900/40 text-red-300 rounded-xl text-xs font-bold uppercase">Clear</button>
                <span id="stats" class="text-[10px] text-slate-500 uppercase tracking-widest ml-auto">Ready</span>
            </div>
            <div id="file-list" class="text-xs text-slate-400 space-y-1"></div>
            <details class="text-xs text-slate-500">
                <summary class="cursor-pointer text-slate-400 hover:text-white">Or paste PGNs here (separate chapters with a blank line + [Event)</summary>
                <textarea id="pgn" rows="6" class="w-full p-3 rounded-xl text-xs mt-2" placeholder="Paste one or more chapter PGNs..."></textarea>
            </details>
        </div>

        <div id="results" class="space-y-8 hidden"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script>
        let uploadedTexts = [];
        let lastReportText = '';
        let boards = {};

        function handleFiles(e) {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;
            let pending = files.length;
            files.forEach(f => {
                const reader = new FileReader();
                reader.onload = () => {
                    uploadedTexts.push({ name: f.name, text: reader.result });
                    pending--;
                    if (pending === 0) {
                        renderFileList();
                        analyze();
                    }
                };
                reader.readAsText(f);
            });
        }

        function renderFileList() {
            const el = document.getElementById('file-list');
            if (!uploadedTexts.length) { el.innerHTML = ''; return; }
            el.innerHTML = '<span class="text-slate-500 uppercase text-[10px] font-bold">Loaded:</span> ' +
                uploadedTexts.map(u => '<span class="inline-block bg-slate-800 px-2 py-0.5 rounded mr-1 mb-1">' + u.name + '</span>').join('');
        }

        function clearAll() {
            uploadedTexts = [];
            document.getElementById('pgn').value = '';
            document.getElementById('files').value = '';
            document.getElementById('results').classList.add('hidden');
            document.getElementById('results').innerHTML = '';
            document.getElementById('btn-export').classList.add('hidden');
            document.getElementById('stats').innerText = 'Ready';
            document.getElementById('file-list').innerHTML = '';
            lastReportText = '';
            boards = {};
        }

        function fenKey(fen) {
            if (!fen) return '';
            return fen.trim().split(/\s+/).slice(0, 4).join(' ');
        }

        function isTransposeText(s) {
            if (!s) return false;
            return /\btr\b|\btransposes?\b|\btranspose\b|\btransp\.?\b/i.test(s);
        }

        function normalizeFen(f) {
            try {
                const c = new Chess();
                if (c.load(f)) return c.fen();
            } catch (e) {}
            return f;
        }

        function parseGame(gamePgn, sourceName, gameIdx) {
            let chapter = sourceName || ('Game ' + (gameIdx + 1));
            const w = gamePgn.match(/\[White\s+"([^"]*)"\]/i);
            const b = gamePgn.match(/\[Black\s+"([^"]*)"\]/i);
            const ev = gamePgn.match(/\[Event\s+"([^"]*)"\]/i);
            if (w || b) chapter = [w && w[1], b && b[1]].filter(Boolean).join(' — ');
            else if (ev && ev[1] && ev[1] !== '?') chapter = ev[1];

            const tokens = gamePgn.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|\$\d+|[a-zA-Z0-9\-+=#\/]+[?!]*)/g) || [];

            let positions = [];
            let moveNumber = 0;
            let variationLevel = 0;
            let depthPlyCounts = { 0: 0 };
            let chess = new Chess();
            let stateStack = [];
            let currentFEN = chess.fen();
            let fenBeforeLastMove = currentFEN;
            let pathStack = [[]];
            let currentPath = [];
            let lastPos = null;

            tokens.forEach(function(token, index) {
                if (token.startsWith('{') && token.endsWith('}')) {
                    const body = token.slice(1, -1).trim();
                    if (lastPos) {
                        lastPos.comment = (lastPos.comment ? lastPos.comment + ' ' : '') + body;
                        if (isTransposeText(body)) lastPos.isTranspose = true;
                    }
                    return;
                }
                if (token === '(') {
                    variationLevel++;
                    depthPlyCounts[variationLevel] = 0;
                    stateStack.push({ current: currentFEN, beforeLast: fenBeforeLastMove });
                    pathStack.push(currentPath.slice());
                    if (currentPath.length > 0) currentPath = currentPath.slice(0, -1);
                    chess.load(fenBeforeLastMove);
                    currentFEN = normalizeFen(chess.fen());
                    return;
                }
                if (token === ')') {
                    variationLevel--;
                    const state = stateStack.pop();
                    if (state) {
                        chess.load(state.current);
                        currentFEN = normalizeFen(chess.fen());
                        fenBeforeLastMove = normalizeFen(state.beforeLast);
                    }
                    currentPath = pathStack.pop() || [];
                    return;
                }
                if (/^\d+\./.test(token)) {
                    moveNumber = parseInt(token);
                    return;
                }
                if (token.startsWith('[') || token.startsWith('$')) return;

                const isMove = /^[a-hA-ZRKNQBO]/.test(token);
                if (!isMove) {
                    if (lastPos && isTransposeText(token)) {
                        lastPos.isTranspose = true;
                        lastPos.comment = (lastPos.comment ? lastPos.comment + ' ' : '') + token;
                    }
                    return;
                }

                depthPlyCounts[variationLevel] = (depthPlyCounts[variationLevel] || 0) + 1;
                fenBeforeLastMove = normalizeFen(chess.fen());

                let clean = token.replace(/[^a-zA-Z0-9=\+\-#O]/g, '');
                let moveObj = chess.move(clean, { sloppy: true });
                if (!moveObj) {
                    clean = clean.replace(/[+#]/g, '');
                    moveObj = chess.move(clean, { sloppy: true });
                }
                if (!moveObj) {
                    const alt = token.replace(/[!?]+$/g, '').replace(/\$\d+$/g, '').trim();
                    if (alt) moveObj = chess.move(alt, { sloppy: true });
                }

                let san = token.replace(/[!?$].*$/, '').trim();
                if (moveObj) {
                    currentFEN = normalizeFen(chess.fen());
                    san = moveObj.san;
                    currentPath.push(san);
                } else {
                    currentFEN = fenBeforeLastMove;
                    currentPath.push(san);
                }

                const pathArray = currentPath.slice();
                const pathStr = pathArray.length > 20
                    ? '...' + pathArray.slice(-20).join(' ')
                    : pathArray.join(' ');

                const pos = {
                    id: (sourceName || 'paste') + '_' + gameIdx + '_' + positions.length,
                    san: san,
                    moveNum: moveNumber,
                    path: pathStr,
                    pathArray: pathArray,
                    fen: currentFEN,
                    key: fenKey(currentFEN),
                    isMainLine: variationLevel === 0,
                    variationLevel: variationLevel,
                    isTranspose: false,
                    comment: '',
                    chapter: chapter,
                    source: sourceName || 'pasted'
                };

                const next = tokens[index + 1];
                if (next && isTransposeText(next) && !next.startsWith('{') && !next.startsWith('$')) {
                    pos.isTranspose = true;
                    pos.comment = next;
                }

                positions.push(pos);
                lastPos = pos;
            });

            return { chapter: chapter, source: sourceName || 'pasted', positions: positions };
        }

        function collectGames() {
            const games = [];
            let gi = 0;

            uploadedTexts.forEach(function(u) {
                let parts = u.text.split(/\n\s*\n(?=\[Event)/).map(function(g) { return g.trim(); }).filter(Boolean);
                if (parts.length === 0 && u.text.trim()) parts = [u.text.trim()];
                parts.forEach(function(p) {
                    games.push(parseGame(p, u.name, gi++));
                });
            });

            const pasted = document.getElementById('pgn').value.trim();
            if (pasted) {
                let parts = pasted.split(/\n\s*\n(?=\[Event)/).map(function(g) { return g.trim(); }).filter(Boolean);
                if (parts.length === 0) parts = [pasted];
                parts.forEach(function(p) {
                    games.push(parseGame(p, 'pasted', gi++));
                });
            }
            return games;
        }

        function buildIndex(games) {
            const index = {};
            games.forEach(function(g) {
                g.positions.forEach(function(p) {
                    if (!p.key) return;
                    if (!index[p.key]) index[p.key] = [];
                    index[p.key].push(p);
                });
            });
            return index;
        }

        // Positions reachable in 1–2 legal moves (for near transposition)
        function childrenKeys(fen, depth) {
            const results = [];
            try {
                const root = new Chess();
                if (!root.load(fen)) return results;

                function walk(chess, ply, pathSans) {
                    if (ply >= depth) return;
                    const moves = chess.moves({ verbose: true });
                    for (let i = 0; i < moves.length; i++) {
                        const m = moves[i];
                        chess.move(m);
                        const k = fenKey(chess.fen());
                        results.push({ key: k, ply: ply + 1, via: pathSans.concat(m.san).join(' ') });
                        if (ply + 1 < depth) walk(chess, ply + 1, pathSans.concat(m.san));
                        chess.undo();
                    }
                }
                walk(root, 0, []);
            } catch (e) {}
            return results;
        }

        // GM / book-style wording for a transposition target
        function gmPhrase(sourcePos, target, near) {
            const ch = target.chapter || 'another chapter';
            const lastMoves = (target.pathArray && target.pathArray.length)
                ? target.pathArray.slice(-3).join(' ')
                : (target.path || '').split(/\s+/).slice(-3).join(' ');
            const moveRef = target.moveNum ? (target.moveNum + '.' + (target.san || '')) : lastMoves;

            if (near && near.via) {
                // Merge a move or two later
                if (target.isMainLine) {
                    return 'Transposes to the main line of ' + ch + ' after ' + near.via + '.';
                }
                return 'Transposes to a side line in ' + ch + ' after ' + near.via + '.';
            }

            // Exact same position
            if (target.chapter === sourcePos.chapter) {
                if (target.isMainLine) {
                    return 'Transposes to the main line (after ' + moveRef + ').';
                }
                return 'Transposes to the line with ' + lastMoves + '.';
            }

            if (target.isMainLine) {
                return 'Transposes to ' + ch + ' (main line after ' + moveRef + ').';
            }
            return 'Transposes to ' + ch + ', line with ' + lastMoves + '.';
        }

        function analyze() {
            const stats = document.getElementById('stats');
            stats.innerText = 'Parsing chapters...';

            const games = collectGames();
            if (!games.length) {
                alert('Upload or paste at least one chapter PGN.');
                return;
            }

            const index = buildIndex(games);
            let totalTr = 0;
            const reportLines = [];
            reportLines.push('TRANSPOSITION REPORT');
            reportLines.push('Does not modify your PGN.');
            reportLines.push('');

            const byChapter = {};

            games.forEach(function(g) {
                g.positions.forEach(function(p) {
                    if (!p.isTranspose) return;
                    totalTr++;
                    if (!byChapter[p.chapter]) byChapter[p.chapter] = [];

                    const exact = (index[p.key] || []).filter(function(o) { return o.id !== p.id; });
                    exact.sort(function(a, b) {
                        if (a.chapter !== b.chapter) {
                            if (a.chapter === p.chapter) return 1;
                            if (b.chapter === p.chapter) return -1;
                        }
                        if (a.isMainLine !== b.isMainLine) return a.isMainLine ? -1 : 1;
                        return a.variationLevel - b.variationLevel;
                    });
                    const seenExact = {};
                    const exactUnique = [];
                    for (let i = 0; i < exact.length; i++) {
                        const o = exact[i];
                        const sig = o.chapter + '|' + o.path;
                        if (seenExact[sig]) continue;
                        seenExact[sig] = true;
                        exactUnique.push(o);
                        if (exactUnique.length >= 8) break;
                    }

                    let near = [];
                    if (exactUnique.length === 0) {
                        const kids = childrenKeys(p.fen, 2);
                        const seenNear = {};
                        for (let i = 0; i < kids.length; i++) {
                            const kid = kids[i];
                            const hits = (index[kid.key] || []).filter(function(o) { return o.id !== p.id; });
                            for (let j = 0; j < hits.length; j++) {
                                const o = hits[j];
                                const sig = o.chapter + '|' + o.path + '|' + kid.via;
                                if (seenNear[sig]) continue;
                                seenNear[sig] = true;
                                near.push({
                                    chapter: o.chapter,
                                    path: o.path,
                                    isMainLine: o.isMainLine,
                                    variationLevel: o.variationLevel,
                                    nearPly: kid.ply,
                                    via: kid.via
                                });
                            }
                        }
                        near.sort(function(a, b) {
                            if (a.nearPly !== b.nearPly) return a.nearPly - b.nearPly;
                            if (a.isMainLine !== b.isMainLine) return a.isMainLine ? -1 : 1;
                            return a.variationLevel - b.variationLevel;
                        });
                        near = near.slice(0, 8);
                    }

                    byChapter[p.chapter].push({ pos: p, exact: exactUnique, near: near });
                });
            });

            let posCount = 0;
            Object.keys(index).forEach(function(k) { posCount += index[k].length; });
            stats.innerText = games.length + ' chapter(s) · ' + posCount + ' positions · ' + totalTr + ' tr marks';

            const box = document.getElementById('results');
            box.classList.remove('hidden');
            document.getElementById('btn-export').classList.remove('hidden');

            if (totalTr === 0) {
                box.innerHTML = '<div class="glass rounded-xl p-6 text-slate-400 text-sm">No <span class="text-emerald-400">tr / transposes</span> marks found. Use {tr}, {transposes}, or bare tr after the move.</div>';
                lastReportText = reportLines.join('\n');
                return;
            }

            let html = '';
            let boardId = 0;
            const pendingBoards = [];

            Object.keys(byChapter).forEach(function(chapter) {
                const hits = byChapter[chapter];
                reportLines.push('========================================');
                reportLines.push('CHAPTER: ' + chapter);
                reportLines.push('========================================');

                html += '<section class="space-y-4"><h2 class="chapter-head text-lg font-bold gold pb-2">' +
                    chapter + ' <span class="text-slate-500 text-xs font-normal ml-2">' + hits.length + ' transposition(s)</span></h2>';

                hits.forEach(function(h) {
                    const p = h.pos;
                    const bid = 'bd_' + (boardId++);
                    let matchClass = 'match-none';
                    let matchLabel = '';
                    let targetsHtml = '';
                    let bookNotes = [];

                    if (h.exact.length) {
                        matchClass = 'match-exact';
                        // Prefer one best note (other chapter / main line first — already sorted)
                        const best = h.exact[0];
                        const note = gmPhrase(p, best, null);
                        bookNotes.push(note);
                        // Optional alternates
                        for (let j = 1; j < Math.min(h.exact.length, 3); j++) {
                            bookNotes.push(gmPhrase(p, h.exact[j], null));
                        }
                        matchLabel = 'Found';
                        targetsHtml = bookNotes.map(function(n) {
                            return '<div class="text-emerald-300 text-sm mt-1 leading-relaxed">' + n + '</div>';
                        }).join('');
                        reportLines.push(p.moveNum + '. ' + p.san + '  (' + p.path + ')');
                        bookNotes.forEach(function(n) { reportLines.push('  ' + n); });
                        reportLines.push('');
                    } else if (h.near.length) {
                        matchClass = 'match-near';
                        const best = h.near[0];
                        const note = gmPhrase(p, best, best);
                        bookNotes.push(note);
                        for (let j = 1; j < Math.min(h.near.length, 3); j++) {
                            bookNotes.push(gmPhrase(p, h.near[j], h.near[j]));
                        }
                        matchLabel = 'Found (after a move or two)';
                        targetsHtml = bookNotes.map(function(n) {
                            return '<div class="text-amber-300 text-sm mt-1 leading-relaxed">' + n + '</div>';
                        }).join('');
                        reportLines.push(p.moveNum + '. ' + p.san + '  (' + p.path + ')');
                        bookNotes.forEach(function(n) { reportLines.push('  ' + n); });
                        reportLines.push('');
                    } else {
                        matchLabel = 'Not found in loaded chapters';
                        const fallback = 'Transposition marked, but the target line was not found in the chapters you loaded. Upload the other chapter, or the lines may merge later.';
                        targetsHtml = '<div class="text-slate-400 text-sm mt-1">' + fallback + '</div>';
                        reportLines.push(p.moveNum + '. ' + p.san + '  (' + p.path + ')');
                        reportLines.push('  ' + fallback);
                        reportLines.push('');
                    }

                    const colorClass = matchClass === 'match-exact' ? 'text-emerald-400' : (matchClass === 'match-near' ? 'text-amber-400' : 'text-slate-500');

                    html += '<div class="glass tr-card ' + matchClass + ' rounded-xl p-4">' +
                        '<div class="flex flex-col md:flex-row gap-4">' +
                        '<div class="board-box flex-shrink-0"><div id="' + bid + '" style="width:100%"></div></div>' +
                        '<div class="flex-1 space-y-2 min-w-0">' +
                        '<div class="flex flex-wrap justify-between gap-2">' +
                        '<span class="text-white font-semibold text-base">' + p.moveNum + '. ' + p.san + '</span>' +
                        '<span class="text-[10px] uppercase tracking-widest font-bold ' + colorClass + '">' + matchLabel + '</span></div>' +
                        '<div class="path">Line: ' + p.path + '</div>' +
                        (p.comment ? '<div class="text-xs text-slate-400">Mark: ' + p.comment + '</div>' : '') +
                        '<div class="pt-2 border-t border-slate-700">' + targetsHtml + '</div>' +
                        '<div class="fen">FEN: ' + p.fen + '</div>' +
                        '</div></div></div>';

                    pendingBoards.push({ id: bid, fen: p.fen });
                });

                html += '</section>';
                reportLines.push('');
            });

            box.innerHTML = html;
            lastReportText = reportLines.join('\n');

            pendingBoards.forEach(function(b, i) {
                setTimeout(function() {
                    try {
                        if (boards[b.id]) return;
                        boards[b.id] = Chessboard(b.id, {
                            position: b.fen,
                            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                            showNotation: true
                        });
                    } catch (e) {}
                }, 40 + i * 30);
            });
        }

        function exportReport() {
            if (!lastReportText) return;
            navigator.clipboard.writeText(lastReportText).then(function() {
                alert('Report copied to clipboard.');
            }).catch(function() {
                const ta = document.createElement('textarea');
                ta.value = lastReportText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('Report copied.');
            });
        }
    </script>
</body>
</html>
