<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Master Annotator | Dotun</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f1a] text-slate-200 min-h-screen p-4 font-sans">

    <div class="max-w-3xl mx-auto bg-[#161b2b] rounded-3xl shadow-2xl border border-slate-800 overflow-hidden">
        <div class="bg-gradient-to-br from-indigo-700 to-blue-900 p-8 text-white text-center">
            <h1 class="text-3xl font-black italic tracking-tighter">GM VARIATION MASTER</h1>
            <p class="text-blue-300 text-[10px] uppercase tracking-[0.3em] font-bold">Theory Deep-Dive v10.3</p>
        </div>

        <div class="p-8 space-y-6">
            <input type="password" id="apiKey" class="w-full bg-[#0b0f1a] border border-slate-700 rounded-2xl px-5 py-4 text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="Enter Gemini Key...">
            
            <textarea id="pgnInput" rows="8" class="w-full bg-[#0b0f1a] border border-slate-700 rounded-2xl px-5 py-4 font-mono text-[11px] text-white outline-none" placeholder="Paste PGN..."></textarea>

            <button onclick="runUltimateAnalysis()" id="actionBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-5 rounded-2xl shadow-lg uppercase text-sm tracking-widest">Execute Full Variation Analysis</button>

            <div id="statusBox" class="hidden bg-blue-900/20 border border-blue-500/30 rounded-2xl p-5 text-center">
                <span id="statusText" class="text-blue-400 font-mono text-[11px] uppercase tracking-widest font-bold italic">Initializing Grandmaster Brain...</span>
            </div>

            <textarea id="pgnOutput" rows="12" class="w-full bg-[#0b0f1a] border border-emerald-900/30 rounded-2xl px-5 py-4 font-mono text-[11px] text-emerald-400 outline-none" readonly placeholder="Annotated results will appear here..."></textarea>
        </div>
    </div>

    <script>
        async function runUltimateAnalysis() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const pgnInput = document.getElementById('pgnInput').value.trim();
            const statusText = document.getElementById('statusText');
            const pgnOutput = document.getElementById('pgnOutput');
            const btn = document.getElementById('actionBtn');

            if (!apiKey || !pgnInput) return alert("Key and PGN required.");

            btn.disabled = true;
            document.getElementById('statusBox').classList.remove('hidden');

            const tokens = pgnInput.match(/\[.*?\]|\d+\.+|[a-zA-Z0-9+#=!-]+|\(|\)|\$[0-9]+|\*/g);
            let resultTokens = [...tokens];
            
            // Increased window slightly to 12 for better context, while maintaining detail
            const step = 12; 
            for (let i = 0; i < tokens.length; i += step) {
                const chunkTokens = tokens.slice(i, i + step);
                const chunk = chunkTokens.join(" ");
                
                if (chunk.match(/[a-zA-Z]/) && !chunk.startsWith('[')) {
                    statusText.innerText = `GM Thinking: ${chunk}`;

                    const annotations = await fetchGMInsight(apiKey, chunk);

                    if (annotations) {
                        for (const [moveText, comment] of Object.entries(annotations)) {
                            // Search the specific chunk range for the move
                            for (let j = i; j < Math.min(i + step, resultTokens.length); j++) {
                                // Find the move and ensure no comment already exists
                                if (resultTokens[j] === moveText && !resultTokens[j+1]?.includes('{')) {
                                    resultTokens[j] = `${resultTokens[j]} {${comment}}`;
                                }
                            }
                        }
                    }
                    // Update the UI after every chunk so you see progress
                    pgnOutput.value = resultTokens.join(" ").replace(/\s\)/g, ")").replace(/\(\s/g, "(").replace(/\s\./g, ".");
                    
                    await new Promise(r => setTimeout(r, 6500)); 
                }
            }

            statusText.innerText = "SUCCESS: FULL THEORY CAPTURED";
            btn.disabled = false;
        }

        async function fetchGMInsight(key, chunk) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
            
            const prompt = `Act as a GM Chess Coach. Analyze this PGN snippet: "${chunk}"
            
            TASK: Provide a 12-word strategic comment for EVERY chess move. 
            - Mention King's Indian Defense (KID) themes (e.g. prophylaxis, outpost, d4-pressure).
            - DO NOT skip moves in brackets ().
            - DO NOT use generic words like "good" or "solid".
            
            Return ONLY a JSON object: {"MoveText": "Your GM Insight"}`;

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                let raw = data.candidates[0].content.parts[0].text;
                // Extra safety to strip Markdown and hidden characters
                raw = raw.replace(/```json|```/g, "").trim();
                return JSON.parse(raw);
            } catch (e) { 
                console.error("Parse Error for chunk:", chunk);
                return null; 
            }
        }
    </script>
</body>
</html>
