<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chess Annotator | Dotun</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-dot { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen p-4">

    <div class="max-w-3xl mx-auto bg-[#1e293b] rounded-xl shadow-2xl overflow-hidden border border-slate-700">
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Chess Annotator Pro</h1>
            <p class="text-blue-100 text-sm">King's Indian Defense Specialist</p>
        </div>

        <div class="p-6 space-y-6">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Gemini API Key</label>
                <input type="password" id="apiKey" 
                    class="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 text-white outline-none"
                    placeholder="Paste AI Studio Key...">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Paste FULL PGN (Include [Headers])</label>
                <textarea id="pgnInput" rows="6" 
                    class="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-4 py-3 font-mono text-[10px] text-white outline-none"
                    placeholder="[Event '...'] 1. d4 Nf6..."></textarea>
            </div>

            <button onclick="startAnnotating()" id="actionBtn"
                class="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 text-white font-bold py-4 rounded-lg transition-all active:scale-95">
                Start AI Annotation
            </button>

            <div id="statusBox" class="hidden bg-[#0f172a] border border-blue-900/50 rounded-lg p-4 text-center">
                <span id="statusText" class="text-blue-400 font-mono text-xs uppercase tracking-widest">Initialising...</span>
                <span class="loading-dot text-blue-400">...</span>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2 text-green-500">Resulting PGN</label>
                <textarea id="pgnOutput" rows="8" 
                    class="w-full bg-[#0f172a] border border-green-900/30 rounded-lg px-4 py-3 font-mono text-[10px] text-green-400 outline-none"
                    readonly placeholder="Annotated PGN will appear here..."></textarea>
            </div>
        </div>
    </div>

    <script>
        async function startAnnotating() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const pgnInput = document.getElementById('pgnInput').value.trim();
            const actionBtn = document.getElementById('actionBtn');
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const pgnOutput = document.getElementById('pgnOutput');
            
            if (!apiKey) return alert("Please paste your API key!");
            if (!pgnInput) return alert("Please paste a PGN!");

            // 1. Load PGN with Chess.js
            const chess = new Chess();
            if (!chess.load_pgn(pgnInput)) {
                return alert("ERROR: Invalid PGN. Ensure you include the [Event] headers and that the moves are valid.");
            }

            // 2. Prepare UI
            actionBtn.disabled = true;
            statusBox.classList.remove('hidden');
            pgnOutput.value = "Processing... this may take several minutes depending on variation length.";

            // 3. Recursive Walker
            async function walk(history) {
                for (let i = 0; i < history.length; i++) {
                    const move = history[i];

                    // Logic: Annotate every 3rd move OR if a NAG symbol ($) exists
                    if (i % 3 === 0 || (move.nags && move.nags.length > 0)) {
                        statusText.innerText = `Analyzing: ${move.san}`;
                        
                        const comment = await getGeminiComment(apiKey, move.before, move.san, move.nags);
                        move.comment = comment;

                        // SLEEP for 4.5s to avoid Free Tier blocks
                        await new Promise(r => setTimeout(r, 4500)); 
                    }

                    // Recursively check sub-variations (brackets)
                    if (move.variations && move.variations.length > 0) {
                        for (let v of move.variations) {
                            await walk(v);
                        }
                    }
                }
            }

            try {
                const mainHistory = chess.history({ verbose: true });
                await walk(mainHistory);
                
                pgnOutput.value = chess.pgn();
                statusText.innerText = "DONE: COPY YOUR PGN BELOW";
            } catch (err) {
                alert("An error occurred: " + err.message);
                statusText.innerText = "PROCESS STOPPED";
            } finally {
                actionBtn.disabled = false;
            }
        }

        async function getGeminiComment(key, fen, move, nags) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
            const symbolDesc = nags ? ` (Evaluation symbol: ${nags.join(', ')})` : "";
            
            const prompt = `You are a Grandmaster Chess Annotator. 
            FEN: ${fen}
            Move: ${move} ${symbolDesc}
            Task: Write a single, brief (max 15 words) professional chess comment. 
            Focus on the strategy or piece activity. Avoid repetitive phrases.`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                
                if (data.error) return "Strategically significant continuation.";
                return data.candidates[0].content.parts[0].text.trim();
            } catch (e) {
                return "Interesting tactical choice.";
            }
        }
    </script>
</body>
</html>
