<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chess Annotator Pro | Dotun</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen p-4">

    <div class="max-w-3xl mx-auto bg-[#1e293b] rounded-xl shadow-2xl border border-slate-700">
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Chess Annotator Pro</h1>
            <p class="text-blue-100 text-xs uppercase tracking-widest">v3.0: 100% Identity Preservation</p>
        </div>

        <div class="p-6 space-y-6">
            <input type="password" id="apiKey" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-4 py-3 text-white outline-none" placeholder="Paste Gemini Key...">
            
            <textarea id="pgnInput" rows="6" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-4 py-3 font-mono text-[10px] text-white outline-none" placeholder="Paste PGN here..."></textarea>

            <button onclick="startAnnotating()" id="actionBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-lg active:scale-95 transition">Annotate My File</button>

            <div id="statusBox" class="hidden bg-[#0f172a] border border-blue-900/50 rounded-lg p-4 text-center text-blue-400 font-mono text-xs uppercase italic">
                <span id="statusText">Ready...</span>
            </div>

            <textarea id="pgnOutput" rows="10" class="w-full bg-[#0f172a] border border-green-900/30 rounded-lg px-4 py-3 font-mono text-[10px] text-green-400 outline-none" readonly placeholder="Resulting PGN..."></textarea>
        </div>
    </div>

    <script>
        async function startAnnotating() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const pgnInput = document.getElementById('pgnInput').value.trim();
            const actionBtn = document.getElementById('actionBtn');
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const pgnOutput = document.getElementById('pgnOutput');
            
            if (!apiKey || !pgnInput) return alert("Missing Info");

            const chess = new Chess();
            if (!chess.load_pgn(pgnInput)) return alert("Invalid PGN format!");

            actionBtn.disabled = true;
            statusBox.classList.remove('hidden');

            // Get the list of moves from the library to use for FENs
            const moveHistory = chess.history({ verbose: true });
            
            // We work with your ORIGINAL text to ensure 100% identity
            let finalPgn = pgnInput;

            for (let i = 0; i < moveHistory.length; i++) {
                const move = moveHistory[i];

                // Annotate every 3rd move
                if (i % 3 === 0) {
                    statusText.innerText = `Analyzing: ${move.san}`;
                    
                    const comment = await getGeminiComment(apiKey, move.before, move.san);
                    
                    // The "Identity Protection" Trick:
                    // Find the move in the text and insert the comment right after it
                    // We use a Regex to find the move followed by a space or a bracket
                    const moveRegex = new RegExp(`(\\s${move.san})(\\s|\\)|\\$)`);
                    finalPgn = finalPgn.replace(moveRegex, `$1 {${comment}} $2`);

                    await new Promise(r => setTimeout(r, 4500)); 
                }
            }

            pgnOutput.value = finalPgn;
            statusText.innerText = "DONE: FILE SAVED";
            actionBtn.disabled = false;
        }

        async function getGeminiComment(key, fen, move) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
            const prompt = `GM Chess Comment: In 10 words, why is ${move} played in this position? FEN: ${fen}`;

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                return data.candidates[0].content.parts[0].text.trim().replace(/"/g, "'");
            } catch (e) {
                return "Solid positional move.";
            }
        }
    </script>
</body>
</html>
