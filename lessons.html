<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Dotun's Chess Workstation</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #1e1b4b; --secondary: #fbbf24; --accent: #4ade80; --bg: #0f172a; --danger: #ef4444; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        #board-container { width: 350px; max-width: 95vw; margin: 10px auto; border: 4px solid var(--secondary); border-radius: 12px; overflow: hidden; transition: 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; }
        .hidden { display: none !important; }
        
        .btn { padding: 12px 20px; margin: 5px; cursor: pointer; border-radius: 8px; border: 2px solid var(--secondary); background: var(--primary); color: var(--secondary); font-weight: bold; width: 100%; transition: 0.2s; box-sizing: border-box; outline: none; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { background: var(--secondary); color: var(--primary); transform: translateY(-2px); }
        .btn-teacher { border-color: #6366f1; color: #6366f1; margin-top: 20px; font-size: 0.8em; }
        .btn-continue { background: var(--accent); color: var(--primary); border-color: white; margin-top: 10px; display: none; }
        
        #progress-container { width: 350px; max-width: 90vw; height: 10px; background: #334155; border-radius: 5px; margin-bottom: 15px; overflow: hidden; border: 1px solid #475569; }
        #progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #task-text { background: #1e293b; padding: 15px; border-radius: 8px; border-bottom: 4px solid var(--accent); margin-bottom: 15px; width: 350px; max-width: 90vw; text-align: center; font-weight: bold; font-size: 1.1em; min-height: 50px; transition: 0.3s; }
        
        .summary-table { width: 100%; border-collapse: collapse; margin: 15px 0; background: #1e293b; border-radius: 8px; overflow: hidden; }
        .summary-table th, .summary-table td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        .summary-table th { background: var(--secondary); color: var(--primary); }
        
        .highlight-selected { background-color: rgba(251, 191, 36, 0.6) !important; }
        .highlight-correction { background-color: rgba(239, 68, 68, 0.5) !important; box-shadow: inset 0 0 10px var(--danger); }

        .correct-flash { border-color: var(--accent) !important; box-shadow: 0 0 30px var(--accent); }
        .wrong-flash { background-color: var(--danger) !important; border-bottom-color: white !important; color: white !important; }
        
        .section-label { color: var(--secondary); text-align: center; margin-top: 25px; font-weight: 800; font-size: 1.3em; letter-spacing: 2px; border-top: 1px solid #334155; padding-top: 15px; }
        .week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; width: 100%; max-width: 400px; }
        
        #results-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--primary); padding: 25px; border-radius: 16px; border: 3px solid var(--secondary); z-index: 2000; width: 85%; max-height: 80vh; overflow-y: auto; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        
        #applause-notif { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--accent); color: var(--primary); padding: 15px 25px; border-radius: 50px; font-weight: 900; z-index: 100; pointer-events: none; opacity: 0; transition: 0.3s; text-align: center; font-size: 1.2em; width: 80%; box-sizing: border-box; }
        .leaderboard-entry { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>

    <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="color: var(--secondary); margin: 0; font-size: 1.8em; text-transform: uppercase;">Mr Dotun's</h1>
        <h2 style="color: white; margin: 0; font-weight: 300; letter-spacing: 4px;">CHESS WORKSTATION</h2>
    </div>

    <div id="setup-area">
        <input type="text" id="studentName" placeholder="Enter Student Full Name" style="width:100%; padding:15px; margin-bottom:10px; border-radius:8px; border:2px solid var(--secondary); background:#1e293b; color:white; box-sizing: border-box; font-size: 16px; text-align: center;">
        <input type="text" id="studentClass" placeholder="Enter Class (e.g., Grade 4)" style="width:100%; padding:15px; margin-bottom:15px; border-radius:8px; border:2px solid var(--secondary); background:#1e293b; color:white; box-sizing: border-box; font-size: 16px; text-align: center;">
        
        <div id="level-selector-container" style="text-align: center;">Syncing with Workstation...</div>
        <button class="btn btn-teacher" onclick="teacherLogin()">📊 Global Leaderboard (Admin)</button>
    </div>

    <div id="game-area" class="hidden">
        <div id="progress-container"><div id="progress-bar"></div></div>
        <div style="display: flex; justify-content: space-between; width: 100%; max-width: 350px; align-items: center; margin-bottom: 10px;">
            <h3 id="topic-title" style="color: var(--secondary); margin: 0; font-size: 1em;">Tactics</h3>
            <div id="lives-display" style="font-size: 20px; filter: drop-shadow(0 0 5px red);">❤️</div>
        </div>
        <div id="task-text">Finding Mission...</div>
        <div id="board-container">
            <div id="myBoard"></div>
            <div id="applause-notif">EXCELLENT! 👏</div>
        </div>
        <button id="continue-btn" class="btn btn-continue" onclick="nextAfterCorrection()">CONTINUE MISSION ➔</button>
        <h3 style="color:var(--accent); text-align: center; font-size: 1.4em; margin-bottom: 5px;">Score: <span id="current-score">0</span></h3>
    </div>

    <div id="post-game" class="hidden" style="text-align: center; width: 95%; max-width: 400px;">
        <h2 style="color:var(--secondary); margin-bottom: 10px;">MISSION COMPLETE</h2>
        <div id="summary-container" style="max-height: 250px; overflow-y: auto; border: 1px solid #334155; border-radius: 8px;"></div>
        <h3 style="margin: 20px 0;">Points Earned: <span id="final-points" style="color:var(--accent)">0</span></h3>
        <button class="btn" onclick="fetchWeeklyRanking()">🏆 View Weekly Ranking</button>
        <button class="btn" style="border-color: #94a3b8; color: #94a3b8;" onclick="location.reload()">🔄 Back to HQ</button>
    </div>

    <div id="results-modal" class="hidden">
        <h2 id="modal-title" style="color:var(--secondary); text-align: center;"></h2>
        <div id="leaderboard-data"></div>
        <button class="btn" onclick="document.getElementById('results-modal').classList.add('hidden')" style="margin-top:20px;">CLOSE</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const funnyComments = [
            "You move like a Grandmaster! 👑", "Is that Magnus Carlsen playing? 😲", "Boom! Checkmate! 💥", "You're making the computer sweat! 😅",
            "That move was pure genius! 🧠", "Wait, are you a chess wizard? 🧙‍♂️", "Unstoppable! 🚂", "You're on fire today! 🔥",
            "Legendary move! ⭐", "Calculated and executed! 🎯", "Checkmate in style! 😎", "Bravo! 👏", "Brilliant! 💡",
            "Absolute Masterclass! 🎓", "You have the vision of an eagle! 🦅", "Checkmate incoming! 💣", "Simply spectacular! 🌟",
            "You're playing 4D Chess! 🌌", "The board is your kingdom! 🏰", "Future World Champion! 🏆", "You're a tactical beast! 🦁",
            "Thinking like a computer! 🤖", "Sharp as a razor! 🔪", "Incredible technique! ✨", "Solid as a mountain! 🏔️",
            "You're crushing it! 🔨", "A move of pure beauty! 🌹", "Total board dominance! 👊", "You're a chess ninja! 🥷",
            "Ice cold precision! ❄️", "Magic on the 64 squares! 🪄", "The King is trembling! 🤴", "You're in the zone! 🌀",
            "Lightning speed calculation! ⚡", "Magnificent play! 💎", "You're a strategy giant! 🦒", "No one can stop you! 🛑",
            "Elite level thinking! 🚀", "You're the Chess Boss! 💼", "Perfectly executed! ✅", "A legendary finish! 🎖️",
            "Mind-blowing strategy! 🤯", "You're a chess machine! ⚙️", "Pure tactical wizardry! 🔮", "Top of the class! 🔝",
            "You're a chess rockstar! 🎸", "Victory is in your DNA! 🧬", "A master of the dark arts! 🌑", "Simply unstoppable! 🚂",
            "You've got the magic touch! ✨", "The crowd goes wild! 🙌", "Brilliance at its finest! 💡", "You're a chess hero! 🦸",
            "Calculated to perfection! 📐", "You make this look easy! 🍰", "A move for the ages! 📚", "The board belongs to you! 🗺️",
            "You're a chess detective! 🕵️", "Found the winning path! 📍", "Unbelievable talent! 🌈", "You're the GOAT! 🐐",
            "Chess excellence! 🏅", "You're a move ahead! 📈", "Grandmaster vibes! 🕶️", "Pure genius at work! 🚧",
            "The King has nowhere to run! 🏃‍♂️", "Tactical mastery! 🎖️", "You're a chess artist! 🎨", "Every move is a masterpiece! 🖼️",
            "High-IQ move! 🧠", "You're on a winning streak! 🎢", "Checkmate delivered! 📦", "You're a chess legend! 📜",
            "Flawless execution! 🎯", "The board is bowing to you! 🙇", "You're a chess visionary! 🔭", "Simply superb! 👌",
            "A move of pure class! 🥂", "You're the master of time! ⏳", "Unshakeable focus! 🧘", "The ultimate strategist! ♟️",
            "You're a chess warrior! ⚔️", "A kingly victory! 👑", "Thinking like a pro! 💼", "You've got the skill! 🛠️",
            "Chess power! 💪", "A truly inspiring move! 💡", "You're a chess pioneer! 🛶", "The smartest kid in the room! 🏫",
            "You've cracked the code! 🔐", "The computer is crying! 😭", "You're a chess genius! 🧬", "Master of the middle game! 🏰",
            "Endgame expert! 🏁", "You're a chess star! ⭐", "The galaxy's best player! 🌌", "Superhuman calculation! ⚡",
            "You're a chess titan! 🏛️", "A move of legend! 🗡️", "You're the chess king! 👑", "Checkmate with flare! ✨",
            "You're simply the best! 🥇", "Chess magic happens here! 🎪", "You're a chess icon! 🖼️", "The board is yours! 🌍"
        ];

        let allQuestions = []; 
        let game = new Chess();
        let board, currentLevel, currentTerm, currentWeek, gradeSet, currentIdx, score, pName, pClass, missionStartTime;
        let lives = 1;
        let squareSelected = null;
        let missionResults = [];
        let canInteract = true;

        async function summonWorkstationData() {
            const URL_MATE_1 = "https://raw.githubusercontent.com/MrDotun/MMC/refs/heads/main/csvjson.json";
            const statusDisplay = document.getElementById('level-selector-container');
            
            try {
                const res1 = await fetch(URL_MATE_1);
                allQuestions = [];

                if (res1.ok) {
                    const data1 = await res1.json();
                    data1.forEach((item, index) => {
                        const moveStr = item.solution || item.best;
                        if (item.fen && moveStr) {
                            const fen = item.fen.trim();
                            const isWhite = fen.split(' ')[1] === 'w';
                            const weekNum = Math.floor(index / 40) % 5 + 1;
                            const termNum = Math.floor(index / 200) % 3 + 1;
                            const levelNum = Math.floor(index / 600) + 1;
                            
                            if (levelNum <= 6) {
                                allQuestions.push({
                                    level: levelNum, term: termNum, week: weekNum,
                                    topic: "Mate in 1",
                                    task: isWhite ? "White to Move: Deliver Mate!" : "Black to Move: Deliver Mate!",
                                    fen: fen, 
                                    expectedMoves: [moveStr.replace(/1\.\s+/g, '').split(' ')[0].trim()]
                                });
                            }
                        }
                    });
                }
                
                if (allQuestions.length > 0) { generateControlPanel(); } 
                else { statusDisplay.innerText = "No puzzle data found."; }
            } catch (e) { statusDisplay.innerText = "Offline. Please check data source."; }
        }
        summonWorkstationData();

        function generateControlPanel() {
            const container = document.getElementById('level-selector-container');
            container.innerHTML = "";
            for (let L = 1; L <= 6; L++) {
                if (!allQuestions.some(q => q.level == L)) continue;
                container.innerHTML += `<div class="section-label">LEVEL ${L}</div>`;
                for (let t = 1; t <= 3; t++) {
                    if (!allQuestions.some(q => q.level == L && q.term == t)) continue;
                    let grid = `<div style="font-size:0.8em; color:#94a3b8; margin: 8px 0;">Term ${t}</div><div class="week-grid">`;
                    for (let w = 1; w <= 5; w++) {
                        if (allQuestions.some(q => q.level == L && q.term == t && q.week == w)) {
                            grid += `<button class="btn" style="padding:8px 0; font-size:12px;" onclick="initMission(${L}, ${t}, ${w})">W${w}</button>`;
                        }
                    }
                    container.innerHTML += grid + `</div>`;
                }
            }
        }

        window.initMission = function(l, t, w) {
            pName = document.getElementById('studentName').value.trim();
            pClass = document.getElementById('studentClass').value.trim(); 
            
            if(!pName || !pClass) { alert("Please enter both Name and Class."); return; }
            
            currentLevel=l; currentTerm=t; currentWeek=w;
            gradeSet = allQuestions.filter(q => q.level == l && q.term == t && q.week == w);
            document.getElementById("setup-area").classList.add("hidden");
            document.getElementById("game-area").classList.remove("hidden");
            currentIdx=0; score=0; missionResults=[];
            missionStartTime = Date.now();
            loadQuestion();
        };

        function loadQuestion() {
            if(currentIdx >= gradeSet.length) { finishGame(); return; }
            const prog = (currentIdx / gradeSet.length) * 100;
            document.getElementById("progress-bar").style.width = prog + "%";
            document.getElementById("continue-btn").style.display = "none";
            canInteract = true;
            lives = 1; updateLivesUI();
            squareSelected = null;
            const q = gradeSet[currentIdx];
            document.getElementById("topic-title").innerText = q.topic;
            document.getElementById("task-text").innerText = q.task;
            document.getElementById("task-text").classList.remove('wrong-flash');
            document.getElementById("current-score").innerText = score;
            game.load(q.fen);
            board = Chessboard('myBoard', {
                draggable: false, position: q.fen,
                orientation: game.turn() === 'b' ? 'black' : 'white',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            setTimeout(() => { $('.square-55d63').off('click').on('click', handleSquareClick); }, 100);
        }

        function handleSquareClick() {
            if (!canInteract) return;
            const sq = $(this).attr('data-square');
            if(!squareSelected) {
                const piece = game.get(sq);
                if(piece && piece.color === game.turn()) { 
                    squareSelected=sq; 
                    $(`.square-${sq}`).addClass('highlight-selected'); 
                }
            } else {
                const source = squareSelected;
                const target = sq;
                $('.square-55d63').removeClass('highlight-selected');
                squareSelected = null;

                const moveAttempt = game.move({ from: source, to: target, promotion: 'q' });
                if (moveAttempt === null) return; 

                const expectedMove = gradeSet[currentIdx].expectedMoves[0]; 
                
                if(moveAttempt.san === expectedMove || (source+target) === expectedMove || (source+target+'q') === expectedMove) {
                    board.position(game.fen());
                    score++; missionResults.push({status: "Correct"});
                    const randomMsg = funnyComments[Math.floor(Math.random() * funnyComments.length)];
                    const notif = document.getElementById('applause-notif');
                    notif.innerText = randomMsg;
                    notif.style.opacity = '1';
                    $('#board-container').addClass('correct-flash');
                    canInteract = false;
                    setTimeout(() => {
                        notif.style.opacity = '0';
                        $('#board-container').removeClass('correct-flash');
                        currentIdx++; loadQuestion();
                    }, 1200);
                } else {
                    canInteract = false;
                    game.undo(); 
                    const moveObj = game.move(expectedMove, {sloppy: true});
                    board.position(game.fen());

                    const taskBox = document.getElementById('task-text');
                    taskBox.innerText = "LEARN THE MOVE! 🧠";
                    taskBox.classList.add('wrong-flash');
                    
                    $(`.square-${moveObj.from}`).addClass('highlight-correction');
                    $(`.square-${moveObj.to}`).addClass('highlight-correction');

                    document.getElementById("continue-btn").style.display = "block";
                    lives = 0; updateLivesUI();
                    missionResults.push({status: "Incorrect"});
                }
            }
        }

        function nextAfterCorrection() {
            currentIdx++;
            loadQuestion();
        }

        function updateLivesUI() { document.getElementById("lives-display").innerText = "❤️".repeat(lives); }

        async function finishGame() {
            const timeTaken = Math.floor((Date.now() - missionStartTime) / 1000);
            document.getElementById("progress-bar").style.width = "100%";
            let table = `<table class="summary-table"><tr><th>Mission</th><th>Result</th></tr>`;
            missionResults.forEach((r, i) => {
                table += `<tr><td>Puzzle #${i+1}</td><td style="color:${r.status=='Correct'?'#4ade80':'#ef4444'}">${r.status}</td></tr>`;
            });
            document.getElementById("summary-container").innerHTML = table + "</table>";
            document.getElementById("final-points").innerText = score;
            document.getElementById("game-area").classList.add("hidden");
            document.getElementById("post-game").classList.remove("hidden");

            const userRef = db.collection("student_progress").doc(pName.toLowerCase());
            const mKey = `L${currentLevel}T${currentTerm}W${currentWeek}`;
            try {
                await db.runTransaction(async (t) => {
                    const doc = await t.get(userRef);
                    if(!doc.exists) { 
                        t.set(userRef, {name: pName, class: pClass, totalScore: score, completedMissions: [mKey]}); 
                    } else {
                        const data = doc.data();
                        if(!data.completedMissions.includes(mKey)) {
                            t.update(userRef, { 
                                totalScore: (data.totalScore || 0) + score, 
                                name: pName,
                                class: pClass,
                                completedMissions: firebase.firestore.FieldValue.arrayUnion(mKey) 
                            });
                        }
                    }
                });
            } catch (e) { console.error(e); }

            await db.collection("weekly_grading").add({
                name: pName,
                class: pClass, 
                weekKey: `L${currentLevel}W${currentWeek}`,
                score: score,
                time: timeTaken,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function teacherLogin() {
            const pw = prompt("Enter Admin Password:");
            if(pw === "dotun1234") { fetchLeaderboard(null); }
            else { alert("Incorrect Password."); }
        }

        function fetchWeeklyRanking() { fetchLeaderboard(`L${currentLevel}W${currentWeek}`); }

        function fetchLeaderboard(filter) {
            const listArea = document.getElementById('leaderboard-data');
            const titleArea = document.getElementById('modal-title');
            listArea.innerHTML = "Fetching stats...";
            document.getElementById("results-modal").classList.remove("hidden");

            let query = filter ? db.collection("weekly_grading").where("weekKey", "==", filter).orderBy("score", "desc").orderBy("time", "asc") 
                               : db.collection("student_progress").orderBy("totalScore", "desc").limit(50);
            
            titleArea.innerText = filter ? `🏆 WEEKLY BEST (${filter})` : "🏆 TOP STRATEGISTS";

            query.get().then(snap => {
                let h = "";
                snap.forEach(d => {
                    let s = d.data();
                    h += `<div class="leaderboard-entry">
                        <div>
                            <span style="font-weight:bold;">${s.name}</span><br>
                            <span style="font-size:0.7em; color:#94a3b8;">${s.class || 'No Class'}</span>
                        </div>
                        <div style="text-align:right; align-self:center;">
                            <span style="color:var(--secondary); font-weight:bold;">
                                ${filter ? s.score : (s.totalScore || 0)} PTS
                            </span>
                        </div>
                    </div>`;
                });
                listArea.innerHTML = h || "No data recorded yet.";
            });
        }
    </script>
</body>
