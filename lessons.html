<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters Chess Academy | Lessons</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Theme: Purple and Green */
        :root { --purple: #4c1d95; --green: #065f46; --gold: #fbbf24; --dark: #1e1b4b; --white: #ffffff; }
        body { font-family: 'Poppins', sans-serif; background: var(--purple); color: var(--white); margin: 0; padding-bottom: 50px; }
        
        .container { max-width: 900px; margin: 20px auto; padding: 25px; background: var(--white); color: #333; border-radius: 20px; border: 5px solid var(--green); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        h1, h2 { font-family: 'Cinzel'; color: var(--purple); text-align: center; margin: 0 0 15px 0; }
        
        /* Nav Panels */
        .panel { background: #f3f4f6; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; margin: 5px; transition: 0.3s; font-family: 'Poppins'; }
        .btn-grade { background: var(--dark); color: var(--white); }
        .btn-lesson { background: #ddd; color: #333; }
        .active { background: var(--green) !important; color: var(--white) !important; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

        /* Board Styling */
        .lesson-flex { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: flex-start; }
        #board { width: 350px; border: 8px solid var(--purple); border-radius: 8px; }
        .instruction-box { flex: 1; min-width: 300px; background: #fdf2ff; padding: 20px; border-radius: 12px; border-left: 8px solid var(--green); }

        /* Quiz UI */
        .quiz-card { display: none; background: #f9f9f9; padding: 25px; border-radius: 15px; border: 3px dashed var(--purple); margin-top: 20px; }
        .progress-bar { width: 100%; height: 10px; background: #ddd; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--green); width: 0%; transition: 0.5s; }
        .opt-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; cursor: pointer; background: white; font-size: 1rem; text-align: left; }
        .correct { background: #d1fae5 !important; border-color: #10b981 !important; color: #065f46; font-weight: bold; }
        .wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }

        .submit-wa { display: none; width: 100%; background: var(--purple); color: white; padding: 20px; border: none; border-radius: 10px; font-weight: bold; font-size: 1.3rem; cursor: pointer; box-shadow: 0 4px 0 #2e1065; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mind Masters Chess Academy</h1>

    <div class="panel">
        <div id="grade-nav">
            <button class="btn btn-grade active" onclick="setGrade(1, this)">Grade 1</button>
            <button class="btn btn-grade" onclick="setGrade(2, this)">Grade 2</button>
            <button class="btn btn-grade" onclick="setGrade(3, this)">Grade 3</button>
            <button class="btn btn-grade" onclick="setGrade(4, this)">Grade 4</button>
            <button class="btn btn-grade" onclick="setGrade(5, this)">Grade 5</button>
            <button class="btn btn-grade" onclick="setGrade(6, this)">Grade 6</button>
        </div>
        <div style="margin-top: 10px;" id="lesson-nav">
            <button class="btn btn-lesson active" onclick="setLesson(1, this)">Lesson 1</button>
            <button class="btn btn-lesson" onclick="setLesson(2, this)">Lesson 2</button>
            <button class="btn btn-lesson" onclick="setLesson(3, this)">Lesson 3</button>
            <button class="btn btn-lesson" onclick="setLesson(4, this)">Lesson 4</button>
            <button class="btn btn-lesson" onclick="setLesson(5, this)">Lesson 5</button>
        </div>
    </div>

    <div id="learning-ui" class="lesson-flex">
        <div id="board"></div>
        <div class="instruction-box">
            <h2 id="lesson-title">Loading...</h2>
            <p id="lesson-text"></p>
            <button class="btn" style="background:var(--green); color:white; width:100%;" onclick="startQuiz()">Start 10-Question Assignment</button>
        </div>
    </div>

    <div id="quiz-ui" class="quiz-card">
        <div class="progress-bar"><div id="p-fill" class="progress-fill"></div></div>
        <h3 id="q-count">Question 1 of 10</h3>
        <p id="q-text" style="font-size: 1.2rem; font-weight: 600;"></p>
        <div id="options-box"></div>
        <div id="feedback" style="text-align:center; margin-top:15px; font-weight:bold;"></div>
        
        <button id="waBtn" class="submit-wa" onclick="submitToDotun()">
            Submit to Mr. Dotun 📄
        </button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    let currentGrade = 1;
    let currentLesson = 1;
    let currentQ = 0;
    let totalCorrect = 0;
    let board = null;

    const academyData = {
        "1-1": {
            title: "The King's Walk",
            pos: "4k3/8/8/8/8/8/8/4K3 w - - 0 1",
            text: "The King moves one square in any direction. He is the most important piece!",
            questions: [
                { q: "How many squares can the King move?", a: "1", o: ["1", "2", "5"] },
                { q: "Can the King jump over pieces?", a: "No", o: ["Yes", "No", "Only on Tuesdays"] },
                { q: "Is the King the most important piece?", a: "Yes", o: ["Yes", "No", "Maybe"] },
                { q: "In what direction can the King move?", a: "All directions", o: ["Forward only", "Sideways only", "All directions"] },
                { q: "What happens if the King is lost?", a: "Game Over", o: ["Nothing", "Game Over", "New piece"] },
                { q: "Can two Kings stand next to each other?", a: "No", o: ["Yes", "No", "Only friends"] },
                { q: "Is the King the tallest piece?", a: "Yes", o: ["Yes", "No", "No"] },
                { q: "Does the King have a cross on his head?", a: "Yes", o: ["Yes", "No", "No"] },
                { q: "How many Kings does each player start with?", a: "1", o: ["1", "2", "8"] },
                { q: "Can the King move to a square being attacked?", a: "No", o: ["Yes", "No", "Only first move"] }
            ]
        },
        "2-1": {
            title: "The Power of Pieces",
            pos: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
            text: "Pieces have points. Queen=9, Rook=5, Bishop/Knight=3, Pawn=1.",
            questions: [
                { q: "How many points is a Rook worth?", a: "5", o: ["3", "5", "9"] },
                { q: "Which piece is worth 9 points?", a: "Queen", o: ["King", "Queen", "Rook"] },
                { q: "A Pawn is worth how many points?", a: "1", o: ["1", "2", "3"] },
                { q: "Which piece is worth 3 points?", a: "Bishop", o: ["Bishop", "Rook", "Queen"] },
                { q: "Losing a Queen for a Rook is a good trade?", a: "No", o: ["Yes", "No", "Equal"] },
                { q: "Two Rooks are worth how many points?", a: "10", o: ["5", "10", "15"] },
                { q: "Is a Knight worth more than a Pawn?", a: "Yes", o: ["Yes", "No", "Equal"] },
                { q: "Which piece has 'infinite' value?", a: "King", o: ["Queen", "King", "Rook"] },
                { q: "Three Pawns are worth the same as a...?", a: "Knight", o: ["Knight", "Rook", "Queen"] },
                { q: "Which is more valuable: 2 Bishops or 1 Rook?", a: "2 Bishops", o: ["2 Bishops", "1 Rook", "Equal"] }
            ]
        },
        "3-1": {
            title: "Back Rank Tactics",
            pos: "6k1/5ppp/8/8/8/8/8/3R2K1 w - - 0 1",
            text: "A Back Rank mate happens when a King is trapped behind its own pawns.",
            questions: [
                { q: "What is the winning move for White?", a: "Rd8#", o: ["Rd8#", "Kh1", "Ra1"] },
                { q: "What blocks the Black King from moving up?", a: "His own pawns", o: ["The Rook", "His own pawns", "The edge"] },
                { q: "Is this a checkmate?", a: "Yes", o: ["Yes", "No", "Stalemate"] },
                { q: "How many pawns are trapping the King?", a: "3", o: ["1", "2", "3"] },
                { q: "Could a Queen do this same checkmate?", a: "Yes", o: ["Yes", "No", "Only white square"] },
                { q: "What move helps Black avoid this mate?", a: "h6", o: ["h6", "Kf8", "Kg8"] },
                { q: "The 'Back Rank' for Black is rank...?", a: "8", o: ["1", "7", "8"] },
                { q: "Does the White King have an escape?", a: "Yes", o: ["Yes", "No", "Not yet"] },
                { q: "If Black has a Rook on a8, is Rd8 mate?", a: "No", o: ["Yes", "No", "Maybe"] },
                { q: "What is 'Luft'?", a: "Creating an escape hole", o: ["A capture", "Creating escape hole", "Fast move"] }
            ]
        },
        "4-1": {
            title: "Scholar's Mate Defense",
            pos: "r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 0 1",
            text: "White is trying to mate on f7. How do we defend?",
            questions: [
                { q: "Which square is White attacking twice?", a: "f7", o: ["f7", "h7", "e5"] },
                { q: "Best way for Black to block the Queen?", a: "g6", o: ["g6", "Nf6", "d5"] },
                { q: "How many moves does Scholar's Mate take?", a: "4", o: ["2", "4", "10"] },
                { q: "Which two White pieces work together?", a: "Queen and Bishop", o: ["Queen and Bishop", "Knight", "Rook"] },
                { q: "Is f7 the weakest square at the start?", a: "Yes", o: ["Yes", "No", "Only White"] },
                { q: "If White plays Qxf7, what is it?", a: "Checkmate", o: ["Checkmate", "Stalemate", "Mistake"] },
                { q: "Should you bring Queen out too early?", a: "No", o: ["Yes", "No", "Winning"] },
                { q: "Can the Knight on c6 defend f7?", a: "No", o: ["Yes", "No", "Sometimes"] },
                { q: "What is the best defensive piece for f7?", a: "The King", o: ["The King", "The Bishop", "The Queen"] },
                { q: "Is Scholar's Mate common?", a: "Yes", o: ["Yes", "No", "Beginners"] }
            ]
        },
        "5-1": {
            title: "Knight Forks",
            pos: "r3k2r/pppq1ppp/2n5/2b1p1N1/8/2NP4/PPP2PPP/R1BQ1RK1 w kq - 0 1",
            text: "The Knight is dangerous because it can jump and attack two pieces at once!",
            questions: [
                { q: "If White plays Nxf7, what is forked?", a: "Rook and Queen", o: ["Rook and Queen", "King and Pawn", "Bishop"] },
                { q: "What shape does a Knight move in?", a: "L-shape", o: ["Diagonal", "Straight", "L-shape"] },
                { q: "Can a Knight jump over pieces?", a: "Yes", o: ["Yes", "No", "Once"] },
                { q: "A 'Fork' is a type of...?", a: "Tactic", o: ["Opening", "Tactic", "Endgame"] },
                { q: "How many squares does a Knight jump?", a: "3 total", o: ["2", "3 total", "5"] },
                { q: "Can a Knight fork a King and Queen?", a: "Yes", o: ["Yes", "No", "If checked"] },
                { q: "Is a fork a 'double attack'?", a: "Yes", o: ["Yes", "No", "Only Rook"] },
                { q: "How do you escape a fork?", a: "Move the most valuable piece", o: ["Move valuable piece", "Resign", "Capture"] },
                { q: "Knights are best in the...?", a: "Center", o: ["Corner", "Center", "Edge"] },
                { q: "Does a fork work on any square color?", a: "Yes", o: ["Yes", "No", "Only white"] }
            ]
        },
        "6-1": {
            title: "Pawn Promotion",
            pos: "8/P7/8/k7/8/8/8/K7 w - - 0 1",
            text: "A pawn that reaches the 8th rank can become a more powerful piece.",
            questions: [
                { q: "Best piece to promote to?", a: "Queen", o: ["Queen", "Knight", "Rook"] },
                { q: "Can you have two Queens?", a: "Yes", o: ["Yes", "No", "No"] },
                { q: "Promoting to a Knight is called?", a: "Underpromotion", o: ["Underpromotion", "Mistake", "Evolution"] },
                { q: "What square will the pawn promote on?", a: "a8", o: ["a8", "h1", "a1"] },
                { q: "Can you promote to a King?", a: "No", o: ["Yes", "No", "Only variants"] },
                { q: "How many pawns can promote?", a: "All 8", o: ["1", "2", "All 8"] },
                { q: "Does promotion happen automatically?", a: "Yes", o: ["Yes", "No", "No"] },
                { q: "Can a promoted piece give check?", a: "Yes", o: ["Yes", "No", "Next turn"] },
                { q: "Value of a promoted Queen?", a: "9", o: ["1", "9", "10"] },
                { q: "Can a pawn promote by capturing?", a: "Yes", o: ["Yes", "No", "No"] }
            ]
        }
    };

    function setGrade(g, btn) {
        currentGrade = g;
        $('.btn-grade').removeClass('active');
        $(btn).addClass('active');
        loadLesson();
    }

    function setLesson(l, btn) {
        currentLesson = l;
        $('.btn-lesson').removeClass('active');
        $(btn).addClass('active');
        loadLesson();
    }

    function loadLesson() {
        const key = `${currentGrade}-${currentLesson}`;
        const data = academyData[key] || { 
            title: "Practice Mode", pos: "start", 
            text: "Lesson content loading. Please select Lesson 1.",
            questions: Array(10).fill({q: "Ready?", a: "Yes", o: ["Yes", "No", "Maybe"]})
        };

        $('#lesson-title').text(`Grade ${currentGrade}: ${data.title}`);
        $('#lesson-text').text(data.text);
        $('#learning-ui').show();
        $('#quiz-ui').hide();

        if (board) board.destroy();
        board = Chessboard('board', {
            position: data.pos,
            showNotation: true,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });
    }

    function startQuiz() {
        currentQ = 0;
        totalCorrect = 0;
        $('#learning-ui').hide();
        $('#quiz-ui').show();
        showQuestion();
    }

    function showQuestion() {
        const key = `${currentGrade}-${currentLesson}`;
        const data = academyData[key] || academyData["1-1"];
        const qData = data.questions[currentQ];
        
        $('#q-count').text(`Question ${currentQ + 1} of 10`);
        $('#p-fill').css('width', `${(currentQ / 10) * 100}%`);
        $('#q-text').text(qData.q);
        $('#feedback').text("");
        
        const shuffled = [...qData.o].sort(() => Math.random() - 0.5);
        $('#options-box').empty();
        
        shuffled.forEach(opt => {
            const b = $('<button class="opt-btn"></button>').text(opt);
            b.click(function() {
                $('.opt-btn').off('click');
                if (opt === qData.a) {
                    $(this).addClass('correct');
                    totalCorrect++;
                    $('#feedback').text("Excellent! ✅");
                } else {
                    $(this).addClass('wrong');
                    $('#feedback').text("Not quite. ❌ Answer: " + qData.a);
                }
                
                setTimeout(() => {
                    currentQ++;
                    if (currentQ < 10) {
                        showQuestion();
                    } else {
                        finishQuiz();
                    }
                }, 1500);
            });
            $('#options-box').append(b);
        });
    }

    function finishQuiz() {
        $('#p-fill').css('width', '100%');
        $('#q-text').text("Workbook Complete!");
        $('#options-box').empty();
        $('#feedback').html(`<h2>Final Score: ${totalCorrect}/10</h2><p>Click below to log your score.</p>`);
        $('#waBtn').show();
    }

    function submitToDotun() {
        const googleFormUrl = "https://docs.google.com/forms/d/19VQAm3JueyiwpfDeh6kuf2rKa41lrssbsHiIlC-Pxe4/edit"; 
        window.open(googleFormUrl);
    }

    $(document).ready(loadLesson);
</script>

</body>
</html>
