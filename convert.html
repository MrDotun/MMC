<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Puzzle Converter</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; color: #333; }
        textarea { width: 100%; height: 150px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; padding: 10px; font-size: 14px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        button { border: none; padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-gen { background: #007bff; color: white; }
        .btn-copy { background: #28a745; color: white; display: none; }
        .btn-dl { background: #ffc107; color: #212529; display: none; }
        #output { background: #fff; border: 1px solid #ddd; padding: 10px; margin-top: 20px; white-space: pre-wrap; word-break: break-all; font-size: 11px; border-radius: 8px; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h2>Puzzle to JSON</h2>
    <textarea id="input" placeholder="Paste all text from mate2.txt here..."></textarea>
    
    <div class="btn-group">
        <button class="btn-gen" onclick="convert()">1. Generate JSON</button>
        <button id="copyBtn" class="btn-copy" onclick="copyToClipboard()">2. Copy JSON to Clipboard</button>
        <button id="dlBtn" class="btn-dl" onclick="downloadJSON()">3. Download puzzles.json</button>
    </div>
    
    <div id="output">JSON will appear here...</div>

    <script>
        let resultJson = "";

        function convert() {
            const text = document.getElementById('input').value;
            if(!text) return alert("Please paste the text first!");

            const blocks = text.trim().split(/\n\s*\n/);
            const puzzles = blocks.map(block => {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l);
                if (lines.length >= 3) {
                    return {
                        title: lines[0].replace(/\\s*/, ''),
                        fen: lines[1],
                        solution: lines[2]
                    };
                }
                return null;
            }).filter(p => p !== null);

            resultJson = JSON.stringify(puzzles, null, 2);
            document.getElementById('output').innerText = resultJson;
            
            // Show the action buttons
            document.getElementById('copyBtn').style.display = "block";
            document.getElementById('dlBtn').style.display = "block";
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(resultJson).then(() => {
                alert("JSON copied! Now go to GitHub, create 'puzzles.json', and paste this.");
            });
        }

        function downloadJSON() {
            const blob = new Blob([resultJson], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "puzzles.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
