<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Puzzle Converter</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        textarea { width: 100%; height: 200px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; padding: 10px; }
        button { background: #007bff; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; cursor: pointer; }
        #output { background: #fff; border: 1px solid #ddd; padding: 10px; margin-top: 20px; white-space: pre-wrap; word-break: break-all; font-size: 12px; border-radius: 8px; }
    </style>
</head>
<body>
    <h2>Puzzle to JSON</h2>
    <p>Paste the content of your .txt file here:</p>
    <textarea id="input" placeholder="Paste txt data here..."></textarea>
    <button onclick="convert()">Generate JSON</button>
    
    <div id="output">JSON will appear here...</div>

    <script>
        function convert() {
            const text = document.getElementById('input').value;
            const output = document.getElementById('output');
            
            // Split by empty lines to get each puzzle block
            const blocks = text.trim().split(/\n\s*\n/);
            
            const puzzles = blocks.map(block => {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l);
                
                if (lines.length >= 3) {
                    return {
                        title: lines[0].replace(/\\s*/, ''),
                        fen: lines[1],
                        solution: lines[2]
                    };
                }
                return null;
            }).filter(p => p !== null);

            output.innerText = JSON.stringify(puzzles, null, 2);
        }
    </script>
</body>
</html>
