<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Variation Master Pro | Decipher Chess Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chunk-card { border-left: 4px solid #d4af37; transition: all 0.2s; cursor: pointer; }
        .chunk-card.completed { border-left-color: #10b981; opacity: 0.5; }
        textarea { background: #0f172a !important; border: 1px solid #334155 !important; font-family: 'Fira Code', monospace; scrollbar-width: thin; }
        textarea:focus { border-color: #d4af37 !important; outline: none; }
        #progress-fill { height: 100%; background: #d4af37; width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-bold gold-text tracking-tight italic">DECIPHER <span class="text-white not-italic">GM-MASTER PRO</span></h1>
                <p class="text-slate-400 text-sm font-light uppercase tracking-widest">Global Context + Positional Logic Engine</p>
            </div>
            <nav class="flex gap-2 p-1 bg-slate-900 rounded-lg w-full md:w-auto">
                <button onclick="switchTab('fragmenter')" id="tab-f" class="flex-1 md:flex-none px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg">1. Fragmenter</button>
                <button onclick="switchTab('reassembler')" id="tab-r" class="flex-1 md:flex-none px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white">2. Re-assembler</button>
            </nav>
        </header>

        <div id="view-fragmenter" class="space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-xs font-bold uppercase text-slate-500">Master PGN Input</label>
                    <div class="text-right">
                        <div id="stats" class="text-[10px] text-slate-400 uppercase tracking-widest">Ready</div>
                        <div class="w-32 h-1 bg-slate-800 mt-1 rounded-full overflow-hidden"><div id="progress-fill"></div></div>
                    </div>
                </div>
                <textarea id="pgn-input" rows="6" class="w-full p-4 rounded-xl text-sm mb-4" placeholder="Paste PGN here..."></textarea>
                
                <div class="grid grid-cols-2 gap-3 md:flex md:flex-wrap">
                    <button onclick="processPgn()" class="px-4 py-3 bg-white text-black font-bold rounded-xl hover:bg-slate-200 uppercase text-xs">Initialize Engine</button>
                    <button onclick="clearAll()" class="px-4 py-3 bg-red-900/30 text-red-400 rounded-xl font-bold uppercase text-xs">Reset</button>
                    <button onclick="copyNextBatch()" id="batch-btn" class="col-span-2 px-4 py-3 gold-bg rounded-xl font-bold hidden uppercase text-xs">Copy Next 10</button>
                    <button onclick="copyAllRemaining()" id="all-btn" class="col-span-2 px-4 py-3 bg-slate-800 text-white rounded-xl font-bold hidden uppercase text-xs">Copy All Remaining</button>
                </div>
            </div>
            <div id="chunks-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
        </div>

        <div id="view-reassembler" class="hidden space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 1: Paste AI JSON</label>
                        <textarea id="ai-json" rows="14" class="w-full p-4 rounded-xl text-xs" placeholder="Paste the entire JSON response here..."></textarea>
                    </div>
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 2: Final Re-Assembled PGN</label>
                        <textarea id="final-pgn" rows="14" class="w-full p-4 rounded-xl text-xs text-emerald-400" readonly></textarea>
                        <div class="flex gap-2">
                            <button onclick="copyToClipboard('final-final-pgn')" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase">Copy Final</button>
                            <button onclick="downloadPgn()" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase">Download</button>
                        </div>
                    </div>
                </div>
                <button onclick="rebuildPgn()" class="mt-6 w-full py-4 gold-bg rounded-xl font-bold uppercase tracking-widest shadow-lg shadow-yellow-900/20 text-xs">Inject Annotations & Rebuild File</button>
            </div>
        </div>
    </div>

    <script>
        let globalChunks = [];
        let pgnTokens = [];
        let currentBatchStart = 0;
        let garboWorker = null;

        // --- MOBILE COMPATIBLE WORKER CODE EMBEDDING ---
        // This block stringifies the background worker logic so it runs inside a virtual local URL
        const workerCode = `
            // Grab the active window location to path back to your root directory
            var baseUrl = "";
            
            // Listen for structural activation
            onmessage = function(e) {
                const { command, data, originUrl } = e.data;

                if (command === 'INIT_URL') {
                    baseUrl = originUrl;
                    importScripts(baseUrl + '/garbochess.js');
                    return;
                }

                if (command === 'START_ANALYSIS') {
                    if (typeof ResetGame === 'undefined') {
                        postMessage({ type: 'ERROR', message: 'garbochess.js not loaded. Ensure it is in the same folder.' });
                        return;
                    }
                    
                    ResetGame();
                    InitializeFromFen(data.fen || "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
                    
                    let currentIndex = 0;

                    function parseSanMove(san) {
                        var cleanSan = san.replace(/[+#]/g, '');
                        var moveList = [];
                        GenerateValidMoves(moveList);
                        
                        for (var i = 0; i < moveList.length; i++) {
                            var internalMove = moveList[i];
                            if (typeof GetSanString !== 'undefined' && GetSanString(internalMove) === cleanSan) {
                                return internalMove;
                            }
                        }
                        for (var i = 0; i < moveList.length; i++) {
                            var internalMove = moveList[i];
                            var moveString = FormatMove(internalMove);
                            if (/^[a-h][1-8]$/.test(cleanSan)) {
                                if (moveString.endsWith(cleanSan) && (g_board[internalMove & 0xFF] & 0x7) === 1) {
                                    return internalMove;
                                }
                            }
                            if (cleanSan === "O-O" && (internalMove & 0x3F0000) === 0x200000) return internalMove;
                            if (cleanSan === "O-O-O" && (internalMove & 0x3F0000) === 0x300000) return internalMove;
                        }
                        return null;
                    }

                    function processNextToken() {
                        if (currentIndex >= data.tokens.length) {
                            postMessage({ type: 'ANALYSIS_COMPLETE' });
                            return;
                        }

                        const token = data.tokens[currentIndex];
                        const parsedMove = parseSanMove(token);

                        if (parsedMove === null) {
                            currentIndex++;
                            processNextToken();
                            return;
                        }

                        MakeMove(parsedMove); 
                        
                        const maxDepth = 8;     // Lowered depth slightly for faster performance on mobile chips
                        const maxTimeMs = 400;  // Balanced time allocation for battery efficiency

                        Search(function(bestMove, value, timeTaken, ply) {
                            let scoreText = "";
                            if (value > 20000) {
                                scoreText = "M" + (25000 - value);
                            } else if (value < -20000) {
                                scoreText = "M-" + (25000 + value);
                            } else {
                                scoreText = (value / 100).toFixed(2);
                                if (value > 0) scoreText = "+" + scoreText;
                            }

                            postMessage({ 
                                type: 'CHUNK_READY', 
                                chunk: {
                                    moveToken: token,
                                    evaluation: scoreText,
                                    suggestedBestMove: bestMove ? FormatMove(bestMove) : "None"
                                }
                            });

                            currentIndex++;
                            processNextToken();
                        }, maxDepth, maxTimeMs);
                    }
                    processNextToken();
                }
            };
        `;

        window.onload = () => {
            const saved = localStorage.getItem('gm_master_state');
            if (saved) {
                const state = JSON.parse(saved);
                document.getElementById('pgn-input').value = state.original;
                processPgn(true);
                currentBatchStart = state.batchStart;
                updateUI();
            }
            initGarboWorker();
        };

        function initGarboWorker() {
            try {
                // Convert worker string to a secure, local Blob object to bypass mobile file restrictions
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                const workerUrl = URL.createObjectURL(blob);
                garboWorker = new Worker(workerUrl);
                
                // Pass current folder location path down to the worker
                const currentFolderUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
                garboWorker.postMessage({ command: 'INIT_URL', originUrl: currentFolderUrl });

                garboWorker.onmessage = function(e) {
                    const { type, chunk, message } = e.data;
                    
                    if (type === 'CHUNK_READY') {
                        const targetChunk = globalChunks.find(c => c.target.split(' ')[0] === chunk.moveToken && !c.garboEval);
                        if (targetChunk) {
                            targetChunk.garboEval = chunk.evaluation;
                            targetChunk.garboBest = chunk.suggestedBestMove;
                            updateUI();
                        }
                    } else if (type === 'ANALYSIS_COMPLETE') {
                        document.getElementById('stats').innerText = "ENGINE COMPLETED";
                    } else if (type === 'ERROR') {
                        alert("Engine notice: " + message);
                    }
                };
            } catch (err) {
                console.error("Worker initialization error:", err);
            }
        }

        function switchTab(tab) {
            document.getElementById('view-fragmenter').classList.toggle('hidden', tab !== 'fragmenter');
            document.getElementById('view-reassembler').classList.toggle('hidden', tab !== 'reassembler');
            const f = document.getElementById('tab-f');
            const r = document.getElementById('tab-r');
            f.className = tab === 'fragmenter' ? 'flex-1 md:flex-none px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg' : 'flex-1 md:flex-none px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
            r.className = tab === 'reassembler' ? 'flex-1 md:flex-none px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg' : 'flex-1 md:flex-none px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
        }

        function getFenFromPath(path) {
            try {
                if (typeof Chess === 'undefined') return "FEN_ENGINE_MISSING";
                const chess = new Chess();
                for (let move of path) {
                    let cleanMove = move.replace(/[!?]+$/, '').replace(/\$\d+/g, '').replace(/(\+\/-|-\/\+|=\/\+|\+=|=\+|\+-|-\+|=)$/, '').trim();
                    cleanMove = cleanMove.replace(/0-0-0/g, 'O-O-O').replace(/0-0/g, 'O-O');

                    if (cleanMove && !/^\d+\.+$/.test(cleanMove) && cleanMove !== '(' && cleanMove !== ')') {
                        if (cleanMove === '--' || cleanMove === 'Z0') {
                            let tokens = chess.fen().split(' ');
                            tokens[1] = tokens[1] === 'w' ? 'b' : 'w';
                            tokens[3] = '-'; 
                            chess.load(tokens.join(' '));
                            continue;
                        }
                        chess.move(cleanMove, { sloppy: true });
                    }
                }
                return chess.fen();
            } catch (e) {
                return "FEN_GENERATION_FAILED";
            }
        }

        function processPgn(isLoad = false) {
            const input = document.getElementById('pgn-input').value;
            if (!input) return;

            pgnTokens = input.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|\$\d+|[a-zA-Z0-9\-+=#\/]+[?!]*)/g) || [];
            
            let chunks = [];
            let moveNumber = 0;
            let variationLevel = 0;
            let currentPath = [];
            let savedPaths = []; 
            let depthPlyCounts = { 0: 0 }; 
            let justClosedVariation = false;
            let rawMoveTokensOnly = [];

            pgnTokens.forEach((token, index) => {
                if (token === "(") {
                    variationLevel++;
                    depthPlyCounts[variationLevel] = 0; 
                    savedPaths.push([...currentPath]);
                    if (currentPath.length > 0) currentPath.pop();
                    justClosedVariation = false; 
                    return; 
                }
                if (token === ")") {
                    variationLevel--;
                    justClosedVariation = true; 
                    if (savedPaths.length > 0) {
                        currentPath = savedPaths.pop();
                    }
                    return; 
                }
                
                const isMoveNum = /^\d+\./.test(token);
                if (isMoveNum) {
                    moveNumber = parseInt(token);
                    return; 
                }

                const isMove = (/^[a-zA-Z]/.test(token) || token.startsWith('0-0') || token.startsWith('O-O')) && !token.startsWith('{') && !token.startsWith('[');
                
                if (isMove) {
                    depthPlyCounts[variationLevel]++;
                    currentPath.push(token);
                    
                    // Filter out annotation numbers, compile pure consecutive moves for Garbo input tracking
                    let cleanToken = token.replace(/[!?]+$/, '').replace(/(\+\/-|-\/\+|=\/\+|\+=|=\+|\+-|-\+|=)$/, '').trim();
                    rawMoveTokensOnly.push(cleanToken);

                    let evalSymbol = "";
                    let nextToken = pgnTokens[index + 1];
                    
                    const isEvalToken = nextToken && (nextToken.startsWith('$') || /^[!?]+$/.test(nextToken) || /^(\+\/-|-\/\+|=\/\+|\+=|=\+|\+-|-\+|=|∞|=\/∞)$/.test(nextToken));
                    if (isEvalToken) {
                        evalSymbol = ` ${nextToken}`;
                    }

                    const attachedEvalRegex = /[!?]+$|(\+\/-|-\/\+|=\/\+|\+=|=\+|\+-|-\+|=|∞|=\/∞)$/;
                    const hasImportantSymbol = attachedEvalRegex.test(token) || evalSymbol !== "";

                    const isFirstMoveOfVariation = (variationLevel > 0 && depthPlyCounts[variationLevel] === 1);
                    const isStrideMove = (depthPlyCounts[variationLevel] % 6 === 0) || isFirstMoveOfVariation || justClosedVariation;

                    if (isStrideMove || hasImportantSymbol) {
                        const pathWithTarget = currentPath.slice(0); 
                        
                        chunks.push({
                            id: `CHUNK_${chunks.length}`,
                            target: token + evalSymbol,
                            moveNum: moveNumber,
                            tokenIndex: index,
                            context: currentPath.slice(-15, -1).join(" "), 
                            fen: getFenFromPath(pathWithTarget),
                            isMainLine: variationLevel === 0,
                            isReturning: justClosedVariation && variationLevel === 0,
                            garboEval: null,
                            garboBest: null
                        });
                        
                        justClosedVariation = false; 
                    }
                }
            });

            globalChunks = chunks;
            if (!isLoad) currentBatchStart = 0;
            document.getElementById('batch-btn').classList.remove('hidden');
            document.getElementById('all-btn').classList.remove('hidden');
            updateUI();
            saveState();

            if (!isLoad && garboWorker && rawMoveTokensOnly.length > 0) {
                document.getElementById('stats').innerText = "THINKING...";
                garboWorker.postMessage({
                    command: 'START_ANALYSIS',
                    data: {
                        fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
                        tokens: rawMoveTokensOnly
                    }
                });
            }
        }

        function formatBatch(start, end) {
            const masterPgn = document.getElementById('pgn-input').value;

            const batch = globalChunks.slice(start, end).map(c => {
                let garboMetrics = c.garboEval ? `\n[GarboChess Engine Score: ${c.garboEval}, Best Move Alternative: ${c.garboBest}]` : '';
                return `[ID: ${c.id}]\nMove Number: ${c.moveNum}\nFEN: ${c.fen}${garboMetrics}\nPath taken to this move: ${c.context}\n--> TARGET MOVE: ${c.target} <--\nMain Line: ${c.isMainLine}\nReturning to Main: ${c.isReturning}`;
            }).join("\n\n---\n\n");

            return `Role: You are a 2700+ ELO Super Grandmaster and the author of an elite chess repertoire course on the Nimzo-Indian Defense for BLACK.
Task: Write deeply insightful, practical course annotations for the TARGET MOVES provided in the batch. Combine the context with the attached computer hardware evaluation engine scores if available.

=== MASTER GAME TREE (GLOBAL Context) ===
Use this tree to understand the "big picture" and how variations relate to one another.
${masterPgn}
=========================================

STRICT ANALYTICAL FRAMEWORK & STYLE GUIDELINES:

1. PERSPECTIVE & TONE: Write entirely from Black's perspective using inclusive language like "we" and "our" (e.g., "Here we develop our bishop"). Frame White's moves as attempts to challenge us. Reassure the student when White deviates (e.g., "White has three main tries here, but we aren't really bothered since our setup is so solid...").
2. EXPLAIN THE "WHY": Explain the underlying positional goals, pawn structure shifts, or key square control (especially the fight for e4 and d5 in the Nimzo). 
3. NO AI CLICHÉS (CRITICAL): Speak like a real, human Grandmaster giving a practical lesson. Do NOT use generic AI filler words such as: delve, crucial, pivotal, testament, tapestry, multifaceted, moreover, furthermore, importantly, underscore, or dynamic. Keep the tone natural and direct.
4. STRICT LENGTH LIMITS (DON'T BORE THE READER):
   - MAIN LINES (Main Line: true): Write 2-3 flowing sentences. Focus on our core Nimzo plans.
   - VARIATIONS (Main Line: false): STRICTLY 1 SHORT, PUNCHY SENTENCE. Keep sidelines extremely brief so the reader does not get bored. Just quickly state the tactical point or how we equalize, then stop.
5. VARIATION COMPARISON: If the target move is at a fork where White chooses between several lines, explicitly compare them. If "Returning to Main: true", seamlessly transition back (e.g., "Returning to our main game plan...").
6. EVALUATION MARKS TO PROSE: Convert all raw symbols (!, ?, !?, +/=, -/+, etc.) into natural language. NO raw symbols in the output text. "-/+" means WE (Black) have a clear advantage.
7. HIGHLIGHTS & SQUARES: If visual tags like [%csl Rc4,Rf2] appear in the master PGN near the target move, explicitly mention those exact squares.

FORMAT REQUIREMENT: 
Return ONLY a valid JSON object mapping the chunk ID to the text. Do not include markdown blocks like \`\`\`json. Start immediately with the { bracket.
{
  "CHUNK_0": "Your human-sounding GM annotation here...",
  "CHUNK_1": "Your human-sounding GM annotation here..."
}

=== BATCH TO ANALYZE ===
${batch}`;
        }

        function copyNextBatch() {
            const end = Math.min(currentBatchStart + 10, globalChunks.length);
            navigator.clipboard.writeText(formatBatch(currentBatchStart, end));
            currentBatchStart = end;
            updateUI();
            saveState();
            alert("Batch Copied!");
        }

        function copyAllRemaining() {
            navigator.clipboard.writeText(formatBatch(currentBatchStart, globalChunks.length));
            currentBatchStart = globalChunks.length;
            updateUI();
            saveState();
            alert("Full Game Copied!");
        }

        function rebuildPgn() {
            const raw = document.getElementById('ai-json').value;
            let aiData = {};
            const matches = raw.match(/\{[\s\S]*?\}/g);
            if (matches) {
                matches.forEach(m => {
                    try { Object.assign(aiData, JSON.parse(m)); } catch(e){}
                });
            }
            let workingTokens = [...pgnTokens];
            const sortedIds = Object.keys(aiData).sort((a,b) => {
                const idxA = globalChunks.find(c => c.id === a)?.tokenIndex || 0;
                const idxB = globalChunks.find(c => c.id === b)?.tokenIndex || 0;
                return idxB - idxA;
            });
            sortedIds.forEach(id => {
                const chunk = globalChunks.find(c => c.id === id);
                if (chunk) {
                    workingTokens[chunk.tokenIndex] += ` { ${aiData[id]} }`;
                }
            });
            document.getElementById('final-pgn').value = workingTokens.join(" ");
        }

        function updateUI() {
            const container = document.getElementById('chunks-container');
            container.innerHTML = "";
            globalChunks.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = `chunk-card glass p-2 rounded-lg ${i < currentBatchStart ? 'completed' : ''}`;
                
                let evalBadge = c.garboEval ? `<span class="ml-1 text-[8px] px-1 rounded bg-slate-800 text-emerald-400 font-mono font-bold">${c.garboEval}</span>` : '';
                
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <p class="text-[8px] gold-text font-bold">${c.id}</p>
                        ${evalBadge}
                    </div>
                    <p class="text-[10px] truncate">${c.target}</p>
                `;
                container.appendChild(div);
            });
            const perc = (currentBatchStart / globalChunks.length) * 100 || 0;
            document.getElementById('progress-fill').style.width = perc + "%";
            
            if (document.getElementById('stats').innerText !== "THINKING...") {
                document.getElementById('stats').innerText = `${currentBatchStart}/${globalChunks.length} POSITIONS`;
            }
        }

        function saveState() {
            localStorage.setItem('gm_master_state', JSON.stringify({
                original: document.getElementById('pgn-input').value,
                batchStart: currentBatchStart
            }));
        }

        function clearAll() {
            localStorage.removeItem('gm_master_state');
            location.reload();
        }

        function copyToClipboard(id) {
            const val = document.getElementById(id).value;
            navigator.clipboard.writeText(val);
            alert("Copied PGN!");
        }

        // Mobile fallback downloader using text streaming
        function downloadPgn() {
            const val = document.getElementById('final-pgn').value;
            const blob = new Blob([val], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "GM_Variation_Analysis.pgn";
            a.click();
        }
    </script>
</body>
</html>
