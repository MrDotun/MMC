<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Variation Master Pro | Decipher Chess Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="garbochess.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chunk-card { border-left: 4px solid #d4af37; transition: all 0.2s; cursor: pointer; }
        .chunk-card.completed { border-left-color: #10b981; opacity: 0.5; }
        textarea { background: #0f172a !important; border: 1px solid #334155 !important; font-family: 'Fira Code', monospace; scrollbar-width: thin; }
        textarea:focus { border-color: #d4af37 !important; outline: none; }
        #progress-fill { height: 100%; background: #d4af37; width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-bold gold-text tracking-tight italic">DECIPHER <span class="text-white not-italic">GM-MASTER PRO</span></h1>
                <p class="text-slate-400 text-sm font-light uppercase tracking-widest">Enhanced Engine Evaluation + Nested Branches</p>
            </div>
            <nav class="flex gap-2 p-1 bg-slate-900 rounded-lg">
                <button onclick="switchTab('fragmenter')" id="tab-f" class="px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg">1. Fragmenter</button>
                <button onclick="switchTab('reassembler')" id="tab-r" class="px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white">2. Re-assembler</button>
            </nav>
        </header>

        <div id="view-fragmenter" class="space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-xs font-bold uppercase text-slate-500">Master PGN Input</label>
                    <div class="text-right">
                        <div id="stats" class="text-[10px] text-slate-400 uppercase tracking-widest">Ready</div>
                        <div class="w-48 h-1 bg-slate-800 mt-1 rounded-full overflow-hidden"><div id="progress-fill"></div></div>
                    </div>
                </div>
                <textarea id="pgn-input" rows="6" class="w-full p-4 rounded-xl text-sm mb-4" placeholder="Paste PGN with variations here..."></textarea>
                
                <div class="flex flex-wrap gap-3">
                    <button onclick="processPgn()" class="px-6 py-3 bg-white text-black font-bold rounded-xl hover:bg-slate-200 uppercase text-xs">Initialize Analysis</button>
                    <button onclick="copyNextBatch()" id="batch-btn" class="px-6 py-3 gold-bg rounded-xl font-bold hidden uppercase text-xs">Copy Next 10</button>
                    <button onclick="copyAllRemaining()" id="all-btn" class="px-6 py-3 bg-slate-800 text-white rounded-xl font-bold hidden uppercase text-xs">Copy All Remaining</button>
                    <button onclick="clearAll()" class="px-6 py-3 bg-red-900/30 text-red-400 rounded-xl font-bold uppercase text-xs">Reset</button>
                </div>
            </div>
            <div id="chunks-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
        </div>

        <div id="view-reassembler" class="hidden space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 1: Paste Gemini's JSON</label>
                        <textarea id="ai-json" rows="14" class="w-full p-4 rounded-xl text-xs" placeholder="Paste Gemini response here..."></textarea>
                    </div>
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 2: Final PGN</label>
                        <textarea id="final-pgn" rows="14" class="w-full p-4 rounded-xl text-xs text-emerald-400" readonly></textarea>
                    </div>
                </div>
                <button onclick="rebuildPgn()" class="mt-6 w-full py-4 gold-bg rounded-xl font-bold uppercase tracking-widest shadow-lg">Inject Annotations & Rebuild File</button>
            </div>
        </div>
    </div>

    <script>
        let globalChunks = [];
        let pgnTokens = [];
        let currentBatchStart = 0;

        function processPgn(isLoad = false) {
            const input = document.getElementById('pgn-input').value;
            if (!input) return;

            pgnTokens = input.match(/(\(|\)|\d+\.{1,3}|[a-zA-Z0-9\-+=#$?!]+|\{.*?\}|\[.*?\])/g) || [];
            
            ResetGame();
            
            let chunks = [];
            let moveNumber = 0;
            let plyCount = 0;
            let variationLevel = 0;
            let currentPath = [];

            let stateBeforeLastMove = GetFen();
            let returnStack = [];

            pgnTokens.forEach((token, index) => {
                if (token === "(") {
                    variationLevel++;
                    returnStack.push(GetFen());
                    InitializeFromFen(stateBeforeLastMove);
                    return;
                }

                if (token === ")") {
                    variationLevel--;
                    if (returnStack.length > 0) {
                        InitializeFromFen(returnStack.pop());
                    }
                    return;
                }
                
                const isMoveNum = /^\d+\./.test(token);
                if (isMoveNum) moveNumber = parseInt(token);

                const isMove = /^[a-zA-Z]/.test(token) && !token.startsWith('{') && !token.startsWith('[');
                
                if (isMove) {
                    plyCount++;
                    currentPath.push(token);
                    stateBeforeLastMove = GetFen();

                    const move = ParseMove(token);
                    if (move) MakeMove(move);

                    if (moveNumber > 3 || variationLevel > 0) {
                        let evalSymbol = "";
                        let nextToken = pgnTokens[index + 1];
                        if (nextToken && (nextToken.startsWith('$') || /^[!?]+$/.test(nextToken))) {
                            evalSymbol = ` ${nextToken}`;
                        }

                        const hasImportantSymbol = evalSymbol.includes('!') || evalSymbol.includes('?');
                        const isStrideMove = (plyCount % 6 === 0);

                        if (isStrideMove || hasImportantSymbol) {
                            const currentFen = GetFen();
                            
                            g_timeout = 800; 
                            const score = Search(null, 14, null); 
                            const formattedScore = (score / 100).toFixed(2);
                            
                            let enginePlan = "";
                            for (let i = 0; i < g_pv.length; i++) {
                                enginePlan += FormatMove(g_pv[i]) + " ";
                            }

                            chunks.push({
                                id: `CHUNK_${chunks.length}`,
                                target: token + evalSymbol,
                                tokenIndex: index,
                                fen: currentFen,
                                score: formattedScore,
                                plan: enginePlan
                            });
                        }
                    }
                }
            });

            globalChunks = chunks;
            if (!isLoad) currentBatchStart = 0;
            document.getElementById('batch-btn').classList.remove('hidden');
            document.getElementById('all-btn').classList.remove('hidden');
            updateUI();
        }

        function formatBatch(start, end) {
            const batch = globalChunks.slice(start, end).map(c => 
                `ID: ${c.id}\nFEN: ${c.fen}\nSCORE: ${c.score}\nTARGET: ${c.target}\nENGINE_PLAN: ${c.plan}`
            ).join("\n---\n");

            return `Role: 2700 ELO GM.
Task: Write very simple but CONCRETE chess notes for the TARGET.

STRICT RULES:
- Use 8-year old English but explain like a 2700 GM.
- Use "center" NEVER "central". Use "structure" NEVER "structural".
- Use the SCORE to judge the position: (+1.5 is strong, +3.0 is winning, 0.00 is draw).
- Use the ENGINE_PLAN to describe piece maneuvers.
- BE CONCRETE: Name the squares and pieces. 
- Example: "White will soon bring the Bishop to h5 and push the d-pawn to d5 because the Black King is trapped."
- NO VAGUE TALK like "better development". Name the piece that is better.

FORMAT: ONLY JSON
{"CHUNK_ID": "Your concrete note here"}

${batch}`;
        }

        function copyNextBatch() {
            const end = Math.min(currentBatchStart + 10, globalChunks.length);
            navigator.clipboard.writeText(formatBatch(currentBatchStart, end));
            currentBatchStart = end;
            updateUI();
            alert("Batch Copied!");
        }

        function rebuildPgn() {
            const raw = document.getElementById('ai-json').value;
            let aiData = {};
            const matches = raw.match(/\{[\s\S]*?\}/g);
            if (matches) {
                matches.forEach(m => {
                    try { Object.assign(aiData, JSON.parse(m)); } catch(e){}
                });
            }
            let workingTokens = [...pgnTokens];
            const sortedIds = Object.keys(aiData).sort((a,b) => {
                const idxA = globalChunks.find(c => c.id === a)?.tokenIndex || 0;
                const idxB = globalChunks.find(c => c.id === b)?.tokenIndex || 0;
                return idxB - idxA;
            });
            sortedIds.forEach(id => {
                const chunk = globalChunks.find(c => c.id === id);
                if (chunk) {
                    workingTokens[chunk.tokenIndex] += ` { ${aiData[id]} }`;
                }
            });
            document.getElementById('final-pgn').value = workingTokens.join(" ");
        }

        function updateUI() {
            const container = document.getElementById('chunks-container');
            container.innerHTML = "";
            globalChunks.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = `chunk-card glass p-2 rounded-lg ${i < currentBatchStart ? 'completed' : ''}`;
                div.innerHTML = `<p class="text-[8px] gold-text font-bold">${c.id}</p><p class="text-[10px] truncate">${c.target}</p>`;
                container.appendChild(div);
            });
            const perc = (currentBatchStart / globalChunks.length) * 100 || 0;
            document.getElementById('progress-fill').style.width = perc + "%";
            document.getElementById('stats').innerText = `${currentBatchStart}/${globalChunks.length} KEY POSITIONS`;
        }

        function switchTab(tab) {
            document.getElementById('view-fragmenter').classList.toggle('hidden', tab !== 'fragmenter');
            document.getElementById('view-reassembler').classList.toggle('hidden', tab !== 'reassembler');
        }

        function clearAll() { location.reload(); }
    </script>
</body>
</html>
