<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Elite Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { 
            --bg: #0f0e0c; 
            --card: #1c1a17; 
            --secondary: #4ade80; 
            --text: #e0e0e0; 
            --accent: #3b82f6; 
            --gold: #fbbf24; 
            --danger: #ef4444; 
            --glass: rgba(255, 255, 255, 0.05);
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
        }
        
        .container { 
            width: 100%; 
            max-width: 440px; 
            background: var(--card); 
            border-radius: 16px; 
            padding: 20px; 
            box-sizing: border-box; 
            margin-bottom: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .hidden { display: none !important; }

        /* Aesthetic Board Tweak */
        #mainBoard, #liveBoard { 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            filter: sepia(0.2) contrast(1.1); /* Gives the "Broken/Vintage" look */
        }

        .player-bar { 
            background: rgba(0,0,0,0.3); 
            padding: 10px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 14px; 
        }
        .player-bar.top { border-radius: 8px 8px 0 0; border-bottom: 1px solid #333; }
        .player-bar.bottom { border-radius: 0 0 8px 8px; border-top: 1px solid #333; margin-bottom: 20px; }

        .rating-tag { background: #333; padding: 2px 6px; border-radius: 4px; color: var(--gold); font-weight: 600; font-size: 11px; margin-left: 8px; }
        
        /* Interactive Menu */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 20px; }
        .menu-card { 
            background: #262421; 
            padding: 15px 5px; 
            border-radius: 12px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border: 1px solid transparent;
        }
        .menu-card:hover { 
            transform: scale(1.05) translateY(-5px); 
            background: #2d2a26; 
            border-color: var(--secondary);
            box-shadow: 0 8px 20px rgba(74, 222, 128, 0.15);
        }
        .menu-card span { font-size: 20px; display: block; margin-bottom: 5px; }

        /* Inputs & Buttons */
        input { 
            width: 100%; padding: 14px; box-sizing: border-box; margin-bottom: 12px; 
            background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 8px;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }

        .btn { 
            padding: 12px; cursor: pointer; border-radius: 8px; border: none; 
            background: #363430; color: #fff; font-weight: 600; width: 100%; 
            transition: all 0.2s; margin-bottom: 10px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-green { background: #629924; box-shadow: 0 4px 0 #456d1a; }
        .btn-green:hover { background: #72a834; }
        .btn-blue { background: #2563eb; box-shadow: 0 4px 0 #1d4ed8; }
        .btn-blue:hover { background: #3b82f6; }

        /* Highly Aesthetic Glassmorphism Pop-up Overlay & Container */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999;
            display: none;
        }

        #challenge-popup { 
            position: fixed; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: linear-gradient(135deg, rgba(28, 26, 37, 0.9) 0%, rgba(15, 14, 20, 0.95) 100%);
            border: 1px solid rgba(74, 222, 128, 0.3); 
            padding: 30px; 
            border-radius: 24px; 
            z-index: 1000; 
            width: 320px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 
                        0 0 40px rgba(74, 222, 128, 0.1);
            display: none;
            box-sizing: border-box;
            text-align: center;
        }

        /* Declined Dialog Specific Styling */
        #declined-popup {
            position: fixed; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: linear-gradient(135deg, rgba(37, 26, 26, 0.95) 0%, rgba(20, 14, 14, 0.98) 100%);
            border: 1px solid rgba(239, 68, 68, 0.4); 
            padding: 30px; 
            border-radius: 24px; 
            z-index: 1000; 
            width: 320px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 
                        0 0 40px rgba(239, 68, 68, 0.15);
            display: none;
            box-sizing: border-box;
            text-align: center;
        }

        .popup-pulse-ring {
            width: 56px; height: 56px;
            background: rgba(74, 222, 128, 0.1);
            border: 2px solid var(--secondary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px auto;
            animation: pulseGlow 2s infinite;
        }

        .popup-pulse-ring.red-ring {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            animation: pulseGlowRed 2s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        @keyframes pulseGlowRed {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .item-row { 
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; 
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; 
            border-left: 3px solid transparent; transition: 0.3s;
        }
        .item-row:hover { background: rgba(255,255,255,0.07); border-left-color: var(--accent); }
    </style>
</head>
<body>

    <div id="section-auth" class="container">
        <h1 style="text-align:center; letter-spacing: -1px; margin-bottom: 30px;">MIND MASTERS</h1>
        <input type="text" id="login-name" placeholder="Arena Username">
        <input type="password" id="login-pass" placeholder="Arena Password">
        
        <button class="btn btn-green" onclick="handleLogin('login')">ENTER ARENA</button>
        <button class="btn btn-blue" onclick="handleLogin('register')">REGISTER ACCOUNT</button>
        <button class="btn" style="background:#555;" onclick="handleLogin('guest')">PLAY AS GUEST</button>

        <p style="font-size:11px; text-align:center; color:#555; margin-top:15px;">Official Mind Masters Tournament Server 2026</p>
    </div>

    <div id="section-lobby" class="container hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <span style="color:#777; font-size:12px;">PLAYER</span>
                <div id="welcome-text" style="color:white; font-weight:700; font-size:18px;"></div>
            </div>
            <div id="my-profile-rating" style="background:var(--gold); color:black; padding:5px 12px; border-radius:20px; font-weight:bold; font-size:14px;"></div>
        </div>

        <div class="grid-menu">
            <div class="menu-card" onclick="showSubSection('online')"><span>🟢</span><div class="menu-label">Live</div></div>
            <div class="menu-card" onclick="showSubSection('leader')"><span>🏆</span><div class="menu-label">Leaders</div></div>
            <div class="menu-card" onclick="showSubSection('live-games')"><span>📺</span><div class="menu-label">Watch Live</div></div>
        </div>

        <div id="lobby-content" style="margin-top:25px;">
            <h3 id="lobby-title" style="font-size:11px; text-transform:uppercase; color:var(--accent); letter-spacing:1px;">Online Players</h3>
            <div id="lobby-list"></div>
        </div>
    </div>

    <div id="section-game" class="container hidden" style="padding: 10px;">
        <div class="player-bar top">
            <div><span id="opp-color-icon">⚫</span> <span id="opp-name">Opponent</span> <span class="rating-tag" id="opp-rating"></span></div>
            <div id="timer-top" style="font-family:monospace; font-weight:bold; color:var(--danger);">07:00</div>
        </div>
        
        <div id="mainBoard" style="width: 100%"></div>

        <div class="player-bar bottom">
            <div><span id="user-color-icon">⚪</span> <span id="user-display-name">You</span> <span class="rating-tag" id="user-display-rating"></span></div>
            <div id="timer-bottom" style="font-family:monospace; font-weight:bold;">07:00</div>
        </div>

        <div id="game-status" style="text-align:center; margin:15px 0; color:var(--gold); font-weight:600;"></div>
        <div id="game-controls" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button class="btn" id="btn-draw" onclick="offerDraw()">Offer Draw</button>
            <button class="btn" style="color:var(--danger)" id="btn-resign" onclick="quitToLobby()">Resign</button>
            <button class="btn btn-green" id="btn-rematch" style="display:none; grid-column: span 2;" onclick="startBotGame(activeBot)">Request Rematch</button>
            <button class="btn btn-blue" id="btn-lobby-home" style="display:none; grid-column: span 1;" onclick="quitToLobby()">Player Menu</button>
            <button class="btn" id="btn-exit-home" style="display:none; grid-column: span 1; background: #555;" onclick="goToAuthPage()">Home</button>
        </div>
    </div>

    <div id="popup-overlay" class="popup-overlay"></div>

    <div id="challenge-popup">
        <div class="popup-pulse-ring">
            <span style="font-size:24px;">👑</span>
        </div>
        <div style="font-size:11px; color:var(--secondary); font-weight:700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom:6px;">Incoming Duel</div>
        <div id="popup-name" style="font-size:1.4rem; color:white; font-weight:700; margin-bottom: 4px; letter-spacing: -0.5px;">Segun Oladipo</div>
        <div style="font-size:12px; color:#9e9bb0; margin-bottom:24px; font-weight: 300;">⚡ 7 Minute Blitz &bull; Rated</div>
        <div style="display:flex; gap:12px;">
            <button class="btn btn-green" id="btn-accept" style="margin-bottom:0; flex:1;" onclick="acceptChallenge()">ACCEPT</button>
            <button class="btn" id="btn-decline" style="background: rgba(255,255,255,0.08); color: #fff; margin-bottom:0; flex:1;" onclick="hidePopup()">DECLINE</button>
        </div>
    </div>

    <div id="declined-popup">
        <div class="popup-pulse-ring red-ring">
            <span style="font-size:24px;">⚔️</span>
        </div>
        <div style="font-size:11px; color:var(--danger); font-weight:700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom:6px;">Offer Declined</div>
        <div id="declined-popup-text" style="font-size:1.1rem; color:white; font-weight:700; margin-bottom: 12px; letter-spacing: -0.5px;">Draw Offer Refused!</div>
        <div style="font-size:12px; color:#c7a3a3; margin-bottom:24px; font-weight: 300;">Your opponent wants to fight to the finish. Keep playing!</div>
        <button class="btn btn-blue" style="margin-bottom:0; width: 100%;" onclick="hideDeclinedPopup()">RESUME MATCH</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const BOT_POOL = [
            { id: 'bot_segun', name: 'Segun Oladipo', rating: 1450 },
            { id: 'bot_chinedu', name: 'Chinedu Okafor', rating: 1620 },
            { id: 'bot_halima', name: 'Halima Sani', rating: 1530 },
            { id: 'bot_opeyemi', name: 'Opeyemi Bakare', rating: 1780 },
            { id: 'bot_ifeanyi', name: 'Ifeanyi Uzoma', rating: 1410 },
            { id: 'bot_fatima', name: 'Fatima Dauda', rating: 1595 },
            { id: 'bot_bolaji', name: 'Bolaji Idowu', rating: 1820 },
            { id: 'bot_amarachi', name: 'Amarachi Onuoha', rating: 1490 },
            { id: 'bot_usman', name: 'Usman Danjuma', rating: 1675 },
            { id: 'bot_nkechi', name: 'Nkechi Egwu', rating: 1555 }
        ];

        let currentUser = null;
        let activeBot = null;
        let onlineBots = [];
        let board = null;
        let game = new Chess();
        
        // Pointing to your correct chess-worker.js file path
        let engineWorker = new Worker('chess-worker.js'); 
        
        let gameTimer = null;
        let userTimeLeft = 420;
        let oppTimeLeft = 420;
        let clickedSquare = null; 
        let userColor = 'w'; // Dynamically chosen colors ('w' or 'b')

        // Variables for simulated Watch Live games
        let liveBoard = null;
        let liveGame = new Chess();
        let liveGameInterval = null;

        function showPopup() {
            $("#popup-overlay").fadeIn(300);
            $("#challenge-popup").fadeIn(300);
        }

        function hidePopup() {
            $("#popup-overlay").fadeOut(250);
            $("#challenge-popup").fadeOut(250);
        }

        function showDeclinedPopup() {
            $("#popup-overlay").fadeIn(300);
            $("#declined-popup").fadeIn(300);
        }

        function hideDeclinedPopup() {
            $("#popup-overlay").fadeOut(250);
            $("#declined-popup").fadeOut(250);
        }

        function goToAuthPage() {
            clearInterval(gameTimer);
            $("#section-game").addClass("hidden");
            $("#section-lobby").addClass("hidden");
            $("#section-auth").fadeIn(400);
        }

        function handleLogin(mode) {
            const name = $("#login-name").val().trim();
            const pass = $("#login-pass").val().trim();
            
            if (mode !== 'guest' && (!name || !pass)) {
                alert("Please enter credentials");
                return;
            }

            if (mode === 'guest') {
                currentUser = { 
                    id: 'guest_' + Math.floor(Math.random() * 100000), 
                    name: "Guest" + Math.floor(Math.random() * 1000), 
                    rating: 1200 
                };
                proceedToLobby();
            } else {
                currentUser = { id: name.toLowerCase().replace(/\s/g, '_'), name: name, rating: 1500 };
                
                db.collection("academy_players").doc(currentUser.id).get().then(doc => {
                    if (doc.exists) {
                        if (mode === 'register') {
                            alert("Username already exists! Choose another name or use standard Login.");
                            return;
                        }
                        currentUser = doc.data();
                        proceedToLobby();
                    } else {
                        // Registration flow or creating on first login
                        db.collection("academy_players").doc(currentUser.id).set(currentUser).then(() => {
                            proceedToLobby();
                        });
                    }
                    
                    // Initialize bots in DB if they don't exist
                    BOT_POOL.forEach(bot => {
                        db.collection("academy_players").doc(bot.id).get().then(bDoc => {
                            if(!bDoc.exists) db.collection("academy_players").doc(bot.id).set(bot);
                        });
                    });
                });
            }
        }

        function proceedToLobby() {
            $("#section-auth").fadeOut(400, () => {
                $("#section-lobby").removeClass("hidden");
                $("#welcome-text").text(currentUser.name);
                $("#my-profile-rating").text(Math.round(currentUser.rating));
                setupLobby();
            });
        }

        function setupLobby() {
            onlineBots = BOT_POOL.sort(() => 0.5 - Math.random()).slice(0, 6);
            showSubSection('online');
            
            setTimeout(() => {
                if ($("#section-game").hasClass("hidden")) {
                    activeBot = onlineBots[Math.floor(Math.random() * onlineBots.length)];
                    $("#popup-name").text(activeBot.name);
                    showPopup();
                }
            }, 5000);
        }

        function showSubSection(type) {
            let html = "";
            clearInterval(liveGameInterval); // Make sure live board loops are cleared if swapping screens
            $("#lobby-list").html('<div style="text-align:center; padding:20px;">Loading Arena...</div>');

            if (type === 'online') {
                $("#lobby-title").text("Players Online");
                html = "";
                
                // Fetch dynamic human players alongside standard bots
                db.collection("academy_players").get().then(snap => {
                    let totalUsers = [];
                    snap.forEach(doc => {
                        const profile = doc.data();
                        if (profile.id !== currentUser.id) {
                            totalUsers.push(profile);
                        }
                    });

                    // Merge and render both real human players & bots
                    let activeList = totalUsers.sort(() => 0.5 - Math.random()).slice(0, 6);
                    if (activeList.length === 0) {
                        activeList = onlineBots;
                    }

                    activeList.forEach(b => {
                        html += `
                            <div class="item-row">
                                <span>🟢 ${b.name} <span class="rating-tag">${Math.round(b.rating)}</span></span>
                                <button class="btn" style="width:auto; padding:5px 12px; font-size:11px; margin-bottom:0;" onclick="challengeUser('${b.id}')">Challenge</button>
                            </div>`;
                    });
                    $("#lobby-list").html(html);
                });
            } else if (type === 'leader') {
                $("#lobby-title").text("Arena Top 50");
                db.collection("academy_players").orderBy("rating", "desc").limit(50).get().then(snap => {
                    html = "";
                    let rank = 1;
                    snap.forEach(doc => {
                        const p = doc.data();
                        html += `
                            <div class="item-row">
                                <span><b style="color:var(--gold)">#${rank}</b> ${p.name}</span>
                                <span class="rating-tag">${Math.round(p.rating)}</span>
                            </div>`;
                        rank++;
                    });
                    $("#lobby-list").html(html);
                });
            } else if (type === 'live-games') {
                // Feature Live Real-Human Game or Simulated Battle
                db.collection("academy_players").limit(2).get().then(snap => {
                    let players = [];
                    snap.forEach(d => players.push(d.data()));
                    if (players.length < 2) {
                        players = BOT_POOL.sort(() => 0.5 - Math.random());
                    }
                    const player1 = players[0];
                    const player2 = players[1];

                    $("#lobby-title").text("Live Arena Games");
                    html = `
                        <div style="text-align:center; margin-bottom: 10px;">
                            <span style="color:var(--secondary); font-size:12px; font-weight:bold;">🔴 WATCHING LIVE MATCH</span>
                        </div>
                        <div class="player-bar top" style="background:#151311; border-top-left-radius: 8px; border-top-right-radius: 8px;">
                            <div>⚫ ${player1.name} <span class="rating-tag">${Math.round(player1.rating)}</span></div>
                        </div>
                        <div id="liveBoard" style="width: 100%; margin-bottom:0;"></div>
                        <div class="player-bar bottom" style="background:#151311; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;">
                            <div>⚪ ${player2.name} <span class="rating-tag">${Math.round(player2.rating)}</span></div>
                        </div>
                    `;
                    $("#lobby-list").html(html);
                    setupLiveBoardStream();
                });
            }
        }

        // Simulates realistic, human-paced moves on the Watch Live board (3 to 10 seconds delay)
        function setupLiveBoardStream() {
            liveGame = new Chess();
            liveBoard = ChessBoard('liveBoard', {
                position: 'start',
                draggable: false,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            function triggerNextLiveMove() {
                if (liveGame.game_over()) {
                    liveGame.reset();
                    liveBoard.start();
                }
                const moves = liveGame.moves();
                const randomMove = moves[Math.floor(Math.random() * moves.length)];
                liveGame.move(randomMove);
                liveBoard.position(liveGame.fen());

                // Random delay of 3000ms to 10000ms (3 to 10 seconds)
                const nextThinkingDelay = Math.floor(Math.random() * 7001) + 3000;
                liveGameInterval = setTimeout(triggerNextLiveMove, nextThinkingDelay);
            }

            // Start the first move timer
            liveGameInterval = setTimeout(triggerNextLiveMove, 2000);
        }

        // Challenge handler that works universally for both bots and DB-stored human players
        function challengeUser(userId) {
            // First check if the user is a registered bot
            let targetUser = BOT_POOL.find(b => b.id === userId);
            
            if (targetUser) {
                startBotGame(targetUser);
            } else {
                // If it is an online human, look them up dynamically in our database
                db.collection("academy_players").doc(userId).get().then(doc => {
                    if (doc.exists) {
                        const humanUser = doc.data();
                        startBotGame(humanUser);
                    } else {
                        alert("Player profile could not be found.");
                    }
                }).catch(err => {
                    console.error("Error launching duel: ", err);
                });
            }
        }

        function startBotGame(bot) {
            activeBot = bot;
            game = new Chess(); // Standard board setup
            userTimeLeft = 420; 
            oppTimeLeft = 420;
            clickedSquare = null; 

            // Hide end game home buttons
            $("#btn-rematch").hide();
            $("#btn-lobby-home").hide();
            $("#btn-exit-home").hide();
            $("#btn-draw").show();
            $("#btn-resign").show();

            // 1. Randomize Colors
            userColor = Math.random() > 0.5 ? 'w' : 'b';
            
            $("#section-lobby").addClass("hidden");
            $("#section-game").removeClass("hidden");
            
            $("#opp-name").text(bot.name);
            $("#opp-rating").text(Math.round(bot.rating));
            $("#user-display-name").text(currentUser.name);
            $("#user-display-rating").text(Math.round(currentUser.rating));

            // Dynamic Icons
            if (userColor === 'w') {
                $("#user-color-icon").text("⚪");
                $("#opp-color-icon").text("⚫");
            } else {
                $("#user-color-icon").text("⚫");
                $("#opp-color-icon").text("⚪");
            }

            // Standardize starting clock graphics
            $("#timer-bottom").text("07:00");
            $("#timer-top").text("07:00");

            const config = {
                draggable: false,
                position: 'start',
                orientation: userColor === 'w' ? 'white' : 'black',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };

            if (!board) {
                board = ChessBoard('mainBoard', config);
            } else {
                board.orientation(config.orientation);
                board.position('start');
            }

            // Click Handlers
            $('#mainBoard').off('click', '.square-55d63');
            $('#mainBoard').on('click', '.square-55d63', function() {
                const targetSquare = $(this).data('square');
                handleSquareClick(targetSquare);
            });
            
            startTimer();
            updateStatus();

            // AI-Human starts with a natural classical thinking delay
            if (game.turn() !== userColor) {
                const thinkingDelay = Math.floor(Math.random() * 7001) + 3000; // 3 to 10 seconds thinking delay
                setTimeout(() => {
                    // Unique white starter options: e4, d4, c4, Nf3
                    const whiteStarterMoves = ['e4', 'd4', 'c4', 'Nf3'];
                    const chosenMove = whiteStarterMoves[Math.floor(Math.random() * whiteStarterMoves.length)];
                    game.move(chosenMove);
                    board.position(game.fen());
                    updateStatus();
                }, thinkingDelay);
            }
        }

        function handleSquareClick(square) {
            if (game.turn() !== userColor) return;

            const piece = game.get(square);

            if (clickedSquare === null) {
                if (piece && piece.color === userColor) {
                    clickedSquare = square;
                    highlightSquare(square);
                }
            } else {
                const move = game.move({ from: clickedSquare, to: square, promotion: 'q' });
                clearHighlights();

                if (move === null) {
                    if (piece && piece.color === userColor) {
                        clickedSquare = square;
                        highlightSquare(square);
                    } else {
                        clickedSquare = null;
                    }
                } else {
                    board.position(game.fen());
                    clickedSquare = null;
                    onMoveComplete();
                }
            }
        }

        function highlightSquare(square) {
            clearHighlights();
            $('#mainBoard .square-' + square).css('background', 'rgba(74, 222, 128, 0.45)');
        }

        function clearHighlights() {
            $('#mainBoard .square-55d63').css('background', '');
        }

        function onMoveComplete() {
            updateStatus();
            if(!game.game_over()) {
                triggerBotEngine();
            }
        }

        function triggerBotEngine() {
            // Apply randomized human simulated thinking delay of 3 to 10 seconds (3000ms - 10000ms)
            const thinkingDelay = Math.floor(Math.random() * 7001) + 3000;

            setTimeout(() => {
                // If it is move 1 for Black, let the bot pick a dynamic defense choice naturally
                if (game.history().length === 1 && game.turn() === 'b') {
                    const blackStarterMoves = ['e5', 'c5', 'e6', 'Nf6'];
                    const chosenBlackMove = blackStarterMoves[Math.floor(Math.random() * blackStarterMoves.length)];
                    game.move(chosenBlackMove);
                    board.position(game.fen());
                    updateStatus();
                    return;
                }

                // Bridge FEN state to active chess worker script for smart, GM-level engine moves
                engineWorker.postMessage("position " + game.fen());
                
                engineWorker.onmessage = (e) => {
                    const fromSquare = e.data.slice(0, 2);
                    const toSquare = e.data.slice(2, 4);
                    const promotion = e.data.length > 4 ? e.data.charAt(4) : null;
                    
                    game.move({ from: fromSquare, to: toSquare, promotion: promotion || 'q' });
                    board.position(game.fen());
                    updateStatus();
                };
            }, thinkingDelay);
        }

        // Dedicated ticking logic that controls clocks dynamically based on whose move it is
        function startTimer() {
            clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                if (game.turn() === userColor) { 
                    userTimeLeft--;
                    let mins = Math.floor(userTimeLeft / 60);
                    let secs = userTimeLeft % 60;
                    $("#timer-bottom").text(`${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`);
                    if (userTimeLeft <= 0) {
                        clearInterval(gameTimer);
                        handleGameOver(false);
                        alert("Time Out! You lost.");
                    }
                } else {
                    // Turn belongs to the Bot / Online Opponent. Decrement their clock
                    oppTimeLeft--;
                    let mins = Math.floor(oppTimeLeft / 60);
                    let secs = oppTimeLeft % 60;
                    $("#timer-top").text(`${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`);
                    if (oppTimeLeft <= 0) {
                        clearInterval(gameTimer);
                        handleGameOver(true);
                        alert("Your opponent ran out of time! You win.");
                    }
                }
            }, 1000);
        }

        function offerDraw() {
            // 1. Instantly trigger visual "draw offer sent" prompt on game status log
            const existingStatus = $("#game-status").text();
            $("#game-status").text("✉️ Draw offer sent... Waiting for decision");

            setTimeout(() => {
                if (Math.random() > 0.8) {
                    alert(`${activeBot.name} accepted the draw.`);
                    handleGameOver(null);
                    quitToLobby();
                } else {
                    // Restore active status
                    $("#game-status").text(existingStatus);
                    // 2. Display highly styled red popup on refuse
                    showDeclinedPopup();
                }
            }, 1500);
        }

        function updateStatus() {
            let status = game.turn() !== userColor ? "Opponent thinking..." : "Your move";
            if (game.in_checkmate()) {
                const userWon = game.turn() !== userColor; 
                status = `Checkmate! ${userWon ? currentUser.name : activeBot.name} wins!`;
                handleGameOver(userWon);
            } else if (game.in_draw()) {
                status = "Game Drawn!";
                handleGameOver(null);
            }
            $("#game-status").text(status);
        }

        async function handleGameOver(userWon) {
            clearInterval(gameTimer);
            $("#btn-draw").hide();
            $("#btn-resign").hide();
            $("#btn-rematch").show();
            $("#btn-lobby-home").show();
            $("#btn-exit-home").show();
            
            if (userWon === null || currentUser.id.startsWith("guest_")) return; // Skip rating database commits for guest users

            const K = 32;
            const expected = 1 / (1 + Math.pow(10, (activeBot.rating - currentUser.rating) / 400));
            const score = userWon ? 1 : 0;
            const change = Math.round(K * (score - expected));
            
            currentUser.rating += change;
            activeBot.rating -= change;

            // Save both updated ratings safely back into Firebase
            await db.collection("academy_players").doc(currentUser.id).update({ rating: currentUser.rating });
            await db.collection("academy_players").doc(activeBot.id).update({ rating: activeBot.rating });
            
            $("#my-profile-rating, #user-display-rating").text(Math.round(currentUser.rating));
            $("#opp-rating").text(Math.round(activeBot.rating));
        }

        function acceptChallenge() {
            const btnAccept = $("#btn-accept");
            const btnDecline = $("#btn-decline");
            
            btnAccept.prop("disabled", true);
            btnDecline.prop("disabled", true);
            
            let secondsRemaining = 3;
            btnAccept.text(`CONNECTING (${secondsRemaining}s)...`);
            
            const connectionInterval = setInterval(() => {
                secondsRemaining--;
                if (secondsRemaining > 0) {
                    btnAccept.text(`CONNECTING (${secondsRemaining}s)...`);
                } else {
                    clearInterval(connectionInterval);
                    
                    btnAccept.prop("disabled", false).text("ACCEPT");
                    btnDecline.prop("disabled", false);
                    
                    hidePopup();
                    startBotGame(activeBot);
                }
            }, 1000);
        }

        function quitToLobby() {
            clearInterval(gameTimer);
            $("#section-game").addClass("hidden");
            $("#section-lobby").removeClass("hidden");
            showSubSection('online');
        }
    </script>
</body>
</html>
