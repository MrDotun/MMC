<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --bg: #161512; --card: #262421; --secondary: #4ade80; --text: #bababa; --accent: #3b82f6; --gold: #fbbf24; --danger: #ef4444; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        .container { width: 100%; max-width: 420px; background: var(--card); border-radius: 4px; padding: 15px; box-sizing: border-box; margin-bottom: 12px; }
        .hidden { display: none !important; }

        /* Lichess Style Board UI */
        .player-bar { background: #21201d; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #fff; }
        .player-bar.top { border-radius: 4px 4px 0 0; }
        .player-bar.bottom { border-radius: 0 0 4px 4px; margin-bottom: 15px; }
        .rating-tag { color: var(--secondary); font-weight: bold; margin-left: 8px; font-size: 12px; }
        
        /* Dashboard Buttons */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .menu-card { background: #312e2b; padding: 15px; border-radius: 4px; text-align: center; cursor: pointer; transition: 0.2s; border-bottom: 3px solid rgba(0,0,0,0.2); }
        .menu-card:hover { background: #383531; transform: translateY(-2px); }
        .menu-card i { display: block; font-size: 20px; margin-bottom: 5px; }
        .menu-label { font-size: 12px; font-weight: bold; text-transform: uppercase; }

        /* Challenge Pop-up Animation */
        #challenge-popup { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); 
            background: #2D1B4D; border: 2px solid var(--secondary); 
            padding: 20px; border-radius: 8px; z-index: 1000; width: 280px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); display: none;
            animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes bounceIn { from { opacity: 0; top: -100px; } to { opacity: 1; top: 20px; } }

        .btn { padding: 10px; cursor: pointer; border-radius: 4px; border: none; background: #363430; color: #fff; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-green { background: #629924; }
        .btn-green:hover { background: #82b74b; }

        .item-row { background: #1c1a17; padding: 10px; border-radius: 4px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .status-msg { text-align: center; font-size: 13px; color: var(--gold); padding: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="section-auth" class="container">
        <h2 style="text-align:center; color:white;">Mind Masters</h2>
        <input type="text" id="login-name" placeholder="Username" style="width:100%; padding:12px; box-sizing:border-box; margin-bottom:10px; background:#1c1a17; border:1px solid #333; color:white;">
        <button class="btn btn-green" onclick="handleLogin()">LOGIN</button>
    </div>

    <div id="section-lobby" class="container hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div id="welcome-text" style="color:white; font-weight:bold;"></div>
            <div class="rating-tag" id="my-profile-rating" style="font-size:16px;"></div>
        </div>

        <div class="grid-menu">
            <div class="menu-card" onclick="showSubSection('online')"><span>🟢</span><div class="menu-label">Players</div></div>
            <div class="menu-card" onclick="showSubSection('live')"><span>📺</span><div class="menu-label">Watch</div></div>
            <div class="menu-card" onclick="showSubSection('leader')"><span>🏆</span><div class="menu-label">Leaders</div></div>
            <div class="menu-card" onclick="alert('Searching for next Arena...')"><span>⚔️</span><div class="menu-label">Tournament</div></div>
        </div>

        <div id="lobby-content" style="margin-top:20px;">
            <h3 id="lobby-title" style="font-size:12px; text-transform:uppercase; color:#777;">Online Players</h3>
            <div id="lobby-list"></div>
        </div>
    </div>

    <div id="section-game" class="container hidden" style="padding: 5px;">
        <div class="player-bar top">
            <div>⚪ <span id="opp-name">Opponent</span> <span class="rating-tag" id="opp-rating"></span></div>
            <div id="timer-top">07:00</div>
        </div>
        
        <div id="mainBoard" style="width: 100%"></div>

        <div class="player-bar bottom">
            <div>⚫ <span id="user-display-name">You</span> <span class="rating-tag" id="user-display-rating"></span></div>
            <div id="timer-bottom">07:00</div>
        </div>

        <div id="game-status" class="status-msg"></div>
        <div id="game-controls" style="display:flex; gap:8px; padding:5px;">
            <button class="btn" onclick="quitToLobby()">Resign</button>
            <button class="btn btn-green" id="btn-rematch" style="display:none" onclick="startBotGame(activeBot)">Rematch</button>
        </div>
    </div>

    <div id="challenge-popup">
        <div style="font-size:10px; color:var(--secondary); font-weight:bold;">INCOMING CHALLENGE</div>
        <div id="popup-name" style="font-size:1.4rem; color:white; margin:8px 0;">Segun Oladipo</div>
        <div style="font-size:12px; margin-bottom:15px;">7 minutes • Rated</div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-green" onclick="acceptChallenge()">ACCEPT</button>
            <button class="btn" onclick="$('#challenge-popup').fadeOut()">DECLINE</button>
        </div>
    </div>

    <script>
        // Use your Firebase config here
        const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 10 Ordinary Nigerian Identities (The Hidden Bots)
        const BOT_POOL = [
            { id: 'bot_segun', name: 'Segun Oladipo', rating: 1450 },
            { id: 'bot_chinedu', name: 'Chinedu Okafor', rating: 1620 },
            { id: 'bot_halima', name: 'Halima Sani', rating: 1530 },
            { id: 'bot_opeyemi', name: 'Opeyemi Bakare', rating: 1780 },
            { id: 'bot_ifeanyi', name: 'Ifeanyi Uzoma', rating: 1410 },
            { id: 'bot_fatima', name: 'Fatima Dauda', rating: 1595 },
            { id: 'bot_bolaji', name: 'Bolaji Idowu', rating: 1820 },
            { id: 'bot_amarachi', name: 'Amarachi Onuoha', rating: 1490 },
            { id: 'bot_usman', name: 'Usman Danjuma', rating: 1675 },
            { id: 'bot_nkechi', name: 'Nkechi Egwu', rating: 1555 }
        ];

        let currentUser = null;
        let activeBot = null;
        let onlineBots = [];
        let board = null;
        let game = new Chess();
        let engineWorker = new Worker('chess-worker (3).js');

        function handleLogin() {
            const name = $("#login-name").val().trim();
            if (!name) return;
            currentUser = { id: name.toLowerCase().replace(/\s/g, '_'), name: name, rating: 1500 };
            
            db.collection("academy_players").doc(currentUser.id).get().then(doc => {
                if(doc.exists) currentUser = doc.data();
                else db.collection("academy_players").doc(currentUser.id).set(currentUser);
                
                $("#section-auth").hide();
                $("#section-lobby").removeClass("hidden");
                $("#welcome-text").text(currentUser.name);
                $("#my-profile-rating").text(Math.round(currentUser.rating));
                
                setupLobby();
            });
        }

        function setupLobby() {
            // Pick 3-6 random bots to be "online"
            onlineBots = BOT_POOL.sort(() => 0.5 - Math.random()).slice(0, Math.floor(Math.random() * 4) + 3);
            showSubSection('online');
            
            // Randomly trigger a bot challenge after 5-10 seconds
            setTimeout(() => {
                if ($("#section-game").hasClass("hidden")) {
                    activeBot = onlineBots[Math.floor(Math.random() * onlineBots.length)];
                    $("#popup-name").text(activeBot.name);
                    $("#challenge-popup").fadeIn();
                }
            }, 7000);
        }

        function showSubSection(type) {
            let html = "";
            if (type === 'online') {
                $("#lobby-title").text("Players Online");
                onlineBots.forEach(b => {
                    html += `<div class="item-row"><span>🟢 ${b.name}</span><span class="rating-tag">${Math.round(b.rating)}</span></div>`;
                });
            } else if (type === 'live') {
                $("#lobby-title").text("Live Games");
                db.collection("active_games").limit(5).get().then(snap => {
                    snap.forEach(doc => {
                        const g = doc.data();
                        html += `<div class="item-row"><span>📺 ${g.wName} vs ${g.bName}</span><button class="btn" style="width:auto; padding:4px 8px;">Watch</button></div>`;
                    });
                    $("#lobby-list").html(html || "No games currently live.");
                });
                return;
            } else if (type === 'leader') {
                $("#lobby-title").text("Arena Leaderboard");
                db.collection("academy_players").orderBy("rating", "desc").limit(10).get().then(snap => {
                    snap.forEach(doc => {
                        const p = doc.data();
                        html += `<div class="item-row"><span>${p.name}</span><span class="rating-tag">${Math.round(p.rating)}</span></div>`;
                    });
                    $("#lobby-list").html(html);
                });
                return;
            }
            $("#lobby-list").html(html);
        }

        function acceptChallenge() {
            $("#challenge-popup").hide();
            startBotGame(activeBot);
        }

        function startBotGame(bot) {
            activeBot = bot;
            game = new Chess();
            $("#section-lobby").addClass("hidden");
            $("#section-game").removeClass("hidden");
            $("#btn-rematch").hide();
            
            $("#opp-name").text(bot.name);
            $("#opp-rating").text(Math.round(bot.rating));
            $("#user-display-name").text(currentUser.name);
            $("#user-display-rating").text(Math.round(currentUser.rating));

            if (!board) {
                board = ChessBoard('mainBoard', { draggable: true, position: 'start', onDrop: onMove });
            } else {
                board.position('start');
            }
            updateStatus();
        }

        function onMove(source, target) {
            const move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            updateStatus();
            syncToFirebase();

            // Bot response
            setTimeout(() => {
                engineWorker.postMessage("position " + game.fen());
                engineWorker.onmessage = (e) => {
                    game.move({ from: e.data.slice(0, 2), to: e.data.slice(2, 4), promotion: 'q' });
                    board.position(game.fen());
                    updateStatus();
                    syncToFirebase();
                };
            }, 500);
        }

        function updateStatus() {
            let status = game.turn() === 'w' ? "White to move" : "Black to move";
            if (game.in_checkmate()) {
                const winner = game.turn() === 'b' ? currentUser.name : activeBot.name;
                status = `Checkmate! ${winner} wins!`;
                if(game.turn() === 'b') alert("🎉 Congratulations! You won!");
                handleGameOver(game.turn() === 'b');
            }
            $("#game-status").text(status);
        }

        async function handleGameOver(userWon) {
            $("#btn-rematch").show();
            // Rating adjustment (Elo logic)
            const K = 32;
            const expected = 1 / (1 + Math.pow(10, (activeBot.rating - currentUser.rating) / 400));
            const score = userWon ? 1 : 0;
            const change = Math.round(K * (score - expected));
            
            currentUser.rating += change;
            activeBot.rating -= change;

            await db.collection("academy_players").doc(currentUser.id).update({ rating: currentUser.rating });
            await db.collection("academy_players").doc(activeBot.id).set({ name: activeBot.name, rating: activeBot.rating }, {merge:true});
            
            $("#my-profile-rating, #user-display-rating").text(Math.round(currentUser.rating));
        }

        function syncToFirebase() {
            db.collection("active_games").doc(currentUser.id).set({
                wName: currentUser.name, bName: activeBot.name,
                fen: game.fen(), lastUpdated: Date.now()
            });
        }

        function quitToLobby() {
            $("#section-game").addClass("hidden");
            $("#section-lobby").removeClass("hidden");
            db.collection("active_games").doc(currentUser.id).delete();
        }
    </script>
</body>
</html>
