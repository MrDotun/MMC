<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Elite Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { 
            --bg: #0f0e0c; 
            --card: #1c1a17; 
            --secondary: #4ade80; 
            --text: #e0e0e0; 
            --accent: #3b82f6; 
            --gold: #fbbf24; 
            --danger: #ef4444; 
            --glass: rgba(255, 255, 255, 0.05);
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
        }
        
        .container { 
            width: 100%; 
            max-width: 440px; 
            background: var(--card); 
            border-radius: 16px; 
            padding: 20px; 
            box-sizing: border-box; 
            margin-bottom: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .hidden { display: none !important; }

        /* Aesthetic Board Tweak */
        #mainBoard { 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            filter: sepia(0.2) contrast(1.1); /* Gives the "Broken/Vintage" look */
        }

        .player-bar { 
            background: rgba(0,0,0,0.3); 
            padding: 10px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 14px; 
        }
        .player-bar.top { border-radius: 8px 8px 0 0; border-bottom: 1px solid #333; }
        .player-bar.bottom { border-radius: 0 0 8px 8px; border-top: 1px solid #333; margin-bottom: 20px; }

        .rating-tag { background: #333; padding: 2px 6px; border-radius: 4px; color: var(--gold); font-weight: 600; font-size: 11px; margin-left: 8px; }
        
        /* Interactive Menu */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .menu-card { 
            background: #262421; 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border: 1px solid transparent;
        }
        .menu-card:hover { 
            transform: scale(1.05) translateY(-5px); 
            background: #2d2a26; 
            border-color: var(--secondary);
            box-shadow: 0 8px 20px rgba(74, 222, 128, 0.15);
        }
        .menu-card span { font-size: 24px; display: block; margin-bottom: 8px; }

        /* Inputs & Buttons */
        input { 
            width: 100%; padding: 14px; box-sizing: border-box; margin-bottom: 12px; 
            background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 8px;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }

        .btn { 
            padding: 12px; cursor: pointer; border-radius: 8px; border: none; 
            background: #363430; color: #fff; font-weight: 600; width: 100%; 
            transition: all 0.2s; 
        }
        .btn:active { transform: scale(0.96); }
        .btn-green { background: #629924; box-shadow: 0 4px 0 #456d1a; }
        .btn-green:hover { background: #72a834; }

        #challenge-popup { 
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%); 
            background: #1a1625; border: 2px solid var(--secondary); 
            padding: 25px; border-radius: 16px; z-index: 1000; width: 300px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); display: none;
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes bounceIn { 0% { opacity: 0; transform: translate(-50%, -100px); } 100% { opacity: 1; transform: translate(-50%, 0); } }

        .item-row { 
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; 
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; 
            border-left: 3px solid transparent; transition: 0.3s;
        }
        .item-row:hover { background: rgba(255,255,255,0.07); border-left-color: var(--accent); }
    </style>
</head>
<body>

    <div id="section-auth" class="container">
        <h1 style="text-align:center; letter-spacing: -1px; margin-bottom: 30px;">MIND MASTERS</h1>
        <input type="text" id="login-name" placeholder="Arena Username">
        <input type="password" id="login-pass" placeholder="Arena Password">
        <button class="btn btn-green" onclick="handleLogin()">ENTER ARENA</button>
        <p style="font-size:11px; text-align:center; color:#555; margin-top:15px;">Official Mind Masters Tournament Server 2026</p>
    </div>

    <div id="section-lobby" class="container hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <span style="color:#777; font-size:12px;">PLAYER</span>
                <div id="welcome-text" style="color:white; font-weight:700; font-size:18px;"></div>
            </div>
            <div id="my-profile-rating" style="background:var(--gold); color:black; padding:5px 12px; border-radius:20px; font-weight:bold; font-size:14px;"></div>
        </div>

        <div class="grid-menu">
            <div class="menu-card" onclick="showSubSection('online')"><span>🟢</span><div class="menu-label">Live Players</div></div>
            <div class="menu-card" onclick="showSubSection('leader')"><span>🏆</span><div class="menu-label">Top 20 Leaders</div></div>
        </div>

        <div id="lobby-content" style="margin-top:25px;">
            <h3 id="lobby-title" style="font-size:11px; text-transform:uppercase; color:var(--accent); letter-spacing:1px;">Online Players</h3>
            <div id="lobby-list"></div>
        </div>
    </div>

    <div id="section-game" class="container hidden" style="padding: 10px;">
        <div class="player-bar top">
            <div>⚪ <span id="opp-name">Opponent</span> <span class="rating-tag" id="opp-rating"></span></div>
            <div id="timer-top" style="font-family:monospace; font-weight:bold; color:var(--danger);">07:00</div>
        </div>
        
        <div id="mainBoard" style="width: 100%"></div>

        <div class="player-bar bottom">
            <div>⚫ <span id="user-display-name">You</span> <span class="rating-tag" id="user-display-rating"></span></div>
            <div id="timer-bottom" style="font-family:monospace; font-weight:bold;">07:00</div>
        </div>

        <div id="game-status" style="text-align:center; margin:15px 0; color:var(--gold); font-weight:600;"></div>
        <div id="game-controls" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button class="btn" onclick="offerDraw()">Offer Draw</button>
            <button class="btn" style="color:var(--danger)" onclick="quitToLobby()">Resign</button>
            <button class="btn btn-green" id="btn-rematch" style="display:none; grid-column: span 2;" onclick="startBotGame(activeBot)">Request Rematch</button>
        </div>
    </div>

    <div id="challenge-popup">
        <div style="font-size:10px; color:var(--secondary); font-weight:bold; margin-bottom:10px;">INCOMING REQUEST</div>
        <div id="popup-name" style="font-size:1.3rem; color:white; font-weight:700;">Segun Oladipo</div>
        <div style="font-size:12px; color:#aaa; margin-bottom:20px;">⚡ 7 Minute Blitz • Rated</div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-green" onclick="acceptChallenge()">ACCEPT</button>
            <button class="btn" onclick="$('#challenge-popup').fadeOut()">DECLINE</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const BOT_POOL = [
            { id: 'bot_segun', name: 'Segun Oladipo', rating: 1450 },
            { id: 'bot_chinedu', name: 'Chinedu Okafor', rating: 1620 },
            { id: 'bot_halima', name: 'Halima Sani', rating: 1530 },
            { id: 'bot_opeyemi', name: 'Opeyemi Bakare', rating: 1780 },
            { id: 'bot_ifeanyi', name: 'Ifeanyi Uzoma', rating: 1410 },
            { id: 'bot_fatima', name: 'Fatima Dauda', rating: 1595 },
            { id: 'bot_bolaji', name: 'Bolaji Idowu', rating: 1820 },
            { id: 'bot_amarachi', name: 'Amarachi Onuoha', rating: 1490 },
            { id: 'bot_usman', name: 'Usman Danjuma', rating: 1675 },
            { id: 'bot_nkechi', name: 'Nkechi Egwu', rating: 1555 }
        ];

        let currentUser = null;
        let activeBot = null;
        let onlineBots = [];
        let board = null;
        let game = new Chess();
        let engineWorker = new Worker('web-worker.js'); // Updated to your web worker file
        let gameTimer = null;
        let timeLeft = 420;
        let clickedSquare = null; // State variable for tracking click-to-move square selections

        function handleLogin() {
            const name = $("#login-name").val().trim();
            const pass = $("#login-pass").val().trim();
            
            if (!name || !pass) {
                alert("Please enter credentials");
                return;
            }

            currentUser = { id: name.toLowerCase().replace(/\s/g, '_'), name: name, rating: 1500 };
            
            db.collection("academy_players").doc(currentUser.id).get().then(doc => {
                if(doc.exists) currentUser = doc.data();
                else db.collection("academy_players").doc(currentUser.id).set(currentUser);
                
                // Initialize bots in DB if they don't exist so they show in leaderboard
                BOT_POOL.forEach(bot => {
                    db.collection("academy_players").doc(bot.id).get().then(bDoc => {
                        if(!bDoc.exists) db.collection("academy_players").doc(bot.id).set(bot);
                    });
                });

                $("#section-auth").fadeOut(400, () => {
                    $("#section-lobby").removeClass("hidden");
                    $("#welcome-text").text(currentUser.name);
                    $("#my-profile-rating").text(Math.round(currentUser.rating));
                    setupLobby();
                });
            });
        }

        function setupLobby() {
            onlineBots = BOT_POOL.sort(() => 0.5 - Math.random()).slice(0, 6);
            showSubSection('online');
            
            setTimeout(() => {
                if ($("#section-game").hasClass("hidden")) {
                    activeBot = onlineBots[Math.floor(Math.random() * onlineBots.length)];
                    $("#popup-name").text(activeBot.name);
                    $("#challenge-popup").fadeIn();
                }
            }, 5000);
        }

        function showSubSection(type) {
            let html = "";
            $("#lobby-list").html('<div style="text-align:center; padding:20px;">Loading Arena...</div>');

            if (type === 'online') {
                $("#lobby-title").text("Players Online");
                html = "";
                onlineBots.forEach(b => {
                    html += `
                        <div class="item-row">
                            <span>🟢 ${b.name} <span class="rating-tag">${Math.round(b.rating)}</span></span>
                            <button class="btn" style="width:auto; padding:5px 12px; font-size:11px;" onclick="challengeUser('${b.id}')">Challenge</button>
                        </div>`;
                });
                $("#lobby-list").html(html);
            } else if (type === 'leader') {
                $("#lobby-title").text("Arena Top 20");
                db.collection("academy_players").orderBy("rating", "desc").limit(20).get().then(snap => {
                    html = "";
                    let rank = 1;
                    snap.forEach(doc => {
                        const p = doc.data();
                        html += `
                            <div class="item-row">
                                <span><b style="color:var(--gold)">#${rank}</b> ${p.name}</span>
                                <span class="rating-tag">${Math.round(p.rating)}</span>
                            </div>`;
                        rank++;
                    });
                    $("#lobby-list").html(html);
                });
            }
        }

        function challengeUser(botId) {
            const bot = BOT_POOL.find(b => b.id === botId);
            startBotGame(bot);
        }

        function startBotGame(bot) {
            activeBot = bot;
            game = new Chess();
            timeLeft = 420; // 7 minutes
            clickedSquare = null; // Clear selections
            
            $("#section-lobby").addClass("hidden");
            $("#section-game").removeClass("hidden");
            $("#btn-rematch").hide();
            
            $("#opp-name").text(bot.name);
            $("#opp-rating").text(Math.round(bot.rating));
            $("#user-display-name").text(currentUser.name);
            $("#user-display-rating").text(Math.round(currentUser.rating));

            // Setup chessboard.js with draggable disabled for click-to-move handling
            const config = {
                draggable: false,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };

            if (!board) {
                board = ChessBoard('mainBoard', config);
            } else {
                board.position('start');
            }
            
            // Clean and mount click handler to chessboard squares
            $('#mainBoard').off('click', '.square-55d63');
            $('#mainBoard').on('click', '.square-55d63', function() {
                const targetSquare = $(this).data('square');
                handleSquareClick(targetSquare);
            });
            
            startTimer();
            updateStatus();
        }

        // Click-To-Move selection and movement handler
        function handleSquareClick(square) {
            // Human is Black ('b') in this simulation loop setup
            if (game.turn() === 'w') return;

            const piece = game.get(square);

            if (clickedSquare === null) {
                // First click: Highlight selected human piece
                if (piece && piece.color === 'b') {
                    clickedSquare = square;
                    highlightSquare(square);
                }
            } else {
                // Second click: Try to execute move
                const move = game.move({ from: clickedSquare, to: square, promotion: 'q' });
                clearHighlights();

                if (move === null) {
                    // Clicked another of your own pieces instead: Switch selection
                    if (piece && piece.color === 'b') {
                        clickedSquare = square;
                        highlightSquare(square);
                    } else {
                        clickedSquare = null;
                    }
                } else {
                    board.position(game.fen());
                    clickedSquare = null;
                    onMoveComplete();
                }
            }
        }

        function highlightSquare(square) {
            clearHighlights();
            $('#mainBoard .square-' + square).css('background', 'rgba(74, 222, 128, 0.45)');
        }

        function clearHighlights() {
            $('#mainBoard .square-55d63').css('background', '');
        }

        function onMoveComplete() {
            updateStatus();
            
            // Trigger opponent engine (GarboChess) thinking via web-worker.js
            setTimeout(() => {
                engineWorker.postMessage("position " + game.fen());
                engineWorker.onmessage = (e) => {
                    const fromSquare = e.data.slice(0, 2);
                    const toSquare = e.data.slice(2, 4);
                    game.move({ from: fromSquare, to: toSquare, promotion: 'q' });
                    board.position(game.fen());
                    updateStatus();
                };
            }, 600);
        }

        function startTimer() {
            clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                if (game.turn() === 'b') { // Only count down player time in this sim
                    timeLeft--;
                    let mins = Math.floor(timeLeft / 60);
                    let secs = timeLeft % 60;
                    $("#timer-bottom").text(`${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`);
                    if (timeLeft <= 0) {
                        clearInterval(gameTimer);
                        handleGameOver(false);
                        alert("Time Out! You lost.");
                    }
                }
            }, 1000);
        }

        function offerDraw() {
            if (Math.random() > 0.8) {
                alert(`${activeBot.name} accepted the draw.`);
                quitToLobby();
            } else {
                alert(`${activeBot.name} declined the draw offer.`);
            }
        }

        function updateStatus() {
            let status = game.turn() === 'w' ? "Opponent thinking..." : "Your move";
            if (game.in_checkmate()) {
                const userWon = game.turn() === 'w'; // Human wins if checkmate occurs on white's move turn
                status = `Checkmate! ${userWon ? currentUser.name : activeBot.name} wins!`;
                handleGameOver(userWon);
            } else if (game.in_draw()) {
                status = "Game Drawn!";
                handleGameOver(null);
            }
            $("#game-status").text(status);
        }

        async function handleGameOver(userWon) {
            clearInterval(gameTimer);
            $("#btn-rematch").show();
            
            if (userWon === null) return; // Draw

            const K = 32;
            const expected = 1 / (1 + Math.pow(10, (activeBot.rating - currentUser.rating) / 400));
            const score = userWon ? 1 : 0;
            const change = Math.round(K * (score - expected));
            
            currentUser.rating += change;
            activeBot.rating -= change;

            await db.collection("academy_players").doc(currentUser.id).update({ rating: currentUser.rating });
            await db.collection("academy_players").doc(activeBot.id).update({ rating: activeBot.rating });
            
            $("#my-profile-rating, #user-display-rating").text(Math.round(currentUser.rating));
        }

        function acceptChallenge() {
            $("#challenge-popup").fadeOut();
            startBotGame(activeBot);
        }

        function quitToLobby() {
            clearInterval(gameTimer);
            $("#section-game").addClass("hidden");
            $("#section-lobby").removeClass("hidden");
            showSubSection('online');
        }
    </script>
</body>
</html>
