<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Elite Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="garbochess.js"></script> 
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { 
            --bg: #0f0e0c; 
            --card: #1c1a17; 
            --secondary: #4ade80; 
            --text: #e0e0e0; 
            --accent: #3b82f6; 
            --gold: #fbbf24; 
            --danger: #ef4444; 
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); 
            color: var(--text); 
            margin: 0; padding: 15px; 
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }
        
        .container { 
            width: 100%; max-width: 440px; 
            background: var(--card); border-radius: 16px; 
            padding: 20px; box-sizing: border-box; margin-bottom: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }

        /* Board Styling */
        #mainBoard { 
            border-radius: 8px; overflow: hidden; 
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            filter: sepia(0.1) contrast(1.05);
        }
        
        /* Highlighting for Click-to-Move */
        .highlight-square { box-shadow: inset 0 0 3px 3px yellow; }

        .player-bar { 
            background: rgba(0,0,0,0.3); padding: 10px 15px; 
            display: flex; justify-content: space-between; align-items: center; font-size: 14px; 
        }
        .player-bar.top { border-radius: 8px 8px 0 0; border-bottom: 1px solid #333; }
        .player-bar.bottom { border-radius: 0 0 8px 8px; border-top: 1px solid #333; margin-bottom: 20px; }

        .rating-tag { background: #333; padding: 2px 6px; border-radius: 4px; color: var(--gold); font-weight: 600; font-size: 11px; margin-left: 8px; }
        
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .menu-card { 
            background: #262421; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; 
            transition: all 0.3s; border: 1px solid transparent;
        }
        .menu-card:hover { border-color: var(--secondary); transform: translateY(-3px); }

        input { 
            width: 100%; padding: 14px; box-sizing: border-box; margin-bottom: 12px; 
            background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 8px;
        }

        .btn { 
            padding: 12px; cursor: pointer; border-radius: 8px; border: none; 
            background: #363430; color: #fff; font-weight: 600; width: 100%; transition: 0.2s; 
        }
        .btn-green { background: #629924; box-shadow: 0 4px 0 #456d1a; }

        #challenge-popup { 
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%); 
            background: #1a1625; border: 2px solid var(--secondary); padding: 25px; 
            border-radius: 16px; z-index: 1000; width: 300px; display: none;
        }

        .item-row { 
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; 
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

    <div id="section-auth" class="container">
        <h1 style="text-align:center;">MIND MASTERS</h1>
        <input type="text" id="login-name" placeholder="Arena Username">
        <input type="password" id="login-pass" placeholder="Arena Password">
        <button class="btn btn-green" onclick="handleLogin()">ENTER ARENA</button>
    </div>

    <div id="section-lobby" class="container hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div id="welcome-text" style="color:white; font-weight:700;"></div>
            <div id="my-profile-rating" style="background:var(--gold); color:black; padding:5px 12px; border-radius:20px; font-weight:bold;"></div>
        </div>
        <div class="grid-menu">
            <div class="menu-card" onclick="showSubSection('online')">🟢 Players</div>
            <div class="menu-card" onclick="showSubSection('leader')">🏆 Leaders</div>
        </div>
        <div id="lobby-content" style="margin-top:25px;">
            <div id="lobby-list"></div>
        </div>
    </div>

    <div id="section-game" class="container hidden" style="padding: 10px;">
        <div class="player-bar top">
            <div>⚪ <span id="opp-name">Opponent</span> <span id="opp-rating" class="rating-tag"></span></div>
            <div id="timer-top" style="color:var(--danger);">07:00</div>
        </div>
        
        <div id="mainBoard" style="width: 100%"></div>

        <div class="player-bar bottom">
            <div>⚫ <span id="user-display-name">You</span> <span id="user-display-rating" class="rating-tag"></span></div>
            <div id="timer-bottom">07:00</div>
        </div>

        <div id="game-status" style="text-align:center; margin:10px 0; color:var(--gold);"></div>
        <div id="game-controls" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button class="btn" onclick="offerDraw()">Draw</button>
            <button class="btn" style="color:var(--danger)" onclick="quitToLobby()">Resign</button>
        </div>
    </div>

    <div id="challenge-popup">
        <div id="popup-name" style="font-weight:bold; color:white;"></div>
        <div style="font-size:12px; margin-bottom:15px;">Incoming Challenge...</div>
        <button class="btn btn-green" onclick="acceptChallenge()">ACCEPT</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const BOT_POOL = [
            { id: 'bot_1', name: 'Segun Oladipo', rating: 1450 }, { id: 'bot_2', name: 'Chinedu Okafor', rating: 1620 },
            { id: 'bot_3', name: 'Halima Sani', rating: 1530 }, { id: 'bot_4', name: 'Opeyemi Bakare', rating: 1780 }
        ];

        let currentUser = null, activeBot = null, board = null;
        let game = new Chess(), engineWorker = new Worker('chess-worker.js');
        let sourceSquare = null, timeLeft = 420, gameTimer = null;

        function handleLogin() {
            const name = $("#login-name").val().trim();
            if (!name) return alert("Enter name");
            currentUser = { id: name.toLowerCase().replace(/\s/g, '_'), name: name, rating: 1500 };
            $("#section-auth").fadeOut(() => {
                $("#section-lobby").removeClass("hidden");
                $("#welcome-text").text(currentUser.name);
                $("#my-profile-rating").text(currentUser.rating);
                showSubSection('online');
            });
        }

        function showSubSection(type) {
            let html = "";
            if (type === 'online') {
                BOT_POOL.forEach(b => {
                    html += `<div class="item-row"><span>🟢 ${b.name}</span><button class="btn" style="width:auto; padding:5px;" onclick="startBotGame('${b.id}')">Play</button></div>`;
                });
            }
            $("#lobby-list").html(html);
        }

        function startBotGame(botId) {
            activeBot = BOT_POOL.find(b => b.id === botId);
            game = new Chess();
            timeLeft = 420;
            
            $("#section-lobby").addClass("hidden");
            $("#section-game").removeClass("hidden");
            $("#opp-name").text(activeBot.name);
            $("#opp-rating").text(activeBot.rating);

            const config = {
                position: 'start',
                draggable: false, // Disables dragging for Click-to-move
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };

            board = ChessBoard('mainBoard', config);
            board.resize(); // Fixes the "invisible board" issue

            // Click-to-Move Logic
            $('#mainBoard').on('click', '.square-55d63', function() {
                const square = $(this).attr('data-square');
                handleSquareClick(square);
            });

            startTimer();
            updateStatus();
        }

        function handleSquareClick(square) {
            if (game.game_over() || game.turn() === 'w') return; // Bot is white, player is black (standard logic here)

            if (sourceSquare === null) {
                // Select piece
                const moves = game.moves({ square: square, verbose: true });
                if (moves.length > 0) {
                    sourceSquare = square;
                    $(".square-55d63").removeClass("highlight-square");
                    $(`.square-${square}`).addClass("highlight-square");
                }
            } else {
                // Attempt move
                const move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $(".square-55d63").removeClass("highlight-square");
                
                if (move === null) {
                    sourceSquare = square; // Select new piece if move was invalid
                    handleSquareClick(square);
                    return;
                }
                
                board.position(game.fen());
                sourceSquare = null;
                updateStatus();
                makeBotMove();
            }
        }

        function makeBotMove() {
            if (game.game_over()) return;
            
            setTimeout(() => {
                engineWorker.postMessage("position " + game.fen());
                engineWorker.postMessage("go depth 10");
                
                engineWorker.onmessage = (e) => {
                    if (e.data.indexOf("bestmove") > -1) {
                        const moveStr = e.data.split(" ")[1];
                        game.move({ from: moveStr.slice(0, 2), to: moveStr.slice(2, 4), promotion: 'q' });
                        board.position(game.fen());
                        updateStatus();
                    }
                };
            }, 500);
        }

        function updateStatus() {
            let status = game.turn() === 'w' ? "Bot is thinking..." : "Your move";
            if (game.in_checkmate()) status = "Checkmate!";
            $("#game-status").text(status);
        }

        function startTimer() {
            clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                if (game.turn() === 'b') {
                    timeLeft--;
                    let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
                    $("#timer-bottom").text(`${m}:${s < 10 ? '0'+s : s}`);
                    if (timeLeft <= 0) quitToLobby();
                }
            }, 1000);
        }

        function quitToLobby() { 
            clearInterval(gameTimer); 
            $("#section-game").addClass("hidden"); 
            $("#section-lobby").removeClass("hidden"); 
        }
        function offerDraw() { alert("Bot declined."); }
    </script>
</body>
</html>
