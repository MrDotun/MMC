<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Championship Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #161512; --secondary: #4ade80; --bg: #161512; --text: #bababa; --card: #262421; --danger: #ef4444; --accent: #3b82f6; --gold: #fbbf24; --board-border: #403d39; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 400px; background: var(--card); padding: 20px; border-radius: 4px; box-sizing: border-box; margin-bottom: 15px; border-bottom: 3px solid rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
        
        h3 { color: #fff; font-size: 0.8rem; margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 1px; border-left: 3px solid var(--secondary); padding-left: 8px; }

        .player-bar { background: #21201d; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #fff; border-radius: 4px 4px 0 0; }
        .player-bar.bottom { border-radius: 0 0 4px 4px; margin-bottom: 10px; }
        .player-tag { display: flex; align-items: center; gap: 6px; }
        .rating { color: var(--secondary); font-weight: bold; opacity: 0.8; }

        .btn { padding: 12px; cursor: pointer; border-radius: 4px; border: none; background: #363430; color: #fff; font-weight: 600; width: 100%; margin-bottom: 8px; transition: 0.2s; font-size: 13px; }
        .btn:hover { background: #45423e; }
        .btn-primary { background: #629924; color: white; }
        .btn-primary:hover { background: #82b74b; }

        .item-row { background: #21201d; padding: 10px; border-radius: 4px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        
        #challenge-popup { position: fixed; bottom: 20px; right: 20px; background: #2D1B4D; border: 2px solid var(--secondary); padding: 15px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1000; display: none; animation: slideIn 0.5s ease-out; width: 250px; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        
        #toast { position: fixed; top: 20px; background: var(--secondary); color: #000; padding: 10px 20px; border-radius: 20px; font-weight: bold; display: none; z-index: 1001; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #myBoard { width: 100%; border: 2px solid var(--board-border); }
        .status-msg { text-align: center; font-size: 12px; margin: 5px 0; color: var(--gold); font-weight: bold; }
        .rank-badge { min-width: 20px; font-weight: 800; color: var(--gold); }
    </style>
</head>
<body>

    <div id="toast">New Players Online! ♟️</div>

    <div id="section-register" class="container">
        <h2 style="text-align:center; color:white; font-size: 1.2rem;">ARENA</h2>
        <div id="auth-form">
            <input type="text" id="reg-name" placeholder="Username">
            <input type="password" id="reg-password" placeholder="PIN">
            <button class="btn btn-primary" onclick="handleAuth()">LOGIN</button>
        </div>
    </div>

    <div id="section-lobby" class="container hidden">
        <div id="user-welcome" style="margin-bottom: 15px;"></div>
        <div id="tournament-section">
            <h3>🏆 Tournaments</h3>
            <button class="btn btn-primary" onclick="alert('Starting in 15 mins...')">JOIN 7-MIN BLITZ ARENA</button>
        </div>
        <div id="my-matches-section">
            <h3>⚔️ Active Games</h3>
            <div id="my-match-list"></div>
        </div>
        <div id="live-games-section">
            <h3>📺 Live Games</h3>
            <div id="live-games-list"></div>
        </div>
        <div id="player-list-section">
            <h3>👥 Online Players</h3>
            <div id="online-players-list"></div>
        </div>
        <button class="btn" style="margin-top:20px; opacity:0.5;" onclick="logout()">LOGOUT</button>
    </div>

    <div id="section-game" class="container hidden" style="padding: 10px;">
        <div class="player-bar">
            <div class="player-tag">⚪ <span id="label-white-name"></span> <span class="rating" id="label-white-rating"></span></div>
            <div id="timer-white">07:00</div>
        </div>
        <div id="myBoard"></div>
        <div class="player-bar bottom">
            <div class="player-tag">⚫ <span id="label-black-name"></span> <span class="rating" id="label-black-rating"></span></div>
            <div id="timer-black">07:00</div>
        </div>
        <div id="game-status" class="status-msg"></div>
        <div id="game-actions" style="display:flex; gap:5px;">
            <button class="btn" onclick="showLobby()">Lobby</button>
            <button class="btn btn-primary" id="rematch-btn" style="display:none" onclick="startRematch()">Rematch</button>
            <button class="btn" style="background:var(--danger)" onclick="resignGame()">Resign</button>
        </div>
    </div>

    <div id="leaderboard-persistent" class="container">
        <h3>🏆 Leaderboard</h3>
        <div id="front-leaderboard"></div>
    </div>

    <div id="challenge-popup">
        <div style="font-size: 11px; color: #aaa;">NEW CHALLENGE</div>
        <div id="challenger-name" style="font-weight:bold; color:white; margin: 5px 0;"></div>
        <div style="font-size: 13px; margin-bottom: 10px;">7 Minutes • Rated</div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" style="margin:0" onclick="acceptBotChallenge()">Accept</button>
            <button class="btn" style="margin:0" onclick="$('#challenge-popup').fadeOut()">Decline</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 10 Real Nigerian Names - Ordinary Citizens (Simulated Players)
        const BOTS = [
            { id: 'player_segun', name: 'Segun Oladipo', rating: 1720 },
            { id: 'player_chinedu', name: 'Chinedu Okafor', rating: 1625 },
            { id: 'player_halima', name: 'Halima Sani', rating: 1480 },
            { id: 'player_opeyemi', name: 'Opeyemi Bakare', rating: 1810 },
            { id: 'player_ifeanyi', name: 'Ifeanyi Uzoma', rating: 1415 },
            { id: 'player_fatima', name: 'Fatima Dauda', rating: 1590 },
            { id: 'player_bolaji', name: 'Bolaji Idowu', rating: 1775 },
            { id: 'player_amarachi', name: 'Amarachi Onuoha', rating: 1450 },
            { id: 'player_usman', name: 'Usman Danjuma', rating: 1680 },
            { id: 'player_nkechi', name: 'Nkechi Egwu', rating: 1545 }
        ];

        let myId = localStorage.getItem('savedUserId'), myData = null, board = null, game = new Chess(), activeMatchId = null;
        let onlineBots = [], activeBotId = null;
        let chessWorker = new Worker('chess-worker.js');

        window.onload = function() {
            loadFrontLeaderboard();
            if (myId) autoLogin();
            onlineBots = BOTS.sort(() => 0.5 - Math.random()).slice(0, Math.floor(Math.random() * 4) + 3);
            
            chessWorker.onmessage = function(e) {
                if (activeBotId && game.turn() === 'b') {
                    const move = game.move({ from: e.data.slice(0,2), to: e.data.slice(2,4), promotion: 'q' });
                    if (move) { board.position(game.fen()); updateGameStatus(); syncBotGameToFirebase(); }
                }
            };
        };

        async function autoLogin() {
            const doc = await db.collection("academy_players").doc(myId).get();
            if (doc.exists) { myData = doc.data(); showLobby(); }
        }

        function handleAuth() {
            const name = $("#reg-name").val().trim();
            if(!name) return;
            const id = name.toLowerCase().replace(/\s/g, '_');
            myId = id; myData = { name, rating: 1500 };
            localStorage.setItem('savedUserId', id);
            db.collection("academy_players").doc(id).set(myData, {merge: true});
            showLobby();
        }

        function showLobby() {
            $(".container").addClass("hidden"); $("#section-lobby, #leaderboard-persistent").removeClass("hidden");
            $("#user-welcome").html(`<h3>Welcome, ${myData.name}</h3>`);
            setTimeout(() => { $("#toast").fadeIn().delay(3000).fadeOut(); }, 1000);
            renderOnlinePlayers();
            loadLobbyData();
            setTimeout(checkBotChallengeTrigger, 8000);
        }

        function renderOnlinePlayers() {
            let html = "";
            onlineBots.forEach(bot => {
                html += `<div class="item-row"><span>🟢 ${bot.name}</span><span class="rating">${Math.floor(bot.rating)}</span></div>`;
            });
            $("#online-players-list").html(html);
        }

        function checkBotChallengeTrigger() {
            if (activeMatchId || !$("#section-game").hasClass("hidden")) return;
            const randomBot = onlineBots[Math.floor(Math.random() * onlineBots.length)];
            $("#challenger-name").text(randomBot.name + " (" + Math.floor(randomBot.rating) + ")");
            activeBotId = randomBot.id;
            $("#challenge-popup").fadeIn();
        }

        function acceptBotChallenge() {
            $("#challenge-popup").fadeOut();
            const bot = BOTS.find(b => b.id === activeBotId);
            activeMatchId = `match_${Date.now()}`;
            startGame(myData.name, bot.name, myData.rating, bot.rating, true);
        }

        function startGame(wName, bName, wRating, bRating, vsBot) {
            $(".container").addClass("hidden"); $("#section-game").removeClass("hidden");
            game = new Chess();
            $("#label-white-name").text(wName); $("#label-white-rating").text(Math.floor(wRating));
            $("#label-black-name").text(bName); $("#label-black-rating").text(Math.floor(bRating));
            if (!board) { board = ChessBoard('myBoard', { draggable: true, position: 'start', onDrop: onDrop }); } 
            else { board.position('start'); }
            updateGameStatus();
            if (vsBot) syncBotGameToFirebase();
        }

        function onDrop(source, target) {
            const move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            updateGameStatus();
            if (activeBotId) {
                syncBotGameToFirebase();
                setTimeout(() => chessWorker.postMessage("position " + game.fen()), 500);
            }
        }

        function updateGameStatus() {
            let status = game.turn() === 'w' ? "White to move" : "Black to move";
            if (game.in_checkmate()) {
                status = "Checkmate!";
                handleWin(game.turn() === 'b' ? 'white' : 'black');
            } else if (game.in_draw()) {
                status = "Draw";
            }
            $("#game-status").text(status);
        }

        async function handleWin(winner) {
            if (activeMatchId && activeBotId) {
                const bot = BOTS.find(b => b.id === activeBotId);
                let userChange = (winner === 'white') ? 15 : -15;
                let botChange = (winner === 'black') ? 15 : -15;
                
                myData.rating += userChange;
                bot.rating += botChange;

                await db.collection("academy_players").doc(myId).update({ rating: myData.rating });
                await db.collection("academy_players").doc(bot.id).set({ name: bot.name, rating: bot.rating }, {merge:true});
                
                if(winner === 'white') alert("🎉 CONGRATULATIONS! You won against " + bot.name);
                $("#rematch-btn").show();
            }
        }

        function syncBotGameToFirebase() {
            db.collection("academy_matches").doc(activeMatchId).set({
                white: myData.name, black: $("#label-black-name").text(),
                pgn: game.pgn(), status: "active", lastMoveTime: Date.now()
            });
        }

        function loadLobbyData() {
            db.collection("academy_matches").where("status", "==", "active").limit(5).onSnapshot(snap => {
                let liveHtml = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    liveHtml += `<div class="item-row"><span>📺 ${d.white} vs ${d.black}</span><button class="btn" style="width:auto; padding:4px 8px;">Watch</button></div>`;
                });
                $("#live-games-list").html(liveHtml || "Waiting for matches...");
            });
        }

        function loadFrontLeaderboard() {
            db.collection("academy_players").orderBy("rating", "desc").limit(8).get().then(snap => {
                let html = ""; let rank = 1;
                snap.forEach(doc => {
                    const p = doc.data();
                    html += `<div class="item-row"><span class="rank-badge">#${rank}</span><span>${p.name}</span><span class="rating">${Math.floor(p.rating)}</span></div>`;
                    rank++;
                });
                $("#front-leaderboard").html(html);
            });
        }

        function logout() { localStorage.clear(); location.reload(); }
        function resignGame() { if(confirm("Resign?")) showLobby(); }
        function startRematch() { $("#rematch-btn").hide(); acceptBotChallenge(); }
        function showLobby() { $(".container").addClass("hidden"); $("#section-lobby, #leaderboard-persistent").removeClass("hidden"); activeMatchId = null; }
    </script>
</body>
</html>
