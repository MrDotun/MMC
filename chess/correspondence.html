<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Elite Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --bg: #0f0e0c; --card: #1c1a17; --secondary: #4ade80; --text: #e0e0e0; --accent: #3b82f6; --gold: #fbbf24; --danger: #ef4444; --glass: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Poppins', sans-serif; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 440px; background: var(--card); border-radius: 16px; padding: 20px; box-sizing: border-box; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }
        #mainBoard, #liveBoard { border-radius: 8px; overflow: hidden; box-shadow: 0 0 25px rgba(0,0,0,0.8); filter: sepia(0.2) contrast(1.1); }
        .player-bar { background: rgba(0,0,0,0.3); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .player-bar.top { border-radius: 8px 8px 0 0; border-bottom: 1px solid #333; }
        .player-bar.bottom { border-radius: 0 0 8px 8px; border-top: 1px solid #333; margin-bottom: 20px; }
        .rating-tag { background: #333; padding: 2px 6px; border-radius: 4px; color: var(--gold); font-weight: 600; font-size: 11px; margin-left: 8px; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 20px; }
        .menu-card { background: #262421; padding: 15px 5px; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid transparent; }
        .menu-card:hover { transform: scale(1.05) translateY(-5px); background: #2d2a26; border-color: var(--secondary); box-shadow: 0 8px 20px rgba(74, 222, 128, 0.15); }
        .menu-card span { font-size: 20px; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 14px; box-sizing: border-box; margin-bottom: 12px; background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 8px; transition: 0.3s; }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        .btn { padding: 12px; cursor: pointer; border-radius: 8px; border: none; background: #363430; color: #fff; font-weight: 600; width: 100%; transition: all 0.2s; margin-bottom: 10px; }
        .btn:active { transform: scale(0.96); }
        .btn-green { background: #629924; box-shadow: 0 4px 0 #456d1a; }
        .btn-green:hover { background: #72a834; }
        .btn-blue { background: #2563eb; box-shadow: 0 4px 0 #1d4ed8; }
        .btn-blue:hover { background: #3b82f6; }
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 999; display: none; }
        #challenge-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, rgba(28, 26, 37, 0.9) 0%, rgba(15, 14, 20, 0.95) 100%); border: 1px solid rgba(74, 222, 128, 0.3); padding: 30px; border-radius: 24px; z-index: 1000; width: 320px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(74, 222, 128, 0.1); display: none; box-sizing: border-box; text-align: center; }
        #declined-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, rgba(37, 26, 26, 0.95) 0%, rgba(20, 14, 14, 0.98) 100%); border: 1px solid rgba(239, 68, 68, 0.4); padding: 30px; border-radius: 24px; z-index: 1000; width: 320px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(239, 68, 68, 0.15); display: none; box-sizing: border-box; text-align: center; }
        .popup-pulse-ring { width: 56px; height: 56px; background: rgba(74, 222, 128, 0.1); border: 2px solid var(--secondary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px auto; animation: pulseGlow 2s infinite; }
        .popup-pulse-ring.red-ring { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); animation: pulseGlowRed 2s infinite; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(74, 222, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); } }
        @keyframes pulseGlowRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .item-row { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid transparent; transition: 0.3s; }
        .item-row:hover { background: rgba(255,255,255,0.07); border-left-color: var(--accent); }
    </style>
</head>
<body>

    <div id="section-auth" class="container">
        <h1 style="text-align:center; letter-spacing: -1px; margin-bottom: 30px;">MIND MASTERS</h1>
        <input type="text" id="login-name" placeholder="Arena Username">
        <input type="password" id="login-pass" placeholder="Arena Password">
        <button class="btn btn-green" onclick="handleLogin('login')">ENTER ARENA</button>
        <button class="btn btn-blue" onclick="handleLogin('register')">REGISTER ACCOUNT</button>
        <button class="btn" style="background:#555;" onclick="handleLogin('guest')">PLAY AS GUEST</button>
    </div>

    <div id="section-lobby" class="container hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div><span style="color:#777; font-size:12px;">PLAYER</span><div id="welcome-text" style="color:white; font-weight:700; font-size:18px;"></div></div>
            <div id="my-profile-rating" style="background:var(--gold); color:black; padding:5px 12px; border-radius:20px; font-weight:bold; font-size:14px;"></div>
        </div>
        <div class="grid-menu">
            <div class="menu-card" onclick="showSubSection('online')"><span>🟢</span><div class="menu-label">Live</div></div>
            <div class="menu-card" onclick="showSubSection('leader')"><span>🏆</span><div class="menu-label">Leaders</div></div>
            <div class="menu-card" onclick="showSubSection('live-games')"><span>📺</span><div class="menu-label">Watch Live</div></div>
        </div>
        <div id="lobby-content" style="margin-top:25px;">
            <h3 id="lobby-title" style="font-size:11px; text-transform:uppercase; color:var(--accent); letter-spacing:1px;">Online Players</h3>
            <div id="lobby-list"></div>
        </div>
    </div>

    <div id="section-game" class="container hidden" style="padding: 10px;">
        <div class="player-bar top">
            <div><span id="opp-color-icon">⚫</span> <span id="opp-name">Opponent</span> <span class="rating-tag" id="opp-rating"></span></div>
            <div id="timer-top" style="font-family:monospace; font-weight:bold; color:var(--danger);">07:00</div>
        </div>
        <div id="mainBoard" style="width: 100%"></div>
        <div class="player-bar bottom">
            <div><span id="user-color-icon">⚪</span> <span id="user-display-name">You</span> <span class="rating-tag" id="user-display-rating"></span></div>
            <div id="timer-bottom" style="font-family:monospace; font-weight:bold;">07:00</div>
        </div>
        <div id="game-status" style="text-align:center; margin:15px 0; color:var(--gold); font-weight:600;"></div>
        <div id="game-controls" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button class="btn" id="btn-draw" onclick="offerDraw()">Offer Draw</button>
            <button class="btn" style="color:var(--danger)" id="btn-resign" onclick="quitToLobby()">Resign</button>
            <button class="btn btn-green" id="btn-rematch" style="display:none; grid-column: span 2;" onclick="startBotGame(activeBot)">Request Rematch</button>
            <button class="btn btn-blue" id="btn-lobby-home" style="display:none; grid-column: span 1;" onclick="quitToLobby()">Player Menu</button>
            <button class="btn" id="btn-exit-home" style="display:none; grid-column: span 1; background: #555;" onclick="goToAuthPage()">Home</button>
        </div>
    </div>

    <div id="popup-overlay" class="popup-overlay"></div>
    <div id="challenge-popup">
        <div class="popup-pulse-ring"><span style="font-size:24px;">👑</span></div>
        <div id="popup-name" style="font-size:1.4rem; color:white; font-weight:700; margin-bottom: 4px;">Segun Oladipo</div>
        <div style="display:flex; gap:12px;"><button class="btn btn-green" id="btn-accept" onclick="acceptChallenge()">ACCEPT</button><button class="btn" onclick="hidePopup()">DECLINE</button></div>
    </div>
    <div id="declined-popup">
        <div class="popup-pulse-ring red-ring"><span style="font-size:24px;">⚔️</span></div>
        <button class="btn btn-blue" onclick="hideDeclinedPopup()">RESUME MATCH</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const BOT_POOL = [
            { id: 'bot_segun', name: 'Segun Oladipo', rating: 1450 }, { id: 'bot_chinedu', name: 'Chinedu Okafor', rating: 1620 },
            { id: 'bot_halima', name: 'Halima Sani', rating: 1530 }, { id: 'bot_opeyemi', name: 'Opeyemi Bakare', rating: 1780 },
            { id: 'bot_ifeanyi', name: 'Ifeanyi Uzoma', rating: 1410 }, { id: 'bot_fatima', name: 'Fatima Dauda', rating: 1595 },
            { id: 'bot_bolaji', name: 'Bolaji Idowu', rating: 1820 }, { id: 'bot_amarachi', name: 'Amarachi Onuoha', rating: 1490 },
            { id: 'bot_usman', name: 'Usman Danjuma', rating: 1675 }, { id: 'bot_nkechi', name: 'Nkechi Egwu', rating: 1555 }
        ];

        let currentUser = null;
        let activeBot = null;
        let board = null;
        let game = new Chess();
        let engineWorker = new Worker('chess-worker.js'); 
        let gameTimer = null;
        let currentMatchId = null; 
        let liveUnsubscribe = null;
        let liveGameInterval = null;

        function showPopup() { $("#popup-overlay").fadeIn(300); $("#challenge-popup").fadeIn(300); }
        function hidePopup() { $("#popup-overlay").fadeOut(250); $("#challenge-popup").fadeOut(250); }
        function showDeclinedPopup() { $("#popup-overlay").fadeIn(300); $("#declined-popup").fadeIn(300); }
        function hideDeclinedPopup() { $("#popup-overlay").fadeOut(250); $("#declined-popup").fadeOut(250); }

        function handleLogin(mode) {
            const name = $("#login-name").val().trim();
            const pass = $("#login-pass").val().trim();
            if (mode === 'guest') {
                currentUser = { id: 'guest_' + Math.floor(Math.random() * 100000), name: "Guest" + Math.floor(Math.random() * 1000), rating: 1200 };
                proceedToLobby();
            } else {
                currentUser = { id: name.toLowerCase().replace(/\s/g, '_'), name: name, rating: 1500 };
                db.collection("academy_players").doc(currentUser.id).get().then(doc => {
                    if (doc.exists) currentUser = doc.data();
                    else db.collection("academy_players").doc(currentUser.id).set(currentUser);
                    proceedToLobby();
                });
            }
        }

        function proceedToLobby() {
            $("#section-auth").fadeOut(400, () => {
                $("#section-lobby").removeClass("hidden");
                $("#welcome-text").text(currentUser.name);
                $("#my-profile-rating").text(Math.round(currentUser.rating));
                showSubSection('online');
            });
        }

        function showSubSection(type) {
            if (liveUnsubscribe) liveUnsubscribe();
            clearInterval(liveGameInterval);
            $("#lobby-list").html('<div style="text-align:center; padding:20px;">Synchronizing...</div>');

            if (type === 'online') {
                $("#lobby-title").text("Players Online");
                db.collection("academy_players").limit(10).get().then(snap => {
                    let html = "";
                    snap.forEach(doc => {
                        const b = doc.data();
                        if (b.id !== currentUser.id) html += `<div class="item-row"><span>🟢 ${b.name} <span class="rating-tag">${Math.round(b.rating)}</span></span><button class="btn" style="width:auto; padding:5px 12px; margin-bottom:0;" onclick="challengeUser('${b.id}')">Challenge</button></div>`;
                    });
                    $("#lobby-list").html(html);
                });
            } else if (type === 'leader') {
                $("#lobby-title").text("Arena Top 50");
                db.collection("academy_players").orderBy("rating", "desc").limit(50).get().then(snap => {
                    let html = "", rank = 1;
                    snap.forEach(doc => {
                        const p = doc.data();
                        html += `<div class="item-row"><span><b style="color:var(--gold)">#${rank}</b> ${p.name}</span><span class="rating-tag">${Math.round(p.rating)}</span></div>`; rank++;
                    });
                    $("#lobby-list").html(html);
                });
            } else if (type === 'live-games') {
                $("#lobby-title").text("Live Arena Games");
                db.collection("active_matches").orderBy("timestamp", "desc").limit(1).get().then(snap => {
                    if (!snap.empty) {
                        const match = snap.docs[0].data();
                        setupLiveStream(snap.docs[0].id, match);
                    } else {
                        setupSimulatedLive();
                    }
                });
            }
        }

        function setupLiveStream(matchId, match) {
            $("#lobby-list").html(`
                <div style="text-align:center; margin-bottom: 10px;"><span style="color:var(--secondary); font-size:12px; font-weight:bold;">🔴 WATCHING LIVE</span></div>
                <div class="player-bar top"><div>⚫ ${match.black.name} <span class="rating-tag">${Math.round(match.black.rating)}</span></div></div>
                <div id="liveBoard" style="width: 100%"></div>
                <div class="player-bar bottom"><div>⚪ ${match.white.name} <span class="rating-tag">${Math.round(match.white.rating)}</span></div></div>
            `);
            const lBoard = ChessBoard('liveBoard', { position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
            liveUnsubscribe = db.collection("active_matches").doc(matchId).onSnapshot(doc => {
                if (doc.exists) lBoard.position(doc.data().fen);
                else showSubSection('live-games');
            });
        }

        function setupSimulatedLive() {
            const p1 = BOT_POOL[0], p2 = BOT_POOL[1];
            $("#lobby-list").html(`
                <div style="text-align:center; margin-bottom: 10px;"><span style="color:var(--secondary); font-size:12px; font-weight:bold;">🔴 AI vs AI (Live Simulation)</span></div>
                <div class="player-bar top"><div>⚫ ${p1.name} <span class="rating-tag">${p1.rating}</span></div></div>
                <div id="liveBoard" style="width: 100%"></div>
                <div class="player-bar bottom"><div>⚪ ${p2.name} <span class="rating-tag">${p2.rating}</span></div></div>
            `);
            let lGame = new Chess();
            const lBoard = ChessBoard('liveBoard', { position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
            liveGameInterval = setInterval(() => {
                if (lGame.game_over()) lGame.reset();
                const moves = lGame.moves();
                lGame.move(moves[Math.floor(Math.random() * moves.length)]);
                lBoard.position(lGame.fen());
            }, 3000);
        }

        async function startBotGame(bot) {
            activeBot = bot; game = new Chess();
            userTimeLeft = 420; oppTimeLeft = 420;
            currentMatchId = "match_" + Date.now();
            userColor = Math.random() > 0.5 ? 'w' : 'b';

            await db.collection("active_matches").doc(currentMatchId).set({
                fen: 'start', timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                white: userColor === 'w' ? currentUser : bot, black: userColor === 'b' ? currentUser : bot
            });

            $("#section-lobby").addClass("hidden"); $("#section-game").removeClass("hidden");
            $("#opp-name").text(bot.name); $("#opp-rating").text(bot.rating);
            $("#user-display-name").text(currentUser.name); $("#user-display-rating").text(currentUser.rating);

            board = ChessBoard('mainBoard', { draggable: false, position: 'start', orientation: userColor === 'w' ? 'white' : 'black', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
            $('#mainBoard').on('click', '.square-55d63', function() { handleSquareClick($(this).data('square')); });
            
            startTimer();
            if (game.turn() !== userColor) triggerBotEngine();
        }

        async function onMoveComplete() {
            if (currentMatchId) await db.collection("active_matches").doc(currentMatchId).update({ fen: game.fen() });
            updateStatus();
            if (!game.game_over() && game.turn() !== userColor) triggerBotEngine();
        }

        function triggerBotEngine() {
            setTimeout(() => {
                engineWorker.postMessage("position " + game.fen());
                engineWorker.onmessage = (e) => {
                    game.move({ from: e.data.slice(0, 2), to: e.data.slice(2, 4), promotion: 'q' });
                    board.position(game.fen());
                    onMoveComplete();
                };
            }, 3000);
        }

        async function handleGameOver(userWon) {
            clearInterval(gameTimer);
            if (currentMatchId) db.collection("active_matches").doc(currentMatchId).delete();
            
            let ratingChange = "";
            if (userWon !== null && !currentUser.id.startsWith("guest_")) {
                const expected = 1 / (1 + Math.pow(10, (activeBot.rating - currentUser.rating) / 400));
                const change = Math.round(32 * ((userWon ? 1 : 0) - expected));
                
                currentUser.rating += change;
                activeBot.rating -= change;
                ratingChange = ` (${change >= 0 ? '+' : ''}${change})`;

                await db.collection("academy_players").doc(currentUser.id).update({ rating: currentUser.rating });
                await db.collection("academy_players").doc(activeBot.id).update({ rating: activeBot.rating });
                
                $("#my-profile-rating, #user-display-rating").text(Math.round(currentUser.rating));
                $("#opp-rating").text(Math.round(activeBot.rating));
            }

            const res = userWon === null ? "Draw" : (userWon ? "Victory" : "Defeat");
            $("#game-status").html(`<span style="font-size:20px;">${res}${ratingChange}</span>`);
            $("#btn-draw, #btn-resign").hide();
            $("#btn-rematch, #btn-lobby-home, #btn-exit-home").show();
        }

        // [Utility functions like startTimer, handleSquareClick, etc. remain logically the same]
        function startTimer() {
            clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                if (game.turn() === userColor) userTimeLeft--; else oppTimeLeft--;
                $("#timer-bottom").text(`${Math.floor(userTimeLeft/60)}:${(userTimeLeft%60).toString().padStart(2,'0')}`);
                $("#timer-top").text(`${Math.floor(oppTimeLeft/60)}:${(oppTimeLeft%60).toString().padStart(2,'0')}`);
                if (userTimeLeft <= 0) handleGameOver(false); if (oppTimeLeft <= 0) handleGameOver(true);
            }, 1000);
        }

        function handleSquareClick(square) {
            if (game.turn() !== userColor) return;
            if (clickedSquare === null) {
                if (game.get(square) && game.get(square).color === userColor) { clickedSquare = square; highlightSquare(square); }
            } else {
                const move = game.move({ from: clickedSquare, to: square, promotion: 'q' });
                if (move) { board.position(game.fen()); clickedSquare = null; onMoveComplete(); }
                else { clickedSquare = null; clearHighlights(); }
            }
        }
        function highlightSquare(s) { clearHighlights(); $('.square-'+s).css('background', 'rgba(74, 222, 128, 0.45)'); }
        function clearHighlights() { $('.square-55d63').css('background', ''); }
        function challengeUser(id) { db.collection("academy_players").doc(id).get().then(d => startBotGame(d.data())); }
        function acceptChallenge() { hidePopup(); startBotGame(activeBot); }
        function quitToLobby() { if(currentMatchId) db.collection("active_matches").doc(currentMatchId).delete(); clearInterval(gameTimer); $("#section-game").addClass("hidden"); $("#section-lobby").removeClass("hidden"); showSubSection('online'); }
        function updateStatus() { if (game.in_checkmate()) handleGameOver(game.turn() !== userColor); else if (game.in_draw()) handleGameOver(null); else $("#game-status").text(game.turn() === userColor ? "Your move" : "Opponent thinking..."); }
        let clickedSquare = null; let userTimeLeft = 420; let oppTimeLeft = 420; let userColor = 'w';
    </script>
</body>
</html>
