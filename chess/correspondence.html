<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Elite Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="garbochess.js"></script> 
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { 
            --bg: #0f0e0c; 
            --card: #1c1a17; 
            --secondary: #4ade80; 
            --text: #e0e0e0; 
            --accent: #3b82f6; 
            --gold: #fbbf24; 
            --danger: #ef4444; 
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); 
            color: var(--text); 
            margin: 0; padding: 15px; 
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }
        
        .container { 
            width: 100%; max-width: 440px; 
            background: var(--card); border-radius: 16px; 
            padding: 20px; box-sizing: border-box; margin-bottom: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }

        /* Board Aesthetic */
        #mainBoard { 
            border-radius: 8px; overflow: hidden; 
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            filter: sepia(0.1) contrast(1.05);
        }
        
        /* Highlighting for Click-to-Move */
        .highlight-white { box-shadow: inset 0 0 3px 3px yellow; }
        .highlight-black { box-shadow: inset 0 0 3px 3px yellow; }

        .player-bar { 
            background: rgba(0,0,0,0.3); padding: 10px 15px; 
            display: flex; justify-content: space-between; align-items: center; font-size: 14px; 
        }
        .player-bar.top { border-radius: 8px 8px 0 0; border-bottom: 1px solid #333; }
        .player-bar.bottom { border-radius: 0 0 8px 8px; border-top: 1px solid #333; margin-bottom: 20px; }

        .rating-tag { background: #333; padding: 2px 6px; border-radius: 4px; color: var(--gold); font-weight: 600; font-size: 11px; margin-left: 8px; }
        
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .menu-card { 
            background: #262421; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid transparent;
        }
        .menu-card:hover { transform: scale(1.05); border-color: var(--secondary); box-shadow: 0 8px 20px rgba(74, 222, 128, 0.15); }

        input { 
            width: 100%; padding: 14px; box-sizing: border-box; margin-bottom: 12px; 
            background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 8px;
        }

        .btn { 
            padding: 12px; cursor: pointer; border-radius: 8px; border: none; 
            background: #363430; color: #fff; font-weight: 600; width: 100%; transition: 0.2s; 
        }
        .btn-green { background: #629924; box-shadow: 0 4px 0 #456d1a; }

        #challenge-popup { 
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%); 
            background: #1a1625; border: 2px solid var(--secondary); padding: 25px; 
            border-radius: 16px; z-index: 1000; width: 300px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: none; animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes bounceIn { from { opacity: 0; transform: translate(-50%, -50px); } to { opacity: 1; transform: translate(-50%, 0); } }

        .item-row { 
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; 
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

    <div id="section-auth" class="container">
        <h1 style="text-align:center; letter-spacing: -1px;">MIND MASTERS</h1>
        <input type="text" id="login-name" placeholder="Arena Username">
        <input type="password" id="login-pass" placeholder="Arena Password">
        <button class="btn btn-green" onclick="handleLogin()">ENTER ARENA</button>
    </div>

    <div id="section-lobby" class="container hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <span style="color:#777; font-size:12px;">ARENA PLAYER</span>
                <div id="welcome-text" style="color:white; font-weight:700; font-size:18px;"></div>
            </div>
            <div id="my-profile-rating" style="background:var(--gold); color:black; padding:5px 12px; border-radius:20px; font-weight:bold;"></div>
        </div>

        <div class="grid-menu">
            <div class="menu-card" onclick="showSubSection('online')"><span>🟢</span><div class="menu-label">Players</div></div>
            <div class="menu-card" onclick="showSubSection('leader')"><span>🏆</span><div class="menu-label">Leaders</div></div>
        </div>

        <div id="lobby-content" style="margin-top:25px;">
            <h3 id="lobby-title" style="font-size:11px; text-transform:uppercase; color:var(--accent);">Active Pool</h3>
            <div id="lobby-list"></div>
        </div>
    </div>

    <div id="section-game" class="container hidden" style="padding: 10px;">
        <div class="player-bar top">
            <div>⚪ <span id="opp-name">Opponent</span> <span class="rating-tag" id="opp-rating"></span></div>
            <div id="timer-top" style="font-family:monospace; font-weight:bold; color:var(--danger);">07:00</div>
        </div>
        
        <div id="mainBoard" style="width: 100%"></div>

        <div class="player-bar bottom">
            <div>⚫ <span id="user-display-name">You</span> <span class="rating-tag" id="user-display-rating"></span></div>
            <div id="timer-bottom" style="font-family:monospace; font-weight:bold;">07:00</div>
        </div>

        <div id="game-status" style="text-align:center; margin:15px 0; color:var(--gold); font-weight:600;"></div>
        <div id="game-controls" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button class="btn" onclick="offerDraw()">Offer Draw</button>
            <button class="btn" style="color:var(--danger)" onclick="quitToLobby()">Resign</button>
            <button class="btn btn-green" id="btn-rematch" style="display:none; grid-column: span 2;" onclick="startBotGame(activeBot)">Rematch</button>
        </div>
    </div>

    <div id="challenge-popup">
        <div style="font-size:10px; color:var(--secondary); font-weight:bold;">INCOMING REQUEST</div>
        <div id="popup-name" style="font-size:1.3rem; color:white; font-weight:700;">Segun Oladipo</div>
        <div style="font-size:12px; color:#aaa; margin-bottom:20px;">7 Minute Blitz</div>
        <button class="btn btn-green" onclick="acceptChallenge()">ACCEPT</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const BOT_POOL = [
            { id: 'bot_1', name: 'Segun Oladipo', rating: 1450 }, { id: 'bot_2', name: 'Chinedu Okafor', rating: 1620 },
            { id: 'bot_3', name: 'Halima Sani', rating: 1530 }, { id: 'bot_4', name: 'Opeyemi Bakare', rating: 1780 },
            { id: 'bot_5', name: 'Ifeanyi Uzoma', rating: 1410 }, { id: 'bot_6', name: 'Fatima Dauda', rating: 1595 },
            { id: 'bot_7', name: 'Bolaji Idowu', rating: 1820 }, { id: 'bot_8', name: 'Amarachi Onuoha', rating: 1490 },
            { id: 'bot_9', name: 'Usman Danjuma', rating: 1675 }, { id: 'bot_10', name: 'Nkechi Egwu', rating: 1555 }
        ];

        let currentUser = null, activeBot = null, onlineBots = [], board = null;
        let game = new Chess(), engineWorker = new Worker('chess-worker.js');
        let gameTimer = null, timeLeft = 420, sourceSquare = null;

        function handleLogin() {
            const name = $("#login-name").val().trim();
            const pass = $("#login-pass").val().trim();
            if (!name || !pass) return alert("Credentials required");

            currentUser = { id: name.toLowerCase().replace(/\s/g, '_'), name: name, rating: 1500 };
            db.collection("academy_players").doc(currentUser.id).get().then(doc => {
                if(doc.exists) currentUser = doc.data();
                else db.collection("academy_players").doc(currentUser.id).set(currentUser);
                
                // Sync bots to leaderboard
                BOT_POOL.forEach(b => db.collection("academy_players").doc(b.id).set(b, {merge: true}));

                $("#section-auth").fadeOut(() => {
                    $("#section-lobby").removeClass("hidden");
                    $("#welcome-text").text(currentUser.name);
                    $("#my-profile-rating").text(Math.round(currentUser.rating));
                    setupLobby();
                });
            });
        }

        function setupLobby() {
            onlineBots = BOT_POOL.sort(() => 0.5 - Math.random()).slice(0, 5);
            showSubSection('online');
            setTimeout(() => { if ($("#section-game").hasClass("hidden")) $("#challenge-popup").fadeIn(); }, 4000);
        }

        function showSubSection(type) {
            let html = "";
            if (type === 'online') {
                $("#lobby-title").text("Players Online");
                onlineBots.forEach(b => {
                    html += `<div class="item-row"><span>🟢 ${b.name}</span><button class="btn" style="width:auto; padding:4px 10px;" onclick="startBotGame(BOT_POOL.find(x=>x.id==='${b.id}'))">Challenge</button></div>`;
                });
            } else if (type === 'leader') {
                $("#lobby-title").text("Top 20 Leaderboard");
                db.collection("academy_players").orderBy("rating", "desc").limit(20).get().then(snap => {
                    html = ""; snap.forEach((doc, i) => {
                        const p = doc.data();
                        html += `<div class="item-row"><span>#${i+1} ${p.name}</span><span class="rating-tag">${Math.round(p.rating)}</span></div>`;
                    });
                    $("#lobby-list").html(html);
                });
                return;
            }
            $("#lobby-list").html(html);
        }

        function startBotGame(bot) {
            activeBot = bot; game = new Chess(); timeLeft = 420;
            $("#section-lobby, #challenge-popup").addClass("hidden");
            $("#section-game").removeClass("hidden");
            $("#opp-name").text(bot.name);
            $("#opp-rating").text(Math.round(bot.rating));
            
            const config = {
                position: 'start',
                draggable: false, // Click to move logic below
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = ChessBoard('mainBoard', config);
            $(window).resize(board.resize);
            
            // Attach Click-to-Move listeners
            $('#mainBoard').on('click', '.square-55d63', function() {
                const square = $(this).attr('data-square');
                handleSquareClick(square);
            });

            startTimer();
            updateStatus();
        }

        function handleSquareClick(square) {
            if (game.game_over() || game.turn() === 'w') return;

            if (sourceSquare === null) {
                const moves = game.moves({ square: square, verbose: true });
                if (moves.length > 0) {
                    sourceSquare = square;
                    $(".square-55d63").removeClass("highlight-black");
                    $(`.square-${square}`).addClass("highlight-black");
                }
            } else {
                const move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $(".square-55d63").removeClass("highlight-black");
                
                if (move === null) {
                    sourceSquare = null;
                    handleSquareClick(square); // Attempt to select the new square
                    return;
                }
                
                board.position(game.fen());
                sourceSquare = null;
                updateStatus();
                makeBotMove();
            }
        }

        function makeBotMove() {
            setTimeout(() => {
                engineWorker.postMessage("position " + game.fen());
                engineWorker.postMessage("go depth 10");
                engineWorker.onmessage = (e) => {
                    if (e.data.startsWith("bestmove")) {
                        const m = e.data.split(" ")[1];
                        game.move({ from: m.slice(0, 2), to: m.slice(2, 4), promotion: 'q' });
                        board.position(game.fen());
                        updateStatus();
                    }
                };
            }, 500);
        }

        function updateStatus() {
            let status = game.turn() === 'w' ? `${activeBot.name} is thinking...` : "Your turn";
            if (game.in_checkmate()) status = "Checkmate!";
            $("#game-status").text(status);
        }

        function startTimer() {
            clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                if (game.turn() === 'b') {
                    timeLeft--;
                    let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
                    $("#timer-bottom").text(`${m}:${s < 10 ? '0'+s : s}`);
                    if (timeLeft <= 0) { alert("Time Up!"); quitToLobby(); }
                }
            }, 1000);
        }

        function offerDraw() { alert(activeBot.name + " declined the draw."); }
        function acceptChallenge() { startBotGame(activeBot); }
        function quitToLobby() { 
            clearInterval(gameTimer); 
            $("#section-game").addClass("hidden"); 
            $("#section-lobby").removeClass("hidden"); 
        }
    </script>
</body>
</html>
