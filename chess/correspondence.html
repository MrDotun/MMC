<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GemChess Arena</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --dark-bg: #1e1b18;
            --panel-bg: #2a2421;
            --primary: #d4af37;
            --gold: #f39c12;
            --secondary: #4ade80;
            --text: #f5efe6;
            --text-dark: #a8a29e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .arena-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #3e3530;
            padding: 16px;
            box-sizing: border-box;
        }

        .hidden { display: none !important; }

        /* Auth Screen Styles */
        .auth-container {
            text-align: center;
            padding: 20px 10px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dark);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4a3f39;
            background: #151311;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
        }

        .input-field:focus {
            border-color: var(--gold);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #f39c12, #d4af37);
            color: #1e1b18;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: transform 0.1s;
        }

        .btn:active { transform: scale(0.98); }

        .btn-secondary {
            background: transparent;
            border: 1px solid #4a3f39;
            color: var(--text);
        }

        /* Lobby Styles */
        .lobby-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3e3530;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .lobby-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-btn {
            padding: 8px;
            background: #151311;
            border: 1px solid #3e3530;
            color: var(--text-dark);
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--gold);
            color: #1e1b18;
            border-color: var(--gold);
            font-weight: bold;
        }

        .lobby-content {
            background: #151311;
            border-radius: 8px;
            padding: 10px;
            min-height: 280px;
            max-height: 340px;
            overflow-y: auto;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #231f1c;
            font-size: 13px;
        }

        .item-row:last-child { border-bottom: none; }

        .rating-tag {
            background: #2a2421;
            color: var(--gold);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        /* Game UI */
        .player-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #151311;
            border-radius: 6px;
            margin: 6px 0;
            font-size: 13px;
        }

        #mainBoard, #liveBoard {
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #3e3530;
        }

        .game-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        /* Popups */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-box {
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            max-width: 320px;
            width: 80%;
        }
    </style>
</head>
<body>

<div class="arena-container">
    
    <div id="section-auth" class="auth-container">
        <div class="logo">GEMCHESS ARENA</div>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="login-name" class="input-field" placeholder="Enter username">
        </div>
        <div class="input-group">
            <label>Access Pin</label>
            <input type="password" id="login-pass" class="input-field" placeholder="••••">
        </div>
        <button class="btn" onclick="handleLogin('login')">LOGIN</button>
        <button class="btn btn-secondary" onclick="handleLogin('register')">REGISTER ACADEMY PROFILE</button>
        <button class="btn btn-secondary" style="border-style: dashed; margin-top: 10px;" onclick="handleLogin('guest')">ENTER AS GUEST</button>
    </div>

    <div id="section-lobby" class="hidden">
        <div class="lobby-header">
            <div>
                <div style="font-size: 11px; color: var(--text-dark);">Logged in as</div>
                <div id="welcome-text" style="font-weight: bold; font-size: 15px; color: var(--gold);">Player</div>
            </div>
            <div style="text-align: right;">
                <div style="font-size: 11px; color: var(--text-dark);">Elo Rating</div>
                <div id="my-profile-rating" class="rating-tag">1200</div>
            </div>
        </div>

        <div class="lobby-tabs">
            <button class="tab-btn active" id="tab-online" onclick="$('.tab-btn').removeClass('active'); $(this).addClass('active'); showSubSection('online');">Online</button>
            <button class="tab-btn" id="tab-leader" onclick="$('.tab-btn').removeClass('active'); $(this).addClass('active'); showSubSection('leader');">Leaderboard</button>
            <button class="tab-btn" id="tab-live" onclick="$('.tab-btn').removeClass('active'); $(this).addClass('active'); showSubSection('live-games');">Watch Live</button>
        </div>

        <div style="font-weight: bold; font-size: 12px; color: var(--text-dark); margin-bottom: 6px;" id="lobby-title">Players Online</div>
        <div id="lobby-list" class="lobby-content"></div>
    </div>

    <div id="section-game" class="hidden">
        <div class="player-bar top">
            <div><span id="opp-color-icon">⚫</span> <span id="opp-name">Opponent</span> <span class="rating-tag" id="opp-rating">1500</span></div>
            <div id="timer-top" style="font-weight: bold; color: var(--text-dark);">07:00</div>
        </div>

        <div id="mainBoard" style="width: 100%;"></div>

        <div class="player-bar bottom">
            <div><span id="user-color-icon">⚪</span> <span id="user-display-name">You</span> <span class="rating-tag" id="user-display-rating">1200</span></div>
            <div id="timer-bottom" style="font-weight: bold; color: var(--secondary);">07:00</div>
        </div>

        <div id="game-status" style="text-align: center; font-size: 12px; margin-top: 8px; color: var(--text-dark);">Match Starting...</div>

        <div class="game-controls">
            <button class="btn btn-secondary" style="padding: 8px; font-size: 12px;" onclick="offerDraw()">Draw</button>
            <button class="btn btn-secondary" style="padding: 8px; font-size: 12px; color: #ff6b6b;" onclick="quitToLobby()">Resign</button>
            <button class="btn" id="btn-rematch" style="padding: 8px; font-size: 12px; display: none;" onclick="quitToLobby()">Back to Lobby</button>
        </div>
    </div>

</div>

<div class="popup-overlay" id="challenge-popup" style="display: none;">
    <div class="popup-box">
        <div style="font-size: 14px; color: var(--text-dark); text-transform: uppercase; letter-spacing: 1px;">Incoming Duel</div>
        <div style="font-size: 20px; font-weight: 800; margin: 15px 0; color: var(--gold);" id="popup-name">Elite Bot</div>
        <div style="font-size: 12px; color: var(--text-dark); margin-bottom: 20px;">Do you accept the match?</div>
        <button class="btn" id="btn-accept" onclick="acceptChallenge()">ACCEPT</button>
        <button class="btn btn-secondary" onclick="$('#challenge-popup').fadeOut();">DECLINE</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Expanded pool with 15 new Nigerian "Human-AI" players (Ratings 1400-1831)
    const BOT_POOL = [
        { id: 'bot_segun', name: 'Segun Oladipo', rating: 1450 },
        { id: 'bot_chinedu', name: 'Chinedu Okafor', rating: 1620 },
        { id: 'bot_halima', name: 'Halima Sani', rating: 1530 },
        { id: 'bot_opeyemi', name: 'Opeyemi Bakare', rating: 1780 },
        { id: 'bot_ifeanyi', name: 'Ifeanyi Uzoma', rating: 1410 },
        { id: 'bot_fatima', name: 'Fatima Dauda', rating: 1595 },
        { id: 'bot_bolaji', name: 'Bolaji Idowu', rating: 1820 },
        { id: 'bot_amarachi', name: 'Amarachi Onuoha', rating: 1490 },
        { id: 'bot_usman', name: 'Usman Danjuma', rating: 1675 },
        { id: 'bot_nkechi', name: 'Nkechi Egwu', rating: 1555 },
        { id: 'bot_tunde', name: 'Tunde Adebayo', rating: 1425 },
        { id: 'bot_ngozi', name: 'Ngozi Ezekwesili', rating: 1710 },
        { id: 'bot_femi', name: 'Femi Balogun', rating: 1640 },
        { id: 'bot_amaka', name: 'Amaka Okeke', rating: 1485 },
        { id: 'bot_bashir', name: 'Bashir Mohammed', rating: 1520 },
        { id: 'bot_eniola', name: 'Eniola Badmus', rating: 1795 },
        { id: 'bot_chioma', name: 'Chioma Adeleke', rating: 1615 },
        { id: 'bot_abiodun', name: 'Abiodun Oyeyemi', rating: 1440 },
        { id: 'bot_yinka', name: 'Yinka Shonibare', rating: 1570 },
        { id: 'bot_funke', name: 'Funke Akindele', rating: 1690 },
        { id: 'bot_chukwuma', name: 'Chukwuma Nwosu', rating: 1810 },
        { id: 'bot_damilola', name: 'Damilola Agbaje', rating: 1465 },
        { id: 'bot_ibrahim', name: 'Ibrahim Gambari', rating: 1745 },
        { id: 'bot_temitope', name: 'Temitope Aluko', rating: 1505 },
        { id: 'bot_olumide', name: 'Olumide Popoola', rating: 1831 }
    ];

    let currentUser = null;
    let activeBot = null;
    let onlineBots = [];
    let board = null;
    let game = new Chess();
    let engineWorker = new Worker('chess-worker.js'); 
    
    let gameTimer = null;
    let timeLeft = 420;
    let clickedSquare = null; 
    let userColor = 'w';

    // Multi-player match syncing variables
    let currentMatchId = null;
    let matchUnsubscribe = null;
    let isMultiplayer = false;

    // Watch Live variables
    let liveBoard = null;
    let liveGame = new Chess();
    let liveGameInterval = null;
    let liveMatchUnsubscribe = null;

    function handleLogin(mode) {
        const name = $("#login-name").val().trim();
        const pass = $("#login-pass").val().trim();
        if (mode !== 'guest' && (!name || !pass)) { alert("Please enter credentials"); return; }

        if (mode === 'guest') {
            currentUser = { id: 'guest_' + Math.floor(Math.random() * 100000), name: "Guest" + Math.floor(Math.random() * 1000), rating: 1200 };
            proceedToLobby();
        } else {
            currentUser = { id: name.toLowerCase().replace(/\s/g, '_'), name: name, rating: 1500, online: true, challenging: null };
            db.collection("academy_players").doc(currentUser.id).get().then(doc => {
                if (doc.exists) {
                    if (mode === 'register') { alert("Username exists!"); return; }
                    currentUser = doc.data();
                    db.collection("academy_players").doc(currentUser.id).update({ online: true, challenging: null });
                    proceedToLobby();
                } else {
                    db.collection("academy_players").doc(currentUser.id).set(currentUser).then(() => { proceedToLobby(); });
                }
                BOT_POOL.forEach(bot => {
                    db.collection("academy_players").doc(bot.id).get().then(bDoc => {
                        if(!bDoc.exists) db.collection("academy_players").doc(bot.id).set({ ...bot, online: true });
                    });
                });
            });
        }
    }

    function proceedToLobby() {
        $("#section-auth").fadeOut(400, () => {
            $("#section-lobby").removeClass("hidden");
            $("#welcome-text").text(currentUser.name);
            $("#my-profile-rating").text(Math.round(currentUser.rating));
            setupLobby();
        });
    }

    function setupLobby() {
        onlineBots = BOT_POOL.sort(() => 0.5 - Math.random()).slice(0, 5);
        showSubSection('online');

        if (currentUser && !currentUser.id.startsWith("guest_")) {
            db.collection("academy_players").doc(currentUser.id).onSnapshot(doc => {
                const data = doc.data();
                if (data && data.challenging && $("#section-game").hasClass("hidden") && !$("#challenge-popup").is(":visible")) {
                    db.collection("academy_players").doc(data.challenging).get().then(challengerDoc => {
                        const challenger = challengerDoc.data();
                        activeBot = challenger; 
                        isMultiplayer = true;
                        currentMatchId = challenger.id + "_" + currentUser.id;
                        $("#popup-name").text(challenger.name);
                        $("#challenge-popup").fadeIn();
                    });
                }
            });
        }

        setTimeout(() => {
            if ($("#section-game").hasClass("hidden") && !$("#challenge-popup").is(":visible")) {
                isMultiplayer = false;
                activeBot = onlineBots[Math.floor(Math.random() * onlineBots.length)];
                $("#popup-name").text(activeBot.name);
                $("#challenge-popup").fadeIn();
            }
        }, 8000);
    }

    function showSubSection(type) {
        let html = "";
        clearInterval(liveGameInterval);
        if (liveMatchUnsubscribe) { liveMatchUnsubscribe(); liveMatchUnsubscribe = null; }
        $("#lobby-list").html('<div style="text-align:center; padding:20px;">Loading Arena...</div>');

        if (type === 'online') {
            $("#lobby-title").text("Players Online");
            db.collection("academy_players").where("online", "==", true).limit(10).get().then(snap => {
                html = "";
                let renderedIds = new Set();
                snap.forEach(doc => {
                    const p = doc.data();
                    if (p.id !== currentUser.id) {
                        renderedIds.add(p.id);
                        html += `<div class="item-row"><span>🟢 ${p.name} <span class="rating-tag">${Math.round(p.rating)}</span></span>
                                 <button class="btn" style="width:auto; padding:5px 12px; font-size:11px; margin-bottom:0;" onclick="challengeUser('${p.id}', ${!p.id.startsWith('bot_')})">Challenge</button></div>`;
                    }
                });
                onlineBots.forEach(b => {
                    if (!renderedIds.has(b.id)) {
                        html += `<div class="item-row"><span>🟢 ${b.name} <span class="rating-tag">${Math.round(b.rating)}</span></span>
                                 <button class="btn" style="width:auto; padding:5px 12px; font-size:11px; margin-bottom:0;" onclick="challengeUser('${b.id}', false)">Challenge</button></div>`;
                    }
                });
                $("#lobby-list").html(html);
            });
        } else if (type === 'leader') {
            $("#lobby-title").text("Arena Top 20");
            db.collection("academy_players").orderBy("rating", "desc").limit(20).get().then(snap => {
                html = ""; let rank = 1;
                snap.forEach(doc => {
                    const p = doc.data();
                    html += `<div class="item-row"><span><b style="color:var(--gold)">#${rank}</b> ${p.name}</span><span class="rating-tag">${Math.round(p.rating)}</span></div>`;
                    rank++;
                });
                $("#lobby-list").html(html);
            });
        } else if (type === 'live-games') {
            setupLiveBoardStream();
        }
    }

    function challengeUser(targetId, isHumanTarget) {
        if (isHumanTarget) {
            isMultiplayer = true;
            currentMatchId = currentUser.id + "_" + targetId;
            db.collection("academy_players").doc(targetId).update({ challenging: currentUser.id });
            db.collection("academy_players").doc(currentUser.id).update({ challenging: targetId });
            
            if (matchUnsubscribe) matchUnsubscribe();
            matchUnsubscribe = db.collection("active_matches").doc(currentMatchId).onSnapshot(doc => {
                if (doc.exists) {
                    const matchData = doc.data();
                    activeBot = { id: targetId, name: matchData.blackName, rating: matchData.blackRating };
                    startMultiplayerGame('w');
                }
            });
        } else {
            isMultiplayer = false;
            const bot = BOT_POOL.find(b => b.id === targetId);
            startBotGame(bot);
        }
    }

    function acceptChallenge() {
        $("#btn-accept").text("CONNECTING...").prop("disabled", true);
        if (isMultiplayer) {
            userColor = 'b';
            const initialFen = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
            db.collection("active_matches").doc(currentMatchId).set({
                id: currentMatchId,
                fen: initialFen,
                whiteId: activeBot.id,
                whiteName: activeBot.name,
                whiteRating: activeBot.rating,
                blackId: currentUser.id,
                blackName: currentUser.name,
                blackRating: currentUser.rating,
                turn: 'w',
                status: 'playing',
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                $("#challenge-popup").fadeOut();
                startMultiplayerGame('b');
                $("#btn-accept").text("ACCEPT").prop("disabled", false);
            });
        } else {
            setTimeout(() => { 
                $("#challenge-popup").fadeOut(); 
                startBotGame(activeBot); 
                $("#btn-accept").text("ACCEPT").prop("disabled", false); 
            }, 1500);
        }
    }

    function startMultiplayerGame(color) {
        if (matchUnsubscribe) matchUnsubscribe();
        userColor = color;
        game = new Chess();
        timeLeft = 420;
        clickedSquare = null;

        $("#section-lobby").addClass("hidden");
        $("#section-game").removeClass("hidden");
        $("#btn-rematch").hide();

        $("#opp-name").text(activeBot.name);
        $("#opp-rating").text(Math.round(activeBot.rating));
        $("#user-display-name").text(currentUser.name);
        $("#user-display-rating").text(Math.round(currentUser.rating));
        $("#user-color-icon").text(userColor === 'w' ? "⚪" : "⚫");
        $("#opp-color-icon").text(userColor === 'w' ? "⚫" : "⚪");

        const config = {
            draggable: false, position: 'start', orientation: userColor === 'w' ? 'white' : 'black',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        if (!board) board = ChessBoard('mainBoard', config);
        else { board.orientation(config.orientation); board.position('start'); }

        $('#mainBoard').off('click', '.square-55d63').on('click', '.square-55d63', function() {
            handleSquareClick($(this).data('square'));
        });

        startTimer();

        matchUnsubscribe = db.collection("active_matches").doc(currentMatchId).onSnapshot(doc => {
            if (doc.exists) {
                const matchData = doc.data();
                if (matchData.fen !== game.fen()) {
                    game.load(matchData.fen);
                    board.position(game.fen());
                    updateStatus();
                }
                if (matchData.status === 'resigned' || matchData.status === 'draw') {
                    alert("Game Ended: " + matchData.status);
                    quitToLobby();
                }
            }
        });
    }

    function startBotGame(bot) {
        isMultiplayer = false;
        activeBot = bot; 
        game = new Chess(); 
        timeLeft = 420; 
        clickedSquare = null;
        userColor = Math.random() > 0.5 ? 'w' : 'b';

        $("#section-lobby").addClass("hidden");
        $("#section-game").removeClass("hidden");
        $("#btn-rematch").hide();
        $("#opp-name").text(bot.name);
        $("#opp-rating").text(Math.round(bot.rating));
        $("#user-display-name").text(currentUser.name);
        $("#user-display-rating").text(Math.round(currentUser.rating));
        $("#user-color-icon").text(userColor === 'w' ? "⚪" : "⚫");
        $("#opp-color-icon").text(userColor === 'w' ? "⚫" : "⚪");

        const config = { draggable: false, position: 'start', orientation: userColor === 'w' ? 'white' : 'black', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' };
        if (!board) board = ChessBoard('mainBoard', config);
        else { board.orientation(config.orientation); board.position('start'); }

        // Dynamic and randomized first move calculation (Opening Book completely removed)
        const startingMoves = game.moves();
        const randomFirstMove = startingMoves[Math.floor(Math.random() * startingMoves.length)];
        game.move(randomFirstMove);
        board.position(game.fen());

        $('#mainBoard').off('click', '.square-55d63').on('click', '.square-55d63', function() {
            handleSquareClick($(this).data('square'));
        });
        
        startTimer(); 
        updateStatus();
        if (game.turn() !== userColor) triggerBotEngine();
    }

    function handleSquareClick(square) {
        if (game.turn() !== userColor) return;
        const piece = game.get(square);
        if (clickedSquare === null) {
            if (piece && piece.color === userColor) { clickedSquare = square; highlightSquare(square); }
        } else {
            const move = game.move({ from: clickedSquare, to: square, promotion: 'q' });
            clearHighlights();
            if (move === null) {
                if (piece && piece.color === userColor) { clickedSquare = square; highlightSquare(square); }
                else clickedSquare = null;
            } else { 
                board.position(game.fen()); 
                clickedSquare = null; 
                onMoveComplete(); 
            }
        }
    }

    function highlightSquare(square) { clearHighlights(); $('#mainBoard .square-' + square).css('background', 'rgba(74, 222, 128, 0.45)'); }
    function clearHighlights() { $('#mainBoard .square-55d63').css('background', ''); }
    
    function onMoveComplete() { 
        updateStatus(); 
        if (isMultiplayer) {
            db.collection("active_matches").doc(currentMatchId).update({
                fen: game.fen(),
                turn: game.turn(),
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            });
        } else {
            if(!game.game_over()) triggerBotEngine(); 
        }
    }

    function triggerBotEngine() {
        setTimeout(() => {
            engineWorker.postMessage("position " + game.fen());
            engineWorker.onmessage = (e) => {
                game.move({ from: e.data.slice(0,2), to: e.data.slice(2,4), promotion: 'q' });
                board.position(game.fen()); updateStatus();
            };
        }, 600);
    }

    function startTimer() {
        clearInterval(gameTimer);
        gameTimer = setInterval(() => {
            if (game.turn() === userColor) { 
                timeLeft--;
                $("#timer-bottom").text(`${Math.floor(timeLeft/60).toString().padStart(2,'0')}:${(timeLeft%60).toString().padStart(2,'0')}`);
                if (timeLeft <= 0) { clearInterval(gameTimer); handleGameOver(false); alert("Time Out!"); }
            }
        }, 1000);
    }

    function updateStatus() {
        let status = game.turn() !== userColor ? "Opponent thinking..." : "Your move";
        if (game.in_checkmate()) {
            const userWon = game.turn() !== userColor;
            status = `Checkmate! ${userWon ? currentUser.name : activeBot.name} wins!`;
            handleGameOver(userWon);
        } else if (game.in_draw()) { status = "Draw!"; handleGameOver(null); }
        $("#game-status").text(status);
    }

    async function handleGameOver(userWon) {
        clearInterval(gameTimer); $("#btn-rematch").show();
        if (isMultiplayer) {
            db.collection("active_matches").doc(currentMatchId).delete();
            db.collection("academy_players").doc(currentUser.id).update({ challenging: null });
            db.collection("academy_players").doc(activeBot.id).update({ challenging: null });
        }
        if (userWon === null || currentUser.id.startsWith("guest_")) return;
        
        const K = 32;
        const exp = 1 / (1 + Math.pow(10, (activeBot.rating - currentUser.rating) / 400));
        const change = Math.round(K * ((userWon ? 1 : 0) - exp));
        currentUser.rating += change; activeBot.rating -= change;
        
        await db.collection("academy_players").doc(currentUser.id).update({ rating: currentUser.rating });
        await db.collection("academy_players").doc(activeBot.id).update({ rating: activeBot.rating });
        $("#my-profile-rating, #user-display-rating").text(Math.round(currentUser.rating));
    }

    function setupLiveBoardStream() {
        $("#lobby-title").text("Live Arena Games");
        $("#lobby-list").html('<div style="text-align:center; padding:20px;">Locating active broadcasts...</div>');

        db.collection("active_matches").limit(1).get().then(snap => {
            if (!snap.empty) {
                const activeMatch = snap.docs[0].data();
                let html = `
                    <div style="text-align:center; margin-bottom: 10px;"><span style="color:var(--secondary); font-size:12px; font-weight:bold;">🔴 WATCHING LIVE (HUMAN MATCH)</span></div>
                    <div class="player-bar top" style="background:#151311; border-radius: 8px 8px 0 0;">
                        <div>⚫ ${activeMatch.blackName} <span class="rating-tag">${Math.round(activeMatch.blackRating)}</span></div>
                    </div>
                    <div id="liveBoard" style="width: 100%; margin-bottom:0;"></div>
                    <div class="player-bar bottom" style="background:#151311; border-radius: 0 0 8px 8px;">
                        <div>⚪ ${activeMatch.whiteName} <span class="rating-tag">${Math.round(activeMatch.whiteRating)}</span></div>
                    </div>`;
                $("#lobby-list").html(html);

                liveGame = new Chess(activeMatch.fen);
                liveBoard = ChessBoard('liveBoard', { position: activeMatch.fen, draggable: false, pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });

                liveMatchUnsubscribe = db.collection("active_matches").doc(activeMatch.id).onSnapshot(doc => {
                    if (doc.exists) {
                        const mData = doc.data();
                        liveBoard.position(mData.fen);
                    } else {
                        showSubSection('live-games');
                    }
                });
            } else {
                const p1 = BOT_POOL[Math.floor(Math.random() * BOT_POOL.length)];
                let p2 = BOT_POOL[Math.floor(Math.random() * BOT_POOL.length)];
                while(p1.id === p2.id) p2 = BOT_POOL[Math.floor(Math.random() * BOT_POOL.length)];

                let html = `
                    <div style="text-align:center; margin-bottom: 10px;"><span style="color:var(--secondary); font-size:12px; font-weight:bold;">🔴 WATCHING LIVE (BOT GAME)</span></div>
                    <div class="player-bar top" style="background:#151311; border-radius: 8px 8px 0 0;">
                        <div>⚫ ${p2.name} <span class="rating-tag">${Math.round(p2.rating)}</span></div>
                    </div>
                    <div id="liveBoard" style="width: 100%; margin-bottom:0;"></div>
                    <div class="player-bar bottom" style="background:#151311; border-radius: 0 0 8px 8px;">
                        <div>⚪ ${p1.name} <span class="rating-tag">${Math.round(p1.rating)}</span></div>
                    </div>`;
                $("#lobby-list").html(html);

                liveGame = new Chess();
                liveBoard = ChessBoard('liveBoard', { position: 'start', draggable: false, pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });

                // Bot spectator games randomized starting moves
                const moves = liveGame.moves();
                liveGame.move(moves[Math.floor(Math.random() * moves.length)]);
                liveBoard.position(liveGame.fen());

                liveGameInterval = setInterval(() => {
                    if (liveGame.game_over()) {
                        const result = liveGame.in_checkmate() ? (liveGame.turn() === 'w' ? 0 : 1) : 0.5;
                        updateLiveRatings(p1, p2, result);
                        clearInterval(liveGameInterval);
                        setTimeout(() => showSubSection('live-games'), 3000);
                        return;
                    }
                    const nextMoves = liveGame.moves();
                    liveGame.move(nextMoves[Math.floor(Math.random() * nextMoves.length)]);
                    liveBoard.position(liveGame.fen());
                }, 1500);
            }
        });
    }

    async function updateLiveRatings(p1, p2, score) {
        const K = 20;
        const exp1 = 1 / (1 + Math.pow(10, (p2.rating - p1.rating) / 400));
        const change = Math.round(K * (score - exp1));
        p1.rating += change; p2.rating -= change;
        await db.collection("academy_players").doc(p1.id).update({ rating: p1.rating });
        await db.collection("academy_players").doc(p2.id).update({ rating: p2.rating });
    }

    function quitToLobby() { 
        clearInterval(gameTimer); 
        if (matchUnsubscribe) matchUnsubscribe();
        if (isMultiplayer && currentMatchId) {
            db.collection("active_matches").doc(currentMatchId).update({ status: 'resigned' });
            db.collection("academy_players").doc(currentUser.id).update({ challenging: null });
        }
        $("#section-game").addClass("hidden"); 
        $("#section-lobby").removeClass("hidden"); 
        showSubSection('online'); 
    }

    function offerDraw() { 
        if (isMultiplayer) {
            alert("Draw offer sent.");
        } else {
            alert("Draw declined."); 
        }
    }
</script>
</body>
</html>
