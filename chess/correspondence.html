<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Elite Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { 
            --bg: #0f0e0c; 
            --card: #1c1a17; 
            --secondary: #4ade80; 
            --text: #e0e0e0; 
            --accent: #3b82f6; 
            --gold: #fbbf24; 
            --danger: #ef4444;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .hidden { display: none !important; }

        #mainBoard, #liveBoard {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }

        .player-bar {
            background: rgba(0,0,0,0.3);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .player-bar.top { border-radius: 8px 8px 0 0; border-bottom: 1px solid #333; }
        .player-bar.bottom { border-radius: 0 0 8px 8px; border-top: 1px solid #333; margin-bottom: 20px; }

        .rating-tag {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--gold);
            font-weight: 600;
            font-size: 11px;
            margin-left: 8px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 20px;
        }

        .menu-card {
            background: #262421;
            padding: 15px 5px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .menu-card:hover {
            background: #2d2a26;
            border-color: var(--secondary);
        }

        .menu-card span { font-size: 20px; display: block; margin-bottom: 5px; }

        input {
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            margin-bottom: 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
        }

        .btn {
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background: #363430;
            color: #fff;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s;
            margin-bottom: 10px;
        }

        .btn-green { background: #629924; box-shadow: 0 4px 0 #456d1a; }
        .btn-blue { background: #2563eb; box-shadow: 0 4px 0 #1d4ed8; }

        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            display: none;
        }

        #challenge-popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1c1a17;
            border: 1px solid var(--secondary);
            padding: 30px;
            border-radius: 20px;
            z-index: 1000;
            width: 300px;
            display: none;
            text-align: center;
        }

        .item-row {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="section-auth" class="container">
        <h1 style="text-align:center; margin-bottom: 30px;">MIND MASTERS</h1>
        <input type="text" id="login-name" placeholder="Username">
        <input type="password" id="login-pass" placeholder="Password">
        <button class="btn btn-green" onclick="handleLogin('login')">LOGIN</button>
        <button class="btn btn-blue" onclick="handleLogin('register')">REGISTER</button>
    </div>

    <div id="section-lobby" class="container hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div><span style="color:#777; font-size:12px;">MASTER</span><div id="welcome-text" style="color:white; font-weight:700; font-size:18px;"></div></div>
            <div id="my-profile-rating" style="background:var(--gold); color:black; padding:5px 12px; border-radius:20px; font-weight:bold;"></div>
        </div>
        <div class="grid-menu">
            <div class="menu-card" onclick="showSubSection('online')"><span>🟢</span>Live</div>
            <div class="menu-card" onclick="showSubSection('leader')"><span>🏆</span>Arena</div>
            <div class="menu-card" onclick="showSubSection('live-games')"><span>📺</span>Watch</div>
        </div>
        <div id="lobby-content" style="margin-top:25px;">
            <h3 id="lobby-title" style="font-size:12px; color:var(--accent);">Online Players</h3>
            <div id="lobby-list"></div>
        </div>
    </div>

    <div id="section-game" class="container hidden">
        <div class="player-bar top">
            <div>⚫ <span id="opp-name">Opponent</span> <span class="rating-tag" id="opp-rating"></span></div>
            <div id="timer-top" style="color:var(--danger); font-weight:bold;">07:00</div>
        </div>
        <div id="mainBoard" style="width: 100%"></div>
        <div class="player-bar bottom">
            <div>⚪ <span id="user-display-name">You</span> <span class="rating-tag" id="user-display-rating"></span></div>
            <div id="timer-bottom" style="font-weight:bold;">07:00</div>
        </div>
        <div id="game-status" style="text-align:center; margin:15px 0; color:var(--gold); font-weight:bold; min-height: 24px;"></div>
        <div id="game-controls">
            <button class="btn btn-green" id="btn-rematch" style="display:none;" onclick="startNewGame(activeOpponent)">REMATCH</button>
            <button class="btn btn-blue" id="btn-lobby-home" style="display:none;" onclick="quitToLobby()">BACK TO ARENA</button>
        </div>
    </div>

    <div id="popup-overlay" class="popup-overlay"></div>
    <div id="challenge-popup">
        <div style="font-size:40px; margin-bottom:10px;">👑</div>
        <div id="popup-name" style="font-size:18px; color:white; font-weight:700; margin-bottom: 20px;"></div>
        <button class="btn btn-green" onclick="acceptChallenge()">ACCEPT CHALLENGE</button>
        <button class="btn" style="background:transparent;" onclick="hidePopup()">DECLINE</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const MASTER_POOL = [
            { id: 'm_segun', name: 'Segun Oladipo', rating: 1450 }, { id: 'm_chinedu', name: 'Chinedu Okafor', rating: 1620 },
            { id: 'm_halima', name: 'Halima Sani', rating: 1530 }, { id: 'm_opeyemi', name: 'Opeyemi Bakare', rating: 1780 },
            { id: 'm_ifeanyi', name: 'Ifeanyi Uzoma', rating: 1410 }, { id: 'm_fatima', name: 'Fatima Dauda', rating: 1595 },
            { id: 'm_bolaji', name: 'Bolaji Idowu', rating: 1820 }, { id: 'm_amarachi', name: 'Amarachi Onuoha', rating: 1490 },
            { id: 'm_usman', name: 'Usman Danjuma', rating: 1675 }, { id: 'm_nkechi', name: 'Nkechi Egwu', rating: 1555 }
        ];

        let currentUser = null;
        let activeOpponent = null;
        let board = null;
        let game = new Chess();
        let gameTimer = null;
        let currentMatchId = null;
        let liveSub = null;
        let liveSimInterval = null;
        let userColor = 'w';
        let uTime = 420, oTime = 420;

        function handleLogin(mode) {
            const name = $("#login-name").val().trim();
            if (!name) return alert("Enter name");
            currentUser = { id: name.toLowerCase().replace(/\s/g, '_'), name: name, rating: 1500 };
            db.collection("academy_players").doc(currentUser.id).get().then(doc => {
                if (doc.exists) currentUser = doc.data();
                else db.collection("academy_players").doc(currentUser.id).set(currentUser);
                
                // Initialize the Masters in the DB silently
                MASTER_POOL.forEach(m => db.collection("academy_players").doc(m.id).set(m, {merge:true}));
                
                $("#section-auth").fadeOut(300, () => {
                    $("#section-lobby").removeClass("hidden");
                    $("#welcome-text").text(currentUser.name);
                    $("#my-profile-rating").text(Math.round(currentUser.rating));
                    showSubSection('online');
                });
            });
        }

        function showSubSection(type) {
            if (liveSub) liveSub();
            clearInterval(liveSimInterval);
            $("#lobby-list").empty();

            if (type === 'online') {
                $("#lobby-title").text("Masters Online");
                MASTER_POOL.forEach(m => {
                    $("#lobby-list").append(`<div class="item-row"><span>🟢 ${m.name} <span class="rating-tag">${m.rating}</span></span><button class="btn" style="width:auto; margin:0; padding:5px 10px;" onclick="requestGame('${m.id}')">Challenge</button></div>`);
                });
            } else if (type === 'leader') {
                $("#lobby-title").text("Arena Leaderboard");
                db.collection("academy_players").orderBy("rating", "desc").limit(20).get().then(snap => {
                    snap.forEach((doc, i) => {
                        const p = doc.data();
                        $("#lobby-list").append(`<div class="item-row"><span><b>#${i+1}</b> ${p.name}</span><span class="rating-tag">${Math.round(p.rating)}</span></div>`);
                    });
                });
            } else if (type === 'live-games') {
                $("#lobby-title").text("Watch Live Matches");
                db.collection("active_matches").limit(1).get().then(snap => {
                    if (!snap.empty) {
                        const m = snap.docs[0].data();
                        renderLiveStream(snap.docs[0].id, m.white.name, m.black.name);
                    } else {
                        // Real-life simulation: Two masters playing
                        const p1 = MASTER_POOL[Math.floor(Math.random()*MASTER_POOL.length)];
                        const p2 = MASTER_POOL.filter(x => x.id !== p1.id)[0];
                        renderLiveStream(null, p1.name, p2.name);
                    }
                });
            }
        }

        function renderLiveStream(id, wName, bName) {
            $("#lobby-list").html(`<div class="player-bar top">⚫ ${bName}</div><div id="liveBoard" style="width:100%"></div><div class="player-bar bottom">⚪ ${wName}</div>`);
            const lBoard = ChessBoard('liveBoard', {position:'start', pieceTheme:'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'});
            if (id) {
                liveSub = db.collection("active_matches").doc(id).onSnapshot(doc => { if(doc.exists) lBoard.position(doc.data().fen); });
            } else {
                let lGame = new Chess();
                liveSimInterval = setInterval(() => {
                    if (lGame.game_over()) lGame.reset();
                    const moves = lGame.moves();
                    lGame.move(moves[Math.floor(Math.random()*moves.length)]);
                    lBoard.position(lGame.fen());
                }, 3000);
            }
        }

        function requestGame(id) {
            activeOpponent = MASTER_POOL.find(x => x.id === id);
            $("#popup-name").text(activeOpponent.name);
            $("#popup-overlay, #challenge-popup").fadeIn(200);
        }

        function acceptChallenge() {
            hidePopup();
            startNewGame(activeOpponent);
        }

        function hidePopup() { $("#popup-overlay, #challenge-popup").fadeOut(200); }

        async function startNewGame(opp) {
            activeOpponent = opp;
            game = new Chess();
            uTime = 420; oTime = 420;
            userColor = Math.random() > 0.5 ? 'w' : 'b';
            currentMatchId = "match_" + Date.now();

            await db.collection("active_matches").doc(currentMatchId).set({
                fen: 'start', timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                white: userColor === 'w' ? currentUser : opp, black: userColor === 'b' ? currentUser : opp
            });

            $("#section-lobby").addClass("hidden");
            $("#section-game").removeClass("hidden");
            $("#opp-name").text(opp.name); $("#opp-rating").text(opp.rating);
            $("#user-display-name").text(currentUser.name); $("#user-display-rating").text(Math.round(currentUser.rating));
            $("#btn-rematch, #btn-lobby-home").hide();
            $("#game-status").text("");

            board = ChessBoard('mainBoard', {
                draggable: false, position: 'start', orientation: userColor === 'w' ? 'white' : 'black',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            $('#mainBoard').on('click', '.square-55d63', function() {
                const square = $(this).data('square');
                handleMove(square);
            });

            startTimer();
            if (game.turn() !== userColor) masterMove();
        }

        let selected = null;
        function handleMove(sq) {
            if (game.turn() !== userColor) return;
            if (selected === null) {
                if (game.get(sq) && game.get(sq).color === userColor) {
                    selected = sq;
                    $('.square-55d63').css('background', '');
                    $('.square-'+sq).css('background', 'rgba(74, 222, 128, 0.4)');
                }
            } else {
                const move = game.move({from: selected, to: sq, promotion:'q'});
                selected = null;
                $('.square-55d63').css('background', '');
                if (move) {
                    board.position(game.fen());
                    syncAndCheck();
                }
            }
        }

        async function syncAndCheck() {
            if (currentMatchId) await db.collection("active_matches").doc(currentMatchId).update({fen: game.fen()});
            if (game.game_over()) handleEnd(game.turn() !== userColor);
            else if (game.turn() !== userColor) masterMove();
        }

        function masterMove() {
            $("#game-status").text(activeOpponent.name + " is thinking...");
            setTimeout(() => {
                const moves = game.moves();
                game.move(moves[Math.floor(Math.random()*moves.length)]);
                board.position(game.fen());
                $("#game-status").text("");
                syncAndCheck();
            }, 2000);
        }

        function startTimer() {
            clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                if (game.turn() === userColor) {
                    uTime--; $("#timer-bottom").text(fmt(uTime));
                    if (uTime <= 0) handleEnd(false);
                } else {
                    oTime--; $("#timer-top").text(fmt(oTime));
                    if (oTime <= 0) handleEnd(true);
                }
            }, 1000);
        }

        function fmt(s) { return Math.floor(s/60) + ":" + (s%60).toString().padStart(2,'0'); }

        async function handleEnd(userWon) {
            clearInterval(gameTimer);
            if (currentMatchId) db.collection("active_matches").doc(currentMatchId).delete();

            let changeStr = "";
            if (userWon !== null) {
                const K = 32;
                const expected = 1 / (1 + Math.pow(10, (activeOpponent.rating - currentUser.rating) / 400));
                const change = Math.round(K * ((userWon ? 1 : 0) - expected));
                
                currentUser.rating += change;
                activeOpponent.rating -= change;
                changeStr = ` (${change >= 0 ? '+' : ''}${change})`;

                await db.collection("academy_players").doc(currentUser.id).update({rating: currentUser.rating});
                await db.collection("academy_players").doc(activeOpponent.id).update({rating: activeOpponent.rating});

                $("#user-display-rating").text(Math.round(currentUser.rating));
                $("#opp-rating").text(activeOpponent.rating);
                $("#my-profile-rating").text(Math.round(currentUser.rating));
            }

            const res = userWon === null ? "DRAW" : (userWon ? "VICTORY" : "DEFEAT");
            $("#game-status").html(res + changeStr);
            $("#btn-rematch, #btn-lobby-home").show();
        }

        function quitToLobby() {
            if (currentMatchId) db.collection("active_matches").doc(currentMatchId).delete();
            clearInterval(gameTimer);
            $("#section-game").addClass("hidden");
            $("#section-lobby").removeClass("hidden");
            showSubSection('online');
        }
    </script>
</body>
</html>
