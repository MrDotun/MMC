<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4 Mission: Tactical Patterns</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        /* Custom board styling */
        #board {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        /* Highlight for selected square */
        .highlight-square {
            box-shadow: inset 0 0 3px 3px rgba(255, 255, 0, 0.8) !important;
        }
        /* Make squares look clickable */
        .square-55d63 {
            cursor: pointer;
        }
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-gray-900 to-blue-900 min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="bg-white/95 backdrop-blur-sm w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden border border-white/20">
        <!-- Header Section -->
        <header class="bg-gray-800 p-6 text-center border-b border-gray-700">
            <h1 class="text-2xl md:text-3xl font-black text-white tracking-tight">Week 4 Mission</h1>
            <div class="inline-block px-3 py-1 bg-blue-600 rounded-full mt-2">
                <p class="text-white font-bold uppercase tracking-widest text-[10px]">Tactical Patterns</p>
            </div>
            <h2 id="puzzle-title" class="text-gray-300 mt-4 font-medium italic opacity-80">Loading puzzle...</h2>
        </header>

        <main class="p-6 md:p-10">
            <!-- Main Chess Area -->
            <div class="relative group">
                <div id="board" class="rounded-lg shadow-2xl ring-8 ring-gray-800/50"></div>
                
                <!-- Feedback Overlay -->
                <div id="status-container" class="mt-8 text-center space-y-2">
                    <p id="status" class="text-2xl font-black text-gray-800 uppercase tracking-tight">White to Move</p>
                    <div class="h-6">
                        <p id="solution" class="text-sm font-semibold text-blue-500 animate-pulse"></p>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="grid grid-cols-2 gap-4 mt-8">
                <button onclick="prevPuzzle()" class="group flex items-center justify-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-4 px-6 rounded-2xl transition-all active:scale-95">
                    <svg class="w-5 h-5 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                    Previous
                </button>
                <button onclick="nextPuzzle()" class="group flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-blue-500/30 transition-all active:scale-95">
                    Next Mission
                    <svg class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <!-- Mission Progress Bar -->
            <div class="mt-10 pt-6 border-t border-gray-100">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Mission Progress</span>
                    <span id="progress-text" class="text-xs font-black text-blue-600 bg-blue-50 px-2 py-1 rounded-md">1 / 44</span>
                </div>
                <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-blue-500 h-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </main>
    </div>

<script>
    const puzzles = [
        { title: "Morphy vs Duke Isouard (1858)", fen: "4kb1r/p2n1ppp/4q3/4p1B1/4P3/1Q6/PPP2PPP/2KR4 w k - 1 0", moves: ["b3b8", "d7b8", "d1d8"] },
        { title: "Zukertort vs Anderssen (1865)", fen: "r1b2k1r/ppp1bppp/8/1B1Q4/5q2/2P5/PPP2PPP/R3R1K1 w - - 1 0", moves: ["d5d8", "e7d8", "e1e8"] },
        { title: "Neumann vs Mayet (1866)", fen: "5rkr/pp2Rp2/1b1p1Pb1/3P2Q1/2n3P1/2p5/P4P2/4R1K1 w - - 1 0", moves: ["g5g6", "f7g6", "e7g7"] },

        { title: "Pillsbury vs Rodgers (1893)", fen: "3q2r1/4n2k/p1p1rBpp/PpPpPp2/1P3P1Q/2P3R1/7P/1R5K w - - 1 0", moves: ["h4h6", "h7h6", "g3h3"] },
        { title: "Tarrasch vs Kurschner (1893)", fen: "r2qk2r/pb4pp/1n2Pb2/2B2Q2/p1p5/2P5/2B2PPP/RN2R1K1 w - - 1 0", moves: ["f5g6", "h7g6", "c2g6"] },
        { title: "James Mason vs Georg Marco (1894)", fen: "6k1/pp4p1/2p5/2bp4/8/P5Pb/1P3rrP/2BRRN1K b - - 0 1", moves: ["g2g1", "k1g1", "f2f1"] },
        { title: "Teed vs Delmar (1896)", fen: "rnbqkbn1/ppppp3/7r/6pp/3P1p2/3BP1B1/PPP2PPP/RN1QK1NR w - - 1 0", moves: ["d1h5", "h6h5", "d3g6"] },
        { title: "Steinitz vs Trenchard (1898)", fen: "r2qrb2/p1pn1Qp1/1p4Nk/4PR2/3n4/7N/P5PP/R6K w - - 1 0", moves: ["g6e7", "d4f5", "f7g6"] },
        { title: "James Mason vs Emanuel Lasker (1899)", fen: "8/2r5/1k5p/1pp4P/8/K2P4/PR2QB2/2q5 b - - 0 1", moves: ["c1c3", "b2b3", "c7a7"] },
        { title: "Nimzowitsch vs Neumann (1899)", fen: "r1b3nr/ppqk1Bbp/2pp4/4P1B1/3n4/3P4/PPP2QPP/R4RK1 w - - 1 0", moves: ["f2f5", "d4f5", "e5e6"] },
        { title: "Pillsbury vs Tinsley (1899)", fen: "3k1r1r/pb3p2/1p4p1/1B2B3/3qn3/6QP/P4RP1/2R3K1 w - - 1 0", moves: ["e5f6", "d4f6", "g3c7"] },
        { title: "Ryder vs NN (1899)", fen: "rn2kb1r/1pQbpppp/1p6/qp1N4/6n1/8/PPP3PP/2KR2NR w - - 1 0", moves: ["c7c8", "d7c8", "d5c7"] },
        { title: "Pulitzer vs Marco (1900)", fen: "r2k2nr/pp1b1Q1p/2n4b/3N4/3q4/3P4/PPP3PP/4RR1K w - - 1 0", moves: ["e1e8", "d7e8", "f7c7"] },
        { title: "Arturo Reggio vs Georg Marco (1902)", fen: "7k/1p4p1/p4b1p/3N3P/2p5/2rb4/PP2r3/K2R2R1 b - - 0 1", moves: ["e2c2", "b2c2", "f6b2"] },
        { title: "Lasker vs NN (1903)", fen: "r2q2nr/5p1p/p1Bp3b/1p1NkP2/3pP1p1/2PP2P1/PP5P/R1Bb1RK1 w - - 1 0", moves: ["c1f4", "h6f4", "g3f4"] },
        { title: "Schwartz vs Samsonov (1908)", fen: "r2q1k1r/ppp1bB1p/2np4/6N1/3PP1bP/8/PPP5/RNB2RK1 w - - 1 0", moves: ["g5e6", "g4e6", "f7h6"] },
        { title: "Rotlevi vs Suchting (1911)", fen: "6k1/1p1r1pp1/p1r3b1/3pPqB1/2pP4/Q1P4R/P3P2K/6R1 w - - 1 0", moves: ["a3f8", "k8f8", "h3h8"] },
        { title: "Flamberg vs Duras (1912)", fen: "r1b3k1/ppp3pp/8/3pB3/1P1P4/3K1P2/PP1n1q1P/R2Q3R b - - 0 1", moves: ["c8f5", "d3c3", "f2e3"] },
        { title: "Lasker vs Englund (1913)", fen: "2kr1b1r/pp3ppp/2p1b2q/4B3/4Q3/2PB2R1/PPP2PPP/3R2K1 w - - 1 0", moves: ["e4c6", "bxc6", "d3a6"] },
        { title: "Teichmann vs NN (1914)", fen: "rn2kb1r/pp3ppp/4p1qn/1p4B1/2B5/3P2QP/PPP2PP1/R3K2R w - - 1 0", moves: ["g3b8", "a8b8", "c4b5"] },
        { title: "Watson vs NN (1916)", fen: "rnb2b1r/p3kBp1/3pNn1p/2pQNn1p/1p2PP2/4B3/Pq5P/4K3 w - - 1 0", moves: ["d5d6", "e7d6", "e3c5"] },
        { title: "Brunnemer vs Patton (1920)", fen: "r1b1k2r/ppQ1q2n/2p2p2/P3p2p/N3P1pP/1B4P1/1PP2P2/3R1NK1 w - - 1 0", moves: ["d1d8", "e7d8", "c7f7"] },
        { title: "Gerard Oskam vs Max Euwe (1920)", fen: "r6k/pp4pp/1b1P4/8/1n4Q1/2N1RP2/PPq3p1/1RB1K3 b - - 0 1", moves: ["c2d3", "c3d3", "b6f2"] },
        { title: "Tartakower vs Reti (1920)", fen: "8/1r5p/kpQ3p1/p3rp2/P6P/8/4bPPK/1R6 w - - 1 0", moves: ["b1b6", "b7b6", "c3a8"] },
        { title: "Sery vs Vecsey (1921)", fen: "r1b2rk1/2p2ppp/p7/1p6/3P3q/1BP3bP/PP3QP1/RNB1R1K1 w - - 1 0", moves: ["f2f7", "f8f7", "e1e8"] },
        { title: "Berger vs Froehlich (1922)", fen: "r2qkb1r/2p1nppp/p2p4/np1NN3/4P3/1BP5/PP1P1PPP/R1B1K2R w - - 1 0", moves: ["d5f6", "g7f6", "b3f7"] },
        { title: "Probst vs Lowig (1922)", fen: "rnbkn2r/pppp1Qpp/5b2/3NN3/3Pp3/8/PPP1KP1P/R1B4q w - - 1 0", moves: ["f7e7", "f6e7", "d5f7"] },
        { title: "Lajos Steiner vs Becker (1923)", fen: "4rk2/2pQn2p/p4p2/1p2pN1P/4q3/2P3R1/5PPK/8 w - - 1 0", moves: ["g3g8", "f8f7", "f5h6"] },
        { title: "Euwe vs Van Mindeno (1927)", fen: "r1b2rk1/pp3ppp/3p4/3Q1nq1/2B1R3/8/PP3PPP/R5K1 w - - 1 0", moves: ["d5f7", "f8f7", "e1e8"] },
        { title: "Monterinas vs Max Euwe (1927)", fen: "7r/p3ppk1/3p4/2p1P1Kp/2Pb4/3P1QPq/PP5P/R6R b - - 0 1", moves: ["h3e3", "f3e3", "h8g4"] },
        { title: "Ilya Rabinovich vs Grigori Levenfish (1927)", fen: "rn2kb1r/ppp1pppp/8/8/4q3/3P1N1b/PPP1BPnP/RNBQ1K1R b kq - 0 1", moves: ["e4h4", "f3h4", "g2f3"] },
        { title: "Springe vs Gebhard (1927)", fen: "r1b1kb1r/pp1n1pp1/1qp1p2p/6B1/2PPQ3/3B1N2/P4PPP/R4RK1 w - - 1 0", moves: ["e4e6", "f7e6", "d3g6"] },
        { title: "Vidmar vs Euwe (1929)", fen: "6k1/5p2/1p5p/p4Np1/5q2/Q6P/PPr5/3R3K w - - 1 0", moves: ["a3f8", "g8f8", "d1d8"] },
        { title: "Winter vs Gemzoe (1933)", fen: "r3q3/ppp3k1/3p3R/5b2/2PR3Q/2P1PrP1/P7/4K3 w - - 1 0", moves: ["h4f6", "g7g8", "h6h8"] },
        { title: "Nicolas Ticoulat vs Andor Lilienthal (1934)", fen: "r3k2r/1Bp2ppp/8/4q1b1/pP1n4/P1KP3P/1BP5/R2Q3R b - - 0 1", moves: ["d4b5", "c3c4", "b5d6"] },
        { title: "Dake vs Cranston (1935)", fen: "r1bq2rk/pp3pbp/2p1p1pQ/7P/3P4/2PB1N2/PP3PPR/2KR4 w - - 1 0", moves: ["h6h7", "h8h7", "h5g6"] },
        { title: "Luckis vs Czerniak (1935)", fen: "k1n3rr/Pp3p2/3q4/3N4/3Pp2p/1Q2P1p1/3B1PP1/R4RK1 w - - 1 0", moves: ["b3b7", "k8b7", "a7a8q"] },
        { title: "Cherubino Staldi vs Uulberg (1936)", fen: "8/1p3k2/4p1rp/p3Pp1Q/3qnP2/1P6/P6P/2R2R1K b - - 0 1", moves: ["d4g1", "f1g1", "e4f2"] }
    ];

    let currentIdx = 0;
    let game = new Chess();
    let board = null;
    let moveIdx = 0;
    let firstClick = null;

    function initPuzzle(idx) {
        const p = puzzles[idx];
        currentIdx = idx;
        moveIdx = 0;
        firstClick = null;
        game.load(p.fen);
        
        // Update UI Text and Progress
        document.getElementById('puzzle-title').innerText = p.title;
        const turnColor = game.turn() === 'w' ? "White" : "Black";
        document.getElementById('status').innerText = turnColor + " to Move";
        document.getElementById('status').className = "text-2xl font-black text-gray-800 uppercase tracking-tight";
        document.getElementById('solution').innerText = "";
        document.getElementById('progress-text').innerText = (idx + 1) + " / " + puzzles.length;
        document.getElementById('progress-bar').style.width = ((idx + 1) / puzzles.length * 100) + "%";

        const config = {
            position: p.fen,
            orientation: (game.turn() === 'w' ? 'white' : 'black'),
            draggable: false,
            // Using UNPKG for piece images to avoid standard CORS/loading issues
            pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/img/chesspieces/wikipedia/{piece}.png'
        };
        
        if (board) board.destroy();
        board = Chessboard('board', config);
    }

    // Fixed Interaction: Using Event Delegation on the #board container
    function handleSquareClick(square) {
        if (!firstClick) {
            // First click: Select a piece of the current turn's color
            const piece = game.get(square);
            if (piece && piece.color === game.turn()) {
                firstClick = square;
                $('.square-55d63').removeClass('highlight-square');
                $('.square-' + square).addClass('highlight-square');
            }
        } else {
            // Second click: Try to move
            const moveAttempt = game.move({ from: firstClick, to: square, promotion: 'q' });
            
            if (moveAttempt) {
                const correctMove = puzzles[currentIdx].moves[moveIdx];
                // Check move equality (coordinate format "e2e4" or SAN format "Qe4")
                if (moveAttempt.from + moveAttempt.to === correctMove || moveAttempt.san === correctMove) {
                    board.position(game.fen());
                    moveIdx++;
                    
                    if (moveIdx < puzzles[currentIdx].moves.length) {
                        document.getElementById('status').innerText = "Analyzing...";
                        setTimeout(() => {
                            game.move(puzzles[currentIdx].moves[moveIdx]);
                            board.position(game.fen());
                            moveIdx++;
                            document.getElementById('status').innerText = "Correct! Continue...";
                            document.getElementById('status').className = "text-2xl font-black text-blue-600 uppercase";
                        }, 600);
                    } else {
                        document.getElementById('status').innerText = "Checkmate!";
                        document.getElementById('status').className = "text-2xl font-black text-green-600 uppercase";
                        document.getElementById('solution').innerText = "Mission Accomplished.";
                    }
                } else {
                    game.undo();
                    document.getElementById('status').innerText = "Incorrect!";
                    document.getElementById('status').className = "text-2xl font-black text-red-500 uppercase";
                    document.getElementById('solution').innerText = "Try a different tactical sequence.";
                }
            }
            // Reset selection
            firstClick = null;
            $('.square-55d63').removeClass('highlight-square');
        }
    }

    function nextPuzzle() { if (currentIdx < puzzles.length - 1) initPuzzle(currentIdx + 1); }
    function prevPuzzle() { if (currentIdx > 0) initPuzzle(currentIdx - 1); }

    $(document).ready(() => {
        // Initialize the first puzzle
        initPuzzle(0);

        // One-time binding: Delegate click events to the board container
        $('#board').on('click', '.square-55d63', function() {
            const square = $(this).attr('data-square');
            handleSquareClick(square);
        });

        // Ensure board resizes correctly
        window.addEventListener('resize', () => { if(board) board.resize(); });
    });
</script>

</body>
</html>
