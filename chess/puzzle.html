<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Qualifier - Maryland Convent</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #board { width: 350px; max-width: 90vw; margin: 20px 0; border: 4px solid #334155; border-radius: 8px; overflow: hidden; }
        .highlight-square { box-shadow: inset 0 0 3px 3px yellow; }
        .controls { width: 350px; max-width: 90vw; display: flex; flex-direction: column; gap: 10px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
        button { padding: 12px; border-radius: 8px; border: none; background: #22c55e; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #16a34a; }
    </style>
</head>
<body>

    <h2>Friday Qualifier</h2>
    <p>Solve the puzzle to qualify for Top 9!</p>

    <div class="controls">
        <input type="text" id="studentName" placeholder="ENTER YOUR FULL NAME">
    </div>

    <div id="board"></div>

    <div class="controls">
        <p id="status" style="text-align: center; color: #94a3b8; font-size: 0.9rem;">White to move: Mate in 2</p>
    </div>

    <script>
        // 1. Firebase Configuration (assignments-de95a)
        const firebaseConfig = {
            apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
            authDomain: "assignments-de95a.firebaseapp.com",
            projectId: "assignments-de95a",
            storageBucket: "assignments-de95a.appspot.com",
            messagingSenderId: "951478149818",
            appId: "1:951478149818:web:757e78044737d97609710d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. Puzzle Data (From your mate2.txt: Henry Buckle vs NN)
        const puzzleFEN = 'r2qkb1r/pp2nppp/3p4/2pNN1B1/2BnP3/3P4/PPP2PPP/R2bK2R w KQkq - 1 0';
        const solution = ['f2f6', 'd5f6', 'c4f7']; // The coordinates for Nf6+ and Bxf7#
        
        let game = new Chess(puzzleFEN);
        let board = null;
        let selectedSquare = null;

        function onSquareClick(square) {
            if (selectedSquare === null) {
                // First click: Select White Piece
                let piece = game.get(square);
                if (piece && piece.color === 'w') {
                    selectedSquare = square;
                    $('.square-' + square).addClass('highlight-square');
                }
            } else {
                // Second click: Execute Move
                let move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                $('.highlight-square').removeClass('highlight-square');
                selectedSquare = null;

                if (move === null) return; // Invalid move

                board.position(game.fen());

                // Auto-respond for Mate in 2 (Henry Buckle vs NN logic)
                if (move.from === 'e5' && move.to === 'f6') { // Nf6+
                    setTimeout(() => {
                        game.move('g7f6'); // Black takes gxf6
                        board.position(game.fen());
                        document.getElementById('status').innerText = "Black played gxf6. Finish the Mate!";
                    }, 500);
                } else if (game.in_checkmate()) {
                    document.getElementById('status').innerText = "CHECKMATE! Well done.";
                    document.getElementById('status').style.color = "#22c55e";
                    submitResult();
                }
            }
        }

        function submitResult() {
            const name = document.getElementById('studentName').value;
            if (!name) return;
            
            db.collection("leaderboard").add({
                name: name,
                score: 1,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Score Submitted! You are on the leaderboard.");
            });
        }

        board = Chessboard('board', {
            position: puzzleFEN,
            draggable: false, // CLICK TO MOVE ONLY
            onSquareClick: onSquareClick
        });
    </script>
</body>
</html>
