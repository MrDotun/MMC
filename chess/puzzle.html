<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4 Mission: Tactical Patterns</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        #board { width: 100%; max-width: 500px; margin: 0 auto; }
        .highlight-square { box-shadow: inset 0 0 4px 4px rgba(250, 204, 21, 0.9) !important; }
        [data-square] { cursor: pointer; }
        /* ESSENTIAL: This allows clicks to pass through the image to the square div below */
        #board img { pointer-events: none; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl p-10">
        <header class="text-center mb-6">
            <h1 id="puzzle-title" class="text-3xl font-black text-gray-800">Loading...</h1>
        </header>

        <div id="board" class="rounded shadow-xl"></div>
        
        <div class="mt-6 text-center">
            <p id="status" class="text-xl font-bold text-gray-700">White to Move</p>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-8">
            <button onclick="prevPuzzle()" class="bg-gray-200 py-3 rounded-xl font-bold">Previous</button>
            <button onclick="nextPuzzle()" class="bg-blue-600 text-white py-3 rounded-xl font-bold">Next</button>
        </div>
    </div>

<script>
    // Your Puzzle Data
    const puzzles = [
        { title: "Morphy vs Duke Isouard (1858)", fen: "4kb1r/p2n1ppp/4q3/4p1B1/4P3/1Q6/PPP2PPP/2KR4 w k - 1 0" },
        { title: "Zukertort vs Anderssen (1865)", fen: "r1b2k1r/ppp1bppp/8/1B1Q4/5q2/2P5/PPP2PPP/R3R1K1 w - - 1 0" }
    ];

    let currentIdx = 0;
    let game = new Chess();
    let board = null;
    let firstClick = null;
    let engine = new Worker('chess-worker.js');

    // Handle engine move
    engine.onmessage = function(e) {
        const move = game.move({
            from: e.data.substring(0, 2),
            to: e.data.substring(2, 4),
            promotion: 'q'
        });
        if (move) {
            board.position(game.fen());
            updateStatus();
        }
    };

    function updateStatus() {
        let status = game.turn() === 'w' ? "White to Move" : "Black to Move (Thinking...)";
        if (game.in_checkmate()) status = "Checkmate!";
        document.getElementById('status').innerText = status;
    }

    function initPuzzle(idx) {
        currentIdx = idx;
        const p = puzzles[idx];
        game.load(p.fen);
        document.getElementById('puzzle-title').innerText = p.title;
        
        const config = {
            position: p.fen,
            orientation: game.turn() === 'w' ? 'white' : 'black',
            draggable: false,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        
        if (board) board.destroy();
        board = Chessboard('board', config);
        updateStatus();
    }

    function handleSquareClick(square) {
        if (game.game_over()) return;

        if (!firstClick) {
            const piece = game.get(square);
            if (piece && piece.color === game.turn()) {
                firstClick = square;
                $('[data-square]').removeClass('highlight-square');
                $('[data-square="' + square + '"]').addClass('highlight-square');
            }
        } else {
            const move = game.move({ from: firstClick, to: square, promotion: 'q' });
            
            if (move) {
                board.position(game.fen());
                $('[data-square]').removeClass('highlight-square');
                firstClick = null;
                updateStatus();
                
                // MATCHING YOUR WORKER: 
                // "position " is 9 characters. Substring(9) will extract the FEN.
                engine.postMessage("position " + game.fen());
            } else {
                // Deselect or switch piece
                firstClick = (game.get(square)?.color === game.turn()) ? square : null;
                $('[data-square]').removeClass('highlight-square');
                if (firstClick) $('[data-square="' + square + '"]').addClass('highlight-square');
            }
        }
    }

    function nextPuzzle() { if (currentIdx < puzzles.length - 1) initPuzzle(currentIdx + 1); }
    function prevPuzzle() { if (currentIdx > 0) initPuzzle(currentIdx - 1); }

    $(document).ready(() => {
        initPuzzle(0);
        // Delegate click to board squares
        $('#board').on('click', '[data-square]', function() {
            handleSquareClick($(this).attr('data-square'));
        });
    });
</script>
</body>
</html>
