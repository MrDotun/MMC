<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Week 4 Mission</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        #board { width: 100%; max-width: 500px; margin: 0 auto; }
        .highlight-square { box-shadow: inset 0 0 4px 4px rgba(250, 204, 21, 0.9) !important; }
        [data-square] { cursor: pointer; }
        /* The fix for non-responsive clicking on pieces */
        #board img { pointer-events: none; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl p-10">
        <header class="text-center mb-6">
            <h1 id="puzzle-title" class="text-2xl font-bold text-gray-800">Loading Mission...</h1>
        </header>

        <div id="board"></div>
        
        <div class="mt-6 text-center">
            <p id="status" class="text-xl font-bold text-gray-700"></p>
            <p id="feedback" class="text-lg font-black mt-2 h-8 transition-all uppercase"></p>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-8">
            <button onclick="prevPuzzle()" class="bg-gray-200 py-3 rounded-xl font-bold">Previous</button>
            <button onclick="nextPuzzle()" class="bg-blue-600 text-white py-3 rounded-xl font-bold">Next</button>
        </div>
    </div>

<script>
    const puzzles = [
        { title: "Morphy vs Duke Isouard", fen: "4kb1r/p2n1ppp/4q3/4p1B1/4P3/1Q6/PPP2PPP/2KR4 w k - 1 0", moves: ["b3b8", "d7b8", "d1d8"] },
        { title: "Zukertort vs Anderssen", fen: "r1b2k1r/ppp1bppp/8/1B1Q4/5q2/2P5/PPP2PPP/R3R1K1 w - - 1 0", moves: ["d5d8", "e7d8", "e1e8"] }
    ];

    let currentIdx = 0;
    let game = new Chess();
    let board = null;
    let firstClick = null;
    let moveIndex = 0;
    let engine = new Worker('chessworker.js');

    function initPuzzle(idx) {
        currentIdx = idx;
        moveIndex = 0;
        const p = puzzles[idx];
        game.load(p.fen);
        
        document.getElementById('puzzle-title').innerText = p.title;
        document.getElementById('feedback').innerText = "";
        
        const config = {
            position: p.fen,
            orientation: game.turn() === 'w' ? 'white' : 'black',
            draggable: false,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        
        if (board) board.destroy();
        board = Chessboard('board', config);
        updateStatus();
    }

    function handleSquareClick(square) {
        if (game.game_over()) return;

        if (!firstClick) {
            const piece = game.get(square);
            if (piece && piece.color === game.turn()) {
                firstClick = square;
                $('[data-square="' + square + '"]').addClass('highlight-square');
            }
        } else {
            const moveAttempt = firstClick + square;
            const puzzleSolution = puzzles[currentIdx].moves;
            const feedbackEl = document.getElementById('feedback');

            if (moveAttempt === puzzleSolution[moveIndex]) {
                game.move({ from: firstClick, to: square, promotion: 'q' });
                board.position(game.fen());
                moveIndex++;
                
                feedbackEl.innerText = "Correct!";
                feedbackEl.className = "text-lg font-black mt-2 h-8 text-green-600";

                // Auto-reply for the opponent
                if (moveIndex < puzzleSolution.length) {
                    setTimeout(() => {
                        const reply = puzzleSolution[moveIndex];
                        game.move({ from: reply.substring(0,2), to: reply.substring(2,4), promotion: 'q' });
                        board.position(game.fen());
                        moveIndex++;
                        updateStatus();
                    }, 600);
                }
            } else {
                feedbackEl.innerText = "Wrong! Answer: " + puzzleSolution[moveIndex];
                feedbackEl.className = "text-lg font-black mt-2 h-8 text-red-600";
            }

            $('[data-square]').removeClass('highlight-square');
            firstClick = null;
            updateStatus();
        }
    }

    function updateStatus() {
        document.getElementById('status').innerText = game.turn() === 'w' ? "White to Move" : "Black to Move";
    }

    function nextPuzzle() { if (currentIdx < puzzles.length - 1) initPuzzle(currentIdx + 1); }
    function prevPuzzle() { if (currentIdx > 0) initPuzzle(currentIdx - 1); }

    $(document).ready(() => {
        initPuzzle(0);
        $('#board').on('click', '[data-square]', function() {
            handleSquareClick($(this).attr('data-square'));
        });
    });
</script>
</body>
</html>
