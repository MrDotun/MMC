<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Missions</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body { background: radial-gradient(circle at center, #1e293b, #0f172a); }
        #board { width: 100%; max-width: 480px; margin: 0 auto; border: 8px solid #334155; border-radius: 8px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .highlight-square { box-shadow: inset 0 0 0 5px rgba(255, 255, 255, 0.5) !important; background: rgba(96, 165, 250, 0.4) !important; }
        /* The CSS Fix: Let clicks pass through images to the square data */
        .piece-417db { pointer-events: none !important; }
        .square-55d63 { cursor: pointer !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-slate-100">

    <div class="w-full max-w-2xl bg-slate-800/50 backdrop-blur-xl border border-slate-700 p-8 rounded-3xl shadow-2xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-black bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent italic tracking-tighter">MISSION CONTROL</h1>
            <p id="puzzle-title" class="text-slate-400 font-medium mt-1 tracking-widest uppercase text-xs">Loading Tactical Data...</p>
        </header>

        <div id="board"></div>
        
        <div class="mt-8 space-y-4 text-center">
            <div id="status-box" class="py-2 px-6 rounded-full bg-slate-900/50 border border-slate-700 inline-block">
                <span id="status" class="text-sm font-bold tracking-widest text-blue-400">WHITE TO MOVE</span>
            </div>
            
            <div class="h-12 flex items-center justify-center">
                <p id="feedback" class="text-2xl font-black italic tracking-tight transition-all duration-300"></p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-6">
            <button onclick="prevPuzzle()" class="bg-slate-700 hover:bg-slate-600 py-4 rounded-2xl font-bold transition-all active:scale-95 border-b-4 border-slate-900">PREVIOUS</button>
            <button onclick="nextPuzzle()" class="bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold transition-all active:scale-95 border-b-4 border-blue-800">NEXT MISSION</button>
        </div>
    </div>

<script>
    const puzzles = [
        { title: "Morphy vs Duke Isouard (1858)", fen: "4kb1r/p2n1ppp/4q3/4p1B1/4P3/1Q6/PPP2PPP/2KR4 w k - 1 0", moves: ["b3b8", "d7b8", "d1d8"] },
        { title: "Zukertort vs Anderssen (1865)", fen: "r1b2k1r/ppp1bppp/8/1B1Q4/5q2/2P5/PPP2PPP/R3R1K1 w - - 1 0", moves: ["d5d8", "e7d8", "e1e8"] }
    ];

    let currentIdx = 0;
    let game = new Chess();
    let board = null;
    let firstClick = null;
    let moveIndex = 0;
    let engine = new Worker('chessworker.js');

    function initPuzzle(idx) {
        currentIdx = idx;
        moveIndex = 0;
        const p = puzzles[idx];
        game.load(p.fen);
        
        document.getElementById('puzzle-title').innerText = p.title;
        document.getElementById('feedback').innerText = "";
        
        const config = {
            position: p.fen,
            orientation: game.turn() === 'w' ? 'white' : 'black',
            draggable: false,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        
        if (board) board.destroy();
        board = Chessboard('board', config);
        updateStatus();
    }

    function handleSquareClick(square) {
        if (game.game_over()) return;
        const feedbackEl = document.getElementById('feedback');

        if (!firstClick) {
            const piece = game.get(square);
            if (piece && piece.color === game.turn()) {
                firstClick = square;
                $('.square-55d63').removeClass('highlight-square');
                $('.square-' + square).addClass('highlight-square');
            }
        } else {
            const moveAttempt = firstClick + square;
            const solution = puzzles[currentIdx].moves;

            if (moveAttempt === solution[moveIndex]) {
                game.move({ from: firstClick, to: square, promotion: 'q' });
                board.position(game.fen());
                moveIndex++;
                
                feedbackEl.innerText = "CORRECT";
                feedbackEl.className = "text-2xl font-black italic text-emerald-400 scale-110";

                if (moveIndex < solution.length) {
                    setTimeout(() => {
                        const reply = solution[moveIndex];
                        game.move({ from: reply.substring(0,2), to: reply.substring(2,4), promotion: 'q' });
                        board.position(game.fen());
                        moveIndex++;
                        updateStatus();
                    }, 600);
                }
            } else {
                feedbackEl.innerText = "WRONG: " + solution[moveIndex];
                feedbackEl.className = "text-xl font-black italic text-rose-500";
            }

            $('.square-55d63').removeClass('highlight-square');
            firstClick = null;
            updateStatus();
        }
    }

    function updateStatus() {
        const turn = game.turn() === 'w' ? "WHITE TO MOVE" : "BLACK TO MOVE";
        document.getElementById('status').innerText = turn;
    }

    function nextPuzzle() { if (currentIdx < puzzles.length - 1) initPuzzle(currentIdx + 1); }
    function prevPuzzle() { if (currentIdx > 0) initPuzzle(currentIdx - 1); }

    $(document).ready(() => {
        initPuzzle(0);
        // Delegate click to chessboard squares via their generated class
        $('#board').on('click', '.square-55d63', function() {
            handleSquareClick($(this).attr('data-square'));
        });
    });
</script>
</body>
</html>
