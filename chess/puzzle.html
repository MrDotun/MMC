<!DOCTYPE html>
<html>
<head>
    <title>Master Chess Lab</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; }
        #board { width: 360px; max-width: 95vw; margin: 20px auto; border: 5px solid #334155; }
        .highlight { box-shadow: inset 0 0 3px 3px yellow; }
        .btn-green { background: #22c55e; color: white; padding: 15px; border-radius: 10px; font-weight: bold; width: 100%; border: none; }
    </style>
</head>
<body>

    <div id="board"></div>
    <div style="padding: 20px;">
        <h3 id="status">White to move: Mate in 2</h3>
        <button class="btn-green" onclick="nextPuzzle()">Next Puzzle</button>
    </div>

<script>
// THE PUZZLE DATABASE (Extracted from your mate2.txt)
const puzzleRepo = [
    { fen: 'r2qkb1r/pp2nppp/3p4/2pNN1B1/2BnP3/3P4/PPP2PPP/R2bK2R w KQkq - 1 0', moves: ['Nf6+', 'gxf6', 'Bxf7#'] },
    { fen: '1rb4r/pkPp3p/1b1P3n/1Q6/N3Pp2/8/P1P3PP/7K w - - 1 0', moves: ['Qd5+', 'Ka6', 'cxb8=N#'] },
    { fen: '4kb1r/p2n1ppp/4q3/4p1B1/4P3/1Q6/PPP2PPP/2KR4 w k - 1 0', moves: ['Qb8+', 'Nxb8', 'Rd8#'] },
    { fen: 'r1b2k1r/ppp1bppp/8/1B1Q4/5q2/2P5/PPP2PPP/R3R1K1 w - - 1 0', moves: ['Qd8+', 'Bxd8', 'Re8#'] },
    { fen: '5rkr/pp2pRp1/1b1p1Pb1/3P2Q1/2n3P1/2p5/P4P2/4R1K1 w - - 1 0', moves: ['Qxg7#'] } 
    // Add all 50 here following this exact format: { fen: '...', moves: ['move1', 'reply', 'mate'] }
];

let currentIndex = 0;
let game = new Chess();
let board = null;
let selectedSquare = null;

function loadPuzzle(index) {
    const p = puzzleRepo[index];
    game = new Chess(p.fen);
    board.position(p.fen);
    selectedSquare = null;
    $('#status').text(game.turn() === 'w' ? "White to move: Mate in 2" : "Black to move: Mate in 2");
}

function onSquareClick(square) {
    const p = puzzleRepo[currentIndex];
    
    if (selectedSquare === null) {
        if (game.get(square) && game.get(square).color === game.turn()) {
            selectedSquare = square;
            $('.square-' + square).addClass('highlight');
        }
        return;
    }

    // Attempt Move
    let move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
    $('.highlight').removeClass('highlight');
    selectedSquare = null;

    if (move === null) return;

    board.position(game.fen());

    // COMPUTER REPLY LOGIC
    // Check if the move matches the solution
    let moveIndex = game.history().length - 1;
    if (move.san === p.moves[0]) {
        // If there's a reply defined in the array, play it
        if (p.moves.length > 1 && !game.in_checkmate()) {
            setTimeout(() => {
                game.move(p.moves[1]);
                board.position(game.fen());
                $('#status').text("Computer replied. Find the Mate!");
            }, 600);
        }
    } else {
        $('#status').text("Wrong move. Try again!");
        setTimeout(() => loadPuzzle(currentIndex), 1000);
    }

    if (game.in_checkmate()) {
        $('#status').text("MATE! EXCELLENT.");
    }
}

function nextPuzzle() {
    currentIndex = (currentIndex + 1) % puzzleRepo.length;
    loadPuzzle(currentIndex);
}

board = Chessboard('board', {
    position: 'start',
    draggable: false, // Click-to-move
    onSquareClick: onSquareClick
});

loadPuzzle(0);
</script>
</body>
</html>
