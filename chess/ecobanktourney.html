<div id="welcome-overlay">
    <div class="login-card bounce-anim">
        <h1 style="color: #005aab; margin: 0; font-size: 2.2em;">ECOBANK</h1>
        <h3 style="margin: 5px 0 5px 0; color: #94a3b8; font-weight: 500;">Pre Tournament 2026</h3>
        <p style="color: #4ade80; font-size: 1em; margin-bottom: 15px; font-weight: bold;">Maryland Convent Private School</p>
        
        <p class="instruction-text">Select your name and enter password to play</p>
        
        <div id="rep-list" style="margin-bottom: 15px; max-height: 200px; overflow-y: auto;">
            <button class="rep-btn" onclick="selectRep(this, 'Onele Chierika')">Onele Chierika</button>
            <button class="rep-btn" onclick="selectRep(this, 'Semilore Beckley')">Semilore Beckley</button>
            <button class="rep-btn" onclick="selectRep(this, 'Andrew Nwagbale')">Andrew Nwagbale</button>
            <button class="rep-btn" onclick="selectRep(this, 'Ajayi Oluwaseun')">Ajayi Oluwaseun</button>
            <button class="rep-btn" onclick="selectRep(this, 'Obi Chukwuemeka')">Obi Chukwuemeka</button>
            <button class="rep-btn" onclick="selectRep(this, 'Eliana Lawrence')">Eliana Lawrence</button>
            <button class="rep-btn" onclick="selectRep(this, 'Sage Osafile')">Sage Osafile</button>
        </div>

        <!-- Added Password Input Field -->
        <input type="password" id="studentPass" placeholder="Enter Tournament Password">
        
        <button class="submit-btn" style="background:#4ade80; color:#0f172a;" onclick="validateAndStart()">LOGIN & START ROUND</button>
        
        <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
        
        <button class="submit-btn" style="background: #1e293b; border: 1px solid #facc15; color: #facc15;" onclick="openGuestLobby()">
            Watch live games
        </button>
        <button class="submit-btn" style="background: #1e293b; border: 1px solid #94a3b8; color: #94a3b8; margin-top: 10px;" onclick="openTeamPortal()">
            <i class="fas fa-database" style="margin-right: 5px;"></i> Replay previous rounds
        </button>
    </div>
</div>
