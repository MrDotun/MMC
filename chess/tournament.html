<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🇳🇬 Nigerian Masters: Varsity Cup</title>
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; overflow-x: hidden; }
        #board-wrapper { display: flex; flex-direction: column; align-items: center; margin: 10px 0; }
        #board { width: 90vw; max-width: 400px; height: auto; border: 2px solid #333; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        /* Opposite Clocks */
        .clock-ui { font-size: 32px; font-weight: bold; font-family: monospace; padding: 8px; width: 90vw; max-width: 400px; box-sizing: border-box; background: #1a1a1a; }
        #master-timer { color: #e74c3c; border-bottom: 2px solid #333; border-radius: 8px 8px 0 0; }
        #player-timer { color: #2ecc71; border-top: 2px solid #333; border-radius: 0 0 8px 8px; }

        .game-stats { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .info-card { background: #1e2a36; padding: 10px; border-radius: 8px; width: 45%; min-width: 150px; border-top: 4px solid #27ae60; text-align: left; font-size: 14px; }
        .info-card.player { border-top-color: #3498db; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 5px; }
        .draw-btn { background: #f39c12; color: white; width: 100%; margin-top: 10px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 100; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal { background: #222; padding: 25px; border: 2px solid #27ae60; border-radius: 12px; max-width: 500px; width: 100%; overflow-y: auto; max-height: 90vh; }
        input { padding: 12px; width: 80%; margin-bottom: 15px; border-radius: 4px; border: none; font-size: 16px; }
        .master-list { text-align: left; font-size: 13px; background: #111; padding: 10px; border-radius: 5px; margin: 15px 0; }
        .rating-badge { color: #f1c40f; font-weight: bold; float: right; }
        
        .highlight-sq { box-shadow: inset 0 0 3px 3px #f1c40f !important; }
    </style>
</head>
<body>

    <div id="name-overlay" class="overlay" style="display: flex;">
        <div class="modal">
            <h2 style="color:#27ae60; margin-top:0;">🇳🇬 THE VARSITY CUP</h2>
            <p>A new lineup of Legends awaits you.</p>
            <div class="master-list" id="dynamic-roster"></div>
            <input type="text" id="player-name-input" placeholder="Enter Your Name">
            <button class="btn" style="background:#27ae60; color:white; width: 80%;" onclick="initializeTournament()">ENTER THE ARENA</button>
        </div>
    </div>

    <div id="intro-overlay" class="overlay">
        <div class="modal">
            <h1 id="round-title" style="color:#27ae60;">ROUND 1</h1>
            <h2 id="master-name-intro">Master Name</h2>
            <p id="master-bio-intro" style="font-style: italic; line-height: 1.5;"></p>
            <button class="btn" style="background:#27ae60; color:white; padding: 15px 30px;" onclick="closeIntro()">BEGIN MATCH</button>
        </div>
    </div>

    <h3>Nigerian Masters Varsity Cup</h3>

    <div class="game-stats">
        <div class="info-card player">
            <b id="display-player-name">Student</b><br>
            Rating: <span id="display-player-rating">1500</span><br>
            Pts: <span id="display-player-points">0.0</span>
        </div>
        <div class="info-card">
            <b id="current-name">Mr. Dotun</b><br>
            <span id="current-title">Coach</span><br>
            Rating: <span id="current-rating">2150</span>
            <button class="btn draw-btn" onclick="offerDraw()">Offer Draw</button>
        </div>
    </div>

    <div id="board-wrapper">
        <div id="master-timer" class="clock-ui">05:00</div>
        <div id="board"></div>
        <div id="player-timer" class="clock-ui">05:00</div>
    </div>

    <p id="system-msg" style="color:#f1c40f; height: 20px; font-weight: bold;"></p>

    <script>
        const masterPool = [
            { name: "Mr. Dotun", title: "Coach", rating: 2150, blunder: 0.45, depth: 2, bio: "Welcome to the Grinder. I am Mr. Dotun. I will squeeze your position until you find the exit!" },
            { name: "Okeke Isaac", title: "IM", rating: 2210, blunder: 0.35, depth: 3, bio: "The tactical wonder-kid. Isaac plays with youthful energy and lightning speed!" },
            { name: "Bunmi Olape", title: "IM", rating: 2320, blunder: 0.30, depth: 4, bio: "The Professor. IM Bunmi Olape will test your endgame technique and discipline." },
            { name: "Ajibola Olanrewaju", title: "FM", rating: 2335, blunder: 0.25, depth: 5, bio: "The Blitz specialist. He thrives in the chaos of 5-minute chess!" },
            { name: "Oladapo Adu", title: "IM", rating: 2450, blunder: 0.15, depth: 6, bio: "The Veteran King. A powerhouse of Nigerian chess who rarely shows weakness." },
            { name: "Akinseye Abiola", title: "FM", rating: 2380, blunder: 0.20, depth: 6, bio: "Behold the 'Iron Wall.' Break through his defense if you can!" },
            { name: "Odion Aikhoje", title: "IM", rating: 2510, blunder: 0.08, depth: 10, bio: "The Golden Hero of 1998. He is arguably the strongest strategist in the field." },
            { name: "Fola Akintola", title: "Master", rating: 2390, blunder: 0.18, depth: 7, bio: "A fierce attacker who hunts the King from the very first move." },
            { name: "Anwuli Daniel", title: "IM", rating: 2420, blunder: 0.12, depth: 8, bio: "The Speed Demon. He might not be the highest rated today, but he is the fastest!" }
        ];

        let Masters = masterPool; // Using all 9 players
        const rosterDiv = document.getElementById('dynamic-roster');
        rosterDiv.innerHTML = '<p style="border-bottom: 1px solid #333; padding-bottom:5px;"><b>THE ELITE LINEUP:</b></p>';
        Masters.forEach((m, i) => {
            rosterDiv.innerHTML += `Round ${i+1}: <b>${m.name}</b> <span class="rating-badge">${m.rating}</span><br>`;
        });

        let board = null, game = new Chess(), currentRound = 0, pTime = 300, mTime = 300, timerInterval;
        let sourceSquare = null;
        const worker = new Worker('chess-worker.js');

        function initializeTournament() {
            const name = document.getElementById('player-name-input').value.trim();
            if (name) document.getElementById('display-player-name').innerText = name;
            document.getElementById('name-overlay').style.display = 'none';
            showRoundIntro();
        }

        function showRoundIntro() {
            const m = Masters[currentRound];
            document.getElementById('current-name').innerText = m.name;
            document.getElementById('current-title').innerText = m.title;
            document.getElementById('current-rating').innerText = m.rating;
            document.getElementById('round-title').innerText = `ROUND ${currentRound + 1}`;
            document.getElementById('master-name-intro').innerText = `${m.name} (${m.rating})`;
            document.getElementById('master-bio-intro').innerText = m.bio;
            document.getElementById('intro-overlay').style.display = 'flex';
        }

        function closeIntro() {
            document.getElementById('intro-overlay').style.display = 'none';
            if (!board) {
                board = Chessboard('board', {
                    draggable: false, // Force click-to-move
                    position: 'start',
                    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
                });
                // Attach click listeners to squares
                $('#board').on('click', '.square-55d6', function() {
                    const square = $(this).data('square');
                    onSquareClick(square);
                });
            } else { board.start(); game.reset(); }
            pTime = 300; mTime = 300;
            startClock();
        }

        function onSquareClick(square) {
            if (game.turn() !== 'w') return;

            if (sourceSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    $('.square-55d6').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                const move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d6').removeClass('highlight-sq');
                sourceSquare = null;

                if (move) {
                    board.position(game.fen());
                    const m = Masters[currentRound];
                    worker.postMessage("position " + game.fen());
                    worker.postMessage("go depth " + m.depth);
                }
            }
        }

        worker.onmessage = function(e) {
            if (e.data.indexOf('bestmove') > -1) {
                const moveStr = e.data.split(' ')[1];
                const master = Masters[currentRound];
                
                setTimeout(() => {
                    if (Math.random() < master.blunder) {
                        const moves = game.moves();
                        game.move(moves[Math.floor(Math.random() * moves.length)]);
                    } else {
                        game.move({ from: moveStr.substring(0,2), to: moveStr.substring(2,4), promotion: 'q' });
                    }
                    board.position(game.fen());
                    checkGameOver();
                }, 500);
            }
        };

        function checkGameOver() {
            if (game.game_over()) {
                clearInterval(timerInterval);
                let msg = game.in_draw() ? "Draw!" : (game.turn() === 'b' ? "You Win!" : "Master Wins!");
                document.getElementById('system-msg').innerText = msg;
                // Add logic here to increment currentRound and showNextRound if needed
            }
        }

        function startClock() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (game.turn() === 'w') pTime--; else mTime--;
                const fmt = (s) => {
                    let mins = Math.floor(s/60), secs = s%60;
                    return `${mins}:${secs < 10 ? '0'+secs : secs}`;
                };
                document.getElementById('master-timer').innerText = fmt(mTime);
                document.getElementById('player-timer').innerText = fmt(pTime);
                if (pTime <= 0 || mTime <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('system-msg').innerText = "Time Out!";
                }
            }, 1000);
        }

        function offerDraw() {
            document.getElementById('system-msg').innerText = `${Masters[currentRound].name}: "No draws!"`;
            setTimeout(() => { document.getElementById('system-msg').innerText = ""; }, 3000);
        }
    </script>
</body>
</html>
