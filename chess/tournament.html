<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇳🇬 Nigerian Masters: Varsity Cup</title>
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        #board-wrapper { display: flex; justify-content: center; margin: 15px 0; }
        #board { width: 90vw; max-width: 400px; height: auto; border: 2px solid #333; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        /* Updated Stats Layout to put Clocks on the side */
        .game-stats { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 10px; }
        .info-card { 
            background: #1e2a36; 
            padding: 10px; 
            border-radius: 8px; 
            width: 95%; 
            max-width: 400px; 
            border-top: 4px solid #27ae60; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            text-align: left; 
            box-sizing: border-box;
        }
        .info-card.player { border-top-color: #3498db; }
        .details { flex: 1; }
        .side-clock { 
            font-size: 24px; 
            font-family: monospace; 
            font-weight: bold; 
            color: #bbb; 
            background: #111; 
            padding: 5px 10px; 
            border-radius: 4px; 
            border: 1px solid #444;
        }
        .active-turn { color: #e74c3c; border-color: #e74c3c; }

        .btn { padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 5px; }
        .draw-btn { background: #f39c12; color: white; margin-top: 5px; font-size: 12px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 100; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal { background: #222; padding: 25px; border: 2px solid #27ae60; border-radius: 12px; max-width: 500px; width: 100%; overflow-y: auto; max-height: 90vh; }
        input { padding: 12px; width: 80%; margin-bottom: 15px; border-radius: 4px; border: none; font-size: 16px; }
        .master-list { text-align: left; font-size: 13px; background: #111; padding: 10px; border-radius: 5px; margin: 15px 0; }
        .rating-badge { color: #f1c40f; font-weight: bold; float: right; }
        
        /* Highlight selected piece */
        .highlight-sq { background-color: rgba(241, 196, 15, 0.5) !important; }
    </style>
</head>
<body>

    <div id="name-overlay" class="overlay" style="display: flex;">
        <div class="modal">
            <h2 style="color:#27ae60; margin-top:0;">🇳🇬 THE VARSITY CUP</h2>
            <p>A new lineup of Legends awaits you.</p>
            <div class="master-list" id="dynamic-roster"></div>
            <input type="text" id="player-name-input" placeholder="Enter Your Name">
            <button class="btn" style="background:#27ae60; color:white; width: 80%;" onclick="initializeTournament()">ENTER THE ARENA</button>
        </div>
    </div>

    <div id="intro-overlay" class="overlay">
        <div class="modal">
            <h1 id="round-title" style="color:#27ae60;">ROUND 1</h1>
            <h2 id="master-name-intro">Master Name</h2>
            <p id="master-bio-intro" style="font-style: italic; line-height: 1.5;"></p>
            <button class="btn" style="background:#27ae60; color:white; padding: 15px 30px;" onclick="closeIntro()">BEGIN MATCH</button>
        </div>
    </div>

    <h3>Nigerian Masters Varsity Cup</h3>

    <div class="game-stats">
        <div class="info-card">
            <div class="details">
                <b id="current-name">Mr. Dotun</b><br>
                <span id="current-title">Coach</span> | Rating: <span id="current-rating">2150</span>
                <button class="btn draw-btn" onclick="offerDraw()">Offer Draw</button>
            </div>
            <div id="master-timer" class="side-clock">05:00</div>
        </div>

        <div class="info-card player">
            <div class="details">
                <b id="display-player-name">Student</b><br>
                Rating: 1500 | Pts: <span id="display-player-points">0.0</span>
            </div>
            <div id="player-timer" class="side-clock">05:00</div>
        </div>
    </div>

    <div id="board-wrapper"><div id="board"></div></div>
    <p id="system-msg" style="color:#f1c40f; height: 20px; font-weight: bold;"></p>

    <script>
        const masterPool = [
            { name: "Mr. Dotun", title: "Coach", rating: 2150, blunder: 0.45, bio: "Welcome to the Grinder. I am Mr. Dotun." },
            { name: "Okeke Isaac", title: "IM", rating: 2210, blunder: 0.35, bio: "The tactical wonder-kid." },
            { name: "Bunmi Olape", title: "IM", rating: 2320, blunder: 0.30, bio: "The Professor." },
            { name: "Ajibola Olanrewaju", title: "FM", rating: 2335, blunder: 0.25, bio: "The Blitz specialist." },
            { name: "Oladapo Adu", title: "IM", rating: 2450, blunder: 0.15, bio: "The Veteran King." }
        ];

        let Masters = masterPool.sort(() => 0.5 - Math.random()).slice(0, 7);
        const rosterDiv = document.getElementById('dynamic-roster');
        Masters.forEach((m, i) => {
            rosterDiv.innerHTML += `Round ${i+1}: <b>${m.name}</b> <span class="rating-badge">${m.rating}</span><br>`;
        });

        let board = null, game = new Chess(), currentRound = 0, timerInterval;
        let pTime = 300, mTime = 300;
        let sourceSquare = null;
        const worker = new Worker('chess-worker.js');

        function initializeTournament() {
            const name = document.getElementById('player-name-input').value.trim();
            if (name) document.getElementById('display-player-name').innerText = name;
            document.getElementById('name-overlay').style.display = 'none';
            showRoundIntro();
        }

        function showRoundIntro() {
            const m = Masters[currentRound];
            document.getElementById('current-name').innerText = m.name;
            document.getElementById('current-title').innerText = m.title;
            document.getElementById('current-rating').innerText = m.rating;
            document.getElementById('round-title').innerText = `ROUND ${currentRound + 1}`;
            document.getElementById('master-name-intro').innerText = `${m.name} (${m.rating})`;
            document.getElementById('master-bio-intro').innerText = m.bio;
            document.getElementById('intro-overlay').style.display = 'flex';
        }

        function closeIntro() {
            document.getElementById('intro-overlay').style.display = 'none';
            const cfg = {
                draggable: false, 
                position: 'start',
                onSquareClick: onSquareClick,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            if (!board) board = Chessboard('board', cfg);
            else { board.start(); game.reset(); }
            pTime = 300; mTime = 300;
            updateClockDisplay();
            startClock();
        }

        function onSquareClick(square) {
            if (game.turn() !== 'w') return;

            if (sourceSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    $('.square-55d6').removeClass('highlight-sq');
                    $('.square-' + square).addClass('highlight-sq');
                }
            } else {
                const move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-55d6').removeClass('highlight-sq');
                sourceSquare = null;

                if (move) {
                    board.position(game.fen());
                    window.setTimeout(() => worker.postMessage("position " + game.fen()), 250);
                } else {
                    // If clicked another white piece, change selection
                    const piece = game.get(square);
                    if (piece && piece.color === 'w') {
                        sourceSquare = square;
                        $('.square-' + square).addClass('highlight-sq');
                    }
                }
            }
        }

        worker.onmessage = function(e) {
            const bestMove = e.data;
            if (bestMove.indexOf(':') !== -1) return; // Ignore PV messages
            
            const master = Masters[currentRound];
            if (Math.random() < master.blunder) {
                const moves = game.moves();
                game.move(moves[Math.floor(Math.random() * moves.length)]);
            } else {
                game.move({ from: bestMove.substring(0,2), to: bestMove.substring(2,4), promotion: 'q' });
            }
            board.position(game.fen());
        };

        function startClock() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (game.turn() === 'w') pTime--; else mTime--;
                updateClockDisplay();
                if (pTime <= 0 || mTime <= 0) clearInterval(timerInterval);
            }, 1000);
        }

        function updateClockDisplay() {
            const fmt = (s) => {
                let m = Math.floor(s/60), secs = s%60;
                return `${m}:${secs < 10 ? '0'+secs : secs}`;
            };
            const pt = document.getElementById('player-timer');
            const mt = document.getElementById('master-timer');
            pt.innerText = fmt(pTime);
            mt.innerText = fmt(mTime);
            
            pt.classList.toggle('active-turn', game.turn() === 'w');
            mt.classList.toggle('active-turn', game.turn() === 'b');
        }

        function offerDraw() {
            document.getElementById('system-msg').innerText = "Master: No draws!";
            setTimeout(() => { document.getElementById('system-msg').innerText = ""; }, 2000);
        }
    </script>
</body>
</html>
