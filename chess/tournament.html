<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🇳🇬 Nigerian Masters: Varsity Cup</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <style>
        :root {
            --primary: #27ae60;
            --secondary: #2ecc71;
            --danger: #e74c3c;
            --bg: #0f0f12;
            --card-bg: #1e1e26;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg); 
            color: white; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
            overflow-x: hidden; 
        }

        h3 { margin: 10px 0; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; color: var(--primary); }

        #board-wrapper { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 15px auto;
            position: relative;
        }

        #board { 
            width: 90vw; 
            max-width: 400px; 
            border: 4px solid #222; 
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        
        /* Digital Clocks */
        .clock-ui { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 28px; 
            padding: 12px; 
            width: 90vw; 
            max-width: 400px; 
            box-sizing: border-box; 
            background: #000;
            letter-spacing: 2px;
        }
        #master-timer { color: var(--danger); border-radius: 12px 12px 0 0; border-bottom: 1px solid #333; }
        #player-timer { color: var(--secondary); border-radius: 0 0 12px 12px; border-top: 1px solid #333; }

        .game-stats { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin: 10px auto; 
            max-width: 420px;
        }

        .info-card { 
            background: var(--card-bg); 
            padding: 12px; 
            border-radius: 10px; 
            flex: 1;
            border-left: 4px solid var(--primary); 
            text-align: left; 
            font-size: 13px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .info-card.player { border-left-color: #3498db; }
        
        .btn { 
            padding: 12px 20px; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 12px;
        }
        .btn:active { transform: scale(0.95); }

        .draw-btn { 
            background: #444; 
            color: #ddd; 
            width: 100%; 
            margin-top: 8px; 
            padding: 5px;
        }

        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); 
            display: none; z-index: 100; 
            flex-direction: column; justify-content: center; align-items: center; 
            backdrop-filter: blur(8px);
        }

        .modal { 
            background: #1a1a20; 
            padding: 30px; 
            border: 1px solid #333; 
            border-radius: 20px; 
            max-width: 400px; 
            width: 85%; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        input { 
            padding: 15px; 
            width: 90%; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #000; 
            color: white; 
            font-size: 16px; 
            text-align: center;
        }

        .master-list { 
            text-align: left; font-size: 12px; background: #000; 
            padding: 15px; border-radius: 10px; margin: 15px 0; 
            border: 1px solid #222; max-height: 200px; overflow-y: auto;
        }

        .rating-badge { color: #f1c40f; font-weight: bold; float: right; font-family: 'Orbitron'; }
        
        /* Highlight move colors */
        .highlight-sq { 
            box-shadow: inset 0 0 10px 5px rgba(241, 196, 15, 0.8) !important; 
        }

        #system-msg {
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 10px;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div id="name-overlay" class="overlay" style="display: flex;">
        <div class="modal">
            <h1 style="color:var(--primary); margin:0 0 10px 0; font-family: 'Orbitron';">NIGERIAN MASTERS</h1>
            <p style="font-size: 14px; color: #888;">THE VARSITY CUP 2026</p>
            <div class="master-list" id="dynamic-roster"></div>
            <input type="text" id="player-name-input" placeholder="Enter Your Full Name">
            <button class="btn" style="background:var(--primary); color:white; width: 100%; font-size: 16px;" onclick="initializeTournament()">ENTER THE ARENA</button>
        </div>
    </div>

    <div id="intro-overlay" class="overlay">
        <div class="modal">
            <h1 id="round-title" style="color:var(--primary); font-family: 'Orbitron';">ROUND 1</h1>
            <h2 id="master-name-intro" style="margin: 5px 0;"></h2>
            <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
            <p id="master-bio-intro" style="font-style: italic; line-height: 1.6; color: #bbb;"></p>
            <button class="btn" style="background:var(--primary); color:white; width: 100%; margin-top: 20px;" onclick="closeIntro()">START GAME</button>
        </div>
    </div>

    <h3>Varsity Cup</h3>

    <div class="game-stats">
        <div class="info-card player">
            <b id="display-player-name">Student</b><br>
            Rating: <span id="display-player-rating">1500</span><br>
            Pts: <span id="display-player-points" style="color:var(--primary)">0.0</span>
        </div>
        <div class="info-card">
            <b id="current-name">...</b><br>
            <span id="current-title" style="color: #888;">...</span><br>
            Rating: <span id="current-rating">...</span>
            <button class="btn draw-btn" onclick="offerDraw()">Offer Draw</button>
        </div>
    </div>

    <div id="board-wrapper">
        <div id="master-timer" class="clock-ui">05:00</div>
        <div id="board"></div>
        <div id="player-timer" class="clock-ui">05:00</div>
    </div>

    <p id="system-msg" style="color:#f1c40f;"></p>

    <script>
        const masterPool = [
            { name: "Mr. Dotun", title: "Coach", rating: 2150, blunder: 0.45, depth: 2, bio: "Welcome to the Grinder. I am Mr. Dotun. I will squeeze your position until you find the exit!" },
            { name: "Okeke Isaac", title: "IM", rating: 2210, blunder: 0.35, depth: 3, bio: "The tactical wonder-kid. Isaac plays with youthful energy and lightning speed!" },
            { name: "Bunmi Olape", title: "IM", rating: 2320, blunder: 0.30, depth: 4, bio: "The Professor. IM Bunmi Olape will test your endgame technique and discipline." },
            { name: "Ajibola Olanrewaju", title: "FM", rating: 2335, blunder: 0.25, depth: 5, bio: "The Blitz specialist. He thrives in the chaos of 5-minute chess!" },
            { name: "Oladapo Adu", title: "IM", rating: 2450, blunder: 0.15, depth: 6, bio: "The Veteran King. A powerhouse of Nigerian chess who rarely shows weakness." },
            { name: "Akinseye Abiola", title: "FM", rating: 2380, blunder: 0.20, depth: 6, bio: "Behold the 'Iron Wall.' Break through his defense if you can!" },
            { name: "Odion Aikhoje", title: "IM", rating: 2510, blunder: 0.08, depth: 10, bio: "The Golden Hero of 1998. He is arguably the strongest strategist in the field." },
            { name: "Fola Akintola", title: "Master", rating: 2390, blunder: 0.18, depth: 7, bio: "A fierce attacker who hunts the King from the very first move." },
            { name: "Anwuli Daniel", title: "IM", rating: 2420, blunder: 0.12, depth: 8, bio: "The Speed Demon. He might not be the highest rated today, but he is the fastest!" }
        ];

        let Masters = masterPool;
        const rosterDiv = document.getElementById('dynamic-roster');
        rosterDiv.innerHTML = '<p style="color:var(--primary); font-weight:bold; margin-bottom:10px;">TOURNAMENT BRACKET:</p>';
        Masters.forEach((m, i) => {
            rosterDiv.innerHTML += `<div style="margin-bottom:5px;">R${i+1}: <b>${m.name}</b> <span class="rating-badge">${m.rating}</span></div>`;
        });

        let board = null, game = new Chess(), currentRound = 0, pTime = 300, mTime = 300, timerInterval;
        let sourceSquare = null;
        
        // Note: Ensure chess-worker.js exists in your directory for the AI to move!
        const worker = new Worker('chess-worker.js');

        function initializeTournament() {
            const name = document.getElementById('player-name-input').value.trim();
            if (name) document.getElementById('display-player-name').innerText = name;
            document.getElementById('name-overlay').style.display = 'none';
            showRoundIntro();
        }

        function showRoundIntro() {
            const m = Masters[currentRound];
            document.getElementById('current-name').innerText = m.name;
            document.getElementById('current-title').innerText = m.title;
            document.getElementById('current-rating').innerText = m.rating;
            document.getElementById('round-title').innerText = `ROUND ${currentRound + 1}`;
            document.getElementById('master-name-intro').innerText = `${m.name} (${m.rating})`;
            document.getElementById('master-bio-intro').innerText = m.bio;
            document.getElementById('intro-overlay').style.display = 'flex';
        }

        function closeIntro() {
            document.getElementById('intro-overlay').style.display = 'none';
            if (!board) {
                board = Chessboard('board', {
                    draggable: false, // Disables dragging so clicks take priority
                    position: 'start',
                    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
                });
                
                // FIXED CLICK HANDLER
                $('#board').on('click', '.square-55d6', function() {
                    const square = $(this).attr('data-square');
                    onSquareClick(square);
                });
            } else { 
                board.start(); 
                game.reset(); 
            }
            pTime = 300; mTime = 300;
            startClock();
        }

        function onSquareClick(square) {
            if (game.turn() !== 'w') return; // Not player's turn

            const piece = game.get(square);

            // SELECTING PIECE
            if (sourceSquare === null) {
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    highlightSquare(square);
                }
            } 
            // ALREADY SELECTED A PIECE
            else {
                // If clicking another of your own pieces, switch selection
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    highlightSquare(square);
                    return;
                }

                // Attempt Move
                const move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                
                if (move) {
                    board.position(game.fen());
                    $('.square-55d6').removeClass('highlight-sq');
                    sourceSquare = null;
                    
                    // Trigger AI
                    const m = Masters[currentRound];
                    worker.postMessage("position " + game.fen());
                    worker.postMessage("go depth " + m.depth);
                } else {
                    // Invalid move - just reset selection
                    $('.square-55d6').removeClass('highlight-sq');
                    sourceSquare = null;
                }
            }
        }

        function highlightSquare(square) {
            $('.square-55d6').removeClass('highlight-sq');
            $('.square-' + square).addClass('highlight-sq');
        }

        worker.onmessage = function(e) {
            if (e.data.indexOf('bestmove') > -1) {
                const moveStr = e.data.split(' ')[1];
                const master = Masters[currentRound];
                
                setTimeout(() => {
                    if (Math.random() < master.blunder) {
                        const moves = game.moves();
                        game.move(moves[Math.floor(Math.random() * moves.length)]);
                    } else {
                        game.move({ from: moveStr.substring(0,2), to: moveStr.substring(2,4), promotion: 'q' });
                    }
                    board.position(game.fen());
                    checkGameOver();
                }, 600);
            }
        };

        function checkGameOver() {
            if (game.game_over()) {
                clearInterval(timerInterval);
                let msg = "";
                if (game.in_draw()) msg = "Draw! Technical Masterclass.";
                else if (game.turn() === 'b') msg = "Victory! You beat the Master!";
                else msg = "Checkmate! Master wins.";
                
                document.getElementById('system-msg').innerText = msg;
            }
        }

        function startClock() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (game.turn() === 'w') pTime--; else mTime--;
                
                const fmt = (s) => {
                    if (s < 0) s = 0;
                    let mins = Math.floor(s/60), secs = s%60;
                    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                };
                
                document.getElementById('master-timer').innerText = fmt(mTime);
                document.getElementById('player-timer').innerText = fmt(pTime);

                if (pTime <= 0 || mTime <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('system-msg').innerText = "Flag Fallen - Time Out!";
                }
            }, 1000);
        }

        function offerDraw() {
            const master = Masters[currentRound].name;
            document.getElementById('system-msg').innerText = `${master}: "Play on! No shortcuts here."`;
            setTimeout(() => { document.getElementById('system-msg').innerText = ""; }, 3000);
        }
    </script>
</body>
</html>
