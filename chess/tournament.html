<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🇳🇬 Nigerian Masters: Varsity Cup</title>
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <style>
        /* [Keeping your beautiful Nigerian Masters CSS exactly as it was] */
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0c; color: #e0e0e0; text-align: center; margin: 0; padding: 10px; }
        h3 { color: #27ae60; text-transform: uppercase; letter-spacing: 3px; margin: 15px 0; font-size: 1.2rem; }
        #board-wrapper { display: flex; flex-direction: column; align-items: center; margin: 10px 0; }
        #board { width: 90vw; max-width: 400px; border: 5px solid #1a1a1a; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .clock-ui { font-size: 36px; font-weight: 700; font-family: 'Courier New', monospace; padding: 12px; width: 90vw; max-width: 400px; box-sizing: border-box; background: #111; }
        #master-timer { color: #ff4757; border-bottom: 2px solid #222; border-radius: 12px 12px 0 0; }
        #player-timer { color: #2ed573; border-top: 2px solid #222; border-radius: 0 0 12px 12px; }
        .game-stats { display: flex; justify-content: space-around; max-width: 420px; margin: 0 auto 15px; gap: 10px; }
        .info-card { background: #161b22; padding: 12px; border-radius: 10px; width: 48%; border-top: 4px solid #27ae60; text-align: left; font-size: 14px; }
        .info-card.player { border-top-color: #3498db; }
        .btn { padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .draw-btn { background: #2c3e50; color: #bdc3c7; width: 100%; margin-top: 10px; font-size: 11px; text-transform: uppercase; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; z-index: 100; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal { background: #1c1c21; padding: 30px; border: 1px solid #27ae60; border-radius: 15px; max-width: 450px; width: 85%; }
        input { padding: 15px; width: 85%; margin-bottom: 20px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; font-size: 16px; }
        .master-list { text-align: left; font-size: 13px; background: #000; padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px solid #222; }
        .rating-badge { color: #f1c40f; font-weight: bold; float: right; }
    </style>
</head>
<body>

    <div id="name-overlay" class="overlay" style="display: flex;">
        <div class="modal">
            <h1 style="color:#27ae60; margin: 0 0 10px 0;">NIGERIAN MASTERS</h1>
            <p style="color: #888; margin-bottom: 20px;">The Varsity Cup: Legends Lineup</p>
            <div class="master-list" id="dynamic-roster"></div>
            <input type="text" id="player-name-input" placeholder="Your Full Name">
            <input type="password" id="player-pass-input" placeholder="Secret Password" style="margin-top:-10px">
            <button class="btn" style="background:#27ae60; color:white; width: 100%;" onclick="initializeTournament()">ENTER THE ARENA</button>
        </div>
    </div>

    <div id="intro-overlay" class="overlay">
        <div class="modal">
            <h1 id="round-title" style="color:#27ae60;">ROUND 1</h1>
            <h2 id="master-name-intro">Master Name</h2>
            <p id="master-bio-intro" style="font-style: italic; line-height: 1.6; color: #bbb;"></p>
            <button class="btn" style="background:#27ae60; color:white; padding: 15px 40px; margin-top: 20px;" onclick="closeIntro()">BEGIN MATCH</button>
        </div>
    </div>

    <h3>🇳🇬 Varsity Cup 2026</h3>

    <div class="game-stats">
        <div class="info-card player">
            <b id="display-player-name">Student</b><br>
            <small style="color: #3498db;">Rating: <span id="display-player-rating">1500</span></small><br>
            Round: <span id="display-round">1/9</span>
        </div>
        <div class="info-card">
            <b id="current-name">Mr. Dotun</b><br>
            <small id="current-title" style="color: #27ae60;">Coach</small><br>
            Rating: <span id="current-rating">2150</span>
            <button class="btn draw-btn" onclick="offerDraw()">Offer Draw</button>
        </div>
    </div>

    <div id="board-wrapper">
        <div id="master-timer" class="clock-ui">05:00</div>
        <div id="board"></div>
        <div id="player-timer" class="clock-ui">05:00</div>
    </div>

    <p id="system-msg" style="color:#f1c40f; height: 24px; font-weight: bold; font-size: 1.1rem;"></p>

    <script>
        // --- 1. THE BRAIN: DATA & FIREBASE ---
        const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const masterPool = [
            { name: "Mr. Dotun", title: "Coach", rating: 2150, blunder: 0.15, depth: 2, bio: "The gatekeeper. I will squeeze your position until you find the exit!" },
            { name: "Okeke Isaac", title: "IM", rating: 2210, blunder: 0.12, depth: 3, bio: "The tactical wonder-kid. Isaac plays with youthful energy and lightning speed!" },
            { name: "Bunmi Olape", title: "IM", rating: 2320, blunder: 0.10, depth: 4, bio: "The Professor. IM Bunmi Olape will test your endgame technique and discipline." },
            { name: "Ajibola Olanrewaju", title: "FM", rating: 2335, blunder: 0.08, depth: 5, bio: "The Blitz specialist. He thrives in the chaos of 5-minute chess!" },
            { name: "Oladapo Adu", title: "IM", rating: 2450, blunder: 0.05, depth: 6, bio: "The Veteran King. A powerhouse of Nigerian chess who rarely shows weakness." },
            { name: "Akinseye Abiola", title: "FM", rating: 2380, blunder: 0.07, depth: 6, bio: "Behold the 'Iron Wall.' Break through his defense if you can!" },
            { name: "Odion Aikhoje", title: "IM", rating: 2510, blunder: 0.03, depth: 10, bio: "The Golden Hero of 1998. He is arguably the strongest strategist in the field." },
            { name: "Fola Akintola", title: "Master", rating: 2390, blunder: 0.06, depth: 7, bio: "A fierce attacker who hunts the King from the very first move." },
            { name: "Anwuli Daniel", title: "IM", rating: 2420, blunder: 0.04, depth: 8, bio: "The Speed Demon. He might not be the highest rated today, but he is the fastest!" }
        ];

        // Roster UI
        const rosterDiv = document.getElementById('dynamic-roster');
        rosterDiv.innerHTML = '<p style="border-bottom: 1px solid #333; padding-bottom:5px; color:#27ae60;"><b>OFFICIAL DRAW:</b></p>';
        masterPool.forEach((m, i) => {
            rosterDiv.innerHTML += `<div style="margin: 5px 0;">Round ${i+1}: <b>${m.name}</b> <span class="rating-badge">${m.rating}</span></div>`;
        });

        // --- 2. GAME LOGIC ---
        let board = null, game = new Chess(), currentRound = 0, pTime = 300, mTime = 300, timerInterval;
        let currentPlayerName = "", currentElo = 1500, playerHistory = [];
        const worker = new Worker('chess-worker.js');

        async function initializeTournament() {
            const name = $('#player-name-input').val().trim();
            const pass = $('#player-pass-input').val().trim();
            if (!name || !pass) return alert("Enter Name and Password!");

            // Connect to Firebase Brain
            const docId = name + "_Tournament";
            const docRef = db.collection("leaderboard").doc(docId);
            const doc = await docRef.get();

            if (doc.exists) {
                if (doc.data().password !== pass) return alert("Wrong password!");
                currentElo = doc.data().rating || 1500;
                playerHistory = doc.data().history || [];
            } else {
                await docRef.set({ name: name, password: pass, rating: 1500, history: [], school: "Varsity Cup" });
            }

            currentPlayerName = name;
            $('#display-player-name').text(name);
            $('#display-player-rating').text(currentElo);
            $('#name-overlay').hide();
            showRoundIntro();
        }

        function showRoundIntro() {
            const m = masterPool[currentRound];
            $('#current-name').text(m.name);
            $('#current-title').text(m.title);
            $('#current-rating').text(m.rating);
            $('#round-title').text(`ROUND ${currentRound + 1}`);
            $('#master-name-intro').text(`${m.name} (${m.rating})`);
            $('#master-bio-intro').text(m.bio);
            $('#display-round').text(`${currentRound + 1}/9`);
            $('#intro-overlay').css('display', 'flex');
        }

        function closeIntro() {
            $('#intro-overlay').hide();
            if (!board) {
                board = Chessboard('board', {
                    draggable: true, position: 'start',
                    onDragStart: (s, p) => !game.game_over() && p.search(/^w/) !== -1,
                    onDrop: handleMove,
                    onSnapEnd: () => board.position(game.fen()),
                    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
                });
            } else { board.start(); game.reset(); }
            pTime = 300; mTime = 300;
            startClock();
        }

        function handleMove(source, target) {
            const move = game.move({ from: source, to: target, promotion: 'q' });
            if (!move) return 'snapback';
            
            checkGameOver();
            if (!game.game_over()) {
                $('#system-msg').text("Master is thinking...");
                worker.postMessage("position " + game.fen());
                worker.postMessage("go depth " + masterPool[currentRound].depth);
            }
        }

        worker.onmessage = function(e) {
            if (e.data.indexOf('bestmove') > -1) {
                const moveStr = e.data.split(' ')[1];
                const master = masterPool[currentRound];
                
                setTimeout(() => {
                    // Skill Level Logic from your School Engine
                    if (Math.random() < master.blunder) {
                        const moves = game.moves();
                        game.move(moves[Math.floor(Math.random() * moves.length)]);
                    } else {
                        game.move({ from: moveStr.substring(0,2), to: moveStr.substring(2,4), promotion: 'q' });
                    }
                    board.position(game.fen());
                    $('#system-msg').text("");
                    checkGameOver();
                }, 800);
            }
        };

        async function checkGameOver() {
            if (game.game_over() || pTime <= 0 || mTime <= 0) {
                clearInterval(timerInterval);
                let resultMsg = "";
                let eloChange = 0;

                if (game.in_checkmate()) {
                    if (game.turn() === 'b') { // White won
                        resultMsg = "VICTORY! YOU DEFEATED THE MASTER!";
                        eloChange = 50;
                        currentRound++;
                    } else {
                        resultMsg = "DEFEAT. THE MASTER OUTPLAYED YOU.";
                        eloChange = -20;
                    }
                } else {
                    resultMsg = "DRAW. A RESPECTABLE RESULT.";
                    eloChange = 5;
                }

                currentElo += eloChange;
                $('#display-player-rating').text(currentElo);
                $('#system-msg').text(resultMsg);

                // Update Firebase Brain
                const docId = currentPlayerName + "_Tournament";
                await db.collection("leaderboard").doc(docId).update({ 
                    rating: currentElo, 
                    history: firebase.firestore.FieldValue.arrayUnion(game.pgn()) 
                });

                setTimeout(() => {
                    alert(resultMsg);
                    if (currentRound < masterPool.length) showRoundIntro();
                    else alert("CONGRATULATIONS! YOU ARE THE VARSITY CUP CHAMPION!");
                }, 1000);
            }
        }

        function startClock() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (game.turn() === 'w') pTime--; else mTime--;
                const fmt = (s) => {
                    let mins = Math.floor(Math.max(0, s)/60), secs = Math.max(0, s)%60;
                    return `${mins}:${secs < 10 ? '0'+secs : secs}`;
                };
                $('#master-timer').text(fmt(mTime));
                $('#player-timer').text(fmt(pTime));
                if (pTime <= 0 || mTime <= 0) checkGameOver();
            }, 1000);
        }

        function offerDraw() {
            $('#system-msg').text(`${masterPool[currentRound].name}: "No draws, play to the end!"`);
        }
    </script>
</body>
</html>
