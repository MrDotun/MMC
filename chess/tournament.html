<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇳🇬 Nigerian Masters: Varsity Cup</title>
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        
        /* Ensure the board is visible and centered */
        #board-wrapper { display: flex; justify-content: center; margin: 15px 0; }
        #board { width: 90vw; max-width: 400px; height: auto; border: 2px solid #333; }

        #timer { font-size: 40px; color: #e74c3c; font-weight: bold; font-family: monospace; margin: 10px 0; }
        
        /* Layout for Stats */
        .game-stats { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .info-card { background: #1e2a36; padding: 10px; border-radius: 8px; width: 45%; min-width: 150px; border-top: 4px solid #27ae60; text-align: left; font-size: 14px; }
        .info-card.player { border-top-color: #3498db; }

        /* Buttons */
        .btn { padding: 8px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 5px; font-size: 12px; }
        .draw-btn { background: #f39c12; color: white; width: 100%; }
        
        /* Overlays */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 100; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal { background: #222; padding: 20px; border: 2px solid #27ae60; border-radius: 10px; max-width: 90%; }
        input { padding: 10px; width: 80%; margin-bottom: 10px; border-radius: 4px; border: none; }
    </style>
</head>
<body>

    <div id="name-overlay" class="overlay" style="display: flex;">
        <div class="modal">
            <h2>Varsity Cup Entry</h2>
            <input type="text" id="player-name-input" placeholder="Your Name">
            <button class="btn" style="background:#27ae60; color:white;" onclick="initializeTournament()">ENTER</button>
        </div>
    </div>

    <h3>🇳🇬 Nigerian Masters Varsity Cup</h3>
    <div id="timer">05:00</div>

    <div class="game-stats">
        <div class="info-card player">
            <b id="display-player-name">Student</b><br>
            Rating: <span id="display-player-rating">1500</span><br>
            Pts: <span id="display-player-points">0.0</span>
        </div>
        <div class="info-card">
            <b id="current-name">Mr. Dotun</b><br>
            <span id="current-title">Coach</span><br>
            Rating: <span id="current-rating">2150</span>
            <button class="btn draw-btn" onclick="offerDraw()">Offer Draw</button>
        </div>
    </div>

    <div id="board-wrapper">
        <div id="board"></div>
    </div>

    <p id="system-msg" style="color:#f1c40f; height: 20px;"></p>

    <script>
        // ... (The JavaScript from the previous response remains the same)
        // CRITICAL FIX: Ensure Board initialization is called
        let board = null;
        let game = new Chess();

        function onDrop(source, target) {
            let move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            
            // Trigger Engine
            window.setTimeout(() => {
                worker.postMessage("position startpos moves " + game.history().join(" "));
            }, 250);
        }

        function closeIntro() {
            document.getElementById('intro-overlay').style.display = 'none';
            // Explicitly Initialize Board when the game starts
            if (!board) {
                board = Chessboard('board', {
                    draggable: true,
                    position: 'start',
                    onDrop: onDrop
                });
            } else {
                board.start();
                game.reset();
            }
            startClock();
        }
        
        // ... rest of tournament logic
    </script>
</body>
</html>
