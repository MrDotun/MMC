<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇳🇬 Nigerian Masters: Varsity Cup</title>
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        #board-wrapper { display: flex; justify-content: center; margin: 15px 0; }
        #board { width: 90vw; max-width: 400px; height: auto; border: 2px solid #333; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        /* Highlight for the selected piece */
        .highlight-selected { background-color: rgba(241, 196, 15, 0.5) !important; }

        .timer-row { display: flex; justify-content: center; gap: 15px; margin: 10px 0; }
        .clock-box { background: #1e1e1e; padding: 8px 15px; border-radius: 6px; border: 1px solid #444; min-width: 80px; }
        .clock-label { font-size: 10px; text-transform: uppercase; color: #888; display: block; margin-bottom: 2px; }
        .time-display { font-size: 24px; font-weight: bold; font-family: monospace; color: #bbb; }
        .active-clock { border-color: #e74c3c; box-shadow: 0 0 8px rgba(231, 76, 60, 0.4); }
        .active-clock .time-display { color: #e74c3c; }

        .game-stats { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .info-card { background: #1e2a36; padding: 10px; border-radius: 8px; width: 45%; min-width: 150px; border-top: 4px solid #27ae60; text-align: left; font-size: 14px; box-sizing: border-box; }
        .info-card.player { border-top-color: #3498db; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 5px; }
        .draw-btn { background: #f39c12; color: white; width: 100%; margin-top: 10px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 100; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal { background: #222; padding: 25px; border: 2px solid #27ae60; border-radius: 12px; max-width: 500px; width: 100%; overflow-y: auto; max-height: 90vh; }
        input { padding: 12px; width: 80%; margin-bottom: 15px; border-radius: 4px; border: none; font-size: 16px; }
        .master-list { text-align: left; font-size: 13px; background: #111; padding: 10px; border-radius: 5px; margin: 15px 0; }
        .rating-badge { color: #f1c40f; font-weight: bold; float: right; }
    </style>
</head>
<body>

    <div id="name-overlay" class="overlay" style="display: flex;">
        <div class="modal">
            <h2 style="color:#27ae60; margin-top:0;">🇳🇬 THE VARSITY CUP</h2>
            <div class="master-list" id="dynamic-roster"></div>
            <input type="text" id="player-name-input" placeholder="Enter Your Name">
            <button class="btn" style="background:#27ae60; color:white; width: 80%;" onclick="initializeTournament()">ENTER THE ARENA</button>
        </div>
    </div>

    <div id="intro-overlay" class="overlay">
        <div class="modal">
            <h1 id="round-title">ROUND 1</h1>
            <h2 id="master-name-intro">Master Name</h2>
            <p id="master-bio-intro"></p>
            <button class="btn" style="background:#27ae60; color:white; padding: 15px 30px;" onclick="closeIntro()">BEGIN MATCH</button>
        </div>
    </div>

    <h3>Nigerian Masters Varsity Cup</h3>

    <div class="timer-row">
        <div id="opp-clock-box" class="clock-box">
            <span class="clock-label">Master</span>
            <div id="opp-timer" class="time-display">05:00</div>
        </div>
        <div id="user-clock-box" class="clock-box">
            <span class="clock-label">You</span>
            <div id="user-timer" class="time-display">05:00</div>
        </div>
    </div>

    <div class="game-stats">
        <div class="info-card player">
            <b id="display-player-name">Student</b><br>
            Rating: 1500
        </div>
        <div class="info-card">
            <b id="current-name">Master</b><br>
            Rating: <span id="current-rating">2000</span>
            <button class="btn draw-btn" onclick="offerDraw()">Offer Draw</button>
        </div>
    </div>

    <div id="board-wrapper"><div id="board"></div></div>
    <p id="system-msg" style="color:#f1c40f; height: 20px; font-weight: bold;"></p>

    <script>
        const masterPool = [
            { name: "Mr. Dotun", title: "Coach", rating: 2150, blunder: 0.45, bio: "Welcome to the Grinder." },
            { name: "Okeke Isaac", title: "IM", rating: 2210, blunder: 0.35, bio: "Tactical wonder-kid." },
            { name: "Bunmi Olape", title: "IM", rating: 2320, blunder: 0.30, bio: "The Professor." }
        ];

        let Masters = masterPool.sort(() => 0.5 - Math.random());
        let board = null, game = new Chess(), currentRound = 0, timerInterval;
        let pTime = 300, oTime = 300, turn = 'w';
        let sourceSquare = null; 

        const worker = new Worker('chess-worker.js');

        function initializeTournament() {
            const name = document.getElementById('player-name-input').value.trim();
            if (name) document.getElementById('display-player-name').innerText = name;
            document.getElementById('name-overlay').style.display = 'none';
            showRoundIntro();
        }

        function showRoundIntro() {
            const m = Masters[currentRound];
            document.getElementById('current-name').innerText = m.name;
            document.getElementById('current-rating').innerText = m.rating;
            document.getElementById('intro-overlay').style.display = 'flex';
        }

        function closeIntro() {
            document.getElementById('intro-overlay').style.display = 'none';
            const cfg = {
                draggable: false, // DRAG DISABLED
                position: 'start',
                onSquareClick: onSquareClick, // CLICK ENABLED
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            if (!board) board = Chessboard('board', cfg);
            else { board.start(); game.reset(); }
            
            pTime = 300; oTime = 300; turn = 'w';
            updateClockUI();
            startClock();
        }

        // Handle Click Logic
        function onSquareClick(square) {
            // Prevent clicks if it's the Master's turn
            if (turn !== 'w') return;

            // 1. Selecting a piece
            if (sourceSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    highlightSquare(square);
                }
                return;
            }

            // 2. Attempting a move
            const move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
            
            // Cleanup highlights
            removeHighlights();

            if (move === null) {
                // If clicked another of your own pieces, switch selection
                const piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    highlightSquare(square);
                } else {
                    sourceSquare = null;
                }
                return;
            }

            // 3. Move successful
            sourceSquare = null;
            board.position(game.fen());
            turn = 'b';
            updateClockUI();
            window.setTimeout(triggerMaster, 500);
        }

        function highlightSquare(square) {
            $('#board .square-' + square).addClass('highlight-selected');
        }

        function removeHighlights() {
            $('#board .square-55d6').removeClass('highlight-selected');
        }

        function triggerMaster() {
            worker.postMessage("position startpos moves " + game.history().join(" "));
        }

        worker.onmessage = function(e) {
            const bestMove = e.data;
            game.move({ from: bestMove.substring(0,2), to: bestMove.substring(2,4), promotion: 'q' });
            board.position(game.fen());
            turn = 'w';
            updateClockUI();
        };

        function startClock() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (turn === 'w') pTime--; else oTime--;
                updateClockUI();
                if (pTime <= 0 || oTime <= 0) clearInterval(timerInterval);
            }, 1000);
        }

        function updateClockUI() {
            const fmt = (s) => {
                let m = Math.floor(s / 60), secs = s % 60;
                return `${m}:${secs < 10 ? '0'+secs : secs}`;
            };
            document.getElementById('user-timer').innerText = fmt(pTime);
            document.getElementById('opp-timer').innerText = fmt(oTime);
            document.getElementById('user-clock-box').classList.toggle('active-clock', turn === 'w');
            document.getElementById('opp-clock-box').classList.toggle('active-clock', turn === 'b');
        }

        function offerDraw() {
            document.getElementById('system-msg').innerText = "Master: No draws allowed!";
        }
    </script>
</body>
</html>
