<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecobank Pre Tournament 2026 - Decipher Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;}
        #welcome-overlay { position: absolute; width: 100%; min-height: 100vh; background: #0f172a; display: flex; flex-direction: column; align-items: center; z-index: 1000; padding: 20px 0; }
        
        /* Matchmaking Animation */
        #matchmaking-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 1500; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #334155; border-top: 5px solid #005aab; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-bar { width: 200px; height: 4px; background: #334155; border-radius: 2px; margin-top: 15px; overflow: hidden; }
        .loading-progress { width: 0%; height: 100%; background: #4ade80; transition: width 0.5s; }

        .login-card { background: #1e293b; padding: 25px; border-radius: 15px; border: 2px solid #005aab; width: 90%; max-width: 400px; text-align: center; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-card input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        
        #game-container { display: none; width: 95vmin; max-width: 500px; padding: 20px 10px; }
        #board, #replay-board { width: 100%; border: 3px solid #005aab; border-radius: 8px; }
        .info-panel { background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #005aab; text-align: center; }
        .submit-btn { background: #005aab; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        
        .opp-card { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #ef4444; }
        .league-table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        .league-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        #replay-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        .ctrl-btn { flex: 1; padding: 15px; border: none; border-radius: 8px; background: #334155; color: white; cursor: pointer; font-weight: bold; }
        .highlight-white { background: rgba(0, 90, 171, 0.5) !important; }
    </style>
</head>
<body>

<div id="matchmaking-overlay">
    <div class="spinner"></div>
    <h2 id="match-status">Searching for Live Opponent...</h2>
    <p id="match-details" style="color: #94a3b8;">Connecting to Ecobank Tournament Servers</p>
    <div class="loading-bar"><div class="loading-progress" id="load-bar"></div></div>
</div>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #005aab; margin: 0;">ECOBANK</h1>
        <h3 style="margin: 0 0 15px 0; color: #94a3b8;">Pre Tournament 2026</h3>
        <input type="text" id="studentName" placeholder="Full Name">
        <input type="text" id="studentClass" placeholder="Class">
        <input type="password" id="studentPass" placeholder="Secret Password">
        <button class="submit-btn" onclick="startMatchmaking()">ENTER ARENA</button>
    </div>

    <div style="width: 90%; max-width: 400px; background: #1e293b; padding: 15px; border-radius: 12px;">
        <h3 style="text-align: center; color: #4ade80; margin-top:0;">🏆 Global Leaderboard</h3>
        <table class="league-table"><tbody id="player-body"></tbody></table>
        <button class="submit-btn" style="background:#334155; margin-top:20px;" onclick="openCoachPortal()">Coach Portal</button>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <div class="opp-card">
            <div style="text-align: left;"><b id="opp-name" style="color:#ef4444">Connecting...</b><br><small id="opp-school">Searching School</small></div>
            <div style="font-family: monospace; color: #ef4444;">LIVE</div>
        </div>
        <div id="board"></div>
        <div class="opp-card" style="border-left: 4px solid #4ade80; margin-top: 10px;">
            <div style="text-align: left;"><b id="displayName" style="color:#4ade80"></b><br><small>Maryland Convent</small></div>
        </div>
        <p id="remark">Maintain your pawn structure!</p>
        <div id="status" style="font-weight: bold; margin-bottom: 10px;">Waiting...</div>
        <button class="submit-btn" onclick="location.reload()" style="background: #334155;">QUIT MATCH</button>
    </div>
</div>

<div id="replay-overlay">
    <h2 id="replay-user-title" style="color:#4ade80"></h2>
    <div id="replay-board" style="width: 90vmin; max-width: 400px;"></div>
    <div style="display: flex; gap: 10px; margin-top: 20px; width: 90%; max-width: 400px;">
        <button class="ctrl-btn" onclick="stepReplay(-1)">BACK</button>
        <button class="ctrl-btn" onclick="stepReplay(1)">NEXT</button>
    </div>
    <button class="submit-btn" onclick="$('#replay-overlay').hide()" style="max-width: 400px; margin-top:20px; background:#ef4444;">CLOSE ARCHIVE</button>
    <div id="teacher-data" style="margin-top: 20px; width: 90%; max-width: 400px; max-height: 200px; overflow-y: auto;">
        <table class="league-table"><tbody id="teacher-body"></tbody></table>
    </div>
</div>

<script>
const chessWorker = new Worker('./chess-worker.js');
const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

var game = new Chess(), board = null, sourceSquare = null;
var currentName = "", docId = "", currentRating = 1000, currentRound = 1;
var replayGame = new Chess(), replayBoard = null, replayHistory = [], replayIndex = -1;

const nigerianNames = ["Tunde Balogun", "Chidi Okafor", "Emeka Nwosu", "Amina Yusuf", "Femi Adebayo", "Ngozi Bello", "Kelechi Iheanacho", "Folake Adenuga"];
const nigerianSchools = ["Lekki British School", "Grange School", "Corona Secondary", "Atlantic Hall", "Chrisland College", "British Int'l School"];

function initLeagues() {
    db.collection("leaderboard").onSnapshot((snap) => {
        let players = []; snap.forEach(doc => players.push(doc.data()));
        players.sort((a, b) => b.rating - a.rating);
        let pHTML = "";
        players.slice(0, 8).forEach((p, i) => {
            pHTML += `<tr><td><b>${i+1}. ${p.name}</b></td><td style="text-align:right">${p.rating}</td></tr>`;
        });
        $('#player-body').html(pHTML);
    });
}
initLeagues();

function startMatchmaking() {
    currentName = $('#studentName').val().trim();
    if (!currentName || !$('#studentPass').val()) return alert("Fill all fields!");
    
    $('#welcome-overlay').hide();
    $('#matchmaking-overlay').css('display', 'flex');
    
    let progress = 0;
    let interval = setInterval(() => {
        progress += Math.random() * 15;
        $('#load-bar').css('width', progress + '%');
        
        if (progress > 30) $('#match-status').text("Finding Match...");
        if (progress > 60) $('#match-status').text("Opponent Found! Connecting...");
        
        if (progress >= 100) {
            clearInterval(interval);
            setupMatch();
        }
    }, 400);
}

async function setupMatch() {
    const pass = $('#studentPass').val().trim();
    docId = currentName.replace(/\s+/g, '_') + "_" + $('#studentClass').val();
    const docRef = db.collection("leaderboard").doc(docId);
    const doc = await docRef.get();
    
    if (doc.exists && doc.data().password !== pass) return alert("Wrong password!");
    if (!doc.exists) await docRef.set({ name: currentName, password: pass, rating: 1000, round: 1, lastPGN: "" });

    const oppName = nigerianNames[Math.floor(Math.random() * nigerianNames.length)];
    const oppSch = nigerianSchools[Math.floor(Math.random() * nigerianSchools.length)];
    
    $('#opp-name').text(oppName);
    $('#opp-school').text(oppSch);
    $('#displayName').text(currentName);
    
    $('#matchmaking-overlay').hide();
    $('#game-container').show();
    board.resize();
    $('#status').text("Match Started. Your turn!");
}

async function openCoachPortal() {
    const code = prompt("Coach Access Code:");
    if (code !== "decipher1234") return alert("Denied");
    $('#replay-user-title').text("Student Archives");
    $('#replay-overlay').css('display', 'flex');
    replayBoard.resize();
    
    const snap = await db.collection("leaderboard").get();
    let html = "";
    snap.forEach(doc => {
        const d = doc.data();
        html += `<tr><td>${d.name}</td><td><button class="submit-btn" style="padding:5px; margin:0;" onclick='viewArchive("${d.name}", ${JSON.stringify(d.lastPGN)})'>Review</button></td></tr>`;
    });
    $('#teacher-body').html(html);
}

function viewArchive(name, pgn) {
    if (!pgn) return alert("Empty game.");
    replayGame.load_pgn(pgn);
    replayHistory = replayGame.history();
    replayGame.reset();
    replayIndex = -1;
    replayBoard.position('start');
    $('#replay-user-title').text("Reviewing: " + name);
}

function stepReplay(dir) {
    if (dir === 1 && replayIndex < replayHistory.length - 1) {
        replayIndex++; replayGame.move(replayHistory[replayIndex]);
    } else if (dir === -1 && replayIndex >= 0) {
        replayGame.undo(); replayIndex--;
    }
    replayBoard.position(replayGame.fen());
}

chessWorker.onmessage = function(e) {
    game.move({ from: e.data.substring(0, 2), to: e.data.substring(2, 4), promotion: 'q' });
    board.position(game.fen());
    db.collection("leaderboard").doc(docId).update({ lastPGN: game.pgn() });
    $('#status').text("Your turn!");
};

function onSquareClick(sq) {
    if (game.game_over()) return;
    if (!sourceSquare) {
        let p = game.get(sq);
        if (p && p.color === 'w') { sourceSquare = sq; $('.square-' + sq).addClass('highlight-white'); }
        return;
    }
    let m = game.move({ from: sourceSquare, to: sq, promotion: 'q' });
    $('.highlight-white').removeClass('highlight-white');
    sourceSquare = null;
    if (!m) return;
    
    board.position(game.fen());
    db.collection("leaderboard").doc(docId).update({ lastPGN: game.pgn() });
    
    $('#status').text("Opponent is thinking...");
    // Human-like delay: 1.5 to 4 seconds
    setTimeout(() => {
        chessWorker.postMessage("search 2");
        chessWorker.postMessage("position " + game.fen());
    }, 1500 + Math.random() * 2500);
}

board = ChessBoard('board', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
replayBoard = ChessBoard('replay-board', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
$('#board').on('click', '[class*="square-"]', function() { onSquareClick($(this).attr('data-square')); });
$(window).resize(() => { board.resize(); replayBoard.resize(); });
</script>
</body>
</html>
