<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decipher Chess - Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; }
        #welcome-overlay { position: fixed; inset: 0; background: #1a1a2e; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: #2D1B4D; padding: 30px; border-radius: 15px; border: 2px solid #4ade80; width: 85%; max-width: 400px; text-align: center; }
        .login-card input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #4ade80; background: #1a1a2e; color: white; box-sizing: border-box; }
        #game-container { display: none; width: 95vmin; max-width: 500px; padding: 20px 10px; }
        #board { width: 100%; border: 2px solid #4ade80; }
        .info-panel { background: #2D1B4D; padding: 15px; border-radius: 12px; border: 1px solid #4ade80; }
        .submit-btn { background: #4ade80; color: #1a1a2e; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        .grade { font-size: 1.2em; font-weight: bold; color: #4ade80; }
        #status { color: #cbd5e1; font-size: 0.9em; margin-top: 10px; font-weight: bold; }
        #remark { color: #ff4d4d; font-weight: bold; font-style: italic; margin: 10px 0; }
        .highlight-white { background: rgba(255, 255, 0, 0.5) !important; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80;">Decipher Chess</h1>
        <input type="text" id="studentName" placeholder="Full Name">
        <input type="text" id="studentClass" placeholder="Class">
        <button class="submit-btn" onclick="startGame()">ENTER ARENA</button>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h3><span id="displayName" style="color:#4ade80"></span> vs Mr. Dotun</h3>
        <div id="board"></div>
        <p id="remark">"I hope you've been practicing."</p>
        <p>Rank: <span id="grade" class="grade">Beginner</span></p>
        <div id="status">Your turn! Select a piece.</div>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfduqoEyvRko9-TM2T1SU0WVkr2vCdg2sFPZUTtQLOwSnJbBA/viewform" class="submit-btn" style="text-decoration:none; display:block; text-align:center;">SUBMIT SCORE</a>
    </div>
</div>

<script>
// Call the worker using a relative path so the phone finds it perfectly
const chessWorker = new Worker('./chess-worker.js');

const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

var game = new Chess(), board = null, sourceSquare = null, currentName = "", currentClass = "";

// Listen for Garbo's move
chessWorker.onmessage = function(e) {
    let moveString = e.data; // e.g. "e2e4"
    let source = moveString.substring(0, 2);
    let target = moveString.substring(2, 4);
    let promo = moveString.length > 4 ? moveString.charAt(4) : 'q';
    
    game.move({ from: source, to: target, promotion: promo });
    board.position(game.fen());
    updateStatus();
};

function startGame() {
    currentName = $('#studentName').val();
    currentClass = $('#studentClass').val();
    if (!currentName || !currentClass) return alert("Enter details!");
    $('#displayName').text(currentName);
    $('#welcome-overlay').hide();
    $('#game-container').show();
    board.resize();
}

function makeAIMove() {
    if (game.game_over()) return;
    $('#status').text("Mr. Dotun is analyzing millions of possibilities...");
    // Send the FEN directly to our new Garbo worker
    chessWorker.postMessage(game.fen());
}

function updateStatus() {
    if (game.in_checkmate()) {
        $('#status').text(game.turn() === 'b' ? "VICTORY!" : "CHECKMATE! Mr. Dotun wins.");
    } else {
        $('#status').text("Your turn!");
    }
}

function onSquareClick(square) {
    if (game.game_over()) return;
    if (!sourceSquare) {
        let p = game.get(square);
        if (p && p.color === 'w') { sourceSquare = square; $('.square-' + square).addClass('highlight-white'); }
        return;
    }
    let m = game.move({ from: sourceSquare, to: square, promotion: 'q' });
    $('.highlight-white').removeClass('highlight-white');
    sourceSquare = null;
    if (!m) return;
    board.position(game.fen());
    makeAIMove();
}

board = ChessBoard('board', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
$('#board').on('click', '[class*="square-"]', function() { onSquareClick($(this).attr('data-square')); });
$(window).resize(() => board.resize());
</script>
</body>
</html>
