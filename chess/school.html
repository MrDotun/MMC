<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decipher Chess Academy League</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; }
        #welcome-overlay { position: absolute; width: 100%; min-height: 100vh; background: #0f172a; display: flex; flex-direction: column; align-items: center; z-index: 1000; padding: 20px 0; overflow-y: auto; }
        .login-card { background: #1e293b; padding: 25px; border-radius: 15px; border: 2px solid #4ade80; width: 90%; max-width: 400px; text-align: center; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-card input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .league-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 95%; max-width: 1000px; margin-bottom: 30px; }
        .table-container { background: #1e293b; border-radius: 15px; border: 1px solid #334155; padding: 15px; flex: 1; min-width: 320px; }
        .league-table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        .league-table th { color: #4ade80; border-bottom: 2px solid #334155; padding: 10px; text-align: left; }
        .league-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .rank-1 { color: #fbbf24; font-weight: bold; background: rgba(251, 191, 36, 0.05); }
        #teacher-section { width: 95%; max-width: 1000px; margin-top: 50px; padding: 20px; border-top: 1px dashed #334155; text-align: center; margin-bottom: 100px;}
        #teacher-data { display: none; margin-top: 20px; background: #020617; border-radius: 10px; padding: 20px; overflow-x: auto; }
        .teacher-btn { background: none; border: 1px solid #334155; color: #64748b; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 0.8em; }
        .teacher-btn:hover { color: #4ade80; border-color: #4ade80; }
        .reset-btn { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        #game-container { display: none; width: 95vmin; max-width: 500px; padding: 20px 10px; }
        #board { width: 100%; border: 3px solid #4ade80; border-radius: 8px; }
        .info-panel { background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #4ade80; text-align: center; }
        .submit-btn { background: #4ade80; color: #0f172a; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 1.1em; }
        .grade-text { font-size: 1.3em; font-weight: bold; color: #4ade80; margin: 5px 0; }
        #remark { color: #f87171; font-weight: bold; font-style: italic; min-height: 1.5em; margin: 10px 0; }
        .school-tag { font-size: 0.75em; color: #94a3b8; display: block; }
        .highlight-white { background: rgba(251, 191, 36, 0.5) !important; }
        .view-pgn-btn { background: #334155; color: #4ade80; border: 1px solid #4ade80; padding: 2px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; margin-left: 5px; }
        .play-again-btn { background: #fbbf24; color: #0f172a; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; display: none;}
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80; margin: 0 0 15px 0;">Decipher Chess</h1>
        <input type="text" id="studentName" placeholder="Full Name">
        <input type="text" id="studentClass" placeholder="Class (e.g. Year 5)">
        <input type="text" id="studentSchool" placeholder="School Name">
        <input type="password" id="studentPass" placeholder="Secret Password">
        <button class="submit-btn" onclick="startGame()">JOIN COMPETITION</button>
    </div>
    <div class="league-grid">
        <div class="table-container">
            <h3 style="text-align: center; color: #4ade80; margin-top: 0;">🏆 Top Players</h3>
            <table class="league-table">
                <thead><tr><th>Player</th><th>Class</th><th style="text-align: right;">Elo</th></tr></thead>
                <tbody id="player-body"></tbody>
            </table>
        </div>
        <div class="table-container">
            <h3 style="text-align: center; color: #4ade80; margin-top: 0;">🏫 School League</h3>
            <table class="league-table">
                <thead><tr><th>School Name</th><th style="text-align: right;">Total Points</th></tr></thead>
                <tbody id="school-body"></tbody>
            </table>
        </div>
    </div>
    <div id="teacher-section">
        <button class="teacher-btn" onclick="openTeacherDashboard()">Teacher Dashboard</button>
        <div id="teacher-data">
            <button class="reset-btn" onclick="resetSeason()">⚠️ RESET ALL SCORES TO 1500</button>
            <h3 style="color: #4ade80;">Full Student Masterlist</h3>
            <table class="league-table" style="font-size: 0.75em;">
                <thead><tr><th>Name</th><th>School</th><th>Class</th><th>Password</th><th>Elo / History (5)</th></tr></thead>
                <tbody id="teacher-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h3 style="margin: 0;"><span id="displayName" style="color:#4ade80"></span></h3>
        <span id="displaySchool" style="color:#94a3b8; font-size:0.9em;"></span>
        <div id="board" style="margin-top:15px;"></div>
        <p id="remark">Play your best move!</p>
        <div class="grade-text" id="grade">...</div>
        <div id="status" style="margin-bottom: 15px; font-weight: bold;">Your turn!</div>
        <button id="playAgainBtn" class="play-again-btn" onclick="resetGame()">PLAY AGAIN</button>
        <button class="submit-btn" onclick="location.reload()" style="background: #334155; color: white;">LOGOUT</button>
    </div>
</div>

<script>
const chessWorker = new Worker('./chess-worker.js');
const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

var game = new Chess(), board = null, sourceSquare = null;
var currentName = "", currentClass = "", currentSchool = "", docId = "", currentRating = 1500;
var gameHistory = []; 
var playerColor = 'w';

function getTitle(r) {
    if (r >= 2700) return '👑 <span style="color: red;">Grandmaster</span>';
    if (r >= 2400) return '👑 <span style="color: red;">International Master</span>';
    if (r >= 2000) return '👑 <span style="color: red;">FIDE Master</span>';
    if (r >= 1700) return '👑 <span style="color: red;">Candidate Master</span>';
    return ""; 
}

function initLeagues() {
    db.collection("leaderboard").onSnapshot((snap) => {
        let rawPlayers = [];
        let schools = {};
        
        snap.forEach(doc => {
            try {
                const d = doc.data();
                if (d.name && d.rating !== undefined) {
                    rawPlayers.push(d);
                    const sName = d.school || "Independent";
                    schools[sName] = (schools[sName] || 0) + Number(d.rating);
                }
            } catch (e) { console.error("Error processing document:", e); }
        });

        rawPlayers.sort((a, b) => Number(b.rating) - Number(a.rating));
        let players = [];
        let seenNames = new Set();

        rawPlayers.forEach(p => {
            let nameKey = p.name.toLowerCase().trim();
            if (!seenNames.has(nameKey)) {
                players.push(p);
                seenNames.add(nameKey);
            }
        });
        
        let pHTML = "";
        players.slice(0, 20).forEach((p, i) => {
            let title = getTitle(p.rating);
            let prefix = title ? title + " " : "";
            let label = (i + 1) + ". ";
            pHTML += `<tr class="${i === 0 ? 'rank-1' : ''}"><td><b>${label}${prefix}${p.name}</b><span class="school-tag">${p.school || 'Independent'}</span></td><td>${p.class}</td><td style="text-align:right">${p.rating}</td></tr>`;
        });
        $('#player-body').html(pHTML || "<tr><td colspan='3'>No players found</td></tr>");

        let sSorted = Object.keys(schools).map(name => ({name, pts: schools[name]})).sort((a,b) => b.pts - a.pts);
        let sHTML = "";
        sSorted.slice(0, 5).forEach((s, i) => {
            sHTML += `<tr class="${i === 0 ? 'rank-1' : ''}"><td>${i === 0 ? '🏆 ' : (i + 1) + '. '}${s.name}</td><td style="text-align:right;">${s.pts.toLocaleString()}</td></tr>`;
        });
        $('#school-body').html(sHTML || "<tr><td colspan='2'>No schools found</td></tr>");
    });
}
initLeagues();

async function openTeacherDashboard() {
    const code = prompt("Enter Teacher Access Code:");
    if (code !== "decipher1234") return alert("Unauthorized Access!");
    $('#teacher-data').show();
    refreshMasterlist();
}

async function refreshMasterlist() {
    const snap = await db.collection("leaderboard").orderBy("name", "asc").get();
    let html = "";
    snap.forEach(doc => {
        try {
            const d = doc.data();
            let historyString = "";
            if (d.history && Array.isArray(d.history)) {
                d.history.forEach((pgn, idx) => {
                    if (pgn) {
                        // Formatting for prompt copy-paste
                        historyString += `GAME ${idx + 1}: ${pgn.replace(/\n/g, " ")}\\n\\n`;
                    }
                });
            }
            html += `<tr><td>${d.name}</td><td>${d.school}</td><td>${d.class}</td><td style="color:#4ade80">${d.password}</td><td>${d.rating} <button class="view-pgn-btn" onclick="window.prompt('Copy Player History:', '${historyString}')">VIEW HISTORY</button></td></tr>`;
        } catch (e) { console.error("Masterlist error:", e); }
    });
    $('#teacher-body').html(html || "<tr><td colspan='5'>No students found.</td></tr>");
}

async function resetSeason() {
    if(!confirm("Are you sure?")) return;
    const snap = await db.collection("leaderboard").get();
    const batch = db.batch();
    snap.forEach(doc => { batch.update(doc.ref, { rating: 1500, history: [] }); });
    await batch.commit();
    alert("Reset Complete!");
    refreshMasterlist();
}

async function startGame() {
    currentName = $('#studentName').val().trim();
    currentClass = $('#studentClass').val().trim();
    let rawSchool = $('#studentSchool').val().trim();
    const pass = $('#studentPass').val().trim();

    if (rawSchool.toUpperCase().startsWith('M')) { currentSchool = "Maryland Convent"; }
    else if (rawSchool.toUpperCase().startsWith('E')) { currentSchool = "Emerald School"; }
    else { currentSchool = rawSchool; }

    if (!currentName || !currentClass || !currentSchool || !pass) return alert("Fill all fields!");
    
    let choice = prompt("Choose your side: Type 'White' or 'Black'").toLowerCase();
    playerColor = (choice === 'black' || choice === 'b') ? 'b' : 'w';
    
    docId = currentName + "_" + currentClass;
    const docRef = db.collection("leaderboard").doc(docId);
    try {
        const doc = await docRef.get();
        if (doc.exists) {
            if (doc.data().password !== pass) return alert("Wrong password!");
            currentRating = Number(doc.data().rating) || 1500;
            gameHistory = doc.data().history || [];
            if(doc.data().school !== currentSchool) await docRef.update({ school: currentSchool });
        } else {
            currentRating = 1500;
            await docRef.set({ name: currentName, class: currentClass, school: currentSchool, password: pass, rating: 1500, history: [] });
        }
        $('#displayName').text(currentName);
        $('#displaySchool').text(currentSchool);
        
        let title = getTitle(currentRating);
        $('#grade').html((title ? title + " " : "") + "(" + currentRating + ")");
        
        $('#welcome-overlay').hide();
        $('#game-container').show();
        board.orientation(playerColor === 'w' ? 'white' : 'black');
        board.resize();
        if (playerColor === 'b') { makeAiMove(); }
    } catch (e) { alert("Error: " + e.message); }
}

function resetGame() {
    game = new Chess();
    board.position('start');
    $('#playAgainBtn').hide();
    $('#remark').text("Play your best move!");
    $('#status').text("Your turn!");
    let choice = prompt("Choose your side for this game: Type 'White' or 'Black'").toLowerCase();
    playerColor = (choice === 'black' || choice === 'b') ? 'b' : 'w';
    board.orientation(playerColor === 'w' ? 'white' : 'black');
    if (playerColor === 'b') { makeAiMove(); }
}

async function updateStatus() {
    if (game.game_over()) {
        let change = 0, msg = "";
        if (game.in_checkmate()) {
            if (game.turn() !== playerColor) { 
                change = Math.floor(Math.random() * (50 - 40 + 1)) + 40;
                msg = `VICTORY! +${change} Elo!`; 
            } else { 
                change = -(Math.floor(Math.random() * (35 - 30 + 1)) + 30);
                msg = `DEFEAT! ${change} Elo.`; 
            }
        } else { 
            msg = "DRAW! +0 Elo."; 
            change = 0; 
        }
        currentRating = Math.max(1000, currentRating + change);
        const pgn = game.pgn();
        gameHistory.unshift(pgn);
        await db.collection("leaderboard").doc(docId).update({ rating: currentRating, history: gameHistory.slice(0, 5) });
        
        $('#playAgainBtn').show();
        let title = getTitle(currentRating);
        $('#grade').html((title ? title + " " : "") + "(" + currentRating + ")");
        
        setTimeout(() => {
            alert(msg);
            window.prompt("Copy PGN to Clipboard:", pgn);
        }, 300);
    } else {
        $('#status').text(game.turn() === playerColor ? "Your turn!" : "AI is thinking...");
    }
}

chessWorker.onmessage = function(e) {
    game.move({ from: e.data.substring(0, 2), to: e.data.substring(2, 4), promotion: 'q' });
    board.position(game.fen());
    updateStatus();
};

function makeAiMove() {
    if (game.game_over()) return;
    $('#status').text("Decipher Chess is analyzing...");
    setTimeout(() => {
        let moves = game.moves({ verbose: true });
        // Blunder rate set to 10%
        if (Math.random() < 0.10 && moves.length > 0) {
            let safeBlunders = moves.filter(m => m.piece !== 'q' && m.piece !== 'r');
            let finalMove = safeBlunders.length > 0 ? safeBlunders[Math.floor(Math.random() * safeBlunders.length)] : moves[Math.floor(Math.random() * moves.length)];
            game.move(finalMove);
            board.position(game.fen());
            updateStatus();
            return;
        }
        chessWorker.postMessage("position " + game.fen());
        chessWorker.postMessage("go depth 0.9");
    }, 1200);
}

function onSquareClick(sq) {
    if (game.game_over() || game.turn() !== playerColor) return;
    if (!sourceSquare) {
        let p = game.get(sq);
        if (p && p.color === playerColor) { sourceSquare = sq; $('.square-' + sq).addClass('highlight-white'); }
        return;
    }
    let m = game.move({ from: sourceSquare, to: sq, promotion: 'q' });
    $('.highlight-white').removeClass('highlight-white');
    sourceSquare = null;
    if (!m) { $('#remark').text("Illegal move!"); return; }
    $('#remark').text("");
    board.position(game.fen());
    updateStatus();
    if (!game.game_over()) makeAiMove();
}

board = ChessBoard('board', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
$('#board').on('click', '[class*="square-"]', function() { onSquareClick($(this).attr('data-square')); });
$(window).resize(() => board.resize());
</script>
</body>
</html>
