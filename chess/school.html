<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decipher Chess Academy</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; }
        
        /* --- WELCOME PAGE & LEADERBOARD --- */
        #welcome-overlay { position: absolute; width: 100%; min-height: 100vh; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; z-index: 1000; padding: 20px 0; overflow-y: auto; }
        .login-card { background: #2D1B4D; padding: 25px; border-radius: 15px; border: 2px solid #4ade80; width: 85%; max-width: 400px; text-align: center; margin-bottom: 20px; }
        .login-card input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #4ade80; background: #1a1a2e; color: white; box-sizing: border-box; }
        
        /* --- GAME UI --- */
        #game-container { display: none; width: 95vmin; max-width: 500px; padding: 20px 10px; }
        #board { width: 100%; border: 2px solid #4ade80; border-radius: 8px; overflow: hidden; }
        .info-panel { background: #2D1B4D; padding: 15px; border-radius: 12px; border: 1px solid #4ade80; text-align: center; }
        
        /* --- BUTTONS & TEXT --- */
        .submit-btn { background: #4ade80; color: #1a1a2e; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 1.1em; }
        .grade { font-size: 1.2em; font-weight: bold; color: #4ade80; }
        #remark { color: #ff4d4d; font-weight: bold; font-style: italic; min-height: 1.5em; margin: 10px 0; }
        
        /* --- LEADERBOARD TABLE --- */
        .leaderboard-container { width: 85%; max-width: 400px; background: #2D1B4D; border-radius: 15px; border: 1px solid #4ade80; padding: 15px; }
        .leaderboard-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        .leaderboard-table th { color: #4ade80; border-bottom: 2px solid #4ade80; padding: 10px; text-align: left; }
        .leaderboard-table td { padding: 10px; border-bottom: 1px solid rgba(74, 222, 128, 0.1); }
        .rank-1 { color: #ffd700; font-weight: bold; background: rgba(255, 215, 0, 0.1); }
        .rank-2 { color: #c0c0c0; font-weight: bold; }
        .rank-3 { color: #cd7f32; font-weight: bold; }
        .highlight-white { background: rgba(255, 255, 0, 0.4) !important; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80; margin-top: 0;">Decipher Chess</h1>
        <input type="text" id="studentName" placeholder="Full Name">
        <input type="text" id="studentClass" placeholder="Class (e.g. Year 4)">
        <input type="password" id="studentPass" placeholder="Secret Password">
        <button class="submit-btn" onclick="startGame()">ENTER ARENA</button>
    </div>

    <div class="leaderboard-container">
        <h3 style="text-align: center; color: #4ade80; margin-top: 0;">Academy Wall of Fame</h3>
        <table class="leaderboard-table">
            <thead>
                <tr><th>Name</th><th>Class</th><th>Elo</th></tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr><td colspan="3" style="text-align:center">Fetching Champions...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h3 style="margin: 0 0 10px 0;"><span id="displayName" style="color:#4ade80"></span> vs Mr. Dotun</h3>
        <div id="board"></div>
        <p id="remark">Good luck!</p>
        <p>Rank: <span id="grade" class="grade">Calculating...</span></p>
        <div id="status" style="margin-bottom: 15px;">Your turn!</div>
        <button class="submit-btn" onclick="location.reload()" style="background: #3b82f6; color: white;">NEW GAME / LOGOUT</button>
    </div>
</div>

<script>
// --- CONFIG ---
const chessWorker = new Worker('./chess-worker.js');
const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

var game = new Chess(), board = null, sourceSquare = null;
var currentName = "", currentClass = "", docId = "", currentRating = 1000;

// --- 1. START LEADERBOARD WITH MEDALS ---
function initLeaderboard() {
    db.collection("leaderboard").orderBy("rating", "desc").limit(10).onSnapshot((snap) => {
        let html = "";
        snap.forEach((doc, i) => {
            const d = doc.data();
            let medal = "";
            let rankClass = "";
            
            if (i === 0) { medal = "🥇 "; rankClass = "rank-1"; }
            else if (i === 1) { medal = "🥈 "; rankClass = "rank-2"; }
            else if (i === 2) { medal = "🥉 "; rankClass = "rank-3"; }

            html += `<tr class="${rankClass}">
                <td>${medal}${d.name}</td>
                <td>${d.class}</td>
                <td>${d.rating}</td>
            </tr>`;
        });
        $('#leaderboard-body').html(html || "<tr><td colspan='3'>No players yet</td></tr>");
    });
}
initLeaderboard();

function getTitle(r) {
    if (r < 1200) return "Beginner";
    if (r < 1600) return "Intermediate";
    if (r < 2000) return "Advanced";
    return "Grandmaster";
}

// --- 2. LOGIN LOGIC ---
async function startGame() {
    currentName = $('#studentName').val().trim();
    currentClass = $('#studentClass').val().trim();
    const pass = $('#studentPass').val().trim();
    
    if (!currentName || !currentClass || !pass) return alert("Please fill all fields!");

    docId = currentName + "_" + currentClass;
    const docRef = db.collection("leaderboard").doc(docId);
    
    try {
        const doc = await docRef.get();
        if (doc.exists) {
            if (doc.data().password !== pass) return alert("Wrong password for this name!");
            currentRating = doc.data().rating;
        } else {
            currentRating = 1000;
            await docRef.set({ name: currentName, class: currentClass, password: pass, rating: 1000, games: 0 });
        }

        $('#displayName').text(currentName);
        $('#grade').text(getTitle(currentRating) + " (" + currentRating + ")");
        $('#welcome-overlay').hide();
        $('#game-container').show();
        board.resize();
    } catch (e) { alert("Error connecting: " + e.message); }
}

// --- 3. RATING UPDATE LOGIC ---
async function updateStatus() {
    if (game.game_over()) {
        let change = 0, msg = "";
        if (game.in_checkmate()) {
            if (game.turn() === 'b') { msg = "VICTORY! +200 Elo!"; change = 200; }
            else { msg = "DEFEAT! -10 Elo."; change = -10; }
        } else { msg = "DRAW! +50 Elo."; change = 50; }

        currentRating = Math.max(1000, currentRating + change);
        $('#grade').text(getTitle(currentRating) + " (" + currentRating + ")");
        
        await db.collection("leaderboard").doc(docId).update({ 
            rating: currentRating, 
            lastPlayed: firebase.firestore.Timestamp.now()
        });
        
        setTimeout(() => alert(msg + "\nNew Rating: " + currentRating), 300);
    }
}

// --- ENGINE & BOARD CONTROL ---
chessWorker.onmessage = function(e) {
    game.move({ from: e.data.substring(0, 2), to: e.data.substring(2, 4), promotion: 'q' });
    board.position(game.fen());
    updateStatus();
};

function onSquareClick(sq) {
    if (game.game_over()) return;
    if (!sourceSquare) {
        let p = game.get(sq);
        if (p && p.color === 'w') { sourceSquare = sq; $('.square-' + sq).addClass('highlight-white'); }
        return;
    }
    let m = game.move({ from: sourceSquare, to: sq, promotion: 'q' });
    $('.highlight-white').removeClass('highlight-white');
    sourceSquare = null;
    if (!m) { $('#remark').text("Illegal move!"); return; }
    
    $('#remark').text("");
    board.position(game.fen());
    updateStatus();
    if (!game.game_over()) {
        $('#status').text("Mr. Dotun is analyzing...");
        chessWorker.postMessage("position " + game.fen());
    }
}

board = ChessBoard('board', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
$('#board').on('click', '[class*="square-"]', function() { onSquareClick($(this).attr('data-square')); });
$(window).resize(() => board.resize());
</script>
</body>
</html>
