<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decipher Chess - Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; }
        #welcome-overlay { position: fixed; inset: 0; background: #1a1a2e; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: #2D1B4D; padding: 30px; border-radius: 15px; border: 2px solid #4ade80; width: 85%; max-width: 400px; text-align: center; }
        .login-card input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #4ade80; background: #1a1a2e; color: white; box-sizing: border-box; }
        #game-container { display: none; width: 95vmin; max-width: 500px; padding: 20px 10px; }
        #board { width: 100%; border: 2px solid #4ade80; }
        .info-panel { background: #2D1B4D; padding: 15px; border-radius: 12px; border: 1px solid #4ade80; }
        .submit-btn { background: #4ade80; color: #1a1a2e; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        .grade { font-size: 1.2em; font-weight: bold; color: #4ade80; }
        #status { color: #cbd5e1; font-size: 0.9em; margin-top: 10px; font-weight: bold; }
        #remark { color: #ff4d4d; font-weight: bold; font-style: italic; margin: 10px 0; min-height: 1.2em;}
        .highlight-white { background: rgba(255, 255, 0, 0.5) !important; }

        /* --- LEADERBOARD STYLES --- */
        .leaderboard-section { width: 100%; margin-top: 30px; background: #2D1B4D; border-radius: 12px; border: 1px solid #4ade80; padding: 15px; box-sizing: border-box; }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        .leaderboard-table th { border-bottom: 2px solid #4ade80; padding: 10px; text-align: left; color: #4ade80; }
        .leaderboard-table td { padding: 10px; border-bottom: 1px solid rgba(74, 222, 128, 0.2); }
        .rank-1 { color: #ffd700; font-weight: bold; } /* Gold */
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80;">Decipher Chess</h1>
        <input type="text" id="studentName" placeholder="Full Name">
        <input type="text" id="studentClass" placeholder="Class (e.g. Grade 5)">
        <input type="password" id="studentPass" placeholder="Secret Password">
        <button class="submit-btn" onclick="startGame()">ENTER ARENA</button>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h3><span id="displayName" style="color:#4ade80"></span> vs Mr. Dotun</h3>
        <div id="board"></div>
        <p id="remark">Welcome to the Academy.</p>
        <p>Rank: <span id="grade" class="grade">Loading...</span></p>
        <div id="status">Your turn! Select a piece.</div>
        
        <div class="leaderboard-section">
            <h3 style="margin-top:0; color:#4ade80;">Top 10 Academy Ranks</h3>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Rating</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr><td colspan="3">Loading rankings...</td></tr>
                </tbody>
            </table>
        </div>

        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfduqoEyvRko9-TM2T1SU0WVkr2vCdg2sFPZUTtQLOwSnJbBA/viewform" class="submit-btn" style="text-decoration:none; display:block; text-align:center;">SUBMIT SCORE</a>
    </div>
</div>

<script>
// --- CONFIGURATION ---
const chessWorker = new Worker('./chess-worker.js');
const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

var game = new Chess(), board = null, sourceSquare = null;
var currentName = "", currentClass = "", docId = "", currentRating = 1000;

// --- LEADERBOARD FETCH ---
async function displayLeaderboard() {
    try {
        const snapshot = await db.collection("leaderboard")
            .orderBy("rating", "desc")
            .limit(10)
            .get();
        
        let html = "";
        snapshot.forEach((doc, index) => {
            const data = doc.data();
            const rankClass = index === 0 ? 'class="rank-1"' : '';
            html += `<tr ${rankClass}>
                <td>${data.name}</td>
                <td>${data.class}</td>
                <td>${data.rating}</td>
            </tr>`;
        });
        $('#leaderboard-body').html(html || "<tr><td colspan='3'>No data yet</td></tr>");
    } catch (e) {
        console.error("Leaderboard error:", e);
    }
}

// --- RATING SYSTEM ---
function getTitle(rating) {
    if (rating < 1200) return "Beginner";
    if (rating < 1600) return "Intermediate";
    if (rating < 2000) return "Advanced";
    if (rating < 2400) return "Master";
    return "Legendary Grandmaster";
}

function updateGradeUI() {
    $('#grade').text(getTitle(currentRating) + " (" + currentRating + ")");
}

// --- SECURE LOGIN ---
async function startGame() {
    currentName = $('#studentName').val().trim();
    currentClass = $('#studentClass').val().trim();
    const password = $('#studentPass').val().trim();
    
    if (!currentName || !currentClass || !password) return alert("Fill all fields!");

    docId = currentName + "_" + currentClass;
    const docRef = db.collection("leaderboard").doc(docId);
    const docSnap = await docRef.get();
    
    if (docSnap.exists) {
        if (docSnap.data().password !== password) return alert("Incorrect password!");
        currentRating = docSnap.data().rating;
    } else {
        currentRating = 1000; 
        await docRef.set({ name: currentName, class: currentClass, password: password, rating: currentRating, gamesPlayed: 0 });
    }

    $('#displayName').text(currentName);
    updateGradeUI();
    displayLeaderboard(); // Load names when game starts
    $('#welcome-overlay').hide();
    $('#game-container').show();
    board.resize();
}

// --- ENGINE HANDLER ---
chessWorker.onmessage = function(e) {
    const move = e.data;
    game.move({ from: move.substring(0, 2), to: move.substring(2, 4), promotion: 'q' });
    board.position(game.fen());
    updateStatus();
};

async function updateStatus() {
    if (game.game_over()) {
        let pts = 0, msg = "";
        if (game.in_checkmate()) {
            if (game.turn() === 'b') { msg = "WIN! +200 Elo!"; pts = 200; }
            else { msg = "LOSS! -10 Elo."; pts = -10; }
        } else { msg = "DRAW! +50 Elo."; pts = 50; }

        currentRating = Math.max(1000, currentRating + pts);
        updateGradeUI();
        await db.collection("leaderboard").doc(docId).update({ 
            rating: currentRating, 
            gamesPlayed: firebase.firestore.FieldValue.increment(1),
            lastPlayed: firebase.firestore.Timestamp.now()
        });
        displayLeaderboard(); // Refresh ranks after game
        setTimeout(() => alert(msg), 300);
    } else {
        $('#status').text("Your turn!");
    }
}

function onSquareClick(square) {
    if (game.game_over()) return;
    if (!sourceSquare) {
        let p = game.get(square);
        if (p && p.color === 'w') { sourceSquare = square; $('.square-' + square).addClass('highlight-white'); }
        return;
    }
    let m = game.move({ from: sourceSquare, to: square, promotion: 'q' });
    $('.highlight-white').removeClass('highlight-white');
    sourceSquare = null;
    if (!m) { $('#remark').text("Illegal move! Try again."); return; }
    
    $('#remark').text("");
    board.position(game.fen());
    updateStatus();
    if (!game.game_over()) {
        $('#status').text("Mr. Dotun is thinking...");
        chessWorker.postMessage("position " + game.fen());
    }
}

board = ChessBoard('board', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
$('#board').on('click', '[class*="square-"]', function() { onSquareClick($(this).attr('data-square')); });
$(window).resize(() => board.resize());
</script>
</body>
</html>
