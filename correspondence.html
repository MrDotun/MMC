<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Championship Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #2D1B4D; --secondary: #4ade80; --bg: #0f172a; --text: #f8fafc; --card: #1e293b; --danger: #ef4444; --accent: #3b82f6; --gold: #fbbf24; --silver: #94a3b8; --bronze: #cd7f32; }
        
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); 
            color: var(--text); margin: 0; padding: 15px; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .container { 
            width: 100%; max-width: 420px; background: rgba(30, 41, 59, 0.7); 
            padding: 25px; border-radius: 16px; box-sizing: border-box; 
            margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hidden { display: none !important; }
        
        h2, h3 { 
            color: var(--secondary); text-align: center; margin: 0 0 15px 0;
            text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .auth-toggle { display: flex; gap: 8px; margin-bottom: 20px; background: #0f172a; padding: 5px; border-radius: 12px; }
        .auth-toggle button { flex: 1; padding: 10px; font-size: 10px; background: transparent; color: #64748b; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .auth-toggle button.active { background: var(--card); color: var(--secondary); }

        .btn { 
            padding: 16px; cursor: pointer; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #2D1B4D 0%, #4c1d95 100%);
            color: var(--secondary); font-weight: 800; width: 100%; 
            margin-bottom: 12px; text-transform: uppercase; transition: 0.3s; 
            font-size: 13px; letter-spacing: 1px;
        }
        
        .podium-wrap { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin-bottom: 20px; height: 90px; }
        .podium-rank { display: flex; flex-direction: column; align-items: center; width: 65px; }
        .podium-bar { width: 100%; border-radius: 6px 6px 0 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; font-size: 9px; }
        .rank-1 .podium-bar { height: 50px; background: var(--gold); }
        .rank-2 .podium-bar { height: 35px; background: var(--silver); }
        .rank-3 .podium-bar { height: 25px; background: var(--bronze); }
        .podium-name { font-size: 9px; margin-top: 4px; font-weight: bold; text-align: center; overflow: hidden; text-overflow: ellipsis; width: 100%; white-space: nowrap; }

        .item-row { 
            background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 10px; 
            margin-bottom: 8px; display: flex; justify-content: space-between; 
            align-items: center; border: 1px solid rgba(255,255,255,0.05); font-size: 0.8em;
        }

        .live-badge { background: var(--danger); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.6em; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Chat Styles */
        #chat-container { margin-top: 15px; background: #020617; border-radius: 12px; padding: 10px; border: 1px solid #334155; }
        #chat-box { height: 100px; overflow-y: auto; font-size: 11px; margin-bottom: 10px; padding-right: 5px; }
        .chat-msg { margin-bottom: 6px; line-height: 1.4; }
        .chat-user { color: var(--secondary); font-weight: bold; }
        .chat-input-wrap { display: flex; gap: 5px; }
        .chat-input-wrap input { margin-bottom: 0 !important; padding: 8px !important; font-size: 12px; flex: 1; }
        .chat-send { width: 60px !important; padding: 8px !important; margin-bottom: 0 !important; font-size: 10px; }

        /* Replay Controls Styling */
        .replay-nav { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 10px 0; }
        .replay-btn { background: var(--card); border: 1px solid #334155; color: var(--secondary); border-radius: 8px; padding: 8px 15px; cursor: pointer; font-weight: bold; }
        #replay-label { font-size: 11px; color: var(--secondary); letter-spacing: 1px; font-weight: bold; min-width: 80px; text-align: center; }

        .rating-badge { background: var(--secondary); color: #064e3b; padding: 4px 8px; border-radius: 6px; font-size: 0.7em; font-weight: 900; }
        input, select { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary); margin-bottom: 25px; font-style: italic; letter-spacing: 4px;">♟️ ARENA</h1>

    <div id="section-register" class="container">
        <div class="auth-toggle">
            <button id="tab-login" class="active" onclick="switchAuth('login')">LOGIN</button>
            <button id="tab-register" onclick="switchAuth('register')">REGISTER</button>
            <button id="tab-guest" onclick="switchAuth('guest')">GUEST</button>
        </div>
        <div id="auth-form">
            <h2 id="auth-title">Welcome Back</h2>
            <input type="text" id="reg-name" placeholder="Full Name">
            <input type="password" id="reg-password" placeholder="PIN (Required for Login/Reg)">
            <div id="extra-fields" class="hidden">
                <input type="text" id="reg-school" placeholder="School Name">
                <select id="reg-avatar">
                    <option value="🦁">Lion</option><option value="🦅">Eagle</option><option value="🐍">Cobra</option>
                </select>
            </div>
            <button class="btn" onclick="handleAuth()">Enter Arena</button>
        </div>
    </div>

    <div id="section-lobby" class="container hidden">
        <div id="user-welcome"></div>
        <div class="podium-wrap" id="winners-podium">
            <div class="podium-rank rank-2"><div class="podium-name" id="p2-name">-</div><div class="podium-bar">2nd</div></div>
            <div class="podium-rank rank-1"><div class="podium-name" id="p1-name">-</div><div class="podium-bar">1st</div></div>
            <div class="podium-rank rank-3"><div class="podium-name" id="p3-name">-</div><div class="podium-bar">3rd</div></div>
        </div>
        <div id="admin-panel" class="hidden" style="border: 1px dashed var(--gold); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
            <h3 style="color:var(--gold)">🛠️ TOURNAMENT GEN</h3>
            <div id="player-check-list" style="max-height: 80px; overflow-y: auto; margin: 10px 0; font-size: 11px;"></div>
            <button class="btn" style="background: var(--gold); color: black;" onclick="generateTournament()">Generate Bracket</button>
        </div>
        <div id="live-games-section">
            <h3><span class="live-badge">LIVE</span> WATCH GAMES</h3>
            <div id="live-games-list"></div>
        </div>
        <div id="my-matches-section">
            <h3>⚔️ MY ACTIVE GAMES</h3>
            <div id="my-match-list"></div>
        </div>
        <div id="leaderboard-section">
            <h3>🏆 ALL REGISTERED PLAYERS</h3>
            <div id="full-leaderboard" style="max-height: 150px; overflow-y: auto;"></div>
        </div>
        <button class="btn" style="background: transparent; border: 1px solid #334155; color: #64748b; margin-top: 15px;" onclick="logout()">LOGOUT</button>
    </div>

    <div id="section-game" class="container hidden">
        <div style="display:flex; justify-content:space-between; margin: 10px 0; font-size: 0.85em;">
            <span id="label-white">White</span>
            <span id="label-black">Black</span>
        </div>
        
        <div id="myBoard" style="width: 100%; border-radius: 12px; overflow: hidden; border: 4px solid #1e293b;"></div>

        <div class="replay-nav">
            <button class="replay-btn" onclick="updateReplayView(-1)">←</button>
            <span id="replay-label">LIVE VIEW</span>
            <button class="replay-btn" onclick="updateReplayView(1)">→</button>
        </div>

        <div id="game-status" style="text-align:center; margin-top:5px; font-weight:bold; color: var(--secondary);"></div>

        <div id="chat-container">
            <div id="chat-box"></div>
            <div class="chat-input-wrap">
                <input type="text" id="chat-input" placeholder="Say something...">
                <button class="btn chat-send" onclick="sendChat()">SEND</button>
            </div>
        </div>
        <button class="btn" style="margin-top:15px;" onclick="showLobby()">Back to Lobby</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Added historyMoves and viewIndex for Replay
        let myId = localStorage.getItem('savedUserId'), myData = null, board = null, game = new Chess(), 
            activeMatchId = null, authMode = 'login', sourceSquare = null, chatUnsubscribe = null,
            historyMoves = [], viewIndex = -1;

        window.onload = async function() {
            if (myId) {
                const doc = await db.collection("academy_players").doc(myId).get();
                if (doc.exists) { myData = doc.data(); showLobby(); }
            }
        };

        function switchAuth(mode) {
            authMode = mode; $(".auth-toggle button").removeClass("active"); $(`#tab-${mode}`).addClass("active");
            $("#extra-fields").addClass("hidden"); $("#reg-password").removeClass("hidden");
            if(mode === 'login') $("#auth-title").text("Welcome Back");
            else if(mode === 'register') { $("#auth-title").text("Create Profile"); $("#extra-fields").removeClass("hidden"); }
            else { $("#auth-title").text("Enter as Guest"); $("#reg-password").addClass("hidden"); }
        }

        async function handleAuth() {
            if(authMode === 'guest') {
                myId = "guest_" + Math.floor(Math.random() * 10000);
                myData = { name: "Guest_" + myId.split('_')[1], rating: 0, avatar: "👤", pin: "guest" };
                return showLobby();
            }
            const name = $("#reg-name").val().trim();
            const pin = $("#reg-password").val();
            const id = name.toLowerCase().replace(/\s/g, '_');
            const docRef = db.collection("academy_players").doc(id);
            const doc = await docRef.get();

            if (authMode === 'login') {
                if (!doc.exists || (doc.data().pin !== pin && pin !== "decipher1234")) return alert("Invalid PIN");
                myData = doc.data();
            } else {
                if (doc.exists) return alert("Name taken!");
                myData = { name, pin, school: $("#reg-school").val(), avatar: $("#reg-avatar").val(), rating: 1500 };
                await docRef.set(myData);
            }
            myId = id; localStorage.setItem('savedUserId', id); showLobby();
        }

        function showLobby() {
            $(".container").addClass("hidden"); $("#section-lobby").removeClass("hidden");
            document.getElementById('user-welcome').innerHTML = `<h3>${myData.avatar || '♟️'} ${myData.name}</h3>`;
            if (myData.pin === "decipher1234") { $("#admin-panel").removeClass("hidden"); loadAdminList(); }
            loadLobbyData();
        }

        function loadLobbyData() {
            db.collection("academy_players").orderBy("rating", "desc").onSnapshot(snap => {
                let html = ""; const p = [];
                snap.forEach(doc => {
                    const d = doc.data(); p.push(d);
                    html += `<div class="item-row"><span>${d.name}</span> <span class="rating-badge">${d.rating}</span></div>`;
                });
                if(p[0]) $("#p1-name").text(p[0].name);
                if(p[1]) $("#p2-name").text(p[1].name);
                if(p[2]) $("#p3-name").text(p[2].name);
                document.getElementById('full-leaderboard').innerHTML = html;
            });

            db.collection("academy_matches").where("status", "==", "active").onSnapshot(snap => {
                let liveHtml = "", myHtml = "";
                snap.forEach(doc => {
                    const d = doc.data(); const opp = d.white === myId ? d.black : d.white;
                    if(d.players.includes(myId)) myHtml += `<button class="btn" onclick="loadGame('${doc.id}')">PLAY VS ${opp.toUpperCase()}</button>`;
                    else liveHtml += `<div class="item-row" onclick="loadGame('${doc.id}')" style="cursor:pointer; border-left:3px solid var(--danger);"><span>${d.white} vs ${d.black}</span><span class="live-badge">WATCH</span></div>`;
                });
                document.getElementById('my-match-list').innerHTML = myHtml || "<p style='font-size:10px; text-align:center;'>No games.</p>";
                document.getElementById('live-games-list').innerHTML = liveHtml || "<p style='font-size:10px; text-align:center;'>No other games live.</p>";
            });
        }

        function loadAdminList() {
            db.collection("academy_players").get().then(snap => {
                let html = ""; snap.forEach(doc => { html += `<div><input type="checkbox" class="t-check" value="${doc.id}"> ${doc.data().name}</div>`; });
                document.getElementById('player-check-list').innerHTML = html;
            });
        }

        async function generateTournament() {
            const selected = []; $(".t-check:checked").each(function() { selected.push($(this).val()); });
            if (selected.length < 2) return alert("Select players");
            for (let i = 0; i < selected.length; i += 2) {
                if (selected[i+1]) {
                    const mid = "T_" + Date.now() + "_" + i;
                    await db.collection("academy_matches").doc(mid).set({
                        white: selected[i], black: selected[i+1], players: [selected[i], selected[i+1]],
                        type: "tournament", round: "Quarter-Finals", status: "active", fen: "start", pgn: ""
                    });
                }
            }
            alert("Tournament Live!");
        }

        function loadGame(id) {
            activeMatchId = id; 
            viewIndex = -1; // Reset view index on new game load
            $(".container").addClass("hidden"); $("#section-game").removeClass("hidden");
            
            if (!board) {
                board = ChessBoard('myBoard', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
                $('#myBoard').on('click', '.square-55d63', onSquareClick);
            }
            
            db.collection("academy_matches").doc(id).onSnapshot(doc => {
                const d = doc.data(); if (!d) return;
                
                // Load full history from PGN
                game.load_pgn(d.pgn || "");
                historyMoves = game.history();

                // If user is at the end or just joined, keep "Live"
                if (viewIndex === -1 || viewIndex >= historyMoves.length - 1) {
                    viewIndex = historyMoves.length - 1;
                    board.position(game.fen());
                    document.getElementById('replay-label').innerText = "LIVE VIEW";
                }

                document.getElementById('label-white').innerText = "W: " + d.white;
                document.getElementById('label-black').innerText = "B: " + d.black;
                document.getElementById('game-status').innerText = game.turn() === 'w' ? "WHITE'S TURN" : "BLACK'S TURN";
                if(d.players.includes(myId)) board.orientation(myId === d.white ? 'white' : 'black');
            });

            if(chatUnsubscribe) chatUnsubscribe();
            chatUnsubscribe = db.collection("academy_matches").doc(id).collection("chat").orderBy("time", "asc").limitToLast(20).onSnapshot(snap => {
                let html = ""; snap.forEach(c => {
                    const msg = c.data();
                    html += `<div class="chat-msg"><span class="chat-user">${msg.user}:</span> ${msg.text}</div>`;
                });
                document.getElementById('chat-box').innerHTML = html;
                document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
            });
        }

        // REPLAY LOGIC FUNCTION
        function updateReplayView(dir) {
            let targetIndex = viewIndex + dir;
            if (targetIndex < -1 || targetIndex >= historyMoves.length) return;

            viewIndex = targetIndex;
            let tempGame = new Chess();
            for (let i = 0; i <= viewIndex; i++) {
                tempGame.move(historyMoves[i]);
            }
            board.position(tempGame.fen());

            // Update Label
            const label = document.getElementById('replay-label');
            if (viewIndex === historyMoves.length - 1) {
                label.innerText = "LIVE VIEW";
                label.style.color = "var(--secondary)";
            } else {
                label.innerText = `MOVE ${viewIndex + 1}`;
                label.style.color = "#fff";
            }
        }

        async function sendChat() {
            const txt = $("#chat-input").val().trim();
            if(!txt || !activeMatchId) return;
            await db.collection("academy_matches").doc(activeMatchId).collection("chat").add({
                user: myData.name, text: txt, time: Date.now()
            });
            $("#chat-input").val("");
        }

        function onSquareClick() {
            const sq = $(this).attr('data-square');
            db.collection("academy_matches").doc(activeMatchId).get().then(doc => {
                const d = doc.data();
                if (!d.players.includes(myId) || (game.turn() === 'w' && myId !== d.white) || (game.turn() === 'b' && myId !== d.black)) return;
                
                // Block moving if currently replaying the past
                if (viewIndex !== historyMoves.length - 1) {
                   return alert("Go back to LIVE VIEW to make a move!");
                }

                if (sourceSquare === null) {
                    if (game.get(sq) && game.get(sq).color === game.turn()) { sourceSquare = sq; $(this).css('background', 'rgba(74, 222, 128, 0.4)'); }
                } else {
                    const move = game.move({ from: sourceSquare, to: sq, promotion: 'q' });
                    sourceSquare = null; $('.square-55d63').css('background', '');
                    if (move) db.collection("academy_matches").doc(activeMatchId).update({ fen: game.fen(), pgn: game.pgn() });
                }
            });
        }

        function logout() { localStorage.removeItem('savedUserId'); location.reload(); }
    </script>
</body>
</html>
