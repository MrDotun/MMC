<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Correspondence Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #2D1B4D; --secondary: #4ade80; --bg: #1a1a2e; --text: #ffffff; --card: #24243e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; background: var(--card); padding: 20px; border-radius: 12px; box-sizing: border-box; margin-bottom: 20px; border: 1px solid #333; }
        .hidden { display: none !important; }
        h2, h3 { color: var(--secondary); text-align: center; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 2px solid var(--secondary); background: var(--bg); color: white; box-sizing: border-box; }
        .btn { padding: 14px; cursor: pointer; border-radius: 8px; border: 1px solid var(--secondary); background: var(--primary); color: var(--secondary); font-weight: bold; width: 100%; margin-bottom: 10px; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { background: var(--secondary); color: var(--bg); }
        #board-container { width: 100%; border: 3px solid var(--secondary); border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        .highlight-selected { background-color: rgba(74, 222, 128, 0.7) !important; }
        .item-row { background: var(--primary); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .rating-badge { background: var(--secondary); color: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 0.8em; font-weight: 800; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary); margin-bottom: 20px; italic">♟️ ARENA</h1>

    <div id="section-register" class="container">
        <h2>Student Access</h2>
        <input type="text" id="reg-name" placeholder="Full Name">
        <input type="text" id="reg-school" placeholder="School Name">
        <select id="reg-avatar">
            <option value="🦁">🦁 Brave Lion</option>
            <option value="🐉">🐉 Fire Dragon</option>
            <option value="🦉">🦉 Wise Owl</option>
        </select>
        <button class="btn" onclick="handleRegister()">Enter Arena</button>
    </div>

    <div id="section-lobby" class="container hidden">
        <div id="user-welcome" style="text-align:center; margin-bottom:15px;"></div>
        
        <h3>Leaderboard</h3>
        <div id="leaderboard-list" style="margin-bottom: 25px; border-bottom: 1px solid #444; padding-bottom: 15px;"></div>

        <h3>Active Matches</h3>
        <div id="match-list" style="margin-bottom: 20px;"></div>

        <h3>Challenge a Friend</h3>
        <div id="available-players">Searching for students...</div>
    </div>

    <div id="section-game" class="container hidden">
        <div id="match-header" style="display:flex; justify-content:space-between; margin-bottom:10px; font-size: 0.8em; font-weight: bold;">
            <span id="label-white">White</span>
            <span style="color:var(--secondary)">VS</span>
            <span id="label-black">Black</span>
        </div>
        <div id="board-container"><div id="myBoard"></div></div>
        <div id="game-status" style="text-align:center; font-weight:bold; color:var(--secondary); margin-bottom:15px;">Your Turn</div>
        <button class="btn" onclick="showLobby()">Back to Lobby</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let game = new Chess();
        let board = null, myId = null, myData = null, activeMatchId = null, selectedSq = null;

        function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const school = document.getElementById('reg-school').value.trim();
            const pass = prompt("Enter Academy Password:");

            if (pass === "decipher1234") {
                myId = "admin_" + name.toLowerCase().replace(/\s/g, '_');
                myData = { name: name, school: "Admin", avatar: "👑", rating: 1500, role: "admin" };
            } else if (pass === "chess2026") {
                if(!name || !school) return alert("Enter details!");
                myId = name.toLowerCase().replace(/\s/g, '_');
                // Check if player exists to keep their rating, otherwise set to 1500
                db.collection("academy_players").doc(myId).get().then(doc => {
                    if (doc.exists) {
                        myData = doc.data();
                        showLobby();
                    } else {
                        myData = { 
                            name: name, school: school, 
                            avatar: document.getElementById('reg-avatar').value, 
                            rating: 1500, role: "student" 
                        };
                        db.collection("academy_players").doc(myId).set(myData).then(showLobby);
                    }
                });
                return;
            } else {
                return alert("Access Denied.");
            }
            db.collection("academy_players").doc(myId).set(myData, {merge: true}).then(showLobby);
        }

        function showLobby() {
            $(".container").addClass("hidden");
            $("#section-lobby").removeClass("hidden");
            document.getElementById('user-welcome').innerHTML = `<h3>${myData.avatar} ${myData.name} <span class="rating-badge">${myData.rating}</span></h3>`;
            loadLobbyData();
        }

        function loadLobbyData() {
            // Leaderboard: Sort by rating
            db.collection("academy_players").orderBy("rating", "desc").limit(10).onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    const p = doc.data();
                    html += `<div class="item-row" style="padding: 8px 12px; font-size: 0.9em;">
                        <span>${p.avatar} ${p.name}</span>
                        <span class="rating-badge">${p.rating}</span>
                    </div>`;
                });
                document.getElementById('leaderboard-list').innerHTML = html;
            });

            // Available Players
            db.collection("academy_players").limit(20).get().then(snap => {
                let html = "";
                snap.forEach(doc => {
                    if(doc.id !== myId) {
                        html += `<div class="item-row" onclick="createMatch('${doc.id}')">
                            <span>${doc.data().name}</span>
                            <span class="rating-badge" style="background:transparent; border: 1px solid var(--secondary); color: var(--secondary)">${doc.data().rating}</span>
                        </div>`;
                    }
                });
                document.getElementById('available-players').innerHTML = html || "No other students.";
            });

            // Matches
            db.collection("academy_matches").where("players", "array-contains", myId).where("status", "==", "active").onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    const m = doc.data();
                    const opp = m.white === myId ? m.black : m.white;
                    html += `<button class="btn" style="font-size: 12px;" onclick="loadGame('${doc.id}')">VS ${opp.toUpperCase()}</button>`;
                });
                document.getElementById('match-list').innerHTML = html || "No active games.";
            });
        }

        function createMatch(oppId) {
            const id = [myId, oppId].sort().join("_vs_");
            db.collection("academy_matches").doc(id).set({
                players: [myId, oppId], white: myId, black: oppId,
                fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
                status: "active",
                updated: firebase.firestore.FieldValue.serverTimestamp()
            }, {merge: true}).then(() => loadGame(id));
        }

        function loadGame(id) {
            activeMatchId = id;
            $(".container").addClass("hidden");
            $("#section-game").removeClass("hidden");
            if(!board) {
                board = ChessBoard('myBoard', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
                $('#myBoard').on('click', '.square-55d63', onMove);
            }
            db.collection("academy_matches").doc(id).onSnapshot(doc => {
                const data = doc.data();
                if (data.status === "finished") return showLobby();
                game.load(data.fen);
                board.position(data.fen);
                board.orientation(data.white === myId ? 'white' : 'black');
                document.getElementById('label-white').innerText = data.white;
                document.getElementById('label-black').innerText = data.black;
                updateStatus(data);
            });
        }

        function onMove() {
            const sq = $(this).attr('data-square');
            if (!selectedSq) {
                if (game.get(sq) && game.get(sq).color === game.turn()) {
                    selectedSq = sq;
                    $(`.square-${sq}`).addClass('highlight-selected');
                }
            } else {
                const move = game.move({ from: selectedSq, to: sq, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-selected');
                selectedSq = null;
                if (move) {
                    checkGameOver();
                }
            }
        }

        function checkGameOver() {
            let status = "active";
            let winner = null;

            if (game.in_checkmate()) {
                status = "finished";
                winner = game.turn() === 'w' ? 'black' : 'white'; // The one who didn't just move lost
            } else if (game.in_draw()) {
                status = "finished";
                winner = "draw";
            }

            const updateData = { fen: game.fen(), updated: firebase.firestore.FieldValue.serverTimestamp() };
            if (status === "finished") {
                updateData.status = "finished";
                updateData.winner = winner;
                processRatingChange(winner);
            }

            db.collection("academy_matches").doc(activeMatchId).update(updateData);
        }

        async function processRatingChange(result) {
            const matchDoc = await db.collection("academy_matches").doc(activeMatchId).get();
            const m = matchDoc.data();
            const whiteRef = db.collection("academy_players").doc(m.white);
            const blackRef = db.collection("academy_players").doc(m.black);

            const [wDoc, bDoc] = await Promise.all([whiteRef.get(), blackRef.get()]);
            let wR = wDoc.data().rating;
            let bR = bDoc.data().rating;

            let wChange = 0, bChange = 0;

            if (result === "white") {
                wChange = Math.floor(Math.random() * 6) + 10; // 10-15
                bChange = -wChange;
            } else if (result === "black") {
                bChange = Math.floor(Math.random() * 6) + 10; // 10-15
                wChange = -bChange;
            } else { // Draw
                wChange = wR < bR ? 3 : 2; // +3 if weaker, +2 if stronger
                bChange = bR < wR ? 3 : 2;
            }

            await Promise.all([
                whiteRef.update({ rating: wR + wChange }),
                blackRef.update({ rating: bR + bChange })
            ]);
            
            // Update local state for immediate welcome screen update
            if (myId === m.white) myData.rating += wChange;
            if (myId === m.black) myData.rating += bChange;
        }

        function updateStatus(d) {
            const myTurn = game.turn() === (d.white === myId ? 'w' : 'b');
            document.getElementById('game-status').innerText = myTurn ? "🟢 YOUR TURN" : "⏳ WAITING";
        }
    </script>
</body>
</html>
