<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Correspondence Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #2D1B4D; --secondary: #4ade80; --bg: #1a1a2e; --text: #ffffff; --card: #24243e; --danger: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; background: var(--card); padding: 20px; border-radius: 12px; box-sizing: border-box; margin-bottom: 20px; border: 1px solid #333; }
        .hidden { display: none !important; }
        h2, h3 { color: var(--secondary); text-align: center; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 2px solid var(--secondary); background: var(--bg); color: white; box-sizing: border-box; font-size: 16px; }
        .btn { padding: 14px; cursor: pointer; border-radius: 8px; border: 1px solid var(--secondary); background: var(--primary); color: var(--secondary); font-weight: bold; width: 100%; margin-bottom: 10px; text-transform: uppercase; transition: 0.3s; font-size: 14px; outline: none; border: 1px solid var(--secondary); }
        .btn:hover { background: var(--secondary); color: var(--bg); }
        .btn-danger { border-color: var(--danger); color: var(--danger); background: transparent; padding: 5px 10px; font-size: 10px; width: auto; margin: 0; }
        .btn-danger:hover { background: var(--danger); color: white; }
        #board-container { width: 100%; border: 3px solid var(--secondary); border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        .item-row { background: var(--primary); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .rating-badge { background: var(--secondary); color: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 0.8em; font-weight: 800; }
        .admin-controls { margin-top: 5px; display: flex; gap: 5px; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary); margin-bottom: 20px; font-style: italic;">♟️ ARENA</h1>

    <div id="section-register" class="container">
        <h2>Student Access</h2>
        <input type="text" id="reg-name" placeholder="Full Name">
        <input type="text" id="reg-school" placeholder="School Name">
        <select id="reg-avatar">
            <option value="🎯">🎯 Attacker</option>
            <option value="🛡️">🛡️ Defender</option>
            <option value="🧩">🧩 Positional Player</option>
            <option value="⚡">⚡ Tactical Wizard</option>
        </select>
        <input type="password" id="reg-password" placeholder="PIN or Admin Code">
        <button class="btn" onclick="handleRegister()">Enter Arena</button>
    </div>

    <div id="section-lobby" class="container hidden">
        <div id="user-welcome" style="text-align:center; margin-bottom:15px;"></div>
        
        <div id="admin-panel" class="hidden" style="border: 1px dashed var(--secondary); padding: 10px; border-radius: 8px; margin-bottom: 20px;">
            <h3 style="font-size: 0.8em;">🛠️ Instructor Tools</h3>
            <div id="admin-player-list"></div>
        </div>

        <h3>🏆 Leaderboard</h3>
        <div id="leaderboard-list" style="margin-bottom: 25px; border-bottom: 1px solid #444; padding-bottom: 15px;"></div>

        <h3>⚔️ Active Matches</h3>
        <div id="match-list" style="margin-bottom: 20px;"></div>

        <h3>🤝 Challenge a Friend</h3>
        <div id="available-players">Searching for students...</div>
    </div>

    <div id="section-game" class="container hidden">
        <div id="match-header" style="display:flex; justify-content:space-between; margin-bottom:10px; font-size: 0.8em; font-weight: bold;">
            <span id="label-white">White</span>
            <span style="color:var(--secondary)">VS</span>
            <span id="label-black">Black</span>
        </div>
        <div id="board-container"><div id="myBoard"></div></div>
        <div id="game-status" style="text-align:center; font-weight:bold; color:var(--secondary); margin-bottom:15px;">Your Turn</div>
        <button class="btn" onclick="showLobby()">Back to Lobby</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let game = new Chess(), board = null, myId = null, myData = null, activeMatchId = null;

        async function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const school = document.getElementById('reg-school').value.trim();
            const enteredPass = document.getElementById('reg-password').value.trim();
            if(!name || !school || !enteredPass) return alert("Fill all fields!");

            if (enteredPass === "decipher1234") {
                myId = "admin_" + name.toLowerCase().replace(/\s/g, '_');
                myData = { name: name, school: "Admin", avatar: "👑", rating: 1500, role: "admin" };
                await db.collection("academy_players").doc(myId).set(myData, {merge: true});
                showLobby();
            } else {
                myId = name.toLowerCase().replace(/\s/g, '_');
                const doc = await db.collection("academy_players").doc(myId).get();
                if (doc.exists && doc.data().pin !== enteredPass) return alert("Wrong PIN!");
                
                myData = doc.exists ? doc.data() : { name, school, avatar: $('#reg-avatar').val(), rating: 1500, pin: enteredPass, role: "student" };
                if (!doc.exists) await db.collection("academy_players").doc(myId).set(myData);
                showLobby();
            }
        }

        function showLobby() {
            $(".container").addClass("hidden");
            $("#section-lobby").removeClass("hidden");
            if(myData.role === "admin") $("#admin-panel").removeClass("hidden");
            document.getElementById('user-welcome').innerHTML = `<h3>${myData.avatar} ${myData.name}</h3>`;
            loadLobbyData();
        }

        function loadLobbyData() {
            // Admin: Fetch all players for management
            if (myData.role === "admin") {
                db.collection("academy_players").onSnapshot(snap => {
                    let h = "";
                    snap.forEach(doc => {
                        const p = doc.data();
                        if (p.role !== 'admin') {
                            h += `<div class="item-row" style="font-size: 11px;">
                                <span>${p.name}</span>
                                <div class="admin-controls">
                                    <button class="btn-danger" onclick="adminResetPin('${doc.id}')">Reset PIN</button>
                                    <button class="btn-danger" onclick="adminDeletePlayer('${doc.id}')">Delete</button>
                                </div>
                            </div>`;
                        }
                    });
                    document.getElementById('admin-player-list').innerHTML = h;
                });
            }

            // Leaderboard
            db.collection("academy_players").orderBy("rating", "desc").limit(10).onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => html += `<div class="item-row"><span>${doc.data().avatar} ${doc.data().name}</span><span class="rating-badge">${doc.data().rating}</span></div>`);
                document.getElementById('leaderboard-list').innerHTML = html;
            });

            // Available Challengers
            db.collection("academy_players").limit(20).get().then(snap => {
                let html = "";
                snap.forEach(doc => {
                    if(doc.id !== myId) html += `<div class="item-row" onclick="createMatch('${doc.id}')"><span>${doc.data().name}</span><span class="rating-badge">${doc.data().rating}</span></div>`;
                });
                document.getElementById('available-players').innerHTML = html;
            });

            // Match List
            db.collection("academy_matches").where("players", "array-contains", myId).where("status", "==", "active").onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => html += `<button class="btn" style="font-size: 11px;" onclick="loadGame('${doc.id}')">VS ${doc.id.replace(myId, "").replace("_vs_", "").toUpperCase()}</button>`);
                document.getElementById('match-list').innerHTML = html || "No active games.";
            });
        }

        // --- ADMIN FUNCTIONS ---
        window.adminDeletePlayer = function(id) {
            if(confirm("Delete this student permanently?")) {
                db.collection("academy_players").doc(id).delete();
            }
        };

        window.adminResetPin = function(id) {
            const newPin = prompt("Enter new 4-digit PIN:");
            if(newPin) db.collection("academy_players").doc(id).update({ pin: newPin });
        };

        function createMatch(oppId) {
            const id = [myId, oppId].sort().join("_vs_");
            db.collection("academy_matches").doc(id).set({ players: [myId, oppId], white: myId, black: oppId, fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", status: "active", updated: firebase.firestore.FieldValue.serverTimestamp() }, {merge: true}).then(() => loadGame(id));
        }

        function loadGame(id) {
            activeMatchId = id; $(".container").addClass("hidden"); $("#section-game").removeClass("hidden");
            if(!board) {
                board = ChessBoard('myBoard', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
                $('#myBoard').on('click', '.square-55d63', onMove);
            }
            db.collection("academy_matches").doc(id).onSnapshot(doc => {
                const d = doc.data(); if(d.status === "finished") return showLobby();
                game.load(d.fen); board.position(d.fen); board.orientation(d.white === myId ? 'white' : 'black');
                document.getElementById('game-status').innerText = (game.turn() === (d.white === myId ? 'w' : 'b')) ? "🟢 YOUR TURN" : "⏳ WAITING";
            });
        }

        function onMove() {
            const sq = $(this).attr('data-square');
            if (!activeMatchId) return;
            // Existing movement logic here...
            const move = game.move({ from: sq, to: sq, promotion: 'q' }); // Simplified for space
            db.collection("academy_matches").doc(activeMatchId).update({ fen: game.fen() });
        }
    </script>
</body>
</html>
