<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Correspondence Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #2D1B4D; --secondary: #4ade80; --bg: #1a1a2e; --text: #ffffff; --card: #24243e; --danger: #ef4444; --accent: #3b82f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; background: var(--card); padding: 20px; border-radius: 12px; box-sizing: border-box; margin-bottom: 20px; border: 1px solid #333; }
        .hidden { display: none !important; }
        h2, h3 { color: var(--secondary); text-align: center; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; font-size: 1.1em; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 2px solid var(--secondary); background: var(--bg); color: white; box-sizing: border-box; font-size: 16px; }
        
        .btn { padding: 14px; cursor: pointer; border-radius: 8px; border: 1px solid var(--secondary); background: var(--primary); color: var(--secondary); font-weight: bold; width: 100%; margin-bottom: 10px; text-transform: uppercase; transition: 0.3s; font-size: 14px; outline: none; }
        .btn:hover { background: var(--secondary); color: var(--bg); }
        
        .btn-danger { border-color: var(--danger); color: var(--danger); background: transparent; padding: 12px; font-size: 12px; width: 100%; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; }
        .btn-danger:hover { background: var(--danger); color: white; }

        /* --- Scroll Logic --- */
        #match-list, #available-players, #spectate-match-list { 
            max-height: 200px; /* Fixed height for mobile */
            overflow-y: auto; 
            margin-bottom: 15px; 
            padding-right: 5px;
        }

        /* Custom Scrollbar for better UI */
        #match-list::-webkit-scrollbar, #available-players::-webkit-scrollbar { width: 4px; }
        #match-list::-webkit-scrollbar-thumb, #available-players::-webkit-scrollbar-thumb { 
            background: var(--secondary); 
            border-radius: 10px; 
        }

        .item-row { background: var(--primary); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; cursor: pointer; }
        .rating-badge { background: var(--secondary); color: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 0.8em; font-weight: 800; }
        .highlight-sq { background: rgba(74, 222, 128, 0.5) !important; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary); margin-bottom: 20px; font-style: italic;">♟️ ARENA</h1>

    <div id="section-register" class="container">
        <h2>Student Access</h2>
        <input type="text" id="reg-name" placeholder="Full Name">
        <input type="text" id="reg-school" placeholder="School Name">
        <select id="reg-avatar">
            <option value="🦁">Brave Lion</option>
            <option value="🦅">Eagle Eye</option>
            <option value="🐍">Tactical Cobra</option>
        </select>
        <input type="password" id="reg-password" placeholder="PIN or Admin Code">
        <button class="btn" onclick="handleRegister()">Enter Arena</button>
    </div>

    <div id="section-lobby" class="container hidden">
        <div id="user-welcome" style="text-align:center; margin-bottom:15px;"></div>
        
        <h3>⚔️ Active Matches</h3>
        <div id="match-list"></div>

        <h3>👁️ Spectate Arena</h3>
        <div id="spectate-match-list"></div>

        <h3>🤝 Challenge Students</h3>
        <div id="available-players">Loading...</div>
    </div>

    <div id="section-game" class="container hidden">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size: 0.85em; font-weight: bold; color: #aaa;">
            <span id="label-white">White: --</span>
            <span style="color:var(--secondary)">VS</span>
            <span id="label-black">Black: --</span>
        </div>
        <div id="myBoard" style="width: 100%; border: 2px solid var(--secondary); border-radius: 8px; margin-bottom: 15px;"></div>
        <div id="game-status" style="text-align:center; font-weight:bold; color:var(--secondary); margin-bottom:15px;">Loading...</div>
        
        <button class="btn-danger" id="resign-btn" onclick="confirmResign()">🏳️ Resign Match</button>
        <button class="btn" onclick="showLobby()">Back to Lobby</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let game = new Chess(), board = null, myId = null, myData = null, activeMatchId = null;
        let sourceSquare = null;

        // --- Anti-Duplicate Account Logic ---
        async function handleRegister() {
            const rawName = document.getElementById('reg-name').value.trim();
            const school = document.getElementById('reg-school').value.trim();
            const pin = document.getElementById('reg-password').value.trim();
            
            if(!rawName || !school || !pin) return alert("Fill all fields!");

            // Normalize ID to prevent slight name variations creating new accounts
            const userId = rawName.toLowerCase().replace(/\s/g, '_');
            const docRef = db.collection("academy_players").doc(userId);
            const doc = await docRef.get();
            
            if(doc.exists) {
                // If account exists, verify the school or PIN to prevent duplicates
                const existingData = doc.data();
                if(existingData.pin !== pin) {
                    return alert("This name is already registered. Please use the correct PIN or a different name.");
                }
                myData = existingData;
            } else {
                // New Account Creation
                myData = { 
                    name: rawName, 
                    school: school, 
                    avatar: $('#reg-avatar').val(), 
                    rating: 1200, 
                    pin: pin 
                };
                await docRef.set(myData);
            }
            
            myId = userId;
            showLobby();
        }

        function showLobby() {
            $(".container").addClass("hidden");
            $("#section-lobby").removeClass("hidden");
            document.getElementById('user-welcome').innerHTML = `<h3>${myData.avatar} ${myData.name}</h3>`;
            loadLobbyData();
        }

        function loadLobbyData() {
            db.collection("academy_matches").where("players", "array-contains", myId).where("status", "==", "active").onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    const opp = d.white === myId ? d.black : d.white;
                    html += `<button class="btn" onclick="loadGame('${doc.id}')">VS ${opp.replace('_',' ').toUpperCase()}</button>`;
                });
                document.getElementById('match-list').innerHTML = html || "No active games.";
            });

            db.collection("academy_matches").where("status", "==", "active").limit(10).onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    html += `<div class="item-row" onclick="loadGame('${doc.id}')" style="border-left: 3px solid var(--accent);">
                        <span style="font-size: 11px;">${d.white.replace('_',' ')} vs ${d.black.replace('_',' ')}</span>
                        <span class="rating-badge" style="background: var(--accent);">VIEW</span>
                    </div>`;
                });
                document.getElementById('spectate-match-list').innerHTML = html || "No live games.";
            });

            // Increased limit to 50 to test the new scroll feature
            db.collection("academy_players").limit(50).get().then(snap => {
                let html = "";
                snap.forEach(doc => {
                    if(doc.id !== myId) {
                        const p = doc.data();
                        html += `<div class="item-row" onclick="createMatch('${doc.id}')">
                            <span style="font-size: 13px;">${p.name} <small style="display:block; color:#888;">${p.school}</small></span>
                            <span class="rating-badge">${p.rating || 1200}</span>
                        </div>`;
                    }
                });
                document.getElementById('available-players').innerHTML = html;
            });
        }

        function loadGame(id) {
            activeMatchId = id;
            $(".container").addClass("hidden");
            $("#section-game").removeClass("hidden");
            
            if(!board) {
                board = ChessBoard('myBoard', { 
                    draggable: false, 
                    position: 'start', 
                    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' 
                });
                $('#myBoard').on('click', '.square-55d63', onSquareClick);
            }

            db.collection("academy_matches").doc(id).onSnapshot(doc => {
                const d = doc.data();
                if(!d || d.status !== "active") return showLobby();
                game.load(d.fen);
                board.position(d.fen);
                document.getElementById('label-white').innerText = `White: ${d.white.replace('_',' ')}`;
                document.getElementById('label-black').innerText = `Black: ${d.black.replace('_',' ')}`;
                const isWhite = (myId === d.white);
                const isBlack = (myId === d.black);
                if(isWhite || isBlack) {
                    board.orientation(isWhite ? 'white' : 'black');
                    const myTurn = (game.turn() === (isWhite ? 'w' : 'b'));
                    document.getElementById('game-status').innerText = myTurn ? "🟢 YOUR TURN" : "⏳ OPPONENT'S TURN";
                    $("#resign-btn").show();
                } else {
                    board.orientation('white');
                    document.getElementById('game-status').innerText = "👁️ SPECTATING";
                    $("#resign-btn").hide();
                }
            });
        }

        function onSquareClick() {
            if (!activeMatchId) return;
            const square = $(this).attr('data-square');
            db.collection("academy_matches").doc(activeMatchId).get().then(doc => {
                const d = doc.data();
                if (game.turn() === 'w' && myId !== d.white) return;
                if (game.turn() === 'b' && myId !== d.black) return;
                if (sourceSquare === null) {
                    if (game.get(square) && game.get(square).color === game.turn()) {
                        sourceSquare = square;
                        $('.square-55d63').removeClass('highlight-sq');
                        $(this).addClass('highlight-sq');
                    }
                } else {
                    const move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                    if (move === null) {
                        if (game.get(square) && game.get(square).color === game.turn()) {
                            sourceSquare = square;
                            $('.square-55d63').removeClass('highlight-sq');
                            $(this).addClass('highlight-sq');
                        } else {
                            sourceSquare = null;
                            $('.square-55d63').removeClass('highlight-sq');
                        }
                    } else {
                        sourceSquare = null;
                        $('.square-55d63').removeClass('highlight-sq');
                        db.collection("academy_matches").doc(activeMatchId).update({
                            fen: game.fen(),
                            updated: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                }
            });
        }

        function createMatch(oppId) {
            const matchId = [myId, oppId].sort().join("_vs_");
            db.collection("academy_matches").doc(matchId).set({
                players: [myId, oppId],
                white: myId,
                black: oppId,
                fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
                status: "active",
                updated: firebase.firestore.FieldValue.serverTimestamp()
            }, {merge: true}).then(() => loadGame(matchId));
        }

        function confirmResign() {
            if(confirm("Are you sure you want to resign?")) {
                db.collection("academy_matches").doc(activeMatchId).update({ status: "resigned" });
            }
        }
    </script>
</body>
</html>
