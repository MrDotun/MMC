<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nobility Chess Academy | Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #2D1B4D; --secondary: #4ade80; --bg: #1a1a2e; --text: #ffffff; --card: #24243e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; background: var(--card); padding: 20px; border-radius: 12px; box-sizing: border-box; margin-bottom: 20px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
        h2 { color: var(--secondary); text-align: center; margin-top: 0; font-size: 1.4em; }
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 2px solid var(--secondary); background: var(--bg); color: white; box-sizing: border-box; font-size: 16px; }
        .btn { padding: 14px; cursor: pointer; border-radius: 8px; border: 1px solid var(--secondary); background: var(--primary); color: var(--secondary); font-weight: bold; width: 100%; margin-bottom: 10px; transition: 0.3s; }
        .btn:hover { background: var(--secondary); color: var(--bg); }
        .btn-secondary { border-color: #666; color: #aaa; background: transparent; }
        
        /* Board UI */
        #board-container { width: 100%; border: 3px solid var(--secondary); border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        .highlight-selected { background-color: rgba(74, 222, 128, 0.7) !important; }
        
        /* List Items */
        .item-row { background: var(--primary); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; transition: 0.2s; }
        .item-row:hover { border-color: var(--secondary); cursor: pointer; }
        .badge { background: var(--secondary); color: var(--bg); padding: 2px 8px; border-radius: 4px; font-size: 0.7em; font-weight: bold; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary); margin-bottom: 20px;">♟️ Correspondence Arena</h1>

    <div id="section-register" class="container">
        <h2>Create Player Profile</h2>
        <input type="text" id="reg-name" placeholder="Your Full Name">
        <input type="text" id="reg-school" placeholder="School (e.g., Decipher Academy)">
        <select id="reg-avatar">
            <option value="🦁">🦁 Brave Lion</option>
            <option value="🐉">🐉 Fire Dragon</option>
            <option value="🦉">🦉 Wise Owl</option>
            <option value="🦄">🦄 Magic Unicorn</option>
        </select>
        <textarea id="reg-bio" placeholder="Write a short note for your friends..." rows="2"></textarea>
        <button class="btn" onclick="handleRegister()">Enter the Arena</button>
    </div>

    <div id="section-lobby" class="container hidden">
        <div id="user-welcome" style="text-align:center; margin-bottom:15px; border-bottom:1px solid #444; padding-bottom:10px;"></div>
        
        <h3>Active Matches</h3>
        <div id="match-list" style="margin-bottom: 20px;"></div>

        <hr style="border:0; border-top:1px solid #444; margin: 20px 0;">
        
        <h3>Challenge a Friend</h3>
        <div id="available-players">Searching for students...</div>
    </div>

    <div id="section-game" class="container hidden">
        <div id="match-header" style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:0.9em;">
            <span id="label-white">White</span>
            <span style="color:var(--secondary)">VS</span>
            <span id="label-black">Black</span>
        </div>
        <div id="board-container"><div id="myBoard"></div></div>
        <div id="game-status" style="text-align:center; font-weight:bold; color:var(--secondary); margin-bottom:15px;">Your Turn</div>
        <button class="btn btn-secondary" onclick="showLobby()">Back to Lobby</button>
    </div>

    <script>
        // --- CONFIGURATION ---
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let game = new Chess();
        let board = null;
        let myId = null;
        let myData = null;
        let activeMatchId = null;
        let selectedSq = null;

        // --- AUTH & PROFILE ---
        function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const school = document.getElementById('reg-school').value.trim();
            if(!name || !school) return alert("Please enter your name and school!");

            myId = name.toLowerCase().replace(/\s/g, '_');
            myData = {
                name: name,
                school: school,
                avatar: document.getElementById('reg-avatar').value,
                bio: document.getElementById('reg-bio').value,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("academy_players").doc(myId).set(myData, {merge: true}).then(showLobby);
        }

        function showLobby() {
            $(".container").addClass("hidden");
            $("#section-lobby").removeClass("hidden");
            document.getElementById('user-welcome').innerHTML = `<h3>Welcome, ${myData.avatar} ${myData.name}</h3><small>${myData.school}</small>`;
            loadLobbyData();
        }

        function loadLobbyData() {
            // 1. Find other students to challenge
            db.collection("academy_players").limit(20).get().then(snap => {
                let html = "";
                snap.forEach(doc => {
                    if(doc.id !== myId) {
                        const p = doc.data();
                        html += `<div class="item-row" onclick="createChallenge('${doc.id}')">
                            <span>${p.avatar} <strong>${p.name}</strong><br><small>${p.school}</small></span>
                            <span class="badge">CHALLENGE</span>
                        </div>`;
                    }
                });
                document.getElementById('available-players').innerHTML = html || "No other students online yet.";
            });

            // 2. Listen for active matches
            db.collection("academy_matches").where("players", "array-contains", myId)
                .onSnapshot(snap => {
                    let html = "";
                    snap.forEach(doc => {
                        const m = doc.data();
                        const opp = m.white === myId ? m.black : m.white;
                        const turn = m.fen.split(' ')[1] === (m.white === myId ? 'w' : 'b') ? "YOUR TURN" : "WAITING";
                        html += `<div class="item-row" onclick="loadGame('${doc.id}')">
                            <span>VS ${opp.toUpperCase()}</span>
                            <span class="badge" style="background:${turn === "YOUR TURN" ? '#4ade80' : '#555'}">${turn}</span>
                        </div>`;
                    });
                    document.getElementById('match-list').innerHTML = html || "No active games. Challenge someone!";
                });
        }

        // --- MATCHMAKING ---
        function createChallenge(oppId) {
            const matchId = [myId, oppId].sort().join("_vs_");
            db.collection("academy_matches").doc(matchId).set({
                players: [myId, oppId],
                white: myId,
                black: oppId,
                fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
                updated: firebase.firestore.FieldValue.serverTimestamp()
            }, {merge: true}).then(() => loadGame(matchId));
        }

        // --- GAMEPLAY ENGINE ---
        function loadGame(id) {
            activeMatchId = id;
            $(".container").addClass("hidden");
            $("#section-game").removeClass("hidden");

            if(!board) {
                board = ChessBoard('myBoard', {
                    draggable: false, // CLICK-TO-MOVE ONLY
                    position: 'start',
                    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
                });
                $('#myBoard').on('click', '.square-55d63', onSquareClick);
            }

            db.collection("academy_matches").doc(id).onSnapshot(doc => {
                const data = doc.data();
                game.load(data.fen);
                board.position(data.fen);
                board.orientation(data.white === myId ? 'white' : 'black');
                document.getElementById('label-white').innerText = data.white;
                document.getElementById('label-black').innerText = data.black;
                updateStatus(data);
            });
        }

        function onSquareClick() {
            const square = $(this).attr('data-square');
            const piece = game.get(square);
            const myColor = game.load(game.fen()) && (game.turn() === 'w' ? 'white' : 'black');
            
            // Check if it's actually our turn based on orientation
            if(board.orientation() !== myColor) return;

            if (selectedSq === null) {
                if (piece && piece.color === game.turn()) {
                    selectedSq = square;
                    $(`.square-${square}`).addClass('highlight-selected');
                }
            } else {
                const move = game.move({ from: selectedSq, to: square, promotion: 'q' });
                $('.square-55d63').removeClass('highlight-selected');
                selectedSq = null;

                if (move) {
                    board.position(game.fen());
                    db.collection("academy_matches").doc(activeMatchId).update({
                        fen: game.fen(),
                        updated: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            }
        }

        function updateStatus(data) {
            let status = "";
            const isMyTurn = game.turn() === (data.white === myId ? 'w' : 'b');
            
            if (game.in_checkmate()) status = "Checkmate! Game Over.";
            else if (game.in_draw()) status = "Draw!";
            else status = isMyTurn ? "🟢 YOUR TURN" : "⏳ Opponent's Turn";
            
            document.getElementById('game-status').innerText = status;
        }
    </script>
</body>
</html>
