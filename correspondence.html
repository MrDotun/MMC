<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Correspondence Arena</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #2D1B4D; --secondary: #4ade80; --bg: #1a1a2e; --text: #ffffff; --card: #24243e; --danger: #ef4444; --accent: #3b82f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; background: var(--card); padding: 20px; border-radius: 12px; box-sizing: border-box; margin-bottom: 20px; border: 1px solid #333; }
        .hidden { display: none !important; }
        h2, h3 { color: var(--secondary); text-align: center; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; font-size: 1.1em; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 2px solid var(--secondary); background: var(--bg); color: white; box-sizing: border-box; font-size: 16px; }
        
        .btn { padding: 14px; cursor: pointer; border-radius: 8px; border: 1px solid var(--secondary); background: var(--primary); color: var(--secondary); font-weight: bold; width: 100%; margin-bottom: 10px; text-transform: uppercase; transition: 0.3s; font-size: 14px; outline: none; }
        .btn:hover { background: var(--secondary); color: var(--bg); }
        
        .btn-danger { border-color: var(--danger); color: var(--danger); background: transparent; padding: 12px; font-size: 12px; width: 100%; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; }
        .btn-danger:hover { background: var(--danger); color: white; }

        #match-list, #available-players, #spectate-match-list, #leaderboard, #admin-player-list { 
            max-height: 200px; overflow-y: auto; margin-bottom: 15px; 
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 10px; }

        .item-row { background: var(--primary); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; cursor: pointer; }
        .rating-badge { background: var(--secondary); color: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 0.8em; font-weight: 800; }
        .mini-btn-del { background: var(--danger); color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .highlight-sq { background: rgba(74, 222, 128, 0.5) !important; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .profile-card { background: var(--card); border: 2px solid var(--secondary); padding: 25px; border-radius: 15px; width: 300px; text-align: center; }
        .name-clickable { text-decoration: underline; cursor: pointer; color: var(--secondary); }
        
        #timer-display { font-size: 0.9em; color: var(--danger); margin-bottom: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary); margin-bottom: 20px; font-style: italic;">♟️ ARENA</h1>

    <div id="profile-modal" class="modal-overlay hidden">
        <div class="profile-card">
            <h2 id="prof-name">--</h2>
            <p><strong>School:</strong> <span id="prof-school">--</span></p>
            <p><strong>Age:</strong> <span id="prof-age">--</span> | <strong>Class:</strong> <span id="prof-class">--</span></p>
            <p style="font-style: italic; color: #aaa; border-top: 1px solid #333; padding-top: 10px;">"<span id="prof-quote">--</span>"</p>
            <button class="btn" style="margin-top: 10px;" onclick="$('#profile-modal').addClass('hidden')">Close</button>
        </div>
    </div>

    <div id="section-register" class="container">
        <h2>Student Access</h2>
        <input type="text" id="reg-name" placeholder="Full Name">
        <input type="text" id="reg-school" placeholder="School Name">
        <div style="display: flex; gap: 10px;">
            <input type="number" id="reg-age" placeholder="Age" style="width: 40%;">
            <input type="text" id="reg-class" placeholder="Class/Grade" style="width: 60%;">
        </div>
        <input type="text" id="reg-quote" placeholder="Your Chess Quote (e.g. Checkmate!)">
        <select id="reg-avatar">
            <option value="🦁">Brave Lion</option>
            <option value="🦅">Eagle Eye</option>
            <option value="🐍">Tactical Cobra</option>
            <option value="👑">Academy Admin</option>
        </select>
        <input type="password" id="reg-password" placeholder="PIN or Admin Code">
        <button class="btn" onclick="handleRegister()">Enter Arena</button>
        <button class="btn" style="border-color:#888; color:#888;" onclick="enterAsGuest()">Spectate as Guest</button>
    </div>

    <div id="section-lobby" class="container hidden">
        <div id="user-welcome" style="text-align:center; margin-bottom:15px;"></div>
        
        <div id="match-section">
            <h3>⚔️ Active Matches</h3>
            <div id="match-list"></div>
        </div>

        <h3>🏆 Leaderboard</h3>
        <div id="leaderboard"></div>

        <div id="challenge-section">
            <h3>🤝 Challenge Students</h3>
            <div id="available-players">Searching for players...</div>
        </div>

        <h3>👁️ Spectate Arena</h3>
        <div id="spectate-match-list"></div>

        <div id="admin-panel" class="hidden" style="margin-top: 30px; border-top: 2px dashed var(--danger); padding-top: 15px;">
            <h3 style="color: var(--danger); font-size: 0.9em; margin-bottom: 10px;">🛠️ Instructor Tools</h3>
            <button class="btn-danger" onclick="resetRatings()">Reset All Ratings to 1500</button>
            <div id="admin-player-list"></div>
        </div>
    </div>

    <div id="section-game" class="container hidden">
        <div id="timer-display">Match Deadline: Calculating...</div>
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size: 0.85em; font-weight: bold; color: #aaa;">
            <span id="label-white">White: --</span>
            <span style="color:var(--secondary)">VS</span>
            <span id="label-black">Black: --</span>
        </div>
        <div id="myBoard" style="width: 100%; border: 2px solid var(--secondary); border-radius: 8px; margin-bottom: 15px;"></div>
        <div id="game-status" style="text-align:center; font-weight:bold; color:var(--secondary); margin-bottom:15px;">Loading...</div>
        
        <button class="btn-danger" id="resign-btn" onclick="confirmResign()">🏳️ Resign Match</button>
        <button class="btn" onclick="showLobby()">Back to Lobby</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let game = new Chess(), board = null, myId = null, myData = null, activeMatchId = null, sourceSquare = null, timerInterval = null;

        async function handleRegister() {
            const rawName = document.getElementById('reg-name').value.trim();
            const school = document.getElementById('reg-school').value.trim();
            const age = document.getElementById('reg-age').value.trim();
            const cls = document.getElementById('reg-class').value.trim();
            const quote = document.getElementById('reg-quote').value.trim();
            const pin = document.getElementById('reg-password').value.trim();
            
            if(!rawName || !school || !pin) return alert("Fill all fields!");

            const userId = rawName.toLowerCase().replace(/\s/g, '_');
            const isAdmin = (pin === "decipher1234"); 
            
            const docRef = db.collection("academy_players").doc(userId);
            const doc = await docRef.get();
            
            if(doc.exists && !isAdmin && doc.data().pin !== pin) {
                return alert("Incorrect PIN for this name.");
            }
            
            myData = doc.exists ? doc.data() : { 
                name: rawName, school, age, class: cls, quote, avatar: $('#reg-avatar').val(), 
                rating: 1500, pin, role: isAdmin ? "admin" : "student"
            };
            
            await docRef.set(myData, { merge: true });
            myId = userId;
            showLobby();
        }

        function enterAsGuest() {
            myId = "guest_" + Date.now();
            myData = { name: "Guest", role: "guest", rating: 0, avatar: "👁️" };
            showLobby();
        }

        function showLobby() {
            clearInterval(timerInterval);
            $(".container").addClass("hidden");
            $("#section-lobby").removeClass("hidden");
            document.getElementById('user-welcome').innerHTML = `<h3>${myData.avatar} ${myData.name} <span class="rating-badge">${myData.rating} pts</span></h3>`;
            
            if(myData.role === "guest") {
                $("#match-section, #challenge-section").hide();
            }

            if(myData.role === "admin") {
                $("#admin-panel").removeClass("hidden");
                loadAdminList();
            }
            loadLobbyData();
        }

        function loadLobbyData() {
            db.collection("academy_players").orderBy("rating", "desc").limit(10).onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    const p = doc.data();
                    html += `<div class="item-row" style="cursor:default;">
                                <span class="name-clickable" onclick="viewProfile('${doc.id}')">${p.name}</span>
                                <span class="rating-badge">${p.rating}</span>
                             </div>`;
                });
                document.getElementById('leaderboard').innerHTML = html;
            });

            if(myData.role !== "guest") {
                db.collection("academy_players").limit(50).onSnapshot(snap => {
                    let html = "";
                    snap.forEach(doc => {
                        if(doc.id !== myId) {
                            const p = doc.data();
                            html += `<div class="item-row">
                                <span onclick="viewProfile('${doc.id}')" class="name-clickable" style="font-size: 13px;">${p.name} <small style="display:block; color:#888;">${p.school}</small></span>
                                <button class="rating-badge" onclick="createMatch('${doc.id}')" style="border:none; cursor:pointer;">CHALLENGE</button>
                            </div>`;
                        }
                    });
                    document.getElementById('available-players').innerHTML = html || "Waiting for students...";
                });

                db.collection("academy_matches").where("players", "array-contains", myId).where("status", "==", "active").onSnapshot(snap => {
                    let html = "";
                    snap.forEach(doc => {
                        const d = doc.data();
                        const opp = d.white === myId ? d.black : d.white;
                        html += `<button class="btn" onclick="loadGame('${doc.id}')">VS ${opp.replace(/_/g,' ').toUpperCase()}</button>`;
                    });
                    document.getElementById('match-list').innerHTML = html || "No active games.";
                });
            }

            db.collection("academy_matches").where("status", "==", "active").onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    html += `<button class="btn" style="border-color:#aaa; color:#aaa;" onclick="loadGame('${doc.id}')">👁️ ${d.white} vs ${d.black}</button>`;
                });
                document.getElementById('spectate-match-list').innerHTML = html || "No live matches.";
            });
        }

        async function viewProfile(id) {
            const doc = await db.collection("academy_players").doc(id).get();
            if(doc.exists) {
                const p = doc.data();
                document.getElementById('prof-name').innerText = p.avatar + " " + p.name;
                document.getElementById('prof-school').innerText = p.school || "N/A";
                document.getElementById('prof-age').innerText = p.age || "??";
                document.getElementById('prof-class').innerText = p.class || "??";
                document.getElementById('prof-quote').innerText = p.quote || "Let's play chess!";
                $('#profile-modal').removeClass('hidden');
            }
        }

        function updatePoints(winnerId, loserId, type) {
            const winRef = db.collection("academy_players").doc(winnerId);
            const loseRef = db.collection("academy_players").doc(loserId);
            
            db.runTransaction(async (transaction) => {
                const wDoc = await transaction.get(winRef);
                const lDoc = await transaction.get(loseRef);
                if(!wDoc.exists || !lDoc.exists) return;
                const diff = lDoc.data().rating - wDoc.data().rating;
                let points = 11;
                if(diff > 50) points = 13;
                if(diff < -50) points = 10;
                transaction.update(winRef, { rating: firebase.firestore.FieldValue.increment(points) });
                transaction.update(loseRef, { rating: firebase.firestore.FieldValue.increment(-points) });
            });
        }

        function loadGame(id) {
            activeMatchId = id;
            $(".container").addClass("hidden");
            $("#section-game").removeClass("hidden");
            if(!board) {
                board = ChessBoard('myBoard', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
                $('#myBoard').on('click', '.square-55d63', onSquareClick);
            }
            db.collection("academy_matches").doc(id).onSnapshot(doc => {
                const d = doc.data();
                if(!d || d.status !== "active") return;

                clearInterval(timerInterval);
                if(d.updated) {
                    const lastMove = d.updated.toDate();
                    const deadline = new Date(lastMove.getTime() + (3 * 24 * 60 * 60 * 1000));
                    
                    timerInterval = setInterval(() => {
                        const now = new Date();
                        const diff = deadline - now;
                        if(diff <= 0) {
                            clearInterval(timerInterval);
                            const loser = game.turn() === 'w' ? d.white : d.black;
                            const winner = game.turn() === 'w' ? d.black : d.white;
                            db.collection("academy_matches").doc(id).update({ status: "forfeit" });
                            updatePoints(winner, loser, 'timeout');
                            alert("Forfeit: Time limit exceeded (3 days).");
                            showLobby();
                        } else {
                            const hours = Math.floor(diff / 3600000);
                            const mins = Math.floor((diff % 3600000) / 60000);
                            document.getElementById('timer-display').innerText = `⏳ Move within: ${hours}h ${mins}m`;
                        }
                    }, 1000);
                }

                game.load(d.fen); board.position(d.fen);
                if(game.in_checkmate()) {
                    const winner = game.turn() === 'w' ? d.black : d.white;
                    const loser = game.turn() === 'w' ? d.white : d.black;
                    db.collection("academy_matches").doc(id).update({ status: "checkmate" });
                    updatePoints(winner, loser, 'mate');
                }

                document.getElementById('label-white').innerText = `White: ${d.white}`;
                document.getElementById('label-black').innerText = `Black: ${d.black}`;
                const isPlayer = (myId === d.white || myId === d.black);
                if(isPlayer) {
                    board.orientation(myId === d.white ? 'white' : 'black');
                    document.getElementById('game-status').innerText = (game.turn() === (myId === d.white ? 'w' : 'b')) ? "🟢 YOUR TURN" : "⏳ OPPONENT'S TURN";
                    $("#resign-btn").show();
                } else {
                    board.orientation('white');
                    document.getElementById('game-status').innerText = "👁️ SPECTATING";
                    $("#resign-btn").hide();
                }
            });
        }

        function onSquareClick() {
            if (!activeMatchId) return;
            const square = $(this).attr('data-square');
            db.collection("academy_matches").doc(activeMatchId).get().then(doc => {
                const d = doc.data();
                if (game.turn() === 'w' && myId !== d.white) return;
                if (game.turn() === 'b' && myId !== d.black) return;
                if (sourceSquare === null) {
                    if (game.get(square) && game.get(square).color === game.turn()) {
                        sourceSquare = square; $('.square-55d63').removeClass('highlight-sq'); $(this).addClass('highlight-sq');
                    }
                } else {
                    const move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                    if (move) {
                        sourceSquare = null; $('.square-55d63').removeClass('highlight-sq');
                        db.collection("academy_matches").doc(activeMatchId).update({ fen: game.fen(), updated: firebase.firestore.FieldValue.serverTimestamp() });
                    } else {
                        sourceSquare = null; $('.square-55d63').removeClass('highlight-sq');
                    }
                }
            });
        }

        function confirmResign() {
            if(confirm("Resign?")) {
                db.collection("academy_matches").doc(activeMatchId).get().then(doc => {
                    const d = doc.data();
                    const winner = myId === d.white ? d.black : d.white;
                    db.collection("academy_matches").doc(activeMatchId).update({ status: "resigned" });
                    updatePoints(winner, myId, 'resign');
                    showLobby();
                });
            }
        }

        function createMatch(oppId) {
            const matchId = [myId, oppId].sort().join("_vs_");
            db.collection("academy_matches").doc(matchId).set({ 
                players: [myId, oppId], white: myId, black: oppId, 
                fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", 
                status: "active", updated: firebase.firestore.FieldValue.serverTimestamp() 
            }, {merge: true}).then(() => loadGame(matchId));
        }

        function loadAdminList() {
            db.collection("academy_players").onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    if(doc.id !== myId) html += `<div class="item-row"><span>${doc.data().name}</span><button class="mini-btn-del" onclick="deletePlayer('${doc.id}')">DEL</button></div>`;
                });
                document.getElementById('admin-player-list').innerHTML = html;
            });
        }

        function deletePlayer(id) { if(confirm("Delete?")) db.collection("academy_players").doc(id).delete(); }

        function resetRatings() {
            if(confirm("Reset all ratings to 1500?")) {
                db.collection("academy_players").get().then(snap => {
                    snap.forEach(doc => doc.ref.update({ rating: 1500 }));
                });
            }
        }
    </script>
</body>
</html>
