<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Task: Opening Principles</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        #welcome-overlay { width: 100%; min-height: 100vh; background: #0f172a; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .login-card { background: #1e293b; padding: 25px; border-radius: 15px; border: 2px solid #4ade80; width: 85%; max-width: 400px; text-align: center; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .login-card input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 16px; }
        #game-container { display: none; width: 95%; max-width: 500px; padding: 10px; margin-top: 10px; }
        .info-panel { background: #1e293b; padding: 15px; border-radius: 15px; border: 1px solid #4ade80; text-align: center; }
        #board { width: 100%; aspect-ratio: 1 / 1; margin: 15px 0; border: 4px solid #4ade80; border-radius: 8px; background-color: #334155; }
        .submit-btn { background: #4ade80; color: #0f172a; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 16px; }
        #grade { font-size: 1.1em; font-weight: bold; color: #4ade80; margin: 5px 0; }
        #remark { font-weight: 500; min-height: 3.5em; margin: 10px 0; line-height: 1.4; }
        .highlight-white { background: rgba(251, 191, 36, 0.6) !important; }
        .league-grid { width: 90%; max-width: 500px; }
        .table-container { background: #1e293b; border-radius: 12px; padding: 15px; border: 1px solid #334155; }
        .league-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        .league-table th { color: #4ade80; text-align: left; padding: 8px; border-bottom: 2px solid #334155; }
        .league-table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .top-performer-card { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; width: 85%; border: 2px solid white; box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
        .school-tag { font-size: 0.75em; color: #94a3b8; display: block; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div id="top-scorer-spot"></div>
    <div class="login-card">
        <h2 style="color: #4ade80; margin-top:0;">Week 3 Task</h2>
        <p style="margin-top:-10px; color:#94a3b8; font-size:0.9em;">Opening Principles</p>
        <input type="text" id="studentName" placeholder="Full Name">
        <input type="text" id="studentClass" placeholder="Class">
        <input type="text" id="studentSchool" placeholder="School">
        <input type="password" id="studentPass" placeholder="Secret Password">
        <button class="submit-btn" onclick="startGame()">START TASK</button>
    </div>
    <div class="league-grid">
        <div class="table-container">
            <h3 style="text-align:center; color:#4ade80; margin-top:0;">🏆 League Standings</h3>
            <table class="league-table">
                <thead><tr><th>Player</th><th style="text-align:right;">Pts</th></tr></thead>
                <tbody id="player-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <div id="displayName" style="color:#4ade80; font-weight:bold;"></div>
        <div id="grade">Time: 15s | Score: 0</div>
        <div id="board"></div>
        <p id="remark">Loading pieces...</p>
        <div id="status" style="font-size:0.8em; color:#94a3b8; font-weight: bold;"></div>
        <canvas id="certCanvas" style="display:none;"></canvas>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
// --- DATABASE: OPENING PRINCIPLES (30 Qs) ---
const quizData = [
    { text: "Principle 1: Control the Center. What is White's best first move?", fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", correctMove: "e4" },
    // FIXED Q2: Knight at g1 and g8
    { text: "Principle 2: Develop Pieces. Attack the e5 pawn and develop your Knight!", fen: "rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2", correctMove: "Nf3" },
    { text: "Principle 3: King Safety. You are ready to castle. Secure the King!", fen: "r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4", correctMove: "O-O" },
    { text: "Don't bring the Queen out too early! Black played d5. Capture the pawn with your e4 pawn!", fen: "rnbqkbnr/ppp1pppp/8/3p4/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2", correctMove: "exd5" },
    { text: "Italian Game: Develop your light-squared bishop to attack the weak f7 square.", fen: "r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 3 3", correctMove: "Bc4" },
    { text: "Defense: White's Queen is aiming at f7. Block with your pawn!", fen: "r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 3 3", correctMove: "g6" },
    { text: "Fried Liver: White's Knight is attacking f7. Develop Nf6 to prepare.", fen: "r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 6 4", correctMove: "Ng5" },
    { text: "Sicilian Defense: Fight for the center using your c-pawn.", fen: "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1", correctMove: "c5" },
    { text: "French Defense: Support your center challenge by moving e6.", fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR b KQkq - 0 1", correctMove: "e6" },
    { text: "The Queen's Gambit: Offer the c-pawn to control d5.", fen: "rnbqkbnr/ppp1pppp/8/3p4/3P4/8/PPP1PPPP/RNBQKBNR w KQkq - 0 2", correctMove: "c4" },
    { text: "Develop the Knight to c3 to guard the center.", fen: "rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 1", correctMove: "Nc3" },
    { text: "Fianchetto: Move g3 to prepare your Bishop's development.", fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", correctMove: "g3" },
    { text: "The Caro-Kann: Prepare d5 by moving the c-pawn to c6.", fen: "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1", correctMove: "c6" },
    { text: "Scandinavian: Attack the e4 pawn immediately with d5!", fen: "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1", correctMove: "d5" },
    { text: "Space: Push d4 to control the full center.", fen: "rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 1", correctMove: "d4" },
    { text: "Don't move twice! Instead of moving the Knight again, develop your Bishop.", fen: "r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 3 3", correctMove: "Bc4" },
    { text: "Ruy Lopez: Put pressure on the c6 Knight with your Bishop.", fen: "r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 3 3", correctMove: "Bb5" },
    { text: "Free the Bishop: Move d6 to let your light-squared bishop out.", fen: "r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 3 3", correctMove: "d6" },
    { text: "London System: Develop the dark bishop to f4.", fen: "rnbqkb1r/pppppppp/5n2/8/3P4/8/PPP1PPPP/RNBQKBNR w KQkq - 1 2", correctMove: "Bf4" },
    { text: "Connect Rooks: Move your Queen to d2 after development.", fen: "r1bq1rk1/ppp1bppp/2np1n2/4p3/3PP3/2N2N2/PPP1BPPP/R1BQ1RK1 w - - 5 7", correctMove: "Qd2" },
    { text: "Challenge d4: Put pressure on the center with Nc6.", fen: "rnbqkbnr/ppp2ppp/8/3pp3/3PP3/8/PPP2PPP/RNBQKBNR b KQkq - 0 3", correctMove: "Nc6" },
    { text: "Solidify: Support your e4 pawn by moving d3.", fen: "r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 3 3", correctMove: "d3" },
    { text: "Develop: Bring the King's Knight to f3.", fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", correctMove: "Nf3" },
    { text: "Castle Long: Clear the Queen to d2 to castle Queenside.", fen: "r3kbnr/pppq1ppp/2np4/4p3/3PP3/5N2/PPP1BPPP/RNBQK2R w KQkq - 1 6", correctMove: "Qd2" },
    { text: "Fianchetto Finish: Put the Bishop on g2.", fen: "rnbqkbnr/pppppppp/8/8/8/6P1/PPPPPP1P/RNBQKBNR w KQkq - 1 2", correctMove: "Bg2" },
    { text: "Sicilian Challenge: White plays d4 to open the center. Move d4.", fen: "r1bqkbnr/pp1ppppp/2n5/2p5/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3", correctMove: "d4" },
    { text: "Counter: Capture the d4 pawn with your c-pawn.", fen: "r1bqkbnr/pp1ppppp/2n5/8/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq - 0 3", correctMove: "cxd4" },
    { text: "King Safety: Black is ready to castle. Move O-O.", fen: "r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/2N2N2/PPPP1PPP/R1BQK2R b KQkq - 5 4", correctMove: "O-O" },
    { text: "Development: Move your Bishop to b4 to put pressure on the c3 Knight and get ready to castle.", fen: "rnbqk2r/pppp1ppp/5n2/4p3/2B1P3/2N2N2/PPPP1PPP/R1BQK2R b KQkq - 5 4", correctMove: "Bb4" },
    { text: "Final Goal: Move e4 to dominate the center!", fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", correctMove: "e4" }
];

// Firebase Setup
const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const collectionName = "opening_principles_week3"; 

var game = new Chess(), board = null, sourceSquare = null;
var currentQuestionIdx = 0, score = 0, docId = "", timeLeft = 15, timerInterval = null;

function initLeagues() {
    db.collection(collectionName).onSnapshot((snap) => {
        let players = [];
        snap.forEach(doc => players.push(doc.data()));
        players.sort((a, b) => (b.totalPoints || 0) - (a.totalPoints || 0));
        if (players.length > 0) {
            const top = players[0];
            $('#top-scorer-spot').html(`<div class="top-performer-card"><h4>⭐ WEEK 3 TOP SCORER ⭐</h4><h2>${top.name}</h2><div><b>${top.totalPoints} Pts</b> | ${top.school}</div></div>`);
        }
        let pHTML = "";
        players.slice(0, 10).forEach((p, i) => { pHTML += `<tr><td><b>${i + 1}. ${p.name}</b><span class="school-tag">${p.school}</span></td><td style="text-align:right">${p.totalPoints || 0}</td></tr>`; });
        $('#player-body').html(pHTML);
    });
}
initLeagues();

async function clearStudentList() {
    if (confirm("Are you sure you want to delete ALL students and scores for this task?")) {
        const snapshot = await db.collection(collectionName).get();
        const batch = db.batch();
        snapshot.docs.forEach((doc) => batch.delete(doc.ref));
        await batch.commit();
        alert("League Standings Cleared Successfully!");
        location.reload();
    }
}

async function startGame() {
    const name = $('#studentName').val().trim();
    const sClass = $('#studentClass').val().trim();
    const school = $('#studentSchool').val().trim();
    const pass = $('#studentPass').val().trim();

    if (pass === "decipher1234") return clearStudentList();
    if (!name || !sClass || !school || !pass) return alert("Fill all fields!");
    
    docId = name + "_" + sClass;
    const docRef = db.collection(collectionName).doc(docId);
    const doc = await docRef.get();
    
    if (doc.exists && doc.data().password !== pass) return alert("Wrong password!");
    if (!doc.exists) await docRef.set({ name, class: sClass, school, password: pass, totalPoints: 0 });

    $('#displayName').text(name); $('#welcome-overlay').hide(); $('#game-container').show();
    board.resize(); loadQuestion();
}

function loadQuestion() {
    if (currentQuestionIdx >= quizData.length) return showFinalResults();
    const q = quizData[currentQuestionIdx];
    game.load(q.fen); board.position(q.fen); board.orientation(game.turn() === 'w' ? 'white' : 'black');
    $('#remark').text(q.text).css("color", "white"); $('#status').text(`TASK ${currentQuestionIdx + 1} OF 30`);
    startTimer();
}

function startTimer() {
    clearInterval(timerInterval); timeLeft = 15;
    timerInterval = setInterval(() => {
        timeLeft--; $('#grade').text(`Time: ${timeLeft}s | Score: ${score}`);
        if (timeLeft <= 0) { clearInterval(timerInterval); currentQuestionIdx++; loadQuestion(); }
    }, 1000);
}

$('#board').on('click', '[class*="square-"]', function() {
    let sq = $(this).attr('data-square');
    if (!sourceSquare) {
        let p = game.get(sq); if (p && p.color === game.turn()) { sourceSquare = sq; $('.square-' + sq).addClass('highlight-white'); }
    } else {
        let move = game.move({ from: sourceSquare, to: sq, promotion: 'q' });
        $('.highlight-white').removeClass('highlight-white'); sourceSquare = null;
        if (move) { board.position(game.fen()); checkAnswer(move.san); }
    }
});

async function checkAnswer(moveSan) {
    if (moveSan === quizData[currentQuestionIdx].correctMove) {
        clearInterval(timerInterval); score++; currentQuestionIdx++;
        await db.collection(collectionName).doc(docId).update({ totalPoints: score });
        setTimeout(loadQuestion, 1000);
    } else { setTimeout(() => { game.undo(); board.position(game.fen()); }, 500); }
}

function showFinalResults() {
    let certBtn = score >= 20 ? `<button class="submit-btn" style="background:#fbbf24;" onclick="generateCertificate()">📜 DOWNLOAD CERTIFICATE</button>` : "";
    $('#game-container').html(`<div class="info-panel"><h2>Week 3 Task Complete</h2><div style="font-size:3.5em; margin:15px 0;">${score}/30</div>${certBtn}<button class="submit-btn" onclick="location.reload()">HOME</button></div>`);
}

function generateCertificate() {
    const canvas = document.getElementById('certCanvas'); const ctx = canvas.getContext('2d');
    canvas.width = 800; canvas.height = 600;
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,800,600);
    ctx.strokeStyle = '#d97706'; ctx.lineWidth = 15; ctx.strokeRect(20,20,760,560);
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.strokeRect(35,35,730,530);
    ctx.fillStyle = '#0f172a'; ctx.textAlign = 'center';
    ctx.font = 'bold 38px Georgia'; ctx.fillText('DECIPHER CHESS ACADEMY', 400, 100);
    ctx.font = '22px Arial'; ctx.fillText('CERTIFICATE OF COMPLETION', 400, 150);
    ctx.font = 'italic 20px Georgia'; ctx.fillText('This certifies that', 400, 220);
    ctx.fillStyle = '#d97706'; ctx.font = 'bold 45px Arial'; ctx.fillText($('#studentName').val().toUpperCase(), 400, 280);
    ctx.fillStyle = '#0f172a'; ctx.font = '20px Arial'; ctx.fillText('has successfully mastered the concepts of', 400, 340);
    ctx.font = 'bold 26px Arial'; ctx.fillText('WEEK 3: OPENING PRINCIPLES', 400, 380);
    ctx.beginPath(); ctx.arc(400, 480, 50, 0, Math.PI * 2); ctx.fillStyle = '#fbbf24'; ctx.fill();
    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 25px Arial'; ctx.fillText(`${score}/30`, 400, 485);
    ctx.font = '12px Arial'; ctx.fillText('SCORE', 400, 505);
    const link = document.createElement('a'); link.download = 'Opening_Principles_Certificate.png'; link.href = canvas.toDataURL(); link.click();
}

board = ChessBoard('board', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
$(window).resize(() => board.resize());
</script>
</body>
</html>
