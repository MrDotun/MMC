<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decipher Chess Academy | League Portal</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; }
        #welcome-overlay { width: 100%; min-height: 100vh; background: #0f172a; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .login-card { background: #1e293b; padding: 25px; border-radius: 15px; border: 2px solid #4ade80; width: 90%; max-width: 400px; text-align: center; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .login-card input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .league-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 95%; max-width: 1000px; }
        .table-container { background: #1e293b; border-radius: 15px; border: 1px solid #334155; padding: 15px; flex: 1; min-width: 300px; }
        .league-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        .league-table th { color: #4ade80; border-bottom: 2px solid #334155; padding: 10px; text-align: left; }
        .league-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .top-performer-card { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); border: 2px solid white; }
        #game-container { display: none; width: 95vmin; max-width: 500px; padding: 20px 10px; }
        #board { width: 100%; border: 4px solid #4ade80; border-radius: 8px; margin: 15px 0; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .info-panel { background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #4ade80; text-align: center; }
        .submit-btn { background: #4ade80; color: #0f172a; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.2s; }
        .submit-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        #grade { font-size: 1.3em; font-weight: bold; color: #4ade80; margin-bottom: 10px; }
        #remark { font-weight: 500; min-height: 4em; margin: 10px 0; line-height: 1.4; }
        .highlight-white { background: rgba(251, 191, 36, 0.6) !important; }
        .school-tag { font-size: 0.75em; color: #94a3b8; display: block; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div id="top-scorer-spot"></div>
    <div class="login-card">
        <h1 style="color: #4ade80; margin: 0 0 15px 0;">Decipher Academy</h1>
        <p style="font-size: 0.9em; margin-bottom: 15px; color: #94a3b8;">Opening Principles League Test</p>
        <input type="text" id="studentName" placeholder="Full Name">
        <input type="text" id="studentClass" placeholder="Class">
        <input type="text" id="studentSchool" placeholder="School Name">
        <input type="password" id="studentPass" placeholder="Secret Password">
        <button class="submit-btn" onclick="startGame()">JOIN COMPETITION</button>
    </div>
    <div class="league-grid">
        <div class="table-container">
            <h3 style="text-align:center; color:#4ade80;">🏆 Top 10 Leaders</h3>
            <table class="league-table">
                <thead><tr><th>Player</th><th style="text-align:right;">Points</th></tr></thead>
                <tbody id="player-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h3 id="displayName" style="margin:0; color:#4ade80;"></h3>
        <div id="grade">Time: 15s | Score: 0</div>
        <div id="board"></div>
        <p id="remark">Preparing board...</p>
        <div id="status" style="font-size:0.9em; color:#94a3b8; font-weight: bold;"></div>
        <canvas id="certCanvas" style="display:none;"></canvas>
    </div>
</div>

<script>
// --- CHESS DATABASE (30 QUESTIONS) ---
const quizData = [
    { text: "White to move: Which move controls the center and prepares the Bishop/Queen?", fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", correctMove: "e4" },
    { text: "Black to move: Challenge the center! White played e4, what is the most common response?", fen: "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1", correctMove: "e5" },
    { text: "White to move: Develop your Knight to attack the e5 pawn!", fen: "rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 2", correctMove: "Nf3" },
    { text: "Black to move: Defend your e5 pawn by developing your Knight to c6.", fen: "rnbqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 3 2", correctMove: "Nc6" },
    { text: "White to move: The Italian Game! Move your Bishop to attack f7.", fen: "r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 3 3", correctMove: "Bc4" },
    { text: "White to move: The Ruy Lopez! Move your Bishop to attack the Knight on c6.", fen: "r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 3 3", correctMove: "Bb5" },
    { text: "White to move: Time to get safe! Perform a Kingside Castle.", fen: "r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4", correctMove: "O-O" },
    { text: "Black to move: Defend against Scholar's Mate. Move your g-pawn to block the Queen!", fen: "r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 3 3", correctMove: "g6" },
    { text: "White to move: Occupy the center with your Queen's pawn (d4).", fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", correctMove: "d4" },
    { text: "Black to move: Sicilian Defense! Use your c-pawn to fight for the center.", fen: "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1", correctMove: "c5" },
    { text: "White to move: Develop your second Knight to c3.", fen: "rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3", correctMove: "Nc3" },
    { text: "White to move: Open the path for your dark-squared Bishop by moving d3.", fen: "r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 3 3", correctMove: "d3" },
    { text: "Black to move: White left e4 hanging! Capture it with your Knight.", fen: "r1bqkbnr/pppp1ppp/2n5/8/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq - 0 3", correctMove: "Nxe4" },
    { text: "White to move: French Defense center control. Move d4 to support e4.", fen: "rnbqkbnr/pppp1ppp/4p3/8/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2", correctMove: "d4" },
    { text: "Black to move: Protect your King! Castle on the Kingside.", fen: "r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/2N2N2/PPPP1PPP/R1BQK2R b KQkq - 5 4", correctMove: "O-O" },
    { text: "White to move: Retreat your Bishop to a4 after Black plays a6.", fen: "r1bqkbnr/1ppp1ppp/p1n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 4", correctMove: "Ba4" },
    { text: "Black to move: Challenge White's e4 pawn (Scandinavian Defense).", fen: "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1", correctMove: "d5" },
    { text: "White to move: Take the center against the Caro-Kann (Black played c6).", fen: "rnbqkbnr/pp1ppppp/2p5/8/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2", correctMove: "d4" },
    { text: "White to move: Develop Knight to f3 in the Queen's Pawn opening.", fen: "rnbqkbnr/ppp1pppp/8/3p4/3P4/8/PPP1PPPP/RNBQKBNR w KQkq - 0 2", correctMove: "Nf3" },
    { text: "Black to move: Free your Bishop by moving the d6 pawn.", fen: "r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 3 3", correctMove: "d6" },
    { text: "White to move: Move your g-pawn to g3 to prepare a Fianchetto.", fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", correctMove: "g3" },
    { text: "Black to move: Control the center against the English (c4).", fen: "rnbqkbnr/pppppppp/8/8/2P5/8/PP1PPPPP/RNBQKBNR b KQkq - 0 1", correctMove: "e5" },
    { text: "White to move: Develop your light-squared Bishop to e2.", fen: "rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3", correctMove: "Be2" },
    { text: "White to move: Queen's Gambit! Play c4 to challenge d5.", fen: "rnbqkbnr/ppp1pppp/8/3p4/3P4/8/PPP1PPPP/RNBQKBNR w KQkq - 0 2", correctMove: "c4" },
    { text: "Black to move: Move Knight to f6 to attack the center.", fen: "rnbqkbnr/pppppppp/8/8/3P4/8/PPP1PPPP/RNBQKBNR b KQkq - 0 1", correctMove: "Nf6" },
    { text: "White to move: King's Gambit! Play f4.", fen: "rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2", correctMove: "f4" },
    { text: "White to move: Develop your first Knight to c3.", fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", correctMove: "Nc3" },
    { text: "Black to move: Develop Knight to f6.", fen: "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1", correctMove: "Nf6" },
    { text: "White to move: Develop your dark Bishop to f4 (London System style).", fen: "rnbqkb1r/1p1p1ppp/p3pn2/8/3P1B2/5N2/PPP2PPP/RN1QKB1R w KQkq - 0 6", correctMove: "Bf4" },
    { text: "Final Question! White to move: Develop your last Knight to f3.", fen: "rnbqkb1r/pppppppp/8/8/8/2N5/PPPPPPPP/R1BQKBNR w KQkq - 1 2", correctMove: "Nf3" }
];

// Firebase API
const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// SFX
const sfxCorrect = new Audio('https://actions.google.com/sounds/v1/cartoon/clink_clanking.ogg');
const sfxWrong = new Audio('https://actions.google.com/sounds/v1/cartoon/boing.ogg');
const sfxStreak = new Audio('https://actions.google.com/sounds/v1/foley/brass_bell_ring.ogg');
const sfxTimeout = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

var game = new Chess(), board = null, sourceSquare = null;
var currentQuestionIdx = 0, score = 0, streak = 0, docId = "", timeLeft = 15, timerInterval = null, isFirstTry = true, missedQuestions = [];

function initLeagues() {
    db.collection("leaderboard").onSnapshot((snap) => {
        let players = [];
        snap.forEach(doc => players.push(doc.data()));
        players.sort((a, b) => (b.totalPoints || 0) - (a.totalPoints || 0));

        if (players.length > 0) {
            const top = players[0];
            $('#top-scorer-spot').html(`
                <div class="top-performer-card">
                    <h4>⭐ WEEKLY TOP SCORER ⭐</h4>
                    <h2>${top.name}</h2>
                    <div><b>${top.totalPoints} Pts</b> | ${top.school}</div>
                </div>`);
        }
        let pHTML = "";
        players.slice(0, 10).forEach((p, i) => {
            pHTML += `<tr><td><b>${i + 1}. ${p.name}</b><span class="school-tag">${p.school}</span></td><td style="text-align:right">${p.totalPoints || 0}</td></tr>`;
        });
        $('#player-body').html(pHTML);
    });
}
initLeagues();

async function startGame() {
    const name = $('#studentName').val().trim();
    const sClass = $('#studentClass').val().trim();
    const school = $('#studentSchool').val().trim();
    const pass = $('#studentPass').val().trim();
    if (!name || !sClass || !school || !pass) return alert("Fill all fields!");
    
    docId = name + "_" + sClass;
    const docRef = db.collection("leaderboard").doc(docId);
    const doc = await docRef.get();
    if (doc.exists && doc.data().password !== pass) return alert("Wrong password!");
    if (!doc.exists) await docRef.set({ name, class: sClass, school, password: pass, totalPoints: 0 });

    $('#displayName').text(name);
    $('#welcome-overlay').hide();
    $('#game-container').show();
    loadQuestion();
}

function loadQuestion() {
    if (currentQuestionIdx >= quizData.length) {
        clearInterval(timerInterval);
        showFinalResults();
        return;
    }
    isFirstTry = true;
    const q = quizData[currentQuestionIdx];
    game.load(q.fen);
    board.position(q.fen);
    board.orientation(game.turn() === 'w' ? 'white' : 'black');
    $('#remark').html(q.text).css("color", "white");
    $('#status').text(`QUESTION ${currentQuestionIdx + 1} OF 30`);
    startTimer();
}

function startTimer() {
    clearInterval(timerInterval);
    timeLeft = 15;
    updateStatsUI();
    timerInterval = setInterval(() => {
        timeLeft--;
        updateStatsUI();
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            sfxTimeout.play();
            missedQuestions.push(currentQuestionIdx);
            streak = 0;
            $('#remark').text("⏰ TIME'S UP! Move skipped.").css("color", "#fbbf24");
            setTimeout(() => { currentQuestionIdx++; loadQuestion(); }, 1500);
        }
    }, 1000);
}

function updateStatsUI() {
    let sText = streak >= 5 ? ` 🔥 STREAK: ${streak}` : ` STREAK: ${streak}`;
    $('#grade').text(`Time: ${timeLeft}s | Score: ${score}${sText}`);
    $('#grade').css("color", timeLeft <= 5 ? "#f87171" : "#4ade80");
}

function onSquareClick(sq) {
    if (timeLeft <= 0) return;
    if (!sourceSquare) {
        let p = game.get(sq);
        if (p && p.color === game.turn()) { 
            sourceSquare = sq; 
            $('.square-' + sq).addClass('highlight-white'); 
        }
        return;
    }
    let move = game.move({ from: sourceSquare, to: sq, promotion: 'q' });
    $('.highlight-white').removeClass('highlight-white');
    sourceSquare = null;
    if (!move) return;
    board.position(game.fen());
    checkAnswer(move.san);
}

async function checkAnswer(moveSan) {
    const correct = quizData[currentQuestionIdx].correctMove;
    if (moveSan === correct) {
        clearInterval(timerInterval);
        score++;
        if (isFirstTry) {
            streak++;
            if (streak === 5) { score += 2; sfxStreak.play(); $('#remark').html("🔥 ON FIRE! +2 Bonus Points!").css("color", "#fbbf24"); }
            else { sfxCorrect.play(); $('#remark').text("✨ EXCELLENT MOVE!"); }
        } else { streak = 0; sfxCorrect.play(); $('#remark').text("✅ CORRECT!"); }
        
        currentQuestionIdx++;
        await db.collection("leaderboard").doc(docId).update({ totalPoints: score });
        setTimeout(loadQuestion, 1200);
    } else {
        if (isFirstTry) missedQuestions.push(currentQuestionIdx);
        isFirstTry = false; streak = 0; sfxWrong.play();
        $('#remark').text("❌ WRONG MOVE. TRY AGAIN!").css("color", "#f87171");
        setTimeout(() => { game.undo(); board.position(game.fen()); }, 600);
    }
}

function showFinalResults() {
    let certBtn = score >= 25 ? `<button class="submit-btn" style="background:#fbbf24;" onclick="generateCertificate()">📜 DOWNLOAD CERTIFICATE</button>` : "";
    let reviewBtn = missedQuestions.length > 0 ? `<button class="submit-btn" style="background:#3b82f6; color:white;" onclick="startReview()">🔍 REVIEW MISTAKES</button>` : "";
    
    $('#game-container').html(`
        <div class="info-panel">
            <h2 style="color:#4ade80">Test Complete!</h2>
            <div style="font-size:3.5em; margin:15px 0;">${score}<span style="font-size:0.4em; color:#94a3b8;">/30</span></div>
            ${certBtn}
            ${reviewBtn}
            <button class="submit-btn" style="background:#334155; color:white;" onclick="location.reload()">BACK TO LEADERBOARD</button>
        </div>`);
}

function startReview() { currentQuestionIdx = 0; showNextReview(); }

function showNextReview() {
    if (currentQuestionIdx >= missedQuestions.length) { showFinalResults(); return; }
    const q = quizData[missedQuestions[currentQuestionIdx]];
    game.load(q.fen); board.position(q.fen); board.orientation(game.turn() === 'w' ? 'white' : 'black');
    $('#remark').html(`<b style="color:#f87171">REVIEW:</b> ${q.text}<br><br><span style="color:#4ade80">Correct Move: ${q.correctMove}</span>`);
    $('#status').html(`<button class="submit-btn" onclick="nextReviewItem()">NEXT MISTAKE (${currentQuestionIdx + 1}/${missedQuestions.length})</button>`);
    $('#grade').text("Reviewing Mistake Patterns");
}

function nextReviewItem() { currentQuestionIdx++; showNextReview(); }

function generateCertificate() {
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800; canvas.height = 600;
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,800,600);
    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 20; ctx.strokeRect(10,10,780,580);
    ctx.fillStyle = '#0f172a'; ctx.textAlign = 'center';
    ctx.font = 'bold 40px Arial'; ctx.fillText('DECIPHER CHESS ACADEMY', 400, 100);
    ctx.font = '30px Arial'; ctx.fillText('CERTIFICATE OF ACHIEVEMENT', 400, 160);
    ctx.font = 'italic 25px Arial'; ctx.fillText('This is awarded to', 400, 240);
    ctx.font = 'bold 50px Arial'; ctx.fillText($('#studentName').val().toUpperCase(), 400, 310);
    ctx.font = '22px Arial'; ctx.fillText('For Excellence in Chess Opening Principles', 400, 380);
    ctx.font = 'bold 30px Arial'; ctx.fillText(`FINAL SCORE: ${score} / 30`, 400, 440);
    const link = document.createElement('a');
    link.download = 'Decipher_Certificate.png'; link.href = canvas.toDataURL(); link.click();
}

board = ChessBoard('board', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
$('#board').on('click', '[class*="square-"]', function() { onSquareClick($(this).attr('data-square')); });
$(window).resize(() => board.resize());
</script>
</body>
</html>
