<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Variation Master Pro | Optimized</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chunk-card { border-left: 4px solid #d4af37; transition: all 0.2s; cursor: pointer; }
        .chunk-card.completed { border-left-color: #10b981; opacity: 0.5; }
        textarea { background: #0f172a !important; border: 1px solid #334155 !important; font-family: 'Fira Code', monospace; }
        textarea:focus { border-color: #d4af37 !important; outline: none; }
        #progress-fill { height: 100%; background: #d4af37; width: 0%; transition: width 0.4s; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="mb-10">
            <h1 class="text-3xl font-bold gold-text italic">DECIPHER <span class="text-white not-italic">GM-MASTER PRO</span></h1>
            <nav class="flex gap-2 mt-4">
                <button onclick="switchTab('fragmenter')" id="tab-f" class="px-4 py-2 rounded gold-bg text-xs font-bold uppercase">1. Fragmenter</button>
                <button onclick="switchTab('reassembler')" id="tab-r" class="px-4 py-2 rounded bg-slate-800 text-xs font-bold uppercase">2. Re-assembler</button>
            </nav>
        </header>

        <div id="view-fragmenter">
            <div class="glass p-6 rounded-2xl">
                <textarea id="pgn-input" rows="6" class="w-full p-4 rounded-xl text-sm mb-4" placeholder="Paste PGN here..."></textarea>
                <button onclick="processPgn()" class="px-6 py-3 bg-white text-black font-bold rounded-xl uppercase text-xs">Initialize Engine</button>
            </div>
            <div id="chunks-container" class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-6"></div>
        </div>

        <div id="view-reassembler" class="hidden">
            <div class="glass p-6 rounded-2xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <textarea id="ai-json" rows="14" class="w-full p-4 rounded-xl text-xs" placeholder="Paste JSON here..."></textarea>
                    <textarea id="final-pgn" rows="14" class="w-full p-4 rounded-xl text-xs text-emerald-400" readonly></textarea>
                </div>
                <button onclick="rebuildPgn()" class="mt-6 w-full py-4 gold-bg rounded-xl font-bold uppercase">Inject & Rebuild</button>
            </div>
        </div>
    </div>

    <script>
        let globalChunks = [];
        let pgnTokens = [];

        function switchTab(tab) {
            document.getElementById('view-fragmenter').classList.toggle('hidden', tab !== 'fragmenter');
            document.getElementById('view-reassembler').classList.toggle('hidden', tab !== 'reassembler');
        }

        function processPgn() {
            const input = document.getElementById('pgn-input').value;
            pgnTokens = input.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|\$\d+|[a-zA-Z0-9\-+=#\/]+[?!]*)/g) || [];
            globalChunks = pgnTokens.map((t, i) => ({ id: `CHUNK_${i}`, token: t, index: i }))
                                     .filter(c => /^[a-zA-Z]/.test(c.token) && !c.token.startsWith('['));
            
            const container = document.getElementById('chunks-container');
            container.innerHTML = globalChunks.map(c => `<div class="chunk-card glass p-3 text-xs">${c.id}: ${c.token}</div>`).join('');
        }

        function rebuildPgn() {
            const aiData = JSON.parse(document.getElementById('ai-json').value);
            // Create a copy of the original tokens array
            let resultTokens = [...pgnTokens];
            
            // Map modifications: 
            // We use a Map to store annotations by their original index
            // This prevents index shifting issues
            Object.keys(aiData).forEach(id => {
                const chunk = globalChunks.find(c => c.id === id);
                if (chunk) {
                    resultTokens[chunk.index] = `${chunk.token} { ${aiData[id]} }`;
                }
            });

            document.getElementById('final-pgn').value = resultTokens.join(" ");
        }
    </script>
</body>
</html>
