<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
/* ============================================================
   STOCKFISH WORKER
   ============================================================ */
let sfWorker = null, sfReady = false, sfBusy = false, sfHandler = null, sfChain = Promise.resolve();
let board = null;

function setStatus(text, kind) {
  const el = document.getElementById('sf-status');
  el.className = 'badge badge-' + (kind || 'load');
  el.innerText = text;
}

async function createSFWorker() {
  const cdns = [
    'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js',
    'https://unpkg.com/stockfish.js@10.0.2/stockfish.js'
  ];
  for (const url of cdns) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const code = await res.text();
      return new Worker(URL.createObjectURL(new Blob([code], { type: 'application/javascript' })));
    } catch (e) {}
  }
  return null;
}

async function initSF() {
  setStatus('Loading…', 'load');
  sfWorker = await createSFWorker();
  if (!sfWorker) { setStatus('Failed', 'off'); return; }
  sfWorker.onmessage = (e) => {
    const s = typeof e.data === 'string' ? e.data : (e.data && e.data.data) || '';
    if (!s) return;
    if (s === 'uciok') {
      sfReady = true;
      sfWorker.postMessage('setoption name Hash value 128');
      const th = Math.max(1, Math.min(4, navigator.hardwareConcurrency || 2));
      sfWorker.postMessage('setoption name Threads value ' + th);
      setStatus('Ready · ' + th + ' threads', 'on');
    }
    if (sfBusy && sfHandler) sfHandler(s);
  };
  sfWorker.onerror = () => setStatus('Error', 'off');
  sfWorker.postMessage('uci');
}

async function sfAnalyse(fen, opts = {}) {
  const depth = opts.depth || 16;
  const multipv = opts.multipv || 5;
  const timeoutMs = opts.timeoutMs || (depth >= 20 ? 15000 : depth >= 18 ? 12000 : 9000);
  if (!sfWorker) await initSF();
  if (!sfReady) {
    const start = Date.now();
    while (!sfReady && Date.now() - start < 5000) await new Promise(r => setTimeout(r, 50));
    if (!sfReady) return [];
  }

  const run = () => new Promise((resolve) => {
    const lines = {};
    let done = false;
    let timer = null;
    sfHandler = (s) => {
      if (done) return;
      if (s.startsWith('info') && s.includes(' pv ')) {
        const mv = s.match(/\bmultipv (\d+)/);
        const sc = s.match(/\bscore (cp|mate) (-?\d+)/);
        const pv = s.match(/\bpv (.+)$/);
        if (mv && sc && pv) {
          lines[+mv[1]] = {
            multipv: +mv[1],
            scoreType: sc[1],
            score: +sc[2],
            pvUci: pv[1].trim().split(/\s+/)
          };
        }
      } else if (s.startsWith('bestmove')) {
        done = true;
        clearTimeout(timer);
        sfHandler = null;
        sfBusy = false;
        resolve(Object.values(lines).sort((a, b) => a.multipv - b.multipv));
      }
    };
    timer = setTimeout(() => {
      if (done) return;
      try { sfWorker.postMessage('stop'); } catch (e) {}
      setTimeout(() => {
        if (done) return;
        done = true;
        sfHandler = null;
        sfBusy = false;
        resolve(Object.values(lines).sort((a, b) => a.multipv - b.multipv));
      }, 500);
    }, timeoutMs);
    sfWorker.postMessage('setoption name MultiPV value ' + multipv);
    sfWorker.postMessage('position fen ' + fen);
    sfWorker.postMessage('go depth ' + depth);
  });

  const chained = sfChain.then(() => { sfBusy = true; return run(); });
  sfChain = chained.catch(() => {});
  return chained;
}

/* ============================================================
   HELPERS
   ============================================================ */
const PIECE_NAME = { p:'pawn', n:'knight', b:'bishop', r:'rook', q:'queen', k:'king' };
function pieceLabel(type, color) { return (color === 'w' ? 'White ' : 'Black ') + PIECE_NAME[type]; }
function sqName(file, rankIdx) { return String.fromCharCode(97 + file) + (8 - rankIdx); }
function nullMove(fen) { const p = fen.split(' '); p[1] = p[1] === 'w' ? 'b' : 'w'; p[3] = '-'; return p.join(' '); }
function isValidFenSafe(fen) {
  if (!fen) return false;
  try { const c = new Chess(); return c.load(fen); } catch (e) { return false; }
}

/* ============================================================
   MOVE DESCRIPTION
   ============================================================ */
function describeMove(fenBefore, moveUci, fenAfter) {
  const result = {
    piece: null, color: null, from: null, to: null,
    isCapture: false, capturedPiece: null, capturedColor: null,
    isCheck: false, isMate: false, isCastle: false,
    isPromotion: false, promotionPiece: null,
    attacks: [], openedFiles: [], tags: []
  };
  const boardBefore = new Chess(fenBefore).board();
  const fromF = moveUci.charCodeAt(0) - 97;
  const fromR = 8 - parseInt(moveUci[1]);
  const toF = moveUci.charCodeAt(2) - 97;
  const toR = 8 - parseInt(moveUci[3]);
  const moving = boardBefore[fromR][fromF];
  if (!moving) return result;
  result.piece = moving.type;
  result.color = moving.color;
  result.from = sqName(fromF, fromR);
  result.to = sqName(toF, toR);

  const captured = boardBefore[toR][toF];
  if (captured) {
    result.isCapture = true;
    result.capturedPiece = captured.type;
    result.capturedColor = captured.color;
  }
  if (moving.type === 'p' && fromF !== toF && !captured) {
    result.isCapture = true;
    result.capturedPiece = 'p';
    result.capturedColor = moving.color === 'w' ? 'b' : 'w';
    result.tags.push('en passant');
  }
  if (moving.type === 'k' && Math.abs(toF - fromF) === 2) {
    result.isCastle = true;
    result.tags.push(toF > fromF ? 'kingside castling' : 'queenside castling');
  }
  if (moving.type === 'p' && (toR === 0 || toR === 7)) {
    result.isPromotion = true;
    result.promotionPiece = moveUci[4] || 'q';
  }

  const after = new Chess(fenAfter);
  if (after.in_checkmate()) { result.isCheck = true; result.isMate = true; }
  else if (after.in_check()) { result.isCheck = true; }

  const enemy = moving.color === 'w' ? 'b' : 'w';
  const boardAfter = after.board();
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const p = boardAfter[r][f];
    if (!p || p.color !== enemy) continue;
    const tSq = sqName(f, r);
    const test = new Chess(fenAfter);
    const moves = test.moves({ square: result.to, verbose: true });
    if (moves.some(m => m.to === tSq)) result.attacks.push({ square: tSq, piece: p.type });
  }

  const beforeP = [0,0,0,0,0,0,0,0], afterP = [0,0,0,0,0,0,0,0];
  for (const row of new Chess(fenBefore).board()) for (let f = 0; f < 8; f++) {
    const p = row[f]; if (p && p.type === 'p') beforeP[f]++;
  }
  for (const row of boardAfter) for (let f = 0; f < 8; f++) {
    const p = row[f]; if (p && p.type === 'p') afterP[f]++;
  }
  const files = 'abcdefgh';
  for (let f = 0; f < 8; f++) {
    if (beforeP[f] > 0 && afterP[f] === 0) result.openedFiles.push(files[f]);
  }

  return result;
}

function describeMoveInWords(d) {
  if (!d.piece) return '(unknown move)';
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const parts = [];
  if (d.isCastle) {
    parts.push(d.color === 'w' ? 'White castles' : 'Black castles');
    parts.push(d.tags.includes('kingside castling') ? 'kingside' : 'queenside');
  } else if (d.isCapture) {
    parts.push(cap(pieceLabel(d.piece, d.color)) + ' captures ' + pieceLabel(d.capturedPiece, d.capturedColor) + ' on ' + d.to);
  } else if (d.isPromotion) {
    parts.push(cap(pieceLabel(d.piece, d.color)) + ' promotes on ' + d.to + ' to ' + PIECE_NAME[d.promotionPiece]);
  } else {
    parts.push(cap(pieceLabel(d.piece, d.color)) + ' moves from ' + d.from + ' to ' + d.to);
  }
  if (d.isMate) parts.push('delivering mate');
  else if (d.isCheck) parts.push('giving check');
  return parts.join(', ') + '.';
}

function describeAttacksInWords(d) {
  if (!d.attacks || !d.attacks.length) return '';
  const list = d.attacks.map(a => pieceLabel(a.piece, d.color === 'w' ? 'b' : 'w') + ' on ' + a.square);
  return 'Attacks: ' + list.join(', ') + '.';
}

/* ============================================================
   PLAN DESCRIPTION — what a piece does from its landing square
   ============================================================ */
function describePlanLanding(fenAfter, d) {
  if (!d || !d.piece) return '';
  const enemy = d.color === 'w' ? 'b' : 'w';

  if (d.isCastle) {
    return 'castles ' + (d.tags.includes('kingside castling') ? 'kingside' : 'queenside') + ', bringing the king to safety';
  }

  if (d.isPromotion) {
    return 'promotes on ' + d.to + ' to a ' + PIECE_NAME[d.promotionPiece];
  }

  if (d.piece === 'p') {
    const file = d.to[0];
    const opening = d.openedFiles && d.openedFiles.length ? ', opening the ' + d.openedFiles.join(', ') + ' file' : '';
    const cap = d.isCapture ? ', capturing the ' + PIECE_NAME[d.capturedPiece] + ' on ' + d.to : '';
    // Identify break type
    let breakKind = '';
    const rankTo = parseInt(d.to[1], 10);
    if (d.color === 'w') {
      if (rankTo >= 5) breakKind = 'an advanced pawn push';
      else if (['c','d','e'].includes(file) && rankTo === 4) breakKind = 'a central pawn break';
      else if (['a','b','f','g','h'].includes(file)) breakKind = 'a flank pawn advance';
    } else {
      if (rankTo <= 4) breakKind = 'an advanced pawn push';
      else if (['c','d','e'].includes(file) && rankTo === 5) breakKind = 'a central pawn break';
      else if (['a','b','f','g','h'].includes(file)) breakKind = 'a flank pawn advance';
    }
    const head = breakKind ? breakKind + ' to ' + d.to : 'the ' + file + '-pawn to ' + d.to;
    return head + cap + opening;
  }

  // Piece move
  const clauses = [];
  if (d.isCapture) clauses.push('capturing the ' + PIECE_NAME[d.capturedPiece] + ' on ' + d.to);
  if (d.attacks && d.attacks.length) {
    const atk = d.attacks.slice(0, 2).map(a => PIECE_NAME[a.piece] + ' on ' + a.square).join(' and ');
    clauses.push('attacking the ' + atk);
  }
  const head = PIECE_NAME[d.piece] + ' to ' + d.to;
  return head + (clauses.length ? ', ' + clauses.join(', ') : '');
}

/* ============================================================
   PLAN EXTRACTION — weighted across the top lines
   ============================================================ */
function extractPlans(lines, fen) {
  // Weight: line index 0 → 5, 1 → 4, 2 → 3, 3 → 2, 4 → 1
  const weightFor = i => Math.max(1, 5 - i);
  const maxPerSide = 3;

  // Map: key "piece|to" → { score, sampleDesc, side, lines: [lineIdx] }
  const whiteMap = {};
  const blackMap = {};

  lines.forEach((line, lineIdx) => {
    const ch = new Chess(fen);
    const w = weightFor(lineIdx);
    let wCount = 0, bCount = 0;

    for (const uci of line.pvUci) {
      const before = ch.fen();
      const turn = ch.turn();
      const mv = ch.move({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] || 'q' });
      if (!mv) break;
      const after = ch.fen();
      const d = describeMove(before, uci, after);
      const key = d.piece + '|' + d.to;

      if (turn === 'w' && wCount < maxPerSide) {
        if (!whiteMap[key]) whiteMap[key] = { piece: d.piece, to: d.to, score: 0, lines: [], sampleDesc: d, sampleSan: mv.san };
        whiteMap[key].score += w;
        whiteMap[key].lines.push(lineIdx);
        whiteMap[key].sampleDesc = d;
        whiteMap[key].sampleSan = mv.san;
        wCount++;
      } else if (turn === 'b' && bCount < maxPerSide) {
        if (!blackMap[key]) blackMap[key] = { piece: d.piece, to: d.to, score: 0, lines: [], sampleDesc: d, sampleSan: mv.san };
        blackMap[key].score += w;
        blackMap[key].lines.push(lineIdx);
        blackMap[key].sampleDesc = d;
        blackMap[key].sampleSan = mv.san;
        bCount++;
      }
      if (wCount >= maxPerSide && bCount >= maxPerSide) break;
    }
  });

  // Sort by score, then by number of lines
  const toSorted = map => Object.values(map).sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    return b.lines.length - a.lines.length;
  });

  // Threshold: core ≥ 8 weighted, secondary ≥ 3
  const partition = arr => ({
    core: arr.filter(x => x.score >= 8),
    secondary: arr.filter(x => x.score >= 3 && x.score < 8)
  });

  return {
    white: partition(toSorted(whiteMap)),
    black: partition(toSorted(blackMap)),
    totalLines: lines.length
  };
}

/* ============================================================
   THREAT DETECTION — null-move probe
   ============================================================ */
async function detectThreats(fen, depth) {
  const chess = new Chess(fen);
  // If side to move is in check, null move is illegal — skip.
  if (chess.in_check()) return null;

  const nullFen = nullMove(fen);
  if (!isValidFenSafe(nullFen)) return null;

  const lines = await sfAnalyse(nullFen, { depth: depth || 14, multipv: 1, timeoutMs: 8000 });
  if (!lines.length) return null;

  const top = lines[0];
  // Reject if the eval is quiet
  const isMate = top.scoreType === 'mate' && top.score > 0;
  const cp = top.scoreType === 'cp' ? top.score : 0;
  if (!isMate && Math.abs(cp) < 100) return null;

  // Walk the first few moves of the reply
  const ch = new Chess(nullFen);
  const sans = [];
  const descs = [];
  for (const uci of top.pvUci.slice(0, 5)) {
    const before = ch.fen();
    const mv = ch.move({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] || 'q' });
    if (!mv) break;
    sans.push(mv.san);
    descs.push(describeMove(before, uci, ch.fen()));
  }

  return {
    isMate,
    mateIn: isMate ? top.score : null,
    evalText: evalPovText(top.scoreType, top.score),
    firstSan: sans[0] || '',
    firstDesc: descs[0] || null,
    continuation: sans.slice(0, 5).join(' '),
    movesDesc: descs,
    scoreType: top.scoreType,
    score: top.score
  };
}

/* ============================================================
   EVAL IN WORDS
   ============================================================ */
function evalInWords(scoreType, score, sideToMove) {
  if (scoreType === 'mate') {
    if (score > 0) return (sideToMove === 'w' ? 'White' : 'Black') + ' has a forced mate in ' + score + '.';
    else return (sideToMove === 'w' ? 'Black' : 'White') + ' has a forced mate in ' + Math.abs(score) + '.';
  }
  const cp = score;
  const abs = Math.abs(cp);
  const sign = cp > 0 ? 'White' : cp < 0 ? 'Black' : 'Neither side';
  if (cp === 0) return 'The position is dead equal.';
  if (abs < 25) return 'The position is equal.';
  if (abs < 60) return sign + ' is slightly better.';
  if (abs < 120) return sign + ' has a clear but not decisive advantage.';
  if (abs < 250) return sign + ' is clearly better.';
  if (abs < 500) return sign + ' is winning with best play.';
  return sign + ' is completely winning.';
}

function evalPovText(scoreType, score) {
  if (scoreType === 'mate') return (score > 0 ? '#' : '#-') + Math.abs(score);
  const v = score / 100;
  return (v >= 0 ? '+' : '') + v.toFixed(2);
}

function formatPvSan(sans, fen) {
  const parts = [];
  const bits = fen.split(/\s+/);
  let fullMove = parseInt(bits[5], 10) || 1;
  let isWhite = bits[1] !== 'b';
  for (const s of sans) {
    if (isWhite) parts.push(fullMove + '.' + s);
    else parts.push(s);
    if (!isWhite) fullMove++;
    isWhite = !isWhite;
  }
  return parts.join(' ');
}

/* ============================================================
   MAIN
   ============================================================ */
async function analyse() {
  const fen = document.getElementById('fen-input').value.trim();
  if (!isValidFenSafe(fen)) { alert('Invalid FEN'); return; }

  const depth = parseInt(document.getElementById('depth-select').value, 10);
  const multipv = parseInt(document.getElementById('multipv-select').value, 10);
  const chess = new Chess(fen);
  const sideToMove = chess.turn();
  const sideName = sideToMove === 'w' ? 'White' : 'Black';
  const opponentName = sideToMove === 'w' ? 'Black' : 'White';

  // Reset UI
  document.getElementById('verdict').innerText = 'Thinking…';
  document.getElementById('best-move').innerText = '—';
  document.getElementById('best-facts').innerHTML = '';
  document.getElementById('plans-body').innerText = '—';
  document.getElementById('engine-plan').innerText = '—';
  document.getElementById('all-lines').innerText = '—';
  document.getElementById('threat-panel').innerHTML =
    '<div class="threat-box none"><div class="head">Threat</div><div class="body">Analysing…</div></div>';

  board.position(fen, false);
  document.getElementById('turn-indicator').innerText = sideName + ' to move';

  // --- MultiPV analysis ---
  const lines = await sfAnalyse(fen, { depth, multipv });
  if (!lines.length) {
    document.getElementById('verdict').innerText = 'Engine returned no lines.';
    return;
  }

  const top = lines[0];
  document.getElementById('verdict').innerText = evalInWords(top.scoreType, top.score, sideToMove);

  // --- Translate all lines ---
  const allLinesHTML = [];
  const linesWithDesc = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const ch = new Chess(fen);
    const sanList = [];
    const movesDesc = [];
    for (const uci of l.pvUci.slice(0, 8)) {
      const before = ch.fen();
      const mv = ch.move({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] || 'q' });
      if (!mv) break;
      sanList.push(mv.san);
      movesDesc.push(describeMove(before, uci, ch.fen()));
    }
    linesWithDesc.push({ sanList, movesDesc, line: l });

    const firstMoveDesc = movesDesc[0];
    const firstMoveWords = firstMoveDesc ? describeMoveInWords(firstMoveDesc) : '';
    const firstMoveAttacks = firstMoveDesc ? describeAttacksInWords(firstMoveDesc) : '';
    const evalText = evalPovText(l.scoreType, l.score);
    const evalWord = evalInWords(l.scoreType, l.score, sideToMove);
    const numbered = formatPvSan(sanList, fen);
    const isTop = i === 0;

    let html = '<div class="line-box' + (isTop ? ' top' : '') + '">';
    html += '<div><span class="eval">#' + (i + 1) + ' (' + evalText + ')</span> · <span class="mv">' + numbered + '</span></div>';
    html += '<div class="desc">' + firstMoveWords + '</div>';
    if (firstMoveAttacks) html += '<div class="desc">' + firstMoveAttacks + '</div>';
    if (isTop) html += '<div class="desc"><em>' + evalWord + '</em></div>';
    html += '</div>';
    allLinesHTML.push(html);

    if (isTop) {
      document.getElementById('best-move').innerHTML =
        '<strong>' + (sanList[0] || '') + '</strong> — ' + firstMoveWords;
      const facts = [];
      if (firstMoveDesc) {
        if (firstMoveDesc.isMate) facts.push('checkmate');
        else if (firstMoveDesc.isCheck) facts.push('gives check');
        if (firstMoveDesc.isCapture) facts.push('wins material on ' + firstMoveDesc.to);
        if (firstMoveDesc.openedFiles.length) facts.push('opens the ' + firstMoveDesc.openedFiles.join(', ') + ' file');
        if (firstMoveDesc.attacks.length) {
          facts.push('attacks: ' + firstMoveDesc.attacks.map(a => PIECE_NAME[a.piece] + ' on ' + a.square).join(', '));
        }
      }
      document.getElementById('best-facts').innerHTML =
        facts.map(f => '<span class="fact">' + f + '</span>').join('');

      const planSentences = [];
      for (let k = 0; k < Math.min(5, movesDesc.length); k++) {
        const d = movesDesc[k];
        if (!d) break;
        const mover = k % 2 === 0 ? sideName : opponentName;
        planSentences.push(mover + ': ' + describeMoveInWords(d).replace(/\.$/, ''));
      }
      document.getElementById('engine-plan').innerHTML = planSentences.join('<br>');
    }
  }
  document.getElementById('all-lines').innerHTML = allLinesHTML.join('');

  // --- Plans ---
  const plans = extractPlans(lines, fen);
  const plansHTML = [];
  plansHTML.push(renderSidePlans('Black', plans.black, 'black'));
  plansHTML.push(renderSidePlans('White', plans.white, 'white'));
  document.getElementById('plans-body').innerHTML = plansHTML.join('');

  // --- Threats (null-move) ---
  const threat = await detectThreats(fen, Math.min(depth, 16));
  const panel = document.getElementById('threat-panel');
  if (!threat) {
    panel.innerHTML =
      '<div class="threat-box none"><div class="head">Threat</div>' +
      '<div class="body">No forced threat — ' + sideName + ' has no immediate tactical idea if ' + opponentName + ' does nothing.</div></div>';
  } else {
    let head, body, line;
    if (threat.isMate) {
      head = '⚠ MATE THREAT';
      body = 'If ' + opponentName + ' does nothing, ' + sideName + ' plays <strong>' +
             threat.firstSan + '</strong> and mates in ' + threat.mateIn + '.';
      line = threat.continuation;
    } else {
      head = '⚠ THREAT';
      body = 'If ' + opponentName + ' does nothing, ' + sideName + ' plays <strong>' +
             threat.firstSan + '</strong> — ' + (threat.firstDesc ? describePlanLanding(null, threat.firstDesc) : 'winning material') + '.';
      line = threat.continuation + '  (' + threat.evalText + ')';
    }
    panel.innerHTML =
      '<div class="threat-box active"><div class="head">' + head + '</div>' +
      '<div class="body">' + body + '</div>' +
      '<div class="line">' + line + '</div></div>';
  }
}

function renderSidePlans(label, sidePlans, cls) {
  const { core, secondary } = sidePlans;
  if (!core.length && !secondary.length) {
    return '<div class="plan-card ' + cls + '"><div class="san">' + label + '</div>' +
      '<div class="why text-slate-500 italic">No recurring plan — the lines diverge.</div></div>';
  }
  const html = [];
  html.push('<div class="plan-card ' + cls + '">');
  html.push('<div class="san">' + label + '</div>');
  if (core.length) {
    html.push('<div class="plan-section">Core</div>');
    core.forEach(p => {
      const why = describePlanLanding(null, p.sampleDesc);
      html.push('<div class="why"><strong>' + p.sampleSan + '</strong> <span class="frac">(' +
        p.lines.length + '/' + 5 + ' lines · ' + p.score + 'pts)</span> — ' + why + '</div>');
    });
  }
  if (secondary.length) {
    html.push('<div class="plan-section">Secondary</div>');
    secondary.forEach(p => {
      const why = describePlanLanding(null, p.sampleDesc);
      html.push('<div class="why"><strong>' + p.sampleSan + '</strong> <span class="frac">(' +
        p.lines.length + '/' + 5 + ' lines · ' + p.score + 'pts)</span> — ' + why + '</div>');
    });
  }
  html.push('</div>');
  return html.join('');
}

function loadStartingPosition() {
  document.getElementById('fen-input').value = new Chess().fen();
  analyse();
}

   BOOT
   ============================================================ */

  board = Chessboard('board', {
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    position: 'start'
  });
  await initSF();
  analyse();
};
