<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Vision Pipeline Studio | Decipher Chess Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chunk-card { border-left: 4px solid #d4af37; transition: all 0.2s; cursor: pointer; }
        .chunk-card.completed { border-left-color: #10b981; opacity: 0.5; }
        textarea { background: #0f172a !important; border: 1px solid #334155 !important; font-family: 'Fira Code', monospace; scrollbar-width: thin; }
        textarea:focus { border-color: #d4af37 !important; outline: none; }
        #progress-fill { height: 100%; background: #d4af37; width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-bold gold-text tracking-tight italic">DECIPHER <span class="text-white not-italic">VISION-TO-PGN PRO</span></h1>
                <p class="text-slate-400 text-sm font-light uppercase tracking-widest">Image OCR Normalizer + Live FEN State Compiler</p>
            </div>
            <nav class="flex gap-2 p-1 bg-slate-900 rounded-lg">
                <button onclick="switchTab('fragmenter')" id="tab-f" class="px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg">1. Image Text Parser</button>
                <button onclick="switchTab('reassembler')" id="tab-r" class="px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white">2. AI Injector & Re-assembler</button>
            </nav>
        </header>

        <div id="view-fragmenter" class="space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <label class="text-xs font-bold uppercase text-slate-500 block">Raw Screenshot Text Input</label>
                        <span class="text-[11px] text-slate-400">Accepts raw text from image uploads containing figurine chess symbols</span>
                    </div>
                    <div class="text-right">
                        <div id="stats" class="text-[10px] text-slate-400 uppercase tracking-widest">Ready</div>
                        <div class="w-48 h-1 bg-slate-800 mt-1 rounded-full overflow-hidden"><div id="progress-fill"></div></div>
                    </div>
                </div>
                <textarea id="pgn-input" rows="8" class="w-full p-4 rounded-xl text-sm mb-4" placeholder="Paste text pulled from screenshots here (e.g., 1. d4 ♘f6 2. c4 e6 3. ♘c3 ♗b4...)"></textarea>
                
                <div class="flex flex-wrap gap-3">
                    <button onclick="processPgn()" class="px-6 py-3 bg-white text-black font-bold rounded-xl hover:bg-slate-200 uppercase text-xs">Normalize & Build FEN Positions</button>
                    <button onclick="copyNextBatch()" id="batch-btn" class="px-6 py-3 gold-bg rounded-xl font-bold hidden uppercase text-xs">Copy Next AI Batch</button>
                    <button onclick="copyAllRemaining()" id="all-btn" class="px-6 py-3 bg-slate-800 text-white rounded-xl font-bold hidden uppercase text-xs">Copy All Remaining</button>
                    <button onclick="clearAll()" class="px-6 py-3 bg-red-900/30 text-red-400 rounded-xl font-bold uppercase text-xs">Reset</button>
                </div>
            </div>
            <div id="chunks-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
        </div>

        <div id="view-reassembler" class="hidden space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 1: Paste AI's Output Comments (JSON)</label>
                        <textarea id="ai-json" rows="14" class="w-full p-4 rounded-xl text-xs" placeholder="Paste the generated JSON object from the AI here..."></textarea>
                    </div>
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 2: Completed Animated PGN File</label>
                        <textarea id="final-pgn" rows="14" class="w-full p-4 rounded-xl text-xs text-emerald-400" readonly></textarea>
                        <div class="flex gap-2">
                            <button onclick="copyToClipboard('final-pgn')" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase">Copy PGN String</button>
                            <button onclick="downloadPgn()" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase">Download Master PGN</button>
                        </div>
                    </div>
                </div>
                <button onclick="rebuildPgn()" class="mt-6 w-full py-4 gold-bg rounded-xl font-bold uppercase tracking-widest shadow-lg shadow-yellow-900/20">Compile Annotations into Animated PGN</button>
            </div>
        </div>
    </div>

    <script>
        let globalChunks = [];
        let pgnTokens = [];
        let currentBatchStart = 0;

        window.onload = () => {
            const saved = localStorage.getItem('gm_vision_state');
            if (saved) {
                const state = JSON.parse(saved);
                document.getElementById('pgn-input').value = state.original;
                processPgn(true);
                currentBatchStart = state.batchStart;
                updateUI();
            }
        };

        function switchTab(tab) {
            document.getElementById('view-fragmenter').classList.toggle('hidden', tab !== 'fragmenter');
            document.getElementById('view-reassembler').classList.toggle('hidden', tab !== 'reassembler');
            const f = document.getElementById('tab-f');
            const r = document.getElementById('tab-r');
            f.className = tab === 'fragmenter' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
            r.className = tab === 'reassembler' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
        }

        // Sanitizes figurine text symbols to standard PGN notation letters
        function cleanFigurineText(text) {
            return text
                .replace(/[♔♚]/g, 'K')
                .replace(/[♕♛]/g, 'Q')
                .replace(/[♖♜]/g, 'R')
                .replace(/[♗♝]/g, 'B')
                .replace(/[♘♞]/g, 'N');
        }

        function getFenFromPath(path) {
            try {
                if (typeof Chess === 'undefined') return "FEN_ENGINE_MISSING";
                const chess = new Chess();
                for (let move of path) {
                    let cleanMove = move.replace(/[!?]+$/, '')
                                        .replace(/\$\d+/g, '')
                                        .replace(/(\+\/-|-\/\+|=\/\+|\+=|=\+|\+-|-\+|=)$/, '')
                                        .trim();
                    if (cleanMove && !/^\d+\.+$/.test(cleanMove) && cleanMove !== '(' && cleanMove !== ')') {
                        chess.move(cleanMove, { sloppy: true });
                    }
                }
                return chess.fen();
            } catch (e) {
                return "FEN_GENERATION_FAILED";
            }
        }

        function processPgn(isLoad = false) {
            let input = document.getElementById('pgn-input').value;
            if (!input) return;

            // Normalize the screenshot text strings 
            input = cleanFigurineText(input);

            pgnTokens = input.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|\$\d+|[a-zA-Z0-9\-+=#\/]+[?!]*)/g) || [];
            
            let chunks = [];
            let moveNumber = 0;
            let variationLevel = 0;
            let currentPath = [];
            let savedPaths = []; 
            let depthPlyCounts = { 0: 0 }; 
            let justClosedVariation = false;

            pgnTokens.forEach((token, index) => {
                if (token === "(") {
                    variationLevel++;
                    depthPlyCounts[variationLevel] = 0; 
                    savedPaths.push([...currentPath]);
                    if (currentPath.length > 0) currentPath.pop();
                    justClosedVariation = false; 
                    return; 
                }
                if (token === ")") {
                    variationLevel--;
                    justClosedVariation = true; 
                    if (savedPaths.length > 0) {
                        currentPath = savedPaths.pop();
                    }
                    return; 
                }
                
                const isMoveNum = /^\d+\./.test(token);
                if (isMoveNum) {
                    moveNumber = parseInt(token);
                    return; 
                }

                const isMove = /^[a-zA-Z]/.test(token) && !token.startsWith('{') && !token.startsWith('[');
                
                if (isMove) {
                    depthPlyCounts[variationLevel]++;
                    currentPath.push(token);

                    let evalSymbol = "";
                    let nextToken = pgnTokens[index + 1];
                    if (nextToken && (nextToken.startsWith('$') || /^[!?]+$/.test(nextToken))) {
                        evalSymbol = ` ${nextToken}`;
                    }

                    const hasImportantSymbol = token.includes('!') || token.includes('?') || token.includes('/') || evalSymbol.includes('!') || evalSymbol.includes('?');
                    const isFirstMoveOfVariation = (variationLevel > 0 && depthPlyCounts[variationLevel] === 1);
                    const isStrideMove = (depthPlyCounts[variationLevel] % 6 === 0) || isFirstMoveOfVariation || justClosedVariation;

                    if (isStrideMove || hasImportantSymbol) {
                        let subsequent = [];
                        for(let i = index + 1; i < index + 20 && i < pgnTokens.length; i++) {
                            if (!pgnTokens[i].startsWith('{')) subsequent.push(pgnTokens[i]);
                        }

                        const pathWithTarget = currentPath.slice(0); 
                        
                        chunks.push({
                            id: `CHUNK_${chunks.length}`,
                            target: token + evalSymbol,
                            moveNum: moveNumber,
                            tokenIndex: index,
                            context: currentPath.slice(-15, -1).join(" "), 
                            fen: getFenFromPath(pathWithTarget),
                            future: subsequent.join(" "),
                            isMainLine: variationLevel === 0,
                            isReturning: justClosedVariation && variationLevel === 0 
                        });
                        
                        justClosedVariation = false; 
                    }
                }
            });

            globalChunks = chunks;
            if (!isLoad) currentBatchStart = 0;
            document.getElementById('batch-btn').classList.remove('hidden');
            document.getElementById('all-btn').classList.remove('hidden');
            updateUI();
            saveState();
        }

        function formatBatch(start, end) {
            const batch = globalChunks.slice(start, end).map(c => 
                `ID: ${c.id}\nMove Number: ${c.moveNum}\nFEN: ${c.fen}\nContext: ${c.context}\n--> TARGET MOVE: ${c.target} <--\nMain Line: ${c.isMainLine}\nReturning to Main: ${c.isReturning}\nSubsequent/Variations: ${c.future}`
            ).join("\n---\n");

            return `Role: You are a 2700 ELO Grandmaster creating an elite chess Masterclass for BLACK.
Task: Write perfect, professional course annotations for the TARGET MOVE based on the provided FEN and context.

STRICT STYLE & STRUCTURAL GUIDELINES:
1. PERSONA: Speak as a mentor using "we" and "our".
2. SENTENCE LENGTH (Not too short, not too long): 
   - MAIN LINES (Main Line: true): Write 2-3 flowing sentences (approx 30-45 words). Focus on deep, insightful coaching and positional goals.
   - VARIATIONS (Main Line: false): Write 1-2 precise sentences (approx 15-25 words). Clearly explain the specific tactical or positional point of this alternative idea.
3. VARIATION AWARENESS: 
   - If "Returning to Main: true", you MUST start with a clear transition like "Back to our main line," or "Returning to the primary game plan,".
   - For alternative ideas (Main Line: false), introduce them naturally (e.g., "If White instead tries...", "A tricky alternative is...").
4. EVALUATION SIGNS & MARKS (CRITICAL): Absolutely NO raw symbols in the output (like -/+, =/+, +/-, +/=, !, ?, !?, ?!, $1). Translate them into natural prose! 
   - "-/+" means Black is much better (e.g., "...giving us a clear advantage.").
   - "=/+" means Black has a slight, comfortable edge.
   - "+/=" means White has a slight edge.
   - Recognize "!" as strong, "!?" as interesting/provocative, and "?!" as a dubious inaccuracy. Incorporate these into your tone.
5. HIGHLIGHTS & SQUARES: If you see visual tags like [%csl Rc4,Rf2] or [%cal ...] in the target or future moves, you MUST explicitly mention those specific squares (e.g., c4 and f2). Treat them as critical targets, weak points, or key outposts based on the board state (FEN).

FORMAT: ONLY return a valid JSON object. No markdown formatting outside the JSON.
{"CHUNK_ID": "Your perfectly balanced GM annotation here."}

${batch}`;
        }

        function copyNextBatch() {
            const end = Math.min(currentBatchStart + 10, globalChunks.length);
            navigator.clipboard.writeText(formatBatch(currentBatchStart, end));
            currentBatchStart = end;
            updateUI();
            saveState();
            alert("Batch Copied!");
        }

        function copyAllRemaining() {
            navigator.clipboard.writeText(formatBatch(currentBatchStart, globalChunks.length));
            currentBatchStart = globalChunks.length;
            updateUI();
            saveState();
            alert("All Positions Copied!");
        }

        function rebuildPgn() {
            const raw = document.getElementById('ai-json').value;
            let aiData = {};
            const matches = raw.match(/\{[\s\S]*?\}/g);
            if (matches) {
                matches.forEach(m => {
                    try { Object.assign(aiData, JSON.parse(m)); } catch(e){}
                });
            }
            let workingTokens = [...pgnTokens];
            const sortedIds = Object.keys(aiData).sort((a,b) => {
                const idxA = globalChunks.find(c => c.id === a)?.tokenIndex || 0;
                const idxB = globalChunks.find(c => c.id === b)?.tokenIndex || 0;
                return idxB - idxA;
            });
            sortedIds.forEach(id => {
                const chunk = globalChunks.find(c => c.id === id);
                if (chunk) {
                    workingTokens[chunk.tokenIndex] += ` { ${aiData[id]} }`;
                }
            });
            document.getElementById('final-pgn').value = workingTokens.join(" ");
        }

        function updateUI() {
            const container = document.getElementById('chunks-container');
            container.innerHTML = "";
            globalChunks.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = `chunk-card glass p-2 rounded-lg ${i < currentBatchStart ? 'completed' : ''}`;
                div.innerHTML = `<p class="text-[8px] gold-text font-bold">${c.id}</p><p class="text-[10px] truncate">${c.target}</p>`;
                container.appendChild(div);
            });
            const perc = (currentBatchStart / globalChunks.length) * 100 || 0;
            document.getElementById('progress-fill').style.width = perc + "%";
            document.getElementById('stats').innerText = `${currentBatchStart}/${globalChunks.length} IDENTIFIED TARGET POSITIONS`;
        }

        function saveState() {
            localStorage.setItem('gm_vision_state', JSON.stringify({
                original: document.getElementById('pgn-input').value,
                batchStart: currentBatchStart
            }));
        }

        function clearAll() {
            localStorage.removeItem('gm_vision_state');
            location.reload();
        }

        function copyToClipboard(id) {
            const val = document.getElementById(id).value;
            navigator.clipboard.writeText(val);
            alert("Copied!");
        }

        function downloadPgn() {
            const val = document.getElementById('final-pgn').value;
            const blob = new Blob([val], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Vision_Masterclass_Output.pgn";
            a.click();
        }
    </script>
</body>
</html>
