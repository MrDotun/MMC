<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Boutique | Premium Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        body { background: #0f172a; color: white; }
    </style>
</head>
<body class="p-4 pb-20">

    <header class="mb-8 text-center pt-6">
        <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-yellow-600 uppercase tracking-wider">
            LUXE BOUTIQUE
        </h1>
        <p class="text-gray-400 text-sm mt-2">Shop via WhatsApp • Fast Delivery</p>
    </header>

    <div class="grid grid-cols-1 gap-6 max-w-md mx-auto">
        
        <div class="glass rounded-2xl overflow-hidden p-3 shadow-xl">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Shoe" class="w-full h-48 object-cover rounded-xl mb-3">
            <h3 class="text-lg font-semibold">Red Sport Sneakers</h3>
            <p class="text-amber-500 font-bold mb-3">₦45,000</p>
            <button onclick="orderWhatsApp('Red Sport Sneakers', '45,000')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl transition-all active:scale-95 flex items-center justify-center gap-2">
                Order on WhatsApp
            </button>
        </div>

        <div class="glass rounded-2xl overflow-hidden p-3 shadow-xl">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="Watch" class="w-full h-48 object-cover rounded-xl mb-3">
            <h3 class="text-lg font-semibold">Gold Classic Watch</h3>
            <p class="text-amber-500 font-bold mb-3">₦72,000</p>
            <button onclick="orderWhatsApp('Gold Classic Watch', '72,000')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl transition-all active:scale-95 flex items-center justify-center gap-2">
                Order on WhatsApp
            </button>
        </div>

    </div>

    <nav class="fixed bottom-6 left-4 right-4 glass rounded-full py-4 px-6 flex justify-around items-center shadow-2xl max-w-md mx-auto">
        <span class="text-amber-400 font-bold border-b-2 border-amber-400">Store</span>
        <span class="text-gray-400">Categories</span>
        <span class="text-gray-400">Contact</span>
    </nav>

    <script>
        function orderWhatsApp(name, price) {
            // Updated to your WhatsApp number
            const phone = "2348025028105"; 
            const message = encodeURIComponent(`Hello Luxe Boutique! I want to order the ${name} for ₦${price}. Is it still available for delivery?`);
            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }
    </script>
</body>
</html>
