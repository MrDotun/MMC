<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters Academy | Master Study E-Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --purple: #a855f7; --deep: #6b21a8; --gold: #d4af37; --text: #ffffff; --card-bg: rgba(255,255,255,0.03); --move-bg: #1e293b; }
        body.light-mode { --bg: #f8fafc; --purple: #7e22ce; --deep: #581c87; --gold: #b45309; --text: #1e293b; --card-bg: #ffffff; --move-bg: #f1f5f9; }
        
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.6; transition: background 0.3s, color 0.3s; }
        .ebook-header { background: var(--deep); padding: 25px 20px; text-align: center; border-bottom: 4px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .ebook-header h1 { margin: 0 0 10px; color: var(--gold); font-size: 22px; letter-spacing: 2px; }
        
        .progress-bar { font-size: 11px; font-weight: 800; color: #4ade80; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        
        .controls-area { max-width: 800px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 0.6fr 0.6fr 0.6fr; gap: 8px; }
        #masterSearch, #jumpTo, .ui-btn { padding: 12px; border-radius: 12px; border: 2px solid var(--purple); background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px; box-sizing: border-box; }
        
        #jumpTo { cursor: pointer; color: var(--gold); font-weight: 600; }
        .ui-btn { border-color: var(--gold); color: var(--gold); font-weight: 800; cursor: pointer; text-transform: uppercase; white-space: nowrap; }
        .ui-btn:hover { background: var(--gold); color: white; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .lesson-card { background: var(--card-bg); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 20px; padding: 25px; margin-bottom: 30px; scroll-margin-top: 200px; position: relative; transition: transform 0.3s; }
        .lesson-card.completed { border-color: #4ade80; opacity: 0.8; }
        
        .lesson-num { color: var(--purple); font-weight: 800; font-size: 12px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        .check-box { width: 18px; height: 18px; accent-color: #4ade80; cursor: pointer; }
        
        .lesson-title { color: var(--gold); margin: 5px 0 15px; font-size: 20px; border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 10px; }
        .lesson-header { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .copy-btn { background: none; border: 1px solid var(--purple); color: var(--purple); padding: 5px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; cursor: pointer; }
        .lesson-story { font-style: italic; color: var(--text); opacity: 0.8; margin-bottom: 20px; font-size: 14px; }
        .move-list { background: var(--move-bg); border-radius: 12px; padding: 15px; font-family: monospace; font-size: 14px; color: #10b981; display: flex; flex-wrap: wrap; gap: 6px; }
        .move-item { background: rgba(168, 85, 247, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(168, 85, 247, 0.4); }
        
        .back-btn { display: inline-block; margin: 15px 20px; color: var(--gold); text-decoration: none; font-weight: 800; font-size: 13px; }
        
        @media (max-width: 800px) { .controls-area { grid-template-columns: 1fr 1fr; } }
        @media print {
            .back-btn, .controls-area, .check-box, .progress-bar { display: none !important; }
            body { background: white !important; color: black !important; }
            .lesson-card { border: 1px solid #ccc !important; page-break-inside: avoid; background: none !important; }
        }
    </style>
</head>
<body>

<a href="javascript:history.back()" class="back-btn">← BACK TO ACADEMY</a>

<div class="ebook-header">
    <h1>MASTER STUDY E-BOOK</h1>
    <div class="progress-bar" id="progressText">Study Progress: 0 / 20 Lessons</div>
    <div class="controls-area">
        <input type="text" id="masterSearch" placeholder="Filter..." onkeyup="filterLessons()">
        <select id="jumpTo" onchange="jumpTo(this.value)">
            <option value="">Jump...</option>
        </select>
        <button class="ui-btn" onclick="pickRandom()">Random</button>
        <button class="ui-btn" onclick="toggleTheme()">Theme</button>
        <button class="ui-btn" onclick="window.print()">PDF</button>
    </div>
</div>

<div class="container" id="ebook-content"></div>

<script>
const games = [
    { id: "l1", title: "1. Morphy's Opera Trap", story: "Paul Morphy won this game during a music show!", moves: ["e4", "e5", "Nf3", "d6", "d4", "Bg4", "dxe5", "Bxf3", "Qxf3", "dxe5", "Bc4", "Nf6", "Qb3", "Qe7", "Nc3", "c6", "Bg5", "b5", "Nxb5", "cxb5", "Bxb5+", "Nbd7", "O-O-O", "Rd8", "Rxd7", "Rxd7", "Rd1", "Qe6", "Bxd7+", "Nxd7", "Qb8+", "Nxb8", "Rd8#"] },
    { id: "l2", title: "2. The Magician Tal", story: "Mikhail Tal used 'Magic' to confuse his enemies!", moves: ["e4", "c6", "d4", "d5", "Nc3", "dxe4", "Nxe4", "Nd7", "Bc4", "Ngf6", "Ng5", "e6", "Qe2", "Nb6", "Bb3", "h6", "N5f3", "c5", "dxc5", "Bxc5", "Ne5", "O-O", "Ngf3"] },
    { id: "l3", title: "3. Fischer's Giant Attack", story: "Bobby Fischer played with perfect logic.", moves: ["e4", "e5", "Nf3", "Nc6", "Bb5", "a6", "Ba4", "Nf6", "O-O", "Be7", "Re1", "b5", "Bb3", "d6", "c3", "O-O", "h3", "Na5", "Bc2", "c5", "d4"] },
    { id: "l4", title: "4. Kasparov's Power", story: "Garry Kasparov used raw power and calculation!", moves: ["d4", "Nf6", "c4", "g6", "Nc3", "Bg7", "e4", "d6", "Nf3", "O-O", "Be2", "e5", "O-O", "Nc6", "d5", "Ne7", "Ne1", "Nd7", "f3", "f5"] },
    { id: "l5", title: "5. Capablanca's Machine", story: "Capablanca played like a perfect computer!", moves: ["d4", "d5", "c4", "e6", "Nc3", "Nf6", "Bg5", "Be7", "e3", "O-O", "Nf3", "Nbd7", "Rc1", "c6", "Bd3", "dxc4", "Bxc4", "Nd5"] },
    { id: "l6", title: "6. Alekhine's Fire", story: "Alekhine loved messy games with imagination!", moves: ["e4", "Nf6", "e5", "Nd5", "d4", "d6", "c4", "Nb6", "exd6", "cxd6", "Nc3", "g6", "Be3", "Bg7", "Rc1", "O-O"] },
    { id: "l7", title: "7. Karpov's Squeeze", story: "Karpov squeezed until there was no room left!", moves: ["e4", "c5", "Nf3", "d6", "d4", "cxd4", "Nxd4", "Nf6", "Nc3", "a6", "Be3", "e6", "f3", "b5", "Qd2", "Nbd7", "g4"] },
    { id: "l8", title: "8. Carlsen's Viking Spirit", story: "Magnus Carlsen never gives up!", moves: ["e4", "e5", "Nf3", "Nc6", "Bc4", "Bc5", "O-O", "Nf6", "d3", "d6", "c3", "a6", "a4", "Ba7", "Re1", "O-O", "h3"] },
    { id: "l9", title: "9. Polgar's Strike", story: "Judit Polgar attacked from the first move!", moves: ["e4", "c5", "Nf3", "d6", "d4", "cxd4", "Nxd4", "Nf6", "Nc3", "Nc6", "Bg5", "e6", "Qd2", "a6", "O-O-O", "Bd7"] },
    { id: "l10", title: "10. Anand's Lightning Kid", story: "Vishy Anand played faster than anyone!", moves: ["e4", "e5", "Nf3", "Nc6", "Bb5", "Nf6", "d3", "Bc5", "c3", "O-O", "O-O", "d6", "Nbd2", "Ne7", "d4"] },
    { id: "l11", title: "11. Botvinnik's Science", story: "Botvinnik treated chess like science!", moves: ["c4", "e5", "Nc3", "Nf6", "g3", "d5", "cxd5", "Nxd5", "Bg2", "Nb6", "Nf3", "Nc6", "O-O", "Be7", "a3", "O-O"] },
    { id: "l12", title: "12. Petrosian's Shield", story: "Petrosian had the strongest shield!", moves: ["d4", "Nf6", "c4", "e6", "Nf3", "d5", "Nc3", "Be7", "Bg5", "O-O", "e3", "h6", "Bh4", "b6", "cxd5"] },
    { id: "l13", title: "13. Spassky's Beauty", story: "Spassky played beautiful chess!", moves: ["e4", "e5", "f4", "exf4", "Nf3", "g5", "Bc4", "Bg7", "d4", "d6", "O-O", "h6", "c3", "Nc6", "g3"] },
    { id: "l14", title: "14. Kramnik's Wall", story: "Kramnik beat the unbeatable with a 'Berlin Wall.'", moves: ["e4", "e5", "Nf3", "Nc6", "Bb5", "Nf6", "O-O", "Nxe4", "d4", "Nd6", "Bxc6", "dxc6", "dxe5", "Nf5", "Qxd8+", "Kxd8"] },
    { id: "l15", title: "15. Lasker's Mind", story: "Lasker played with the person's mind!", moves: ["e4", "e5", "Nf3", "Nc6", "Bb5", "a6", "Bxc6", "dxc6", "d4", "exd4", "Qxd4", "Qxd4", "Nxd4", "Bd7", "Nc3", "O-O-O"] },
    { id: "l16", title: "16. Steinitz's Rules", story: "Steinitz wrote the rules we use!", moves: ["e4", "e5", "Nc3", "Nc6", "f4", "exf4", "d4", "Qh4+", "Ke2", "d6", "Nf3", "Bg4", "Bxf4", "O-O-O"] },
    { id: "l17", title: "17. Smyslov's Harmony", story: "Smyslov made pieces work like music!", moves: ["e4", "c5", "Nf3", "Nc6", "Bb5", "g6", "O-O", "Bg7", "c3", "Nf6", "Re1", "O-O", "d4", "cxd4", "cxd4"] },
    { id: "l18", title: "18. Euwe's Strategy", story: "A math teacher who showed anyone can be a champ!", moves: ["d4", "Nf6", "c4", "e6", "Nc3", "Bb4", "e3", "c5", "Bd3", "Nc6", "Nf3", "Bxc3+", "bxc3", "d6", "e4", "e5"] },
    { id: "l19", title: "19. Nakamura's Speed", story: "Hikaru is the king of speed!", moves: ["e4", "e5", "Nf3", "Nc6", "Bc4", "Bc5", "b4", "Bxb4", "c3", "Ba5", "d4", "exd4", "O-O", "Nge7", "cxd4", "d5"] },
    { id: "l20", title: "20. Topalov's Aggression", story: "Topalov always attacks!", moves: ["e4", "c5", "Nf3", "d6", "d4", "cxd4", "Nxd4", "Nf6", "Nc3", "a6", "Be3", "e5", "Nb3", "Be6", "f3", "Nbd7", "g4"] }
];

function toggleTheme() { document.body.classList.toggle('light-mode'); }
function jumpTo(id) { if(id) document.getElementById(id).scrollIntoView({behavior:'smooth'}); }

function pickRandom() {
    const randomIdx = Math.floor(Math.random() * games.length);
    jumpTo(games[randomIdx].id);
}

function copyToClipboard(btn, moves) {
    navigator.clipboard.writeText(moves.join(' ')).then(() => {
        const old = btn.innerText; btn.innerText = "COPIED";
        setTimeout(() => { btn.innerText = old; }, 1500);
    });
}

function updateProgress() {
    const checked = document.querySelectorAll('.check-box:checked').length;
    document.getElementById('progressText').innerText = `Study Progress: ${checked} / 20 Lessons`;
    const status = Array.from(document.querySelectorAll('.check-box')).map(cb => cb.checked);
    localStorage.setItem('mma_progress', JSON.stringify(status));
}

function render() {
    const list = document.getElementById('ebook-content');
    const select = document.getElementById('jumpTo');
    const savedProgress = JSON.parse(localStorage.getItem('mma_progress') || '[]');

    list.innerHTML = games.map((g, i) => {
        const isChecked = savedProgress[i] ? 'checked' : '';
        const completedClass = savedProgress[i] ? 'completed' : '';
        return `
        <div class="lesson-card ${completedClass}" id="${g.id}">
            <div class="lesson-header">
                <div>
                    <div class="lesson-num">
                        <input type="checkbox" class="check-box" onchange="this.parentElement.parentElement.parentElement.parentElement.classList.toggle('completed'); updateProgress()" ${isChecked}>
                        MASTER LESSON
                    </div>
                    <h2 class="lesson-title">${g.title}</h2>
                </div>
                <button class="copy-btn" onclick='copyToClipboard(this, ${JSON.stringify(g.moves)})'>COPY PGN</button>
            </div>
            <p class="lesson-story">${g.story}</p>
            <div class="move-list">${g.moves.map(m => `<span class="move-item">${m}</span>`).join('')}</div>
        </div>`}).join('');
    
    select.innerHTML = '<option value="">Jump...</option>' + 
        games.map(g => `<option value="${g.id}">Lesson ${g.id.replace('l','')}</option>`).join('');
    updateProgress();
}

function filterLessons() {
    const term = document.getElementById('masterSearch').value.toLowerCase();
    const cards = document.getElementsByClassName('lesson-card');
    Array.from(cards).forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(term) ? "block" : "none";
    });
}

render();
</script>
</body>
</html>
