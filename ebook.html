<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters Academy | Master Study E-Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        :root { --bg: #0f172a; --purple: #a855f7; --deep: #6b21a8; --gold: #d4af37; --text: #ffffff; --card-bg: rgba(255,255,255,0.03); --move-bg: #1e293b; }
        body.light-mode { --bg: #f8fafc; --purple: #7e22ce; --deep: #581c87; --gold: #b45309; --text: #1e293b; --card-bg: #ffffff; --move-bg: #f1f5f9; }
        
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.6; transition: background 0.3s; }
        .ebook-header { background: var(--deep); padding: 25px 20px; text-align: center; border-bottom: 4px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .ebook-header h1 { margin: 0 0 10px; color: var(--gold); font-size: 22px; letter-spacing: 2px; }
        
        .progress-bar { font-size: 11px; font-weight: 800; color: #4ade80; margin-bottom: 15px; text-transform: uppercase; }
        .controls-area { max-width: 800px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 0.6fr 0.6fr 0.6fr; gap: 8px; }
        #masterSearch, #jumpTo, .ui-btn { padding: 12px; border-radius: 12px; border: 2px solid var(--purple); background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .lesson-card, .quiz-card { background: var(--card-bg); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 20px; padding: 25px; margin-bottom: 30px; scroll-margin-top: 200px; }
        .lesson-card.completed { border-color: #4ade80; }
        
        .lesson-title { color: var(--gold); margin: 5px 0 5px; font-size: 20px; }
        .master-quote { font-size: 13px; color: var(--purple); font-style: italic; margin-bottom: 15px; display: block; border-bottom: 1px solid rgba(212, 175, 55, 0.1); padding-bottom: 10px; }
        
        .board-wrapper { display: none; margin: 20px 0; background: var(--move-bg); padding: 20px; border-radius: 15px; border: 1px solid var(--gold); }
        .board-container { width: 300px; margin: 0 auto; border: 2px solid #fff; }
        .hint-box { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; margin-top: 15px; border-left: 4px solid var(--gold); font-size: 13px; color: #e2e8f0; font-weight: 600; }

        .quiz-card { border-color: var(--gold); background: rgba(212, 175, 55, 0.05); text-align: center; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .quiz-btn { padding: 15px; border-radius: 12px; border: 1px solid var(--purple); background: var(--bg); color: white; cursor: pointer; font-weight: 600; }

        .move-list { background: var(--move-bg); border-radius: 12px; padding: 15px; font-family: monospace; display: flex; flex-wrap: wrap; gap: 6px; }
        .move-item { background: rgba(168, 85, 247, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(168, 85, 247, 0.4); color: #4ade80; }
        
        @media (max-width: 600px) { .controls-area { grid-template-columns: 1fr 1fr; } .board-container { width: 100%; } .quiz-options { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="ebook-header">
    <h1>MASTER STUDY E-BOOK</h1>
    <div class="progress-bar" id="progressText">Progress: 0 / 20</div>
    <div class="controls-area">
        <input type="text" id="masterSearch" placeholder="Search Master..." onkeyup="filterLessons()">
        <select id="jumpTo" onchange="jumpTo(this.value)"><option value="">Jump...</option></select>
        <button class="ui-btn" onclick="pickRandom()">Random</button>
        <button class="ui-btn" onclick="toggleTheme()">Theme</button>
        <button class="ui-btn" onclick="window.print()">PDF</button>
    </div>
</div>

<div class="container">
    <div id="ebook-content"></div>
    
    <div class="quiz-card" id="quiz-section">
        <h2 style="color:var(--gold)">🏆 MASTER QUIZ</h2>
        <p id="quiz-story" style="font-style: italic; margin: 20px 0;"></p>
        <div class="quiz-options" id="quiz-options"></div>
        <div id="quiz-feedback" style="margin-top:15px; font-weight:800"></div>
        <button class="ui-btn" style="margin-top:20px; width:100%" onclick="generateQuestion()">New Question</button>
    </div>
</div>

<script>
const games = [
    { id: "l1", name: "Morphy", title: "1. Morphy's Opera Trap", quote: "Help your pieces so they can help you.", story: "Morphy shows how to develop pieces with threats!", moves: ["e4", "e5", "Nf3", "d6", "d4", "Bg4", "dxe5", "Bxf3", "Qxf3", "dxe5", "Bc4", "Nf6", "Qb3", "Qe7", "Nc3", "c6", "Bg5", "b5", "Nxb5", "cxb5", "Bxb5+", "Nbd7", "O-O-O", "Rd8", "Rxd7", "Rxd7", "Rd1", "Qe6", "Bxd7+", "Nxd7", "Qb8+", "Nxb8", "Rd8#"] },
    { id: "l2", name: "Tal", title: "2. The Magician Tal", quote: "You must take your opponent into a deep dark forest...", story: "Tal's famous 'Legal's Mate'—sacrificing the Queen for an inescapable trap!", moves: ["e4", "e5", "Nf3", "Nc6", "Bc4", "d6", "Nc3", "Bg4", "h3", "Bh5", "Nxe5", "Bxd1", "Bxf7+", "Ke7", "Nd5#"] },
    { id: "l3", name: "Fischer", title: "3. Fischer's Logic", quote: "I don't believe in psychology. I believe in good moves.", story: "Black plays the Blackburne Shilling trap. Watch how fast a game can end if you aren't careful!", moves: ["e4", "e5", "Nf3", "Nc6", "Bc4", "Nd4", "Nxe5", "Qg5", "Nxf7", "Qxg2", "Rf1", "Qxe4+", "Be2", "Nf3#"] },
    { id: "l4", name: "Kasparov", title: "4. Kasparov's Power", quote: "Chess is mental torture.", story: "A display of raw power! Sacrificing the Queen for a stunning double-check mate.", moves: ["e4", "c6", "d4", "d5", "Nc3", "dxe4", "Nxe4", "Nf6", "Qd3", "e5", "dxe5", "Qa5+", "Bd2", "Qxe5", "O-O-O", "Nxe4", "Qd8+", "Kxd8", "Bg5+", "Kc7", "Bd8#"] },
    { id: "l5", name: "Capablanca", title: "5. Capablanca's Clarity", quote: "You may learn much more from a game you lose...", story: "Capablanca's clarity! A quick 6-move checkmate using a pinned pawn.", moves: ["e4", "c6", "d4", "d5", "Nc3", "dxe4", "Nxe4", "Nd7", "Qe2", "Ngf6", "Nd6#"] },
    { id: "l6", name: "Alekhine", title: "6. Alekhine's Attack", quote: "Chess is not only knowledge and logic!", story: "Alekhine creates a messy board and finishes with an explosive Queen sacrifice!", moves: ["e4", "e6", "d4", "d5", "Nc3", "Bb4", "Bd3", "Bxc3+", "bxc3", "h6", "Ba3", "Nd7", "Qe2", "dxe4", "Bxe4", "Ngf6", "Bd3", "b6", "Qxe6+", "fxe6", "Bg6#"] },
    { id: "l7", name: "Karpov", title: "7. Karpov's Strategy", quote: "Let us say that the game is a continuation of life.", story: "The fastest checkmate in chess! A reminder to always protect your King.", moves: ["f3", "e5", "g4", "Qh4#"] },
    
    // NEW TACTICAL GAMES (8-20)
    { id: "l8", name: "Carlsen", title: "8. Carlsen's Viking Fork", quote: "Some people think that if their opponent plays a beautiful game, it’s OK to lose. I don’t.", story: "A classic Pawn Fork in the center of the board! Watch the d4 pawn attack two pieces at once.", moves: ["e4", "e5", "Nf3", "Nc6", "Bc4", "Bc5", "Nc3", "Nf6", "O-O", "O-O", "Nxe5", "Nxe5", "d4", "Nxc4", "dxc5", "d6", "Qd4", "Ne5"] },
    { id: "l9", name: "Polgar", title: "9. Polgar's Siberian Trap", quote: "Chess is 30 to 40% psychology. You don't have this when you play a computer.", story: "A sneaky trap! The White Queen gets lured away, leading to a brutal smothered mate.", moves: ["e4", "c5", "d4", "cxd4", "c3", "dxc3", "Nxc3", "Nc6", "Nf3", "e6", "Bc4", "Qc7", "O-O", "Nf6", "Qe2", "Ng4", "h3", "Nd4", "Nxd4", "Qh2#"] },
    { id: "l10", name: "Anand", title: "10. Anand's Pin Trick", quote: "Confidence is very important - even pretending to be confident.", story: "A beautiful lesson on Pins! The e7 pawn CANNOT capture the Knight because the Queen would take the King.", moves: ["e4", "c6", "d4", "d5", "Nc3", "dxe4", "Nxe4", "Nd7", "Qe2", "Ngf6", "Nd6#"] },
    { id: "l11", name: "Botvinnik", title: "11. Botvinnik's Elephant Trap", quote: "Chess is the art which expresses the science of logic.", story: "White thinks they won a piece, but Black uses a Pin and a Queen Fork to strike back!", moves: ["d4", "d5", "c4", "e6", "Nc3", "Nf6", "Bg5", "Nbd7", "cxd5", "exd5", "Nxd5", "Nxd5", "Bxd8", "Bb4+", "Qd2", "Kxd8"] },
    { id: "l12", name: "Petrosian", title: "12. Petrosian's Queen Fork", quote: "They say my games should be more 'interesting'. I could be more 'interesting'—and lose.", story: "Black sacrifices the Bishop to unleash a massive Queen Fork on the King and the Rook!", moves: ["d4", "e5", "dxe5", "Nc6", "Nf3", "Qe7", "Bf4", "Qb4+", "Bd2", "Qxb2", "Bc3", "Bb4", "Qd2", "Bxc3", "Nxc3", "Qxa1+"] },
    { id: "l13", name: "Spassky", title: "13. Spassky's Stafford Mate", quote: "I like to attack. But it is better to have a solid foundation.", story: "White gets greedy with pawns, allowing Black to pin the Queen to the King!", moves: ["e4", "e5", "Nf3", "Nf6", "Nxe5", "Nc6", "Nxc6", "dxc6", "d3", "Bc5", "Bg5", "Nxe4", "Bxd8", "Bxf2+", "Ke2", "Bg4#"] },
    { id: "l14", name: "Kramnik", title: "14. Kramnik's Budapest Trap", quote: "I am not a person who is afraid of losing.", story: "Another brilliant example of a PIN! The pawn on f2 is frozen, allowing the Knight to deliver mate.", moves: ["d4", "Nf6", "c4", "e5", "dxe5", "Ng4", "Bf4", "Nc6", "Nf3", "Bb4+", "Nbd2", "Qe7", "a3", "Ngxe5", "axb4", "Nd3#"] },
    { id: "l15", name: "Lasker", title: "15. Lasker's Underpromotion", quote: "The hardest thing in chess is to win a won game.", story: "Instead of making a Queen, Black makes a Knight to create an unstoppable FORK!", moves: ["d4", "d5", "c4", "e5", "dxe5", "d4", "e3", "Bb4+", "Bd2", "dxe3", "Bxb4", "exf2+", "Ke2", "fxg1=N+", "Ke1", "Qh4+", "Kd2", "Nc6"] },
    { id: "l16", name: "Steinitz", title: "16. Steinitz's Noah's Ark", quote: "Only the player with the initiative has the right to attack.", story: "White's Bishop goes hunting but gets trapped by a pawn fork on the side of the board.", moves: ["e4", "e5", "Nf3", "Nc6", "Bb5", "a6", "Ba4", "d6", "d4", "b5", "Bb3", "Nxd4", "Nxd4", "exd4", "Qxd4", "c5", "Qd5", "Be6", "Qc6+", "Bd7", "Qd5", "c4"] },
    { id: "l17", name: "Smyslov", title: "17. Smyslov's Fishing Pole", quote: "I will play 40 good moves; if you play 40 good moves, we'll draw.", story: "Black leaves the Knight hanging as bait. When White takes it, the Rook file opens for mate!", moves: ["e4", "e5", "Nf3", "Nc6", "Bb5", "Nf6", "O-O", "Ng4", "h3", "h5", "hxg4", "hxg4", "Ne1", "Qh4", "f3", "g3", "d4", "Qh1#"] },
    { id: "l18", name: "Euwe", title: "18. Euwe's Fool's Trap", quote: "Strategy requires thought, tactics require observation.", story: "White pushes too many pawns and leaves the King exposed to a fatal diagonal attack.", moves: ["e4", "b6", "d4", "Bb7", "Bd3", "f5", "exf5", "Bxg2", "Qh5+", "g6", "fxg6", "Nf6", "gxh7+", "Nxh5", "Bg6#"] },
    { id: "l19", name: "Nakamura", title: "19. Nakamura's Scholar", quote: "I just like to play fast. It’s more fun.", story: "The famous 4-move checkmate! The Queen and Bishop team up to attack the weakest square: f7.", moves: ["e4", "e5", "Qh5", "Nc6", "Bc4", "Nf6", "Qxf7#"] },
    { id: "l20", name: "Topalov", title: "20. Topalov's Royal Pull", quote: "I am a fighter. I always play for a win.", story: "Black sacrifices a Bishop just to pull the White King out so the Queens can trade!", moves: ["d4", "e5", "dxe5", "Bc5", "Nf3", "d6", "exd6", "Ne7", "dxe7", "Bxf2+", "Kxf2", "Qxd1"] }
];

const boards = {};

function toggleBoard(id, moves) {
    const el = document.getElementById(`board-wrapper-${id}`);
    const isVisible = el.style.display === 'block';
    el.style.display = isVisible ? 'none' : 'block';
    if (!isVisible && !boards[id]) {
        boards[id] = { 
            game: new Chess(), 
            board: Chessboard(`board-${id}`, {
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            }), 
            idx: 0, 
            moves: moves 
        };
        updateHint(id);
    }
}

function getHint(move, idx, name) {
    // Explicit Tactical Annotations for Kids
    if (move === "Nd6#" || move === "Nd3#") return "📍 PIN & MATE! The pawn is PINNED to the King and can't capture the Knight! Smothered mate!";
    if (move === "d4" && idx > 5) return "🍴 PAWN FORK! Look at the d4 pawn attacking TWO pieces at the same time!";
    if (move === "fxg1=N+") return "🐎 KNIGHT FORK! 🍴 Underpromotion! The Knight attacks the King and Rook!";
    if (move === "Qb4+" || move === "Qxa1+") return "🍴 QUEEN FORK! ↗️➡️ The Queen attacks multiple targets at once!";
    if (move === "Bg5" || move === "Bb4" || move === "Bg4#") return "📍 PIN! 🎯 The Bishop freezes the enemy piece. It cannot move!";
    if (move === "c4" && idx > 15) return "🍴 PAWN FORK! The Bishop is trapped!";
    if (move === "Bxf2+") return "🎣 DECOY! The Bishop sacrifices itself to pull the King away from protecting the Queen!";
    
    // Standard Annotations
    if (move.includes("#")) return "💥 CHECKMATE! The game is over!";
    if (move.includes("+")) return "⚡ CHECK! The King is under attack!";
    if (move.includes("x")) return "⚔️ CAPTURE! A piece is taken off the board.";
    if (move === "O-O" || move === "O-O-O") return "🏰 CASTLING! Tucking the King away safely.";

    if (idx <= 4) return "🌱 Opening Phase: Fight for the center of the board!";
    return "🔥 The battle is heating up! Look for pins and forks!";
}

function step(id, dir) {
    const s = boards[id];
    if (dir === 1 && s.idx < s.moves.length) {
        s.game.move(s.moves[s.idx]);
        s.idx++;
    } else if (dir === -1 && s.idx > 0) {
        s.game.undo();
        s.idx--;
    }
    s.board.position(s.game.fen());
    updateHint(id);
}

function updateHint(id) {
    const s = boards[id];
    const gameData = games.find(g => g.id === id);
    const hintText = s.idx === 0 ? "White to move. 🟢" : getHint(s.moves[s.idx-1], s.idx, gameData.name);
    document.getElementById(`hint-${id}`).innerText = `Coach says: ${hintText}`;
}

function generateQuestion() {
    const feedback = document.getElementById('quiz-feedback');
    feedback.innerText = "";
    const correct = games[Math.floor(Math.random() * games.length)];
    document.getElementById('quiz-story').innerText = `"${correct.story}"`;
    
    let opts = [correct.name];
    while(opts.length < 4) {
        let r = games[Math.floor(Math.random()*games.length)].name;
        if(!opts.includes(r)) opts.push(r);
    }
    opts.sort(() => Math.random() - 0.5);
    document.getElementById('quiz-options').innerHTML = opts.map(o => `<button class="quiz-btn" onclick="checkAns('${o}','${correct.name}')">${o}</button>`).join('');
}

function checkAns(s, c) {
    const f = document.getElementById('quiz-feedback');
    if(s === c) { f.innerText = "Correct! 🏆"; f.style.color="#4ade80"; }
    else { f.innerText = `Incorrect. It was ${c}.`; f.style.color="#f87171"; }
}

function render() {
    const list = document.getElementById('ebook-content');
    const select = document.getElementById('jumpTo');
    const progress = JSON.parse(localStorage.getItem('mma_progress') || '[]');

    list.innerHTML = games.map((g, i) => `
        <div class="lesson-card ${progress[i]?'completed':''}" id="${g.id}">
            <div class="lesson-header">
                <div style="font-size:11px; font-weight:800; color:var(--purple)">
                    <input type="checkbox" onchange="toggleComplete('${g.id}', ${i})" ${progress[i]?'checked':''}> MASTER LESSON
                </div>
                <div class="action-btns">
                    <button class="view-btn" onclick='toggleBoard("${g.id}", ${JSON.stringify(g.moves)})'>BOARD</button>
                    <button class="copy-btn" onclick='copyToClipboard(this, ${JSON.stringify(g.moves)})'>COPY</button>
                </div>
            </div>
            <h2 class="lesson-title">${g.title}</h2>
            <span class="master-quote">"${g.quote}"</span>
            <p style="font-size:14px; opacity:0.8">${g.story}</p>
            <div class="board-wrapper" id="board-wrapper-${g.id}">
                <div id="board-${g.id}" class="board-container"></div>
                <div class="hint-box" id="hint-${g.id}">Coach says: White to move. 🟢</div>
                <div class="board-controls">
                    <button class="ui-btn" onclick="step('${g.id}', -1)">Back</button>
                    <button class="ui-btn" onclick="step('${g.id}', 1)">Next</button>
                </div>
            </div>
            <div class="move-list">${g.moves.map(m => `<span class="move-item">${m}</span>`).join('')}</div>
        </div>`).join('');
    
    select.innerHTML = '<option value="">Jump...</option>' + games.map(g => `<option value="${g.id}">${g.title.split('.')[0]}</option>`).join('');
    updateProgressText();
    generateQuestion();
}

function toggleComplete(id, idx) {
    document.getElementById(id).classList.toggle('completed');
    const p = JSON.parse(localStorage.getItem('mma_progress') || '[]');
    p[idx] = !p[idx];
    localStorage.setItem('mma_progress', JSON.stringify(p));
    updateProgressText();
}

function updateProgressText() {
    const count = document.querySelectorAll('input[type="checkbox"]:checked').length;
    document.getElementById('progressText').innerText = `Progress: ${count} / 20`;
}

function toggleTheme() { document.body.classList.toggle('light-mode'); }
function jumpTo(id) { if(id) document.getElementById(id).scrollIntoView({behavior:'smooth'}); }
function pickRandom() { jumpTo(games[Math.floor(Math.random()*games.length)].id); }
function copyToClipboard(btn, m) { navigator.clipboard.writeText(m.join(' ')); btn.innerText="COPIED"; setTimeout(()=>btn.innerText="COPY", 1000); }
function filterLessons() {
    const t = document.getElementById('masterSearch').value.toLowerCase();
    Array.from(document.getElementsByClassName('lesson-card')).forEach(c => c.style.display = c.innerText.toLowerCase().includes(t) ? "block" : "none");
}

render();
</script>
</body>
</html>
