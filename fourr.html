<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Tree Master Pro | Enhanced Context</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chunk-card { border-left: 4px solid #d4af37; transition: all 0.2s; cursor: pointer; }
        .chunk-card.completed { border-left-color: #10b981; opacity: 0.5; }
        .chunk-card.sideline { border-left-color: #64748b; }
        textarea { background: #0f172a !important; border: 1px solid #334155 !important; font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="p-10">
    <!-- Keep previous UI structure, just update the logic in the script block below -->
    <script>
        // Updated Flatten function to include Look-Ahead Context
        function flattenAndExtract(node, chunks) {
            if (!node) return;
            node.children.forEach((child, index) => {
                if (child.type === 'token') {
                    let val = child.value;
                    const isMove = (/^[a-zA-Z]/.test(val) || val.startsWith('0-0') || val.startsWith('O-O')) && !val.startsWith('{') && !val.startsWith('[');
                    const isMoveNum = /^\d+\./.test(val);
                    
                    if (isMove && !isMoveNum) {
                        let path = getMovePathForNode(child);
                        let fen = calculateFen(path);
                        
                        // NEW: Look-Ahead Extraction (next 3 moves)
                        let lookAhead = [];
                        for(let i=1; i<=3; i++) {
                            if(node.children[index + i]) lookAhead.push(node.children[index + i].value);
                        }

                        let branchInfo = getBranchContext(child, node);
                        
                        chunks.push({
                            id: `CHUNK_${chunks.length}`,
                            target: val,
                            fen: fen,
                            lookAhead: lookAhead.join(" "), // Provided to AI
                            hasAnnotation: /[!?]+/.test(val),
                            moveNum: extractMoveNumber(val, path.length),
                            isMainLine: child.depth === 0,
                            choicesCount: branchInfo.choices,
                            alternatives: branchInfo.list.filter(m => m !== val).join(", ")
                        });
                    }
                } else if (child.type === 'variation') {
                    flattenAndExtract(child, chunks);
                }
            });
        }

        // Updated Prompt Generator
        function formatBatch(start, end) {
            const batch = globalChunks.slice(start, end).map(c => {
                return `[ID: ${c.id}]
TARGET MOVE: ${c.target} (Move ${c.moveNum}) ${c.hasAnnotation ? '[CRITICAL MOVE]' : ''}
FEN POSITION: ${c.fen}
LOOK-AHEAD: ${c.lookAhead}
BRANCH CONTEXT: ${c.choicesCount} paths. Alternatives: [${c.alternatives}]`;
            }).join("\n\n---\n\n");

            return `Role: Super Grandmaster writing a London System repertoire.
Task: Provide strategic annotations for the targets provided.

=== STRICT GUIDELINES ===
1. CRITICAL MOVES (!, ?, !?, ?!): If [CRITICAL MOVE] is present, you MUST explain the specific justification or tactical refutation.
2. LOOK-AHEAD: Use the provided "LOOK-AHEAD" moves to frame your commentary, ensuring you mention where the line is leading.
3. OPENING PHASE (Moves 1-12): Discuss theoretical concepts, standard London System setups, and why this transposition is chosen[span_1](start_span)[span_1](end_span).
4. DYNAMIC TONE: Avoid robotic, repetitive starts ("In this position..."). Vary your sentence structure with action verbs and structural insights[span_2](start_span)[span_2](end_span).
5. LENGTH:
   - Main Lines: 1-2 flowing sentences[span_3](start_span)[span_3](end_span).
   - Sidelines/Branches: Exactly 1 punchy sentence[span_4](start_span)[span_4](end_span).

Format: Return ONLY valid JSON mapping chunk ID to string.
{
  "CHUNK_0": "GM analysis...",
  "CHUNK_1": "Sideline insight..."
}`;
        }
    </script>
</body>
</html>
