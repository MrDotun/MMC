<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Tree Master Pro | Enhanced Context</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chunk-card { border-left: 4px solid #d4af37; transition: all 0.2s; cursor: pointer; }
        .chunk-card.completed { border-left-color: #10b981; opacity: 0.5; }
        .chunk-card.sideline { border-left-color: #64748b; }
        textarea { background: #0f172a !important; border: 1px solid #334155 !important; font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="p-10">

    <div class="max-w-4xl mx-auto glass p-8 rounded-xl shadow-2xl">
        <h1 class="text-3xl font-bold gold-text mb-2">GM Tree Master Pro</h1>
        <p class="text-slate-400 mb-6">Enhanced Context Engine Loaded. Ready to process PGN batches.</p>

        <textarea class="w-full h-40 p-4 rounded-lg text-sm mb-6 shadow-inner focus:outline-none focus:border-[#d4af37]" placeholder="Paste your repertoire PGN here..."></textarea>

        <button class="gold-bg font-bold py-2 px-6 rounded hover:opacity-90 transition shadow-lg mb-8">
            Process Batches
        </button>

        <div class="grid grid-cols-1 gap-4">
            <div class="chunk-card glass p-4 rounded shadow">
                <div class="text-xs text-slate-400 font-mono mb-1">CHUNK_0</div>
                <div class="font-bold text-lg">d4 Nf6 <span class="gold-text">c4 e6</span></div>
                <div class="text-sm mt-2 text-slate-300">Awaiting GM evaluation...</div>
            </div>
            
            <div class="chunk-card sideline glass p-4 rounded shadow">
                <div class="text-xs text-slate-400 font-mono mb-1">CHUNK_1 (Sideline)</div>
                <div class="font-bold text-lg">Bf4</div>
                <div class="text-sm mt-2 text-slate-300">London System setup detected.</div>
            </div>
        </div>
    </div>
    <script>
        // Global state for array tracking across chunk batches
        let globalChunks = [];

        // Helper to strip out engine evaluations and NAG markers (!, ?, $15)
        function cleanMoveSyntax(val) {
            if (!val) return '';
            return val.replace(/[!?#+]+|(\$\d+)/g, '').trim();
        }

        // Isolated check for clean, executable move tokens
        function isChessMove(val) {
            const cleanVal = cleanMoveSyntax(val);
            const isMove = (/^[a-zA-Z]/.test(cleanVal) || cleanVal.startsWith('0-0') || cleanVal.startsWith('O-O')) && !cleanVal.startsWith('{') && !cleanVal.startsWith('[');
            const isMoveNum = /^\d+\./.test(cleanVal);
            return isMove && !isMoveNum;
        }

        // Updated Flatten function to include Look-Ahead Context
        function flattenAndExtract(node, chunks) {
            if (!node) return;
            
            node.children.forEach((child, index) => {
                if (child.type === 'token' && typeof child.value === 'string') {
                    let val = child.value;
                    
                    if (isChessMove(val)) {
                        let path = getMovePathForNode(child);
                        let cleanVal = cleanMoveSyntax(val);
                        
                        // Calculate standard FEN using the cleaned representation to prevent chess.js errors
                        let fen = calculateFen(path);
                        
                        // Look-Ahead Extraction: Confined to the current variation bracket
                        let lookAhead = [];
                        let cursor = index + 1;
                        
                        while (lookAhead.length < 3 && cursor < node.children.length) {
                            let nextChild = node.children[cursor];
                            
                            // Skip nested variation tree branches entirely so we don't mix lines
                            if (nextChild && nextChild.type === 'variation') {
                                cursor++;
                                continue;
                            }
                            
                            if (nextChild && nextChild.type === 'token') {
                                let nextVal = nextChild.value;
                                if (isChessMove(nextVal)) {
                                    lookAhead.push(cleanMoveSyntax(nextVal));
                                }
                            }
                            cursor++;
                        }

                        let branchInfo = getBranchContext(child, node);
                        
                        chunks.push({
                            id: `CHUNK_${chunks.length}`,
                            target: cleanVal,
                            fen: fen,
                            lookAhead: lookAhead.join(" "), // Provided to AI (stays within current variation)
                            hasAnnotation: /[!?$]+/.test(val), // Flag if original token had engine tags
                            moveNum: extractMoveNumber(val, path.length),
                            isMainLine: child.depth === 0,
                            choicesCount: branchInfo.choices,
                            alternatives: branchInfo.list.filter(m => cleanMoveSyntax(m) !== cleanVal).map(cleanMoveSyntax).join(", ")
                        });
                    }
                } else if (child.type === 'variation') {
                    // Recursively process the sidelines/brackets
                    flattenAndExtract(child, chunks);
                }
            });
        }

        // Updated Prompt Generator
        function formatBatch(start, end) {
            const batch = globalChunks.slice(start, end).map(c => {
                return `[ID: ${c.id}]
TARGET MOVE: ${c.target} (Move ${c.moveNum}) ${c.hasAnnotation ? '[CRITICAL MOVE]' : ''}
FEN POSITION: ${c.fen}
LOOK-AHEAD: ${c.lookAhead}
BRANCH CONTEXT: ${c.choicesCount} paths. Alternatives: [${c.alternatives}]`;
            }).join("\n\n---\n\n");

            return `Role: Super Grandmaster writing a repertoire for Black against the London System.
Task: Provide strategic annotations for the targets provided from Black's perspective.

=== STRICT GUIDELINES ===
1. CRITICAL MOVES (!, ?, !?, ?!): If [CRITICAL MOVE] is present, you MUST explain the specific justification or tactical refutation.
2. LOOK-AHEAD: Use the provided "LOOK-AHEAD" moves to frame your commentary, ensuring you mention where the line is leading.
3. OPENING PHASE (Moves 1-12): Discuss theoretical concepts, how Black counters standard London System setups, and why this transposition is chosen.
4. DYNAMIC TONE: Avoid robotic, repetitive starts ("In this position..."). Vary your sentence structure with action verbs and structural insights.
5. LENGTH:
   - Main Lines: 1-2 flowing sentences.
   - Sidelines/Branches: Exactly 1 punchy sentence.

=== BATCH DATA ===
${batch}

Format: Return ONLY valid JSON mapping chunk ID to string.
{
  "CHUNK_0": "GM analysis...",
  "CHUNK_1": "Sideline insight..."
}`;
        }
    </script>
</body>
</html>
