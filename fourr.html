<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Variation Master Pro | Decipher Chess Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #090514; color: #f8fafc; }
        .gold-text { color: #fbbf24; }
        .gold-bg { background-color: #fbbf24; color: #090514; }
        .glass { background: rgba(30, 27, 57, 0.45); backdrop-filter: blur(16px); border: 1px solid rgba(251, 191, 36, 0.15); }
        .chunk-card { border-left: 4px solid #fbbf24; background: rgba(20, 16, 38, 0.6); transition: all 0.2s; cursor: pointer; }
        .chunk-card:hover { border-left-color: #f59e0b; background: rgba(43, 37, 77, 0.6); }
        .chunk-card.completed { border-left-color: #10b981; opacity: 0.4; }
        textarea { background: #0d091f !important; border: 1px solid #2e2652 !important; font-family: 'Fira Code', monospace; color: #e2e8f0; scrollbar-width: thin; }
        textarea:focus { border-color: #fbbf24 !important; outline: none; box-shadow: 0 0 10px rgba(251, 191, 36, 0.1); }
        #progress-fill { height: 100%; background: linear-gradient(90deg, #fbbf24, #f59e0b); width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-bold gold-text tracking-tight italic">DECIPHER <span class="text-white not-italic">GM-MASTER PRO</span></h1>
                <p class="text-indigo-400 text-sm font-light uppercase tracking-widest">Global Context + Positional Logic Engine</p>
            </div>
            <nav class="flex gap-2 p-1 bg-[#140f26] rounded-lg border border-purple-950">
                <button onclick="switchTab('fragmenter')" id="tab-f" class="px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg shadow-md">1. Fragmenter</button>
                <button onclick="switchTab('reassembler')" id="tab-r" class="px-6 py-2 rounded-md font-bold text-xs uppercase text-indigo-300 hover:text-white transition">2. Re-assembler</button>
            </nav>
        </header>

        <div id="view-fragmenter" class="space-y-6">
            <div class="glass p-6 rounded-2xl shadow-xl shadow-black/40">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-xs font-bold uppercase text-indigo-400 tracking-wider">Master PGN Input</label>
                    <div class="text-right">
                        <div id="stats" class="text-[10px] text-amber-400 font-semibold uppercase tracking-widest">Ready</div>
                        <div class="w-48 h-1.5 bg-purple-950/60 mt-1 rounded-full overflow-hidden"><div id="progress-fill"></div></div>
                    </div>
                </div>
                <textarea id="pgn-input" rows="6" class="w-full p-4 rounded-xl text-sm mb-4" placeholder="Paste PGN here..."></textarea>
                
                <div class="flex flex-wrap gap-3">
                    <button onclick="processPgn()" class="px-6 py-3 bg-white text-black font-bold rounded-xl hover:bg-slate-200 uppercase text-xs transition">Initialize Engine</button>
                    <button onclick="copyNextBatch()" id="batch-btn" class="px-6 py-3 gold-bg rounded-xl font-bold hidden uppercase text-xs shadow-md transition">Copy Next 10</button>
                    <button onclick="copyAllRemaining()" id="all-btn" class="px-6 py-3 bg-indigo-950/80 text-indigo-200 border border-indigo-800 rounded-xl font-bold hidden uppercase text-xs hover:bg-indigo-900 transition">Copy All Remaining</button>
                    <button onclick="clearAll()" class="px-6 py-3 bg-red-950/40 text-red-400 border border-red-900/40 rounded-xl font-bold uppercase text-xs hover:bg-red-950/60 transition">Reset</button>
                </div>
            </div>
            <div id="chunks-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
        </div>

        <div id="view-reassembler" class="hidden space-y-6">
            <div class="glass p-6 rounded-2xl shadow-xl shadow-black/40">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-indigo-400 uppercase tracking-wider">Step 1: Paste AI JSON</label>
                        <textarea id="ai-json" rows="14" class="w-full p-4 rounded-xl text-xs" placeholder="Paste the entire JSON response here..."></textarea>
                    </div>
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-indigo-400 uppercase tracking-wider">Step 2: Final Re-Assembled PGN</label>
                        <textarea id="final-pgn" rows="14" class="w-full p-4 rounded-xl text-xs text-emerald-400" readonly></textarea>
                        <div class="flex gap-2">
                            <button onclick="copyToClipboard('final-pgn')" class="flex-1 py-3 bg-indigo-950/60 hover:bg-indigo-950 text-xs font-bold rounded-lg border border-indigo-800 text-indigo-300 uppercase transition">Copy Final</button>
                            <button onclick="downloadPgn()" class="flex-1 py-3 bg-indigo-950/60 hover:bg-indigo-950 text-xs font-bold rounded-lg border border-indigo-800 text-indigo-300 uppercase transition">Download</button>
                        </div>
                    </div>
                </div>
                <button onclick="rebuildPgn()" class="mt-6 w-full py-4 gold-bg rounded-xl font-bold uppercase tracking-widest shadow-lg shadow-amber-950/40 hover:brightness-110 transition">Inject Annotations & Rebuild File</button>
            </div>
        </div>
    </div>

    <script>
        let globalChunks = [];
        let pgnTokens = [];
        let currentBatchStart = 0;

        window.onload = () => {
            const saved = localStorage.getItem('gm_master_state');
            if (saved) {
                const state = JSON.parse(saved);
                document.getElementById('pgn-input').value = state.original;
                processPgn(true);
                currentBatchStart = state.batchStart;
                updateUI();
            }
        };

        function switchTab(tab) {
            document.getElementById('view-fragmenter').classList.toggle('hidden', tab !== 'fragmenter');
            document.getElementById('view-reassembler').classList.toggle('hidden', tab !== 'reassembler');
            const f = document.getElementById('tab-f');
            const r = document.getElementById('tab-r');
            f.className = tab === 'fragmenter' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg shadow-md' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-indigo-300 hover:text-white transition';
            r.className = tab === 'reassembler' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg shadow-md' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-indigo-300 hover:text-white transition';
        }

        function getFenFromPath(path) {
            try {
                if (typeof Chess === 'undefined') return "FEN_ENGINE_MISSING";
                const chess = new Chess();
                for (let move of path) {
                    let cleanMove = move.replace(/[!?]+$/, '')
                                        .replace(/\$\d+/g, '')
                                        .replace(/(\+\/-|-\/\+|=\/\+|\+=|=\+|\+-|-\+|=)$/, '')
                                        .trim();
                    
                    cleanMove = cleanMove.replace(/0-0-0/g, 'O-O-O').replace(/0-0/g, 'O-O');

                    if (cleanMove && !/^\d+\.+$/.test(cleanMove) && cleanMove !== '(' && cleanMove !== ')') {
                        if (cleanMove === '--' || cleanMove === 'Z0') {
                            let tokens = chess.fen().split(' ');
                            tokens[1] = tokens[1] === 'w' ? 'b' : 'w';
                            tokens[3] = '-'; 
                            chess.load(tokens.join(' '));
                            continue;
                        }
                        chess.move(cleanMove, { sloppy: true });
                    }
                }
                return chess.fen();
            } catch (e) {
                return "FEN_GENERATION_FAILED";
            }
        }

        function processPgn(isLoad = false) {
            const input = document.getElementById('pgn-input').value;
            if (!input) return;

            pgnTokens = input.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|\$\d+|[a-zA-Z0-9\-+=#\/]+[?!]*|(\+\/-|-\/\+|=\/\+|\+=|=\+|\+-|-\+|=))/g) || [];
            
            let chunks = [];
            let moveNumber = 0;
            let variationLevel = 0;
            let currentPath = [];
            let savedPaths = []; 
            let depthPlyCounts = { 0: 0 }; 
            let justClosedVariation = false;

            pgnTokens.forEach((token, index) => {
                if (token === "(") {
                    variationLevel++;
                    depthPlyCounts[variationLevel] = 0; 
                    savedPaths.push([...currentPath]);
                    if (currentPath.length > 0) currentPath.pop();
                    justClosedVariation = false; 
                    return; 
                }
                if (token === ")") {
                    variationLevel--;
                    justClosedVariation = true; 
                    if (savedPaths.length > 0) {
                        currentPath = savedPaths.pop();
                    }
                    return; 
                }
                
                const isMoveNum = /^\d+\./.test(token);
                if (isMoveNum) {
                    moveNumber = parseInt(token);
                    return; 
                }

                const isMove = (/^[a-zA-Z0-9]/.test(token) || token.startsWith('0-0') || token.startsWith('O-O')) 
                              && !token.startsWith('{') && !token.startsWith('[') 
                              && !/^[0-9]+\.+$/.test(token)
                              && !/^(\+\/-|-\/\+|=\/\+|\+=|=\+|\+-|-\+|=)$/.test(token);
                
                if (isMove) {
                    depthPlyCounts[variationLevel]++;
                    currentPath.push(token);

                    let evalSymbol = "";
                    let nextToken = pgnTokens[index + 1];
                    
                    const isEvalToken = nextToken && (nextToken.startsWith('$') || /^[!?]+$/.test(nextToken) || /^(\+\/-|-\/\+|=\/\+|\+=|=\+|\+-|-\+|=)$/.test(nextToken));
                    if (isEvalToken) {
                        evalSymbol = ` ${nextToken}`;
                    }

                    const attachedEvalRegex = /[!?]+$|(\+\/-|-\/\+|=\/\+|\+=|=\+|\+-|-\+|=)$/;
                    const hasImportantSymbol = attachedEvalRegex.test(token) || evalSymbol !== "";

                    const isFirstMoveOfVariation = (variationLevel > 0 && depthPlyCounts[variationLevel] === 1);
                    const isStrideMove = (depthPlyCounts[variationLevel] % 6 === 0) || isFirstMoveOfVariation || justClosedVariation;

                    if (isStrideMove || hasImportantSymbol) {
                        const pathWithTarget = currentPath.slice(0); 
                        
                        let nextMoves = [];
                        let lookaheadLevel = 0;
                        for (let j = index + 1; j < pgnTokens.length; j++) {
                            let t = pgnTokens[j];
                            if (t === '(') { lookaheadLevel++; continue; }
                            if (t === ')') {
                                if (lookaheadLevel === 0) break; 
                                lookaheadLevel--;
                                continue;
                            }
                            if (lookaheadLevel === 0) {
                                const isM = (/^[a-zA-Z0-9]/.test(t) || t.startsWith('0-0') || t.startsWith('O-O')) 
                                            && !t.startsWith('{') && !t.startsWith('[') && !/^[0-9]+\.+$/.test(t)
                                            && !/^(\+\/-|-\/\+|=\/\+|\+=|=\+|\+-|-\+|=)$/.test(t);
                                if (isM) {
                                    nextMoves.push(t);
                                    if (nextMoves.length >= 4) break;
                                }
                            }
                        }
                        
                        chunks.push({
                            id: `CHUNK_${chunks.length}`,
                            target: token + evalSymbol,
                            moveNum: moveNumber,
                            tokenIndex: index,
                            context: currentPath.slice(-15, -1).join(" "), 
                            lookahead: nextMoves.join(" ") || "Line ends here.",
                            fen: getFenFromPath(pathWithTarget),
                            isMainLine: variationLevel === 0,
                            isReturning: justClosedVariation && variationLevel === 0 
                        });
                        
                        justClosedVariation = false; 
                    }
                }
            });

            globalChunks = chunks;
            if (!isLoad) currentBatchStart = 0;
            document.getElementById('batch-btn').classList.remove('hidden');
            document.getElementById('all-btn').classList.remove('hidden');
            updateUI();
            saveState();
        }

        function formatBatch(start, end) {
            const masterPgn = document.getElementById('pgn-input').value;

            const batch = globalChunks.slice(start, end).map(c => 
                `[ID: ${c.id}]\nMove Number: ${c.moveNum}\nFEN: ${c.fen}\nPath taken to this move: ${c.context}\n--> TARGET MOVE: ${c.target} <--\nImmediate Next Moves in this exact line: ${c.lookahead}\nMain Line: ${c.isMainLine}\nReturning to Main: ${c.isReturning}`
            ).join("\n\n---\n\n");

            return `Role: You are an elite 2700+ ELO Super Grandmaster writing an authoritative repertoire masterclass course.
Topic: Anti-London System configurations for BLACK (Countering White's early Bf4/d4 setups).
Task: Write deeply insightful, engaging course annotations for the TARGET MOVES.

=== MASTER VARIATION TREE ===
${masterPgn}
=============================

ANTI-ROBOTIC PROSE, VERSATILITY & TRANSITION GUIDELINES:
1. VARIATION / SIDELINE MARKERS (Main Line: false): If a move is part of an offshoot branch, you must naturally introduce the structural shift or indicate White's structural alternatives using elegant Grandmaster phrasing. Inject transitions such as:
   - "Should White decide to play..."
   - "In case White chooses to go for a sharp configuration with..."
   - "Capturing the pawn remains a highly double-edged alternative for White..."
   - "If White instead opts to trade off the..."
2. RETURNING TO MAIN TRACK (Returning to Main: true): If the flag indicates a return to the master tree line, explicitly highlight that we are structural anchors back on solid theoretical paths. Use indicators like:
   - "Returning to our core main-line path, we focus on..."
   - "Stepping back onto the main track of our repertoire, Black stands completely ready..."
   - "We resume the main strategic highway where our primary pressure..."
3. NO REPETITIVE PATTERNS: Absolutely DO NOT structure thoughts like "White plays X, so we play Y" or "If White tries X, we have to respond with Y". Completely avoid starting sentences with predictable "White plays... We play..." structural matching. 
4. NATURAL DYNAMIC GM PERSONALITY: Begin sentences using unique tactical hooks or macro positional goals. For example:
   - "This is a highly refined response..."
   - "An elegant nuance designed to..."
   - "White attempts to lock us down here, but hitting the center immediately with..."
   - "We are completely fine in this structure because..."
5. SPECIFIC INSTRUCTIONS FOR CRITICAL MOVE SYMBOLS:
   - If the TARGET MOVE features an attached "!", directly comment on its concrete, high-level theoretical excellence or hidden tactical sharpness.
   - If the TARGET MOVE features an attached "?", break down the strategic blunder or explain how it compromises White's long-term structure.
   - If the TARGET MOVE features an attached "!?" or "?!", address the psychological edge, the speculative double-edged nature, or the dynamic inaccuracy introduced into the line.
6. THEORETICAL WEIGHT FOR EARLY OPENING (MOVES 5-7): If the target move falls between move 5 and 7, deliver deep positional explanations. Detail the strategic themes: fighting for the e5 square, standard structural tension with an early ...c5 break, targeting White's b2 pawn via ...Qb6, or trading off their dangerous dark-squared London bishop.
7. STRICT LENGTH CONTROL:
   - MAIN LINES (Main Line: true): Comments should be slightly more elaborate and insightful (e.g., 2-3 flowing sentences).
   - VARIATIONS/SIDELINES (Main Line: false): Comments for moves within a variation should be one sentence, or two in rare cases.
8. CONVERT EVALUATION SYMBOLS TO WORDS: Translate positional assessment markers natively. (e.g., "-/+" becomes "We enjoy clear strategic control", "+/=" becomes "White retains a micro-edge but nothing scary", "=" becomes "The position completely equalizes"). Never use raw evaluation symbols in your written commentary text.
9. CRITICAL CRITICAL RULE - ABSOLUTELY NO FEN STRINGS IN TEXT OUTPUT: Under no circumstances are you allowed to output any FEN string data, bracketed tags like '[FEN:...]', or any chess coordinate layout maps within your textual annotations mapping. The annotation must consist EXCLUSIVELY of clean, readable strategic English prose.

FORMAT REQUIREMENT: 
Return ONLY a valid JSON object mapping the chunk ID to the text. No markdown blocks. Start with the { bracket.
{
  "CHUNK_0": "Your professional Grandmaster annotation here...",
  "CHUNK_1": "Your professional Grandmaster annotation here..."
}

=== BATCH TO ANALYZE ===
${batch}`;
        }

        function copyNextBatch() {
            const end = Math.min(currentBatchStart + 10, globalChunks.length);
            navigator.clipboard.writeText(formatBatch(currentBatchStart, end));
            currentBatchStart = end;
            updateUI();
            saveState();
            alert("Batch Copied to Clipboard!");
        }

        function copyAllRemaining() {
            navigator.clipboard.writeText(formatBatch(currentBatchStart, globalChunks.length));
            currentBatchStart = globalChunks.length;
            updateUI();
            saveState();
            alert("Full Game Copied to Clipboard!");
        }

        function rebuildPgn() {
            const raw = document.getElementById('ai-json').value;
            let aiData = {};
            const matches = raw.match(/\{[\s\S]*?\}/g);
            if (matches) {
                matches.forEach(m => {
                    try { Object.assign(aiData, JSON.parse(m)); } catch(e){}
                });
            }
            let workingTokens = [...pgnTokens];
            const sortedIds = Object.keys(aiData).sort((a,b) => {
                const idxA = globalChunks.find(c => c.id === a)?.tokenIndex || 0;
                const idxB = globalChunks.find(c => c.id === b)?.tokenIndex || 0;
                return idxB - idxA;
            });
            sortedIds.forEach(id => {
                const chunk = globalChunks.find(c => c.id === id);
                if (chunk) {
                    workingTokens[chunk.tokenIndex] += ` { ${aiData[id]} }`;
                }
            });
            document.getElementById('final-pgn').value = workingTokens.join(" ");
        }

        function updateUI() {
            const container = document.getElementById('chunks-container');
            container.innerHTML = "";
            globalChunks.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = `chunk-card glass p-2 rounded-lg ${i < currentBatchStart ? 'completed' : ''}`;
                div.innerHTML = `<p class="text-[8px] gold-text font-bold">${c.id}</p><p class="text-[10px] truncate">${c.target}</p>`;
                container.appendChild(div);
            });
            const perc = (currentBatchStart / globalChunks.length) * 100 || 0;
            document.getElementById('progress-fill').style.width = perc + "%";
            document.getElementById('stats').innerText = `${currentBatchStart}/${globalChunks.length} KEY POSITIONS`;
        }

        function saveState() {
            localStorage.setItem('gm_master_state', JSON.stringify({
                original: document.getElementById('pgn-input').value,
                batchStart: currentBatchStart
            }));
        }

        function clearAll() {
            localStorage.removeItem('gm_master_state');
            location.reload();
        }

        function copyToClipboard(id) {
            const val = document.getElementById(id).value;
            navigator.clipboard.writeText(val);
            alert("Copied!");
        }

        function downloadPgn() {
            const val = document.getElementById('final-pgn').value;
            const blob = new Blob([val], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "GM_Variation_Analysis.pgn";
            a.click();
        }
    </script>
</body>
</html>
