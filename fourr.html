<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Variation Master Pro | Decipher Chess Academy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .cyan-text { color: #06b6d4; }
        .cyan-bg { background-color: #06b6d4; color: #020617; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chunk-card { border-left: 4px solid #334155; transition: all 0.2s; cursor: pointer; }
        .chunk-card:hover { border-left-color: #06b6d4; background: rgba(255,255,255,0.05); }
        .chunk-card.selected-start { border-left-color: #06b6d4; background-color: rgba(6, 182, 212, 0.3); }
        .chunk-card.selected-range { border-left-color: #22d3ee; background-color: rgba(6, 182, 212, 0.15); }
        
        textarea, input[type="text"] { background: #0f172a !important; border: 1px solid #334155 !important; font-family: 'Fira Code', monospace; scrollbar-width: thin; color: #fff; }
        textarea:focus, input[type="text"]:focus { border-color: #06b6d4 !important; outline: none; }
        #progress-fill { height: 100%; background: #06b6d4; width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .board-container { width: 100%; max-width: 360px; margin: 0 auto; flex-shrink: 0; }
        
        /* Spinner for loading state */
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-left-color: #1e293b; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-bold cyan-text tracking-tight italic">DECIPHER <span class="text-white not-italic">GM-MASTER PRO</span></h1>
                <p class="text-slate-400 text-sm font-light uppercase tracking-widest">Selective Annotation Engine</p>
            </div>
            <nav class="flex gap-2 p-1 bg-slate-900 rounded-lg">
                <button onclick="switchTab('fragmenter')" id="tab-f" class="px-6 py-2 rounded-md font-bold text-xs uppercase cyan-bg">1. Fragmenter</button>
                <button onclick="switchTab('reassembler')" id="tab-r" class="px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white">2. Re-assembler</button>
            </nav>
        </header>

        <div id="view-fragmenter" class="space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-xs font-bold uppercase text-slate-500">Master PGN Input</label>
                    <div class="text-right">
                        <div id="stats" class="text-[10px] text-slate-400 uppercase tracking-widest">Ready</div>
                        <div class="w-48 h-1 bg-slate-800 mt-1 rounded-full overflow-hidden"><div id="progress-fill"></div></div>
                    </div>
                </div>
                <textarea id="pgn-input" rows="4" class="w-full p-4 rounded-xl text-sm mb-4" placeholder="Paste PGN here..."></textarea>
                
                <div class="flex flex-wrap items-center gap-3">
                    <button onclick="processPgn()" class="px-6 py-3 bg-white text-black font-bold rounded-xl hover:bg-slate-200 uppercase text-xs">Initialize Engine</button>
                    <button onclick="copySelectedBatch()" id="copy-btn" class="px-6 py-3 cyan-bg rounded-xl font-bold uppercase text-xs hidden shadow-lg shadow-cyan-900/20"><span id="copy-text">Copy Selected Batch</span></button>
                    <button onclick="clearAll()" class="px-6 py-3 bg-red-900/30 text-red-400 rounded-xl font-bold uppercase text-xs">Reset</button>
                </div>
            </div>

            <div id="workspace" class="flex flex-col lg:flex-row gap-6 hidden">
                
                <div class="lg:w-1/3 space-y-4">
                    <div class="glass p-4 rounded-xl">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-bold text-slate-500 uppercase">Start Position</span>
                        </div>
                        <div class="board-container">
                            <div id="board" style="width: 100%;"></div>
                        </div>
                        <div class="mt-4">
                            <label class="text-[10px] font-bold text-slate-500 uppercase">FEN (Feed to AI)</label>
                            <input type="text" id="fen-output" class="w-full p-3 rounded-lg text-xs mt-1 text-cyan-400" readonly placeholder="FEN will appear here...">
                        </div>
                    </div>
                </div>

                <div class="lg:w-2/3 glass p-4 rounded-xl">
                    <div class="mb-3 text-xs text-slate-400 italic">
                        <span class="text-cyan-400 font-bold">Instruction:</span> Click a move to set the <span class="text-white">START</span> of your batch, then click another move to set the <span class="text-white">END</span>.
                    </div>
                    <div id="chunks-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-2 max-h-[500px] overflow-y-auto pr-2"></div>
                </div>
                
            </div>
        </div>

        <div id="view-reassembler" class="hidden space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 1: Paste AI JSON</label>
                        <textarea id="ai-json" rows="14" class="w-full p-4 rounded-xl text-xs" placeholder="Paste the final AI JSON output here..."></textarea>
                    </div>
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 2: Final Re-Assembled PGN</label>
                        <textarea id="final-pgn" rows="14" class="w-full p-4 rounded-xl text-xs text-cyan-400" readonly></textarea>
                        <div class="flex gap-2">
                            <button onclick="copyToClipboard('final-pgn')" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase hover:bg-slate-700">Copy Final</button>
                            <button onclick="downloadPgn()" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase hover:bg-slate-700">Download</button>
                        </div>
                    </div>
                </div>
                <button onclick="rebuildPgn()" class="mt-6 w-full py-4 cyan-bg rounded-xl font-bold uppercase tracking-widest shadow-lg shadow-cyan-900/20 hover:bg-cyan-500">Inject Annotations & Rebuild File</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        let globalChunks = [];
        let pgnTokens = [];
        let board = null;
        let selStart = null;
        let selEnd = null;
        let globalSfWorker = null; 
        
        // Multi-stage Sequence Variables
        let pendingPrompts = [];
        let currentPromptIndex = 0;

        window.onload = () => {
            board = Chessboard('board', {
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                position: 'start'
            });

            const saved = localStorage.getItem('gm_master_state');
            if (saved) {
                const state = JSON.parse(saved);
                document.getElementById('pgn-input').value = state.original;
                if(state.original) { processPgn(true); }
            }
        };

        async function initEngineWorker() {
            if (globalSfWorker) return globalSfWorker;
            try {
                const resp = await fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
                const jsCode = await resp.text();
                const blob = new Blob([jsCode], { type: 'application/javascript' });
                globalSfWorker = new Worker(URL.createObjectURL(blob));
            } catch(err) {
                console.warn("Fetch failed, using fallback", err);
                const sfCode = `importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');`;
                const blob = new Blob([sfCode], { type: 'application/javascript' });
                globalSfWorker = new Worker(URL.createObjectURL(blob));
            }
            globalSfWorker.postMessage('uci');
            return globalSfWorker;
        }

        function switchTab(tab) {
            document.getElementById('view-fragmenter').classList.toggle('hidden', tab !== 'fragmenter');
            document.getElementById('view-reassembler').classList.toggle('hidden', tab !== 'reassembler');
            const f = document.getElementById('tab-f');
            const r = document.getElementById('tab-r');
            f.className = tab === 'fragmenter' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase cyan-bg' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
            r.className = tab === 'reassembler' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase cyan-bg' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
        }

        function processPgn(isLoad = false) {
            const input = document.getElementById('pgn-input').value;
            if (!input) return;

            initEngineWorker(); 

            pgnTokens = input.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|\$\d+|[a-zA-Z0-9\-+=#\/]+[?!]*)/g) || [];
            
            let chunks = [];
            let moveNumber = 0;
            let variationLevel = 0;
            let depthPlyCounts = { 0: 0 }; 
            let lastChunkAtLevel = {};

            let chess = new Chess();
            let stateStack = [];
            let currentFEN = chess.fen();
            let fenBeforeLastMove = currentFEN;

            pgnTokens.forEach((token, index) => {
                if (token === "(") {
                    variationLevel++;
                    depthPlyCounts[variationLevel] = 0; 
                    stateStack.push({ current: currentFEN, beforeLast: fenBeforeLastMove });
                    chess.load(fenBeforeLastMove);
                    return; 
                }
                if (token === ")") {
                    if (lastChunkAtLevel[variationLevel]) {
                        lastChunkAtLevel[variationLevel].isVariationEnd = true;
                    }
                    variationLevel--;
                    let state = stateStack.pop();
                    if(state) {
                        chess.load(state.current);
                        currentFEN = state.current;
                        fenBeforeLastMove = state.beforeLast;
                    }
                    return; 
                }
                
                const isMoveNum = /^\d+\./.test(token);
                if (isMoveNum) {
                    moveNumber = parseInt(token);
                    return; 
                }

                const isMove = /^[a-hA-ZRKNQBO]/.test(token) && !token.startsWith('{') && !token.startsWith('[');
                
                if (isMove) {
                    depthPlyCounts[variationLevel] = (depthPlyCounts[variationLevel] || 0) + 1;
                    fenBeforeLastMove = chess.fen();

                    let cleanMove = token.replace(/[^a-zA-Z0-9=\+\-#O]/g, ''); 
                    let moveObj = chess.move(cleanMove);
                    currentFEN = chess.fen();

                    let evalSymbol = "";
                    let nextToken = pgnTokens[index + 1];
                    if (nextToken && (nextToken.startsWith('$') || /^[!?]+$/.test(nextToken) || /^[\+\-=]+$/.test(nextToken))) {
                        evalSymbol = ` ${nextToken}`;
                    }

                    const isFirstMoveOfVariation = (variationLevel > 0 && depthPlyCounts[variationLevel] === 1);

                    let newChunk = {
                        id: `CHK_${chunks.length}_M${moveNumber}_V${variationLevel}`,
                        target: token + evalSymbol,
                        moveNum: moveNumber,
                        tokenIndex: index,
                        isMainLine: variationLevel === 0,
                        isVariationStart: isFirstMoveOfVariation,
                        isVariationEnd: false,
                        fen: fenBeforeLastMove,
                        fenAfter: currentFEN
                    };

                    chunks.push(newChunk);
                    lastChunkAtLevel[variationLevel] = newChunk;
                }
            });

            if (lastChunkAtLevel[0]) {
                lastChunkAtLevel[0].isVariationEnd = true;
            }

            globalChunks = chunks;
            document.getElementById('workspace').classList.remove('hidden');
            document.getElementById('copy-btn').classList.remove('hidden');
            
            selStart = null;
            selEnd = null;
            pendingPrompts = [];
            currentPromptIndex = 0;
            
            board.position('start', false);
            document.getElementById('fen-output').value = "";

            updateUI();
            saveState();
        }

        function selectChunk(index) {
            // Reset sequence if a new selection is made
            pendingPrompts = [];
            currentPromptIndex = 0;
            document.getElementById('copy-text').innerText = "Copy Selected Batch";

            if (selStart === null || (selStart !== null && selEnd !== null)) {
                selStart = index;
                selEnd = null;
                let fen = globalChunks[index].fen;
                document.getElementById('fen-output').value = fen;
                board.position(fen, false); 
            } else {
                selEnd = Math.max(selStart, index);
                selStart = Math.min(selStart, index);
            }
            updateUI();
        }

        function getStockfishPV(fen, depth = 22, onLiveLineUpdate) {
            return new Promise(async (resolve) => {
                const worker = await initEngineWorker();
                let uciMoves = [];
                let searchStarted = false; 
                
                let timeoutId = setTimeout(() => {
                    worker.onmessage = null;
                    resolve(uciMoves);
                }, 10000);

                worker.onmessage = function (e) {
                    const line = e.data;
                    if (typeof line === 'string') {
                        if (line.includes('info ')) searchStarted = true;

                        if (line.includes(' pv ')) {
                            const parts = line.split(' pv ');
                            uciMoves = parts[1].trim().split(' ').slice(0, 6);
                            if (onLiveLineUpdate) onLiveLineUpdate(uciMoves);
                        }
                        
                        if (searchStarted && line.includes('bestmove')) {
                            clearTimeout(timeoutId);
                            worker.onmessage = null;
                            resolve(uciMoves);
                        }
                    }
                };

                worker.postMessage('stop');
                worker.postMessage(`position fen ${fen}`);
                worker.postMessage(`go depth ${depth}`);
            });
        }

        async function copySelectedBatch() {
            const btn = document.getElementById('copy-btn');
            const btnText = document.getElementById('copy-text');
            const statsText = document.getElementById('stats');
            const progressFill = document.getElementById('progress-fill');

            // Handle Sequential Copying State
            if (pendingPrompts.length > 0) {
                let currentPrompt = pendingPrompts[currentPromptIndex];
                
                const executeCopy = () => {
                    currentPromptIndex++;
                    if (currentPromptIndex >= pendingPrompts.length) {
                        alert("Final JSON Prompt Copied! Once generated, paste it into the Re-assembler.");
                        resetCopyBtnUI(btn, btnText, statsText, progressFill, globalChunks.length);
                    } else {
                        btnText.innerText = `Copy Prompt ${currentPromptIndex + 1} of 3`;
                        statsText.innerText = `WAITING FOR AI RESPONSE...`;
                        progressFill.style.width = `${(currentPromptIndex / 3) * 100}%`;
                        alert(`Prompt ${currentPromptIndex} copied!\n\n1. Paste it into the AI.\n2. Wait for its response.\n3. Come back here and click to copy Prompt ${currentPromptIndex + 1}.`);
                    }
                };

                navigator.clipboard.writeText(currentPrompt).then(executeCopy).catch(err => {
                    const textArea = document.createElement("textarea");
                    textArea.value = currentPrompt;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        executeCopy();
                    } catch (e) {
                        alert("Clipboard error. Please try again or copy manually.");
                    }
                    document.body.removeChild(textArea);
                });
                return;
            }

            // Normal Engine Batch Execution
            if (selStart === null) {
                alert("Please click on a starting move and an ending move first!");
                return;
            }
            
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btn.disabled = true;

            let endIdx = selEnd !== null ? selEnd : selStart;
            let startingFen = globalChunks[selStart].fen;
            let batchData = [];
            let totalSelectedMoves = (endIdx - selStart) + 1;

            for (let i = selStart; i <= endIdx; i++) {
                let currentStep = (i - selStart) + 1;
                let c = globalChunks[i];
                let lineOutput = `[ID: ${c.id}] | Move: ${c.moveNum}. ${c.target} | Main Line: ${c.isMainLine} | Variation Start: ${c.isVariationStart}`;

                let currentProgress = ((currentStep - 1) / totalSelectedMoves) * 100;
                progressFill.style.width = `${currentProgress}%`;
                btnText.innerHTML = `<div class="spinner"></div>Analyzing [${currentStep}/${totalSelectedMoves}]...`;
                statsText.innerText = `Analyzing Move: ${c.moveNum}. ${c.target}`;

                let getsEngineAssist = c.isVariationEnd;

                if (getsEngineAssist) {
                    let fenAfterMove = c.fenAfter; 
                    
                    try {
                        let pvUci = await getStockfishPV(fenAfterMove, 22, (currentUciList) => {
                            let tempVisualChess = new Chess(fenAfterMove);
                            let visualSan = [];
                            for(let uci of currentUciList) {
                                try {
                                    let mObj = { from: uci.substring(0, 2), to: uci.substring(2, 4) };
                                    if (uci.length > 4) mObj.promotion = uci.substring(4, 5);
                                    let vMove = tempVisualChess.move(mObj);
                                    if (!vMove) vMove = tempVisualChess.move(uci, {sloppy: true});
                                    if(vMove) visualSan.push(vMove.san); else break;
                                } catch(err){ break; }
                            }
                            statsText.innerText = `[${c.moveNum}.${c.target}] Lines: ${visualSan.join(" ")}`;
                        });
                        
                        let pvSan = [];
                        let tempChess = new Chess(fenAfterMove);
                        
                        for (let uci of pvUci) {
                            try {
                                let moveObj = {
                                    from: uci.substring(0, 2),
                                    to: uci.substring(2, 4)
                                };
                                if (uci.length > 4) moveObj.promotion = uci.substring(4, 5);

                                let move = tempChess.move(moveObj);
                                if (!move) move = tempChess.move(uci, {sloppy: true}); 

                                if (move) {
                                    pvSan.push(move.san);
                                } else break;
                            } catch (e) { break; }
                        }

                        if (pvSan.length > 0) {
                            lineOutput += `\n   -> [CURRENT FEN]: ${fenAfterMove}\n   -> [STOCKFISH ENGINE NEXT 6 MOVES]: ${pvSan.join(" ")}`;
                        } else {
                            lineOutput += `\n   -> [ENGINE NOTE]: Reached evaluation timeout or empty lines.`;
                        }
                    } catch (e) {
                        console.error("Engine failed for move:", e);
                    }
                } else {
                    statsText.innerText = `Skipping Engine for ${c.moveNum}. ${c.target} (Normal Line)`;
                }
                batchData.push(lineOutput);
            }

            const batchString = batchData.join("\n");
            
            // Build Deep 3-Step Prompts
            const prompt1 = `You are a 2700+ human Grandmaster annotating a chess game. 
We are doing a deep analysis in multiple steps to ensure maximum accuracy. Do NOT output JSON yet.

STARTING FEN FOR THIS BATCH: ${startingFen}

=== STEP 1: LOGICAL DRAFT & ENGINE TRANSLATION ===
Here is the batch of moves along with Stockfish engine evaluations for critical positions.
Your task for this first prompt is strictly to draft the chess logic in plain text.
- Analyze the moves. Aim to annotate about 50% of them.
- EXPLAIN TACTICS & SACS: Pay close attention to sudden evaluation shifts, sacrifices, or when a side plays an "obvious but bad" move (e.g., automatically recapturing after a sacrifice when it actually loses). You MUST cross-check the provided engine lines to explain EXACTLY why that natural move fails or why the sacrifice is brilliant. 
- Translate the engine's tactical sequence into human concepts. Do NOT use phrases like "the engine says". Internalize the evaluation as your own GM intuition.

=== BATCH DATA ===
${batchString}

Acknowledge these instructions and provide your plain text analysis draft now.`;

            const prompt2 = `=== STEP 2: REVIEW & REFINE (CROSS-CHECK) ===
Now, act as a strict editor and cross-check your previous analysis. 

1. CROSS-CHECK LOGIC: Did you properly explain the sacrifices or obvious blunders using the underlying tactical ideas from the engine? Fix any hallucinated analysis. Ensure the explanation makes logical chess sense.
2. TONE & STYLE: Eradicate banned words: "Blunt", "Showing their hand", "Thrust", "Critical test", "Signals the intention", "Secure". Inject a pragmatic, human tone ("unpleasant", "I prefer", "close to losing").
3. HISTORICAL CONTEXT: If there are Main Line moves between move 4 and 7, inject theoretical/historical context regarding the Najdorf e6 or French Defense.
4. BRITISH SPELLING & FORMAT: Use "centre", "pair of bishops", and hyphenate squares like "d4-square". Replace "tuck", "drop", or "jump" with "move".

Provide your heavily edited, cross-checked, and refined draft now.`;

            const prompt3 = `=== STEP 3: FINAL JSON EXTRACTION ===
Perfect. Now, take your finalized, edited annotations and map them perfectly to their corresponding Chunk IDs from the original batch.

RULES FOR THE JSON:
- Output ONLY the finalized text as a pure, raw JSON object. 
- Start immediately with { and end with }. 
- Do NOT include markdown blocks like \`\`\`json.
- Placement Context: For Main Line moves, your annotation appears AFTER the move. For Variation Starts, it appears BEFORE the move (phrase these as an introduction, e.g., "If Black decides...").

Example format:
{
  "CHK_0_M4_V0": "Your human GM text here...",
  "CHK_5_M4_V1": "If White tries to preserve the bishop..."
}

Output the finalized JSON now.`;

            pendingPrompts = [prompt1, prompt2, prompt3];
            currentPromptIndex = 0;
            
            let firstPrompt = pendingPrompts[0];

            const copyInitial = () => {
                currentPromptIndex++;
                btnText.innerText = `Copy Prompt 2 of 3`;
                statsText.innerText = `PROMPT 1 COPIED`;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                btn.disabled = false;
                progressFill.style.width = '33%';
                alert(`Engine Finished!\n\nPrompt 1 of 3 has been copied to your clipboard.\n\n1. Paste it into the AI.\n2. Wait for its response.\n3. Return here and click the button again to copy Prompt 2.`);
            };

            navigator.clipboard.writeText(firstPrompt).then(copyInitial).catch(err => {
                const textArea = document.createElement("textarea");
                textArea.value = firstPrompt;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    copyInitial();
                } catch (e) {
                    alert("Clipboard error. Please try again or copy manually.");
                    resetCopyBtnUI(btn, btnText, statsText, progressFill, totalSelectedMoves);
                }
                document.body.removeChild(textArea);
            });
        }

        function resetCopyBtnUI(btn, btnText, statsText, progressFill, total) {
            pendingPrompts = [];
            currentPromptIndex = 0;
            btnText.innerText = "Copy Selected Batch";
            statsText.innerText = `${globalChunks.length} TOTAL MOVES`;
            btn.classList.remove('opacity-80', 'cursor-not-allowed');
            btn.disabled = false;
            setTimeout(() => { progressFill.style.width = '0%'; }, 1500);
        }

        function updateUI() {
            const container = document.getElementById('chunks-container');
            container.innerHTML = "";
            
            globalChunks.forEach((c, i) => {
                const div = document.createElement('div');
                let selectionClass = '';
                if (selStart !== null) {
                    let maxSelect = selEnd !== null ? selEnd : selStart;
                    if (i === selStart) selectionClass = 'selected-start';
                    else if (i > selStart && i <= maxSelect) selectionClass = 'selected-range';
                }

                div.className = `chunk-card glass p-3 rounded-lg ${selectionClass}`;
                div.onclick = () => selectChunk(i);
                div.innerHTML = `<p class="text-[9px] cyan-text font-bold mb-1">${c.id}</p><p class="text-xs font-semibold truncate">${c.moveNum}. ${c.target}</p>`;
                container.appendChild(div);
            });
            document.getElementById('stats').innerText = `${globalChunks.length} TOTAL MOVES`;
        }

        function rebuildPgn() {
            const raw = document.getElementById('ai-json').value;
            let aiData = {};
            const matches = raw.match(/\{[\s\S]*?\}/g);
            if (matches) {
                matches.forEach(m => {
                    try { Object.assign(aiData, JSON.parse(m)); } catch(e){}
                });
            }
            
            let workingTokens = [...pgnTokens];
            const sortedIds = Object.keys(aiData).sort((a,b) => {
                const idxA = globalChunks.find(c => c.id === a)?.tokenIndex || 0;
                const idxB = globalChunks.find(c => c.id === b)?.tokenIndex || 0;
                return idxB - idxA;
            });

            sortedIds.forEach(id => {
                const chunk = globalChunks.find(c => c.id === id);
                if (chunk) {
                    if (chunk.isVariationStart) {
                        let prevToken = workingTokens[chunk.tokenIndex - 1];
                        if (prevToken && /^\d+\.{1,3}$/.test(prevToken)) {
                            workingTokens[chunk.tokenIndex - 1] = `{ ${aiData[id]} } ` + prevToken;
                        } else {
                            workingTokens[chunk.tokenIndex] = `{ ${aiData[id]} } ` + workingTokens[chunk.tokenIndex];
                        }
                    } else {
                        workingTokens[chunk.tokenIndex] += ` { ${aiData[id]} }`;
                    }
                }
            });

            document.getElementById('final-pgn').value = workingTokens.join(" ");
        }

        function saveState() {
            localStorage.setItem('gm_master_state', JSON.stringify({ original: document.getElementById('pgn-input').value }));
        }

        function clearAll() {
            localStorage.removeItem('gm_master_state');
            location.reload();
        }

        function copyToClipboard(id) {
            navigator.clipboard.writeText(document.getElementById(id).value);
            alert("Copied!");
        }

        function downloadPgn() {
            const val = document.getElementById('final-pgn').value;
            const blob = new Blob([val], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "GM_Variation_Analysis.pgn";
            a.click();
        }
    </script>
</body>
</html>
