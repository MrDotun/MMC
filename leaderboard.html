<!DOCTYPE html>
<html>
<head>
<style>
    /* Integrated Academy Theme */
    body { 
        background-color: #1a1a2e; 
        margin: 0; 
        padding: 0; 
        display: flex; 
        flex-direction: column; 
        align-items: center;
    }

    /* Carousel Styling */
    .carousel-container { 
        position: relative; 
        width: 100%; 
        max-width: 500px; 
        margin: 0 auto; 
        overflow: hidden; 
        height: 300px; 
        border-radius: 0 0 20px 20px; 
        box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
        background-color: #2D1B4D; 
    }
    
    .slides { 
        display: flex; 
        width: 200%; 
        height: 100%; 
        animation: slide-two 10s infinite; 
    }
    
    .slide { 
        width: 50%; 
        height: 100%; 
        background-size: cover; 
        background-position: center; 
    }
    
    @keyframes slide-two {
        0%, 45% { transform: translateX(0%); }
        50%, 95% { transform: translateX(-50%); }
        100% { transform: translateX(0%); }
    }

    .hero-overlay { 
        position: absolute; 
        top: 0; left: 0; width: 100%; height: 100%; 
        background: linear-gradient(rgba(45, 27, 77, 0.5), rgba(45, 27, 77, 0.3)); 
        display: flex; flex-direction: column; justify-content: center; 
        align-items: center; color: white; text-align: center; 
    }

    /* Styling for the leaderboard container */
    .chess-container { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        max-width: 500px; 
        width: 90%;
        margin: 20px auto; 
        border: 2px solid #4ade80; 
        border-radius: 10px; 
        padding: 20px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        background-color: #2D1B4D; 
        color: white;
    }

    h2 { text-align: center; color: #4ade80; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }
    label { color: #facc15; font-weight: bold; display: block; margin-bottom: 5px; }

    select { 
        width: 100%; 
        padding: 12px; 
        margin-bottom: 20px; 
        border-radius: 5px; 
        border: 1px solid #4ade80; 
        font-size: 16px; 
        background-color: #1a1a2e; 
        color: white;
        cursor: pointer; 
    }
    
    table { width: 100%; border-collapse: collapse; background: #1a1a2e; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
    th { background-color: #4ade80; color: #1a1a2e; padding: 12px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #2D1B4D; color: #e0e0e0; }
    tr:nth-child(even) { background-color: #24243e; }
    
    .rank { font-weight: bold; color: #facc15; width: 40px; }
    .rating { font-weight: bold; color: #4ade80; text-align: right; }

    /* New Back Button Style */
    .back-btn {
        display: block;
        width: 100%;
        background-color: #4ade80;
        color: #1a1a2e;
        padding: 15px;
        text-decoration: none;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
        box-sizing: border-box;
        transition: 0.3s;
    }
    .back-btn:hover {
        background-color: #34d399;
        transform: translateY(-2px);
    }

</style>
</head>
<body>

<div class="carousel-container">
    <div class="slides">
        <div class="slide" style="background-image: url('IMG-20260207-WA0016.jpg');"></div>
        <div class="slide" style="background-image: url('Gemini_Generated_Image_te37vrte37vrte37.png');"></div>
    </div>
    <div class="hero-overlay">
        <h1 style="margin: 0; font-size: 24px; letter-spacing: 1px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8);">MIND MASTERS</h1>
        <p style="margin: 5px 0 0 0; font-size: 10px; color: #4ade80; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;">Hall of Fame</p>

</div>

<div class="chess-container">

    <table id="leaderboard">

function updateLeaderboard() {
    const school = document.getElementById("schoolSelect").value;
    const tbody = document.getElementById("leaderboardBody");
    tbody.innerHTML = ""; 

    if (school && data[school]) {
        data[school].forEach((player, index) => {
            const row = `<tr>
                <td class="rank">${index + 1}</td>
                <td>${player[0]}</td>
                <td class="rating">${player[1]}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    } else {
        tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding: 20px; color: #facc15;'>Please select a school to see rankings</td></tr>";
    }
}

updateLeaderboard();
</script>
