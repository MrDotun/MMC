<!DOCTYPE html>
<html>
<head>
<style>
    /* Integrated Academy Theme */
    body { 
        background-color: #1a1a2e; 
        margin: 0; 
        padding: 20px; 
        display: flex; 
        justify-content: center; 
    }

    /* Styling for the leaderboard container - Theme Adjusted */
    .chess-container { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        max-width: 500px; 
        width: 100%;
        margin: 20px auto; 
        border: 2px solid #4ade80; /* Academy Green Border */
        border-radius: 10px; 
        padding: 20px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        background-color: #2D1B4D; /* Deep Purple/Blue Academy Background */
        color: white;
    }

    h2 { text-align: center; color: #4ade80; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }
    
    label { color: #facc15; font-weight: bold; display: block; margin-bottom: 5px; }

    /* Dropdown styling - Theme Adjusted */
    select { 
        width: 100%; 
        padding: 12px; 
        margin-bottom: 20px; 
        border-radius: 5px; 
        border: 1px solid #4ade80; 
        font-size: 16px; 
        background-color: #1a1a2e; 
        color: white;
        cursor: pointer; 
    }
    
    /* Table styling - Theme Adjusted */
    table { width: 100%; border-collapse: collapse; background: #1a1a2e; border-radius: 8px; overflow: hidden; }
    
    th { background-color: #4ade80; color: #1a1a2e; padding: 12px; text-align: left; }
    
    td { padding: 10px; border-bottom: 1px solid #2D1B4D; color: #e0e0e0; }
    
    tr:nth-child(even) { background-color: #24243e; }
    
    tr:hover { background-color: #3d2b5e; }
    
    .rank { font-weight: bold; color: #facc15; width: 40px; } /* Gold for rank */
    
    .rating { font-weight: bold; color: #4ade80; text-align: right; } /* Green for rating */

</style>
</head>
<body>

<div class="chess-container">
    <h2>🏆 School Chess Rankings</h2>
    
    <label for="schoolSelect">Select a School:</label>
    <select id="schoolSelect" onchange="updateLeaderboard()">
        <option value="">-- Choose School --</option>
        <option value="Maryland">Maryland Convent</option>
        <option value="NewGate">New Gate International</option>
        <option value="Reading">Reading Rainbow</option>
        <option value="Praise">Praise Overflow</option>
        <option value="Galaxy">Galaxy Schools</option>
        <option value="Merry">Merry Stars Schools</option>
        <option value="Golden">Golden International</option>
        <option value="Blessed">Blessed Joy International</option>
    </select>

    <table id="leaderboard">
        <thead>
            <tr>
                <th class="rank">#</th>
                <th>Player</th>
                <th style="text-align:right">Rating</th>
            </tr>
        </thead>
        <tbody id="leaderboardBody">
            </tbody>
    </table>
</div>

<script>

function updateLeaderboard() {
    const school = document.getElementById("schoolSelect").value;
    const tbody = document.getElementById("leaderboardBody");
    tbody.innerHTML = ""; // Clear current table

    if (school && data[school]) {
        data[school].forEach((player, index) => {
            const row = `<tr>
                <td class="rank">${index + 1}</td>
                <td>${player[0]}</td>
                <td class="rating">${player[1]}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    } else {
        tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding: 20px; color: #facc15;'>Please select a school to see rankings</td></tr>";
    }
}

// Initialize empty state
updateLeaderboard();
</script>

</body>
</html>
