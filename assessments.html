        .card { background: #12171f; border: 1px solid rgba(255,255,255,0.06); border-radius: 1.25rem; }
        .option-btn {

        .progress-bar { height: 8px; background: #1e293b; border-radius: 99px; overflow: hidden; }

    </style>
</head>

            </div>

            <div class="card p-5 mt-8 text-center">

        </div>

        <div id="quiz-screen" class="hidden">

                </div>
            </div>
        </div>
    </div>

{q:"An outpost is usually a strong square for a:",options:["Pawn","Knight (especially on a hole)","King","Rook only"],answer:1,explain:"Knights thrive on outposts."},
{q:"When reviewing a scoresheet, !! usually means:",options:["A blunder","A brilliant move","A dubious move","A forced move"],answer:1,explain:"!! = brilliant move."}
]}
};

let currentQuizId=null, currentQuestions=[], currentIndex=0, score=0, answered=false;

function loadQuestList(){
    const container=document.getElementById('quest-list');
    const order=["n2-t1","n2-t2","n2-t3","g1-t1","g1-t2","g1-t3","g2-t1","g4-t3","g5-t1","g5-t2","g5-t3"];
    const groups={n2:"Nursery 2",g1:"Grade 1",g2:"Grade 2",g4:"Grade 4",g5:"Grade 5"};
    let html='', lastGroup='';
    order.forEach(id=>{
        const group=id.split('-')[0];
        if(group!==lastGroup){html+=`<div class="level-header">${groups[group]||group}</div>`;lastGroup=group;}
        const q=quizzes[id];
        const saved=getScore(id);
        const stars=saved!==null?scoreToStars(saved):0;
        html+=`<div class="card p-5 flex items-center justify-between gap-4 hover:border-amber-500/30 transition cursor-pointer mb-3" onclick="startQuiz('${id}')">
            <div><div class="text-[10px] font-black text-amber-400 uppercase tracking-widest mb-1">${q.subtitle}</div>
            <div class="font-bold text-white">${q.title}</div>
            <div class="text-xs text-slate-500 mt-1">${q.questions.length} questions</div></div>
            <div class="text-right flex-shrink-0">${saved!==null?`<div class="text-amber-400 font-black">${saved}/${q.questions.length}</div><div class="text-sm">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>`:`<div class="text-slate-600 text-xs font-bold uppercase">Not tried</div>`}</div>
        </div>`;
    });
    container.innerHTML=html;
    updateTotalStars();
}
function getScore(id){const d=JSON.parse(localStorage.getItem('mm_scores')||'{}');return d[id]!==undefined?d[id]:null;}
function saveScore(id,sc){const d=JSON.parse(localStorage.getItem('mm_scores')||'{}');if(d[id]===undefined||sc>d[id]){d[id]=sc;localStorage.setItem('mm_scores',JSON.stringify(d));}}
function scoreToStars(sc){const p=sc/10;if(p>=0.9)return 3;if(p>=0.7)return 2;if(p>=0.5)return 1;return 0;}
function updateTotalStars(){const d=JSON.parse(localStorage.getItem('mm_scores')||'{}');let t=0;Object.values(d).forEach(s=>t+=scoreToStars(s));document.getElementById('total-stars').textContent='⭐ '+t;}
function startQuiz(id){currentQuizId=id;currentQuestions=quizzes[id].questions;currentIndex=0;score=0;answered=false;
document.getElementById('select-screen').classList.add('hidden');document.getElementById('result-screen').classList.add('hidden');document.getElementById('quiz-screen').classList.remove('hidden');
document.getElementById('quiz-title').textContent=quizzes[id].title;showQuestion();}
function showQuestion(){answered=false;const q=currentQuestions[currentIndex];
document.getElementById('question-text').textContent=(currentIndex+1)+'. '+q.q;
document.getElementById('q-counter').textContent=(currentIndex+1)+' / '+currentQuestions.length;
document.getElementById('progress').style.width=((currentIndex+1)/currentQuestions.length*100)+'%';
const box=document.getElementById('options-box');box.innerHTML='';
q.options.forEach((opt,i)=>{const btn=document.createElement('button');btn.className='option-btn';
btn.innerHTML=`<span class="font-bold text-amber-400/80 mr-2">${String.fromCharCode(65+i)}.</span> ${opt}`;
btn.onclick=()=>selectOption(i,btn);box.appendChild(btn);});
document.getElementById('feedback').classList.add('hidden');document.getElementById('next-btn').classList.add('hidden');}
function selectOption(index,btn){if(answered)return;answered=true;const q=currentQuestions[currentIndex];
const buttons=document.querySelectorAll('.option-btn');buttons.forEach(b=>b.classList.add('disabled'));
if(index===q.answer){btn.classList.add('correct');score++;showFeedback(true,q.explain);}
else{btn.classList.add('wrong');buttons[q.answer].classList.add('correct');showFeedback(false,q.explain);}
document.getElementById('next-btn').classList.remove('hidden');
document.getElementById('next-btn').textContent=currentIndex===currentQuestions.length-1?'See Results':'Next Question';}
function showFeedback(correct,explain){const fb=document.getElementById('feedback');fb.classList.remove('hidden');
fb.innerHTML=correct?`<div class="text-emerald-400 font-bold mb-1"><i class="fas fa-check-circle"></i> Correct!</div><div class="text-sm text-slate-400">${explain}</div>`
:`<div class="text-rose-400 font-bold mb-1"><i class="fas fa-times-circle"></i> Not quite</div><div class="text-sm text-slate-400">${explain}</div>`;}
function nextQuestion(){if(currentIndex<currentQuestions.length-1){currentIndex++;showQuestion();}else showResults();}
function showResults(){saveScore(currentQuizId,score);
document.getElementById('quiz-screen').classList.add('hidden');document.getElementById('result-screen').classList.remove('hidden');
const pct=Math.round(score/currentQuestions.length*100);
document.getElementById('result-score').textContent=score+'/'+currentQuestions.length;
document.getElementById('result-percent').textContent=pct+'%';
const stars=scoreToStars(score);let starHtml='';for(let i=0;i<3;i++)starHtml+=i<stars?'<span class="star">★</span>':'<span class="star empty">★</span>';
document.getElementById('result-stars').innerHTML=starHtml;
let title,emoji,badge;
if(pct>=90){title='Legendary!';emoji='🏆';badge='Grandmaster Star';}
else if(pct>=70){title='Great Job!';emoji='⭐';badge='Rising Star';}
else if(pct>=50){title='Good Effort!';emoji='👍';badge='Apprentice';}
else{title='Keep Practising!';emoji='💪';badge='Beginner Quest';}
document.getElementById('result-title').textContent=title;document.getElementById('result-emoji').textContent=emoji;
document.getElementById('result-badge').textContent=badge;document.getElementById('result-subtitle').textContent=quizzes[currentQuizId].title;}
function retryQuiz(){startQuiz(currentQuizId);}
function backToSelect(){document.getElementById('quiz-screen').classList.add('hidden');document.getElementById('result-screen').classList.add('hidden');
document.getElementById('select-screen').classList.remove('hidden');loadQuestList();}
loadQuestList();
</script>
