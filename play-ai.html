input:focus{outline:none;border-color:var(--gold)!important}

.settings-btn{position:fixed;bottom:24px;left:24px;width:48px;height:48px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#e2e8f0;font-size:18px;z-index:998;cursor:pointer;transition:all .25s}

<script>
const firebaseConfig={apiKey:"AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",authDomain:"assignments-de95a.firebaseapp.com",projectId:"assignments-de95a",storageBucket:"assignments-de95a.firebasestorage.app",messagingSenderId:"1088073398299",appId:"1:1088073398299:web:dab1f57ac1d63b10dba0be"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

const levelConfig={
1:{time:20,name:"Beginner",elo:"~400",randomChance:0.70},
2:{time:50,name:"Easy",elo:"~700",randomChance:0.40},
3:{time:150,name:"Medium",elo:"~1000",randomChance:0.15},
4:{time:400,name:"Hard",elo:"~1300",randomChance:0.05},
5:{time:1200,name:"Master",elo:"~1550",randomChance:0}
};

let settings={color:'w',level:1,timeMin:5,name:''};
let game,board,sourceSquare,playerColor,worker,isThinking,liveDocId;
let lastFrom=null,lastTo=null;
let clockYou=0,clockAI=0,clockInterval=null,clockActive=null; // 'you' | 'ai'

// Web Audio sounds
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let actx=null;
function ensureAudio(){if(!actx)actx=new AudioCtx();if(actx.state==='suspended')actx.resume();}
function beep(freq,dur,type,vol){
  try{
    ensureAudio();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.value=vol||0.15;
    o.connect(g);g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+(dur||0.12));
    o.stop(actx.currentTime+(dur||0.12)+0.02);
  }catch(e){}
}
function soundMove(){beep(420,0.08,'sine',0.12)}
function soundCapture(){beep(280,0.1,'triangle',0.18);setTimeout(()=>beep(180,0.12,'triangle',0.12),60)}
function soundCheck(){beep(600,0.1,'square',0.1);setTimeout(()=>beep(800,0.12,'square',0.1),90)}
function soundWin(){beep(523,0.12,'sine',0.15);setTimeout(()=>beep(659,0.12,'sine',0.15),120);setTimeout(()=>beep(784,0.2,'sine',0.18),240)}
function soundLose(){beep(300,0.15,'sawtooth',0.1);setTimeout(()=>beep(200,0.25,'sawtooth',0.1),150)}
function soundSelect(){beep(500,0.04,'sine',0.06)}
function soundStart(){beep(440,0.1,'sine',0.12);setTimeout(()=>beep(550,0.12,'sine',0.12),100)}

function selectOpt(btn){
  const g=btn.dataset.group,v=btn.dataset.val;
  document.querySelectorAll(`[data-group="${g}"]`).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  soundSelect();
  if(g==='color')settings.color=v;
  if(g==='level')settings.level=parseInt(v);
  if(g==='time')settings.timeMin=parseInt(v);
}

function startGame(){
  const name=document.getElementById('player-name').value.trim();
  if(!name){
    document.getElementById('setup-error').classList.remove('hidden');
    document.getElementById('player-name').focus();
    return;
  }
  document.getElementById('setup-error').classList.add('hidden');
  settings.name=name;
  playerColor=settings.color;
  soundStart();
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  document.getElementById('game-header').textContent=name+' vs AI Lv'+settings.level;
  document.getElementById('match-info').innerHTML=`<strong class="text-white">${name}</strong> (${playerColor==='w'?'White':'Black'}) vs <strong class="text-amber-400">AI Level ${settings.level}</strong> (${levelConfig[settings.level].elo})<br>Time: ${settings.timeMin?settings.timeMin+' min each':'No limit'}`;
  initWorker();
  if(!board){
    board=ChessBoard('board',{position:'start',draggable:false,pieceTheme:pieceThemeUrl(currentPieceTheme)});
    $('#board').on('click','[class*="square-"]',function(){const sq=$(this).attr('data-square');if(sq)onSquareClick(sq)});
    applyBoardColor();
  } else {
    board.position('start');
    applyBoardColor();
  }
  newGameInternal();
  // Publish to live feed immediately so spectators can find the game
  setTimeout(function(){ broadcastLive(); }, 300);
}

function backToSetup(){
  stopClock();
  if(liveDocId){db.collection('ai_live_games').doc(liveDocId).delete().catch(()=>{});liveDocId=null}
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
}

function newGameSameSettings(){newGameInternal()}

function newGameInternal(){
  if(liveDocId){db.collection('ai_live_games').doc(liveDocId).delete().catch(()=>{});liveDocId=null}
  game=new Chess();
  sourceSquare=null;lastFrom=null;lastTo=null;isThinking=false;
  board.orientation(playerColor==='w'?'white':'black');
  board.position('start');
  clearHighlights();
  document.getElementById('thinking').classList.add('hidden');
  document.getElementById('board').classList.remove('thinking-glow');
  updateStatus();updateHistory();
  // Clocks
  if(settings.timeMin>0){
    clockYou=settings.timeMin*60;
    clockAI=settings.timeMin*60;
    updateClockDisplay();
    clockActive = (playerColor==='w') ? 'you' : 'ai';
    startClock();
  }else{
    document.getElementById('clock-you').textContent='∞';
    document.getElementById('clock-ai').textContent='∞';
    stopClock();
  }
  if(playerColor==='b')setTimeout(makeEngineMove,600);
}

function initWorker(){
  if(worker)worker.terminate();
  worker=new Worker('chess-worker.js');
  worker.onmessage=function(e){
    const data=e.data;
    if(typeof data!=='string')return;
    if(data.startsWith('pv')||data.startsWith('message')||data.startsWith('Ply:'))return;
    if(data.length>=4&&data.length<=5){
      const from=data.substring(0,2),to=data.substring(2,4),promo=data.length>4?data[4]:'q';
      const move=game.move({from,to,promotion:promo});
      if(move){
        lastFrom=from;lastTo=to;
        board.position(game.fen());
        showLastMove();
        playMoveSound(move);
        updateStatus();updateHistory();broadcastLive();
        switchClock('you');
      }
      stopThinking();
    }
  };
  worker.onerror=function(){stopThinking();document.getElementById('status').textContent='Engine error — try New Game'};
}

function stopThinking(){
  isThinking=false;
  document.getElementById('thinking').classList.add('hidden');
  document.getElementById('board').classList.remove('thinking-glow');
}

function onSquareClick(sq){
  if(isThinking||game.game_over())return;
  if(game.turn()!==playerColor)return;
  if(!sourceSquare){
    const piece=game.get(sq);
    if(piece&&piece.color===playerColor){
      sourceSquare=sq;
      clearHighlights();
      $(`.square-${sq}`).addClass('highlight-select');
      soundSelect();
    }
    return;
  }
  if(sourceSquare===sq){sourceSquare=null;clearHighlights();showLastMove();return}
  const move=game.move({from:sourceSquare,to:sq,promotion:'q'});
  sourceSquare=null;
  if(move){
    lastFrom=move.from;lastTo=move.to;
    board.position(game.fen());
    showLastMove();
    playMoveSound(move);
    updateStatus();updateHistory();broadcastLive();
    switchClock('ai');
    if(!game.game_over())makeEngineMove();
  }else{
    clearHighlights();
    const piece=game.get(sq);
    if(piece&&piece.color===playerColor){
      sourceSquare=sq;
      $(`.square-${sq}`).addClass('highlight-select');
    }else showLastMove();
  }
}

function makeEngineMove(){
  if(game.game_over())return;
  isThinking=true;
  document.getElementById('thinking').classList.remove('hidden');
  document.getElementById('status').textContent='AI is thinking...';
  document.getElementById('board').classList.add('thinking-glow');
  switchClock('ai');

  const cfg=levelConfig[settings.level];
  // Full moves played so far (each side's move counts)
  const fullMoves = Math.floor(game.history().length / 2) + 1;
  // Think longer for first ~18 moves, then play faster — stay weak
  let thinkMs;
  if (fullMoves <= 18) {
    // Opening / early middlegame: visible think
    const base = {1:900, 2:1100, 3:1400, 4:1800, 5:2200}[settings.level] || 1200;
    thinkMs = base + Math.random() * 900; // ~1–3s
  } else {
    // Later: quicker replies
    const base = {1:350, 2:400, 3:500, 4:600, 5:700}[settings.level] || 400;
    thinkMs = base + Math.random() * 400; // ~0.3–1.1s
  }

  setTimeout(function(){
    if(game.game_over()){ stopThinking(); return; }
    // Keep AI weak — random moves often, especially low levels
    if(cfg.randomChance && Math.random() < cfg.randomChance){
      const moves=game.moves({verbose:true});
      if(moves.length){
        const m=moves[Math.floor(Math.random()*moves.length)];
        const move=game.move(m);
        lastFrom=move.from;lastTo=move.to;
        board.position(game.fen());
        showLastMove();
        playMoveSound(move);
        updateStatus();updateHistory();broadcastLive();
        switchClock('you');
        stopThinking();
        return;
      }
    }
    // Short search only — stays weak
    worker.postMessage('position '+game.fen());
    worker.postMessage('search '+cfg.time);
  }, thinkMs);
}

function playMoveSound(move){
  if(move.flags&&(move.flags.includes('c')||move.flags.includes('e')))soundCapture();
  else soundMove();
  if(game.in_check())setTimeout(soundCheck,80);
}

function clearHighlights(){$('.highlight-from,.highlight-to,.highlight-select').removeClass('highlight-from highlight-to highlight-select')}
function showLastMove(){
  clearHighlights();
  if(lastFrom)$(`.square-${lastFrom}`).addClass('highlight-from');
  if(lastTo)$(`.square-${lastTo}`).addClass('highlight-to');
}

function updateStatus(){
  const el=document.getElementById('status');
  let status='';
  if(game.in_checkmate()){
    const youWin=game.turn()!==playerColor;
    status=youWin?'🎉 You win by checkmate!':'Checkmate — AI wins';
    if(youWin){soundWin();recordWin()}else soundLose();
    stopClock();endLiveGame();
  }else if(game.in_draw()){
    status='Game drawn';stopClock();endLiveGame();
  }else if(game.in_check()){
    status=(game.turn()==='w'?'White':'Black')+' is in check';
  }else{
    status=game.turn()===playerColor?'Your turn — make a move':'AI to move';
  }
  el.textContent=status;
}

function updateHistory(){
  const hist=game.history({verbose:true});
  if(!hist.length){document.getElementById('history').innerHTML='Game started';return}
  let html='';
  for(let i=0;i<hist.length;i+=2){
    const n=Math.floor(i/2)+1;
    html+=`<div>${n}. ${hist[i]?hist[i].san:''} ${hist[i+1]?hist[i+1].san:''}</div>`;
  }
  document.getElementById('history').innerHTML=html;
  document.getElementById('history').scrollTop=9999;
}

function formatTime(s){
  if(s<0)s=0;
  const m=Math.floor(s/60),sec=s%60;
  return m+':'+String(sec).padStart(2,'0');
}
function updateClockDisplay(){
  const cy=document.getElementById('clock-you'),ca=document.getElementById('clock-ai');
  cy.textContent=formatTime(clockYou);ca.textContent=formatTime(clockAI);
  cy.classList.toggle('low',clockYou<=30&&settings.timeMin>0);
  ca.classList.toggle('low',clockAI<=30&&settings.timeMin>0);
}
function startClock(){
  stopClock();
  if(settings.timeMin<=0)return;
  clockInterval=setInterval(()=>{
    if(clockActive==='you'){
      clockYou--;
      if(clockYou<=0){clockYou=0;updateClockDisplay();flagLoss('you');return}
    } else if(clockActive==='ai'){
      clockAI--;
      if(clockAI<=0){clockAI=0;updateClockDisplay();flagLoss('ai');return}
    }
    updateClockDisplay();
  },1000);
}
function stopClock(){if(clockInterval){clearInterval(clockInterval);clockInterval=null}}
function switchClock(who){
  if(settings.timeMin<=0||game.game_over())return;
  clockActive = who; // 'you' or 'ai' — both clocks can run
  startClock();
}
function flagLoss(who){
  stopClock();
  if(who==='you'){document.getElementById('status').textContent='You lost on time';soundLose();endLiveGame()}
  else{document.getElementById('status').textContent='🎉 AI lost on time — You win!';soundWin();recordWin();endLiveGame()}
}

function resignGame(){
  if(game.game_over())return;
  if(!confirm('Resign this game?'))return;
  stopClock();
  document.getElementById('status').textContent='You resigned — AI wins';
  soundLose();endLiveGame();
}

function undoMove(){
  if(isThinking||game.game_over())return;
  game.undo();if(game.turn()!==playerColor)game.undo();
  lastFrom=null;lastTo=null;
  board.position(game.fen());clearHighlights();
  updateStatus();updateHistory();broadcastLive();
}

function broadcastLive(){
  if(!settings.name||!game)return;
  const data={
    player:settings.name,
    level:settings.level,
    fen:game.fen(),
    pgn:game.pgn(),
    status:'Playing',
    updated:firebase.firestore.FieldValue.serverTimestamp()
  };
  if(liveDocId){
    db.collection('ai_live_games').doc(liveDocId).set(data,{merge:true}).catch(e=>console.error('Live update failed',e));
  } else {
    db.collection('ai_live_games').add(data).then(doc=>{
      liveDocId=doc.id;
      console.log('Live game published', doc.id);
    }).catch(e=>console.error('Live publish failed',e));
  }
}
function endLiveGame(){
  if(liveDocId){
    db.collection('ai_live_games').doc(liveDocId).update({status:'Finished',updated:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
    setTimeout(()=>{if(liveDocId)db.collection('ai_live_games').doc(liveDocId).delete().catch(()=>{});liveDocId=null},20000);
  }
}

function recordWin(){
  db.collection('ai_wins').add({
    name:settings.name,
    level:settings.level,
    color:playerColor,
    timestamp:firebase.firestore.FieldValue.serverTimestamp()
  }).catch(()=>{});
}

function loadAILeaderboard(){
  db.collection('ai_wins').orderBy('timestamp','desc').limit(50).onSnapshot(snap=>{
    const box=document.getElementById('ai-leaderboard');
    if(snap.empty){box.innerHTML='<p class="text-slate-600 text-xs">No wins yet — beat the AI!</p>';return}
    // Count wins per player
    const counts={};
    snap.forEach(doc=>{
      const d=doc.data();
      const key=d.name||'Player';
      if(!counts[key])counts[key]={name:key,wins:0,bestLevel:0};
      counts[key].wins++;
      if((d.level||0)>counts[key].bestLevel)counts[key].bestLevel=d.level;
    });
    const ranked=Object.values(counts).sort((a,b)=>b.wins-a.wins||b.bestLevel-a.bestLevel).slice(0,10);
    let html='',rank=0;
    ranked.forEach(r=>{
      rank++;
      const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'#'+rank;
      html+=`<div class="flex items-center gap-3 bg-white/5 rounded-xl px-3 py-2.5">
        <div class="font-black w-7 text-center">${medal}</div>
        <div class="flex-1 min-w-0"><div class="font-bold text-white text-xs truncate">${r.name}</div>
        <div class="text-[10px] text-slate-500">Best AI Lv${r.bestLevel}</div></div>
        <div class="font-black text-amber-400 text-sm">${r.wins} win${r.wins>1?'s':''}</div>
      </div>`;
    });
    box.innerHTML=html;
  },()=>{document.getElementById('ai-leaderboard').innerHTML='<p class="text-slate-600 text-xs">Leaderboard offline</p>'});
}

let specBoard=null,specUnsub=null;
function loadLiveFeed(){
  const c=document.getElementById('live-ai-feed');
  // Avoid composite index: order by updated only, filter Playing on client
  db.collection('ai_live_games').orderBy('updated','desc').limit(20)
  .onSnapshot(snap=>{
    const games=[];
    snap.forEach(doc=>{
      const d=doc.data();
      if(d.status==='Playing') games.push({id:doc.id,...d});
    });
    if(!games.length){
      c.innerHTML='<p class="text-slate-600 text-xs">No live games — start one and open this page on another device!</p>';
      return;
    }
    let html='';
    games.slice(0,8).forEach(d=>{
      const mine=d.id===liveDocId;
      const safeName=(d.player||'Player').replace(/'/g,'').replace(/"/g,'');
      html+=`<div class="flex items-center justify-between bg-white/5 rounded-lg px-3 py-2 cursor-pointer hover:bg-white/10" onclick="spectateGame('${d.id}','${safeName}','${d.level||'?'}')">
        <span class="text-white text-xs font-bold">${safeName} <span class="text-amber-400">vs AI Lv${d.level||'?'}</span>${mine?' <span class="text-emerald-400">(you)</span>':''}</span>
        <span class="live-badge">WATCH</span>
      </div>`;
    });
    c.innerHTML=html;
  }, err=>{
    console.error('Live feed error:', err);
    // Fallback without orderBy if index missing
    db.collection('ai_live_games').limit(20).onSnapshot(snap2=>{
      const games=[];
      snap2.forEach(doc=>{
        const d=doc.data();
        if(d.status==='Playing') games.push({id:doc.id,...d});
      });
      if(!games.length){
        c.innerHTML='<p class="text-slate-600 text-xs">No live games right now</p>';
        return;
      }
      let html='';
      games.forEach(d=>{
        const safeName=(d.player||'Player').replace(/'/g,'');
        html+=`<div class="flex items-center justify-between bg-white/5 rounded-lg px-3 py-2 cursor-pointer hover:bg-white/10" onclick="spectateGame('${d.id}','${safeName}','${d.level||'?'}')">
          <span class="text-white text-xs font-bold">${safeName} <span class="text-amber-400">vs AI Lv${d.level||'?'}</span></span>
          <span class="live-badge">WATCH</span>
        </div>`;
      });
      c.innerHTML=html;
    }, err2=>{
      c.innerHTML='<p class="text-rose-400 text-xs">Live feed blocked — check Firestore rules allow read on ai_live_games</p>';
      console.error(err2);
    });
  });
}
function spectateGame(id,name,level){
  if(id===liveDocId){alert('This is your game — already on the main board!');return}
  document.getElementById('spectate-box').classList.remove('hidden');
  document.getElementById('spec-title').textContent=name+' vs AI Lv'+level;
  if(!specBoard){specBoard=ChessBoard('spec-board',{position:'start',draggable:false,pieceTheme:pieceThemeUrl(currentPieceTheme)});applyBoardColor();}
  if(specUnsub)specUnsub();
  specUnsub=db.collection('ai_live_games').doc(id).onSnapshot(doc=>{
    if(!doc.exists){document.getElementById('spec-title').textContent='Game ended';return}
    const d=doc.data();
    if(d.fen)specBoard.position(d.fen);
  });
}
function stopSpectate(){if(specUnsub){specUnsub();specUnsub=null}document.getElementById('spectate-box').classList.add('hidden')}

// Enter key starts game from name field
document.getElementById('player-name').addEventListener('keydown',e=>{if(e.key==='Enter')startGame()});


// —— Settings & Chess.com pieces ——
const PIECE_THEMES = {
  neo: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/{piece}.png',
  game_room: 'https://images.chesscomfiles.com/chess-themes/pieces/game_room/150/{piece}.png',
  marble: 'https://images.chesscomfiles.com/chess-themes/pieces/marble/150/{piece}.png',
  classic: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
};
// chessboard.js uses wP/bK; chess.com uses wp/bk
function pieceThemeUrl(themeKey) {
  const base = PIECE_THEMES[themeKey] || PIECE_THEMES.neo;
  if (themeKey === 'classic') return base;
  return function(piece) {
    // piece e.g. "wP" -> "wp"
    const code = piece[0].toLowerCase() + piece[1].toLowerCase();
    return base.replace('{piece}', code);
  };
}

let soundEnabled = true;
let currentPieceTheme = localStorage.getItem('mm_pieces') || 'neo';
let currentBoardTheme = localStorage.getItem('mm_board') || 'green';

function toggleSettings() {
  document.getElementById('settings-panel').classList.toggle('open');
}
function applySettings() {
  const pieces = document.getElementById('set-pieces').value;
  const boardT = document.getElementById('set-board').value;
  soundEnabled = document.getElementById('set-sound').checked;
  currentPieceTheme = pieces;
  currentBoardTheme = boardT;
  localStorage.setItem('mm_pieces', pieces);
  localStorage.setItem('mm_board', boardT);
  localStorage.setItem('mm_sound', soundEnabled ? '1' : '0');
  // Rebuild board with new pieces if game active
  if (board) {
    const fen = game ? game.fen() : 'start';
    const orient = playerColor === 'b' ? 'black' : 'white';
    board.destroy();
    board = ChessBoard('board', {
      position: fen,
      orientation: orient,
      draggable: false,
      pieceTheme: pieceThemeUrl(pieces)
    });
    $('#board').off('click').on('click', '[class*="square-"]', function() {
      const sq = $(this).attr('data-square');
      if (sq) onSquareClick(sq);
    });
    applyBoardColor();
    showLastMove();
  }
  if (specBoard) {
    // keep spectator simple
  }
  applyBoardColor();
}
function applyBoardColor() {
  const el = document.getElementById('board');
  if (!el) return;
  el.classList.remove('board-brown', 'board-green', 'board-blue', 'board-purple');
  el.classList.add('board-' + currentBoardTheme);
  const spec = document.getElementById('spec-board');
  if (spec) {
    spec.classList.remove('board-brown', 'board-green', 'board-blue', 'board-purple');
    spec.classList.add('board-' + currentBoardTheme);
  }
}
// Init settings UI from storage
(function initSettingsUI() {
  const p = localStorage.getItem('mm_pieces') || 'neo';
  const b = localStorage.getItem('mm_board') || 'green';
  const s = localStorage.getItem('mm_sound') !== '0';
  const pe = document.getElementById('set-pieces');
  const be = document.getElementById('set-board');
  const se = document.getElementById('set-sound');
  if (pe) pe.value = p;
  if (be) be.value = b;
  if (se) se.checked = s;
  currentPieceTheme = p;
  currentBoardTheme = b;
  soundEnabled = s;
})();

// Override sound functions to respect toggle
const _beep = beep;
beep = function(freq, dur, type, vol) {
  if (!soundEnabled) return;
  _beep(freq, dur, type, vol);
};

loadAILeaderboard();
loadLiveFeed();
</script>
