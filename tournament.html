<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Decipher League | Mind Masters</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --bg: #030712;
            --panel: #0f172a;
            --accent: #4ade80;
            --sq-light: #eeeed2; 
            --sq-dark: #769656;  
        }

        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        #tournament-app {
            width: 95%; max-width: 450px; background: var(--panel);
            padding: 20px; border-radius: 24px; border: 1px solid rgba(74, 222, 128, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .league-title { text-align: center; color: var(--accent); font-weight: 900; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; }

        /* THE FIX: Absolute Square Board */
        #board-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            background: #111;
            padding: 5px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 2px solid #27272a;
        }

        .sq { display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .l { background-color: var(--sq-light); }
        .d { background-color: var(--sq-dark); }
        .sel { background-color: rgba(251, 191, 36, 0.6) !important; }

        .sq img { width: 90%; height: 90%; object-fit: contain; pointer-events: none; }

        .player-info {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: rgba(255, 255, 255, 0.03); border-radius: 12px; margin: 10px 0;
        }

        .timer { font-family: 'Courier New', monospace; font-size: 26px; font-weight: bold; color: #38bdf8; }
        #engine-status { font-size: 10px; color: var(--accent); font-weight: bold; height: 12px; }
    </style>
</head>
<body>

<div id="tournament-app">
    <div class="league-title">Mind Masters League</div>

    <div class="player-info">
        <div>
            <div id="master-name" style="font-weight: 800; font-size: 16px;">IM ODION AIKHOJE</div>
            <div id="engine-status"></div>
        </div>
        <div class="timer" id="time-top">05:00</div>
    </div>

    <div id="board-wrapper"></div>

    <div class="player-info">
        <div id="student-name" style="font-weight: 800; font-size: 16px;">DAVID AKINDELE</div>
        <div class="timer" id="time-bottom">05:00</div>
    </div>
</div>

<script>
    // FULL MASTER DATA
    const mastersData = [
        { name: "IM Odion Aikhoje", rating: 2351 },
        { name: "IM Bunmi Olape", rating: 2306 },
        { name: "FM Bomo Kigigha", rating: 2334 },
        { name: "IM Adu Oladapo", rating: 2321 },
        { name: "FM Adebayo Adegboyega", rating: 2312 },
        { name: "IM Oluwafemi Balogun", rating: 2291 },
        { name: "IM Anwuli Daniel", rating: 2365 }
    ];

    let game = new Chess();
    let selectedSq = null;
    let userRating = 1500; 
    let currentMaster = mastersData[0]; // Set this based on round
    const worker = new Worker('./chess-worker.js');

    const pieceImgs = {
        p: 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
        n: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        b: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
        r: 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        q: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
        k: 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
        P: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
        N: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        B: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
        R: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        Q: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
        K: 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };

    function renderBoard() {
        const wrap = document.getElementById('board-wrapper');
        wrap.innerHTML = '';
        const boardState = game.board();

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const sqId = String.fromCharCode(97 + c) + (8 - r);
                const div = document.createElement('div');
                div.className = `sq ${(r + c) % 2 === 0 ? 'l' : 'd'}`;
                if (selectedSq === sqId) div.classList.add('sel');

                const p = boardState[r][c];
                if (p) {
                    const img = document.createElement('img');
                    img.src = pieceImgs[p.color === 'w' ? p.type.toUpperCase() : p.type];
                    div.appendChild(img);
                }
                div.onclick = () => onSqClick(sqId);
                wrap.appendChild(div);
            }
        }
    }

    function onSqClick(id) {
        if (game.turn() !== 'w') return;
        if (selectedSq === id) {
            selectedSq = null;
        } else if (selectedSq) {
            const move = game.move({ from: selectedSq, to: id, promotion: 'q' });
            if (move) {
                selectedSq = null;
                renderBoard();
                if (!game.game_over()) startAiThink();
            } else {
                selectedSq = id;
            }
        } else {
            const piece = game.get(id);
            if (piece && piece.color === 'w') selectedSq = id;
        }
        renderBoard();
    }

    function startAiThink() {
        document.getElementById('engine-status').innerText = "ENGINE ANALYZING...";
        
        // ADAPTIVE BLUNDER RATE: 1-10% based on Rating
        let blunderChance = 0.10 - ((Math.min(Math.max(userRating, 1500), 2700) - 1500) / 1200) * 0.09;

        if (Math.random() < blunderChance) {
            // Master blunders (Random move)
            setTimeout(() => {
                const moves = game.moves();
                game.move(moves[Math.floor(Math.random() * moves.length)]);
                document.getElementById('engine-status').innerText = "";
                renderBoard();
            }, 600);
        } else {
            // Decipher Engine Logic: Fast and Deep
            worker.postMessage("position " + game.fen());
            worker.postMessage("go depth 14");
        }
    }

    // DECIPHER ENGINE RESPONSE HANDLER
    worker.onmessage = function(e) {
        if (e.data.includes('bestmove')) {
            const moveParts = e.data.split(' ');
            const bestMove = moveParts[1];
            game.move({ from: bestMove.substring(0, 2), to: bestMove.substring(2, 4), promotion: 'q' });
            document.getElementById('engine-status').innerText = "";
            renderBoard();
        }
    };

    // Set Initial Master Name
    document.getElementById('master-name').innerText = currentMaster.name;
    renderBoard();
</script>
</body>
</html>
