<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decipher League | Dark Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            /* Decipher League Dark Theme Palette */
            --dl-bg: #030712;
            --dl-panel: #111827;
            --dl-blue-primary: #3b82f6;
            --dl-blue-glow: #60a5fa;
            --dl-accent: #0ea5e9;
            --dl-text-bright: #f9fafb;
            --dl-text-muted: #9ca3af;
            /* Board: Midnight & Steel */
            --dl-board-dark: #1e3a8a; 
            --dl-board-light: #334155;
            --glass: rgba(17, 24, 39, 0.8);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dl-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.1) 0px, transparent 50%);
            color: var(--dl-text-bright);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 95%;
            max-width: 500px;
            padding: 30px;
            background: var(--dl-panel);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-title {
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            color: var(--dl-blue-glow);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .screen { display: none; flex-direction: column; width: 100%; }
        .active-screen { display: flex; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Decipher Dark Board */
        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 100%;
            aspect-ratio: 1/1;
            border: 8px solid #000;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
        }

        .square { display: flex; justify-content: center; align-items: center; }
        .light { background-color: var(--dl-board-light); }
        .dark { background-color: var(--dl-board-dark); }
        
        .square img {
            width: 90%;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.5));
        }

        .selected { background-color: rgba(14, 165, 233, 0.5) !important; box-shadow: inset 0 0 10px #0ea5e9; }
        .last-move { background-color: rgba(255, 255, 255, 0.15) !important; }

        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .timer {
            font-family: 'JetBrains Mono', monospace;
            font-size: 26px;
            font-weight: 700;
            color: var(--dl-accent);
            text-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
        }

        button {
            background: var(--dl-blue-primary);
            color: white;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        button:hover { background: var(--dl-accent); box-shadow: 0 0 20px rgba(14, 165, 233, 0.4); }

        #thinking-indicator {
            font-size: 11px;
            color: var(--dl-accent);
            letter-spacing: 1px;
            display: none;
            margin-top: 4px;
        }

        input {
            padding:15px; 
            background: #1f2937;
            border-radius:10px; 
            border:1px solid #374151; 
            margin-bottom:15px;
            color: white;
        }

        table { width: 100%; color: var(--dl-text-muted); border-collapse: collapse; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div id="app-container">
    <div class="header-title">Mind Masters League</div>

    <div id="intro-screen" class="screen active-screen">
        <div style="background: rgba(0,0,0,0.2); border-radius: 15px; margin-bottom: 20px; max-height: 220px; overflow-y: auto;">
            <table><tbody id="intro-tbody"></tbody></table>
        </div>
        <input type="text" id="kid-name" placeholder="Enter Candidate Name">
        <button onclick="enrollKid()">Begin Round 1</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="player-card">
            <div>
                <span id="opp-name" style="font-weight:800; color:var(--dl-text-bright);">MASTER</span>
                <div id="thinking-indicator">ENGINE COMPUTING...</div>
            </div>
            <div id="timer-opp" class="timer">05:00</div>
        </div>
        
        <div id="board"></div>

        <div class="player-card">
            <div id="user-name" style="font-weight:800; color:var(--dl-text-bright);">PLAYER</div>
            <div id="timer-user" class="timer">05:00</div>
        </div>
        
        <button id="end-game-btn" style="display:none;" onclick="showRankings()">Continue Standings</button>
    </div>

    <div id="rankings-screen" class="screen">
        <h2 style="text-align:center; color:var(--dl-accent);">LEAGUE TABLE</h2>
        <table id="ranking-table" style="background: rgba(0,0,0,0.2); border-radius:12px;">
            <tbody id="ranking-tbody"></tbody>
        </table>
        <button onclick="startNextRound()">Next Pairing</button>
    </div>
</div>

<script>
    const mastersData = [
        { name: "IM Odion Aikhoje", rating: 2351, pts: 0 }, { name: "FM Adebayo Adegboyega", rating: 2312, pts: 0 },
        { name: "FM Bomo Kigigha", rating: 2334, pts: 0 }, { name: "IM Adu Oladapo", rating: 2321, pts: 0 },
        { name: "IM Bunmi Olape", rating: 2306, pts: 0 }, { name: "FM Akinseye Abiola", rating: 2252, pts: 0 },
        { name: "IM Oluwafemi Balogun", rating: 2291, pts: 0 }, { name: "IM Anwuli Daniel", rating: 2365, pts: 0 },
        { name: "IM Olanrewaju Ajibola", rating: 2289, pts: 0 }
    ];

    let kidPlayer = { name: "", rating: 1500, pts: 0, isKid: true }, currentRound = 1;
    let game, userColor, currentOpponent, intervalId, timerW = 300, timerB = 300, selectedSquare = null, lastMove = null;

    const pieces = {
        p: 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg', n: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        b: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg', r: 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        q: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg', k: 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
        P: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg', N: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        B: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg', R: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        Q: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg', K: 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };

    const chessWorker = new Worker('./chess-worker.js');

    chessWorker.onmessage = function(e) {
        document.getElementById('thinking-indicator').style.display = 'none';
        let moveStr = e.data.includes('bestmove') ? e.data.split(' ')[1] : e.data;
        let m = game.move({ from: moveStr.substring(0, 2), to: moveStr.substring(2, 4), promotion: 'q' });
        if(m) { lastMove = m; drawBoard(); if (game.game_over()) checkEnd(); }
    };

    function makeAIMove() {
        if (game.game_over()) return;
        document.getElementById('thinking-indicator').style.display = 'block';
        setTimeout(() => {
            chessWorker.postMessage("position " + game.fen());
            chessWorker.postMessage("go depth 12");
        }, 1000);
    }

    window.onload = () => {
        const tb = document.getElementById("intro-tbody");
        mastersData.forEach((p) => tb.innerHTML += `<tr><td>${p.name}</td><td style="text-align:right; color:var(--dl-accent)">${p.rating}</td></tr>`);
    };

    function enrollKid() { 
        kidPlayer.name = document.getElementById("kid-name").value || "Candidate";
        startNextRound(); 
    }

    function startNextRound() {
        if (currentRound > 7) return alert("League Finished.");
        userColor = currentRound % 2 === 0 ? 'b' : 'w';
        currentOpponent = mastersData[Math.floor(Math.random()*mastersData.length)];
        game = new Chess(); timerW = timerB = 300;
        document.getElementById("opp-name").innerText = `${currentOpponent.name}`;
        document.getElementById("user-name").innerText = `${kidPlayer.name}`;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('game-screen').classList.add('active-screen');
        lastMove = null; drawBoard(); startTimer();
        if (game.turn() !== userColor) makeAIMove();
    }

    function drawBoard() {
        const b = document.getElementById("board"); b.innerHTML = "";
        const boardState = game.board();
        for (let i = 0; i < 64; i++) {
            let r = Math.floor(i / 8), c = i % 8;
            if (userColor === 'b') { r = 7 - r; c = 7 - c; }
            const sq = String.fromCharCode(97+c) + (8-r);
            const el = document.createElement("div");
            el.className = `square ${(r+c)%2===0?'light':'dark'}`;
            if (selectedSquare === sq) el.classList.add("selected");
            if (lastMove && (lastMove.from === sq || lastMove.to === sq)) el.classList.add("last-move");
            const p = boardState[r][c];
            if (p) { const img = document.createElement("img"); img.src = pieces[p.color==='w'?p.type.toUpperCase():p.type]; el.appendChild(img); }
            el.onclick = () => handleSquareClick(sq);
            b.appendChild(el);
        }
    }

    function handleSquareClick(sq) {
        if (game.turn() !== userColor) return;
        if (selectedSquare === sq) selectedSquare = null;
        else if (selectedSquare) {
            const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
            if (move) { selectedSquare = null; lastMove = move; drawBoard(); if (!game.game_over()) makeAIMove(); else checkEnd(); }
            else selectedSquare = sq;
        } else selectedSquare = sq;
        drawBoard();
    }

    function startTimer() {
        clearInterval(intervalId);
        intervalId = setInterval(() => {
            if (game.turn() === 'w') timerW--; else timerB--;
            document.getElementById("timer-user").innerText = formatTime(userColor==='w'?timerW:timerB);
            document.getElementById("timer-opp").innerText = formatTime(userColor==='w'?timerB:timerW);
            if (timerW<=0 || timerB<=0) checkEnd();
        }, 1000);
    }

    function formatTime(s) { return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; }

    function checkEnd() {
        clearInterval(intervalId);
        let result = (game.turn() !== userColor && game.in_checkmate()) ? 1 : (game.in_draw() ? 0.5 : 0);
        kidPlayer.pts += result;
        document.getElementById("end-game-btn").style.display = "block";
    }

    function showRankings() {
        currentRound++;
        const rb = document.getElementById("ranking-tbody"); rb.innerHTML = "";
        [...mastersData, kidPlayer].sort((a,b) => b.pts - a.pts).forEach((p, i) => {
            const isUser = p.isKid ? "style='color:var(--dl-accent); font-weight:bold'" : "";
            rb.innerHTML += `<tr ${isUser}><td>${i+1}. ${p.name}</td><td style="text-align:right">${p.pts}</td></tr>`;
        });
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('rankings-screen').classList.add('active-screen');
    }
</script>
</body>
</html>
