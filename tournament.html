<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Masters | Mind Masters Academy</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            /* Pro White & Blue Palette */
            --primary-blue: #2563eb;
            --deep-blue: #1e3a8a;
            --soft-blue: #eff6ff;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --light-sq: #f0f4f8; 
            --dark-sq: #3b82f6;
            --text-dark: #1e293b;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            /* Dynamic Animated Gradient Background */
            background: linear-gradient(-45deg, #e0e7ff, #f8fafc, #dbeafe, #ffffff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #app-container {
            width: 95%;
            max-width: 480px;
            padding: 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .header-title {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        .screen { display: none; flex-direction: column; width: 100%; animation: fadeIn 0.5s ease-out; }
        .active-screen { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        th { background: var(--primary-blue); color: white; padding: 12px; font-weight: 600; text-transform: uppercase; font-size: 11px; }
        td { background: white; padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }

        .save-box {
            background: white;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 2px solid #f1f5f9;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus { outline: none; border-color: var(--primary-blue); }

        button {
            background: var(--accent-gradient);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        /* Chess Board Styles */
        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 100%;
            aspect-ratio: 1/1;
            border: 8px solid white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .square { display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .light { background-color: var(--light-sq); }
        .dark { background-color: var(--dark-sq); }

        .square img {
            width: 85%;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            transition: transform 0.2s;
        }
        .square img:hover { transform: scale(1.1); }

        .timer {
            font-family: 'Monaco', monospace;
            font-size: 22px;
            font-weight: 700;
            color: var(--deep-blue);
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 10px;
        }

        .player-info { padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }

        #history-log {
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px;
            font-size: 12px;
            color: #64748b;
            border: 1px solid #e2e8f0;
            height: 40px;
            overflow-y: auto;
        }

        .selected { background-color: rgba(255, 255, 0, 0.5) !important; }
        .last-move { background-color: rgba(37, 99, 235, 0.2) !important; }

        #thinking-indicator {
            font-size: 12px;
            color: var(--primary-blue);
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div id="app-container">
    <div class="header-title">Mind Masters Academy</div>

    <div id="intro-screen" class="screen active-screen">
        <div style="max-height: 200px; overflow-y: auto; margin-bottom: 20px;">
            <table id="intro-table">
                <thead><tr><th>Rank</th><th>Master</th><th>Rating</th></tr></thead>
                <tbody id="intro-tbody"></tbody>
            </table>
        </div>
        <div class="save-box">
            <input type="text" id="kid-name" placeholder="Enter Student Name"/>
            <button onclick="enrollKid()">Start Championship</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="player-info">
            <div style="font-weight: 700;"><span id="opp-name">Opponent</span> <span id="thinking-indicator">●●●</span></div>
            <div id="timer-opp" class="timer">05:00</div>
        </div>
        
        <div id="board"></div>

        <div class="player-info">
            <div style="font-weight: 700;" id="user-name">You</div>
            <div id="timer-user" class="timer">05:00</div>
        </div>

        <div id="history-log"></div>
        <button id="end-game-btn" style="display:none; margin-top:10px;" onclick="showRankings()">Next Round</button>
    </div>

    <div id="rankings-screen" class="screen">
        <h3 style="text-align: center; color: var(--deep-blue);">Standings</h3>
        <table id="ranking-table">
            <thead><tr><th>Pos</th><th>Player</th><th>Pts</th></tr></thead>
            <tbody id="ranking-tbody"></tbody>
        </table>
        <button onclick="startNextRound()">Next Match</button>
    </div>
</div>

<script>
    /* Logic remains consistent with previous engine/timer/round requests */
    const mastersData = [
        { name: "IM Odion Aikhoje", rating: 2351, pts: 0 }, { name: "FM Adebayo Adegboyega", rating: 2312, pts: 0 },
        { name: "FM Bomo Kigigha", rating: 2334, pts: 0 }, { name: "IM Adu Oladapo", rating: 2321, pts: 0 },
        { name: "IM Bunmi Olape", rating: 2306, pts: 0 }, { name: "FM Akinseye Abiola", rating: 2252, pts: 0 },
        { name: "IM Oluwafemi Balogun", rating: 2291, pts: 0 }, { name: "IM Anwuli Daniel", rating: 2365, pts: 0 },
        { name: "IM Olanrewaju Ajibola", rating: 2289, pts: 0 }
    ];

    let kidPlayer = { name: "", rating: 1500, pts: 0, isKid: true }, currentRound = 1;
    let game, userColor, currentOpponent, intervalId, timerW = 300, timerB = 300, selectedSquare = null, lastMove = null;

    const pieces = {
        p: 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg', n: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        b: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg', r: 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        q: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg', k: 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
        P: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg', N: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        B: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg', R: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        Q: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg', K: 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };

    const chessWorker = new Worker('./chess-worker.js');

    chessWorker.onmessage = function(e) {
        let m = game.move({ from: e.data.substring(0, 2), to: e.data.substring(2, 4), promotion: 'q' });
        if(m) lastMove = m;
        document.getElementById('thinking-indicator').style.visibility = 'hidden';
        drawBoard();
        if (game.game_over()) checkEnd();
    };

    function makeAIMove() {
        if (game.game_over()) return;
        document.getElementById('thinking-indicator').style.visibility = 'visible';
        setTimeout(() => {
            chessWorker.postMessage("position " + game.fen());
            chessWorker.postMessage("go depth 0.9");
        }, 1200);
    }

    window.onload = () => {
        const tb = document.getElementById("intro-tbody");
        mastersData.forEach((p, i) => tb.innerHTML += `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.rating}</td></tr>`);
    };

    function enrollKid() { 
        kidPlayer.name = document.getElementById("kid-name").value || "Player";
        startNextRound(); 
    }

    function startNextRound() {
        if (currentRound > 7) return alert("Championship Concluded!");
        userColor = currentRound % 2 === 0 ? 'b' : 'w';
        currentOpponent = mastersData[currentRound % mastersData.length];
        game = new Chess(); timerW = timerB = 300;
        document.getElementById("opp-name").innerText = currentOpponent.name;
        document.getElementById("user-name").innerText = kidPlayer.name;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('game-screen').classList.add('active-screen');
        lastMove = null; drawBoard(); startTimer();
        if (game.turn() !== userColor) makeAIMove();
    }

    function drawBoard() {
        const b = document.getElementById("board"); b.innerHTML = "";
        const boardState = game.board();
        for (let i = 0; i < 64; i++) {
            let r = Math.floor(i / 8), c = i % 8;
            if (userColor === 'b') { r = 7 - r; c = 7 - c; }
            const sq = String.fromCharCode(97+c) + (8-r);
            const el = document.createElement("div");
            el.className = `square ${(r+c)%2===0?'light':'dark'}`;
            if (selectedSquare === sq) el.classList.add("selected");
            if (lastMove && (lastMove.from === sq || lastMove.to === sq)) el.classList.add("last-move");
            const p = boardState[r][c];
            if (p) { const img = document.createElement("img"); img.src = pieces[p.color==='w'?p.type.toUpperCase():p.type]; el.appendChild(img); }
            el.onclick = () => handleSquareClick(sq);
            b.appendChild(el);
        }
    }

    function handleSquareClick(sq) {
        if (game.turn() !== userColor) return;
        if (selectedSquare === sq) selectedSquare = null;
        else if (selectedSquare) {
            const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
            if (move) { selectedSquare = null; lastMove = move; drawBoard(); if (!game.game_over()) makeAIMove(); else checkEnd(); }
            else selectedSquare = sq;
        } else selectedSquare = sq;
        drawBoard();
    }

    function startTimer() {
        clearInterval(intervalId);
        intervalId = setInterval(() => {
            if (game.turn() === 'w') timerW--; else timerB--;
            document.getElementById("timer-user").innerText = formatTime(userColor==='w'?timerW:timerB);
            document.getElementById("timer-opp").innerText = formatTime(userColor==='w'?timerB:timerW);
            if (timerW<=0 || timerB<=0) checkEnd();
        }, 1000);
    }

    function formatTime(s) { return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; }

    function checkEnd() {
        clearInterval(intervalId);
        document.getElementById("end-game-btn").style.display = "block";
    }

    function showRankings() {
        currentRound++;
        const rb = document.getElementById("ranking-tbody"); rb.innerHTML = "";
        [...mastersData, kidPlayer].sort((a,b) => b.pts - a.pts).forEach((p, i) => {
            rb.innerHTML += `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.pts}</td></tr>`;
        });
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('rankings-screen').classList.add('active-screen');
    }
</script>
</body>
</html>
