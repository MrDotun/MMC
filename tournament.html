<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Decipher League | Tournament Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --dl-bg: #030712;
            --dl-panel: #111827;
            --dl-accent: #4ade80;
            --dl-text: #f9fafb;
            /* Tournament Colors */
            --sq-light: #eeeed2;
            --sq-dark: #769656;
            --sq-select: rgba(255, 255, 0, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dl-bg);
            color: var(--dl-text);
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        #app-container {
            width: 95%; max-width: 450px; background: var(--dl-panel);
            padding: 20px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header-title { text-align: center; font-size: 18px; font-weight: 900; color: var(--dl-accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }

        .screen { display: none; flex-direction: column; width: 100%; }
        .active-screen { display: flex; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* FIXED SQUARE BOARD */
        #board-wrapper { width: 100%; aspect-ratio: 1/1; background: #000; padding: 4px; border-radius: 4px; box-sizing: border-box; }
        #board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; height: 100%; }

        .square { display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .light { background-color: var(--sq-light); }
        .dark { background-color: var(--sq-dark); }
        .selected { background-color: var(--sq-select) !important; }

        .square img { width: 88%; height: 88%; object-fit: contain; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4)); }

        .player-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; background: rgba(255, 255, 255, 0.03); border-radius: 12px; margin: 10px 0; border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .timer { font-family: monospace; font-size: 24px; font-weight: bold; color: var(--dl-accent); }
        button { background: var(--dl-accent); color: #000; padding: 16px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        input { padding: 15px; background: #1f2937; border: 1px solid #374151; border-radius: 10px; color: white; margin-bottom: 15px; }
        table { width: 100%; color: #9ca3af; border-collapse: collapse; font-size: 14px; }
        td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div id="app-container">
    <div class="header-title">Mind Masters League</div>

    <div id="intro-screen" class="screen active-screen">
        <div style="max-height: 180px; overflow-y: auto; margin-bottom: 15px; background: rgba(0,0,0,0.2); border-radius: 10px;">
            <table><tbody id="intro-tbody"></tbody></table>
        </div>
        <input type="text" id="kid-name" placeholder="Enter Candidate Name">
        <button onclick="enrollKid()">Begin Round 1</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="player-card">
            <div>
                <div id="opp-name" style="font-weight: 800;">MASTER</div>
                <div id="thinking-indicator" style="font-size: 10px; color: var(--dl-accent); display:none;">ENGINE ANALYZING...</div>
            </div>
            <div id="timer-opp" class="timer">05:00</div>
        </div>
        
        <div id="board-wrapper"><div id="board"></div></div>

        <div class="player-card">
            <div id="user-name" style="font-weight: 800;">PLAYER</div>
            <div id="timer-user" class="timer">05:00</div>
        </div>
        <button id="end-game-btn" style="display:none;" onclick="showRankings()">View Standings</button>
    </div>

    <div id="rankings-screen" class="screen">
        <h3 style="text-align:center; color: var(--dl-accent);">League Table</h3>
        <table><tbody id="ranking-tbody"></tbody></table>
        <button onclick="startNextRound()">Next Pairing</button>
    </div>
</div>

<script>
    const mastersData = [
        { name: "IM Odion Aikhoje", rating: 2351, pts: 0 }, { name: "FM Adebayo Adegboyega", rating: 2312, pts: 0 },
        { name: "FM Bomo Kigigha", rating: 2334, pts: 0 }, { name: "IM Adu Oladapo", rating: 2321, pts: 0 },
        { name: "IM Bunmi Olape", rating: 2306, pts: 0 }, { name: "FM Akinseye Abiola", rating: 2252, pts: 0 },
        { name: "IM Oluwafemi Balogun", rating: 2291, pts: 0 }, { name: "IM Anwuli Daniel", rating: 2365, pts: 0 },
        { name: "IM Olanrewaju Ajibola", rating: 2289, pts: 0 }
    ];

    let kidPlayer = { name: "", rating: 1500, pts: 0, isKid: true }, currentRound = 1;
    let game, userColor, currentOpponent, intervalId, timerW, timerB, selectedSquare = null;

    const pieces = {
        p: 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg', n: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        b: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg', r: 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        q: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg', k: 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
        P: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg', N: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        B: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg', R: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        Q: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg', K: 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };

    const chessWorker = new Worker('./chess-worker.js');

    chessWorker.onmessage = function(e) {
        document.getElementById('thinking-indicator').style.display = 'none';
        let moveStr = e.data.includes('bestmove') ? e.data.split(' ')[1] : e.data;
        game.move({ from: moveStr.substring(0, 2), to: moveStr.substring(2, 4), promotion: 'q' });
        drawBoard();
        if (game.game_over()) checkEnd();
    };

    function makeAIMove() {
        if (game.game_over()) return;
        document.getElementById('thinking-indicator').style.display = 'block';

        setTimeout(() => {
            // DECIPHER ADAPTIVE LOGIC: Blunder rate 1-10% based on student rating
            let blunderChance = 0.10 - ((Math.min(Math.max(kidPlayer.rating, 1500), 2700) - 1500) / 1200) * 0.09;
            
            if (Math.random() < blunderChance) {
                let moves = game.moves();
                game.move(moves[Math.floor(Math.random() * moves.length)]);
                drawBoard();
                document.getElementById('thinking-indicator').style.display = 'none';
                if (game.game_over()) checkEnd();
            } else {
                chessWorker.postMessage("position " + game.fen());
                chessWorker.postMessage("go depth 14");
            }
        }, 1000);
    }

    window.onload = () => {
        const tb = document.getElementById("intro-tbody");
        mastersData.forEach(p => tb.innerHTML += `<tr><td>${p.name}</td><td style="text-align:right">${p.rating}</td></tr>`);
    };

    function enrollKid() { 
        kidPlayer.name = document.getElementById("kid-name").value || "Candidate";
        startNextRound(); 
    }

    function startNextRound() {
        if (currentRound > 7) return alert("Tournament Over!");
        userColor = currentRound % 2 === 0 ? 'b' : 'w';
        currentOpponent = mastersData[currentRound - 1] || mastersData[0];
        game = new Chess(); timerW = timerB = 300;
        document.getElementById("opp-name").innerText = currentOpponent.name;
        document.getElementById("user-name").innerText = kidPlayer.name;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('game-screen').classList.add('active-screen');
        document.getElementById('end-game-btn').style.display = 'none';
        drawBoard(); startTimer();
        if (game.turn() !== userColor) makeAIMove();
    }

    function drawBoard() {
        const b = document.getElementById("board"); b.innerHTML = "";
        const boardState = game.board();
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                let renderR = (userColor === 'b') ? 7 - r : r;
                let renderC = (userColor === 'b') ? 7 - c : c;
                const sq = String.fromCharCode(97+renderC) + (8-renderR);
                const el = document.createElement("div");
                el.className = `square ${(renderR+renderC)%2===0?'light':'dark'}`;
                if (selectedSquare === sq) el.classList.add("selected");
                const p = boardState[renderR][renderC];
                if (p) {
                    const img = document.createElement("img");
                    img.src = pieces[p.color==='w'?p.type.toUpperCase():p.type];
                    el.appendChild(img);
                }
                el.onclick = () => handleSquareClick(sq);
                b.appendChild(el);
            }
        }
    }

    function handleSquareClick(sq) {
        if (game.turn() !== userColor) return;
        if (selectedSquare === sq) selectedSquare = null;
        else if (selectedSquare) {
            const m = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
            if (m) { selectedSquare = null; drawBoard(); if (!game.game_over()) makeAIMove(); else checkEnd(); }
            else { selectedSquare = sq; }
        } else {
            const p = game.get(sq);
            if (p && p.color === userColor) selectedSquare = sq;
        }
        drawBoard();
    }

    function startTimer() {
        clearInterval(intervalId);
        intervalId = setInterval(() => {
            if (game.turn() === 'w') timerW--; else timerB--;
            document.getElementById("timer-user").innerText = formatTime(userColor==='w'?timerW:timerB);
            document.getElementById("timer-opp").innerText = formatTime(userColor==='w'?timerB:timerW);
            if (timerW <= 0 || timerB <= 0) checkEnd();
        }, 1000);
    }

    function formatTime(s) { return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; }

    function checkEnd() {
        clearInterval(intervalId);
        let res = (game.turn() !== userColor && game.in_checkmate()) ? 1 : (game.in_draw() ? 0.5 : 0);
        kidPlayer.pts += res;
        currentOpponent.pts += (res === 1 ? 0 : (res === 0.5 ? 0.5 : 1));
        document.getElementById("end-game-btn").style.display = "block";
    }

    function showRankings() {
        currentRound++;
        const rb = document.getElementById("ranking-tbody"); rb.innerHTML = "";
        [...mastersData, kidPlayer].sort((a,b) => b.pts - a.pts).forEach((p, i) => {
            const style = p.isKid ? "style='color:var(--dl-accent);font-weight:bold'" : "";
            rb.innerHTML += `<tr ${style}><td>${i+1}. ${p.name}</td><td style="text-align:right">${p.pts}</td></tr>`;
        });
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('rankings-screen').classList.add('active-screen');
    }
</script>
</body>
</html>
