<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind Masters League | Tournament Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --bg: #030712; --panel: #0f172a; --accent: #4ade80;
            --sq-l: #eeeed2; --sq-d: #769656;
        }
        body { margin: 0; background: var(--bg); color: white; font-family: system-ui; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #app { width: 95%; max-width: 450px; background: var(--panel); padding: 20px; border-radius: 20px; border: 1px solid rgba(74, 222, 128, 0.2); box-sizing: border-box; }
        
        /* PERFECT 1:1 SQUARE BOARD */
        #board {
            width: 100%; aspect-ratio: 1/1; display: grid; 
            grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
            background: #000; padding: 4px; box-sizing: border-box; border-radius: 4px;
        }
        .sq { display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .l { background-color: var(--sq-l); } .d { background-color: var(--sq-d); }
        .sel { background-color: rgba(251, 191, 36, 0.6) !important; }
        .sq img { width: 88%; height: 88%; object-fit: contain; pointer-events: none; }

        .card { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(0,0,0,0.3); border-radius: 12px; margin: 8px 0; border: 1px solid rgba(255,255,255,0.05); }
        .timer { font-family: monospace; font-size: 24px; font-weight: bold; color: #38bdf8; }
        #status { font-size: 11px; color: var(--accent); font-weight: bold; height: 14px; text-transform: uppercase; }
        .round-tag { background: var(--accent); color: black; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 900; }
    </style>
</head>
<body>

<div id="app">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <span class="round-tag" id="round-label">ROUND 1</span>
        <span style="font-weight:900; color:var(--accent); letter-spacing:1px;">DECIPHER LEAGUE</span>
    </div>
    
    <div class="card">
        <div>
            <div id="m-name" style="font-weight: 800;">IM ODION AIKHOJE</div>
            <div id="m-rating" style="font-size:12px; color:#94a3b8;">Elo 2351</div>
            <div id="status">Your Turn</div>
        </div>
        <div id="t-opp" class="timer">05:00</div>
    </div>

    <div id="board"></div>

    <div class="card">
        <div>
            <div id="u-name" style="font-weight: 800;">CANDIDATE</div>
            <div id="u-rating" style="font-size:12px; color:#94a3b8;">Elo 1500</div>
        </div>
        <div id="t-user" class="timer">05:00</div>
    </div>
</div>

<script>
    // FULL TOURNAMENT MASTER DATA
    const mastersData = [
        { name: "IM Odion Aikhoje", rating: 2351 },
        { name: "IM Bunmi Olape", rating: 2306 },
        { name: "FM Bomo Kigigha", rating: 2334 },
        { name: "IM Adu Oladapo", rating: 2321 },
        { name: "FM Adebayo Adegboyega", rating: 2312 },
        { name: "IM Oluwafemi Balogun", rating: 2291 },
        { name: "IM Anwuli Daniel", rating: 2365 }
    ];

    let currentRound = 0; 
    let game = new Chess();
    let selectedSq = null;
    let kidRating = 1500; 
    
    // DECIPHER WORKER INITIALIZATION
    const worker = new Worker('chess/chess-worker.js');

    const pieces = {
        p:'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',n:'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        b:'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',r:'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        q:'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',k:'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
        P:'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',N:'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        B:'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',R:'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        Q:'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',K:'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };

    function draw() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';
        const state = game.board();
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const sq = String.fromCharCode(97+c) + (8-r);
                const cell = document.createElement('div');
                cell.className = `sq ${(r+c)%2===0?'l':'d'}`;
                if (selectedSq === sq) cell.classList.add('sel');
                const p = state[r][c];
                if (p) {
                    const img = document.createElement('img');
                    img.src = pieces[p.color==='w'?p.type.toUpperCase():p.type];
                    cell.appendChild(img);
                }
                cell.onclick = () => { if(game.turn()==='w') handleInput(sq); };
                boardEl.appendChild(cell);
            }
        }
    }

    function handleInput(sq) {
        if (selectedSq === sq) { selectedSq = null; }
        else if (selectedSq) {
            const m = game.move({ from: selectedSq, to: sq, promotion: 'q' });
            if (m) { selectedSq = null; draw(); engineResponse(); }
            else { selectedSq = sq; }
        } else {
            const p = game.get(sq);
            if (p && p.color === 'w') selectedSq = sq;
        }
        draw();
    }

    function engineResponse() {
        if (game.game_over()) return;
        document.getElementById('status').innerText = "MASTER THINKING...";

        // ADAPTIVE BLUNDER RATE: 1-10% based on Kid Rating
        let blunderChance = 0.10 - ((Math.min(Math.max(kidRating, 1500), 2700) - 1500) / 1200) * 0.09;

        if (Math.random() < blunderChance) {
            setTimeout(() => {
                const moves = game.moves();
                game.move(moves[Math.floor(Math.random() * moves.length)]);
                finalizeMove();
            }, 600);
        } else {
            worker.postMessage("position " + game.fen());
            worker.postMessage("go depth 14");
        }
    }

    worker.onmessage = function(e) {
        if (e.data.includes('bestmove')) {
            const move = e.data.split(' ')[1];
            game.move({ from: move.substring(0,2), to: move.substring(2,4), promotion: 'q' });
            finalizeMove();
        }
    };

    function finalizeMove() {
        document.getElementById('status').innerText = "YOUR TURN";
        draw();
        if (game.game_over()) alert("Tournament Game Over!");
    }

    // LOAD TOURNAMENT DETAILS
    function loadRound() {
        const m = mastersData[currentRound];
        document.getElementById('m-name').innerText = m.name;
        document.getElementById('m-rating').innerText = `Elo ${m.rating}`;
        document.getElementById('round-label').innerText = `ROUND ${currentRound + 1}`;
        draw();
    }

    loadRound();
</script>
</body>
</html>
