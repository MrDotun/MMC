<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notation Master | Decipher Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #4ade80; --accent: #fbbf24; --bg: #0f172a; --card: #1e293b; --danger: #ef4444; }
        body { margin: 0; padding: 20px 10px; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; border: 2px solid var(--primary); width: 100%; max-width: 500px; text-align: center; margin-bottom: 20px; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .league-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .league-table th { color: #94a3b8; font-size: 0.8em; text-transform: uppercase; padding: 10px; border-bottom: 1px solid #334155; }
        .league-table td { padding: 12px 10px; border-bottom: 1px solid #334155; text-align: left; }
        #board { width: 100%; border: 4px solid var(--primary); border-radius: 8px; background: #1e293b; }
        .input-move { width: 100%; padding: 15px; font-size: 1.5em; text-align: center; border-radius: 8px; border: 2px solid var(--primary); background: #0f172a; color: var(--primary); font-weight: bold; margin: 15px 0; box-sizing: border-box; }
        .submit-btn { background: var(--primary); color: #0f172a; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.1em; transition: 0.2s; }
        .lesson-box { background: #020617; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary); text-align: left; }
        #quiz-section { display: none; width: 100%; max-width: 500px; }
    </style>
</head>
<body>

<div class="card" style="border-color: var(--accent);">
    <h2 style="color: var(--accent); margin: 0 0 10px 0;">📜 School Result List</h2>
    <table class="league-table">
        <thead>
            <tr><th>Student</th><th>Class</th><th style="text-align:center;">Time</th><th style="text-align:right;">Score</th></tr>
        </thead>
        <tbody id="results-body"></tbody>
    </table>
    <button onclick="adminPanel()" style="margin-top:15px; background:transparent; border:none; color:#64748b; cursor:pointer; font-size:0.8em; text-decoration: underline;">Teacher Admin: Remove/Reset Students</button>
</div>

<div id="setup-section" class="card">
    <h1 style="color: var(--primary); margin-top:0;">Notation Master</h1>
    <input type="text" id="sName" class="input-move" style="font-size: 1.1em;" placeholder="Full Name">
    <input type="text" id="sClass" class="input-move" style="font-size: 1.1em;" placeholder="Class">
    <button class="submit-btn" onclick="startTest()">START 20-QUESTION TEST</button>
</div>

<div id="quiz-section">
    <div class="card" style="padding:15px; margin-bottom:10px;"><h3 id="q-count" style="margin:0; color:var(--primary);">Question 1 of 20</h3></div>
    <div id="board"></div>
    <div class="card" style="margin-top:10px;">
        <p id="instruction" style="font-weight:bold; margin-top:0;"></p>
        <input type="text" id="userInput" class="input-move" placeholder="Type answer...">
        <button class="submit-btn" onclick="processAnswer()">SUBMIT ANSWER</button>
        <p id="feedback" style="margin-top:15px; font-weight:bold;"></p>
    </div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let board, game = new Chess(), studentId, startTime, currentQ = 0, score = 0;

// 20 Question Database (5 Squares + 15 Moves)
const challenges = [
    { type: 'sq', target: 'e4', text: 'Identify the highlighted square:' },
    { type: 'sq', target: 'c5', text: 'Identify the highlighted square:' },
    { type: 'sq', target: 'd6', text: 'Identify the highlighted square:' },
    { type: 'sq', target: 'g8', text: 'Identify the highlighted square:' },
    { type: 'sq', target: 'h7', text: 'Identify the highlighted square:' },
    { type: 'mv', fen: 'start', move: 'e4', target: 'e4', text: 'Record White\'s first pawn move:' },
    { type: 'mv', fen: 'rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1', move: 'Nf3', target: 'Nf3', text: 'Record the Knight move:' },
    { type: 'mv', fen: 'r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3', move: 'Bc4', target: 'Bc4', text: 'Record the Bishop move:' },
    { type: 'mv', fen: 'r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 5', move: 'O-O', target: 'O-O', text: 'Record White\'s Castling move:' },
    { type: 'mv', fen: 'r3k2r/p1p1p1p1/1p2n2p/4P3/3P3P/5NP1/PPPN1PBR/4K3 w - - 0 1', move: 'g5', target: 'Ng5', text: 'Record the discovered attack Knight move:' },
    { type: 'mv', fen: '4k3/p4pp1/1pnp1npp/4p3/4P3/2P2N1P/PP2BPP1/5RK1 w - - 0 1', move: 'Bb5', target: 'Bb5', text: 'Record the absolute pin move:' },
    { type: 'mv', fen: 'r3k2r/ppp1ppp1/2n2p2/1N6/1p2q3/2P3QP/PP3PP1/R4RK1 w - - 0 1', move: 'Nc7+', target: 'Nc7+', text: 'Record the Knight fork (add + for check):' },
    { type: 'mv', fen: 'r2qk2r/p2b1ppp/1pnp1n2/4p3/4P3/2P1BN1P/PP2BPP1/3Q1RK1 w - - 0 1', move: 'Bg5', target: 'Bg5', text: 'Record the pin on the f6 Knight:' },
    { type: 'mv', fen: 'r2qk2r/ppp2pp1/3b1nP1/3p4/2PPP3/5N1P/P1B1QPP1/R4RK1 w - - 0 1', move: 'e5', target: 'e5', text: 'Record the pawn fork:' },
    { type: 'mv', fen: '3rk2r/p1p2pp1/1p5q/3PN3/4Q3/2P3P1/PP3P2/3R2K1 w - - 0 1', move: 'Ng4+', target: 'Ng4+', text: 'Record the discovered attack (add +):' },
    { type: 'mv', fen: '2rqk2r/p4ppp/1pnp1n2/4p3/4P1b1/2NBBNP1/PP3P2/3Q1RK1 w - - 0 1', move: 'Be2', target: 'Be2', text: 'Record the unpinning move:' },
    { type: 'mv', fen: '4k3/ppp1ppp1/2r2p2/8/4r3/1BP4P/PP3PP1/R5K1 w - - 0 1', move: 'Bd5', target: 'Bd5', text: 'Record the double attack on the Rooks:' },
    { type: 'mv', fen: '2rqk2r/p4p1p/1pnp4/4p3/4P3/2N5/PP2BP2/3Q1RK1 w - - 0 1', move: 'Bh5', target: 'Bh5', text: 'Record the pin on the f7 pawn:' },
    { type: 'mv', fen: '3rkr2/p1pp1pp1/1p5q/3PB3/4Q3/2P3P1/PP3P2/3R2K1 w - - 0 1', move: 'Bf6#', target: 'Bf6#', text: 'Record the discovered checkmate (add #):' },
    { type: 'mv', fen: 'r6r/p5p1/2n3k1/8/8/7P/P4PP1/4RRK1 w - - 0 1', move: 'Re6+', target: 'Re6+', text: 'Record the Rook check:' }
];

function startTest() {
    const name = $('#sName').val().trim(), cls = $('#sClass').val().trim();
    if(!name || !cls) return alert("Enter name and class!");
    studentId = name + "_" + cls;
    startTime = Date.now();
    $('#setup-section').hide(); $('#quiz-section').show();
    board = ChessBoard('board', { position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
    loadQuestion();
}

function loadQuestion() {
    if(currentQ >= 20) return finishTest();
    const q = challenges[currentQ];
    $('#q-count').text(`Question ${currentQ + 1} of 20`);
    $('#instruction').html(q.text); $('#userInput').val("").focus(); $('#feedback').text("");
    if(q.type === 'sq') { board.clear(); setTimeout(() => highlight(q.target), 200); }
    else { game.load(q.fen === 'start' ? 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1' : q.fen);
           board.position(game.fen()); setTimeout(() => { game.move(q.move); board.position(game.fen()); }, 600); }
}

function highlight(sq) { $('.square-55d6d').css('background', ''); $('.square-' + sq).css('background', 'rgba(251, 191, 36, 0.8)'); }

async function processAnswer() {
    const ans = $('#userInput').val().trim(), target = challenges[currentQ].target;
    if(ans.toLowerCase() === target.toLowerCase() || ans === target) {
        score++;
        const timeSpent = Math.floor((Date.now() - startTime) / 1000);
        await db.collection("leaderboard").doc(studentId).set({ name: $('#sName').val(), class: $('#sClass').val(), notationScore: score, totalTime: timeSpent, hasTakenTest: true }, { merge: true });
        currentQ++; setTimeout(loadQuestion, 800);
    } else { $('#feedback').text("Try again! Check your notation.").css('color', '#f87171'); }
}

function finishTest() { $('#quiz-section').html("<div class='card'><h1>🎉 20/20 FINISHED!</h1><button class='submit-btn' onclick='location.reload()'>VIEW RESULTS</button></div>"); }

// LIVE RESULTS LISTENER
db.collection("leaderboard").orderBy("notationScore", "desc").onSnapshot(snap => {
    let html = "";
    snap.forEach(doc => {
        const d = doc.data();
        if(d.hasTakenTest) {
            const m = Math.floor(d.totalTime / 60), s = d.totalTime % 60;
            html += `<tr><td><b>${d.name}</b></td><td>${d.class}</td><td style="text-align:center; color:#94a3b8;">${m}m ${s}s</td><td style="text-align:right; font-weight:bold; color:var(--primary);">${d.notationScore} / 20</td></tr>`;
        }
    });
    $('#results-body').html(html || "<tr><td colspan='4'>No results yet</td></tr>");
});

// TEACHER ADMIN: REMOVE ANY STUDENT
async function adminPanel() {
    if(prompt("Teacher Access Code:") !== "decipher1234") return alert("Denied!");
    const snap = await db.collection("leaderboard").get();
    let manageList = "Click a student to DELETE them permanently:\n\n";
    let students = [];
    snap.forEach(doc => { if(doc.data().hasTakenTest) students.push({ id: doc.id, name: doc.data().name }); });
    
    if(students.length === 0) return alert("No students found in the result list.");
    
    let promptMsg = "Type the number of the student to DELETE:\n";
    students.forEach((s, i) => { promptMsg += `${i+1}. ${s.name}\n`; });
    
    const choice = prompt(promptMsg);
    if(choice && students[choice-1]) {
        const target = students[choice-1];
        if(confirm(`Are you sure you want to remove ${target.name} and their results?`)) {
            await db.collection("leaderboard").doc(target.id).delete();
            alert("Student removed successfully.");
        }
    }
}
</script>
</body>
</html>
