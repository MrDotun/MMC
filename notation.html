    <style>
        :root { --primary: #4ade80; --bg: #0f172a; --card: #1e293b; --accent: #fbbf24; }
        * { box-sizing: border-box; touch-action: manipulation; }
        
        body { 
            margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); color: white; 
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden;
        }

        #main-wrapper {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; padding: 10px; width: 100%; max-width: 450px; margin: 0 auto;
        }

        /* Top Leaderboard Styling */
        .leaderboard-container {
            width: 100%; max-height: 15vh; overflow-y: auto;
            background: var(--card); border: 1px solid var(--accent);
            border-radius: 8px; padding: 5px; margin-bottom: 10px;
        }
        .league-table { width: 100%; border-collapse: collapse; font-size: 0.8em; }
        .league-table td { padding: 4px; border-bottom: 1px solid #334155; }

        .header-box { width: 100%; background: var(--card); border: 2px solid #334155; border-radius: 10px; padding: 8px; margin-bottom: 8px; text-align: center; }
        #board { width: 100%; border: 4px solid #334155; border-radius: 5px; }

        .input-container { width: 100%; background: var(--card); border: 2px solid var(--primary); border-radius: 15px; padding: 12px; margin-top: 8px; text-align: center; }
        .input-move { 
            width: 100%; padding: 10px; font-size: 1.4em; text-align: center; 
            border-radius: 8px; border: 1px solid #334155; background: #0f172a; 
            color: var(--primary); font-weight: bold; margin-bottom: 8px;
        }

        .submit-btn { background: var(--primary); color: #0f172a; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.1em; }
        .square-55d6d { background-color: transparent !important; }
    </style>
</head>
<body>

<div id="main-wrapper">
    <div class="leaderboard-container">
        <table class="league-table">
            <tbody id="results-body"></tbody>
        </table>
    </div>

    <div id="setup-section" class="input-container">
        <h2 style="color: var(--primary); margin: 0 0 5px 0;">Notation Master</h2>
        <p style="margin: 0 0 10px 0; font-size: 0.9em;">Type the move correctly for Bonus Points!</p>
        <input type="text" id="sName" class="input-move" placeholder="Full Name">
        <input type="text" id="sClass" class="input-move" placeholder="Class">
        <button class="submit-btn" onclick="startTest()">START TEST</button>
    </div>

    <div id="quiz-section" style="display:none; width: 100%;">
        <div class="header-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="q-count" style="color:var(--primary); font-weight:bold;">Q 1 of 15</span>
                <span id="live-score" style="color:var(--accent); font-weight:bold;">Score: 0</span>
            </div>
        </div>

        <div id="board"></div>

        <div class="input-container">
            <input type="text" id="userInput" class="input-move" placeholder="Type move here...">
            <button class="submit-btn" onclick="processAnswer()">SUBMIT MOVE</button>
            <p id="feedback" style="margin: 5px 0; font-weight: bold; font-size: 0.9em; min-height: 1.2em;"></p>
            <button onclick="loadQuestion()" style="background:none; border:none; color:var(--accent); text-decoration:underline; cursor:pointer; font-size:0.85em;">Watch Move Again</button>
        </div>
    </div>
</div>

function startTest() {
    studentId = $('#sName').val() + "_" + $('#sClass').val();
    $('#setup-section').hide(); $('#quiz-section').show();
    board = ChessBoard('board', { position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png', moveSpeed: 'slow' });
    loadQuestion();
}

function loadQuestion() {
    if(currentQ >= challenges.length) return finishTest();
    attempts = 0;
    $('#q-count').text(`Q ${currentQ + 1} of 15`);
    $('#live-score').text(`Score: ${score}`);
    $('#userInput').val("").focus();
    $('#feedback').text("");
    game.load(challenges[currentQ].fen);
    board.position(challenges[currentQ].fen, false); 
    setTimeout(() => {
        game.move(challenges[currentQ].move);
        board.position(game.fen());
    }, 900);
}
