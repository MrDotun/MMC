<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notation Master | Grade 3</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #4ade80; --accent: #fbbf24; --bg: #0f172a; --card: #1e293b; }
        body { margin: 0; padding: 20px 10px; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; border: 2px solid var(--primary); width: 100%; max-width: 500px; text-align: center; margin-bottom: 20px; box-sizing: border-box; }
        .league-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        .league-table th { color: var(--accent); border-bottom: 2px solid #334155; padding: 10px; text-align: left; }
        .league-table td { padding: 10px; border-bottom: 1px solid #334155; text-align: left; }
        #board { width: 100%; border: 4px solid #334155; border-radius: 8px; }
        .input-move { width: 100%; padding: 15px; font-size: 1.5em; text-align: center; border-radius: 8px; border: 2px solid var(--primary); background: #0f172a; color: var(--primary); font-weight: bold; margin: 15px 0; box-sizing: border-box; }
        .submit-btn { background: var(--primary); color: #0f172a; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.1em; }
        #quiz-section { display: none; width: 100%; max-width: 500px; }
        
        /* Ensure NO highlights ever appear */
        .square-55d6d { background-color: transparent !important; }
    </style>
</head>
<body>

<div class="card" style="border-color: var(--accent);">
    <h2 style="color: var(--accent); margin: 0;">📜 School Result List</h2>
    <table class="league-table">
        <thead>
            <tr><th>Student</th><th>Class</th><th style="text-align:right;">Score</th></tr>
        </thead>
        <tbody id="results-body"></tbody>
    </table>
</div>

<div id="setup-section" class="card">
    <h1 style="color: var(--primary); margin:0;">Notation Master</h1>
    <p>Watch the piece move, then record it.</p>
    <input type="text" id="sName" class="input-move" placeholder="Full Name">
    <input type="text" id="sClass" class="input-move" placeholder="Class">
    <button class="submit-btn" onclick="startTest()">START TEST</button>
</div>

<div id="quiz-section">
    <div class="card" style="padding:15px; margin-bottom:10px;"><h3 id="q-count" style="margin:0; color:var(--primary);">Question 1 of 15</h3></div>
    <div id="board"></div>
    <div class="card" style="margin-top:10px;">
        <p id="instruction" style="font-weight:bold; margin-bottom:10px;">Record the move played:</p>
        <input type="text" id="userInput" class="input-move" placeholder="Example: Nf3">
        <button class="submit-btn" onclick="processAnswer()">SUBMIT MOVE</button>
        <p id="feedback" style="margin-top:10px; font-weight:bold;"></p>
        <button onclick="loadQuestion()" style="background:none; border:none; color:var(--accent); text-decoration:underline; cursor:pointer; font-size:0.9em;">Watch Move Again</button>
    </div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let board, game = new Chess(), studentId, currentQ = 0, score = 0;

// All puzzles from your JSON files, simplified to just "Record the move played"
const challenges = [
    { fen: 'r3k2r/p1p1p1p1/1p2n2p/4P3/3P3P/5NP1/PPPN1PBR/4K3 w - - 0 1', move: 'Ng5' },
    { fen: '3rk2r/p1p2pp1/1p5q/3PN3/4Q3/2P3P1/PP3P2/3R2K1 w - - 0 1', move: 'Ng4+' },
    { fen: '3rkr2/p1pp1pp1/1p5q/3PB3/4Q3/2P3P1/PP3P2/3R2K1 w - - 0 1', move: 'Bf6#' },
    { fen: '4k3/p4pp1/1pnp1npp/4p3/4P3/2P2N1P/PP2BPP1/5RK1 w - - 0 1', move: 'Bb5' },
    { fen: 'r2qk2r/p2b1ppp/1pnp1n2/4p3/4P3/2P1BN1P/PP2BPP1/3Q1RK1 w - - 0 1', move: 'Bg5' },
    { fen: '2rqk2r/p4p1p/1pnp4/4p3/4P3/2N5/PP2BP2/3Q1RK1 w - - 0 1', move: 'Bh5' },
    { fen: 'r3k2r/ppp1ppp1/2n2p2/1N6/1p2q3/2P3QP/PP3PP1/R4RK1 w - - 0 1', move: 'Nc7+' },
    { fen: '4k2r/ppp1ppp1/r1n2p2/8/1p2q3/2PN2QP/PP3PP1/R4RK1 w - - 0 1', move: 'Nc5' },
    { fen: '4k3/ppp1ppp1/2r2p2/8/4r3/1BP4P/PP3PP1/R5K1 w - - 0 1', move: 'Bd5' },
    { fen: 'r2qk2r/ppp2pp1/3b1nP1/3p4/2PPP3/5N1P/P1B1QPP1/R4RK1 w - - 0 1', move: 'e5' },
    { fen: 'r6r/p5p1/2n3k1/8/8/7P/P4PP1/4RRK1 w - - 0 1', move: 'Re6+' },
    { fen: 'r3k2r/p1p1p1p1/1p2np1p/8/3PP2P/2P3P1/PP1N1PB1/3RK3 w - - 0 1', move: 'e5' },
    { fen: '3r3k/p1pp1p1p/1p6/2qPR2n/1P1B4/2P3P1/PP3P2/6K1 w - - 0 1', move: 'Re8#' },
    { fen: '2rq2kr/p4p1p/1pnp4/4p1n1/4P3/2N5/PP2BP1P/3Q1R1K w - - 0 1', move: 'Rg1' },
    { fen: '2rqk2r/p4ppp/1pnp1n2/4p3/4P1b1/2NBBNP1/PP3P2/3Q1RK1 w - - 0 1', move: 'Be2' }
];

function startTest() {
    studentId = $('#sName').val() + "_" + $('#sClass').val();
    $('#setup-section').hide(); $('#quiz-section').show();
    board = ChessBoard('board', { position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png', moveSpeed: 'slow' });
    loadQuestion();
}

function loadQuestion() {
    if(currentQ >= challenges.length) return finishTest();
    
    const q = challenges[currentQ];
    $('#q-count').text(`Question ${currentQ + 1} of 15`);
    $('#userInput').val("").focus();
    $('#feedback').text("");

    game.load(q.fen);
    board.position(q.fen, false); // Instant reset to starting pos

    setTimeout(() => {
        game.move(q.move);
        board.position(game.fen()); // Piece slides, NO highlights appear
    }, 1200);
}

async function processAnswer() {
    const ans = $('#userInput').val().trim();
    const target = challenges[currentQ].move;
    
    if(ans === target || ans.toLowerCase() === target.toLowerCase()) {
        score++;
        $('#feedback').text("Correct! Next...").css('color', '#4ade80');
        
        await db.collection("leaderboard").doc(studentId).set({ 
            name: $('#sName').val(), 
            class: $('#sClass').val(), 
            notationScore: score, 
            hasTakenTest: true 
        }, { merge: true });
        
        currentQ++; 
        setTimeout(loadQuestion, 1000); 
    } else { 
        $('#feedback').text("Try again! Record the piece move.").css('color', '#f87171'); 
    }
}

function finishTest() { 
    $('#quiz-section').html("<div class='card'><h1>🎉 Finished!</h1><button class='submit-btn' onclick='location.reload()'>RESTART</button></div>"); 
}

// LEADERBOARD UPDATER
db.collection("leaderboard").orderBy("notationScore", "desc").onSnapshot(snap => {
    let html = "";
    snap.forEach(doc => {
        const d = doc.data();
        if(d.hasTakenTest) {
            html += `<tr><td><b>${d.name}</b></td><td>${d.class}</td><td style="text-align:right;"><b>${d.notationScore}</b></td></tr>`;
        }
    });
    $('#results-body').html(html);
});
</script>
</body>
</html>
