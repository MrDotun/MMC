<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notation Master</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #4ade80; --bg: #0f172a; --card: #1e293b; --accent: #fbbf24; }
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; padding: 10px; font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); color: white; 
            display: flex; flex-direction: column; align-items: center;
        }

        #main-wrapper { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; }

        /* The centralized card style you prefer */
        .central-card { 
            background: var(--card); border: 2px solid var(--primary); 
            border-radius: 20px; padding: 20px; text-align: center; width: 100%; 
        }

        .input-move { 
            width: 100%; padding: 15px; font-size: 1.3em; text-align: center; 
            border-radius: 10px; border: 1px solid #334155; background: #0f172a; 
            color: var(--primary); font-weight: bold; margin-bottom: 10px;
        }

        .submit-btn { background: var(--primary); color: #0f172a; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.2em; }
        
        #board { width: 100%; border: 4px solid #334155; border-radius: 8px; margin: 10px 0; }

        /* Restored Leaderboard styling */
        .result-section { width: 100%; margin-top: 20px; background: rgba(30, 41, 59, 0.5); border-radius: 15px; padding: 10px; border: 1px solid var(--accent); }
        .league-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        .league-table th { color: var(--accent); padding-bottom: 10px; text-align: left; }
        .league-table td { padding: 8px 0; border-bottom: 1px solid #334155; }

        .square-55d6d { background-color: transparent !important; }
    </style>
</head>
<body>

<div id="main-wrapper">
    <div id="setup-section">
        <div class="central-card">
            <h1 style="color: var(--primary); margin: 0 0 10px 0;">Notation Master</h1>
            <p style="margin-bottom: 20px;">Type the move correctly for Bonus Points!</p>
            <input type="text" id="sName" class="input-move" placeholder="Full Name">
            <input type="text" id="sClass" class="input-move" placeholder="Class">
            <button class="submit-btn" onclick="startTest()">START TEST</button>
        </div>

        <div class="result-section">
            <h3 style="color: var(--accent); margin: 0 0 10px 0; text-align: center;">📜 School Result List</h3>
            <table class="league-table">
                <thead><tr><th>Student</th><th style="text-align:right;">Score</th></tr></thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>
    </div>

    <div id="quiz-section" style="display:none;">
        <div style="text-align: center; margin-bottom: 5px;">
            <span id="q-count" style="color:var(--primary); font-weight:bold; font-size: 1.1em;">Question 1 of 15</span>
        </div>

        <div id="board"></div>

        <div class="central-card" style="padding: 15px;">
            <input type="text" id="userInput" class="input-move" placeholder="Type move here...">
            <button class="submit-btn" onclick="processAnswer()">SUBMIT MOVE</button>
            <p id="feedback" style="margin: 10px 0; font-weight: bold; min-height: 1.2em;"></p>
            <button onclick="loadQuestion()" style="background:none; border:none; color:var(--accent); text-decoration:underline; cursor:pointer; font-size:1em;">Watch Move Again</button>
        </div>
    </div>
</div>

<script>
// Firebase Config
const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let board, game = new Chess(), studentId, currentQ = 0, score = 0, attempts = 0;

const challenges = [
    { fen: 'r3k2r/p1p1p1p1/1p2n2p/4P3/3P3P/5NP1/PPPN1PBR/4K3 w - - 0 1', move: 'Ng5' },
    { fen: '3rk2r/p1p2pp1/1p5q/3PN3/4Q3/2P3P1/PP3P2/3R2K1 w - - 0 1', move: 'Ng4+' },
    { fen: '3rkr2/p1pp1pp1/1p5q/3PB3/4Q3/2P3P1/PP3P2/3R2K1 w - - 0 1', move: 'Bf6#' },
    { fen: '4k3/p4pp1/1pnp1npp/4p3/4P3/2P2N1P/PP2BPP1/5RK1 w - - 0 1', move: 'Bb5' },
    { fen: 'r2qk2r/ppP1ppp1/2n2p2/1N6/1p2q3/2P3QP/PP3PP1/R4RK1 w - - 0 1', move: 'Nxc7+' },
    { fen: 'r2qk2r/p2b1ppp/1pnp1n2/4p3/4P3/2P1BN1P/PP2BPP1/3Q1RK1 w - - 0 1', move: 'Bg5' },
    { fen: '2rqk2r/p4p1p/1pnp4/4p3/4P3/2N5/PP2BP2/3Q1RK1 w - - 0 1', move: 'Bh5' },
    { fen: '4k2r/ppp1ppp1/r1n2p2/8/1p2q3/2PN2QP/PP3PP1/R4RK1 w - - 0 1', move: 'Nc5' },
    { fen: '4k3/ppp1ppp1/2r2p2/8/4r3/1BP4P/PP3PP1/R5K1 w - - 0 1', move: 'Bd5' },
    { fen: 'r2qk2r/ppp2pp1/3b1nP1/3p4/2PPP3/5N1P/P1B1QPP1/R4RK1 w - - 0 1', move: 'e5' },
    { fen: 'r6r/p5p1/2n3k1/8/8/7P/P4PP1/4RRK1 w - - 0 1', move: 'Re6+' },
    { fen: 'r3k2r/p1p1p1p1/1p2np1p/8/3PP2P/2P3P1/PP1N1PB1/3RK3 w - - 0 1', move: 'e5' },
    { fen: '3r3k/p1pp1p1p/1p6/2qPR2n/1P1B4/2P3P1/PP3P2/6K1 w - - 0 1', move: 'Re8#' },
    { fen: '2rq2kr/p4p1p/1pnp4/4p1n1/4P3/2N5/PP2BP1P/3Q1R1K w - - 0 1', move: 'Rg1' },
    { fen: '2rqk2r/p4ppp/1pnp1n2/4p3/4P1b1/2NBBNP1/PP3P2/3Q1RK1 w - - 0 1', move: 'Be2' }
];

function startTest() {
    studentId = $('#sName').val() + "_" + $('#sClass').val();
    if($('#sName').val() == "") return alert("Enter Name");
    $('#setup-section').hide(); $('#quiz-section').show();
    board = ChessBoard('board', { position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png', moveSpeed: 'slow' });
    loadQuestion();
}

function loadQuestion() {
    if(currentQ >= challenges.length) return finishTest();
    attempts = 0;
    $('#q-count').text(`Question ${currentQ + 1} of 15`);
    $('#userInput').val("").focus();
    $('#feedback').text("");
    game.load(challenges[currentQ].fen);
    board.position(challenges[currentQ].fen, false); 
    setTimeout(() => {
        game.move(challenges[currentQ].move);
        board.position(game.fen());
    }, 1000);
}

async function processAnswer() {
    const raw = $('#userInput').val().trim();
    const cleanIn = raw.toLowerCase().replace(/[+#x]/g, '');
    const correct = challenges[currentQ].move;
    const cleanCor = correct.toLowerCase().replace(/[+#x]/g, '');
    
    if (cleanIn === cleanCor) {
        let bonus = (correct.match(/[+#x]/) && raw.match(/[+#x]/));
        score += bonus ? 2 : 1;
        $('#feedback').html(bonus ? "Correct! + BONUS" : "Correct!").css('color', '#4ade80');
        await updateDB();
        currentQ++; setTimeout(loadQuestion, 1000);
    } else {
        attempts++;
        if (attempts >= 3) {
            $('#feedback').html(`Correct answer was: ${correct}`).css('color', '#fbbf24');
            await updateDB(); currentQ++; setTimeout(loadQuestion, 3000);
        } else {
            $('#feedback').text(`Try again! (${3 - attempts} left)`).css('color', '#f87171');
        }
    }
}

async function updateDB() {
    await db.collection("leaderboard").doc(studentId).set({ 
        name: $('#sName').val(), notationScore: score, hasTakenTest: true 
    }, { merge: true });
}

function finishTest() {
    $('#quiz-section').html("<div class='central-card'><h2>🎉 Well Done!</h2><h3>Final Score: "+score+"</h3><button class='submit-btn' onclick='location.reload()'>EXIT</button></div>");
}

// RESTORED LEADERBOARD LISTENER
db.collection("leaderboard").orderBy("notationScore", "desc").onSnapshot(snap => {
    let h = ""; 
    snap.forEach(doc => { 
        h += `<tr><td><b>${doc.data().name}</b></td><td style="text-align:right;"><b>${doc.data().notationScore}</b></td></tr>`; 
    });
    $('#results-body').html(h);
});
</script>
</body>
</html>
