<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notation Academy | Decipher Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 15px; border: 2px solid #4ade80; width: 90%; max-width: 450px; text-align: center; margin: 20px 0; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .league-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        .league-table td, .league-table th { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
        
        #training-mode { display: block; }
        #quiz-mode { display: none; width: 95vmin; max-width: 450px; }
        
        .symbol-table { width: 100%; margin: 15px 0; border-collapse: collapse; background: #020617; border-radius: 10px; overflow: hidden; }
        .symbol-table td { padding: 10px; border: 1px solid #334155; }
        
        #board { width: 100%; border: 4px solid #4ade80; border-radius: 8px; }
        .input-move { width: 100%; padding: 15px; font-size: 1.5em; text-align: center; border-radius: 8px; border: 2px solid #4ade80; background: #0f172a; color: #4ade80; font-weight: bold; margin: 10px 0; box-sizing: border-box; }
        .submit-btn { background: #4ade80; color: #0f172a; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.1em; }
        .reset-btn { background: #ef4444; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="card" style="max-width: 600px; border-color: #fbbf24;">
    <h2 style="color: #fbbf24; margin-top:0;">📜 Notation Exam Results</h2>
    <table class="league-table">
        <thead>
            <tr style="color: #94a3b8;">
                <th>STUDENT</th>
                <th>CLASS</th>
                <th style="text-align: right;">SCORE</th>
            </tr>
        </thead>
        <tbody id="notation-results-body"></tbody>
    </table>
    <button class="submit-btn" style="margin-top:20px; background:#334155; color:white;" onclick="openTeacherAdmin()">TEACHER ADMIN</button>
</div>

<div id="training-mode" class="card">
    <h1 style="color: #4ade80;">Step 1: Training</h1>
    <p>Study the piece symbols before the 20-question test.</p>
    <table class="symbol-table">
        <tr><td>♔ King: <b>K</b></td><td>♕ Queen: <b>Q</b></td></tr>
        <tr><td>♖ Rook: <b>R</b></td><td>♗ Bishop: <b>B</b></td></tr>
        <tr><td>♘ Knight: <b style="color:#fbbf24">N</b></td><td>♙ Pawn: <b>(None)</b></td></tr>
    </table>
    <input type="text" id="sName" class="input-move" style="font-size: 1em;" placeholder="Full Name">
    <input type="text" id="sClass" class="input-move" style="font-size: 1em;" placeholder="Class">
    <button class="submit-btn" onclick="startQuiz()">START 20/20 TEST</button>
</div>

<div id="quiz-mode">
    <div class="card" style="width:100%; margin-top:0; padding:15px;">
        <h3 id="quiz-status" style="margin:0; color:#4ade80;">Question 1 of 20</h3>
    </div>
    <div id="board"></div>
    <div class="card" style="margin-top:15px; width: 100%; box-sizing: border-box;">
        <p id="quiz-text" style="margin-top:0; font-weight:bold;">Find the square e4</p>
        <input type="text" id="userInput" class="input-move" placeholder="Type answer...">
        <button class="submit-btn" onclick="checkQuizAnswer()">SUBMIT ANSWER</button>
        <p id="feedback" style="margin-top:10px; font-weight:bold;"></p>
    </div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let board, game = new Chess(), studentId = "", currentStep = 1, correctAnswer = "e4";

// PUBLIC RESULTS LOADER
function loadPublicResults() {
    db.collection("leaderboard").orderBy("notationScore", "desc").onSnapshot((snap) => {
        let html = "";
        snap.forEach(doc => {
            const d = doc.data();
            const score = d.notationScore || 0;
            if (score > 0 || d.hasTakenTest) {
                html += `<tr>
                    <td><b>${d.name}</b></td>
                    <td>${d.class}</td>
                    <td style="text-align:right; font-weight:bold; color:#4ade80;">${score} / 20</td>
                </tr>`;
            }
        });
        $('#notation-results-body').html(html || "<tr><td colspan='3'>No students have finished yet.</td></tr>");
    });
}
loadPublicResults();

function startQuiz() {
    const name = $('#sName').val().trim();
    const cls = $('#sClass').val().trim();
    if(!name || !cls) return alert("Enter details to save your score!");
    studentId = name + "_" + cls;
    $('#training-mode').hide();
    $('#quiz-mode').show();
    board = ChessBoard('board', { position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
    highlight('e4');
}

function highlight(sq) {
    $('.square-55d6d').css('background', ''); 
    setTimeout(() => { $('.square-' + sq).css('background', 'rgba(251, 191, 36, 0.8)'); }, 200);
}

async function checkQuizAnswer() {
    const input = $('#userInput').val().trim();
    if(input.toLowerCase() === correctAnswer.toLowerCase() || input === correctAnswer) {
        await db.collection("leaderboard").doc(studentId).set({
            name: $('#sName').val(),
            class: $('#sClass').val(),
            notationScore: firebase.firestore.FieldValue.increment(1),
            hasTakenTest: true
        }, { merge: true });
        $('#feedback').text("Correct! +1 Point").css('color', '#4ade80');
        setTimeout(nextQuestion, 1000);
    } else {
        $('#feedback').text("Incorrect. Try again!").css('color', '#f87171');
    }
}

function nextQuestion() {
    currentStep++;
    if(currentStep > 20) {
        $('#quiz-mode').html("<div class='card'><h2>Final: 20/20</h2><button class='submit-btn' onclick='location.reload()'>DONE</button></div>");
        return;
    }
    $('#quiz-status').text(`Question ${currentStep} of 20`);
    $('#userInput').val("").focus();
    $('#feedback').text("");
    
    // Logic for 20 questions can be added here (squares, moves, symbols)
    correctAnswer = "g5"; // Example for Q2
    highlight('g5');
    $('#quiz-text').html("Find square <b>g5</b>");
}

// TEACHER ADMIN FUNCTION
async function openTeacherAdmin() {
    const code = prompt("Enter Teacher Access Code:");
    if (code !== "decipher1234") return alert("Unauthorized!");
    
    const snap = await db.collection("leaderboard").get();
    let list = "STUDENT LIST (Click to Reset Score):\n";
    snap.forEach(doc => {
        const d = doc.data();
        if(confirm(`Reset score for ${d.name} (${d.notationScore}/20)?`)) {
            db.collection("leaderboard").doc(doc.id).update({ notationScore: 0 });
        }
    });
}
</script>
</body>
</html>
