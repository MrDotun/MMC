
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notation Master | Decipher Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 15px; border: 2px solid #4ade80; width: 90%; max-width: 450px; text-align: center; margin: 20px 0; }
        .login-input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; }
        
        #game-area { display: none; width: 95vmin; max-width: 450px; }
        #board { width: 100%; border: 4px solid #4ade80; border-radius: 8px; }
        
        .lesson-box { background: #020617; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #4ade80; text-align: left; font-size: 0.9em; }
        .input-move { width: 100%; padding: 15px; font-size: 1.5em; text-align: center; border-radius: 8px; border: 2px solid #4ade80; background: #0f172a; color: #4ade80; font-weight: bold; margin: 10px 0; }
        .submit-btn { background: #4ade80; color: #0f172a; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.1em; }
        .points-tag { color: #fbbf24; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

<div id="login-overlay" class="card">
    <h1 style="color: #4ade80;">Notation School</h1>
    <p>Learn to record moves and earn 100 points!</p>
    <input type="text" id="sName" class="login-input" placeholder="Your Full Name">
    <input type="text" id="sClass" class="login-input" placeholder="Your Class">
    <button class="submit-btn" onclick="startLesson()">START LESSON</button>
</div>

<div id="game-area">
    <div class="lesson-box" id="lesson-text">
        <b>Step 1: The Grid</b><br>
        Each square has a name. The letter comes from the bottom (a-h) and the number comes from the side (1-8). 
        <br><br><span style="color:#4ade80">Find the square highlighted in yellow!</span>
    </div>

    <div id="board"></div>

    <div class="card" style="margin-top:15px; width: 100%; box-sizing: border-box;">
        <input type="text" id="userInput" class="input-move" placeholder="e.g. e4">
        <button class="submit-btn" onclick="checkAnswer()">CHECK MY ANSWER</button>
        <p id="feedback" style="margin-top:10px; font-weight:bold;"></p>
    </div>
</div>

<script>
// FIREBASE CONFIG (Kept exactly as your original)
const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let board, game = new Chess();
let studentId = "";
let currentStep = 1;
let targetSquare = "e4";

function startLesson() {
    const name = $('#sName').val();
    const cls = $('#sClass').val();
    if(!name || !cls) return alert("Please login first!");
    studentId = name + "_" + cls;

    $('#login-overlay').hide();
    $('#game-area').show();
    
    board = ChessBoard('board', {
        position: 'start',
        draggable: false,
        onMoveEnd: () => { board.highlightSquare(targetSquare) }
    });

    // Highlight e4 for the first test
    setTimeout(() => { 
        $('.square-' + targetSquare).css('background', 'rgba(251, 191, 36, 0.7)');
    }, 500);
}

async function checkAnswer() {
    const answer = $('#userInput').val().trim().toLowerCase();
    const feedback = $('#feedback');

    if (answer === targetSquare) {
        feedback.text("CORRECT! 🎉").css('color', '#4ade80');
        
        // INSTANT GRADING TO DATABASE
        await db.collection("leaderboard").doc(studentId).update({
            rating: firebase.firestore.FieldValue.increment(20),
            notationLevel: currentStep
        });

        nextChallenge();
    } else {
        feedback.text("Not quite! Look at the letter and number.").css('color', '#f87171');
    }
}

function nextChallenge() {
    currentStep++;
    $('#userInput').val("");
    
    if (currentStep === 2) {
        targetSquare = "c6";
        $('#lesson-text').html("<b>Step 2: Distance</b><br>Good! Now try to find the square <b>c6</b>. Type it in below.");
    } else if (currentStep === 3) {
        targetSquare = "nf3";
        $('#lesson-text').html("<b>Step 3: Piece Names</b><br>To record a piece move, use CAPITAL letters. K=King, Q=Queen, R=Rook, B=Bishop, N=Knight. <br><br>How do you write <b>Knight to f3</b>?");
    } else {
        $('#game-area').html("<div class='card'><h2>🏆 LEVEL COMPLETE!</h2><p>You earned 100 points for your notation skills. Check the leaderboard!</p><button class='submit-btn' onclick='location.reload()'>BACK TO HOME</button></div>");
    }

    // Reset board highlights
    $('.square-55d6d').css('background', ''); 
    setTimeout(() => { 
        $('.square-' + targetSquare.slice(-2)).css('background', 'rgba(251, 191, 36, 0.7)');
    }, 500);
}
</script>
</body>
</html>
