<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iyanuoluwa Trending Hub | Premium Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --accent: #B8860B; 
            --text-main: #111111;
            --bg-light: #ffffff;
            --wa-green: #25D366;
            --gray-light: #f8f8f8;
        }

        * { box-sizing: border-box; transition: all 0.2s ease-in-out; }
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            color: var(--text-main);
            padding-top: 190px; /* Adjusted for search bar height */
        }

        /* --- Header Structure --- */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--bg-light);
            z-index: 2000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.03);
        }

        .promo-banner {
            background: var(--text-main);
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
        }

        .logo-container { text-align: center; flex-grow: 1; }
        .logo-main {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 900;
            margin: 0;
            color: var(--text-main);
            letter-spacing: -1px;
            line-height: 1;
        }
        .logo-sub {
            color: var(--accent);
            text-transform: uppercase;
            font-size: 9px;
            letter-spacing: 6px;
            font-weight: 800;
            display: block;
            margin-top: 4px;
        }

        /* Search Bar Styles */
        .search-container {
            padding: 0 25px 15px;
            display: flex;
            justify-content: center;
        }
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
        }
        .search-input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border: 1px solid #eee;
            border-radius: 30px;
            background: var(--gray-light);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
        }
        .search-input:focus { border-color: var(--accent); background: #fff; }
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        .cart-icon-wrapper {
            position: relative;
            cursor: pointer;
            font-size: 22px;
        }
        .cart-badge {
            position: absolute;
            top: -8px; right: -10px;
            background: var(--accent);
            color: white;
            font-size: 10px;
            font-weight: 800;
            width: 20px; height: 20px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid white;
        }

        .nav-scroll {
            display: flex;
            gap: 25px;
            padding: 12px 20px;
            overflow-x: auto;
            white-space: nowrap;
            background: white;
            justify-content: center;
            border-top: 1px solid #f9f9f9;
        }
        .nav-scroll::-webkit-scrollbar { display: none; }
        .nav-link {
            color: #999;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1.5px;
            padding-bottom: 4px;
        }
        .nav-link.active { color: var(--text-main); border-bottom: 2px solid var(--accent); }

        /* --- Grid --- */
        .main-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: #fff;
            border: 1px solid #f0f0f0;
            overflow: hidden;
        }
        .image-box { width: 100%; height: 380px; position: relative; overflow: hidden; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .price-label {
            position: absolute;
            top: 15px; left: 15px;
            background: white;
            padding: 6px 12px;
            font-weight: 800;
            font-size: 13px;
        }

        .card-body { padding: 20px; text-align: center; }
        .card-body h3 {
            font-size: 14px;
            margin: 0 0 18px;
            font-family: 'Playfair Display', serif;
        }

        .add-to-cart-btn {
            width: 100%;
            background: var(--text-main);
            color: white;
            border: none;
            padding: 14px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }
        .add-to-cart-btn:hover { background: var(--accent); }

        /* --- Sidebar & Cart --- */
        .cart-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 3000; opacity: 0; visibility: hidden;
        }
        .cart-overlay.active { opacity: 1; visibility: visible; }
        .cart-sidebar {
            position: fixed; top: 0; right: -450px;
            width: 100%; max-width: 400px; height: 100%;
            background: white; z-index: 3001; display: flex; flex-direction: column;
        }
        .cart-sidebar.active { right: 0; }
        .cart-header { padding: 25px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; }
        .cart-items { flex-grow: 1; padding: 25px; overflow-y: auto; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #f5f5f5; padding-bottom: 15px; }
        .cart-footer { padding: 25px; border-top: 1px solid #f0f0f0; }
        .checkout-btn { width: 100%; background: var(--wa-green); color: white; border: none; padding: 18px; font-weight: 800; border-radius: 4px; cursor: pointer; display: flex; justify-content: center; gap: 10px; }

        .toast {
            position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%);
            background: var(--text-main); color: white; padding: 12px 30px;
            border-radius: 40px; font-size: 12px; z-index: 4000;
        }
        .toast.show { bottom: 40px; }

        @media (max-width: 600px) {
            body { padding-top: 180px; }
            .main-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .image-box { height: 260px; }
            .logo-main { font-size: 1.8rem; }
            .nav-scroll { justify-content: flex-start; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="promo-banner">WORLDWIDE SHIPPING • QUALITY GUARANTEED • SHOP LUXURY</div>
    <div class="brand-header">
        <div style="width: 30px;"></div>
        <div class="logo-container">
            <h1 class="logo-main">Iyanuoluwa</h1>
            <span class="logo-sub">Trending Hub</span>
        </div>
        <div class="cart-icon-wrapper" onclick="toggleCart()">
            <i class="fas fa-shopping-bag"></i>
            <span class="cart-badge" id="cartCount">0</span>
        </div>
    </div>
    
    <div class="search-container">
        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="Search products, fabrics, perfumes..." onkeyup="handleSearch()">
            <i class="fas fa-search search-icon"></i>
        </div>
    </div>

    <div class="nav-scroll">
        <div class="nav-link active" id="nav-all" onclick="filterItems('all')">All</div>
        <div class="nav-link" id="nav-roundneck" onclick="filterItems('roundneck')">Tees</div>
        <div class="nav-link" id="nav-nightwear" onclick="filterItems('nightwear')">Nightwear</div>
        <div class="nav-link" id="nav-perfume" onclick="filterItems('perfume')">Parfums</div>
        <div class="nav-link" id="nav-innerwear" onclick="filterItems('innerwear')">Underwear</div>
        <div class="nav-link" id="nav-material" onclick="filterItems('material')">Fabrics</div>
    </div>
</div>

<div class="main-container" id="shopGrid"></div>

<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h2 style="font-family: 'Playfair Display';">Your Bag</h2>
        <i class="fas fa-times close-cart" onclick="toggleCart()" style="cursor:pointer"></i>
    </div>
    <div class="cart-items" id="cartItemsContainer"></div>
    <div class="cart-footer">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-weight:800; font-size:18px;">
            <span>Subtotal</span>
            <span id="cartTotalDisplay">₦0</span>
        </div>
        <button class="checkout-btn" onclick="checkoutViaWhatsApp()">
            <i class="fab fa-whatsapp"></i> Checkout on WhatsApp
        </button>
    </div>
</div>

<div class="toast" id="toastMsg">Added to your bag successfully</div>

<script>
    const waPhone = "2348066112199"; 
    
    const products = [
        { id: 1, name: "Premium Onyx Minimalist Tee", cat: "roundneck", price: 11500, img: "https://images.pexels.com/photos/1656684/pexels-photo-1656684.jpeg?auto=compress&cs=tinysrgb&w=600" },
        { id: 2, name: "Classic Alabaster Designer Tee", cat: "roundneck", price: 12000, img: "https://images.pexels.com/photos/4066290/pexels-photo-4066290.jpeg?auto=compress&cs=tinysrgb&w=600" },
        { id: 3, name: "Imperial Silk Nightgown", cat: "nightwear", price: 18500, img: "https://images.pexels.com/photos/1018911/pexels-photo-1018911.jpeg?auto=compress&cs=tinysrgb&w=600" },
        { id: 4, name: "Luxe Satin Lounge Pajamas", cat: "nightwear", price: 15000, img: "https://images.pexels.com/photos/7205816/pexels-photo-7205816.jpeg?auto=compress&cs=tinysrgb&w=600" },
        { id: 5, name: "Oud Royale Eau De Parfum", cat: "perfume", price: 48000, img: "https://images.pexels.com/photos/1961795/pexels-photo-1961795.jpeg?auto=compress&cs=tinysrgb&w=600" },
        { id: 6, name: "Signature Floral Elixir", cat: "perfume", price: 35000, img: "https://images.pexels.com/photos/965989/pexels-photo-965989.jpeg?auto=compress&cs=tinysrgb&w=600" },
        { id: 7, name: "Designer Cotton Trunks (3-Pack)", cat: "innerwear", price: 9500, img: "https://images.pexels.com/photos/852860/pexels-photo-852860.jpeg?auto=compress&cs=tinysrgb&w=600" },
        { id: 8, name: "Seamless Luxury Inner-Set", cat: "innerwear", price: 8000, img: "https://images.pexels.com/photos/4210860/pexels-photo-4210860.jpeg?auto=compress&cs=tinysrgb&w=600" }
    ];

    const fabricImages = [
        "https://images.pexels.com/photos/459439/pexels-photo-459439.jpeg?auto=compress&cs=tinysrgb&w=600",
        "https://images.pexels.com/photos/2002217/pexels-photo-2002217.jpeg?auto=compress&cs=tinysrgb&w=600",
        "https://images.pexels.com/photos/2986011/pexels-photo-2986011.jpeg?auto=compress&cs=tinysrgb&w=600",
        "https://images.pexels.com/photos/3738088/pexels-photo-3738088.jpeg?auto=compress&cs=tinysrgb&w=600"
    ];

    for(let i=1; i<=8; i++) {
        products.push({ id: 8+i, name: `Executive Senator Fabric Vol. 0${i}`, cat: "material", price: 15000, img: fabricImages[i % 4] });
    }

    let cart = [];
    let currentCategory = 'all';

    function renderShop(items) {
        const grid = document.getElementById('shopGrid');
        if(items.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 50px; color:#999;">No items found matching your search.</div>`;
            return;
        }
        grid.innerHTML = items.map(p => `
            <div class="product-card">
                <div class="image-box">
                    <div class="price-label">₦${p.price.toLocaleString()}</div>
                    <img src="${p.img}" alt="${p.name}">
                </div>
                <div class="card-body">
                    <h3>${p.name}</h3>
                    <button class="add-to-cart-btn" onclick="addToCart(${p.id})">Add To Bag</button>
                </div>
            </div>
        `).join('');
    }

    // Live Search Function
    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = products.filter(p => {
            const matchesQuery = p.name.toLowerCase().includes(query) || p.cat.toLowerCase().includes(query);
            const matchesCategory = currentCategory === 'all' || p.cat === currentCategory;
            return matchesQuery && matchesCategory;
        });
        renderShop(filtered);
    }

    function filterItems(category) {
        currentCategory = category;
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById(`nav-${category}`).classList.add('active');
        handleSearch(); // Runs search + category filter together
    }

    function addToCart(id) {
        const product = products.find(p => p.id === id);
        cart.push(product);
        updateCartUI();
        showToast();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartUI();
    }

    function updateCartUI() {
        document.getElementById('cartCount').innerText = cart.length;
        const container = document.getElementById('cartItemsContainer');
        if (cart.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#bbb; margin-top:60px; font-size:13px;">Your shopping bag is empty.</p>`;
            document.getElementById('cartTotalDisplay').innerText = `₦0`;
            return;
        }
        container.innerHTML = cart.map((item, index) => `
            <div class="cart-item">
                <div style="text-align:left">
                    <h4 style="margin:0; font-size:13px;">${item.name}</h4>
                    <p style="margin:5px 0 0; color:var(--accent); font-weight:700;">₦${item.price.toLocaleString()}</p>
                </div>
                <button class="remove-btn" onclick="removeFromCart(${index})"><i class="fas fa-trash-alt"></i></button>
            </div>
        `).join('');
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        document.getElementById('cartTotalDisplay').innerText = `₦${total.toLocaleString()}`;
    }

    function toggleCart() {
        document.getElementById('cartSidebar').classList.toggle('active');
        document.getElementById('cartOverlay').classList.toggle('active');
    }

    function showToast() {
        const toast = document.getElementById('toastMsg');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function checkoutViaWhatsApp() {
        if (cart.length === 0) return;
        let message = `*IYANUOLUWA TRENDING HUB - ORDER*%0A%0A`;
        let total = 0;
        cart.forEach((item, index) => {
            message += `${index + 1}. ${item.name} (₦${item.price.toLocaleString()})%0A`;
            total += item.price;
        });
        message += `%0A*Total: ₦${total.toLocaleString()}*`;
        window.open(`https://wa.me/${waPhone}?text=${message}`, '_blank');
    }

    renderShop(products);
</script>

</body>
</html>
