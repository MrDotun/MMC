<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iyanuoluwa Trending Hub | Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --accent: #B8860B; /* Luxury Gold */
            --text-main: #1a1a1a;
            --bg-light: #ffffff;
            --wa-green: #25D366;
            --sale-red: #e74c3c;
        }

        * { box-sizing: border-box; transition: all 0.3s ease-in-out; }
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* --- Clean Top Bar --- */
        .top-notice {
            background: var(--text-main);
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- Header --- */
        header {
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            margin: 0;
            letter-spacing: -1px;
        }

        header p {
            color: var(--accent);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 4px;
            margin-top: 10px;
            font-weight: 700;
        }

        /* --- Navigation --- */
        .nav-bar {
            position: sticky;
            top: 0;
            background: white;
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 20px;
            z-index: 1000;
            border-bottom: 1px solid #eee;
            overflow-x: auto;
        }

        .nav-link {
            text-decoration: none;
            color: #666;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--accent);
        }

        /* --- Product Grid --- */
        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            border: 1px solid #f0f0f0;
            position: relative;
            background: #fff;
        }

        .product-card:hover {
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .image-box {
            width: 100%;
            height: 380px;
            overflow: hidden;
            background: #f9f9f9;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .price-label {
            position: absolute;
            top: 15px;
            left: 15px;
            background: white;
            padding: 5px 12px;
            font-weight: 800;
            font-size: 14px;
            border: 1px solid #eee;
            color: var(--text-main);
        }

        .card-body {
            padding: 20px;
            text-align: center;
        }

        .card-body h3 {
            font-size: 15px;
            margin: 0 0 10px;
            font-family: 'Playfair Display', serif;
        }

        .wa-button {
            display: block;
            background: var(--text-main);
            color: white;
            text-decoration: none;
            padding: 12px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
        }

        .wa-button:hover {
            background: var(--accent);
        }

        /* --- Footer --- */
        footer {
            padding: 60px 20px;
            text-align: center;
            border-top: 1px solid #eee;
            margin-top: 50px;
        }

        /* --- Floating WA --- */
        .wa-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--wa-green);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 2000;
        }

        @media (max-width: 768px) {
            .main-container { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
            .image-box { height: 240px; }
            header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="top-notice">Worldwide Shipping • Quality Guaranteed • Shop Luxury</div>

<header>
    <h1>Iyanuoluwa</h1>
    <p>Trending Hub</p>
</header>

<div class="nav-bar">
    <div class="nav-link active" onclick="filterItems('all')">All Pieces</div>
    <div class="nav-link" onclick="filterItems('material')">Fabrics</div>
    <div class="nav-link" onclick="filterItems('roundneck')">Tees</div>
    <div class="nav-link" onclick="filterItems('nightwear')">Nightwear</div>
    <div class="nav-link" onclick="filterItems('perfume')">Parfums</div>
    <div class="nav-link" onclick="filterItems('innerwear')">Underwear</div>
</div>

<div class="main-container" id="shopGrid">
    </div>

<footer>
    <h2 style="font-family: 'Playfair Display', serif;">Iyanuoluwa Trending Hub</h2>
    <p style="font-size: 12px; color: #888;">+234 806 611 2199</p>
</footer>

<a href="https://wa.me/2348066112199" class="wa-float">
    <i class="fab fa-whatsapp"></i>
</a>

<script>
    const waPhone = "2348066112199";
    const grid = document.getElementById('shopGrid');

    // Prices: Jumia Average + 3000
    const products = [
        // ROUND NECKS
        { name: "Gucci Oversized Logo Tee", cat: "roundneck", price: "₦11,500", img: "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=600" },
        { name: "Versace Medusa Head Tee", cat: "roundneck", price: "₦12,000", img: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=600" },
        
        // NIGHTWEAR
        { name: "Designer Silk Pajama Set", cat: "nightwear", price: "₦18,500", img: "https://images.unsplash.com/photo-1598933595496-054776ba0744?w=600" },
        { name: "Luxury Satin Nightrobe", cat: "nightwear", price: "₦14,000", img: "https://images.unsplash.com/photo-1631541909061-70e79ec3d906?w=600" },

        // PERFUME
        { name: "Dior Sauvage Elixir", cat: "perfume", price: "₦48,000", img: "https://images.unsplash.com/photo-1615785023190-84a1236113b2?w=600" },
        { name: "Chanel Coco Mademoiselle", cat: "perfume", price: "₦52,000", img: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=600" },

        // INNERWEAR
        { name: "Gucci Boxer Trunks (Pack of 3)", cat: "innerwear", price: "₦8,500", img: "https://images.unsplash.com/photo-1594932224828-b4b059b6f684?w=600" },
        { name: "Calvin Klein Seamless Set", cat: "innerwear", price: "₦7,500", img: "https://images.unsplash.com/photo-1616150841792-563b7858c42b?w=600" }
    ];

    // Add 50 Materials
    for(let i=1; i<=50; i++) {
        products.push({
            name: `Exquisite Senator Fabric Vol. ${i}`,
            cat: "material",
            price: `₦${(Math.floor(Math.random() * 5000) + 12000).toLocaleString()}`,
            img: `https://images.pexels.com/photos/459439/pexels-photo-459439.jpeg?auto=compress&cs=tinysrgb&w=600&lazy=load`
        });
    }

    function render(items) {
        grid.innerHTML = items.map(p => `
            <div class="product-card">
                <div class="image-box">
                    <div class="price-label">${p.price}</div>
                    <img src="${p.img}" alt="Product">
                </div>
                <div class="card-body">
                    <h3>${p.name}</h3>
                    <a href="https://wa.me/${waPhone}?text=Hello%20Iyanuoluwa,%20I%20want%20to%20buy%20${encodeURIComponent(p.name)}%20for%20${p.price}" class="wa-button">
                        Order on WhatsApp
                    </a>
                </div>
            </div>
        `).join('');
    }

    function filterItems(category) {
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        event.target.classList.add('active');
        if(category === 'all') render(products);
        else render(products.filter(p => p.cat === category));
    }

    // Initial load
    render(products);
</script>

</body>
</html>
