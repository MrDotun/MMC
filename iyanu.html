<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iyanuoluwa Trending Hub | Exquisite Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --gold: #D4AF37;
            --black: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --white: #ffffff;
            --whatsapp: #25D366;
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background-color: var(--black);
            color: var(--white);
            overflow-x: hidden;
        }

        /* --- Animated Gold Loader Line --- */
        .loader-line {
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            position: fixed;
            top: 0;
            z-index: 10001;
            animation: loading 2s infinite linear;
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* --- Hero Section with Zoom Animation --- */
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .hero-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), 
                        url('https://images.unsplash.com/photo-1441984904996-e0b6ba687e12?auto=format&fit=crop&q=80&w=1600');
            background-size: cover;
            background-position: center;
            animation: zoom-fade 20s infinite alternate;
            z-index: -1;
        }

        @keyframes zoom-fade {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin: 0;
            color: var(--gold);
            letter-spacing: 15px;
            animation: fadeInUp 1.5s ease;
        }

        header p {
            letter-spacing: 10px;
            text-transform: uppercase;
            font-weight: 200;
            margin-top: 20px;
            animation: fadeInUp 2s ease;
        }

        /* --- Floating Navigation --- */
        .nav-container {
            position: sticky;
            top: 0;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(15px);
            padding: 20px;
            z-index: 9000;
            display: flex;
            justify-content: center;
            gap: 15px;
            overflow-x: auto;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .filter-link {
            color: #888;
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 15px;
            cursor: pointer;
            transition: 0.4s;
            border: 1px solid transparent;
        }

        .filter-link.active, .filter-link:hover {
            color: var(--gold);
            border: 1px solid var(--gold);
            border-radius: 20px;
        }

        /* --- Exquisite Grid --- */
        .showroom {
            max-width: 1400px;
            margin: 80px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 50px;
            padding: 0 40px;
        }

        .item-card {
            background: var(--glass);
            border-radius: 5px;
            position: relative;
            transition: 0.5s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .item-card:hover {
            transform: translateY(-15px);
            border-color: var(--gold);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .img-wrap {
            height: 480px;
            overflow: hidden;
            position: relative;
        }

        .img-wrap img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .item-card:hover .img-wrap img { transform: scale(1.1); }

        /* --- Price Tag Animation --- */
        .ex-tag {
            position: absolute;
            bottom: 0; left: 0;
            background: var(--gold);
            color: var(--black);
            padding: 10px 25px;
            font-weight: 800;
            font-size: 16px;
            z-index: 2;
        }

        .item-info { padding: 30px; text-align: left; }
        .item-info h3 { font-family: 'Cinzel', serif; font-size: 1.2rem; margin: 0 0 10px; color: var(--white); }
        .item-info span { color: var(--gold); font-size: 9px; letter-spacing: 3px; text-transform: uppercase; }

        .wa-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 25px;
            color: var(--gold);
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .wa-btn i { font-size: 18px; transition: 0.3s; }
        .wa-btn:hover i { transform: translateX(5px); color: var(--whatsapp); }

        /* --- Animations --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wa-float {
            position: fixed;
            bottom: 40px; right: 40px;
            background: var(--whatsapp);
            width: 60px; height: 60px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 30px; z-index: 10000;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        @media (max-width: 768px) {
            .showroom { grid-template-columns: 1fr; padding: 0 20px; }
            .img-wrap { height: 400px; }
        }
    </style>
</head>
<body>

<div class="loader-line"></div>

<header>
    <div class="hero-bg"></div>
    <h1 data-aos="zoom-in">Iyanuoluwa</h1>
    <p data-aos="fade-up" data-aos-delay="500">The Trending Hub</p>
</header>

<div class="nav-container">
    <div class="filter-link active" onclick="filterItems('all')">All Collections</div>
    <div class="filter-link" onclick="filterItems('material')">Fine Fabrics</div>
    <div class="filter-link" onclick="filterItems('roundneck')">Designer Tees</div>
    <div class="filter-link" onclick="filterItems('nightwear')">Nightwear</div>
    <div class="filter-link" onclick="filterItems('perfume')">Parfums</div>
    <div class="filter-link" onclick="filterItems('innerwear')">Luxe Underwear</div>
</div>

<div class="showroom" id="gallery">
    </div>

<footer style="padding: 100px 20px; text-align: center; border-top: 1px solid #111;">
    <div style="font-family: 'Cinzel', serif; color: var(--gold); font-size: 24px;">Iyanuoluwa</div>
    <p style="font-size: 10px; letter-spacing: 5px; opacity: 0.5;">PREMIUM NIGERIAN BOUTIQUE</p>
    <p style="margin-top: 30px;">WhatsApp Orders: +234 806 611 2199</p>
</footer>

<a href="https://wa.me/2348066112199" class="wa-float">
    <i class="fab fa-whatsapp"></i>
</a>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({ duration: 1000, once: true });

    const wa = "2348066112199";
    const gallery = document.getElementById('gallery');

    function getPrice(base) {
        return `₦${(base + 3000).toLocaleString()}`;
    }

    const collection = [];

    // --- GENERATING 50 LUXURY MATERIALS ---
    for(let i=1; i<=50; i++) {
        collection.push({
            name: `Royal Senator Silk Vol. ${i}`,
            cat: 'material',
            price: getPrice(15000),
            img: `https://images.unsplash.com/photo-1584184924103-e310d9dc85fc?q=80&w=600&random=${i}`
        });
    }

    // --- DESIGNER ITEMS ---
    collection.push(
        { name: "Versace Gold Emblem Tee", cat: 'roundneck', price: getPrice(9500), img: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?q=80&w=600" },
        { name: "Gucci Monogram Nightwear", cat: 'nightwear', price: getPrice(22000), img: "https://images.unsplash.com/photo-1598933595496-054776ba0744?q=80&w=600" },
        { name: "Dior Sauvage Elixir", cat: 'perfume', price: getPrice(45000), img: "https://images.unsplash.com/photo-1615785023190-84a1236113b2?q=80&w=600" },
        { name: "Armani Luxe Silk Boxers", cat: 'innerwear', price: getPrice(7500), img: "https://images.unsplash.com/photo-1594932224828-b4b059b6f684?q=80&w=600" }
    );

    function render(list) {
        gallery.innerHTML = list.map((item, index) => `
            <div class="item-card" data-aos="fade-up" data-aos-delay="${(index % 3) * 100}">
                <div class="img-wrap">
                    <div class="ex-tag">${item.price}</div>
                    <img src="${item.img}" alt="Luxury">
                </div>
                <div class="item-info">
                    <span>${item.cat}</span>
                    <h3>${item.name}</h3>
                    <a href="https://wa.me/${wa}?text=Hello%20Iyanuoluwa,%20I%20wish%20to%20order%20the%20${encodeURIComponent(item.name)}" class="wa-btn">
                        ACQUIRE PIECE <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </div>
        `).join('');
    }

    function filterItems(c) {
        document.querySelectorAll('.filter-link').forEach(l => l.classList.remove('active'));
        event.target.classList.add('active');
        if(c === 'all') render(collection);
        else render(collection.filter(x => x.cat === c));
    }

    render(collection);
</script>

</body>
</html>
