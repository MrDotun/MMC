<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iyanuoluwa Trending Hub | Exclusive Flash Sale</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --royal-gold: #B8860B;
            --deep-black: #121212;
            --whatsapp-green: #25D366;
            --tag-bg: #ff4757;
            --sale-accent: #ff9f43;
        }

        * { box-sizing: border-box; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        body { font-family: 'Montserrat', sans-serif; margin: 0; background: #fdfdfd; color: var(--deep-black); padding-top: 100px; /* Space for fixed banner */ }

        /* --- Stylish Fixed Sale Banner --- */
        .sale-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 100px;
            background: linear-gradient(135deg, var(--deep-black) 0%, #333 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            z-index: 9999;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            border-bottom: 2px solid var(--gold);
        }

        .sale-banner h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin: 0; color: var(--gold); }
        .sale-banner .discount { font-size: 1.5rem; font-weight: 800; color: var(--sale-accent); animation: blink 1.5s infinite; }
        .sale-banner .sig { font-family: 'Playfair Display', serif; font-style: italic; color: #777; font-size: 0.8rem; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* --- Luxury Header --- */
        header {
            background: var(--deep-black);
            color: white;
            padding: 100px 20px 60px 20px;
            text-align: center;
            border-bottom: 5px solid var(--royal-gold);
            position: relative;
        }

        header h1 { font-family: 'Playfair Display', serif; font-size: 3.2rem; margin: 0; color: var(--royal-gold); letter-spacing: -1px; }
        header p { text-transform: uppercase; font-size: 0.85rem; letter-spacing: 5px; margin-top: 15px; font-weight: 300; }

        /* --- Premium Navigation --- */
        .nav-bar {
            position: sticky;
            top: 100px; /* Sticks just below sale banner */
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            overflow-x: auto;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .filter-btn {
            border: 2px solid #eee;
            background: white;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .filter-btn.active { background: var(--deep-black); color: var(--royal-gold); border-color: var(--deep-black); }
        .filter-btn.sale-tab { border-color: var(--tag-bg); color: var(--tag-bg); }
        .filter-btn.sale-tab.active { background: var(--tag-bg); color: white; }

        /* --- Product Showroom --- */
        .showroom {
            max-width: 1400px;
            margin: 50px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 0 25px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: relative;
        }

        .product-card:hover { transform: scale(1.03); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }

        .img-container { width: 100%; height: 350px; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        /* --- The Price Tag --- */
        .price-tag {
            position: absolute;
            bottom: 20px;
            left: -10px;
            background: var(--tag-bg);
            color: white;
            padding: 8px 20px;
            font-weight: 800;
            font-size: 1.1rem;
            transform: skewX(-15deg);
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .product-card.on-sale .price-tag { background: var(--sale-accent); }

        .product-meta { padding: 25px; text-align: center; }
        .product-meta h3 { font-size: 16px; margin: 0 0 15px; font-weight: 700; color: #333; height: 40px; }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--whatsapp-green);
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
        }

        .btn-whatsapp:hover { background: #1eb954; }

        /* --- Footer --- */
        footer { background: var(--deep-black); color: #777; padding: 80px 20px; text-align: center; }
        footer b { color: var(--royal-gold); display: block; margin-bottom: 10px; font-size: 1.2rem; }

        .float-wa {
            position: fixed;
            bottom: 40px; right: 40px;
            background: var(--whatsapp-green);
            width: 70px; height: 70px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 35px; box-shadow: 0 10px 30px rgba(37, 211, 102, 0.4); z-index: 9999;
        }

        @media (max-width: 768px) {
            body { padding-top: 80px; }
            .sale-banner { height: 80px; padding: 0 20px; }
            .sale-banner h2 { font-size: 1.2rem; }
            .sale-banner .discount { font-size: 1.1rem; }
            header h1 { font-size: 2.2rem; }
            .nav-bar { top: 80px; }
            .showroom { grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
            .img-container { height: 220px; }
            .price-tag { font-size: 0.9rem; padding: 5px 12px; }
        }
    </style>
</head>
<body>

<div class="sale-banner">
    <div>
        <h2>WEEKEND FLASH SALE</h2>
        <p class="sig">Curated by Iyanuoluwa</p>
    </div>
    <div class="discount">UP TO 50% OFF</div>
</div>

<header>
    <h1>Iyanuoluwa Trending Hub</h1>
    <p>Exclusive Fashion • Premium Fabrics • Essential Luxury</p>
</header>

<div class="nav-bar">
    <button class="filter-btn sale-tab active" onclick="filterData('sale')"><i class="fas fa-fire"></i> Hot Deals</button>
    <button class="filter-btn" onclick="filterData('all')">Shop All</button>
    <button class="filter-btn" onclick="filterData('material')">Fabrics (50+)</button>
    <button class="filter-btn" onclick="filterData('roundneck')">Round Necks</button>
    <button class="filter-btn" onclick="filterData('nightwear')">Night Wears</button>
    <button class="filter-btn" onclick="filterData('perfume')">Fragrances</button>
    <button class="filter-btn" onclick="filterData('innerwear')">Underwear</button>
</div>

<div class="showroom" id="display">
    </div>

<footer>
    <b>Iyanuoluwa Trending Hub</b>
    <p>Nationwide Delivery via GIGL & Peace Mass</p>
    <p>WhatsApp: +234 806 611 2199</p>
</footer>

<a href="https://wa.me/2348066112199" class="float-wa">
    <i class="fab fa-whatsapp"></i>
</a>

<script>
    const whatsappLink = "2348066112199";
    const container = document.getElementById('display');

    // Standard Price: Jumia + 3000
    // Sale Price: Jumia + 1500 (Half profit but fast turnover)
    function calculatePrice(jumiaBase, onSale = false) {
        let final = onSale ? (jumiaBase + 1500) : (jumiaBase + 3000);
        return `₦${final.toLocaleString()}`;
    }

    const items = [];

    // --- 50 MATERIALS ---
    for(let i=1; i<=50; i++) {
        let base = Math.floor(Math.random() * 8000) + 7000;
        let isSale = (i <= 5); // Make first 5 items Sale items
        items.push({
            name: `Luxury Fabric Collection - Vol. ${i}`,
            cat: 'material',
            price: calculatePrice(base, isSale),
            img: `https://picsum.photos/500/700?random=${i}`,
            onSale: isSale
        });
    }

    // --- OTHER CATEGORIES ---
    items.push(
        { name: "Unisex Premium Cotton Tee", cat: 'roundneck', price: calculatePrice(4500), img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500", onSale: false },
        { name: "Silk Satin Sleepwear", cat: 'nightwear', price: calculatePrice(9500), img: "https://images.unsplash.com/photo-1631541909061-70e79ec3d906?w=500", onSale: false },
        { name: "Oud Royale EDP 100ml", cat: 'perfume', price: calculatePrice(15000), img: "https://images.unsplash.com/photo-1541643600914-78b084683601?w=500", onSale: false },
        { name: "Pack of 6 Designer Boxers", cat: 'innerwear', price: calculatePrice(5500, true), img: "https://images.unsplash.com/photo-1594932224828-b4b059b6f684?w=500", onSale: true }
    );

    function render(list) {
        container.innerHTML = list.map(item => `
            <div class="product-card ${item.onSale ? 'on-sale' : ''}">
                <div class="img-container">
                    <img src="${item.img}" alt="Stock">
                    <div class="price-tag">${item.price} ${item.onSale ? '<i class="fas fa-tag"></i>' : ''}</div>
                </div>
                <div class="product-meta">
                    <h3>${item.name}</h3>
                    <a href="https://wa.me/${whatsappLink}?text=Hello%20Iyanuoluwa,%20I%20want%20to%20order%20${encodeURIComponent(item.name)}%20at%20${item.price}%20(FlashSaleDeal)" class="btn-whatsapp">
                        <i class="fab fa-whatsapp"></i> ORDER ON WHATSAPP
                    </a>
                </div>
            </div>
        `).join('');
    }

    function filterData(category) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        if(category === 'all') {
            render(items);
        } else if (category === 'sale') {
            render(items.filter(x => x.onSale));
        } else {
            render(items.filter(x => x.cat === category));
        }
    }

    // Load Flash Sale items first
    render(items.filter(x => x.onSale));
</script>

</body>
</html>
