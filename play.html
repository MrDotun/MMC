<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigerian Masters - Game Analysis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --light-sq: #ebecd0; --dark-sq: #779556;
            --highlight-select: rgba(255, 255, 0, 0.5); --highlight-last: rgba(255, 255, 0, 0.3);
            --bg-color: #312e2b; --coord-light: #779556; --coord-dark: #ebecd0;
        }
        body {
            font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: white;
            margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;
        }
        #app-container { width: 100%; max-width: 500px; height: 100vh; display: flex; flex-direction: column; padding: 10px; box-sizing: border-box; }
        .screen { display: none; flex-direction: column; align-items: center; height: 100%; width: 100%; }
        .active-screen { display: flex; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: #403d39; }
        th, td { padding: 8px; border: 1px solid #555; text-align: left; }
        button { background-color: #81b64c; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px 0; }
        .timer { background: #262421; padding: 5px 10px; border-radius: 4px; font-family: monospace; font-size: 18px; color: #ffca28; }
        .player-info { display: flex; justify-content: space-between; width: 100%; align-items: center; margin: 5px 0; }
        #board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; aspect-ratio: 1/1; border: 2px solid #222; }
        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        .light { background-color: var(--light-sq); } .dark { background-color: var(--dark-sq); }
        .selected::after { content: ''; position: absolute; inset: 0; background: var(--highlight-select); }
        .last-move::after { content: ''; position: absolute; inset: 0; background: var(--highlight-last); }
        .square img { width: 90%; z-index: 2; }
        #history-log { width: 100%; height: 60px; background: #262421; margin-top: 5px; padding: 8px; font-size: 13px; overflow-y: auto; color: #aaa; line-height: 1.4; border-radius: 4px; }
        .save-box { background: #444; padding: 10px; border-radius: 5px; width: 80%; margin: 10px 0; text-align: center; }
        #thinking-indicator { color: #81b64c; font-style: italic; font-size: 14px; visibility: hidden; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="intro-screen" class="screen active-screen">
        <h1>Nigerian Masters Blitz</h1>
        <div style="overflow-y:auto; flex-grow:1; width:100%;">
            <table id="intro-table"><thead><tr><th>Rank</th><th>Player</th><th>Rating</th></tr></thead><tbody id="intro-tbody"></tbody></table>
        </div>
        <div class="save-box">
            <input type="text" id="kid-name" placeholder="Your Name..." style="padding:8px; width:90%; margin-bottom:5px;"/>
            <input type="text" id="save-code-input" placeholder="Enter a Secret Code to Save/Resume" style="padding:8px; width:90%;"/>
            <div style="display:flex; gap:5px; justify-content:center; margin-top:5px;">
                <button onclick="enrollKid()">New Entry</button>
                <button onclick="resumeTournament()" style="background:#2196F3;">Resume</button>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <h3 id="round-indicator">Round 1</h3>
        <div class="player-info">
            <div>
                <span id="opp-name">Opponent</span>
                <span id="thinking-indicator"> - Thinking...</span>
            </div>
            <div id="timer-opp" class="timer">05:00</div>
        </div>
        <div id="board-container" style="position:relative; width:100%;">
            <div id="board"></div>
        </div>
        <div class="player-info">
            <span id="user-name">You</span>
            <div id="timer-user" class="timer">05:00</div>
        </div>
        <div id="history-log"></div>
        <div id="in-game-buttons">
            <button onclick="resignGame()" style="background:#e64a19;">Resign</button>
            <button onclick="exitToMenu()" style="background:#795548;">Save & Exit</button>
        </div>
        <button id="end-game-btn" style="display:none;" onclick="showRankings()">Standings</button>
    </div>

    <div id="rankings-screen" class="screen">
        <h2>Standings</h2>
        <div style="overflow-y:auto; flex-grow:1; width:100%;">
            <table><thead><tr><th>Pos</th><th>Player</th><th>Pts</th><th>Rating</th></tr></thead><tbody id="ranking-tbody"></tbody></table>
        </div>
        <button onclick="startNextRound()">Next Round</button>
    </div>
</div>

<script>
    // STOCKFISH INTEGRATION
    const stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
    stockfish.onmessage = (e) => {
        if (e.data.includes('bestmove')) {
            const moveStr = e.data.split(' ')[1];
            const from = moveStr.substring(0, 2);
            const to = moveStr.substring(2, 4);
            const promotion = moveStr.substring(4, 5) || 'q';
            
            lastMove = game.move({ from, to, promotion });
            document.getElementById('thinking-indicator').style.visibility = 'hidden';
            drawBoard();
            if (game.game_over()) checkEnd();
        }
    };
    stockfish.postMessage('uci');
    stockfish.postMessage('setoption name Skill Level value 20'); // Level 20 = Grandmaster

    const mastersData = [
        { name: "IM Odion Aikhoje", rating: 2351, pts: 0 }, { name: "FM Adebayo Adegboyega", rating: 2312, pts: 0 },
        { name: "FM Bomo Kigigha", rating: 2334, pts: 0 }, { name: "IM Adu Oladapo", rating: 2321, pts: 0 },
        { name: "IM Bunmi Olape", rating: 2306, pts: 0 }, { name: "FM Akinseye Abiola", rating: 2252, pts: 0 },
        { name: "IM Oluwafemi Balogun", rating: 2291, pts: 0 }, { name: "IM Anwuli Daniel", rating: 2365, pts: 0 }
    ];

    let players = [], kidPlayer = { name: "", rating: 2000, pts: 0, isKid: true }, currentRound = 1;
    let game, userColor, currentOpponent, intervalId, timerW = 300, timerB = 300, selectedSquare = null, lastMove = null;

    const pieces = {
        p: 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg', n: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        b: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg', r: 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        q: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg', k: 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
        P: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg', N: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        B: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg', R: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        Q: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg', K: 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };

    window.onload = () => {
        const tb = document.getElementById("intro-tbody");
        mastersData.forEach((p, i) => tb.innerHTML += `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.rating}</td></tr>`);
    };

    function enrollKid() { kidPlayer.name = document.getElementById("kid-name").value || "Player"; players = [...mastersData, kidPlayer]; startNextRound(); }

    function startNextRound() {
        if (currentRound > 7) return alert("Tournament Over");
        userColor = Math.random() < 0.5 ? 'w' : 'b';
        currentOpponent = mastersData[Math.floor(Math.random()*mastersData.length)];
        game = new Chess(); timerW = timerB = 300;
        document.getElementById("opp-name").innerText = `${currentOpponent.name} [${currentOpponent.rating}]`;
        document.getElementById("user-name").innerText = `${kidPlayer.name} [${kidPlayer.rating}]`;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('game-screen').classList.add('active-screen');
        drawBoard(); startTimer();
        if (game.turn() !== userColor) makeAIMove();
    }

    function drawBoard() {
        const b = document.getElementById("board"); b.innerHTML = "";
        const boardState = game.board();
        for (let i = 0; i < 64; i++) {
            let r = Math.floor(i / 8), c = i % 8;
            if (userColor === 'b') { r = 7 - r; c = 7 - c; }
            const sq = String.fromCharCode(97+c) + (8-r);
            const el = document.createElement("div");
            el.className = `square ${(r+c)%2===0?'light':'dark'}`;
            if (selectedSquare === sq) el.classList.add("selected");
            if (lastMove && (lastMove.from === sq || lastMove.to === sq)) el.classList.add("last-move");
            const p = boardState[r][c];
            if (p) { const img = document.createElement("img"); img.src = pieces[p.color==='w'?p.type.toUpperCase():p.type]; el.appendChild(img); }
            el.onclick = () => handleSquareClick(sq);
            b.appendChild(el);
        }
        updateHistory();
    }

    function handleSquareClick(sq) {
        if (game.turn() !== userColor || game.game_over()) return;
        if (selectedSquare === sq) selectedSquare = null;
        else if (selectedSquare) {
            const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
            if (move) { selectedSquare = null; lastMove = move; drawBoard(); if (!game.game_over()) makeAIMove(); else checkEnd(); }
            else selectedSquare = sq;
        } else selectedSquare = sq;
        drawBoard();
    }

    function makeAIMove() {
        if (game.game_over()) return;
        document.getElementById('thinking-indicator').style.visibility = 'visible';
        stockfish.postMessage(`position fen ${game.fen()}`);
        stockfish.postMessage('go movetime 1000'); // 1 second think time
    }

    function startTimer() {
        clearInterval(intervalId);
        intervalId = setInterval(() => {
            if (game.turn() === 'w') timerW--; else timerB--;
            const format = (t) => `${Math.floor(t/60)}:${(t%60).toString().padStart(2,'0')}`;
            document.getElementById("timer-user").innerText = userColor==='w'?format(timerW):format(timerB);
            document.getElementById("timer-opp").innerText = userColor==='w'?format(timerB):format(timerW);
            if (timerW<=0 || timerB<=0) checkEnd();
        }, 1000);
    }

    function checkEnd() {
        clearInterval(intervalId);
        let result = (game.turn() !== userColor) ? "win" : "loss";
        if (result === "win") { kidPlayer.pts += 1; kidPlayer.rating += 25; } 
        else { currentOpponent.pts += 1; kidPlayer.rating -= 15; }
        document.getElementById("end-game-btn").style.display = "block";
    }

    function showRankings() {
        players.sort((a,b) => b.pts - a.pts);
        const tb = document.getElementById("ranking-tbody"); tb.innerHTML = "";
        players.forEach((p, i) => { tb.innerHTML += `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.pts}</td><td>${p.rating}</td></tr>`; });
        currentRound++;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('rankings-screen').classList.add('active-screen');
        document.getElementById("end-game-btn").style.display = "none";
    }

    function updateHistory() {
        const logEl = document.getElementById("history-log");
        logEl.innerText = game.history().join(" ") || "Game started...";
    }
    
    function resignGame() { checkEnd(); }
    function exitToMenu() { location.reload(); }
</script>
</body>
</html>
