<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Masters | Mind Masters Academy</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --light-sq: #ebecd0; --dark-sq: #779556;
            --highlight-select: rgba(255, 255, 0, 0.5); --highlight-last: rgba(255, 255, 0, 0.3);
            --bg-color: #1a1a2e; --panel-bg: #2D1B4D; --accent: #4ade80; --card-bg: #3B2667;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #app-container { width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; background: var(--panel-bg); border: 2px solid var(--accent); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .header-title { text-align: center; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; font-size: 20px; }
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; }
        .active-screen { display: flex; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; background: var(--card-bg); border-radius: 10px; overflow: hidden; }
        th, td { padding: 10px; border-bottom: 1px solid #5b3fa1; text-align: left; font-size: 13px; }
        th { background: rgba(74, 222, 128, 0.1); color: var(--accent); }
        button { background-color: var(--accent); color: #1a1a2e; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px 0; width: 100%; transition: 0.3s; }
        .timer { background: #1a1a2e; padding: 8px 15px; border-radius: 8px; font-family: monospace; font-size: 20px; color: #ffca28; border: 1px solid #444; }
        .player-info { display: flex; justify-content: space-between; width: 100%; align-items: center; margin: 10px 0; }
        #board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1/1; border: 4px solid #111; border-radius: 5px; overflow: hidden; }
        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        .light { background-color: var(--light-sq); } .dark { background-color: var(--dark-sq); }
        .selected::after { content: ''; position: absolute; inset: 0; background: var(--highlight-select); }
        .last-move::after { content: ''; position: absolute; inset: 0; background: var(--highlight-last); }
        .square img { width: 90%; z-index: 2; }
        .bulletin { background: #1a1a2e; border: 1px solid var(--accent); border-radius: 10px; width: 100%; padding: 10px; box-sizing: border-box; margin-bottom: 15px; max-height: 110px; overflow-y: auto; }
        .bulletin h4 { margin: 0 0 5px 0; color: var(--accent); font-size: 14px; text-align: center; }
        .bulletin-item { font-size: 11px; border-bottom: 1px solid #333; padding: 4px 0; display: flex; justify-content: space-between; }
        .rating-change { font-size: 10px; font-weight: bold; margin-left: 4px; }
        .up { color: #4ade80; } .down { color: #f87171; }
    </style>
</head>
<body>

<div id="app-container">
    <div class="header-title">Nigerian Masters Blitz</div>

    <div id="intro-screen" class="screen active-screen">
        <div style="overflow-y:auto; flex-grow:1; width:100%; max-height: 250px;">
            <table id="intro-table"><thead><tr><th>Rank</th><th>Master</th><th>Rating</th></tr></thead><tbody id="intro-tbody"></tbody></table>
        </div>
        <div class="save-box">
            <input type="text" id="kid-name" placeholder="Enter Your Name..."/>
            <button onclick="enrollKid()">Start Tournament</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="player-info">
            <div style="font-weight: bold;"><span id="opp-name">Opponent</span> <span id="opp-rating" style="font-size:11px; color:#ccc;"></span> <span id="thinking-indicator">...</span></div>
            <div id="timer-opp" class="timer">05:00</div>
        </div>
        <div id="board"></div>
        <div class="player-info">
            <div style="font-weight: bold;"><span id="user-name">You</span> <span id="user-rating" style="font-size:11px; color:#ccc;"></span></div>
            <div id="timer-user" class="timer">05:00</div>
        </div>
        <div id="history-log" style="font-size: 12px; color: #b794f4; height: 30px; overflow: hidden;"></div>
        <button id="end-game-btn" style="display:none;" onclick="showRankings()">View Standings</button>
    </div>

    <div id="rankings-screen" class="screen">
        <h3 style="color: var(--accent); margin: 5px 0;">Round <span id="round-num">1</span> Results</h3>
        <div class="bulletin">
            <h4>Round Results</h4>
            <div id="bulletin-list"></div>
        </div>
        <table style="width:100%;"><thead><tr><th>Pos</th><th>Player</th><th>Rating</th><th>Pts</th></tr></thead><tbody id="ranking-tbody"></tbody></table>
        <button onclick="startNextRound()">Start Next Round</button>
    </div>
</div>

<script>
    const mastersData = [
        { name: "IM Odion Aikhoje", rating: 2351, pts: 0, lastChange: 0 }, { name: "FM Adebayo Adegboyega", rating: 2312, pts: 0, lastChange: 0 },
        { name: "FM Bomo Kigigha", rating: 2334, pts: 0, lastChange: 0 }, { name: "IM Adu Oladapo", rating: 2321, pts: 0, lastChange: 0 },
        { name: "IM Bunmi Olape", rating: 2306, pts: 0, lastChange: 0 }, { name: "FM Akinseye Abiola", rating: 2252, pts: 0, lastChange: 0 },
        { name: "IM Oluwafemi Balogun", rating: 2291, pts: 0, lastChange: 0 }, { name: "IM Anwuli Daniel", rating: 2365, pts: 0, lastChange: 0 }
    ];

    let players = [], kidPlayer = { name: "", rating: 1200, pts: 0, isKid: true, lastChange: 0 }, currentRound = 1;
    let game, userColor, currentOpponent, intervalId, timerW, timerB, selectedSquare, lastMove, roundResults = [];

    const pieces = {
        p: 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg', n: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        b: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg', r: 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        q: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg', k: 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
        P: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg', N: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        B: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg', R: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        Q: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg', K: 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };

    window.onload = () => {
        const tb = document.getElementById("intro-tbody");
        mastersData.sort((a,b) => b.rating - a.rating).forEach((p, i) => tb.innerHTML += `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.rating}</td></tr>`);
    };

    function enrollKid() {
        kidPlayer.name = document.getElementById("kid-name").value || "Player";
        players = [kidPlayer, ...mastersData];
        startNextRound();
    }

    function startNextRound() {
        if (currentRound > 7) return alert("Tournament Over!");
        userColor = Math.random() < 0.5 ? 'w' : 'b';
        currentOpponent = mastersData[(currentRound - 1) % mastersData.length];
        game = new Chess(); timerW = timerB = 300;
        lastMove = null; selectedSquare = null;
        
        document.getElementById("opp-name").innerText = currentOpponent.name;
        document.getElementById("opp-rating").innerText = currentOpponent.rating;
        document.getElementById("user-name").innerText = kidPlayer.name;
        document.getElementById("user-rating").innerText = kidPlayer.rating;
        document.getElementById("end-game-btn").style.display = "none";
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('game-screen').classList.add('active-screen');
        drawBoard(); startTimer();
        if (game.turn() !== userColor) makeAIMove();
    }

    function checkEnd() {
        clearInterval(intervalId);
        let kidRes = 0.5;
        if (game.in_checkmate()) kidRes = (game.turn() === userColor) ? 0 : 1;
        
        // Rating Math
        const expected = 1 / (1 + Math.pow(10, (currentOpponent.rating - kidPlayer.rating) / 400));
        const change = Math.round(32 * (kidRes - expected));
        
        kidPlayer.lastChange = change;
        kidPlayer.rating += change;
        kidPlayer.pts += kidRes;

        currentOpponent.lastChange = -change;
        currentOpponent.rating -= change;
        currentOpponent.pts += (1 - kidRes);

        roundResults = [`${kidPlayer.name} ${kidRes}-${1-kidRes} ${currentOpponent.name}`];

        // Simulate Others & Random Rating Fluctuation
        let idle = mastersData.filter(m => m !== currentOpponent);
        for(let i=0; i < idle.length; i+=2) {
            if(idle[i+1]) {
                let r = Math.random(), res = r > 0.6 ? "1-0" : (r > 0.3 ? "0-1" : "½-½");
                let ratC = Math.floor(Math.random() * 15) - 7;
                idle[i].pts += (res === "1-0" ? 1 : (res === "½-½" ? 0.5 : 0));
                idle[i+1].pts += (res === "0-1" ? 1 : (res === "½-½" ? 0.5 : 0));
                idle[i].lastChange = ratC; idle[i+1].lastChange = -ratC;
                idle[i].rating += ratC; idle[i+1].rating -= ratC;
                roundResults.push(`${idle[i].name} ${res} ${idle_i+1 ? idle[i+1].name : 'BYE'}`);
            }
        }
        document.getElementById("end-game-btn").style.display = "block";
    }

    function showRankings() {
        document.getElementById("round-num").innerText = currentRound;
        document.getElementById("bulletin-list").innerHTML = roundResults.map(r => `<div class="bulletin-item">${r}</div>`).join("");
        currentRound++;
        const tbody = document.getElementById("ranking-tbody");
        tbody.innerHTML = "";
        players.sort((a,b) => b.pts - a.pts || b.rating - a.rating).forEach((p, i) => {
            let arrow = p.lastChange > 0 ? `<span class="rating-change up">▲${p.lastChange}</span>` : 
                        (p.lastChange < 0 ? `<span class="rating-change down">▼${Math.abs(p.lastChange)}</span>` : '');
            tbody.innerHTML += `<tr><td>${i+1}</td><td>${p.name} ${p.isKid?'⭐':''}</td><td>${p.rating}${arrow}</td><td>${p.pts}</td></tr>`;
        });
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('rankings-screen').classList.add('active-screen');
    }

    function makeAIMove() {
        document.getElementById('thinking-indicator').style.visibility = 'visible';
        setTimeout(() => {
            const moves = game.moves({ verbose: true });
            if (moves.length === 0) return;
            const pVal = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };
            const scored = moves.map(m => {
                let s = Math.random() * 2;
                if (m.san.includes('#')) return { move: m, score: 10000 };
                if (m.captured) s += pVal[m.captured] * 20;
                if (m.flags.includes('k') || m.flags.includes('q')) s += 80;
                game.move(m);
                if (game.moves({ verbose: true }).find(o => o.to === m.to)) s -= (pVal[m.piece] * 25);
                game.undo();
                return { move: m, score: s };
            }).sort((a,b) => b.score - a.score);
            lastMove = game.move(scored[0].move);
            document.getElementById('thinking-indicator').style.visibility = 'hidden';
            drawBoard();
            if (game.game_over()) checkEnd();
        }, 200);
    }

    function drawBoard() {
        const b = document.getElementById("board"); b.innerHTML = "";
        const boardState = game.board();
        for (let i = 0; i < 64; i++) {
            let r = Math.floor(i/8), c = i%8;
            if (userColor === 'b') { r = 7-r; c = 7-c; }
            const sq = String.fromCharCode(97+c) + (8-r);
            const el = document.createElement("div");
            el.className = `square ${(r+c)%2===0?'light':'dark'}`;
            if (selectedSquare === sq) el.classList.add("selected");
            if (lastMove && (lastMove.from === sq || lastMove.to === sq)) el.classList.add("last-move");
            const p = boardState[r][c];
            if (p) { const img = document.createElement("img"); img.src = pieces[p.color==='w'?p.type.toUpperCase():p.type]; el.appendChild(img); }
            el.onclick = () => handleSquareClick(sq);
            b.appendChild(el);
        }
        document.getElementById("history-log").innerText = game.history().join(" ");
    }

    function handleSquareClick(sq) {
        if (game.turn() !== userColor) return;
        if (selectedSquare === sq) selectedSquare = null;
        else if (selectedSquare) {
            const m = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
            if (m) { selectedSquare = null; lastMove = m; drawBoard(); if (!game.game_over()) makeAIMove(); else checkEnd(); }
            else selectedSquare = sq;
        } else selectedSquare = sq;
        drawBoard();
    }

    function startTimer() {
        clearInterval(intervalId);
        intervalId = setInterval(() => {
            if (game.turn() === 'w') timerW--; else timerB--;
            const curW = `${Math.floor(timerW/60)}:${(timerW%60).toString().padStart(2,'0')}`;
            const curB = `${Math.floor(timerB/60)}:${(timerB%60).toString().padStart(2,'0')}`;
            document.getElementById("timer-user").innerText = userColor==='w'?curW:curB;
            document.getElementById("timer-opp").innerText = userColor==='w'?curB:curW;
            if (timerW<=0 || timerB<=0) checkEnd();
        }, 1000);
    }
</script>
</body>
</html>
