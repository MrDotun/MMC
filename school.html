<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MASTER CODE - STRATEGIC SPEED LAB</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <style>
        :root {
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --highlight: rgba(255, 235, 59, 0.7);
            --correct: rgba(76, 175, 80, 0.6);
            --accent: #f1c40f;
            --lab-blue: #00d2ff;
            --terminal-green: #00ff41;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle, #1a2a6c, #101010);
            color: white;
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .screen { 
            display: none; 
            width: 100%; 
            max-width: 500px; 
            padding: 10px; 
            box-sizing: border-box; 
            text-align: center; 
            height: 100%; 
            flex-direction: column;
            justify-content: flex-start; /* Keeps stats at the top */
        }
        
        .active-screen { display: flex; }

        .welcome-card { 
            background: rgba(10, 10, 10, 0.95); 
            padding: 20px; 
            border-radius: 20px; 
            border: 2px solid var(--lab-blue);
            margin-top: auto;
            margin-bottom: auto;
        }
        
        h1.big-title { font-size: 1.8rem; color: var(--lab-blue); margin-bottom: 15px; }
        
        .input-label { 
            display: block; 
            text-align: left; 
            margin: 10px 0 5px 5%; 
            font-weight: bold; 
            color: var(--lab-blue);
            font-size: 1.1rem; 
        }

        input { 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--lab-blue); 
            width: 90%; 
            margin-bottom: 10px; 
            font-size: 1.2rem; 
            background: #111; 
            color: white; 
            text-align: center;
        }

        .hint-text {
            font-size: 0.9rem;
            color: #ffeb3b;
            margin-bottom: 15px;
            display: block;
        }

        .btn-main { 
            background: var(--lab-blue); 
            color: #000; 
            padding: 15px; 
            border: none; 
            border-radius: 10px; 
            font-size: 1.3rem; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
        }

        .leaderboard { 
            margin-top: 15px; 
            background: rgba(0,0,0,0.8); 
            padding: 10px; 
            border-radius: 12px; 
            border: 1px solid var(--terminal-green);
            max-height: 150px;
            overflow-y: auto;
        }
        .lb-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .lb-table th { color: var(--terminal-green); padding: 5px; }

        /* FIX: Using vmin prevents compression and maintains aspect ratio */
        .board { 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            grid-template-rows: repeat(8, 1fr);
            width: 90vmin; 
            height: 90vmin; 
            max-width: 450px; 
            max-height: 450px; 
            border: 4px solid #333; 
            margin: 5px auto;
            flex-shrink: 0; /* Prevents the board from squashing when other elements grow */
        }

        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .square img { width: 85%; height: 85%; object-fit: contain; pointer-events: none; }
        .square.light { background-color: var(--light-sq); }
        .square.dark { background-color: var(--dark-sq); }
        .square.is-correct { background-color: var(--correct); }
        .square.selected { outline: 3px solid yellow; z-index: 10; }

        #stats { 
            font-size: 1.2rem; 
            margin-bottom: 5px; 
            display: flex; 
            justify-content: space-between; 
            width: 100%; 
            font-weight: bold; 
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
            box-sizing: border-box;
        }
        
        #story-box { 
            background: #000; 
            padding: 10px; 
            border-radius: 10px; 
            border-left: 5px solid var(--terminal-green); 
            margin-bottom: 5px; 
            text-align: left; 
            width: 100%;
            box-sizing: border-box;
        }
        
        #objective-text { font-size: 1.1rem; font-weight: bold; line-height: 1.2; margin: 5px 0; }
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen active-screen">
        <div class="welcome-card">
            <h1 class="big-title">MASTER CODE LAB</h1>
            
            <label class="input-label">TYPE YOUR NAME:</label>
            <input type="text" id="kid-name" placeholder="Name Required">
            
            <label class="input-label">CHOOSE A STATION CODE:</label>
            <input type="password" id="kid-code" placeholder="Your Secret Pass">
            <span class="hint-text">This code is the pass you choose to login!</span>

            <button class="btn-main" onclick="startNewGame()">START SESSION</button>

            <div class="leaderboard">
                <table class="lb-table">
                    <thead><tr><th>Rank</th><th>Scientist</th><th>Score</th></tr></thead>
                    <tbody id="leaderboard-list"><tr><td colspan="3">Syncing Database...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="stats">
            <span>👤 <span id="display-name"></span></span>
            <span style="color:#ff4757">❤️ <span id="display-lives">3</span></span>
            <span style="color:#ffeb3b">⏳ <span id="seconds">60</span>s</span>
        </div>
        <div id="story-box">
            <div style="color: var(--terminal-green); font-weight: bold; font-size: 1.2rem;">STAGE 01</div>
            <p id="objective-text">EXPERIMENT 01: Scrambled data detected! Drag the pieces back to their original squares.</p>
        </div>
        <div id="board" class="board"></div>
    </div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
      authDomain: "assignments-de95a.firebaseapp.com",
      databaseURL: "https://assignments-de95a-default-rtdb.firebaseio.com", 
      projectId: "assignments-de95a",
      storageBucket: "assignments-de95a.firebasestorage.app",
      messagingSenderId: "1088073398299",
      appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let playerName = "";
    let timeLeft = 60;
    let timerInterval;
    let currentBoard = [];
    let selectedIndex = null;

    const pieceImages = {
        'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg', 'P': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
        'r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg', 'n': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        'b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg', 'q': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
        'k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg', 'R': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        'N': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg', 'B': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
        'Q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg', 'K': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };

    const s1Starting = ['r','n','b','q','k','b','n','r','p','p','p','p','p','p','p','p','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','P','P','P','P','P','P','P','P','R','N','B','Q','K','B','N','R'];

    function startNewGame() {
        playerName = document.getElementById('kid-name').value;
        const code = document.getElementById('kid-code').value;
        if(!playerName) return alert("SCIENTIST NAME REQUIRED!");
        if(!code) return alert("STATION CODE REQUIRED!");
        
        document.getElementById('welcome-screen').classList.remove('active-screen');
        document.getElementById('game-screen').classList.add('active-screen');
        document.getElementById('display-name').innerText = playerName;
        initGame();
    }

    function initGame() {
        timeLeft = 60; // Reset timer to 1 minute
        currentBoard = [...s1Starting].sort(() => Math.random() - 0.5);
        renderBoard();
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('seconds').innerText = timeLeft;
            if(timeLeft <= 0) { 
                clearInterval(timerInterval); 
                alert("TIME EXPIRED!");
                location.reload(); 
            }
        }, 1000);
    }

    function renderBoard() {
        const b = document.getElementById('board'); b.innerHTML = '';
        currentBoard.forEach((p, i) => {
            const sq = document.createElement('div');
            sq.className = `square ${(Math.floor(i/8)+i)%2?'dark':'light'}`;
            if(p === s1Starting[i] && p !== '') sq.classList.add('is-correct');
            if(i === selectedIndex) sq.classList.add('selected');
            
            if(p) { 
                const img = document.createElement('img'); 
                img.src = pieceImages[p]; 
                sq.appendChild(img); 
            }
            
            sq.onclick = () => {
                if(selectedIndex === null) { 
                    selectedIndex = i; 
                    renderBoard();
                }
                else {
                    [currentBoard[i], currentBoard[selectedIndex]] = [currentBoard[selectedIndex], currentBoard[i]];
                    selectedIndex = null; 
                    renderBoard();
                    if(currentBoard.every((val, index) => val === s1Starting[index])) {
                        db.ref('leaderboard/' + playerName).set({name: playerName, score: timeLeft * 10});
                        alert("MISSION SUCCESS!"); 
                        location.reload();
                    }
                }
            };
            b.appendChild(sq);
        });
    }

    db.ref('leaderboard').orderByChild('score').limitToLast(10).on('value', (snap) => {
        let players = []; snap.forEach(c => { players.push(c.val()); });
        players.reverse();
        document.getElementById('leaderboard-list').innerHTML = players.map((p, i) => `<tr><td>#${i+1}</td><td>${p.name}</td><td>${p.score}</td></tr>`).join('');
    });
</script>
</body>
</html>
