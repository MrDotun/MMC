<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play against Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body, html {
            margin: 0; 
            padding: 0;
            min-height: 100%; 
            width: 100%;
            overflow-y: auto; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start;
            background-color: #1a1a2e;
        }

        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: white;
            text-align: center;
        }
        .login-card {
            background: #2D1B4D;
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #4ade80;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #4ade80;
            background: #1a1a2e;
            color: white;
            box-sizing: border-box;
        }

        #leaderboard-box {
            margin-top: 20px;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid #4ade8044;
        }
        #leaderboard-box h3 { font-size: 0.9em; margin: 0 0 5px 0; color: #facc15; text-align: center;}
        #leaderboardList { list-style: none; padding: 0; margin: 0; font-size: 0.85em; color: #4ade80; }
        #leaderboardList li { border-bottom: 1px solid #ffffff11; padding: 3px 0; }

        #game-container {
            display: none; 
            width: 95vmin; 
            max-width: 550px;
            text-align: center;
            padding: 20px 10px;
        }

        #board { 
            width: 100%; 
            margin-bottom: 15px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .info-panel {
            background: #2D1B4D; 
            padding: 20px;
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #4ade80;
            color: white;
        }
        h2 { margin: 0 0 10px 0; color: #4ade80; font-size: 1.4em; }
        .grade { font-size: 1.3em; font-weight: bold; color: #4ade80; }
        
        .submit-btn {
            background-color: #4ade80;
            color: #1a1a2e;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(74, 222, 128, 0.2);
        }
        .submit-btn:hover {
            background-color: #22c55e;
            transform: translateY(-2px);
        }

        .highlight-white { background-color: #f6f669 !important; }
        .highlight-black { background-color: #e6e600 !important; }
        .white-1e1d7 { background-color: #ebecd0 !important; }
        .black-3c85d { background-color: #779556 !important; }
        
        #remark { 
            font-style: italic; 
            color: #facc15; 
            min-height: 1.5em; 
            display: block; 
            margin: 10px 0; 
            font-weight: 500;
        }
        #status { font-weight: bold; color: #cbd5e1; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80;">Week One Task</h1>
        <p>Welcome, Chess Champion! Please enter your details to start the match against Mr. Dotun.</p>
        <input type="text" id="studentName" placeholder="Enter Your Full Name" required>
        <input type="text" id="studentClass" placeholder="Enter Your Class" required>
        <button class="submit-btn" onclick="startGame()">START GAME</button>

        <div id="leaderboard-box">
            <h3>🏆 Hall of Grandmasters</h3>
            <ul id="leaderboardList"><li>Loading...</li></ul>
        </div>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h2 id="welcome-msg">Playing against: <strong>Mr. Dotun</strong></h2>
        <div id="board"></div>
        <p id="remark">"If you don't win, I'll be disappointed"</p>
        <p>Your Grade: <span id="grade" class="grade">Beginner</span></p>
        <p id="status">Your turn! Click a piece to select it.</p>
        
        <hr style="border: 0; border-top: 1px solid #4ade80; margin: 20px 0; opacity: 0.3;">
        
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfduqoEyvRko9-TM2T1SU0WVkr2vCdg2sFPZUTtQLOwSnJbBA/viewform" class="submit-btn">SUBMIT TO MR. DOTUN</a>
    </div>
</div>

<script>
    // --- FIREBASE INTEGRATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
      authDomain: "assignments-de95a.firebaseapp.com",
      projectId: "assignments-de95a",
      storageBucket: "assignments-de95a.firebasestorage.app",
      messagingSenderId: "1088073398299",
      appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    var currentName = "";
    var currentClass = "";
    var hasSavedWin = false;

    db.collection("grandmasters").orderBy("timestamp", "desc").limit(10)
      .onSnapshot((snapshot) => {
        const list = document.getElementById('leaderboardList');
        list.innerHTML = "";
        if (snapshot.empty) list.innerHTML = "<li>No Grandmasters yet. Win to be first!</li>";
        snapshot.forEach((doc) => {
            const data = doc.data();
            const li = document.createElement('li');
            li.textContent = `👑 ${data.name} (${data.class})`;
            list.appendChild(li);
        });
    });

    function startGame() {
        currentName = document.getElementById('studentName').value;
        currentClass = document.getElementById('studentClass').value;
        if (currentName.trim() === "" || currentClass.trim() === "") {
            alert("Please enter both your name and class.");
            return;
        }
        document.getElementById('welcome-overlay').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        board.resize();
    }

    var board = null;
    var game = new Chess();
    var $status = $('#status');
    var $grade = $('#grade');
    var $remark = $('#remark');
    var sourceSquare = null; 

    var pieceValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 1000 };
    var totalScore = 0;

    function updateGrade() {
        if (totalScore >= 200) {
            $grade.text("Grandmaster! 👑");
            if (!hasSavedWin && currentName) {
                db.collection("grandmasters").add({
                    name: currentName,
                    class: currentClass,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                hasSavedWin = true;
            }
        }
        else if (totalScore >= 120) $grade.text("Expert 🏆");
        else if (totalScore >= 70) $grade.text("Pro 🌟");
        else if (totalScore >= 30) $grade.text("Advanced 👍");
        else $grade.text("Beginner");
    }

    function mrDotunRemarks(type) {
        var remarks = {
            illegal: "I'll reduce your score if you make an illegal move!",
            bad: [
                "Control the center!", "Every pawn move creates a weakness.", "Is this what I taught you?", 
                "Hahahha. Nursery 1 moves.", "Castle early, stay safe!", "Don't bring your Queen out too early!",
                "You're playing like you want to lose.", "Think twice, move once!", "Focus! Chess is discipline.",
                "Are you giving me that piece for free?", "You are playing with fire.", "Don't just move, have a plan!",
                "That piece was crying for help.", "Are we playing chess or checkers?", "Check your back rank!",
                "You're walking into a trap.", "Stop reacting and start anticipating!", "Blunder alert!",
                "You're making it too easy for me.", "Is your King safe? I don't think so.", "Study your openings again.",
                "That was a wasted tempo.", "You're letting me dictate the game.", "Look at the whole board!",
                "Even a beginner knows better than that."
            ],
            good: [
                "You're learning!", "Strong move.", "You're going to be world champion!", "Now you're playing real chess.", 
                "Beautiful!", "That's a master-level sequence.", "I didn't see that one coming!", "Excellent vision.",
                "You've got me on the ropes now.", "Keep that pressure up!", "A very mature decision.", "Strategic brilliance!",
                "You found the best move.", "That's how a Grandmaster plays.", "Solid defense.", "Great counter-play!",
                "You're controlling the rhythm now.", "Sharp as a razor!", "I like your style.", "Textbook execution.",
                "Thinking three steps ahead!", "Impressive calculation.", "You've improved since our last game.",
                "Perfectly timed!", "You're making me work for this!"
            ]
        };
        if (type === 'illegal') $remark.text(remarks.illegal);
        else if (type === 'good') $remark.text(remarks.good[Math.floor(Math.random() * remarks.good.length)]);
        else if (type === 'bad') $remark.text(remarks.bad[Math.floor(Math.random() * remarks.bad.length)]);
    }

    function makeAIMove() {
        if (game.game_over()) {
            $status.text('Game Over!');
            return;
        }

        var moves = game.moves({ verbose: true });
        var playerMoves = new Chess(game.fen()).moves({ verbose: true });
        var squaresAttackedByPlayer = playerMoves.map(m => m.to);

        var scoredMoves = moves.map(function(move) {
            var score = Math.random() * 5; 
            if (move.san.includes('#')) return { move: move, score: 100000 };
            
            var currentPiece = game.get(move.from);
            var currentPieceVal = pieceValues[currentPiece.type];
            
            // ESCAPE LOGIC: If a piece is already under attack, moving it is prioritized
            if (squaresAttackedByPlayer.includes(move.from)) {
                score += (currentPieceVal * 10); 
            }

            // CAPTURE EVALUATION
            if (move.captured) {
                var valGained = pieceValues[move.captured];
                var valLost = pieceValues[move.piece];
                game.move(move);
                var canBeRecaptured = game.moves({ verbose: true }).some(m => m.to === move.to);
                game.undo();
                
                if (canBeRecaptured) {
                    if (valGained >= valLost) score += (valGained * 50); 
                    else score -= (valLost * 100); // Avoid bad trades
                } else {
                    score += (valGained * 85); 
                }
            }

            game.move(move);
            var opponentResponses = game.moves({ verbose: true });
            
            // PROTECTION CHECK: Ensure the landing square isn't "hanging"
            var landingSquareAttacked = opponentResponses.some(m => m.to === move.to);
            if (landingSquareAttacked) {
                // Check if the piece is defended by another black piece
                var pieceOnSquare = game.remove(move.to);
                var isDefendedByBlack = game.moves({verbose: true}).some(m => m.to === move.to);
                game.put(pieceOnSquare, move.to);

                if (!isDefendedByBlack) {
                    score -= (pieceValues[move.piece] * 150); // Massive penalty for hanging a piece
                } else if (pieceValues[move.piece] > 10) {
                    score -= (pieceValues[move.piece] * 15); // Slight penalty for risky trades
                }
            }

            var walkIntoMate = false;
            for (var i = 0; i < opponentResponses.length; i++) {
                game.move(opponentResponses[i]);
                if (game.in_checkmate()) walkIntoMate = true;
                game.undo();
                if (walkIntoMate) break;
            }
            if (walkIntoMate) score -= 90000;
            
            game.undo();
            
            if (['d4', 'd5', 'e4', 'e5'].includes(move.to)) score += 15;
            if (move.san.includes('+')) score += 25;
            
            return { move: move, score: score };
        });

        scoredMoves.sort(function(a, b) { return b.score - a.score; });
        game.move(scoredMoves[0].move);
        board.position(game.fen());
        
        var history = game.history();
        var histText = history.length > 0 ? "<br><small>History: " + history.slice(-6).join(' ') + "</small>" : "";
        
        if (game.game_over()) {
            $status.html("Mr. Dotun wins!" + histText);
            $remark.text("Go back and study your endgames!");
        } else {
            $status.html("Mr. Dotun moved. Your turn!" + histText);
        }
    }

    function onSquareClick(square) {
        if (game.game_over()) return;
        if (sourceSquare === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            }
            return;
        }
        var testGame = new Chess(game.fen());
        var moveAttempt = { from: sourceSquare, to: square, promotion: 'q' };
        var valid = testGame.move(moveAttempt);
        if (valid) {
            var responses = testGame.moves();
            for (var i = 0; i < responses.length; i++) {
                testGame.move(responses[i]);
                if (testGame.in_checkmate()) {
                    $remark.text("Careful! That leads to immediate checkmate!");
                    $status.text("Blunder blocked! Try again.");
                    sourceSquare = null;
                    removeHighlights();
                    return;
                }
                testGame.undo();
            }
        }
        var move = game.move(moveAttempt);
        if (move === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            } else {
                sourceSquare = null;
                removeHighlights();
                mrDotunRemarks('illegal');
            }
            return;
        }
        board.position(game.fen());
        sourceSquare = null;
        removeHighlights();
        if (move.captured) totalScore += pieceValues[move.captured];
        if (game.in_checkmate()) {
            totalScore = 250; 
            updateGrade();
            $remark.text("Masterful! You checkmated Mr. Dotun!");
        } else {
            updateGrade();
            if (move.captured || move.san.includes('+')) mrDotunRemarks('good');
            else if(Math.random() > 0.7) mrDotunRemarks('bad');
            var history = game.history();
            $status.html("Thinking... <br><small>History: " + history.slice(-6).join(' ') + "</small>");
            window.setTimeout(makeAIMove, 500);
        }
    }

    function addHighlight(square) {
        var $el = $('#board .square-' + square);
        if ($el.hasClass('black-3c85d')) $el.addClass('highlight-black');
        else $el.addClass('highlight-white');
    }

    function removeHighlights() {
        $('#board [class*="square-"]').removeClass('highlight-white highlight-black');
    }

    var config = {
        draggable: false,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };
    
    board = ChessBoard('board', config);
    $('#board').on('click', '[class*="square-"]', function() {
        onSquareClick($(this).attr('data-square'));
    });
    $(window).resize(board.resize);
</script>
</body>
</html>
