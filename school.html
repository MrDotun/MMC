<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Speed 2400 Chess</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        #board { width: 400px; border: 2px solid #444; }
        .info { margin-top: 15px; text-align: center; }
        .status { font-size: 1.2em; font-weight: bold; color: #00ff88; margin-bottom: 10px; }
        .highlight { background-color: rgba(255, 255, 0, 0.4) !important; }
        button { padding: 8px 20px; cursor: pointer; background: #333; border: 1px solid #555; color: white; border-radius: 3px; }
        button:hover { background: #444; }
    </style>
</head>
<body>

    <div class="status" id="status">Your Move</div>
    <div id="board"></div>

    <div class="info">
        <button onclick="resetGame()">New Game</button>
        <p><small>Engine: Stockfish | Speed: 100ms/move</small></p>
    </div>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');
        var sourceSquare = null;

        // Optimized Engine Setup
        var stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        stockfish.postMessage('uci');
        stockfish.postMessage('setoption name Threads value 2'); // Use multi-threading
        stockfish.postMessage('setoption name Hash value 32');    // Small hash for faster initialization
        stockfish.postMessage('setoption name Skill Level value 20');

        function onSquareClick(square) {
            // Select Source
            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    $('.square-' + square).addClass('highlight');
                }
                return;
            }

            // Attempt Move
            var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });

            $('.square-55d63').removeClass('highlight'); // Clear highlights
            sourceSquare = null;

            if (move === null) {
                // Check if user clicked another of their own pieces instead
                var piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    $('.square-' + square).addClass('highlight');
                }
                return;
            }

            // Update UI & Trigger Engine
            board.position(game.fen(), false); // 'false' disables move animation for speed
            updateStatus();
            
            if (!game.game_over()) {
                $status.html('Thinking...');
                stockfish.postMessage('position fen ' + game.fen());
                stockfish.postMessage('go movetime 100'); // Ultra-fast 100ms calculation
            }
        }

        stockfish.onmessage = function(event) {
            if (event.data.startsWith('bestmove')) {
                var moveStr = event.data.split(' ')[1];
                game.move({
                    from: moveStr.substring(0, 2),
                    to: moveStr.substring(2, 4),
                    promotion: 'q'
                });
                board.position(game.fen(), false);
                updateStatus();
            }
        };

        function updateStatus() {
            if (game.in_checkmate()) $status.html('Checkmate!');
            else if (game.in_draw()) $status.html('Draw!');
            else $status.html(game.turn() === 'w' ? 'Your Move' : 'AI Thinking...');
        }

        function resetGame() {
            game.reset();
            board.start(false);
            sourceSquare = null;
            $('.square-55d63').removeClass('highlight');
            $status.html('Your Move');
        }

        board = ChessBoard('board', {
            position: 'start',
            draggable: false,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        // Event delegation for clicks
        $('#board').on('click', '.square-55d63', function() {
            onSquareClick($(this).attr('data-square'));
        });
    </script>
</body>
</html>
