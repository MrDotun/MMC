<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2200 Elo Chess AI</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; }
        #myBoard { width: 400px; margin-top: 20px; }
        .info { margin: 20px; text-align: center; }
        button { padding: 10px 20px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="info">
        <h2>Stockfish Engine (Target: 2200 Elo)</h2>
        <div id="status">Your turn (White)</div>
        <br>
        <button onclick="resetGame()">Reset Game</button>
    </div>

    <div id="myBoard"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        // Initialize Stockfish from a CDN-hosted Worker
        var stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');

        // Set Elo to 2200
        stockfish.postMessage('uci');
        stockfish.postMessage('setoption name UCI_LimitStrength value true');
        stockfish.postMessage('setoption name UCI_Elo value 2200');

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if (piece.search(/^b/) !== -1) return false; // User is White
        }

        function makeBestMove() {
            if (game.game_over()) return;

            // Tell Stockfish the current position
            stockfish.postMessage('position fen ' + game.fen());
            // Tell Stockfish to search (depth 15 is strong enough for 2200)
            stockfish.postMessage('go depth 15');

            stockfish.onmessage = function(event) {
                if (event.data.startsWith('bestmove')) {
                    var move = event.data.split(' ')[1];
                    game.move({
                        from: move.substring(0, 2),
                        to: move.substring(2, 4),
                        promotion: 'q'
                    });
                    board.position(game.fen());
                    updateStatus();
                }
            };
        }

        function onDrop (source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            updateStatus();
            // Wait 250ms then let AI move
            window.setTimeout(makeBestMove, 250);
        }

        function updateStatus () {
            var status = '';
            var moveColor = 'White';
            if (game.turn() === 'b') moveColor = 'Black';

            if (game.in_checkmate()) {
                status = 'Game over, ' + moveColor + ' is in checkmate.';
            } else if (game.in_draw()) {
                status = 'Game over, drawn position';
            } else {
                status = moveColor + ' to move';
                if (game.in_check()) status += ', ' + moveColor + ' is in check';
            }

            $status.html(status);
        }

        function resetGame() {
            game.reset();
            board.start();
            updateStatus();
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = ChessBoard('myBoard', config);
        updateStatus();

    </script>
</body>
</html>
