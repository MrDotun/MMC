<!DOCTYPE html>
<html>
<head>
<style>
  /* Keeping your exact structure, just updating the visual values */
  .board {
    display: grid;
    grid-template-columns: repeat(8, 80px); /* Larger squares */
    grid-template-rows: repeat(8, 80px);
    border: 5px solid #333;
    width: fit-content;
  }

  .square {
    width: 80px;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Green and White Chess Board */
  .white-sq { background-color: #ffffff; }
  .green-sq { background-color: #2e7d32; }

  /* Larger, Solid Pieces */
  .piece {
    font-size: 65px; 
    opacity: 1;      /* Non-transparent */
    cursor: pointer;
    user-select: none;
    line-height: 1;
  }

  .black-piece { color: #000; }
  .white-piece { color: #fff; text-shadow: 0 0 2px #000; }

  .selected { background-color: yellow !important; }
</style>
</head>
<body>

<div class="board" id="board">
  <div class="square white-sq"><span class="piece black-piece">♜</span></div>
  <div class="square green-sq"><span class="piece black-piece">♞</span></div>
  <div class="square white-sq"><span class="piece black-piece">♝</span></div>
  <div class="square green-sq"><span class="piece black-piece">♛</span></div>
  <div class="square white-sq"><span class="piece black-piece">♚</span></div>
  <div class="square green-sq"><span class="piece black-piece">♝</span></div>
  <div class="square white-sq"><span class="piece black-piece">♞</span></div>
  <div class="square green-sq"><span class="piece black-piece">♜</span></div>
  </div>

<script>
  // Restoring your click-to-move logic structure
  let selectedPiece = null;

  document.querySelectorAll('.square').forEach(square => {
    square.addEventListener('click', function() {
      if (selectedPiece) {
        // Move logic
        if (this.innerHTML === "") {
            this.appendChild(selectedPiece);
            selectedPiece.parentElement.classList.remove('selected');
            selectedPiece = null;
        } else {
            // Capture logic or re-selection
            this.innerHTML = "";
            this.appendChild(selectedPiece);
            selectedPiece = null;
        }
      } else {
        const piece = this.querySelector('.piece');
        if (piece) {
          selectedPiece = piece;
          this.classList.add('selected');
        }
      }
    });
  });
</script>
</body>
</html>
