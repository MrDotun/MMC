<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MASTER CODE - STRATEGIC SPEED LAB</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <style>
        :root {
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --highlight: rgba(255, 235, 59, 0.7);
            --correct: rgba(76, 175, 80, 0.6);
            --accent: #f1c40f;
            --lab-blue: #00d2ff;
            --terminal-green: #00ff41;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle, #1a2a6c, #101010);
            color: white;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .screen { display: none; width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; text-align: center; height: 100%; justify-content: center; }
        .active-screen { display: flex; flex-direction: column; animation: slideIn 0.5s ease-out; }

        .welcome-card { 
            background: rgba(10, 10, 10, 0.95); 
            padding: 20px; 
            border-radius: 20px; 
            border: 2px solid var(--lab-blue);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }
        
        h1.big-title { font-size: 2.2rem; color: var(--lab-blue); margin-bottom: 15px; text-shadow: 2px 2px #000; }
        
        input { 
            padding: 14px; 
            border-radius: 8px; 
            border: 1px solid var(--lab-blue); 
            width: 90%; 
            margin: 8px 0; 
            font-size: 1.2rem; 
            background: #111; 
            color: white; 
            text-align: center;
        }
        input::placeholder { color: #555; font-weight: bold; }

        .btn-main { 
            background: var(--lab-blue); 
            color: #000; 
            padding: 15px; 
            border: none; 
            border-radius: 10px; 
            font-size: 1.3rem; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            margin-top: 10px;
        }

        /* LEADERBOARD STYLES */
        .leaderboard { 
            margin-top: 20px; 
            background: rgba(0,0,0,0.8); 
            padding: 10px; 
            border-radius: 12px; 
            border: 1px solid var(--terminal-green);
            max-height: 250px;
            overflow-y: auto;
        }
        .lb-table { width: 100%; border-collapse: collapse; font-size: 1rem; }
        .lb-table th { color: var(--terminal-green); border-bottom: 1px solid #333; padding: 10px; }
        .lb-table td { padding: 8px; border-bottom: 1px solid #222; }

        /* TYPING INSTRUCTIONS BOX */
        #story-box { 
            background: #000; 
            padding: 20px; 
            border-radius: 10px; 
            border-left: 5px solid var(--terminal-green); 
            margin-bottom: 15px;
            min-height: 120px;
            text-align: left;
        }
        #stage-title { font-size: 1.5rem; color: var(--terminal-green); display: block; margin-bottom: 8px; font-weight: bold;} 
        #objective-text { 
            font-size: 1.4rem; /* BIGGER LETTERING */
            color: #fff; 
            line-height: 1.3; 
            font-weight: bold;
        }
        .cursor { border-left: 10px solid var(--terminal-green); animation: blink 1s infinite; margin-left: 5px; }

        @keyframes blink { 50% { opacity: 0; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1/1; border: 4px solid #333; }
        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .square img { width: 85%; height: 85%; }
        .square.light { background-color: var(--light-sq); }
        .square.dark { background-color: var(--dark-sq); }
        .square.is-correct { background-color: var(--correct); pointer-events: none; }

        #stats { font-size: 1.2rem; margin: 5px; font-weight: bold; display: flex; justify-content: space-between; width: 100%; }
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen active-screen">
        <div class="welcome-card">
            <h1 class="big-title">MASTER CODE LAB</h1>
            
            <div class="input-group">
                <input type="text" id="kid-name" placeholder="ENTER YOUR NAME">
                <input type="number" id="kid-age" placeholder="Age">
                <input type="password" id="kid-code" placeholder="Station Code" oninput="checkReturningPlayer()">
            </div>
            
            <button id="resume-btn" class="btn-main" style="background:#e67e22; display:none; margin-bottom:10px;" onclick="resumeGame()">RESUME EXPERIMENT</button>
            <button class="btn-main" onclick="startNewGame()">START SESSION</button>

            <div class="leaderboard">
                <table class="lb-table">
                    <thead><tr><th>Rank</th><th>Scientist</th><th>Score</th></tr></thead>
                    <tbody id="leaderboard-list"><tr><td colspan="3">Syncing Database...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="stats">
            <span>👤 <span id="display-name"></span></span>
            <span style="color:#ff4757">❤️ <span id="display-lives">3</span></span>
            <span style="color:#ffeb3b">⏳ <span id="seconds">60</span>s</span>
        </div>

        <div id="story-box">
            <div id="stage-title">SYSTEM BOOTING...</div>
            <div id="objective-text"></div><span class="cursor"></span>
        </div>

        <div id="board" class="board"></div>
        
        <div style="margin-top:15px;">
            <button class="btn-main" style="width:auto; padding:10px 30px; background:#c0392b; color:white;" onclick="location.reload()">EXIT LAB</button>
        </div>
    </div>

<script>
    // --- FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
      authDomain: "assignments-de95a.firebaseapp.com",
      projectId: "assignments-de95a",
      storageBucket: "assignments-de95a.firebasestorage.app",
      messagingSenderId: "1088073398299",
      appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentStage = 1;
    let playerName = "";
    let playerLives = 3;
    let playerScore = 0;
    let timeLeft = 60;
    let timerInterval;
    let currentBoard = [];
    let selectedIndex = null;

    const pieceImages = {
        'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg', 'P': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
        'r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg', 'n': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        'b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg', 'q': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
        'k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg', 'R': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        'N': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg', 'B': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
        'Q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg', 'K': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };

    const s1Starting = ['r','n','b','q','k','b','n','r','p','p','p','p','p','p','p','p','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','P','P','P','P','P','P','P','P','R','N','B','Q','K','B','N','R'];

    // COMPUTER TYPING EFFECT
    function typeInstructions(text) {
        let i = 0;
        const speed = 40; 
        const container = document.getElementById("objective-text");
        container.innerHTML = "";
        
        function type() {
            if (i < text.length) {
                container.innerHTML += text.charAt(i);
                i++;
                setTimeout(type, speed);
            }
        }
        type();
    }

    function startNewGame() {
        playerName = document.getElementById('kid-name').value.trim();
        if(!playerName) { alert("Identify yourself, Scientist! Enter your name."); return; }
        launchGame(1);
    }

    function launchGame(stageNum) {
        currentStage = stageNum;
        document.getElementById('welcome-screen').classList.remove('active-screen');
        document.getElementById('game-screen').classList.add('active-screen');
        document.getElementById('display-name').innerText = playerName;
        
        let instructions = "";
        if(stageNum === 1) instructions = "EXPERIMENT 01: Scrambled data detected! Drag the pieces back to their original home squares.";
        if(stageNum >= 2) instructions = "NEXT PHASE: Higher complexity detected. Analyze and execute movement.";

        document.getElementById('stage-title').innerText = `STAGE 0${stageNum}`;
        typeInstructions(instructions);
        initStage1(); // Keeping structure same as requested
    }

    function initStage1() {
        timeLeft = 60;
        let pieces = s1Starting.filter(p => p !== '');
        let pos = Array.from({length: 64}, (_, i) => i).sort(() => Math.random() - 0.5);
        currentBoard = new Array(64).fill('');
        pos.forEach((p, i) => { if(i < pieces.length) currentBoard[p] = pieces[i]; });
        startTimer();
        renderBoard();
    }

    function renderBoard() {
        const b = document.getElementById('board'); b.innerHTML = '';
        currentBoard.forEach((p, i) => {
            const sq = document.createElement('div');
            sq.className = `square ${(Math.floor(i/8)+i)%2?'dark':'light'}`;
            if(p === s1Starting[i] && p !== '') sq.classList.add('is-correct');
            if(p) { const img = document.createElement('img'); img.src = pieceImages[p]; sq.appendChild(img); }
            sq.onclick = () => handleMove(i);
            b.appendChild(sq);
        });
    }

    function handleMove(i) {
        if (selectedIndex === null) {
            if (currentBoard[i] !== '') selectedIndex = i;
        } else {
            let temp = currentBoard[i];
            currentBoard[i] = currentBoard[selectedIndex];
            currentBoard[selectedIndex] = temp;
            selectedIndex = null;
            renderBoard();
            if (currentBoard.every((p, idx) => p === s1Starting[idx])) winStage();
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('seconds').innerText = timeLeft;
            if(timeLeft <= 0) { clearInterval(timerInterval); alert("TIME EXPIRED!"); location.reload(); }
        }, 1000);
    }

    function winStage() {
        clearInterval(timerInterval);
        playerScore += (100 + timeLeft);
        saveScoreFirebase(playerName, playerScore);
        alert("STAGE COMPLETE!");
        if(currentStage < 5) launchGame(++currentStage);
    }

    // --- FIREBASE LEADERBOARD LOGIC ---
    function saveScoreFirebase(name, score) {
        db.ref('leaderboard/' + name).set({
            name: name,
            score: score,
            timestamp: Date.now()
        });
    }

    function listenToLeaderboard() {
        db.ref('leaderboard').orderByChild('score').limitToLast(10).on('value', (snapshot) => {
            let players = [];
            snapshot.forEach(child => { players.push(child.val()); });
            players.reverse(); // Highest score first
            
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = players.map((p, i) => `
                <tr>
                    <td>#${i+1}</td>
                    <td>${p.name}</td>
                    <td>${p.score}</td>
                </tr>
            `).join('');
        });
    }

    window.onload = listenToLeaderboard;
</script>
</body>
</html>
