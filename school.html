<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play against Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100%; width: 100%;
            overflow-y: auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; 
            justify-content: flex-start; background-color: #1a1a2e;
        }
        #welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a1a2e; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
            color: white; text-align: center;
        }
        .login-card {
            background: #2D1B4D; padding: 40px; border-radius: 15px;
            border: 2px solid #4ade80; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%; max-width: 400px;
        }
        .login-card input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px;
            border: 1px solid #4ade80; background: #1a1a2e; color: white;
            box-sizing: border-box;
        }
        #game-container { display: none; width: 95vmin; max-width: 550px; text-align: center; padding: 20px 10px; }
        #board { width: 100%; margin-bottom: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .info-panel {
            background: #2D1B4D; padding: 20px; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 2px solid #4ade80; color: white;
        }
        .grade { font-size: 1.3em; font-weight: bold; color: #4ade80; }
        .submit-btn {
            background-color: #4ade80; color: #1a1a2e; padding: 14px 28px;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
            margin-top: 20px; transition: transform 0.2s; text-decoration: none; display: inline-block;
        }
        .highlight-white { background-color: #f6f669 !important; }
        #remark { font-style: italic; color: #facc15; margin: 10px 0; font-weight: 500; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80;">Week One Task</h1>
        <input type="text" id="studentName" placeholder="Enter Your Full Name" required>
        <input type="text" id="studentClass" placeholder="Enter Your Class" required>
        <button class="submit-btn" onclick="startGame()">START GAME</button>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h2>Playing against: <strong>Mr. Dotun</strong></h2>
        <div id="board"></div>
        <p id="remark">"Checkmate is the goal, don't get distracted!"</p>
        <p>Your Grade: <span id="grade" class="grade">Beginner</span></p>
        <p id="status">Your turn!</p>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfduqoEyvRko9-TM2T1SU0WVkr2vCdg2sFPZUTtQLOwSnJbBA/viewform" class="submit-btn">SUBMIT TO MR. DOTUN</a>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
      authDomain: "assignments-de95a.firebaseapp.com",
      projectId: "assignments-de95a",
      storageBucket: "assignments-de95a.firebasestorage.app",
      messagingSenderId: "1088073398299",
      appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    var board = null;
    var game = new Chess();
    var $status = $('#status');
    var $grade = $('#grade');
    var $remark = $('#remark');
    var sourceSquare = null; 
    var totalScore = 0;
    var pieceValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 1000 };

    function startGame() {
        document.getElementById('welcome-overlay').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        board.resize();
    }

    function makeAIMove() {
        if (game.game_over()) return;

        var moves = game.moves({ verbose: true });
        
        // --- EMERGENCY THREAT DETECTION ---
        // We find every piece of Black that is currently under attack by White
        var playerMoves = game.moves({ verbose: true });
        var squaresUnderAttack = playerMoves.map(function(m) { return m.to; });

        var scoredMoves = moves.map(function(move) {
            var score = Math.random() * 10; 

            // 1. Instant Win
            if (move.san.includes('#')) return { move: move, score: 1000000 };
            
            // 2. SELF-PRESERVATION (THE FIX)
            // If the piece at 'move.from' is currently being targeted, give moving it a massive priority
            if (squaresUnderAttack.includes(move.from)) {
                var pieceValue = pieceValues[move.piece];
                score += (pieceValue * 500); // Massive incentive to escape
            }

            // 3. Capture Evaluation
            if (move.captured) {
                var valGained = pieceValues[move.captured];
                var valLost = pieceValues[move.piece];
                
                game.move(move);
                var isSafe = !game.moves({ verbose: true }).some(m => m.to === move.to);
                game.undo();

                if (isSafe) score += (valGained * 100);
                else if (valGained > valLost) score += (valGained - valLost) * 50;
                else score -= (valLost * 80);
            }

            // 4. Square Safety (Don't move into fire)
            game.move(move);
            var moveIsSafe = !game.moves({ verbose: true }).some(m => m.to === move.to);
            game.undo();
            if (!moveIsSafe) {
                score -= (pieceValues[move.piece] * 300); // Extremely heavy penalty for suicide moves
            }

            // 5. Positional Bonus
            if (['d4', 'd5', 'e4', 'e5'].includes(move.to)) score += 30;
            if (move.san.includes('O-O')) score += 200; // High priority for castling
            if (move.san.includes('+')) score += 50;

            return { move: move, score: score };
        });

        scoredMoves.sort(function(a, b) { return b.score - a.score; });
        
        // Safety check if no moves are found
        var bestMove = scoredMoves.length > 0 ? scoredMoves[0].move : moves[0];
        
        game.move(bestMove);
        board.position(game.fen());
        $status.html("Mr. Dotun moved. Your turn!");
    }

    function onSquareClick(square) {
        if (game.game_over()) return;

        if (sourceSquare === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            }
            return;
        }

        var moveAttempt = { from: sourceSquare, to: square, promotion: 'q' };
        var move = game.move(moveAttempt);
        
        if (move === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            } else {
                sourceSquare = null;
                removeHighlights();
            }
            return;
        }

        board.position(game.fen());
        sourceSquare = null;
        removeHighlights();

        if (move.captured) totalScore += pieceValues[move.captured];
        updateGradeDisplay();
        
        window.setTimeout(makeAIMove, 500);
    }

    function updateGradeDisplay() {
        if (totalScore >= 150) $grade.text("Grandmaster! 👑");
        else if (totalScore >= 80) $grade.text("Expert 🏆");
        else if (totalScore >= 30) $grade.text("Advanced 👍");
        else $grade.text("Beginner");
    }

    function addHighlight(square) {
        $('#board .square-' + square).addClass('highlight-white');
    }

    function removeHighlights() {
        $('#board [class*="square-"]').removeClass('highlight-white');
    }

    board = ChessBoard('board', {
        draggable: false,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    $('#board').on('click', '[class*="square-"]', function() {
        onSquareClick($(this).attr('data-square'));
    });
    $(window).resize(board.resize);
</script>
</body>
</html>
