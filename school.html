<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Chess Assignments</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #board-container { width: 400px; max-width: 95vw; margin: 20px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .hidden { display: none !important; }
        .btn { padding: 12px 24px; margin: 5px; cursor: pointer; font-size: 16px; border-radius: 8px; border: none; background: var(--primary); color: white; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        #results-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 50px rgba(0,0,0,0.4); z-index: 1000; width: 320px; max-height: 80vh; overflow-y: auto; }
        .leaderboard-entry { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; }
        #task-text { background: white; padding: 15px; border-radius: 8px; border-left: 5px solid var(--secondary); margin-bottom: 10px; width: 90%; max-width: 370px; font-weight: bold; }
        .highlight-legal { box-shadow: inset 0 0 3px 3px rgba(0, 255, 0, 0.5); }
        .highlight-selected { background-color: rgba(255, 255, 0, 0.5) !important; }
    </style>
</head>
<body>

    <h1>♟️ Weekly Chess Missions</h1>

    <div id="setup-area">
        <h3>Select your Grade Level:</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn" onclick="initMission(1)">Grade 1</button>
            <button class="btn" onclick="initMission(2)">Grade 2</button>
            <button class="btn" onclick="initMission(3)">Grade 3</button>
            <button class="btn" onclick="initMission(4)">Grade 4</button>
            <button class="btn" onclick="initMission(5)">Grade 5</button>
            <button class="btn" onclick="initMission(6)">Grade 6</button>
        </div>
    </div>

    <div id="game-area" class="hidden">
        <div id="task-text">Loading mission...</div>
        <div id="board-container"><div id="myBoard"></div></div>
        <h3>Score: <span id="current-score">0</span> / 5</h3>
    </div>

    <div id="post-game" class="hidden">
        <h2>Mission Accomplished! 🎉</h2>
        <button class="btn" style="background:var(--secondary)" onclick="fetchLeaderboard()">🏆 Leaderboard</button>
        <button class="btn" onclick="location.reload()">🔄 Restart</button>
    </div>

    <div id="results-modal" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Grade <span id="lbl-grade"></span> Results</h3>
            <button onclick="document.getElementById('results-modal').classList.add('hidden')" style="border:none; background:none; font-size:24px;">&times;</button>
        </div>
        <div id="leaderboard-data"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
            authDomain: "assignments-de95a.firebaseapp.com",
            databaseURL: "https://assignments-de95a-default-rtdb.firebaseio.com",
            projectId: "assignments-de95a",
            storageBucket: "assignments-de95a.firebasestorage.app",
            messagingSenderId: "1088073398299",
            appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be",
            measurementId: "G-61LNTVLFX9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);

        const allQuestions = [
            { grade: 1, fen: "8/8/8/4nn2/4P3/8/8/8 w - - 0 1", move: "e4f5", task: "Capture the Knight on f5 with your Pawn!" },
            { grade: 1, fen: "8/8/8/1r3r2/8/8/8/1r3B2 w - - 0 1", move: "f1b5", task: "Capture the Rook on b5 with your Bishop!" },
            { grade: 1, fen: "8/8/8/3ppp2/8/3p1N2/8/8 w - - 0 1", move: "f3e5", task: "Capture the Pawn on e5 with your Knight!" },
            { grade: 1, fen: "8/7b/8/3b2b1/8/8/1b6/7R w - - 0 1", move: "h1h7", task: "Capture the Bishop on h7 with your Rook!" },
            { grade: 1, fen: "3r4/8/8/6r1/1r6/8/7r/3Q4 w - - 0 1", move: "d1d8", task: "Capture the Rook on d8 with your Queen!" }
            // Grade 2-6 omitted for brevity, add back as needed
        ];

        let game = new Chess();
        let board = null;
        let myGrade = 0;
        let gradeSet = [];
        let currentIdx = 0;
        let score = 0;
        let squareSelected = null;

        window.initMission = function(grade) {
            myGrade = grade;
            gradeSet = allQuestions.filter(q => q.grade === grade);
            currentIdx = 0; score = 0;
            document.getElementById("setup-area").classList.add("hidden");
            document.getElementById("game-area").classList.remove("hidden");
            loadQuestion();
        };

        function loadQuestion() {
            if (currentIdx >= gradeSet.length) { finishGame(); return; }
            const q = gradeSet[currentIdx];
            document.getElementById("task-text").innerText = `Mission ${currentIdx + 1}: ${q.task}`;
            game.load(q.fen);
            board = Chessboard('myBoard', {
                draggable: false, position: q.fen,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            $('#myBoard .square-55d63').on('click', function() { onSquareClick($(this).attr('data-square')); });
        }

        function onSquareClick(square) {
            $('.square-55d63').removeClass('highlight-selected');
            if (squareSelected === null) {
                if (game.get(square)) { squareSelected = square; $(`.square-${square}`).addClass('highlight-selected'); }
            } else {
                handleMove(squareSelected, square);
                squareSelected = null;
            }
        }

        function handleMove(source, target) {
            const move = source + target;
            if (move === gradeSet[currentIdx].move) {
                score++; currentIdx++;
                document.getElementById("current-score").innerText = score;
                setTimeout(loadQuestion, 500);
            }
        }

        async function finishGame() {
            const name = prompt("Enter your name:");
            if (name) {
                await addDoc(collection(db, "leaderboard"), {
                    studentName: name, gradeLevel: myGrade, score: score, timestamp: serverTimestamp()
                });
            }
            document.getElementById("game-area").classList.add("hidden");
            document.getElementById("post-game").classList.remove("hidden");
        }

        window.fetchLeaderboard = async function() {
            try {
                // SIMPLIFIED QUERY: Only one sort to match your Enabled index
                const q = query(collection(db, "leaderboard"), where("gradeLevel", "==", myGrade), orderBy("score", "desc"));
                const snap = await getDocs(q);
                let html = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    html += `<div class="leaderboard-entry"><span>${d.studentName}</span><span>${d.score} pts</span></div>`;
                });
                document.getElementById("leaderboard-data").innerHTML = html || "No records yet!";
                document.getElementById("lbl-grade").innerText = myGrade;
                document.getElementById("results-modal").classList.remove("hidden");
            } catch (err) {
                alert("Database Error: " + err.message);
            }
        };
    </script>
</body>
</html>
