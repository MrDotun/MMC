<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MASTER CODE - STRATEGIC SPEED LAB</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <style>
        :root {
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --correct: rgba(76, 175, 80, 0.6);
            --lab-blue: #00d2ff;
            --terminal-green: #00ff41;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle, #1a2a6c, #101010);
            color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Keeps everything on one screen */
        }

        .screen { display: none; width: 100%; max-width: 500px; padding: 10px; height: 100%; box-sizing: border-box; }
        .active-screen { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }

        /* FIXED BOARD CONTAINER */
        .board { 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            grid-template-rows: repeat(8, 1fr);
            width: 90vw; 
            height: 90vw; /* Forces a perfect square on mobile */
            max-width: 400px; 
            max-height: 400px; /* Forces a perfect square on desktop */
            border: 4px solid #333;
            margin-top: 5px;
        }

        .square { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer;
            position: relative;
        }
        
        .square img { 
            width: 80%; 
            height: 80%; 
            object-fit: contain; /* Prevents stretching */
        }

        .square.light { background-color: var(--light-sq); }
        .square.dark { background-color: var(--dark-sq); }
        .square.is-correct { background-color: var(--correct); }

        /* UI Elements */
        #stats { width: 100%; display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        #story-box { background: #000; padding: 10px; border-left: 5px solid var(--terminal-green); width: 100%; margin-bottom: 5px; }
        #objective-text { font-size: 1.1rem; margin: 0; }
        
        /* Welcome Card adjustments */
        .welcome-card { background: rgba(0,0,0,0.9); padding: 20px; border: 2px solid var(--lab-blue); border-radius: 15px; width: 90%; }
        input { width: 100%; padding: 12px; margin: 8px 0; font-size: 1.1rem; box-sizing: border-box; }
        .btn-main { background: var(--lab-blue); width: 100%; padding: 15px; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen active-screen">
        <div class="welcome-card">
            <h2 style="color:var(--lab-blue)">MASTER CODE LAB</h2>
            <input type="text" id="kid-name" placeholder="Enter Name">
            <input type="password" id="kid-code" placeholder="Station Code">
            <button class="btn-main" onclick="startNewGame()">START SESSION</button>
            <div id="leaderboard-list" style="margin-top:10px; font-size: 0.8rem;">Syncing Database...</div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="stats">
            <span>👤 <span id="display-name"></span></span>
            <span>❤️ 3</span>
            <span style="color:var(--accent)">⏳ <span id="seconds">60</span>s</span>
        </div>
        <div id="story-box">
            <div style="color: var(--terminal-green); font-weight: bold;">STAGE 01</div>
            <p id="objective-text">Scrambled data detected! Reset the pieces.</p>
        </div>
        <div id="board" class="board"></div>
    </div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
      authDomain: "assignments-de95a.firebaseapp.com",
      databaseURL: "https://assignments-de95a-default-rtdb.firebaseio.com", 
      projectId: "assignments-de95a",
      storageBucket: "assignments-de95a.firebasestorage.app",
      messagingSenderId: "1088073398299",
      appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let playerName = "";
    let timeLeft = 60;
    let currentBoard = [];
    let selectedIndex = null;

    const pieceImages = {
        'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg', 'P': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
        'r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg', 'n': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        'b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg', 'q': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
        'k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg', 'R': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        'N': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg', 'B': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
        'Q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg', 'K': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };

    const s1Starting = ['r','n','b','q','k','b','n','r','p','p','p','p','p','p','p','p','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','P','P','P','P','P','P','P','P','R','N','B','Q','K','B','N','R'];

    function startNewGame() {
        playerName = document.getElementById('kid-name').value;
        if(!playerName) return alert("Enter Name");
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('game-screen').classList.add('active-screen');
        document.getElementById('display-name').innerText = playerName;
        initGame();
    }

    function initGame() {
        currentBoard = [...s1Starting].sort(() => Math.random() - 0.5);
        renderBoard();
        setInterval(() => {
            if(timeLeft > 0) {
                timeLeft--;
                document.getElementById('seconds').innerText = timeLeft;
            }
        }, 1000);
    }

    function renderBoard() {
        const b = document.getElementById('board');
        b.innerHTML = '';
        currentBoard.forEach((p, i) => {
            const sq = document.createElement('div');
            sq.className = `square ${(Math.floor(i/8)+i)%2?'dark':'light'}`;
            if(p === s1Starting[i] && p !== '') sq.classList.add('is-correct');
            if(p) {
                const img = document.createElement('img');
                img.src = pieceImages[p];
                sq.appendChild(img);
            }
            sq.onclick = () => {
                if(selectedIndex === null) {
                    selectedIndex = i;
                } else {
                    [currentBoard[i], currentBoard[selectedIndex]] = [currentBoard[selectedIndex], currentBoard[i]];
                    selectedIndex = null;
                    renderBoard();
                    if(currentBoard.every((v, idx) => v === s1Starting[idx])) {
                        db.ref('leaderboard/' + playerName).set({name: playerName, score: timeLeft * 10});
                        alert("Done!"); location.reload();
                    }
                }
            };
            b.appendChild(sq);
        });
    }

    db.ref('leaderboard').on('value', snap => {
        let players = [];
        snap.forEach(c => { players.push(c.val()); });
        document.getElementById('leaderboard-list').innerText = "Top Score: " + (players[0]?.score || 0);
    });
</script>
</body>
</html>
