<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Chess Missions</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        #board-container { width: 350px; max-width: 95vw; margin: 10px auto; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .hidden { display: none !important; }
        .btn { padding: 12px 20px; margin: 5px; cursor: pointer; border-radius: 8px; border: none; background: var(--primary); color: white; font-weight: bold; width: 100%; }
        #results-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.5); z-index: 2000; width: 85%; max-height: 70vh; overflow-y: auto; }
        .leaderboard-entry { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; }
        #task-text { background: #fff; padding: 12px; border-radius: 8px; border-left: 4px solid var(--secondary); margin-bottom: 10px; width: 90%; font-size: 14px; min-height: 40px; }
        .highlight-selected { background-color: rgba(255, 255, 0, 0.6) !important; }
    </style>
</head>
<body>

    <h1>♟️ Weekly Missions</h1>

    <div id="setup-area">
        <h3>Select Grade:</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button class="btn" onclick="initMission(1)">Grade 1</button>
            <button class="btn" onclick="initMission(2)">Grade 2</button>
            <button class="btn" onclick="initMission(3)">Grade 3</button>
            <button class="btn" onclick="initMission(4)">Grade 4</button>
            <button class="btn" onclick="initMission(5)">Grade 5</button>
            <button class="btn" onclick="initMission(6)">Grade 6</button>
        </div>
    </div>

    <div id="game-area" class="hidden">
        <div id="task-text">Mission loading...</div>
        <div id="board-container"><div id="myBoard"></div></div>
        <h3>Score: <span id="current-score">0</span> / 5</h3>
    </div>

    <div id="post-game" class="hidden">
        <h2>Mission Accomplished! 🎉</h2>
        <button class="btn" style="background:var(--secondary); margin-bottom:15px;" onclick="fetchLeaderboard()">🏆 Check Results & Leaderboard</button>
        <button class="btn" onclick="location.reload()">🔄 Restart Missions</button>
    </div>

    <div id="results-modal" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0">Grade <span id="lbl-grade"></span> Leaderboard</h3>
            <button onclick="document.getElementById('results-modal').classList.add('hidden')" style="padding:5px 10px;">Close</button>
        </div>
        <hr>
        <div id="leaderboard-data"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        // CONFIG UPDATED FROM SCREENSHOT
        const firebaseConfig = {
            apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
            authDomain: "assignments-de95a.firebaseapp.com",
            databaseURL: "https://assignments-de95a-default-rtdb.firebaseio.com",
            projectId: "assignments-de95a",
            storageBucket: "assignments-de95a.firebasestorage.app",
            messagingSenderId: "1088073398299",
            appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be",
            measurementId: "G-61LNTVLFX9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);

        const allQuestions = [
            { grade: 1, fen: "8/8/8/4nn2/4P3/8/8/8 w - - 0 1", move: "e4f5", task: "Capture the Knight on f5 with your Pawn!" },
            { grade: 1, fen: "8/8/8/1r3r2/8/8/8/1r3B2 w - - 0 1", move: "f1b5", task: "Capture the Rook on b5 with your Bishop!" },
            { grade: 1, fen: "8/8/8/3ppp2/8/3p1N2/8/8 w - - 0 1", move: "f3e5", task: "Capture the Pawn on e5 with your Knight!" },
            { grade: 1, fen: "8/7b/8/3b2b1/8/8/1b6/7R w - - 0 1", move: "h1h7", task: "Capture the Bishop on h7 with your Rook!" },
            { grade: 1, fen: "3r4/8/8/6r1/1r6/8/7r/3Q4 w - - 0 1", move: "d1d8", task: "Capture the Rook on d8 with your Queen!" }
        ];

        let game = new Chess();
        let board = null;
        let myGrade = 0;
        let gradeSet = [];
        let currentIdx = 0;
        let score = 0;
        let squareSelected = null;

        window.initMission = function(grade) {
            myGrade = grade;
            gradeSet = allQuestions.filter(q => q.grade === grade);
            currentIdx = 0; score = 0;
            document.getElementById("current-score").innerText = "0";
            document.getElementById("setup-area").classList.add("hidden");
            document.getElementById("game-area").classList.remove("hidden");
            loadQuestion();
        };

        function loadQuestion() {
            if (currentIdx >= gradeSet.length) { finishGame(); return; }
            const q = gradeSet[currentIdx];
            document.getElementById("task-text").innerText = q.task;
            game.load(q.fen);
            board = Chessboard('myBoard', {
                draggable: false, position: q.fen,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            $('#myBoard .square-55d63').off('click').on('click', function() {
                const sq = $(this).attr('data-square');
                if (squareSelected === null) {
                    if (game.get(sq)) {
                        squareSelected = sq;
                        $(`.square-${sq}`).addClass('highlight-selected');
                    }
                } else {
                    const moveAttempt = squareSelected + sq;
                    $('.square-55d63').removeClass('highlight-selected');
                    if (moveAttempt === gradeSet[currentIdx].move) {
                        score++;
                        currentIdx++;
                        document.getElementById("current-score").innerText = score;
                        if (currentIdx >= gradeSet.length) finishGame();
                        else setTimeout(loadQuestion, 250);
                    }
                    squareSelected = null;
                }
            });
        }

        async function finishGame() {
            // FIX: BUTTONS SHOW IMMEDIATELY
            document.getElementById("game-area").classList.add("hidden");
            document.getElementById("post-game").classList.remove("hidden");

            const name = prompt("Mission Accomplished! Enter your name for the leaderboard:");
            if (name && name.trim() !== "") {
                try {
                    await addDoc(collection(db, "leaderboard"), {
                        studentName: name.trim(),
                        gradeLevel: myGrade,
                        score: score,
                        timestamp: serverTimestamp()
                    });
                } catch (e) { console.error("Save Error:", e); }
            }
        }

        window.fetchLeaderboard = async function() {
            try {
                // QUERY MATCHES YOUR ENABLED INDEX
                const q = query(
                    collection(db, "leaderboard"), 
                    where("gradeLevel", "==", myGrade), 
                    orderBy("score", "desc")
                );
                const snap = await getDocs(q);
                let html = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    html += `<div class="leaderboard-entry"><span>${d.studentName}</span><b>${d.score}/5</b></div>`;
                });
                document.getElementById("leaderboard-data").innerHTML = html || "No entries yet!";
                document.getElementById("lbl-grade").innerText = myGrade;
                document.getElementById("results-modal").classList.remove("hidden");
            } catch (err) {
                alert("Leaderboard Error: " + err.message);
            }
        };
    </script>
</body>
</html>
