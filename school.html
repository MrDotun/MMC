<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Chess Missions</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #2D1B4D; --secondary: #4ade80; --bg: #1a1a2e; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        #board-container { width: 350px; max-width: 95vw; margin: 10px auto; border: 2px solid var(--secondary); border-radius: 8px; overflow: hidden; }
        .hidden { display: none !important; }
        .btn { padding: 12px 20px; margin: 5px; cursor: pointer; border-radius: 8px; border: 1px solid var(--secondary); background: var(--primary); color: var(--secondary); font-weight: bold; width: 100%; transition: 0.3s; }
        .btn:hover { background: var(--secondary); color: var(--bg); }
        #results-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2D1B4D; padding: 20px; border-radius: 12px; border: 2px solid var(--secondary); z-index: 2000; width: 85%; max-height: 70vh; overflow-y: auto; box-shadow: 0 0 20px rgba(0,0,0,0.7); }
        .leaderboard-entry { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #4ade8044; color: var(--secondary); }
        #task-text { background: #2D1B4D; padding: 12px; border-radius: 8px; border-left: 4px solid var(--secondary); margin-bottom: 10px; width: 90%; color: white; text-align: center; font-weight: bold; min-height: 40px; display: flex; align-items: center; justify-content: center; }
        .highlight-selected { background-color: rgba(250, 204, 21, 0.7) !important; }
        .section-label { color: var(--secondary); text-align: center; margin-top: 15px; font-weight: bold; grid-column: span 3; }
        .week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; grid-column: span 3; margin-bottom: 15px; }
        .btn-week { padding: 8px; font-size: 0.8em; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary);">♟️ Weekly Missions</h1>

    <div id="setup-area">
        <h3 style="text-align:center;">Enter Name & Select Mission:</h3>
        <input type="text" id="studentName" placeholder="Your Full Name" style="width:100%; padding:12px; margin-bottom:15px; border-radius:5px; border:1px solid #4ade80; background:#1a1a2e; color:white; box-sizing: border-box;">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
            <div class="section-label">GRADE 1</div>
            <div class="section-label" style="font-size: 0.8em; margin:0;">Term 1 | Term 2 | Term 3</div>
            <div class="week-grid">
                <button class="btn btn-week" onclick="initMission(1, 1, 1)">T1 W1</button>
                <button class="btn btn-week" onclick="initMission(1, 1, 2)">W2</button>
                <button class="btn btn-week" onclick="initMission(1, 1, 3)">W3</button>
                <button class="btn btn-week" onclick="initMission(1, 1, 4)">W4</button>
                <button class="btn btn-week" onclick="initMission(1, 1, 5)">W5</button>
                <button class="btn btn-week" onclick="initMission(1, 2, 1)">T2 W1</button>
                <button class="btn btn-week" onclick="initMission(1, 2, 2)">W2</button>
                <button class="btn btn-week" onclick="initMission(1, 2, 3)">W3</button>
                <button class="btn btn-week" onclick="initMission(1, 2, 4)">W4</button>
                <button class="btn btn-week" onclick="initMission(1, 2, 5)">W5</button>
                <button class="btn btn-week" onclick="initMission(1, 3, 1)">T3 W1</button>
                <button class="btn btn-week" onclick="initMission(1, 3, 2)">W2</button>
                <button class="btn btn-week" onclick="initMission(1, 3, 3)">W3</button>
                <button class="btn btn-week" onclick="initMission(1, 3, 4)">W4</button>
                <button class="btn btn-week" onclick="initMission(1, 3, 5)">W5</button>
            </div>

            <div class="section-label">GRADE 2</div>
             <div class="week-grid">
                <button class="btn btn-week" onclick="initMission(2, 1, 1)">T1 W1</button>
                <button class="btn btn-week" onclick="initMission(2, 1, 2)">W2</button>
                <button class="btn btn-week" onclick="initMission(2, 1, 3)">W3</button>
                <button class="btn btn-week" onclick="initMission(2, 1, 4)">W4</button>
                <button class="btn btn-week" onclick="initMission(2, 1, 5)">W5</button>
                </div>
        </div>
    </div>

    <div id="game-area" class="hidden">
        <div id="task-text">Loading Mission...</div>
        <div id="board-container"><div id="myBoard"></div></div>
        <h3 style="color:var(--secondary); text-align: center;">Missions Solved: <span id="current-score">0</span></h3>
    </div>

    <div id="post-game" class="hidden" style="text-align: center;">
        <h2 style="color:var(--secondary)">Mission Accomplished! 🎉</h2>
        <button class="btn" onclick="fetchLeaderboard()">🏆 View Leaderboard</button>
        <button class="btn" onclick="location.reload()">🔄 Restart</button>
    </div>

    <div id="results-modal" class="hidden">
        <h3 id="lbl-grade" style="color:var(--secondary);">Rankings</h3>
        <div id="leaderboard-data"></div>
        <button class="btn" onclick="document.getElementById('results-modal').classList.add('hidden')">Close</button>
    </div>

    <script>
        // Firebase config omitted for brevity - keep your existing config here
        const firebaseConfig = { /* YOUR CONFIG */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 50 questions per term = 10 per week
        function generateAllEmptyQuestions() {
            let data = [];
            for(let g=1; g<=3; g++) {
                for(let t=1; t<=3; t++) {
                    for(let w=1; w<=5; w++) {
                        for(let q=1; q<=10; q++) {
                            data.push({
                                grade: g, term: t, week: w,
                                fen: "8/8/8/8/8/8/8/8 w - - 0 1", // To be filled
                                move: "", // To be filled
                                task: `G${g} T${t} Week ${w} - Question ${q}`
                            });
                        }
                    }
                }
            }
            return data;
        }

        const allQuestions = generateAllEmptyQuestions();

        let game = new Chess();
        let board = null;
        let myGrade, myTerm, myWeek, gradeSet, currentIdx, score, pName;
        let squareSelected = null;

        window.initMission = function(grade, term, week) {
            pName = document.getElementById('studentName').value;
            if(!pName) { alert("Please enter your name!"); return; }
            
            myGrade = grade; myTerm = term; myWeek = week;
            
            // FILTER BY GRADE, TERM, AND WEEK
            gradeSet = allQuestions.filter(q => q.grade === grade && q.term === term && q.week === week);
            
            document.getElementById("setup-area").classList.add("hidden");
            document.getElementById("game-area").classList.remove("hidden");
            currentIdx = 0; score = 0;
            loadQuestion();
        };

        function loadQuestion() {
            if (currentIdx >= gradeSet.length) { finishGame(); return; }
            const q = gradeSet[currentIdx];
            document.getElementById("task-text").innerText = q.task;
            game.load(q.fen);
            board = ChessBoard('myBoard', {
                draggable: false, 
                position: q.fen,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            $('.square-55d63').off('click').on('click', function() {
                const sq = $(this).attr('data-square');
                if (squareSelected === null) {
                    if (game.get(sq)) {
                        squareSelected = sq;
                        $(`.square-${sq}`).addClass('highlight-selected');
                    }
                } else {
                    const moveAttempt = squareSelected + sq;
                    $('.square-55d63').removeClass('highlight-selected');
                    if (moveAttempt === gradeSet[currentIdx].move && moveAttempt !== "") {
                        score++; currentIdx++;
                        document.getElementById("current-score").innerText = score;
                        squareSelected = null;
                        setTimeout(loadQuestion, 300);
                    } else {
                        squareSelected = null;
                    }
                }
            });
        }

        function finishGame() {
            document.getElementById("game-area").classList.add("hidden");
            document.getElementById("post-game").classList.remove("hidden");
            db.collection("weekly_missions").add({
                name: pName, grade: myGrade, term: myTerm, week: myWeek,
                score: score, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        window.fetchLeaderboard = function() {
            document.getElementById("results-modal").classList.remove("hidden");
            db.collection("weekly_missions")
              .where("grade", "==", myGrade)
              .where("term", "==", myTerm)
              .where("week", "==", myWeek) // Filter by week too!
              .get().then((snap) => {
                let html = "";
                let data = [];
                snap.forEach(doc => data.push(doc.data()));
                data.sort((a,b) => b.score - a.score);
                data.forEach(d => {
                    html += `<div class="leaderboard-entry"><span>${d.name}</span><b>${d.score} solved</b></div>`;
                });
                document.getElementById("leaderboard-data").innerHTML = html || "No records for this week.";
            });
        };
    </script>
</body>
</html>
