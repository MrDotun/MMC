<!DOCTYPE html>
<html lang="en">
<head>
<style>
  /* The Board Container */
  .board {
    display: grid;
    grid-template-columns: repeat(8, 80px); /* Large squares */
    grid-template-rows: repeat(8, 80px);
    border: 8px solid #333;
    width: fit-content;
    user-select: none;
  }

  /* Base Square Styling */
  .square {
    width: 80px;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Colors: Classic Tournament Green & White */
  .white-sq { background-color: #f0d9b5; } /* Off-white for better contrast */
  .green-sq { background-color: #4b7399; } /* Blue-green tournament shade */

  /* Piece Styling */
  .piece {
    font-size: 65px;      /* Large, readable size */
    opacity: 1;           /* Fully opaque/solid */
    line-height: 1;
    cursor: grab;
  }

  /* Piece Colors */
  .black-p { color: #000000; }
  .white-p { 
    color: #ffffff; 
    filter: drop-shadow(0 0 2px rgba(0,0,0,0.5)); /* Adds a slight outline to white pieces */
  }
</style>
</head>
<body>

<div class="board">
  <div class="square white-sq"><span class="piece black-p">♜</span></div>
  <div class="square green-sq"><span class="piece black-p">♞</span></div>
  <div class="square white-sq"><span class="piece black-p">♝</span></div>
  <div class="square green-sq"><span class="piece black-p">♛</span></div>
  <div class="square white-sq"><span class="piece black-p">♚</span></div>
  <div class="square green-sq"><span class="piece black-p">♝</span></div>
  <div class="square white-sq"><span class="piece black-p">♞</span></div>
  <div class="square green-sq"><span class="piece black-p">♜</span></div>

  <div class="square green-sq"><span class="piece black-p">♟</span></div>
  <div class="square white-sq"><span class="piece black-p">♟</span></div>
  <div class="square green-sq"><span class="piece black-p">♟</span></div>
  <div class="square white-sq"><span class="piece black-p">♟</span></div>
  <div class="square green-sq"><span class="piece black-p">♟</span></div>
  <div class="square white-sq"><span class="piece black-p">♟</span></div>
  <div class="square green-sq"><span class="piece black-p">♟</span></div>
  <div class="square white-sq"><span class="piece black-p">♟</span></div>

  <div class="square white-sq"></div><div class="square green-sq"></div>
  <div class="square white-sq"></div><div class="square green-sq"></div>
  <div class="square white-sq"></div><div class="square green-sq"></div>
  <div class="square white-sq"></div><div class="square green-sq"></div>
  <div class="square green-sq"></div><div class="square white-sq"></div>
  <div class="square green-sq"></div><div class="square white-sq"></div>
  <div class="square green-sq"></div><div class="square white-sq"></div>
  <div class="square green-sq"></div><div class="square white-sq"></div>
  <div class="square white-sq"></div><div class="square green-sq"></div>
  <div class="square white-sq"></div><div class="square green-sq"></div>
  <div class="square white-sq"></div><div class="square green-sq"></div>
  <div class="square white-sq"></div><div class="square green-sq"></div>
  <div class="square green-sq"></div><div class="square white-sq"></div>

  <div class="square green-sq"></div><div class="square white-sq"></div>

  <div class="square white-sq"><span class="piece white-p">♙</span></div>

</body>
</html>
