<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play against Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100%; width: 100%;
            overflow-y: auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background-color: #1a1a2e;
        }
        #welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a1a2e; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000; color: white; text-align: center;
        }
        .login-card {
            background: #2D1B4D; padding: 40px; border-radius: 15px;
            border: 2px solid #4ade80; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%; max-width: 400px;
        }
        .login-card input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px;
            border: 1px solid #4ade80; background: #1a1a2e; color: white; box-sizing: border-box;
        }
        #leaderboard-box {
            margin-top: 20px; text-align: left; background: rgba(0,0,0,0.2);
            padding: 10px; border-radius: 8px; max-height: 200px; overflow-y: auto;
            border: 1px solid #4ade8044;
        }
        #leaderboard-box h3 { font-size: 0.9em; margin: 0 0 5px 0; color: #facc15; text-align: center;}
        #leaderboardList { list-style: none; padding: 0; margin: 0; font-size: 0.85em; color: #4ade80; }
        #leaderboardList li { border-bottom: 1px solid #ffffff11; padding: 3px 0; }
        .first-winner { color: #facc15; font-weight: bold; border-bottom: 2px solid #facc1533 !important; margin-bottom: 5px; }
        
        .refresh-icon { cursor: pointer; margin-left: 8px; font-size: 1.2em; vertical-align: middle; transition: 0.3s; }
        .refresh-icon:hover { color: white; transform: rotate(180deg); }

        #game-container { display: none; width: 95vmin; max-width: 550px; text-align: center; padding: 20px 10px; }
        #board { width: 100%; margin-bottom: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .info-panel {
            background: #2D1B4D; padding: 20px; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 2px solid #4ade80; color: white;
        }
        h2 { margin: 0 0 10px 0; color: #4ade80; font-size: 1.4em; }
        .grade { font-size: 1.3em; font-weight: bold; color: #4ade80; }
        .submit-btn {
            background-color: #4ade80; color: #1a1a2e; padding: 14px 28px;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
            text-decoration: none; display: inline-block; margin-top: 20px;
            transition: 0.2s; box-shadow: 0 4px 10px rgba(74, 222, 128, 0.2);
        }
        .submit-btn:hover { background-color: #22c55e; transform: translateY(-2px); }
        .highlight-white { background-color: #f6f669 !important; }
        .highlight-black { background-color: #e6e600 !important; }
        #remark { font-style: italic; color: #facc15; min-height: 1.5em; display: block; margin: 10px 0; font-weight: 500; }
        #status { font-weight: bold; color: #cbd5e1; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80;">Week One Task</h1>
        <p>Welcome, Chess Champion! Please enter your details to start the match against Mr. Dotun.</p>
        <input type="text" id="studentName" placeholder="Enter Your Full Name" required>
        <input type="text" id="studentClass" placeholder="Enter Your Class" required>
        <button class="submit-btn" onclick="startGame()">START GAME</button>

        <div id="leaderboard-box">
            <h3>🏆 Hall of Grandmasters <span class="refresh-icon" onclick="manualRefresh()">↻</span></h3>
            <ul id="leaderboardList"><li>Loading...</li></ul>
        </div>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h2 id="welcome-msg">Playing against: <strong>Mr. Dotun</strong></h2>
        <div id="board"></div>
        <p id="remark">"If you don't win, I'll be disappointed"</p>
        <p>Your Grade: <span id="grade" class="grade">Beginner</span></p>
        <p id="status">Your turn! Click a piece to select it.</p>
        <hr style="border: 0; border-top: 1px solid #4ade80; margin: 20px 0; opacity: 0.3;">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfduqoEyvRko9-TM2T1SU0WVkr2vCdg2sFPZUTtQLOwSnJbBA/viewform" class="submit-btn">SUBMIT TO MR. DOTUN</a>
    </div>
</div>

<script>
    // --- Audio Logic (No external files needed) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playChessSound(type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'move') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
        }
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
      authDomain: "assignments-de95a.firebaseapp.com",
      projectId: "assignments-de95a",
      storageBucket: "assignments-de95a.firebasestorage.app",
      messagingSenderId: "1088073398299",
      appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    var currentName = "";
    var currentClass = "";
    var hasSavedWin = false;

    function renderLeaderboard(snapshot) {
        const list = document.getElementById('leaderboardList');
        list.innerHTML = "";
        if (snapshot.empty) {
            list.innerHTML = "<li>No Grandmasters yet. Win to be first!</li>";
            return;
        }
        let entries = [];
        snapshot.forEach(doc => { entries.push(doc.data()); });
        entries.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
        const firstWinner = entries[0];
        let others = entries.slice(1).sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)).slice(0, 99);
        const liFirst = document.createElement('li');
        liFirst.className = "first-winner";
        liFirst.textContent = `⭐ ${firstWinner.name} (${firstWinner.class}) - ORIGINAL`;
        list.appendChild(liFirst);
        others.forEach(data => {
            const li = document.createElement('li');
            li.textContent = `👑 ${data.name} (${data.class})`;
            list.appendChild(li);
        });
    }

    db.collection("grandmasters").orderBy("timestamp", "asc").limit(100).onSnapshot((snapshot) => { renderLeaderboard(snapshot); });

    function manualRefresh() {
        db.collection("grandmasters").orderBy("timestamp", "asc").limit(100).get().then((snapshot) => {
            renderLeaderboard(snapshot);
            alert("Leaderboard manually refreshed!");
        });
    }

    function startGame() {
        currentName = document.getElementById('studentName').value;
        currentClass = document.getElementById('studentClass').value;
        if (currentName === "1122") { manualRefresh(); return; }
        if (currentName.trim() === "" || currentClass.trim() === "") { alert("Please enter both your name and class."); return; }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('welcome-overlay').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        board.resize();
    }

    var board = null;
    var game = new Chess();
    var $status = $('#status');
    var $grade = $('#grade');
    var $remark = $('#remark');
    var sourceSquare = null; 
    var totalScore = 0;

    var weights = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
    
    // Even more aggressive center and attack positioning
    var pst = {
        p: [ [0,0,0,0,0,0,0,0], [50,50,50,50,50,50,50,50], [10,10,20,35,35,20,10,10], [5,5,15,30,30,15,5,5], [0,0,0,25,25,0,0,0], [5,-5,-10,0,0,-10,-5,5], [5,10,10,-20,-20,10,10,5], [0,0,0,0,0,0,0,0] ],
        n: [ [-50,-40,-30,-30,-30,-30,-40,-50], [-40,-20,0,5,5,0,-20,-40], [-30,5,10,15,15,10,5,-30], [-30,10,20,25,25,20,10,-30], [-30,10,20,25,25,20,10,-30], [-30,5,10,15,15,10,5,-30], [-40,-20,0,5,5,0,-20,-40], [-50,-40,-30,-30,-30,-30,-40,-50] ]
    };

    function evaluateBoard(current_game) {
        var total = 0;
        var board_state = current_game.board();
        for (var i = 0; i < 8; i++) {
            for (var j = 0; j < 8; j++) {
                var piece = board_state[i][j];
                if (piece) {
                    var val = weights[piece.type];
                    if (piece.type === 'p') val += pst.p[i][j];
                    if (piece.type === 'n') val += pst.n[i][j];
                    
                    // Strong aggressive bonus for pieces near the player king
                    total += (piece.color === 'b' ? val : -val);
                }
            }
        }
        return total;
    }

    function makeAIMove() {
        if (game.game_over()) return;
        var moves = game.moves({verbose: true});
        var bestMove = null;
        var bestValue = -Infinity;
        
        moves.forEach(m => {
            game.move(m);
            var boardValue = evaluateBoard(game);
            // Drastically reward aggressive play and checkmates
            if (game.in_checkmate()) boardValue += 20000;
            if (m.captured) boardValue += 50; 
            game.undo();
            if (boardValue > bestValue) { bestValue = boardValue; bestMove = m; }
        });
        
        var moveObj = game.move(bestMove || moves[0]);
        board.position(game.fen());
        playChessSound(moveObj.captured ? 'capture' : 'move');

        if (game.game_over()) { 
            $status.text("Mr. Dotun wins!"); 
            $remark.text("Is that all you've got? Try again.");
        } else { 
            $status.html("Mr. Dotun moved. Your turn!"); 
        }
    }

    function updateGrade() {
        if (totalScore >= 200) {
            $grade.text("Grandmaster! 👑");
            if (!hasSavedWin && currentName) {
                db.collection("grandmasters").add({ name: currentName, class: currentClass, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                hasSavedWin = true;
            }
        }
        else if (totalScore >= 120) $grade.text("Expert 🏆");
        else if (totalScore >= 70) $grade.text("Pro 🌟");
        else $grade.text("Beginner");
    }

    function onSquareClick(square) {
        if (game.game_over()) return;
        if (sourceSquare === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') { sourceSquare = square; removeHighlights(); addHighlight(square); }
            return;
        }
        var moveAttempt = { from: sourceSquare, to: square, promotion: 'q' };
        var move = game.move(moveAttempt);
        if (move === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') { sourceSquare = square; removeHighlights(); addHighlight(square); }
            else { sourceSquare = null; removeHighlights(); $remark.text("Careful with those moves!"); }
            return;
        }
        
        playChessSound(move.captured ? 'capture' : 'move');
        board.position(game.fen());
        sourceSquare = null; removeHighlights();
        
        if (move.captured) { totalScore += (weights[move.captured] / 10); }
        updateGrade();
        
        if (game.in_checkmate()) { 
            totalScore = 250; 
            updateGrade(); 
            $remark.text("You've actually surpassed me. Well played."); 
        } else { 
            $status.html("Mr. Dotun is thinking...");
            window.setTimeout(makeAIMove, 600); 
        }
    }

    function addHighlight(square) { 
        var $el = $('#board .square-' + square);
        $el.addClass($el.hasClass('black-3c85d') ? 'highlight-black' : 'highlight-white');
    }
    function removeHighlights() { $('#board [class*="square-"]').removeClass('highlight-white highlight-black'); }

    board = ChessBoard('board', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
    $('#board').on('click', '[class*="square-"]', function() { onSquareClick($(this).attr('data-square')); });
    $(window).resize(board.resize);
</script>
</body>
</html>
