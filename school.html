<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Chess Missions</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #2D1B4D; --secondary: #4ade80; --bg: #1a1a2e; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        #board-container { width: 350px; max-width: 95vw; margin: 10px auto; border: 2px solid var(--secondary); border-radius: 8px; overflow: hidden; }
        .hidden { display: none !important; }
        .btn { padding: 12px 20px; margin: 5px; cursor: pointer; border-radius: 8px; border: 1px solid var(--secondary); background: var(--primary); color: var(--secondary); font-weight: bold; width: 100%; max-width: 300px; }
        .btn:hover { background: var(--secondary); color: var(--bg); }
        #results-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2D1B4D; padding: 20px; border-radius: 12px; border: 2px solid var(--secondary); z-index: 2000; width: 85%; max-height: 70vh; overflow-y: auto; }
        .leaderboard-entry { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #4ade8044; color: var(--secondary); }
        #task-text { background: #2D1B4D; padding: 12px; border-radius: 8px; border-left: 4px solid var(--secondary); margin-bottom: 10px; width: 90%; color: white; }
        .highlight-selected { background-color: rgba(250, 204, 21, 0.6) !important; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary);">♟️ Weekly Missions</h1>

    <div id="setup-area">
        <h3 style="text-align:center;">Select Your Grade:</h3>
        <input type="text" id="studentName" placeholder="Full Name" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #4ade80; background:#1a1a2e; color:white;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button class="btn" onclick="initMission(1)">Grade 1</button>
            <button class="btn" onclick="initMission(2)">Grade 2</button>
            <button class="btn" onclick="initMission(3)">Grade 3</button>
            <button class="btn" onclick="initMission(4)">Grade 4</button>
            <button class="btn" onclick="initMission(5)">Grade 5</button>
            <button class="btn" onclick="initMission(6)">Grade 6</button>
        </div>
    </div>

    <div id="game-area" class="hidden">
        <div id="task-text">Loading Mission...</div>
        <div id="board-container"><div id="myBoard"></div></div>
        <h3 style="color:var(--secondary)">Score: <span id="current-score">0</span> / 5</h3>
    </div>

    <div id="post-game" class="hidden">
        <h2 style="color:var(--secondary)">Mission Accomplished! 🎉</h2>
        <button class="btn" style="background:var(--secondary); color:black;" onclick="fetchLeaderboard()">🏆 View Leaderboard</button>
        <button class="btn" onclick="location.reload()">🔄 Try Again</button>
    </div>

    <div id="results-modal" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; color:var(--secondary);">Grade <span id="lbl-grade"></span> Top Scores</h3>
            <button onclick="document.getElementById('results-modal').classList.add('hidden')" style="background:none; border:1px solid #4ade80; color:#4ade80; border-radius:4px;">X</button>
        </div>
        <hr style="border:0; border-top:1px solid #4ade8044; margin:10px 0;">
        <div id="leaderboard-data"></div>
    </div>

    <script>
        // --- SAME FIREBASE CONFIG & VERSION 8 STYLE ---
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const allQuestions = [
            { grade: 1, fen: "8/8/8/4nn2/4P3/8/8/8 w - - 0 1", move: "e4f5", task: "Capture the Knight on f5 with your Pawn!" },
            { grade: 1, fen: "8/8/8/1r3r2/8/8/8/1r3B2 w - - 0 1", move: "f1b5", task: "Capture the Rook on b5 with your Bishop!" },
            { grade: 1, fen: "8/8/8/3ppp2/8/3p1N2/8/8 w - - 0 1", move: "f3e5", task: "Capture the Pawn on e5 with your Knight!" },
            { grade: 1, fen: "8/7b/8/3b2b1/8/8/1b6/7R w - - 0 1", move: "h1h7", task: "Capture the Bishop on h7 with your Rook!" },
            { grade: 1, fen: "3r4/8/8/6r1/1r6/8/7r/3Q4 w - - 0 1", move: "d1d8", task: "Capture the Rook on d8 with your Queen!" }
        ];

        let game = new Chess();
        let board = null;
        let myGrade = 0;
        let gradeSet = [];
        let currentIdx = 0;
        let score = 0;
        let squareSelected = null;
        let pName = "";

        window.initMission = function(grade) {
            pName = document.getElementById('studentName').value;
            if(!pName) { alert("Please enter your name first!"); return; }
            myGrade = grade;
            gradeSet = allQuestions.filter(q => q.grade === grade);
            currentIdx = 0; score = 0;
            document.getElementById("setup-area").classList.add("hidden");
            document.getElementById("game-area").classList.remove("hidden");
            loadQuestion();
        };

        function loadQuestion() {
            if (currentIdx >= gradeSet.length) { finishGame(); return; }
            const q = gradeSet[currentIdx];
            document.getElementById("task-text").innerText = "Mission " + (currentIdx + 1) + ": " + q.task;
            game.load(q.fen);
            board = ChessBoard('myBoard', {
                draggable: false, position: q.fen,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            $('#myBoard .square-55d63').off('click').on('click', function() {
                const sq = $(this).attr('data-square');
                if (squareSelected === null) {
                    if (game.get(sq)) {
                        squareSelected = sq;
                        $(`.square-${sq}`).addClass('highlight-selected');
                    }
                } else {
                    const moveAttempt = squareSelected + sq;
                    $('.square-55d63').removeClass('highlight-selected');
                    if (moveAttempt === gradeSet[currentIdx].move) {
                        score++;
                        currentIdx++;
                        document.getElementById("current-score").innerText = score;
                        if (currentIdx >= gradeSet.length) finishGame();
                        else setTimeout(loadQuestion, 300);
                    }
                    squareSelected = null;
                }
            });
        }

        function finishGame() {
            document.getElementById("game-area").classList.add("hidden");
            document.getElementById("post-game").classList.remove("hidden");

            // Using the same collection "grandmasters" or a new one? 
            // I'll use "mission_scores" to keep it separate from Mr. Dotun's list.
            db.collection("mission_scores").add({
                name: pName,
                grade: myGrade,
                score: score,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        window.fetchLeaderboard = function() {
            db.collection("mission_scores")
              .where("grade", "==", myGrade)
              .orderBy("score", "desc")
              .limit(20)
              .get().then((querySnapshot) => {
                let html = "";
                querySnapshot.forEach((doc) => {
                    const d = doc.data();
                    html += `<div class="leaderboard-entry"><span>${d.name}</span><b>${d.score}/5</b></div>`;
                });
                document.getElementById("leaderboard-data").innerHTML = html || "No scores yet!";
                document.getElementById("lbl-grade").innerText = myGrade;
                document.getElementById("results-modal").classList.remove("hidden");
            }).catch(err => {
                alert("Wait! If you see an error, click the blue link in your console to enable the index.");
                console.log(err.message);
            });
        };
    </script>
</body>
</html>
