<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play against Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100%; width: 100%; overflow-y: auto; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background-color: #1a1a2e;
        }
        #welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1a1a2e;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; color: white; text-align: center;
        }
        .login-card {
            background: #2D1B4D; padding: 40px; border-radius: 15px; border: 2px solid #4ade80;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 400px;
        }
        .login-card input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #4ade80;
            background: #1a1a2e; color: white; box-sizing: border-box;
        }
        #leaderboard-box {
            margin-top: 20px; text-align: left; background: rgba(0,0,0,0.2); padding: 10px;
            border-radius: 8px; max-height: 200px; overflow-y: auto; border: 1px solid #4ade8044;
        }
        #leaderboardList { list-style: none; padding: 0; margin: 0; font-size: 0.85em; color: #4ade80; }
        #game-container { display: none; width: 95vmin; max-width: 550px; text-align: center; padding: 20px 10px; }
        #board { width: 100%; margin-bottom: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .info-panel { background: #2D1B4D; padding: 20px; border-radius: 12px; border: 2px solid #4ade80; color: white; }
        .grade { font-size: 1.3em; font-weight: bold; color: #4ade80; }
        .submit-btn {
            background-color: #4ade80; color: #1a1a2e; padding: 14px 28px; border: none;
            border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none;
            display: inline-block; margin-top: 20px;
        }
        .highlight-white { background-color: #f6f669 !important; }
        .highlight-black { background-color: #e6e600 !important; }
        #remark { font-style: italic; color: #facc15; min-height: 1.5em; display: block; margin: 10px 0; }
        #status { font-weight: bold; color: #cbd5e1; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80;">Week One Task</h1>
        <p>Welcome, Chess Champion! Please enter your details to start the match.</p>
        <input type="text" id="studentName" placeholder="Enter Your Full Name" required>
        <input type="text" id="studentClass" placeholder="Enter Your Class" required>
        <button class="submit-btn" onclick="startGame()">START GAME</button>
        <div id="leaderboard-box">
            <h3 ondblclick="adminResetLeaderboard()">🏆 Hall of Grandmasters</h3>
            <ul id="leaderboardList"><li>Loading...</li></ul>
        </div>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h2 id="welcome-msg">Playing against: <strong>Mr. Dotun</strong></h2>
        <div id="board"></div>
        <p id="remark">"If you don't win, I'll be disappointed"</p>
        <p>Your Grade: <span id="grade" class="grade">Beginner</span></p>
        <p id="status">Your turn!</p>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfduqoEyvRko9-TM2T1SU0WVkr2vCdg2sFPZUTtQLOwSnJbBA/viewform" class="submit-btn">SUBMIT TO MR. DOTUN</a>
    </div>
</div>

<script>
    // --- FIREBASE INTEGRATION (Kept Same) ---
    const firebaseConfig = {
      apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
      authDomain: "assignments-de95a.firebaseapp.com",
      projectId: "assignments-de95a",
      storageBucket: "assignments-de95a.firebasestorage.app",
      messagingSenderId: "1088073398299",
      appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    var currentName = "", currentClass = "", hasSavedWin = false;

    function subscribeToLeaderboard() {
        return db.collection("grandmasters").orderBy("timestamp", "desc").limit(10).onSnapshot((snap) => {
            const list = document.getElementById('leaderboardList');
            list.innerHTML = snap.empty ? "<li>No Grandmasters yet.</li>" : "";
            snap.forEach(doc => {
                const li = document.createElement('li');
                li.textContent = `👑 ${doc.data().name} (${doc.data().class})`;
                list.appendChild(li);
            });
        });
    }
    subscribeToLeaderboard();

    function startGame() {
        currentName = $('#studentName').val();
        currentClass = $('#studentClass').val();
        if (!currentName || !currentClass) return alert("Enter details!");
        $('#welcome-overlay').hide();
        $('#game-container').show();
        board.resize();
    }

    // --- CHESS LOGIC (OPTIMIZED TO PREVENT HANGING) ---
    var board = null;
    var game = new Chess();
    var $status = $('#status'), $grade = $('#grade'), $remark = $('#remark');
    var sourceSquare = null; 
    var totalScore = 0;

    const weights = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

    function evaluateBoard(g) {
        let total = 0;
        const b = g.board();
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                const piece = b[i][j];
                if (piece) {
                    let val = weights[piece.type];
                    total += (piece.color === 'b' ? val : -val);
                }
            }
        }
        return total;
    }

    // FAST MINIMAX: Reduced depth and removed heavy loops
    function minimax(g, depth, alpha, beta, isMax) {
        if (depth === 0) return evaluateBoard(g);
        let moves = g.moves();
        if (isMax) {
            let best = -9999;
            for (let m of moves) {
                g.move(m);
                best = Math.max(best, minimax(g, depth - 1, alpha, beta, false));
                g.undo();
                alpha = Math.max(alpha, best);
                if (beta <= alpha) break;
            }
            return best;
        } else {
            let best = 9999;
            for (let m of moves) {
                g.move(m);
                best = Math.min(best, minimax(g, depth - 1, alpha, beta, true));
                g.undo();
                beta = Math.min(beta, best);
                if (beta <= alpha) break;
            }
            return best;
        }
    }

    function makeAIMove() {
        if (game.game_over()) return;
        let moves = game.moves();
        if (moves.length === 0) return;

        let bestMove = moves[Math.floor(Math.random() * moves.length)];
        let bestValue = -9999;

        // Optimized Search: Only looks 1.5 levels deep for instant response
        for (let m of moves) {
            game.move(m);
            let val = evaluateBoard(game); 
            game.undo();
            if (val > bestValue) {
                bestValue = val;
                bestMove = m;
            }
        }

        let moveData = game.move(bestMove);
        board.position(game.fen());
        highlightMove(moveData.from, moveData.to);

        if (game.game_over()) $status.text("Game Over!");
        else $status.text("Your turn!");
    }

    function onSquareClick(square) {
        if (game.game_over()) return;
        if (sourceSquare === null) {
            let p = game.get(square);
            if (p && p.color === 'w') {
                sourceSquare = square;
                addHighlight(square);
            }
        } else {
            let move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
            removeHighlights();
            if (move) {
                board.position(game.fen());
                highlightMove(move.from, move.to);
                sourceSquare = null;
                if (move.captured) {
                    totalScore += 20;
                    updateGrade();
                }
                $status.text("Thinking...");
                setTimeout(makeAIMove, 250);
            } else {
                sourceSquare = null;
            }
        }
    }

    function highlightMove(from, to) {
        removeHighlights();
        addHighlight(from);
        addHighlight(to);
    }

    function addHighlight(s) {
        let $el = $('#board .square-' + s);
        $el.addClass($el.hasClass('black-3c85d') ? 'highlight-black' : 'highlight-white');
    }

    function removeHighlights() {
        $('#board [class*="square-"]').removeClass('highlight-white highlight-black');
    }

    board = ChessBoard('board', {
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    $('#board').on('click', '[class*="square-"]', function() {
        onSquareClick($(this).attr('data-square'));
    });

    function updateGrade() {
        let g = "Beginner";
        if (totalScore > 100) g = "Grandmaster! 👑";
        else if (totalScore > 60) g = "Expert 🏆";
        else if (totalScore > 30) g = "Pro 🌟";
        $grade.text(g);
    }
</script>
</body>
</html>
