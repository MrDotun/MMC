<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Chess - Click to Move</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; }
        #board { display: grid; grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); border: 5px solid #34495e; user-select: none; }
        .square { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .white { background-color: #ecf0f1; }
        .black { background-color: #95a5a6; }
        .selected { background-color: #f1c40f !important; }
        .highlight { background-color: #2ecc71 !important; opacity: 0.8; }
        .piece { width: 50px; height: 50px; z-index: 2; pointer-events: none; }
        #status { margin: 20px; font-size: 1.2rem; font-weight: bold; }
        button { padding: 10px 20px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>AI Chess (You: White)</h2>
    <div id="status">Your Turn</div>
    <div id="board"></div>
    <br>
    <button onclick="resetGame()">Reset Game</button>

<script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const game = new Chess();
    let selectedSquare = null;

    // SVG Piece Definitions (Zero loading issues)
    const piecesSVG = {
        w: { p: '♙', r: '♖', n: '♘', b: '♗', q: '♕', k: '♔' },
        b: { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' }
    };

    function createBoard() {
        boardEl.innerHTML = '';
        const board = game.board();
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const squareName = String.fromCharCode(97 + c) + (8 - r);
                const square = document.createElement('div');
                square.classList.add('square', (r + c) % 2 === 0 ? 'white' : 'black');
                square.dataset.square = squareName;
                
                const piece = board[r][c];
                if (piece) {
                    const pieceEl = document.createElement('div');
                    pieceEl.className = 'piece';
                    pieceEl.style.fontSize = "40px";
                    pieceEl.style.color = piece.color === 'w' ? '#000' : '#444';
                    pieceEl.innerText = piecesSVG[piece.color][piece.type];
                    square.appendChild(pieceEl);
                }

                square.onclick = () => handleSquareClick(squareName);
                boardEl.appendChild(square);
            }
        }
    }

    function handleSquareClick(square) {
        if (game.game_over()) return;

        const moves = game.moves({ square: square, verbose: true });

        // If clicking a piece of your own color
        if (game.get(square) && game.get(square).color === 'w') {
            selectedSquare = square;
            updateHighlights(moves);
            return;
        }

        // If clicking a destination square
        if (selectedSquare) {
            const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
            if (move) {
                selectedSquare = null;
                render();
                setTimeout(makeAIMove, 500);
            }
        }
    }

    function updateHighlights(legalMoves) {
        render(); // Clear previous highlights
        const squares = document.querySelectorAll('.square');
        squares.forEach(s => {
            if (s.dataset.square === selectedSquare) s.classList.add('selected');
            if (legalMoves.some(m => m.to === s.dataset.square)) s.classList.add('highlight');
        });
    }

    // A simple MiniMax-style AI (Random + Basic Capture Logic)
    function makeAIMove() {
        if (game.game_over()) return;
        
        const moves = game.moves();
        // Priority: Capture pieces if possible, otherwise random
        const captureMoves = moves.filter(m => m.includes('x'));
        const move = captureMoves.length > 0 
            ? captureMoves[Math.floor(Math.random() * captureMoves.length)]
            : moves[Math.floor(Math.random() * moves.length)];
            
        game.move(move);
        render();
    }

    function render() {
        createBoard();
        if (game.in_checkmate()) statusEl.innerText = "Checkmate!";
        else if (game.in_draw()) statusEl.innerText = "Draw!";
        else statusEl.innerText = game.turn() === 'w' ? "Your Turn" : "AI Thinking...";
    }

    function resetGame() {
        game.reset();
        selectedSquare = null;
        render();
    }

    render();
</script>
</body>
</html>
