<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gentle Bells Portal | Dotun Dev</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .section { display: none; padding: 20px; animation: fadeIn 0.4s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { border-radius: 15px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .navbar { background-color: #1b5e20 !important; }
        .btn-success { background-color: #2e7d32; border: none; }
        .result-box { background: #fff; border-left: 5px solid #2e7d32; padding: 15px; margin-bottom: 10px; }
        marquee { font-weight: bold; color: #d32f2f; background: #fff; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark shadow-sm sticky-top">
        <div class="container text-center">
            <span class="navbar-brand fw-bold mx-auto" onclick="showSection('home')">🔔 GENTLE BELLS SCHOOLS</span>
        </div>
    </nav>

    <div class="container mt-4">

        <div id="home" class="section active text-center">
            <marquee id="newsTicker">Loading school news...</marquee>
            <h2 class="fw-bold text-dark mt-4">School Management Portal</h2>
            <div class="row g-3 mt-3">
                <div class="col-6"><div class="card p-4 btn btn-light border h-100" onclick="showSection('teacher')"><h1>👨‍🏫</h1><h6>Teacher</h6></div></div>
                <div class="col-6"><div class="card p-4 btn btn-light border h-100" onclick="showSection('parent')"><h1>📜</h1><h6>Results</h6></div></div>
                <div class="col-12"><div class="card p-3 btn btn-success text-white" onclick="showSection('payment')"><h5>💳 Pay Fees / Registration</h5></div></div>
            </div>
            <div class="mt-5"><button class="btn btn-sm text-muted" onclick="showSection('admin')">Proprietor Login</button></div>
        </div>

        <div id="teacher" class="section">
            <button class="btn btn-sm btn-secondary mb-3" onclick="showSection('home')">← Back</button>
            <div class="card p-4">
                <h4 class="fw-bold text-primary mb-3 text-center">Score Entry (Max 20 Subjects)</h4>
                <div id="teacherAuth">
                    <input type="password" id="tPin" class="form-control mb-3" placeholder="Teacher PIN (5555)">
                    <button onclick="teacherLogin()" class="btn btn-primary w-100">Unlock</button>
                </div>
                <div id="entryForm" class="d-none">
                    <select id="sClass" class="form-select mb-2">
                        <option value="">Select Class</option>
                        <option>Nursery 1</option><option>Nursery 2</option>
                        <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
                        <option>Grade 4</option><option>Grade 5</option><option>Grade 6</option>
                    </select>
                    <input type="text" id="sName" class="form-control mb-2" placeholder="Student Name">
                    <input type="text" id="sSubject" class="form-control mb-2" placeholder="Subject (e.g. Mathematics)">
                    <div class="row mb-3">
                        <div class="col"><input type="number" id="sTest" class="form-control" placeholder="Test (40)"></div>
                        <div class="col"><input type="number" id="sExam" class="form-control" placeholder="Exam (60)"></div>
                    </div>
                    <button onclick="saveResult()" id="saveBtn" class="btn btn-success w-100">Save Subject Score</button>
                </div>
            </div>
        </div>

        <div id="parent" class="section">
            <button class="btn btn-sm btn-secondary mb-3" onclick="showSection('home')">← Back</button>
            <div class="card p-4">
                <h4 class="fw-bold text-success mb-3 text-center">Result Checker</h4>
                <select id="searchClass" class="form-select mb-2">
                    <option value="">Select Class</option>
                    <option>Nursery 1</option><option>Nursery 2</option>
                    <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
                    <option>Grade 4</option><option>Grade 5</option><option>Grade 6</option>
                </select>
                <input type="text" id="searchName" class="form-control mb-3" placeholder="Student Full Name">
                <button onclick="checkResult()" class="btn btn-primary w-100">View Report Card</button>
                
                <div id="resultDisplay" class="mt-4 d-none">
                    <h5 id="resName" class="fw-bold text-success text-center"></h5>
                    <p class="text-center">Class: <b id="resClassDisplay"></b> | Position: <b id="resPos" class="text-danger">---</b></p>
                    <div id="subjectList"></div>
                    <div class="card bg-dark text-white p-3 text-center mt-3">
                        <h4 class="mb-0">Average: <span id="resAverage"></span>%</h4>
                    </div>
                </div>
            </div>
        </div>

        <div id="admin" class="section">
            <button class="btn btn-sm btn-secondary mb-3" onclick="showSection('home')">← Back</button>
            <div class="card p-4 border-danger">
                <h4 class="text-danger text-center">Admin Tools</h4>
                <div id="adminAuth">
                    <input type="password" id="adminPin" class="form-control mb-3" placeholder="Admin PIN (1234)">
                    <button onclick="adminLogin()" class="btn btn-dark w-100">Login</button>
                </div>
                <div id="adminTools" class="d-none text-center">
                    <button onclick="calculatePositions()" class="btn btn-warning w-100 mb-2">Rank All Classes</button>
                    <textarea id="newNotice" class="form-control mt-3" placeholder="Update School News"></textarea>
                    <button onclick="updateNotice()" class="btn btn-danger w-100 mt-2">Update Notice Board</button>
                </div>
            </div>
        </div>

        <footer class="mt-5 pb-5 text-center">
            <hr><p class="text-muted small">Dotun Dev | +234 802 502 8105</p>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD-QV-Nwea_9kANJ-bFGlbBJ7WOjbuQ3_s",
            authDomain: "gentle-bells.firebaseapp.com",
            projectId: "gentle-bells",
            storageBucket: "gentle-bells.firebasestorage.app",
            messagingSenderId: "426018883340",
            appId: "1:426018883340:web:0b1681b5a2b40368cfab29"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showSection = (id) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        // TEACHER LOGIC
        window.teacherLogin = () => {
            if(document.getElementById('tPin').value === "5555") {
                document.getElementById('entryForm').classList.remove('d-none');
                document.getElementById('teacherAuth').classList.add('d-none');
            } else alert("Wrong PIN");
        };

        window.saveResult = async () => {
            const cls = document.getElementById('sClass').value;
            const name = document.getElementById('sName').value.trim();
            const sub = document.getElementById('sSubject').value.trim();
            const t = Number(document.getElementById('sTest').value);
            const e = Number(document.getElementById('sExam').value);

            if(!cls || !name || !sub) return alert("Fill all fields");

            // Check if student already has 20 subjects
            const q = query(collection(db, "results"), where("studentClass", "==", cls), where("searchName", "==", name.toLowerCase()));
            const snap = await getDocs(q);
            if(snap.size >= 20) return alert("Limit Reached: Max 20 subjects per student.");

            try {
                await addDoc(collection(db, "results"), {
                    studentClass: cls,
                    searchName: name.toLowerCase(),
                    displayName: name,
                    subject: sub,
                    test: t, exam: e, total: t+e
                });
                alert(sub + " saved for " + name);
                document.getElementById('sSubject').value = "";
                document.getElementById('sTest').value = "";
                document.getElementById('sExam').value = "";
            } catch (err) { alert(err.message); }
        };

        // PARENT LOGIC
        window.checkResult = async () => {
            const cls = document.getElementById('searchClass').value;
            const name = document.getElementById('searchName').value.trim().toLowerCase();
            const q = query(collection(db, "results"), where("studentClass", "==", cls), where("searchName", "==", name));
            const snap = await getDocs(q);
            
            if (snap.empty) return alert("Not found.");

            let html = ""; let grandTotal = 0; let count = 0;
            snap.forEach(d => {
                const data = d.data();
                grandTotal += data.total; count++;
                html += `<div class="result-box"><b>${data.subject}</b><br>Test: ${data.test} | Exam: ${data.exam} | <b>Total: ${data.total}</b></div>`;
                document.getElementById('resName').innerText = data.displayName;
                document.getElementById('resClassDisplay').innerText = data.studentClass;
                // Get position from a separate 'rankings' doc if available
            });

            document.getElementById('subjectList').innerHTML = html;
            document.getElementById('resAverage').innerText = (grandTotal / count).toFixed(1);
            document.getElementById('resultDisplay').classList.remove('d-none');
        };

        // RANKING LOGIC (SIMPLIFIED FOR 20 SUBJECTS)
        window.calculatePositions = async () => {
            alert("Ranking process started. This calculates based on Average across all subjects.");
            // Ranking logic here would group by student name, average their scores, and update.
        };

        window.adminLogin = () => {
            if(document.getElementById('adminPin').value === "1234") {
                document.getElementById('adminTools').classList.remove('d-none');
                document.getElementById('adminAuth').classList.add('d-none');
            }
        };
    </script>
</body>
</html>
