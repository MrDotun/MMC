<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play against Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100%; width: 100%;
            overflow-y: auto; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            background-color: #1a1a2e;
        }
        #welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a1a2e; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000; color: white; text-align: center;
        }
        .login-card {
            background: #2D1B4D; padding: 40px; border-radius: 15px;
            border: 2px solid #4ade80; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 400px;
        }
        .login-card input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px;
            border: 1px solid #4ade80; background: #1a1a2e; color: white; box-sizing: border-box;
        }
        #game-container { display: none; width: 95vmin; max-width: 550px; text-align: center; padding: 20px 10px; }
        #board { width: 100%; margin-bottom: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .info-panel { background: #2D1B4D; padding: 20px; border-radius: 12px; border: 2px solid #4ade80; color: white; }
        .grade { font-size: 1.3em; font-weight: bold; color: #4ade80; }
        .submit-btn {
            background-color: #4ade80; color: #1a1a2e; padding: 14px 28px; border: none;
            border-radius: 8px; cursor: pointer; font-weight: bold; display: inline-block; margin-top: 20px;
        }
        .highlight-white { background-color: #f6f669 !important; }
        .highlight-black { background-color: #e6e600 !important; }
        #remark { font-style: italic; color: #ff4d4d; font-weight: bold; margin: 10px 0; display: block; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80;">Week One Task</h1>
        <input type="text" id="studentName" placeholder="Full Name" required>
        <input type="text" id="studentClass" placeholder="Class" required>
        <button class="submit-btn" onclick="startGame()">START GAME</button>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h2><span id="displayName">Player</span> vs Mr. Dotun</h2>
        <div id="board"></div>
        <p id="remark">"If you don't win, I'll be disappointed"</p>
        <p>Grade: <span id="grade" class="grade">Beginner</span></p>
        <p id="status">Your turn! Select a piece.</p>
        <a href="https://docs.google.com" class="submit-btn">SUBMIT RESULTS</a>
    </div>
</div>

<script>
    // FIREBASE CONFIG
    const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", projectId: "assignments-de95a", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // WORKER SETUP
    const engineWorker = new Worker('js/chess-worker.js');

    var currentName = "", currentClass = "", hasSavedWin = false;
    var board = null, game = new Chess(), sourceSquare = null;
    var $status = $('#status'), $grade = $('#grade'), $remark = $('#remark');

    function startGame() {
        currentName = document.getElementById('studentName').value;
        currentClass = document.getElementById('studentClass').value;
        if (!currentName || !currentClass) return alert("Fill all fields");
        document.getElementById('displayName').textContent = currentName;
        document.getElementById('welcome-overlay').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        board.resize();
    }

    function makeAIMove() {
        if (game.game_over()) return;
        $status.html("<span style='color: #facc15;'>Mr. Dotun is calculating...</span>");
        
        engineWorker.postMessage({ fen: game.fen(), depth: 3 });

        engineWorker.onmessage = function(e) {
            game.move(e.data);
            board.position(game.fen());
            updateStatus();
        };
    }

    function updateStatus() {
        if (game.in_checkmate()) {
            $status.html(game.turn() === 'b' ? "You Won!" : "Mr. Dotun Won!");
            if (game.turn() === 'b') saveResult("Grandmaster");
        } else {
            $status.html("Your turn!");
        }
    }

    function saveResult(rank) {
        if (hasSavedWin) return;
        db.collection("grandmasters").add({ name: currentName, class: currentClass, rank: rank, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        hasSavedWin = true;
    }

    function onSquareClick(square) {
        if (game.game_over()) return;
        if (sourceSquare === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            }
            return;
        }
        var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
        if (move === null) {
            sourceSquare = null;
            removeHighlights();
            return;
        }
        board.position(game.fen());
        sourceSquare = null;
        removeHighlights();
        window.setTimeout(makeAIMove, 250);
    }

    function addHighlight(square) {
        var $el = $('#board .square-' + square);
        $el.addClass($el.hasClass('black-3c85d') ? 'highlight-black' : 'highlight-white');
    }

    function removeHighlights() { $('#board [class*="square-"]').removeClass('highlight-white highlight-black'); }

    board = ChessBoard('board', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
    $('#board').on('click', '[class*="square-"]', function() { onSquareClick($(this).attr('data-square')); });
    $(window).resize(board.resize);
</script>
</body>
</html>
