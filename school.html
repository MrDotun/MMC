<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play against Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0;
            min-height: 100%; width: 100%;
            overflow-y: auto; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            background-color: #1a1a2e;
        }
        #game-container {
            width: 95vmin; 
            max-width: 550px;
            text-align: center;
            padding: 20px 10px;
        }
        #board { 
            width: 100%; 
            margin-bottom: 15px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .info-panel {
            background: #2D1B4D; padding: 20px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #4ade80;
            color: white;
        }
        h2 { margin: 0 0 10px 0; color: #4ade80; font-size: 1.4em; }
        .grade-display { font-size: 1.3em; font-weight: bold; color: #4ade80; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        .submit-btn {
            background-color: #4ade80;
            color: #1a1a2e;
            padding: 14px 28px;
            border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold;
            text-decoration: none; display: inline-block;
            margin-top: 20px;
            animation: pulse 2s infinite;
            transition: transform 0.2s, background-color 0.2s;
        }
        .submit-btn:hover { background-color: #22c55e; transform: translateY(-2px); }

        .highlight-white { background-color: #f6f669 !important; }
        .highlight-black { background-color: #e6e600 !important; }
        .white-1e1d7 { background-color: #ebecd0 !important; }
        .black-3c85d { background-color: #779556 !important; }
        
        #remark { font-style: italic; color: #facc15; min-height: 1.5em; display: block; margin: 10px 0; font-weight: 500; }
        #status { font-weight: bold; color: #cbd5e1; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="info-panel">
        <h2>Playing against: <strong>Mr. Dotun</strong></h2>
        <div id="board"></div>
        <p id="remark">"If you don't win, I'll be disappointed"</p>
        <p>Your Grade: <span id="grade" class="grade-display">Beginner</span></p>
        <p id="status">Your turn! Click a piece to select it.</p>
        
        <hr style="border: 0; border-top: 1px solid #4ade80; margin: 20px 0; opacity: 0.3;">
        
        <a id="form-link" href="https://docs.google.com/forms/d/e/1FAIpQLSfduqoEyvRko9-TM2T1SU0WVkr2vCdg2sFPZUTtQLOwSnJbBA/viewform" target="_blank" class="submit-btn">SUBMIT TO MR. DOTUN</a>
    </div>
</div>

<script>
    var board = null;
    var game = new Chess();
    var $status = $('#status');
    var $grade = $('#grade');
    var $remark = $('#remark');
    var sourceSquare = null; 

    var pieceValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 0 };
    var totalScore = 0;

    function updateGrade() {
        var currentGrade = "Beginner";
        if (totalScore >= 200) currentGrade = "Grandmaster! 👑";
        else if (totalScore >= 120) currentGrade = "Expert 🏆";
        else if (totalScore >= 70) currentGrade = "Pro 🌟";
        else if (totalScore >= 30) currentGrade = "Advanced 👍";
        
        $grade.text(currentGrade);

        // Google Form Logic
        var baseUrl = "https://docs.google.com/forms/d/e/1FAIpQLSfduqoEyvRko9-TM2T1SU0WVkr2vCdg2sFPZUTtQLOwSnJbBA/viewform";
        var scoreField = "entry.2115637101"; 
        var gradeField = "entry.2066871533";
        
        var fullUrl = baseUrl + "?" + scoreField + "=" + totalScore + "&" + gradeField + "=" + encodeURIComponent(currentGrade);
        $('#form-link').attr('href', fullUrl);
    }

    function checkGameOver() {
        if (game.in_checkmate()) {
            var winner = game.turn() === 'w' ? "Mr. Dotun" : "You";
            $status.text("CHECKMATE! " + winner + " wins!");
            $remark.text(winner === "You" ? "Unbelievable! You actually beat me!" : "Stick to your books, checkmate!");
            alert("Game Over: Checkmate! Winner: " + winner);
            return true;
        } else if (game.in_draw() || game.in_stalemate()) {
            $status.text("Game Over: Draw/Stalemate!");
            $remark.text("A draw? We'll have to play again.");
            alert("Game Over: It's a Draw!");
            return true;
        }
        return false;
    }

    function mrDotunRemarks(type) {
        var remarks = {
            illegal: "I'll reduce your score if you make an illegal move!",
            bad: ["Is this what I taught you?", "Hahahha. You're playing like you're in Nursery 1.", "Should I take you back to Creche?"],
            good: ["You made a good move.", "You're going to be world champion someday!"],
            neutral: "If you don't win, I'll be disappointed"
        };
        if (type === 'illegal') $remark.text(remarks.illegal);
        else if (type === 'good') $remark.text(remarks.good[Math.floor(Math.random() * remarks.good.length)]);
        else if (type === 'bad') $remark.text(remarks.bad[Math.floor(Math.random() * remarks.bad.length)]);
    }

    function makeAIMove() {
        if (checkGameOver()) return;
        var moves = game.moves({ verbose: true });
        var scoredMoves = moves.map(function(move) {
            var score = Math.random() * 5; 
            if (move.san.includes('#')) return { move: move, score: 10000 };
            if (move.captured) score += pieceValues[move.captured] * 20;
            return { move: move, score: score };
        });
        scoredMoves.sort(function(a, b) { return b.score - a.score; });
        game.move(scoredMoves[0].move);
        board.position(game.fen());
        if (!checkGameOver()) $status.text("Mr. Dotun moved. Your turn!");
    }

    function onSquareClick(square) {
        if (game.game_over()) return;
        if (sourceSquare === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
                $status.text("Piece selected.");
            }
            return;
        }
        var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
        if (move === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            } else {
                sourceSquare = null;
                removeHighlights();
                mrDotunRemarks('illegal');
            }
            return;
        }
        board.position(game.fen());
        sourceSquare = null;
        removeHighlights();
        if (move.captured) {
            totalScore += pieceValues[move.captured];
            updateGrade();
            mrDotunRemarks('good');
        } else {
            if(Math.random() > 0.7) mrDotunRemarks('bad');
        }
        if (!checkGameOver()) {
            $status.text("Thinking...");
            window.setTimeout(makeAIMove, 500);
        }
    }

    function addHighlight(square) {
        var $el = $('#board .square-' + square);
        if ($el.hasClass('black-3c85d')) $el.addClass('highlight-black');
        else $el.addClass('highlight-white');
    }

    function removeHighlights() {
        $('#board [class*="square-"]').removeClass('highlight-white highlight-black');
    }

    board = ChessBoard('board', {
        draggable: false,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    $('#board').on('click', '[class*="square-"]', function() {
        onSquareClick($(this).attr('data-square'));
    });

    $(window).resize(board.resize);
    updateGrade(); // Sets the link immediately
</script>
</body>
</html>
