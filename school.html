<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MASTER CODE - STRATEGIC SPEED LAB</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <style>
        :root {
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --correct: rgba(76, 175, 80, 0.6);
            --lab-blue: #00d2ff;
            --terminal-green: #00ff41;
        }

        /* Essential for full-screen fit */
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle, #1a2a6c, #101010);
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }

        /* Screens now adjust to available height */
        .screen { 
            display: none; 
            width: 100%; 
            max-width: 600px; /* Wider for desktop */
            padding: 10px; 
            text-align: center; 
            flex-grow: 1;
            justify-content: center;
        }
        .active-screen { display: flex; flex-direction: column; }

        .welcome-card { 
            background: rgba(10, 10, 10, 0.95); 
            padding: 20px; 
            border-radius: 20px; 
            border: 3px solid var(--lab-blue);
            width: 100%;
        }
        
        /* Font sizes that scale */
        h1.big-title { font-size: clamp(1.5rem, 5vw, 2.2rem); color: var(--lab-blue); margin: 10px 0; }
        
        .input-label { 
            display: block; 
            text-align: left; 
            margin: 10px 0 5px 5%; 
            font-weight: bold; 
            color: var(--lab-blue);
            font-size: clamp(0.9rem, 3vw, 1.2rem);
        }

        input { 
            padding: 12px; 
            border-radius: 8px; 
            border: 2px solid var(--lab-blue); 
            width: 90%; 
            margin-bottom: 10px; 
            font-size: 1.1rem;
            background: #111; 
            color: white; 
            text-align: center;
        }

        .btn-main { 
            background: var(--lab-blue); 
            color: #000; 
            padding: 15px; 
            border: none; 
            border-radius: 10px; 
            font-size: 1.3rem; 
            cursor: pointer; 
            font-weight: bold; 
            width: 90%; 
        }

        /* Scrollable leaderboard for small screens */
        .leaderboard { 
            margin-top: 15px; 
            background: rgba(0,0,0,0.8); 
            padding: 5px; 
            border-radius: 12px; 
            border: 1px solid var(--terminal-green);
            max-height: 20vh;
            overflow-y: auto;
        }

        /* THE BOARD: Dynamic sizing */
        .board { 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            width: 95vw; 
            max-width: 450px; /* Limit size on desktop */
            aspect-ratio: 1/1; 
            border: 4px solid #333; 
            margin: 0 auto;
        }

        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .square img { width: 90%; height: 90%; }
        .square.light { background-color: var(--light-sq); }
        .square.dark { background-color: var(--dark-sq); }
        .square.is-correct { background-color: var(--correct); }

        #stats { font-size: 1.1rem; margin: 10px 0; display: flex; justify-content: space-around; width: 100%; font-weight: bold; }
        
        #story-box { 
            background: #000; 
            padding: 15px; 
            border-radius: 10px; 
            border-left: 6px solid var(--terminal-green); 
            margin-bottom: 10px; 
            text-align: left; 
            width: 100%;
        }

        #objective-text {
            font-size: clamp(1rem, 4vw, 1.5rem); 
            line-height: 1.2;
            font-weight: bold;
            color: #fff;
            margin: 0;
        }

        /* Desktop specific tweaks */
        @media (min-width: 768px) {
            .screen { padding: 40px; }
            .board { max-width: 500px; }
            #objective-text { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen active-screen">
        <div class="welcome-card">
            <h1 class="big-title">MASTER CODE LAB</h1>
            
            <label class="input-label">TYPE YOUR NAME:</label>
            <input type="text" id="kid-name" placeholder="Scientist Name">
            
            <label class="input-label">STATION CODE:</label>
            <input type="password" id="kid-code" placeholder="Choose a Password">

            <button class="btn-main" onclick="startNewGame()">START SESSION</button>

            <div class="leaderboard">
                <table style="width:100%; font-size: 0.9rem;">
                    <thead><tr style="color:var(--terminal-green)"><th>Rank</th><th>Scientist</th><th>Score</th></tr></thead>
                    <tbody id="leaderboard-list"><tr><td colspan="3">Syncing...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="stats">
            <span>👤 <span id="display-name"></span></span>
            <span style="color:#ff4757">❤️ <span id="display-lives">3</span></span>
            <span style="color:#ffeb3b">⏳ <span id="seconds">60</span>s</span>
        </div>
        <div id="story-box">
            <div style="color: var(--terminal-green); font-weight: bold; font-size: 1.2rem;">STAGE 01</div>
            <p id="objective-text">EXPERIMENT 01: Scrambled data detected! Drag the pieces back to their original squares.</p>
        </div>
        <div id="board" class="board"></div>
    </div>

<script>
    // --- DATABASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
      authDomain: "assignments-de95a.firebaseapp.com",
      databaseURL: "https://assignments-de95a-default-rtdb.firebaseio.com", 
      projectId: "assignments-de95a",
      storageBucket: "assignments-de95a.firebasestorage.app",
      messagingSenderId: "1088073398299",
      appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let playerName = "";
    let timeLeft = 60;
    let timerInterval;
    let currentBoard = [];
    let selectedIndex = null;

    const pieceImages = {
        'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg', 'P': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
        'r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg', 'n': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        'b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg', 'q': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
        'k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg', 'R': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        'N': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg', 'B': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
        'Q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg', 'K': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };

    const s1Starting = ['r','n','b','q','k','b','n','r','p','p','p','p','p','p','p','p','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','P','P','P','P','P','P','P','P','R','N','B','Q','K','B','N','R'];

    function startNewGame() {
        playerName = document.getElementById('kid-name').value;
        const code = document.getElementById('kid-code').value;
        if(!playerName || !code) return alert("NAME AND CODE REQUIRED!");
        
        document.getElementById('welcome-screen').classList.remove('active-screen');
        document.getElementById('game-screen').classList.add('active-screen');
        document.getElementById('display-name').innerText = playerName;
        initGame();
    }

    function initGame() {
        currentBoard = [...s1Starting].sort(() => Math.random() - 0.5);
        renderBoard();
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('seconds').innerText = timeLeft;
            if(timeLeft <= 0) { clearInterval(timerInterval); location.reload(); }
        }, 1000);
    }

    function renderBoard() {
        const b = document.getElementById('board'); b.innerHTML = '';
        currentBoard.forEach((p, i) => {
            const sq = document.createElement('div');
            sq.className = `square ${(Math.floor(i/8)+i)%2?'dark':'light'}`;
            if(p === s1Starting[i] && p !== '') sq.classList.add('is-correct');
            if(p) { const img = document.createElement('img'); img.src = pieceImages[p]; sq.appendChild(img); }
            sq.onclick = () => {
                if(selectedIndex === null) { selectedIndex = i; }
                else {
                    [currentBoard[i], currentBoard[selectedIndex]] = [currentBoard[selectedIndex], currentBoard[i]];
                    selectedIndex = null; renderBoard();
                    if(currentBoard.every((val, index) => val === s1Starting[index])) {
                        db.ref('leaderboard/' + playerName).set({name: playerName, score: timeLeft * 10});
                        alert("MISSION SUCCESS!"); location.reload();
                    }
                }
            };
            b.appendChild(sq);
        });
    }

    db.ref('leaderboard').orderByChild('score').limitToLast(10).on('value', (snap) => {
        let players = []; snap.forEach(c => { players.push(c.val()); });
        players.reverse();
        document.getElementById('leaderboard-list').innerHTML = players.map((p, i) => `<tr><td>#${i+1}</td><td>${p.name}</td><td>${p.score}</td></tr>`).join('');
    });
</script>
</body>
</html>
