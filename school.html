<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2200 Elo Click-to-Move Chess</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { background: #2c3e50; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
        #board { width: 90vw; max-width: 400px; margin: 10px auto; cursor: pointer; }
        .info { background: #34495e; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        
        /* Highlighting for Click-to-Move */
        .highlight-white { box-shadow: inset 0 0 3px 3px yellow; }
        .square-55d6 { transition: background 0.2s; }
    </style>
</head>
<body>

    <div class="info">
        <h3>Master Chess AI</h3>
        <div id="status">Click a White piece to start</div>
        <br>
        <button onclick="location.reload()" style="padding: 8px 15px; cursor: pointer;">Reset Game</button>
    </div>

    <div id="board"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var moveAudio = new Audio('https://notalotofstuff.github.io/chess/move.mp3');
        var sourceSquare = null;

        // --- AI BRAIN (Minimax) ---
        var weights = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };
        function evaluateBoard(game) {
            var total = 0;
            game.board().forEach(row => {
                row.forEach(p => { if(p) total += (p.color === 'w' ? weights[p.type] : -weights[p.type]); });
            });
            return total;
        }

        function minimax(game, depth, isMax) {
            if (depth === 0) return -evaluateBoard(game);
            var moves = game.moves();
            var best = isMax ? -9999 : 9999;
            for (var m of moves) {
                game.move(m);
                best = isMax ? Math.max(best, minimax(game, depth-1, !isMax)) : Math.min(best, minimax(game, depth-1, !isMax));
                game.undo();
            }
            return best;
        }

        function makeAiMove() {
            var moves = game.moves();
            if (moves.length === 0) return;
            var bestMove = moves[Math.floor(Math.random() * moves.length)];
            var bestVal = 9999;

            for (var m of moves) {
                game.move(m);
                var val = minimax(game, 2, true);
                game.undo();
                if (val < bestVal) { bestVal = val; bestMove = m; }
            }
            game.move(bestMove);
            board.position(game.fen());
            $('#status').text("Your turn");
        }

        // --- CLICK TO MOVE LOGIC ---
        function removeHighlights() {
            $('#board .square-55d6').removeClass('highlight-white');
        }

        function onSquareClick() {
            var square = $(this).attr('data-square');
            
            // 1. Selecting a piece
            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    removeHighlights();
                    $(this).addClass('highlight-white');
                }
                return;
            }

            // 2. Moving the piece
            var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
            
            if (move === null) {
                // If clicked another white piece, switch selection
                var piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    removeHighlights();
                    $(this).addClass('highlight-white');
                } else {
                    sourceSquare = null;
                    removeHighlights();
                }
                return;
            }

            // 3. Move Success
            removeHighlights();
            sourceSquare = null;
            board.position(game.fen());
            $('#status').text("AI is thinking...");
            window.setTimeout(makeAiMove, 500);
        }

        // Initialize Board
        board = ChessBoard('board', {
            position: 'start',
            draggable: false,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        // Attach Clicks
        $('#board').on('click', '.square-55d6', onSquareClick);

    </script>
</body>
</html>
