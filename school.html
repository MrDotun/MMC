<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chess vs Mr Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; text-align: center; }
        #myBoard { width: 400px; margin: 20px auto; border: 5px solid #333; }
        .info { background: #333; padding: 10px; border-radius: 5px; display: inline-block; margin-top: 20px; }
        .highlight { box-shadow: inset 0 0 3px 3px yellow; }
        /* Style for the dots showing legal moves */
        .dot { height: 12px; width: 12px; background-color: rgba(0,255,0,0.5); border-radius: 50%; display: inline-block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

    <div class="info">
        <h2 id="status">Your Turn</h2>
        <p>Playing against <b>Mr Dotun (1800 Elo)</b></p>
    </div>

    <div id="myBoard"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var selectedSquare = null;

        // --- AI LOGIC (Mr Dotun's 1800 Elo "Brain") ---
        const weights = { p: 10, n: 32, b: 33, r: 50, q: 90, k: 900 };
        function evaluateBoard(g) {
            let total = 0;
            g.board().forEach(row => row.forEach(p => {
                if (p) total += (p.color === 'w' ? weights[p.type] : -weights[p.type]);
            }));
            return total;
        }

        function minimax(g, depth, alpha, beta, isMax) {
            if (depth === 0) return -evaluateBoard(g);
            let moves = g.moves();
            if (isMax) {
                let best = -9999;
                for (let m of moves) { g.move(m); best = Math.max(best, minimax(g, depth-1, alpha, beta, false)); g.undo(); alpha = Math.max(alpha, best); if (beta <= alpha) break; }
                return best;
            } else {
                let best = 9999;
                for (let m of moves) { g.move(m); best = Math.min(best, minimax(g, depth-1, alpha, beta, true)); g.undo(); beta = Math.min(beta, best); if (beta <= alpha) break; }
                return best;
            }
        }

        function makeAiMove() {
            let moves = game.moves();
            if (game.game_over()) return;
            let bestMove = null; let bestVal = -9999;
            moves.sort(() => Math.random() - 0.5);
            for (let m of moves) {
                game.move(m); let val = minimax(game, 3, -10000, 10000, false); game.undo();
                if (val > bestVal) { bestVal = val; bestMove = m; }
            }
            game.move(bestMove);
            board.position(game.fen());
            $('#status').text("Your Turn");
        }

        // --- FIXED CLICK HANDLER ---
        // We use jQuery to listen to clicks on the squares directly
        function initClickEvents() {
            $('#myBoard').on('click', '.square-55d9', function() {
                var square = $(this).attr('data-square');
                handleSquareClick(square);
            });
        }

        function handleSquareClick(square) {
            if (game.turn() === 'b') return; // AI is thinking

            // If we haven't selected a piece yet
            if (selectedSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === 'w') {
                    selectedSquare = square;
                    $('.square-55d9').removeClass('highlight');
                    $('.square-' + square).addClass('highlight');
                    showHints(square);
                }
            } 
            // If we are clicking a second square to move
            else {
                var move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                
                if (move === null) {
                    // Check if they clicked another of their own pieces instead
                    var piece = game.get(square);
                    if (piece && piece.color === 'w') {
                        selectedSquare = square;
                        $('.square-55d9').removeClass('highlight');
                        $('.square-' + square).addClass('highlight');
                        showHints(square);
                    } else {
                        selectedSquare = null;
                        $('.square-55d9').removeClass('highlight');
                        $('.dot').remove();
                    }
                } else {
                    // Successful move
                    selectedSquare = null;
                    $('.square-55d9').removeClass('highlight');
                    $('.dot').remove();
                    board.position(game.fen());
                    $('#status').text("Mr Dotun is thinking...");
                    setTimeout(makeAiMove, 600);
                }
            }
        }

        function showHints(sq) {
            $('.dot').remove();
            game.moves({square: sq, verbose: true}).forEach(m => {
                $('.square-' + m.to).append('<div class="dot"></div>');
            });
        }

        board = Chessboard('myBoard', { position: 'start', draggable: false });
        initClickEvents(); // Activate the fixed click listener
    </script>
</body>
</html>
