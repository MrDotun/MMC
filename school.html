<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Masters | Mind Masters Academy</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
            authDomain: "assignments-de95a.firebaseapp.com",
            databaseURL: "https://assignments-de95a-default-rtdb.firebaseio.com",
            projectId: "assignments-de95a",
            storageBucket: "assignments-de95a.firebasestorage.app",
            messagingSenderId: "1088073398299",
            appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- GLOBAL FUNCTIONS EXPOSED TO WINDOW ---
        window.saveFinalScore = (name, score) => {
            push(ref(db, 'leaderboard'), { name, score, timestamp: Date.now() });
        };

        window.loadCloudLeaderboard = () => {
            const scoresRef = query(ref(db, 'leaderboard'), orderByChild('score'), limitToLast(10));
            onValue(scoresRef, (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById("hall-of-fame-body");
                tbody.innerHTML = "";
                if (!data) { tbody.innerHTML = "<tr><td colspan='3'>No entries yet</td></tr>"; return; }
                
                const sorted = Object.values(data).sort((a, b) => b.score - a.score);
                sorted.forEach((r, i) => {
                    tbody.innerHTML += `<tr><td>${i+1}</td><td>${r.name}</td><td>${r.score}/7</td></tr>`;
                });
            });
        };
    </script>

    <style>
        :root {
            --light-sq: #ebecd0; --dark-sq: #779556;
            --highlight-select: rgba(255, 255, 0, 0.5); --highlight-last: rgba(255, 255, 0, 0.3);
            --bg-color: #1a1a2e; 
            --panel-bg: #2D1B4D;
            --accent: #4ade80;
            --card-bg: #3B2667;
        }
        body {
            font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: white;
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        #app-container { width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; background: var(--panel-bg); border: 2px solid var(--accent); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .header-title { text-align: center; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; font-size: 20px; }
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; }
        .active-screen { display: flex; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: var(--card-bg); border-radius: 10px; overflow: hidden; }
        th, td { padding: 10px; border-bottom: 1px solid #5b3fa1; text-align: left; font-size: 14px; }
        th { background: rgba(74, 222, 128, 0.1); color: var(--accent); }
        button { background-color: var(--accent); color: #1a1a2e; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px 0; width: 100%; transition: 0.3s; }
        .timer { background: #1a1a2e; padding: 8px 15px; border-radius: 8px; font-family: monospace; font-size: 20px; color: #ffca28; border: 1px solid #444; }
        #board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1/1; border: 4px solid #111; border-radius: 5px; overflow: hidden; }
        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        .light { background-color: var(--light-sq); } .dark { background-color: var(--dark-sq); }
        .square img { width: 90%; z-index: 2; }
        .save-box { background: var(--card-bg); padding: 15px; border-radius: 12px; width: 100%; box-sizing: border-box; margin-top: 10px; }
        input { background: #1a1a2e; border: 1px solid #5b3fa1; color: white; padding: 10px; width: 90%; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="app-container">
    <div class="header-title">Nigerian Masters Blitz</div>

    <div id="intro-screen" class="screen active-screen">
        <h3 style="color: var(--accent); margin-bottom: 10px;">🏆 All-Time Rankings</h3>
        <table id="hall-of-fame-table">
            <thead><tr><th>Rank</th><th>Kid</th><th>Score</th></tr></thead>
            <tbody id="hall-of-fame-body"></tbody>
        </table>
        <div class="save-box">
            <input type="text" id="kid-name" placeholder="Your Name..."/>
            <button onclick="enrollKid()">Start 7-Round Tourney</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:10px;">
            <div id="opp-name">Master</div>
            <div id="timer-opp" class="timer">05:00</div>
        </div>
        <div id="board"></div>
        <div style="display:flex; justify-content:space-between; width:100%; margin-top:10px;">
            <div id="user-name">Kid</div>
            <div id="timer-user" class="timer">05:00</div>
        </div>
        <p id="round-indicator" style="color: var(--accent);">Round 1 of 7</p>
        <button id="next-btn" style="display:none;" onclick="nextMatch()">Next Match</button>
    </div>
</div>

<script>
    // List of Masters
    const masters = ["IM Odion Aikhoje", "FM Adebayo Adegboyega", "FM Bomo Kigigha", "IM Adu Oladapo", "IM Bunmi Olape", "FM Akinseye Abiola", "IM Anwuli Daniel"];
    const pieces = { p: 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg', n: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg', b: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg', r: 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg', q: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg', k: 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg', P: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg', N: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg', B: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg', R: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg', Q: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg', K: 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg' };

    let kidName = "", currentRound = 0, totalPts = 0;
    let game, userColor, selectedSquare, intervalId, timerW, timerB;

    window.onload = () => { if(window.loadCloudLeaderboard) window.loadCloudLeaderboard(); };

    function enrollKid() {
        kidName = document.getElementById("kid-name").value.trim() || "Kid Master";
        currentRound = 0; totalPts = 0;
        document.getElementById("intro-screen").classList.remove("active-screen");
        document.getElementById("game-screen").classList.add("active-screen");
        nextMatch();
    }

    function nextMatch() {
        if (currentRound >= 7) {
            window.saveFinalScore(kidName, totalPts);
            alert(`Tournament Complete! Final Score: ${totalPts}/7`);
            location.reload();
            return;
        }
        setupBoard();
    }

    function setupBoard() {
        game = new Chess();
        userColor = Math.random() < 0.5 ? 'w' : 'b';
        timerW = timerB = 300;
        document.getElementById("opp-name").innerText = masters[currentRound];
        document.getElementById("user-name").innerText = kidName;
        document.getElementById("round-indicator").innerText = `Round ${currentRound + 1} of 7 (Score: ${totalPts})`;
        document.getElementById("next-btn").style.display = "none";
        draw(); startTimer();
        if (game.turn() !== userColor) aiMove();
    }

    function endMatch() {
        clearInterval(intervalId);
        if (game.in_draw()) totalPts += 0.5;
        else if (game.turn() !== userColor) totalPts += 1;
        currentRound++;
        document.getElementById("next-btn").innerText = currentRound === 7 ? "Submit Result" : "Next Round";
        document.getElementById("next-btn").style.display = "block";
    }

    function draw() {
        const b = document.getElementById("board"); b.innerHTML = "";
        const state = game.board();
        for (let i = 0; i < 64; i++) {
            let r = Math.floor(i/8), c = i%8;
            if (userColor === 'b') { r = 7-r; c = 7-c; }
            const sq = String.fromCharCode(97+c) + (8-r);
            const el = document.createElement("div");
            el.className = `square ${(r+c)%2===0?'light':'dark'}`;
            const p = state[r][c];
            if (p) { const img = document.createElement("img"); img.src = pieces[p.color==='w'?p.type.toUpperCase():p.type]; el.appendChild(img); }
            el.onclick = () => {
                if (game.turn() !== userColor) return;
                if (selectedSquare) {
                    const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
                    if (move) { selectedSquare = null; draw(); if (game.game_over()) endMatch(); else aiMove(); }
                    else selectedSquare = sq;
                } else selectedSquare = sq;
                draw();
            };
            b.appendChild(el);
        }
    }

    function aiMove() {
        setTimeout(() => {
            const moves = game.moves();
            game.move(moves[Math.floor(Math.random() * moves.length)]);
            draw(); if (game.game_over()) endMatch();
        }, 500);
    }

    function startTimer() {
        clearInterval(intervalId);
        intervalId = setInterval(() => {
            if (game.turn() === 'w') timerW--; else timerB--;
            const fmt = (s) => `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
            document.getElementById("timer-user").innerText = fmt(userColor==='w'?timerW:timerB);
            document.getElementById("timer-opp").innerText = fmt(userColor==='w'?timerB:timerW);
            if (timerW<=0 || timerB<=0) endMatch();
        }, 1000);
    }
</script>
</body>
</html>
