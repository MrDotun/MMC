<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Level Workbook</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #2D1B4D; --secondary: #4ade80; --bg: #1a1a2e; --danger: #ef4444; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        #board-container { width: 350px; max-width: 95vw; margin: 10px auto; border: 2px solid var(--secondary); border-radius: 8px; overflow: hidden; }
        .hidden { display: none !important; }
        .btn { padding: 12px 20px; margin: 5px; cursor: pointer; border-radius: 8px; border: 1px solid var(--secondary); background: var(--primary); color: var(--secondary); font-weight: bold; width: 100%; transition: 0.3s; }
        .btn:hover { background: var(--secondary); color: var(--bg); }
        #results-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2D1B4D; padding: 20px; border-radius: 12px; border: 2px solid var(--secondary); z-index: 2000; width: 85%; max-height: 70vh; overflow-y: auto; box-shadow: 0 0 20px rgba(0,0,0,0.7); }
        .leaderboard-entry { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #4ade8044; color: var(--secondary); }
        #task-text { background: #2D1B4D; padding: 12px; border-radius: 8px; border-left: 4px solid var(--secondary); margin-bottom: 10px; width: 90%; color: white; text-align: center; font-weight: bold; min-height: 40px; }
        .highlight-selected { background-color: rgba(250, 204, 21, 0.7) !important; }
        .section-label { color: var(--secondary); text-align: center; margin-top: 15px; font-weight: bold; }
        .week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 15px; }
        #lives-display { font-size: 24px; letter-spacing: 3px; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary);">♟️ Level Workbook</h1>

    <div id="setup-area">
        <h3 style="text-align:center;">Enter Name & Select Mission:</h3>
        <input type="text" id="studentName" placeholder="Student Name" style="width:100%; padding:12px; margin-bottom:15px; border-radius:5px; border:1px solid #4ade80; background:#1a1a2e; color:white; box-sizing: border-box;">
        
        <div id="level-selector-container">
            </div>
    </div>

    <div id="game-area" class="hidden">
        <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 10px;">
            <h3 id="topic-title" style="color: var(--secondary); margin: 0;">Topic: ...</h3>
            <div id="lives-display">❤️❤️❤️</div>
        </div>
        <div id="task-text">Loading Mission...</div>
        <div id="board-container"><div id="myBoard"></div></div>
        <h3 style="color:var(--secondary); text-align: center;">Week Score: <span id="current-score">0</span></h3>
    </div>

    <div id="post-game" class="hidden" style="text-align: center;">
        <h2 style="color:var(--secondary)">Week Complete! 🎉</h2>
        <button class="btn" onclick="fetchLeaderboard()">🏆 View Leaderboard</button>
        <button class="btn" onclick="location.reload()">🔄 Back to Levels</button>
    </div>

    <div id="results-modal" class="hidden">
        <h3 style="color:var(--secondary); text-align: center;">Global Leaderboard</h3>
        <div id="leaderboard-data"></div>
        <button class="btn" onclick="document.getElementById('results-modal').classList.add('hidden')">Close</button>
    </div>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- THE DATABASE (LEVEL 1, TERM 1, WEEK 1) ---
        const allQuestions = [
            { level: 1, term: 1, week: 1, topic: "The Great Capture", fen: "r4rk1/1p2nppp/p1n1q3/3Pp3/8/2N2N1P/PP2QPP1/R4RK1 w - - 0 1", move: "d5e6", task: "What's white's best move?" },
            { level: 1, term: 1, week: 1, topic: "The Great Capture", fen: "r4rk1/1p2nppp/p1n5/3bp1q1/4P3/2N2N1P/PP2QPP1/R4RK1 w - - 0 1", move: "f3g5", task: "What's white's best move?" },
            { level: 1, term: 1, week: 1, topic: "The Great Capture", fen: "r4rk1/1p3ppp/p1n2n2/4p3/3PPp2/B1N2N1P/PP3PP1/R4RK1 w - - 0 1", move: "a3f8", task: "What's white's best move?" },
            { level: 1, term: 1, week: 1, topic: "The Great Capture", fen: "r1b2rk1/1p3ppp/p1n2n2/4p2R/3PPp2/B1N2N1Q/PP3PP1/R4RK1 w - - 0 1", move: "c8h3", task: "What's black's best move?" },
            { level: 1, term: 1, week: 1, topic: "The Great Capture", fen: "r1b2rk1/1p3ppp/p1nN1n2/4p1Q1/2qPPp2/5N2/PP3PP1/R4RK1 w - - 0 1", move: "d6c4", task: "What's white's best move?" }
        ];

        // --- APP STATE ---
        let game = new Chess();
        let board = null;
        let currentLevel, currentTerm, currentWeek, gradeSet, currentIdx, score, pName;
        let lives = 3;
        let squareSelected = null;

        // --- UI GENERATOR ---
        function generateButtons() {
            const container = document.getElementById('level-selector-container');
            for (let L = 1; L <= 4; L++) {
                let html = `<div class="section-label">LEVEL ${L}</div>`;
                for (let t = 1; t <= 3; t++) {
                    html += `<div style="font-size: 0.7em; color: var(--secondary); margin-top:5px; text-align:center;">Term ${t}</div><div class="week-grid">`;
                    for (let w = 1; w <= 5; w++) {
                        html += `<button class="btn" style="padding:5px; font-size:11px;" onclick="initMission(${L}, ${t}, ${w})">W${w}</button>`;
                    }
                    html += `</div>`;
                }
                container.innerHTML += html;
            }
        }
        generateButtons();

        // --- GAME LOGIC ---
        window.initMission = function(level, term, week) {
            pName = document.getElementById('studentName').value.trim();
            if(!pName) { alert("Please enter your name first!"); return; }
            
            currentLevel = level; currentTerm = term; currentWeek = week;
            gradeSet = allQuestions.filter(q => q.level === level && q.term === term && q.week === week);
            
            if (gradeSet.length === 0) { alert("This week is currently being updated. Please try Week 1!"); return; }
            
            document.getElementById("setup-area").classList.add("hidden");
            document.getElementById("game-area").classList.remove("hidden");
            currentIdx = 0; score = 0;
            loadQuestion();
        };

        function loadQuestion() {
            if (currentIdx >= gradeSet.length) { finishGame(); return; }
            
            lives = 3;
            updateLivesUI();
            const q = gradeSet[currentIdx];
            
            document.getElementById("topic-title").innerText = q.topic;
            document.getElementById("task-text").innerText = q.task;
            document.getElementById("current-score").innerText = score;

            game.load(q.fen);
            board = ChessBoard('myBoard', {
                draggable: false,
                position: q.fen,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            $('.square-55d63').off('click').on('click', handleSquareClick);
        }

        function handleSquareClick() {
            const sq = $(this).attr('data-square');
            if (squareSelected === null) {
                if (game.get(sq)) {
                    squareSelected = sq;
                    $(`.square-${sq}`).addClass('highlight-selected');
                }
            } else {
                const moveAttempt = squareSelected + sq;
                $('.square-55d63').removeClass('highlight-selected');
                
                if (moveAttempt === gradeSet[currentIdx].move) {
                    score++;
                    currentIdx++;
                    squareSelected = null;
                    setTimeout(loadQuestion, 300);
                } else {
                    lives--;
                    updateLivesUI();
                    squareSelected = null;
                    if (lives <= 0) {
                        alert("Out of lives! Next question.");
                        currentIdx++;
                        setTimeout(loadQuestion, 300);
                    } else {
                        alert("Wrong move! Try again.");
                    }
                }
            }
        }

        function updateLivesUI() {
            document.getElementById("lives-display").innerText = "❤️".repeat(lives);
        }

        // --- ACCUMULATED SCORING & ANTI-CHEAT ---
        function finishGame() {
            const userRef = db.collection("student_progress").doc(pName.toLowerCase());
            const missionKey = `L${currentLevel}T${currentTerm}W${currentWeek}`;

            db.runTransaction(async (transaction) => {
                const doc = await transaction.get(userRef);
                if (!doc.exists) {
                    transaction.set(userRef, {
                        name: pName,
                        totalScore: score,
                        completedMissions: [missionKey]
                    });
                } else {
                    const data = doc.data();
                    if (!data.completedMissions.includes(missionKey)) {
                        transaction.update(userRef, {
                            totalScore: (data.totalScore || 0) + score,
                            completedMissions: firebase.arrayUnion(missionKey)
                        });
                    }
                }
            }).then(() => {
                document.getElementById("game-area").classList.add("hidden");
                document.getElementById("post-game").classList.remove("hidden");
            });
        }

        window.fetchLeaderboard = function() {
            document.getElementById("results-modal").classList.remove("hidden");
            db.collection("student_progress").orderBy("totalScore", "desc").limit(10).get().then(snap => {
                let html = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    html += `<div class="leaderboard-entry"><span>${d.name}</span><b>${d.totalScore} Pts</b></div>`;
                });
                document.getElementById("leaderboard-data").innerHTML = html;
            });
        };
    </script>
</body>
</html>
