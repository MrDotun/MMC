<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Master AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { background: #111; color: #eee; font-family: -apple-system, sans-serif; text-align: center; margin: 0; padding: 5px; overflow: hidden; }
        #board { width: 98vw; max-width: 400px; margin: 5px auto; touch-action: manipulation; }
        .status-bar { background: #222; padding: 12px; margin-bottom: 5px; border-bottom: 2px solid #333; font-weight: bold; }
        .highlight-active { box-shadow: inset 0 0 4px 4px rgba(255, 255, 0, 0.7) !important; }
        button { background: #444; color: white; border: 1px solid #666; padding: 8px 15px; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="status-bar">
        <span id="status">Your Turn</span>
        <br><button onclick="location.reload()">Reset</button>
    </div>
    
    <div id="board"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null, game = new Chess(), sourceSquare = null;

        // Position Values (The AI's Intuition)
        const pst = {
            p: [[0,0,0,0,0,0,0,0],[50,50,50,50,50,50,50,50],[10,10,20,30,30,20,10,10],[5,5,10,25,25,10,5,5],[0,0,0,20,20,0,0,0],[5,-5,-10,0,0,-10,-5,5],[5,10,10,-20,-20,10,10,5],[0,0,0,0,0,0,0,0]],
            n: [[-50,-40,-30,-30,-30,-30,-40,-50],[-40,-20,0,0,0,0,-20,-40],[-30,0,10,15,15,10,0,-30],[-30,5,15,20,20,15,5,-30],[-30,0,15,20,20,15,0,-30],[-30,5,10,15,15,10,5,-30],[-40,-20,0,5,5,0,-20,-40],[-50,-40,-30,-30,-30,-30,-40,-50]],
            b: [[-20,-10,-10,-10,-10,-10,-10,-20],[-10,0,0,0,0,0,0,-10],[-10,0,5,10,10,5,0,-10],[-10,5,5,10,10,5,5,-10],[-10,0,10,10,10,10,0,-10],[-10,10,10,10,10,10,10,-10],[-10,5,0,0,0,0,5,-10],[-20,-10,-10,-10,-10,-10,-10,-20]],
            r: [[0,0,0,0,0,0,0,0],[5,10,10,10,10,10,10,5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[0,0,0,5,5,0,0,0]],
            q: [[-20,-10,-10,-5,-5,-10,-10,-20],[-10,0,0,0,0,0,0,-10],[-10,0,5,5,5,5,0,-10],[-5,0,5,5,5,5,0,-5],[0,0,5,5,5,5,0,-5],[-10,5,5,5,5,5,0,-10],[-10,0,5,0,0,0,0,-10],[-20,-10,-10,-5,-5,-10,-10,-20]],
            k: [[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-20,-30,-30,-40,-40,-30,-30,-20],[-10,-20,-20,-20,-20,-20,-20,-10],[20,20,0,0,0,0,20,20],[20,30,10,0,0,10,30,20]]
        };

        function evaluateBoard(g) {
            let total = 0, b = g.board();
            const w = {p:100, n:320, b:330, r:500, q:900, k:20000};
            for (let i=0; i<8; i++) {
                for (let j=0; j<8; j++) {
                    let p = b[i][j];
                    if (p) {
                        let v = w[p.type] + pst[p.type][p.color==='w' ? 7-i : i][j];
                        total += (p.color==='w' ? v : -v);
                    }
                }
            }
            return total;
        }

        // Fast Alpha-Beta Pruning
        function minimax(g, depth, alpha, beta, isMax) {
            if (depth === 0) return -evaluateBoard(g);
            let moves = g.moves();
            if (isMax) {
                let best = -99999;
                for (let m of moves) {
                    g.move(m);
                    best = Math.max(best, minimax(g, depth-1, alpha, beta, false));
                    g.undo();
                    alpha = Math.max(alpha, best);
                    if (beta <= alpha) break;
                }
                return best;
            } else {
                let best = 99999;
                for (let m of moves) {
                    g.move(m);
                    best = Math.min(best, minimax(g, depth-1, alpha, beta, true));
                    g.undo();
                    beta = Math.min(beta, best);
                    if (beta <= alpha) break;
                }
                return best;
            }
        }

        function makeAiMove() {
            let moves = game.moves();
            if (game.game_over()) { alert("Game Over"); return; }
            let bestMove = null, bestVal = 99999;
            for (let m of moves) {
                game.move(m);
                let val = minimax(game, 3, -100000, 100000, true);
                game.undo();
                if (val < bestVal) { bestVal = val; bestMove = m; }
            }
            game.move(bestMove);
            board.position(game.fen());
            $("#status").text("Your Turn");
        }

        function onSquareClick() {
            let square = $(this).attr('data-square');
            if (sourceSquare === null) {
                let piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    $('.square-adfc7').removeClass('highlight-active');
                    $(this).addClass('highlight-active');
                }
            } else {
                let move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                $('.square-adfc7').removeClass('highlight-active');
                sourceSquare = null;
                if (move) {
                    board.position(game.fen());
                    $("#status").text("Thinking...");
                    setTimeout(makeAiMove, 100);
                } else {
                    // Try re-selecting a different piece
                    let p = game.get(square);
                    if (p && p.color === 'w') {
                        sourceSquare = square;
                        $(this).addClass('highlight-active');
                    }
                }
            }
        }

        board = ChessBoard('board', { 
            position: 'start', 
            draggable: false, 
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' 
        });
        $('#board').on('click', '.square-adfc7', onSquareClick);
    </script>
</body>
</html>
