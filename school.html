<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Chess Assignments</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #board-container { width: 400px; max-width: 95vw; margin: 20px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .hidden { display: none !important; }
        .btn { padding: 12px 24px; margin: 5px; cursor: pointer; font-size: 16px; border-radius: 8px; border: none; background: var(--primary); color: white; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-grade { width: 150px; }
        #results-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 50px rgba(0,0,0,0.4); z-index: 1000; width: 350px; max-height: 80vh; overflow-y: auto; }
        .leaderboard-entry { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; }
        .leaderboard-entry:nth-child(1) { background: #fff9c4; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ddd; box-sizing: border-box; }
        #task-text { background: white; padding: 15px; border-radius: 8px; border-left: 5px solid var(--secondary); margin-bottom: 10px; width: 370px; font-weight: bold; }
        .highlight-legal { box-shadow: inset 0 0 3px 3px rgba(0, 255, 0, 0.5); }
        .highlight-selected { background-color: rgba(255, 255, 0, 0.5) !important; }
    </style>
</head>
<body>

    <h1>♟️ Weekly Chess Missions</h1>

    <div id="setup-area">
        <h3>Welcome! Select your Grade Level:</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn btn-grade" onclick="initMission(1)">Grade 1</button>
            <button class="btn btn-grade" onclick="initMission(2)">Grade 2</button>
            <button class="btn btn-grade" onclick="initMission(3)">Grade 3</button>
            <button class="btn btn-grade" onclick="initMission(4)">Grade 4</button>
            <button class="btn btn-grade" onclick="initMission(5)">Grade 5</button>
            <button class="btn btn-grade" onclick="initMission(6)">Grade 6</button>
        </div>
    </div>

    <div id="game-area" class="hidden">
        <div id="task-text">Loading assignment...</div>
        <div id="board-container">
            <div id="myBoard"></div>
        </div>
        <h3>Score: <span id="current-score">0</span> / 10</h3>
    </div>

    <div id="post-game" class="hidden">
        <h2>Mission Accomplished! 🎉</h2>
        <button class="btn" style="background:var(--secondary)" onclick="fetchLeaderboard()">🏆 Check Results & Leaderboard</button>
        <button class="btn" onclick="location.reload()">🔄 Try Another Grade</button>
    </div>

    <div id="results-modal" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Grade <span id="lbl-grade"></span> Leaderboard</h3>
            <button onclick="document.getElementById('results-modal').classList.add('hidden')" style="border:none; background:none; font-size:20px; cursor:pointer;">&times;</button>
        </div>
        <input type="text" id="search" placeholder="Search for your name..." onkeyup="filterLeaderboard()">
        <div id="leaderboard-data"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcSVNVV3k82Gz_SgL_m3uY4T5Uv1R2W3k8",
            projectId: "assignments-de95a",
            authDomain: "assignments-de95a.firebaseapp.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const allQuestions = [
            // GRADE 1: Focus on basic captures and movement
            { grade: 1, fen: "8/8/8/8/4q3/2N5/8/8 w - - 0 1", move: "c3e4", task: "The Brave Knight: Jump to e4 to capture the Black Queen!" },
            { grade: 1, fen: "2k5/8/8/8/8/8/2P5/2K5 w - - 0 1", move: "c2c4", task: "Pawn Power: Move your Pawn forward two big steps!" },
            { grade: 1, fen: "k7/8/R7/8/8/8/8/K7 w - - 0 1", move: "a6a8", task: "Check the King: Move your Rook to the top row to attack the King!" },
            { grade: 1, fen: "8/2p5/8/3P4/8/8/8/8 w - - 0 1", move: "d5c6", task: "Hungry Pawn: Step diagonally to capture the Black Pawn!" },
            { grade: 1, fen: "3k4/8/3q4/8/3R4/8/8/3K4 w - - 0 1", move: "d4d6", task: "Fair Trade: Use your Rook to capture the Black Queen!" },
            { grade: 1, fen: "8/2p5/8/3N4/8/8/8/8 w - - 0 1", move: "d5c7", task: "Knight Attack: Jump your Knight to c7 to capture the Pawn!" },
            { grade: 1, fen: "r3k2r/8/8/8/8/8/8/4K3 b kq - 0 1", move: "e8c8", task: "King's Shield: Perform a Long Castle to move your King to safety!" },
            { grade: 1, fen: "k7/P7/8/8/8/8/8/K7 w - - 0 1", move: "a7a8q", task: "Super Promotion: Reach the end and turn your Pawn into a Queen!" },
            { grade: 1, fen: "8/8/8/4b3/8/8/3P4/8 w - - 0 1", move: "d2d4", task: "Pawn Poke: Push your Pawn forward to attack the Bishop!" },
            { grade: 1, fen: "8/8/8/8/3b4/8/2P5/8 w - - 0 1", move: "c2c3", task: "The Wall: Move your Pawn to c3 to block the Bishop's path!" },

            // GRADE 2: Focus on basic Checkmate patterns
            { grade: 2, fen: "6k1/5ppp/8/8/8/8/8/R3K3 w - - 0 1", move: "a1a8", task: "Back-Rank Mate: Use your Rook to trap the King on the last row!" },
            { grade: 2, fen: "4k3/8/4Q3/8/4K3/8/8/8 w - - 0 1", move: "e6e8", task: "The 'Kiss of Death': Move your Queen right in front of the King for Mate!" },
            { grade: 2, fen: "k7/8/1R6/2R5/8/8/8/K7 w - - 0 1", move: "c5a5", task: "Ladder Mate: Use your Rooks like steps on a ladder to finish the game!" },
            { grade: 2, fen: "2bqkbnr/1ppp1ppp/2n5/4p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR w KQk - 0 1", move: "f3f7", task: "Scholar's Mate: Can you find the 4-move Checkmate square?" },
            { grade: 2, fen: "7k/5R2/6R1/8/8/8/8/K7 w - - 0 1", move: "g6g8", task: "Corner the King: Use both Rooks to lock the King in the corner." },
            { grade: 2, fen: "1rb4r/pkPp4/1p1P4/1P6/8/8/8/K7 w - - 0 1", move: "c7b8q", task: "Promotion Win: Capture the Rook and promote to a Queen for the win!" },
            { grade: 2, fen: "6k1/5ppp/8/8/8/8/Q7/4K3 w - - 0 1", move: "a2a8", task: "Queen Power: Deliver a Back-Rank Mate using your Queen." },
            { grade: 2, fen: "4k3/1R6/8/8/8/8/2R5/4K3 w - - 0 1", move: "c2c8", task: "Rook Finish: Checkmate the King on the 8th rank." },
            { grade: 2, fen: "8/8/8/8/8/2k5/1p6/rK6 b - - 0 1", move: "a1b1", task: "Black to move: Capture the King and finish the mission!" },
            { grade: 2, fen: "k7/P1K5/8/8/8/8/8/8 w - - 0 1", move: "c7b6", task: "Safe Guard: Move your King to protect your winning Pawn." },

            // GRADE 3: Focus on Forks and Skewers
            { grade: 3, fen: "2k1q3/8/8/8/4N3/8/8/7K w - - 0 1", move: "e4d6", task: "Royal Fork: Use your Knight to attack the King and Queen at once!" },
            { grade: 3, fen: "2r3r1/8/8/8/4N3/8/8/7K w - - 0 1", move: "e4d6", task: "Twin Fork: Attack both Black Rooks with your Knight." },
            { grade: 3, fen: "8/3n1n2/8/4P3/8/8/8/7K w - - 0 1", move: "e5e6", task: "Pawn Fork: Push your Pawn to attack both Knights!" },
            { grade: 3, fen: "8/2k5/3q4/8/8/8/1B6/7K w - - 0 1", move: "b2e5", task: "Bishop Skewer: Attack the King to win the Queen behind it!" },
            { grade: 3, fen: "8/4k3/8/4q3/8/8/8/4R2K w - - 0 1", move: "e1e5", task: "Rook Skewer: Pierce through the King to capture the Queen." },
            { grade: 3, fen: "8/1k6/8/8/8/7n/8/Q6K w - - 0 1", move: "a1h8", task: "Double Attack: Check the King and attack the Knight simultaneously." },
            { grade: 3, fen: "8/3r4/8/8/3B4/8/1k6/7K w - - 0 1", move: "d4b2", task: "Bishop Fork: Attack the King and the Rook at the same time." },
            { grade: 3, fen: "2k5/8/8/8/8/2n5/8/2R4K w - - 0 1", move: "c1c3", task: "Trapped: Capture the Knight that has no escape!" },
            { grade: 3, fen: "2k1r3/8/8/8/4N3/8/8/7K w - - 0 1", move: "e4f6", task: "Knight Fork: Attack the King and the Rook." },
            { grade: 3, fen: "8/8/8/8/4k3/8/8/R3K3 w - - 0 1", move: "a1a4", task: "Distance Skewer: Attack from far away to win the heavy piece." },

            // GRADE 4: Focus on Pins and Discovered Attacks
            { grade: 4, fen: "3k4/3n4/8/3B4/8/8/8/7K w - - 0 1", move: "d5c6", task: "Absolute Pin: Freeze the Knight against the King!" },
            { grade: 4, fen: "3k4/3q4/8/3R4/8/8/8/7K w - - 0 1", move: "d5d7", task: "Win the Pinned Piece: Capture the Queen that cannot move." },
            { grade: 4, fen: "3k4/8/8/8/3N4/8/8/3R3K w - - 0 1", move: "d4e6", task: "Discovered Check: Move the Knight to reveal a check from the Rook!" },
            { grade: 4, fen: "8/8/3q4/8/3B4/8/8/3Q3K w - - 0 1", move: "d4e5", task: "Discovery: Move your Bishop to unleash an attack on the Queen." },
            { grade: 4, fen: "3k4/8/8/8/3N4/8/8/3R3K w - - 0 1", move: "d4c6", task: "Double Check: Move to attack the King with two pieces at once!" },
            { grade: 4, fen: "8/2k5/2n5/2Q5/8/8/8/7K w - - 0 1", move: "c5c6", task: "Pressure: Win the piece that is stuck in a relative pin." },
            { grade: 4, fen: "8/8/8/8/3k4/3P4/3B4/7K w - - 0 1", move: "d2c3", task: "Diagonal Pin: Pin the King to the Rook using your Bishop." },
            { grade: 4, fen: "8/8/8/4k3/4r3/4Q3/8/7K w - - 0 1", move: "e3e4", task: "The Cross-Pin: Use the pin to safely capture the Rook." },
            { grade: 4, fen: "3k4/8/8/3n4/8/3B4/8/7K w - - 0 1", move: "d3e4", task: "Pile On: Attack the pinned Knight a second time." },
            { grade: 4, fen: "8/8/8/8/3q4/3N4/8/3R3K w - - 0 1", move: "d3f4", task: "Reveal: Move the Knight to open a line for your Rook." },

            // GRADE 5: Tactics - Deflection and Removal of Guard
            { grade: 5, fen: "3k4/3p4/8/3R4/8/8/8/7K w - - 0 1", move: "d5d7", task: "Remove the Guard: Capture the Pawn defending the King's position." },
            { grade: 5, fen: "8/4k3/8/4q3/4R3/8/8/7K w - - 0 1", move: "e4e5", task: "Deflection: Force the King to move so you can win the Queen." },
            { grade: 5, fen: "r1bq1rk1/pppp1ppp/2n2n2/2b1p3/2B1P3/2N2N2/PPPP1PPP/R1BQ1RK1 w - - 0 1", move: "c4f7", task: "Sacrifice: Give up a piece to expose the enemy King!" },
            { grade: 5, fen: "8/8/2k5/8/2Q5/8/8/7K w - - 0 1", move: "c4c6", task: "Decoy: Lure the King onto a square that is bad for him." },
            { grade: 5, fen: "6k1/5ppp/8/8/8/8/4R3/7K w - - 0 1", move: "e2e8", task: "Clearance: Clear the path for a winning Back Rank Mate." },
            { grade: 5, fen: "8/8/8/3k4/3p4/3Q4/8/7K w - - 0 1", move: "d3d4", task: "Interference: Break the connection between the enemy defenders." },
            { grade: 5, fen: "8/3k4/8/3q4/8/3R4/8/7K w - - 0 1", move: "d3d5", task: "Overloading: The Queen is busy! Capture her while she's distracted." },
            { grade: 5, fen: "8/8/8/3q4/8/3Q4/8/3R3K w - - 0 1", move: "d3d5", task: "X-Ray Attack: Attack the Queen through another piece." },
            { grade: 5, fen: "3k4/8/8/3N4/3q4/8/8/7K w - - 0 1", move: "d5e7", task: "In-Between Move: Deliver a check before finishing your plan." },
            { grade: 5, fen: "8/8/8/8/4k3/4p3/4P3/7K w - - 0 1", move: "h1g2", task: "Endgame: Use your King to trap and block the enemy." },

            // GRADE 6: Master Patterns
            { grade: 6, fen: "6rk/6pp/8/6N1/8/8/8/7K w - - 0 1", move: "g5f7", task: "Smothered Mate: The King is trapped by his own pieces!" },
            { grade: 6, fen: "6rk/6pp/8/8/8/7Q/8/7K w - - 0 1", move: "h3h7", task: "Queen Sacrifice: Give up your Queen to force a beautiful Mate." },
            { grade: 6, fen: "7k/5R2/8/8/7N/8/8/7K w - - 0 1", move: "h4g6", task: "Anastasia's Mate: Use the Knight and Rook together perfectly." },
            { grade: 6, fen: "2kr4/pppn1ppp/8/8/8/2B5/PPP2PPP/2KR4 w - - 0 1", move: "c3g7", task: "Boden's Mate: Use criss-crossing Bishops to slice the King!" },
            { grade: 6, fen: "7k/R7/5N2/8/8/8/8/7K w - - 0 1", move: "a7h7", task: "Arabian Mate: The Knight protects the Rook for the final blow." },
            { grade: 6, fen: "8/3P4/2k5/8/8/8/8/7K w - - 0 1", move: "d7d8n", task: "Underpromotion: Turn your Pawn into a Knight for a winning Fork!" },
            { grade: 6, fen: "3k4/3P4/3K4/8/8/8/8/8 w - - 0 1", move: "d6c6", task: "The Lucena Position: Find the winning King move in the endgame." },
            { grade: 6, fen: "8/8/3k4/8/3K4/8/8/8 w - - 0 1", move: "d4e4", task: "The Opposition: Use your King to push the enemy King away." },
            { grade: 6, fen: "r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 0 1", move: "h5f7", task: "Master Level: Finish the game with a clinical Checkmate." },
            { grade: 6, fen: "8/3P4/8/8/8/8/8/7K w - - 0 1", move: "d7d8q", task: "The Final Push: Promote your Pawn to crown your victory!" }
        ];

        let game = new Chess();
        let board = null;
        let myGrade = 0;
        let gradeSet = [];
        let currentIdx = 0;
        let score = 0;
        let squareSelected = null;

        window.initMission = function(grade) {
            myGrade = grade;
            gradeSet = allQuestions.filter(q => q.grade === grade);
            currentIdx = 0; 
            score = 0;      
            document.getElementById("current-score").innerText = score;
            document.getElementById("setup-area").classList.add("hidden");
            document.getElementById("game-area").classList.remove("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIdx >= 10) {
                finishGame();
                return;
            }
            const q = gradeSet[currentIdx];
            document.getElementById("task-text").innerText = `Mission ${currentIdx + 1}: ${q.task}`;
            game.load(q.fen);
            squareSelected = null;
            
            board = Chessboard('myBoard', {
                draggable: false, 
                position: q.fen,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            $('#myBoard .square-55d63').off('click mouseenter mouseleave');

            $('#myBoard .square-55d63').on('click', function() {
                const square = $(this).attr('data-square');
                onSquareClick(square);
            });

            $('#myBoard .square-55d63').on('mouseenter', function() {
                const square = $(this).attr('data-square');
                onMouseoverSquare(square);
            }).on('mouseleave', onMouseoutSquare);
        }

        function onSquareClick(square) {
            $('#myBoard .square-55d63').removeClass('highlight-selected');

            if (squareSelected === null) {
                const piece = game.get(square);
                if (piece) {
                    squareSelected = square;
                    $(`#myBoard .square-${square}`).addClass('highlight-selected');
                }
                return;
            }

            const moveResult = handleMove(squareSelected, square);
            
            if (moveResult === 'snapback') {
                if (squareSelected === square) {
                    squareSelected = null;
                } else {
                    const piece = game.get(square);
                    if (piece) {
                        squareSelected = square;
                        $(`#myBoard .square-${square}`).addClass('highlight-selected');
                    } else {
                        squareSelected = null;
                    }
                }
            } else {
                board.position(game.fen());
                squareSelected = null;
            }
        }

        function handleMove(source, target) {
            const move = source + target;
            const q = gradeSet[currentIdx];
            const correct = q.move;
            
            if (move === correct || (move + 'q' === correct) || (move + 'n' === correct)) {
                score++;
                currentIdx++;
                document.getElementById("current-score").innerText = score;
                if (currentIdx < 10) setTimeout(loadQuestion, 500);
                else finishGame();
                return 'move';
            } else {
                return 'snapback';
            }
        }

        function onMouseoverSquare(square) {
            let moves = game.moves({ square: square, verbose: true });
            if (moves.length === 0) return;
            $(`#myBoard .square-${square}`).addClass('highlight-legal');
            for (let i = 0; i < moves.length; i++) {
                $(`#myBoard .square-${moves[i].to}`).addClass('highlight-legal');
            }
        }
        
        function onMouseoutSquare() {
            $('#myBoard .square-55d63').removeClass('highlight-legal');
        }

        async function finishGame() {
            const name = prompt("Assignment Complete! Enter your name for the leaderboard:");
            if (name) {
                try {
                    await addDoc(collection(db, "leaderboard"), {
                        studentName: name,
                        gradeLevel: myGrade,
                        score: score,
                        timestamp: serverTimestamp()
                    });
                } catch(e) { console.error("Firebase Error:", e); }
            }
            document.getElementById("game-area").classList.add("hidden");
            document.getElementById("post-game").classList.remove("hidden");
        }

        window.fetchLeaderboard = async function() {
            try {
                const q = query(
                    collection(db, "leaderboard"), 
                    where("gradeLevel", "==", myGrade), 
                    orderBy("score", "desc"), 
                    orderBy("timestamp", "asc")
                );
                const snap = await getDocs(q);
                let html = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    html += `<div class="leaderboard-entry"><span>${d.studentName}</span><span>${d.score} / 10</span></div>`;
                });
                document.getElementById("leaderboard-data").innerHTML = html || "No scores for this grade yet!";
                document.getElementById("lbl-grade").innerText = myGrade;
                document.getElementById("results-modal").classList.remove("hidden");
            } catch (err) {
                console.error("Fetch Error:", err);
                alert("Could not load leaderboard. Check Firebase console for Index requirements.");
            }
        }

        window.filterLeaderboard = function() {
            let val = document.getElementById("search").value.toLowerCase();
            $(".leaderboard-entry").each(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
            });
        }
    </script>
</body>
</html>
