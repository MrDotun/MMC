<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2200 Elo Chess</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    
    <style>
        body { 
            background: #2c3e50; 
            color: white; 
            font-family: sans-serif; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #myBoard { 
            width: 90vw; /* Responsive width for mobile */
            max-width: 400px; 
            margin: 10px auto;
        }
        .controls { text-align: center; margin-bottom: 10px; }
        button { 
            padding: 12px 25px; 
            font-size: 16px; 
            background: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold;
        }
        #status { margin-top: 10px; font-size: 1.1em; color: #ecf0f1; }
    </style>
</head>
<body>

    <div class="controls">
        <h3>2200 Elo Engine</h3>
        <button onclick="resetGame()">New Game</button>
        <div id="status">Loading Engine...</div>
    </div>

    <div id="myBoard"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        // This uses a specialized version of Stockfish that is more "browser-friendly"
        var stockfish = new Worker('https://cdn.jsdelivr.net/npm/stockfish@10.0.2/src/stockfish.js');

        // Configure Elo 2200
        stockfish.postMessage('uci');
        stockfish.postMessage('setoption name UCI_LimitStrength value true');
        stockfish.postMessage('setoption name UCI_Elo value 2200');
        stockfish.postMessage('isready');

        stockfish.onmessage = function(event) {
            if (event.data === 'readyok') {
                $status.html('Engine Ready. Your turn!');
            }
            if (event.data.startsWith('bestmove')) {
                var move = event.data.split(' ')[1];
                game.move({
                    from: move.substring(0, 2),
                    to: move.substring(2, 4),
                    promotion: 'q'
                });
                board.position(game.fen());
                updateStatus();
            }
        };

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if (piece.search(/^b/) !== -1) return false;
        }

        function onDrop (source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            updateStatus();
            $status.html('AI is thinking...');
            
            stockfish.postMessage('position fen ' + game.fen());
            stockfish.postMessage('go depth 13');
        }

        function updateStatus () {
            var status = (game.turn() === 'w') ? 'White to move' : 'Black to move';
            if (game.in_checkmate()) status = 'Checkmate!';
            else if (game.in_draw()) status = 'Draw!';
            $status.html(status);
        }

        function resetGame() {
            game.reset();
            board.start();
            $status.html('New game started. Your turn!');
        }

        board = ChessBoard('myBoard', {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });
    </script>
</body>
</html>
