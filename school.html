<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Chess Assignments</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #board-container { width: 400px; max-width: 95vw; margin: 20px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .hidden { display: none !important; }
        .btn { padding: 12px 24px; margin: 5px; cursor: pointer; font-size: 16px; border-radius: 8px; border: none; background: var(--primary); color: white; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-grade { width: 150px; }
        #results-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 50px rgba(0,0,0,0.4); z-index: 1000; width: 350px; max-height: 80vh; overflow-y: auto; }
        .leaderboard-entry { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; }
        .leaderboard-entry:nth-child(1) { background: #fff9c4; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ddd; box-sizing: border-box; }
        #task-text { background: white; padding: 15px; border-radius: 8px; border-left: 5px solid var(--secondary); margin-bottom: 10px; width: 370px; font-weight: bold; }
        .highlight-legal { box-shadow: inset 0 0 3px 3px rgba(0, 255, 0, 0.5); }
        .highlight-selected { background-color: rgba(255, 255, 0, 0.5) !important; }
    </style>
</head>
<body>

    <h1>♟️ Weekly Chess Missions</h1>

    <div id="setup-area">
        <h3>Welcome! Select your Grade Level:</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn btn-grade" onclick="initMission(1)">Grade 1</button>
            <button class="btn btn-grade" onclick="initMission(2)">Grade 2</button>
            <button class="btn btn-grade" onclick="initMission(3)">Grade 3</button>
            <button class="btn btn-grade" onclick="initMission(4)">Grade 4</button>
            <button class="btn btn-grade" onclick="initMission(5)">Grade 5</button>
            <button class="btn btn-grade" onclick="initMission(6)">Grade 6</button>
        </div>
    </div>

    <div id="game-area" class="hidden">
        <div id="task-text">Loading assignment...</div>
        <div id="board-container">
            <div id="myBoard"></div>
        </div>
        <h3>Score: <span id="current-score">0</span> / 10</h3>
    </div>

    <div id="post-game" class="hidden">
        <h2>Mission Accomplished! 🎉</h2>
        <button class="btn" style="background:var(--secondary)" onclick="fetchLeaderboard()">🏆 Check Results & Leaderboard</button>
        <button class="btn" onclick="location.reload()">🔄 Try Another Grade</button>
    </div>

    <div id="results-modal" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Grade <span id="lbl-grade"></span> Leaderboard</h3>
            <button onclick="document.getElementById('results-modal').classList.add('hidden')" style="border:none; background:none; font-size:20px; cursor:pointer;">&times;</button>
        </div>
        <input type="text" id="search" placeholder="Search for your name..." onkeyup="filterLeaderboard()">
        <div id="leaderboard-data"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcSVNVV3k82Gz_SgL_m3uY4T5Uv1R2W3k8",
            projectId: "assignments-de95a",
            authDomain: "assignments-de95a.firebaseapp.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const allQuestions = [
            // GRADE 1 - UPDATED CAPTURE MISSIONS
            { grade: 1, fen: "8/8/8/4nn2/4P3/8/8/8 w - - 0 1", move: "e4f5", task: "Mission: Use your Pawn on e4 to capture the Knight on f5!" },
            { grade: 1, fen: "8/8/8/1r3r2/8/8/8/1r3B2 w - - 0 1", move: "f1b5", task: "Mission: Use your Bishop on f1 to capture the Rook on b5!" },
            { grade: 1, fen: "8/8/8/3ppp2/8/3p1N2/8/8 w - - 0 1", move: "f3e5", task: "Mission: Use your Knight on f3 to capture the Pawn on e5!" },
            { grade: 1, fen: "8/7b/8/3b2b1/8/8/1b6/7R w - - 0 1", move: "h1h7", task: "Mission: Use your Rook on h1 to capture the Bishop on h7!" },
            { grade: 1, fen: "3r4/8/8/6r1/1r6/8/7r/3Q4 w - - 0 1", move: "d1d8", task: "Mission: Use your Queen on d1 to capture the Rook on d8!" },
            
            // Add more Grade 1 here later... 
            
            // GRADE 2
            { grade: 2, fen: "6k1/5ppp/8/8/8/8/8/R3K3 w - - 0 1", move: "a1a8", task: "Back-Rank Mate the King!" },
            { grade: 2, fen: "4k3/8/4Q3/8/4K3/8/8/8 w - - 0 1", move: "e6e8", task: "The 'Kiss of Death' Checkmate." },
            { grade: 2, fen: "k7/8/1R6/2R5/8/8/8/K7 w - - 0 1", move: "c5a5", task: "Finish the Ladder Mate." },
            { grade: 2, fen: "2bqkbnr/1ppp1ppp/2n5/4p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR w KQk - 0 1", move: "f3f7", task: "Execute the Scholar's Mate." },
            { grade: 2, fen: "7k/5R2/6R1/8/8/8/8/K7 w - - 0 1", move: "g6g8", task: "Corner the King with both Rooks." },
            { grade: 2, fen: "1rb4r/pkPp4/1p1P4/1P6/8/8/8/K7 w - - 0 1", move: "c7b8q", task: "Capture the Rook and Promote to Win." },
            { grade: 2, fen: "6k1/5ppp/8/8/8/8/Q7/4K3 w - - 0 1", move: "a2a8", task: "Queen delivers Back-Rank Mate." },
            { grade: 2, fen: "4k3/1R6/8/8/8/8/2R5/4K3 w - - 0 1", move: "c2c8", task: "Rook Checkmate on the 8th rank." },
            { grade: 2, fen: "8/8/8/8/8/2k5/1p6/rK6 b - - 0 1", move: "a1b1", task: "Black to move: Finish the game." },
            { grade: 2, fen: "k7/P1K5/8/8/8/8/8/8 w - - 0 1", move: "c7b6", task: "Protect the Pawn with your King." },

            // GRADE 3
            { grade: 3, fen: "2k1q3/8/8/8/4N3/8/8/7K w - - 0 1", move: "e4d6", task: "Royal Fork! King and Queen." },
            { grade: 3, fen: "2r3r1/8/8/8/4N3/8/8/7K w - - 0 1", move: "e4d6", task: "Fork both Rooks with the Knight." },
            { grade: 3, fen: "8/3n1n2/8/4P3/8/8/8/7K w - - 0 1", move: "e5e6", task: "Pawn Fork: Attack both Knights." },
            { grade: 3, fen: "8/2k5/3q4/8/8/8/1B6/7K w - - 0 1", move: "b2e5", task: "Skewer the King to win the Queen." },
            { grade: 3, fen: "8/4k3/8/4q3/8/8/8/4R2K w - - 0 1", move: "e1e5", task: "Rook Skewer: King and Queen." },
            { grade: 3, fen: "8/1k6/8/8/8/7n/8/Q6K w - - 0 1", move: "a1h8", task: "Queen Fork: Check and Knight." },
            { grade: 3, fen: "8/3r4/8/8/3B4/8/1k6/7K w - - 0 1", move: "d4b2", task: "Bishop Fork: King and Rook." },
            { grade: 3, fen: "2k5/8/8/8/8/2n5/8/2R4K w - - 0 1", move: "c1c3", task: "Win the trapped Knight." },
            { grade: 3, fen: "2k1r3/8/8/8/4N3/8/8/7K w - - 0 1", move: "e4f6", task: "Fork the King and the Rook." },
            { grade: 3, fen: "8/8/8/8/4k3/8/8/R3K3 w - - 0 1", move: "a1a4", task: "Skewer the King from distance." },

            // GRADE 4
            { grade: 4, fen: "3k4/3n4/8/3B4/8/8/8/7K w - - 0 1", move: "d5c6", task: "Absolute Pin the Knight." },
            { grade: 4, fen: "3k4/3q4/8/3R4/8/8/8/7K w - - 0 1", move: "d5d7", task: "Win the pinned Queen." },
            { grade: 4, fen: "3k4/8/8/8/3N4/8/8/3R3K w - - 0 1", move: "d4e6", task: "Discovered Check with the Rook." },
            { grade: 4, fen: "8/8/3q4/8/3B4/8/8/3Q3K w - - 0 1", move: "d4e5", task: "Discover an attack on the Queen." },
            { grade: 4, fen: "3k4/8/8/8/3N4/8/8/3R3K w - - 0 1", move: "d4c6", task: "Double Check with two pieces." },
            { grade: 4, fen: "8/2k5/2n5/2Q5/8/8/8/7K w - - 0 1", move: "c5c6", task: "Win the piece in a relative pin." },
            { grade: 4, fen: "8/8/8/8/3k4/3P4/3B4/7K w - - 0 1", move: "d2c3", task: "Pin the King to the Rook." },
            { grade: 4, fen: "8/8/8/4k3/4r3/4Q3/8/7K w - - 0 1", move: "e3e4", task: "The Cross-Pin: Capture the target." },
            { grade: 4, fen: "3k4/8/8/3n4/8/3B4/8/7K w - - 0 1", move: "d3e4", task: "Attack the pinned piece again." },
            { grade: 4, fen: "8/8/8/8/3q4/3N4/8/3R3K w - - 0 1", move: "d3f4", task: "Reveal an attack on the Queen." },

            // GRADE 5
            { grade: 5, fen: "3k4/3p4/8/3R4/8/8/8/7K w - - 0 1", move: "d5d7", task: "Remove the piece guarding the King." },
            { grade: 5, fen: "8/4k3/8/4q3/4R3/8/8/7K w - - 0 1", move: "e4e5", task: "Deflect the King away from the Queen." },
            { grade: 5, fen: "r1bq1rk1/pppp1ppp/2n2n2/2b1p3/2B1P3/2N2N2/PPPP1PPP/R1BQ1RK1 w - - 0 1", move: "c4f7", task: "Sacrifice Bishop to expose King." },
            { grade: 5, fen: "8/8/2k5/8/2Q5/8/8/7K w - - 0 1", move: "c4c6", task: "Decoy the King to a bad square." },
            { grade: 5, fen: "6k1/5ppp/8/8/8/8/4R3/7K w - - 0 1", move: "e2e8", task: "Back Rank Clearance." },
            { grade: 5, fen: "8/8/8/3k4/3p4/3Q4/8/7K w - - 0 1", move: "d3d4", task: "Interference: Block the defense." },
            { grade: 5, fen: "8/3k4/8/3q4/8/3R4/8/7K w - - 0 1", move: "d3d5", task: "Overloading: Take the Queen." },
            { grade: 5, fen: "8/8/8/3q4/8/3Q4/8/3R3K w - - 0 1", move: "d3d5", task: "X-Ray Attack on the Queen." },
            { grade: 5, fen: "3k4/8/8/3N4/3q4/8/8/7K w - - 0 1", move: "d5e7", task: "Zwischenzug: The in-between check." },
            { grade: 5, fen: "8/8/8/8/4k3/4p3/4P3/7K w - - 0 1", move: "h1g2", task: "Endgame: Trap the enemy King." },

            // GRADE 6
            { grade: 6, fen: "6rk/6pp/8/6N1/8/8/8/7K w - - 0 1", move: "g5f7", task: "Smothered Mate with the Knight!" },
            { grade: 6, fen: "6rk/6pp/8/8/8/7Q/8/7K w - - 0 1", move: "h3h7", task: "Queen Sacrifice for Mate." },
            { grade: 6, fen: "7k/5R2/8/8/7N/8/8/7K w - - 0 1", move: "h4g6", task: "Anastasia's Mate pattern." },
            { grade: 6, fen: "2kr4/pppn1ppp/8/8/8/2B5/PPP2PPP/2KR4 w - - 0 1", move: "c3g7", task: "Boden's Mate (Criss-Cross Bishops)." },
            { grade: 6, fen: "7k/R7/5N2/8/8/8/8/7K w - - 0 1", move: "a7h7", task: "The Arabian Mate." },
            { grade: 6, fen: "8/3P4/2k5/8/8/8/8/7K w - - 0 1", move: "d7d8n", task: "Underpromotion to Knight for a Fork." },
            { grade: 6, fen: "3k4/3P4/3K4/8/8/8/8/8 w - - 0 1", move: "d6c6", task: "Winning the Lucena endgame." },
            { grade: 6, fen: "8/8/3k4/8/3K4/8/8/8 w - - 0 1", move: "d4e4", task: "Take the Opposition." },
            { grade: 6, fen: "r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 0 1", move: "h5f7", task: "Final Master Level Mate." },
            { grade: 6, fen: "8/3P4/8/8/8/8/8/7K w - - 0 1", move: "d7d8q", task: "Pawn Promotion to win." }
        ];

        let game = new Chess();
        let board = null;
        let myGrade = 0;
        let gradeSet = [];
        let currentIdx = 0;
        let score = 0;
        let squareSelected = null;

        window.initMission = function(grade) {
            myGrade = grade;
            gradeSet = allQuestions.filter(q => q.grade === grade);
            currentIdx = 0; 
            score = 0;      
            document.getElementById("current-score").innerText = score;
            document.getElementById("setup-area").classList.add("hidden");
            document.getElementById("game-area").classList.remove("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIdx >= gradeSet.length) {
                finishGame();
                return;
            }
            const q = gradeSet[currentIdx];
            document.getElementById("task-text").innerText = `Mission ${currentIdx + 1}: ${q.task}`;
            game.load(q.fen);
            squareSelected = null;
            
            board = Chessboard('myBoard', {
                draggable: false, 
                position: q.fen,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            $('#myBoard .square-55d63').off('click mouseenter mouseleave');

            $('#myBoard .square-55d63').on('click', function() {
                const square = $(this).attr('data-square');
                onSquareClick(square);
            });

            $('#myBoard .square-55d63').on('mouseenter', function() {
                const square = $(this).attr('data-square');
                onMouseoverSquare(square);
            }).on('mouseleave', onMouseoutSquare);
        }

        function onSquareClick(square) {
            $('#myBoard .square-55d63').removeClass('highlight-selected');

            if (squareSelected === null) {
                const piece = game.get(square);
                if (piece) {
                    squareSelected = square;
                    $(`#myBoard .square-${square}`).addClass('highlight-selected');
                }
                return;
            }

            const moveResult = handleMove(squareSelected, square);
            
            if (moveResult === 'snapback') {
                const pieceAtNewSquare = game.get(square);
                if (pieceAtNewSquare) {
                    squareSelected = square;
                    $(`#myBoard .square-${square}`).addClass('highlight-selected');
                } else {
                    squareSelected = null;
                }
            } else {
                board.position(game.fen());
                squareSelected = null;
            }
        }

        function handleMove(source, target) {
            const moveAttempt = source + target;
            const q = gradeSet[currentIdx];
            const correct = q.move;
            
            // Check for correct move (including promotion shorthands)
            if (moveAttempt === correct || (moveAttempt + 'q' === correct) || (moveAttempt + 'n' === correct)) {
                score++;
                currentIdx++;
                document.getElementById("current-score").innerText = score;
                if (currentIdx < gradeSet.length) setTimeout(loadQuestion, 500);
                else finishGame();
                return 'move';
            } else {
                return 'snapback';
            }
        }

        function onMouseoverSquare(square) {
            let moves = game.moves({ square: square, verbose: true });
            if (moves.length === 0) return;
            $(`#myBoard .square-${square}`).addClass('highlight-legal');
            for (let i = 0; i < moves.length; i++) {
                $(`#myBoard .square-${moves[i].to}`).addClass('highlight-legal');
            }
        }
        
        function onMouseoutSquare() {
            $('#myBoard .square-55d63').removeClass('highlight-legal');
        }

        async function finishGame() {
            const name = prompt("Assignment Complete! Enter your name for the leaderboard:");
            if (name) {
                try {
                    await addDoc(collection(db, "leaderboard"), {
                        studentName: name,
                        gradeLevel: myGrade,
                        score: score,
                        timestamp: serverTimestamp()
                    });
                } catch(e) { console.error("Firebase Error:", e); }
            }
            document.getElementById("game-area").classList.add("hidden");
            document.getElementById("post-game").classList.remove("hidden");
        }

        window.fetchLeaderboard = async function() {
            try {
                const q = query(
                    collection(db, "leaderboard"), 
                    where("gradeLevel", "==", myGrade), 
                    orderBy("score", "desc"), 
                    orderBy("timestamp", "asc")
                );
                const snap = await getDocs(q);
                let html = "";
                snap.forEach(doc => {
                    const d = doc.data();
                    html += `<div class="leaderboard-entry"><span>${d.studentName}</span><span>${d.score} / ${gradeSet.length}</span></div>`;
                });
                document.getElementById("leaderboard-data").innerHTML = html || "No scores for this grade yet!";
                document.getElementById("lbl-grade").innerText = myGrade;
                document.getElementById("results-modal").classList.remove("hidden");
            } catch (err) {
                console.error("Fetch Error:", err);
                alert("Could not load leaderboard. Check Firebase console for Index requirements.");
            }
        }

        window.filterLeaderboard = function() {
            let val = document.getElementById("search").value.toLowerCase();
            $(".leaderboard-entry").each(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
            });
        }
    </script>
</body>
</html>
