<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Click-to-Move Chess</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
        #board { width: 95vw; max-width: 400px; margin: 10px auto; }
        .info { background: #333; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        
        /* THE FIX: This targets ONLY the active square */
        .highlight-active {
            box-shadow: inset 0 0 3px 3px #f1c40f !important;
        }
    </style>
</head>
<body>

    <div class="info">
        <div id="status">Tap a piece to move</div>
    </div>
    <div id="board"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var sourceSquare = null;

        function makeAiMove() {
            var moves = game.moves();
            if (moves.length === 0) return;
            // Simple AI move for now to ensure the board works
            game.move(moves[Math.floor(Math.random() * moves.length)]);
            board.position(game.fen());
            $('#status').text("Your turn");
        }

        function onSquareClick() {
            var square = $(this).attr('data-square');
            
            // 1. SELECTING
            if (sourceSquare === null) {
                var piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    $('.square-adfc7').removeClass('highlight-active');
                    $(this).addClass('highlight-active');
                }
                return;
            }

            // 2. MOVING
            var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
            
            if (move === null) {
                // If you click another white piece, switch selection
                var piece = game.get(square);
                if (piece && piece.color === 'w') {
                    sourceSquare = square;
                    $('.square-adfc7').removeClass('highlight-active');
                    $(this).addClass('highlight-active');
                } else {
                    sourceSquare = null;
                    $('.square-adfc7').removeClass('highlight-active');
                }
                return;
            }

            // 3. SUCCESS
            $('.square-adfc7').removeClass('highlight-active');
            sourceSquare = null;
            board.position(game.fen());
            $('#status').text("AI is moving...");
            window.setTimeout(makeAiMove, 500);
        }

        board = ChessBoard('board', {
            position: 'start',
            draggable: false,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        // Use the official chessboard.js class to listen for clicks
        $('#board').on('click', '.square-adfc7', onSquareClick);
    </script>
</body>
</html>
