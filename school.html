<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play against Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <script src="garbochess.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100%; width: 100%;
            overflow-y: auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            background-color: #1a1a2e; color: white;
        }
        #game-container { width: 95vmin; max-width: 550px; text-align: center; padding: 20px 10px; }
        #board { width: 100%; margin-bottom: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .info-panel { background: #2D1B4D; padding: 20px; border-radius: 12px; border: 2px solid #4ade80; }
        .highlight-white { background-color: #f6f669 !important; }
        .highlight-black { background-color: #e6e600 !important; }
        #remark { font-style: italic; color: #ff4d4d; min-height: 1.5em; display: block; margin: 10px 0; font-weight: bold; }
        .grade-badge { font-size: 1.2rem; font-weight: bold; color: #4ade80; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="board"></div>
    <div class="info-panel">
        <div id="status">White to move</div>
        <div id="remark"></div>
        <div class="grade-badge">Grade: <span id="currentGrade">Not Evaluated</span></div>
        <div style="margin-top: 10px;">Score: <span id="totalScore">0</span></div>
    </div>
</div>

<script>
    // --- RESTORED FIREBASE CONFIG ---
    const firebaseConfig = {
        // PASTE YOUR SETTINGS HERE
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_ID",
        appId: "YOUR_APP_ID"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // --- GAME STATE ---
    var board = null;
    var game = new Chess();
    var sourceSquare = null;
    var totalScore = 0;
    var $status = $('#status');
    var $remark = $('#remark');

    // --- RESTORED GRADE LOGIC ---
    function updateGrade() {
        let grade = "Beginner";
        if (totalScore >= 100) grade = "Intermediate";
        if (totalScore >= 300) grade = "Advanced";
        
        $('#currentGrade').text(grade);
        $('#totalScore').text(totalScore);

        // Optional: Update Firebase here if you have a userId
        // db.collection("users").doc(userId).update({ score: totalScore, grade: grade });
    }

    // --- NEW: CHECKMATE & DRAW ANNOUNCER ---
    function checkGameOver() {
        if (game.in_checkmate()) {
            let winner = game.turn() === 'w' ? "Mr. Dotun (Black)" : "You (White)";
            $status.html("<span style='color:#ff4d4d'>CHECKMATE!</span>");
            alert("Game Over! " + winner + " wins!");
            return true;
        }
        if (game.in_draw() || game.in_stalemate()) {
            $status.html("DRAW");
            alert("The game ended in a draw.");
            return true;
        }
        if (game.in_check()) {
            $remark.text("You are in Check!");
        } else {
            $remark.text("");
        }
        return false;
    }

    // --- CLICK LOGIC WITH ILLEGAL MOVE WARNING ---
    function onSquareClick() {
        var square = $(this).attr('class').split('square-')[1].split(' ')[0];
        
        if (sourceSquare === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            }
        } else {
            var move = game.move({
                from: sourceSquare,
                to: square,
                promotion: 'q'
            });

            // Catch illegal moves
            if (move === null) {
                $remark.text("Illegal move! Try again.").fadeIn().delay(1000).fadeOut();
                sourceSquare = null;
                removeHighlights();
                return;
            }

            board.position(game.fen());
            sourceSquare = null;
            removeHighlights();
            
            if (move.captured) {
                const pValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 0 };
                totalScore += pValues[move.captured];
                updateGrade();
            }

            if (checkGameOver()) return;

            $status.html("Mr. Dotun is thinking...");
            window.setTimeout(makeAIMove, 500);
        }
    }

    function makeAIMove() {
        InitializeFromFen(game.fen());
        Search(function(move) {
            var moveStr = FormatMove(move);
            game.move({ from: moveStr.substring(0,2), to: moveStr.substring(2,4), promotion: 'q' });
            board.position(game.fen());
            
            if (!checkGameOver()) {
                $status.html("Your turn");
            }
        }, 3); 
    }

    function addHighlight(square) {
        $('#board .square-' + square).addClass('highlight-white');
    }

    function removeHighlights() {
        $('#board [class*="square-"]').removeClass('highlight-white');
    }

    board = ChessBoard('board', { draggable: false, position: 'start' });
    $('#board').on('click', '[class*="square-"]', onSquareClick);
</script>
</body>
</html>
