<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Mr Dotun | 1800 Elo Chess</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #board-container { width: 400px; max-width: 95vw; margin-top: 20px; border: 5px solid #333; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .info-panel { background: #262626; padding: 20px; border-radius: 8px; width: 400px; max-width: 90vw; text-align: center; border-bottom: 4px solid #f1c40f; }
        #status { font-weight: bold; color: #f1c40f; margin-bottom: 10px; font-size: 1.2rem; min-height: 1.5em; }
        #player-tag { color: #bdc3c7; font-size: 0.9rem; }
        
        /* Highlighting Styles */
        .highlight-white { box-shadow: inset 0 0 3px 3px #f1c40f; }
        .highlight-hint { background-color: rgba(46, 204, 113, 0.4); border-radius: 50%; width: 20px !important; height: 20px !important; margin: 10px; }
    </style>
</head>
<body>

    <div class="info-panel">
        <div id="status">Loading Mr Dotun...</div>
        <div id="player-tag">White vs Black</div>
    </div>

    <div id="board-container">
        <div id="myBoard"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var selectedSquare = null;
        var playerName = prompt("Enter your name to face Mr Dotun:", "Challenger");
        $('#player-tag').text(`${playerName} (White) vs Mr Dotun (Black)`);

        // --- THE FIX: Load pieces from the web instead of local folder ---
        var pieceThemeUrl = 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png';

        // --- Mr Dotun's Engine Logic ---
        const weights = { p: 10, n: 32, b: 33, r: 50, q: 90, k: 900 };
        const pst = {
            p: [[0,0,0,0,0,0,0,0],[50,50,50,50,50,50,50,50],[10,10,20,30,30,20,10,10],[5,5,10,27,27,10,5,5],[0,0,0,22,22,0,0,0],[5,-5,-10,0,0,-10,-5,5],[5,10,10,-20,-20,10,10,5],[0,0,0,0,0,0,0,0]],
            n: [[-50,-40,-30,-30,-30,-30,-40,-50],[-40,-20,0,5,5,0,-20,-40],[-30,5,10,15,15,10,5,-30],[-30,0,15,20,20,15,0,-30],[-30,5,15,20,20,15,5,-30],[-30,0,10,15,15,10,0,-30],[-40,-20,0,0,0,0,-20,-40],[-50,-40,-30,-30,-30,-30,-40,-50]]
        };

        function evaluateBoard(g) {
            let total = 0;
            g.board().forEach((row, i) => {
                row.forEach((piece, j) => {
                    if (piece) {
                        let val = weights[piece.type] + (pst[piece.type] ? pst[piece.type][i][j] : 0);
                        total += (piece.color === 'w' ? val : -val);
                    }
                });
            });
            return total;
        }

        function minimax(g, depth, alpha, beta, isMax) {
            if (depth === 0) return -evaluateBoard(g);
            let moves = g.moves();
            if (isMax) {
                let best = -9999;
                for (let m of moves) {
                    g.move(m);
                    best = Math.max(best, minimax(g, depth-1, alpha, beta, !isMax));
                    g.undo();
                    alpha = Math.max(alpha, best);
                    if (beta <= alpha) break;
                }
                return best;
            } else {
                let best = 9999;
                for (let m of moves) {
                    g.move(m);
                    best = Math.min(best, minimax(g, depth-1, alpha, beta, !isMax));
                    g.undo();
                    beta = Math.min(beta, best);
                    if (beta <= alpha) break;
                }
                return best;
            }
        }

        function makeAiMove() {
            let moves = game.moves();
            if (game.game_over()) return updateStatus();
            let bestMove = null; let bestVal = -9999;
            moves.sort(() => Math.random() - 0.5);
            for (let m of moves) {
                game.move(m);
                let val = minimax(game, 3, -10000, 10000, false);
                game.undo();
                if (val > bestVal) { bestVal = val; bestMove = m; }
            }
            game.move(bestMove);
            board.position(game.fen());
            updateStatus("Mr Dotun moved. Your turn.");
        }

        function onSquareClick(square) {
            if (game.turn() === 'b' || game.game_over()) return;
            if (selectedSquare === null) {
                let piece = game.get(square);
                if (piece && piece.color === 'w') {
                    selectedSquare = square;
                    highlight(square);
                }
            } else {
                let move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                removeHighlights();
                selectedSquare = null;
                if (move) {
                    board.position(game.fen());
                    updateStatus("Mr Dotun is thinking...");
                    setTimeout(makeAiMove, 800);
                } else {
                    let piece = game.get(square);
                    if (piece && piece.color === 'w') {
                        selectedSquare = square;
                        highlight(square);
                    }
                }
            }
        }

        function highlight(sq) {
            $('.square-' + sq).addClass('highlight-white');
            game.moves({square: sq, verbose: true}).forEach(m => {
                $('.square-' + m.to).append('<div class="highlight-hint"></div>');
            });
        }

        function removeHighlights() {
            $('#myBoard [class*="square-"]').removeClass('highlight-white');
            $('.highlight-hint').remove();
        }

        function updateStatus(msg) {
            let status = msg || (game.turn() === 'w' ? "Your turn, " + playerName : "Calculating...");
            if (game.in_checkmate()) status = "Checkmate. Mr Dotun wins.";
            else if (game.in_draw()) status = "Draw.";
            $('#status').text(status);
        }

        // Initialize Board with pieceTheme parameter
        board = Chessboard('myBoard', { 
            position: 'start', 
            onSquareClick: onSquareClick,
            pieceTheme: pieceThemeUrl, // THE FIX
            draggable: false
        });
        updateStatus("Mr Dotun is ready. You are White.");
    </script>
</body>
</html>
