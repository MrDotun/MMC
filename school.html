<!DOCTYPE html>
<html>
<head>
<style>
  /* Base Board Container */
  .board {
    display: grid;
    grid-template-columns: repeat(8, 80px); /* Larger squares */
    grid-template-rows: repeat(8, 80px);
    border: 4px solid #333;
    width: fit-content;
  }

  /* Square Styling */
  .square {
    width: 80px;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Green and White Theme */
  .white-sq { background-color: #f0f0f0; }
  .green-sq { background-color: #2e7d32; }

  /* Piece Styling */
  .piece {
    font-size: 65px;      /* Large pieces */
    opacity: 1;           /* Fully non-transparent */
    user-select: none;
    line-height: 1;
  }

  /* Colors for the Chess Characters */
  .black-piece { color: #000000; }
  .white-piece { 
    color: #ffffff; 
    filter: drop-shadow(0 0 1px #000); /* Adds definition to white pieces */
  }
</style>
</head>
<body>

<div class="board">
  <div class="square white-sq"><span class="piece black-piece">♜</span></div>
  <div class="square green-sq"><span class="piece black-piece">♞</span></div>
  <div class="square white-sq"><span class="piece black-piece">♝</span></div>
  <div class="square green-sq"><span class="piece black-piece">♛</span></div>
  <div class="square white-sq"><span class="piece black-piece">♚</span></div>
  <div class="square green-sq"><span class="piece black-piece">♝</span></div>
  <div class="square white-sq"><span class="piece black-piece">♞</span></div>
  <div class="square green-sq"><span class="piece black-piece">♜</span></div>

  <div class="square green-sq"><span class="piece black-piece">♟</span></div>

  <div class="square white-sq"><span class="piece black-piece">♟</span></div>

</body>
</html>
