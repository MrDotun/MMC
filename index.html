<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Elite Chess & Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-bg: #1e1e4a; 
            --accent-green: #00ff88; 
            --royal-purple: #7c3aed; 
            --text-main: #ffffff;
        }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--primary-bg); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: var(--text-main);
            overflow-x: hidden;
            width: 100%;
        }

        @keyframes neon-pulse {
            0% { box-shadow: 0 0 10px rgba(0, 255, 136, 0.3); border-color: rgba(255, 255, 255, 0.2); }
            50% { box-shadow: 0 0 25px rgba(0, 255, 136, 0.7); border-color: var(--accent-green); }
            100% { box-shadow: 0 0 10px rgba(0, 255, 136, 0.3); border-color: rgba(255, 255, 255, 0.2); }
        }

        /* HERO AREA */
        .carousel-container { 
            position: relative; width: 100%; height: 400px; 
            overflow: hidden; border-bottom: 5px solid var(--accent-green);
        }

        /* MAIN DASHBOARD CONTAINER - Adjusted to fit screen */
        .dashboard-card {
            width: 92%; /* Forces the card to stretch across the mobile screen */
            max-width: 500px; 
            margin: -60px auto 40px; 
            position: relative; z-index: 10; 
            padding: 30px 15px; 
            background: rgba(45, 45, 95, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 35px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            box-sizing: border-box; /* Ensures padding doesn't push the card off screen */
        }

        .grid-container {
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .nav-button {
            text-decoration: none; 
            background: rgba(255, 255, 255, 0.12);
            padding: 25px 10px; 
            border-radius: 24px; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; 
            flex-direction: column; 
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .nav-button .icon { font-size: 32px; margin-bottom: 10px; }
        .nav-button .label { font-weight: 800; font-size: 13px; color: var(--accent-green); letter-spacing: 1px; }

        .task-link {
            text-decoration: none; color: #fff; background: rgba(255,255,255,0.08); 
            padding: 10px; border-radius: 12px; font-size: 10px; 
            font-weight: 800; border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center; margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="carousel-container">
        <div style="position: absolute; width: 100%; height: 100%; background: #2a2a5a; display: flex; align-items: center; justify-content: center;">
            <h1 style="color: white; letter-spacing: 5px;">MIND MASTERS</h1>
        </div>
    </div>

    <div class="dashboard-card">
        <h2 style="text-align: center; color: #fff; margin-bottom: 25px; text-transform: uppercase; font-size: 16px; letter-spacing: 2px; border-bottom: 1px solid var(--accent-green); padding-bottom: 10px;">Command Center</h2>

        <div class="grid-container">
            <a href="quest.html" class="nav-button">
                <div class="icon">⚔️</div>
                <div class="label">Quest Arena</div>
            </a>

            <a href="tournament.html" class="nav-button">
                <div class="icon">🏆</div>
                <div class="label">Tournament</div>
            </a>

            <a href="https://mmc-a0de.onrender.com" class="nav-button" style="grid-column: span 2; background: rgba(124, 58, 237, 0.15); border: 1px solid var(--royal-purple);">
                <div class="icon">🙈</div>
                <div class="label" style="color: #fff;">BLINDFOLD CHALLENGE</div>
            </a>

            <a href="class.html" class="nav-button" style="grid-column: span 2; flex-direction: row; justify-content: center; gap: 15px; padding: 22px; background: rgba(0, 255, 136, 0.1); border: 1px solid var(--accent-green); animation: neon-pulse 2s infinite ease-in-out;">
                <div class="icon" style="margin: 0; font-size: 26px;">🔴</div>
                <div style="display: flex; flex-direction: column; align-items: flex-start; text-align: left;">
                    <div class="label" style="font-size: 15px; color: #fff; margin: 0; letter-spacing: 1px;">LIVE CHESS COACHING</div>
                    <small style="color: var(--accent-green); font-size: 9px; font-weight: 800; text-transform: uppercase;">Interactive Session Room</small>
                </div>
            </a>

            <a href="lessons.html" class="nav-button">
                <div class="icon">📚</div>
                <div class="label">Workbooks</div>
            </a>

            <a href="leaderboard.html" class="nav-button">
                <div class="icon">📊</div>
                <div class="label">Rankings</div>
            </a>

            <div class="nav-button" style="grid-column: span 2;">
                <div class="icon">📅</div>
                <div style="display: flex; flex-direction: column; width: 100%; gap: 10px;">
                    <a href="assignments.html" class="task-link">WEEK 1: PLAY MR DOTUN</a>
                    <a href="notation.html" class="task-link">WEEK 2: CHESS NOTATION</a>
                </div>
            </div>
        </div>
        
        <div style="display: flex; justify-content: center; margin-top: 30px;">
            <a href="https://wa.me/2348025028105" style="text-decoration: none; color: #000; background: var(--accent-green); padding: 15px 40px; border-radius: 50px; font-weight: 800; font-size: 14px; box-shadow: 0 10px 20px rgba(0,255,136,0.3);">
                Contact Instructor
            </a>
        </div>
    </div>

</body>
</html>
