        body { margin: 0; padding: 0; background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Carousel Styling */
        .carousel-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; overflow: hidden; height: 350px; border-radius: 0 0 25px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .slides { display: flex; width: 400%; height: 100%; animation: slide 15s infinite; }
        .slide { width: 25%; height: 100%; background-size: cover; background-position: center; position: relative; }
        
        /* Animation for the images */
        @keyframes slide {
            0% { transform: translateX(0%); }
            20% { transform: translateX(0%); }
            25% { transform: translateX(-25%); }
            45% { transform: translateX(-25%); }
            50% { transform: translateX(-50%); }
            70% { transform: translateX(-50%); }
            75% { transform: translateX(-75%); }
            95% { transform: translateX(-75%); }
            100% { transform: translateX(0%); }
        }

        /* Overlay text for the logo/name */
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(45, 27, 77, 0.7), rgba(45, 27, 77, 0.3)); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
