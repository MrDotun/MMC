        /* Carousel Styling */
        .carousel-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; overflow: hidden; height: 380px; border-radius: 0 0 30px 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); background-color: #2D1B4D; }
        
        /* Updated width to 600% for 6 slides */
        .slides { display: flex; width: 600%; height: 100%; animation: slide 24s infinite; }
        
        /* Updated width to 16.66% (100/6) */
        .slide { width: 16.66%; height: 100%; background-size: cover; background-position: center; }
        
        /* Updated keyframes for 6 smooth transitions */
        @keyframes slide {
            0%, 13% { transform: translateX(0%); }
            16%, 30% { transform: translateX(-16.66%); }
            33%, 46% { transform: translateX(-33.33%); }
            50%, 63% { transform: translateX(-50%); }
            66%, 80% { transform: translateX(-66.66%); }
            83%, 96% { transform: translateX(-83.33%); }
            100% { transform: translateX(0%); }
        }

        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(45, 27, 77, 0.7), rgba(45, 27, 77, 0.4)); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .logo-circle { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #4ade80; background: #2D1B4D; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(74, 222, 128, 0.4); margin-bottom: 10px; }
