<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum & Announcements | Mind Masters</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-dark: #0b0e14;
            --panel-dark: #161b22;
            --accent-gold: #c5a059;
            --accent-blue: #2979ff;
            --accent-green: #4cde80;
            --accent-red: #ef4444;
        }

        * { box-sizing: border-box; }
        
        body {
            background-color: var(--bg-dark);
            color: #e6edf3;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; padding: 0; overflow-x: hidden;
        }

        .nav-bar {
            background: var(--bg-dark)/90;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.25rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 50;
        }

        .nav-title { font-weight: 900; font-size: 1.25rem; text-transform: uppercase; letter-spacing: -0.05em; color: white; }
        .nav-title .accent { color: var(--accent-gold); }

        .container {
            max-width: 1000px; margin: 0 auto;
            padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 2rem;
        }

        .card {
            background: var(--panel-dark);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.25rem; padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .input-field {
            width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 0.75rem 1rem; border-radius: 0.75rem; margin-bottom: 1rem; outline: none;
        }
        .input-field:focus { border-color: var(--accent-gold); }
        
        .btn {
            background: var(--accent-gold); color: black; border: none; border-radius: 0.75rem;
            padding: 0.75rem 1.5rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease;
            text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(197, 160, 89, 0.3); }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; }
        .btn-outline:hover { background: rgba(255,255,255,0.1); box-shadow: none; }

        .post-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem;}
        .post-title { font-size: 1.5rem; font-weight: 900; color: white; margin: 0; }
        .post-date { font-size: 0.8rem; color: rgba(255,255,255,0.5); }
        .post-body { font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem; white-space: pre-wrap; }
        .post-flyer { width: 100%; max-width: 600px; border-radius: 0.75rem; margin-bottom: 1.5rem; border: 2px solid var(--accent-gold); }
        
        .chess-viewer { background: #0f172a; padding: 1rem; border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 1.5rem; max-width: 450px; margin-left: auto; margin-right: auto;}
        .board-controls { display: flex; justify-content: space-between; margin-top: 1rem; gap: 0.5rem; }
        .board-controls button { flex: 1; padding: 0.5rem; background: rgba(255,255,255,0.1); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: bold; }
        .board-controls button:hover { background: var(--accent-gold); color: black; }
        .move-history { font-family: monospace; color: var(--accent-green); text-align: center; margin-top: 10px; min-height: 24px; font-weight: bold; font-size: 1.1rem; }

        .comments-section { background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 0.75rem; margin-top: 1rem; }
        .comment { display: flex; gap: 0.75rem; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem; align-items: flex-start; }
        .comment-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-gold), var(--accent-blue)); display: flex; align-items: center; justify-content: center; font-weight: 700; color: black; font-size: 0.8rem; flex-shrink: 0; }
        .comment-content { flex: 1; }
        .comment-header { display: flex; gap: 0.5rem; align-items: center; justify-content: space-between; }
        .comment-name { font-weight: bold; font-size: 0.9rem; color: var(--accent-gold); }
        .comment-class { font-size: 0.7rem; color: rgba(255,255,255,0.4); }
        .comment-text { font-size: 0.9rem; margin-top: 0.25rem; }
        
        .delete-btn { color: var(--accent-red); cursor: pointer; font-size: 0.8rem; opacity: 0.6; transition: 0.2s; }
        .delete-btn:hover { opacity: 1; transform: scale(1.1); }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <div class="nav-title">MIND MASTERS <span class="accent">HQ</span></div>
        <button class="btn btn-outline" id="adminLockBtn" onclick="adminLogin()" style="padding: 0.5rem 1rem; font-size: 0.75rem;"><i class="fas fa-lock"></i> Admin</button>
    </div>

    <div class="container">
        
        <div class="card" id="identityCard">
            <h3 style="color: var(--accent-gold); margin-top:0;">👤 Join the Discussion</h3>
            <div style="display: flex; gap: 1rem;">
                <input type="text" id="joinName" class="input-field" placeholder="Full Name" style="margin:0;">
                <input type="text" id="joinClass" class="input-field" placeholder="Class/Grade" style="margin:0;">
                <button class="btn" onclick="saveIdentity()">Save</button>
            </div>
        </div>

        <div class="card hidden" id="adminPanel" style="border-color: var(--accent-blue);">
            <h3 style="color: var(--accent-blue); margin-top:0;"><i class="fas fa-plus-circle"></i> Create New Announcement</h3>
            <input type="text" id="postTitle" class="input-field" placeholder="Announcement Title">
            <textarea id="postBody" class="input-field" placeholder="What's the news?" rows="4"></textarea>
            <input type="text" id="postImage" class="input-field" placeholder="Image URL (Flyer link)">
            <textarea id="postPGN" class="input-field" placeholder="Paste PGN here" rows="3"></textarea>
            <button class="btn" style="background: var(--accent-blue); color: white;" onclick="createPost()">Publish Post</button>
        </div>

        <div id="feedContainer">
            <div style="text-align: center; color: rgba(255,255,255,0.5); padding: 2rem;">Loading announcements...</div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
            authDomain: "assignments-de95a.firebaseapp.com",
            projectId: "assignments-de95a",
            storageBucket: "assignments-de95a.firebasestorage.app",
            messagingSenderId: "1088073398299",
            appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let currentUser = null;
        let isAdmin = false; 
        let gameViewers = {};

        window.onload = () => {
            loadIdentity();
            loadPosts();
        };

        function loadIdentity() {
            const stored = localStorage.getItem('mmForumUser');
            if (stored) {
                currentUser = JSON.parse(stored);
                document.getElementById('identityCard').innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <span style="color:var(--accent-gold); font-weight:bold;">${currentUser.name}</span> 
                            <span style="color:rgba(255,255,255,0.5); font-size:0.8rem;">(${currentUser.class})</span>
                        </div>
                        <button class="btn btn-outline" style="padding:0.25rem 0.75rem; font-size:0.75rem;" onclick="logout()">Edit Profile</button>
                    </div>
                `;
            }
        }

        function saveIdentity() {
            const name = document.getElementById('joinName').value.trim();
            const pclass = document.getElementById('joinClass').value.trim();
            if (!name) return alert("Please enter your name!");
            currentUser = { name, class: pclass || "Guest" };
            localStorage.setItem('mmForumUser', JSON.stringify(currentUser));
            loadIdentity();
        }

        function logout() { localStorage.removeItem('mmForumUser'); location.reload(); }

        function adminLogin() {
            const pw = prompt("Enter Admin Password:");
            if(pw === "dotun1234") {
                isAdmin = true;
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('adminLockBtn').innerHTML = '<i class="fas fa-unlock"></i> Admin Active';
                loadPosts(); // Reload to show delete buttons
            } else {
                alert("Incorrect Password.");
            }
        }

        async function createPost() {
            const title = document.getElementById('postTitle').value.trim();
            const body = document.getElementById('postBody').value.trim();
            const image = document.getElementById('postImage').value.trim();
            const pgn = document.getElementById('postPGN').value.trim();
            if(!title || !body) return alert("Title and text are required.");
            try {
                await db.collection('forum_posts').add({
                    title: title, body: body, imageUrl: image, pgn: pgn,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('postTitle').value = '';
                document.getElementById('postBody').value = '';
                document.getElementById('postImage').value = '';
                document.getElementById('postPGN').value = '';
                loadPosts();
            } catch (e) { alert("Error publishing."); }
        }

        async function loadPosts() {
            const container = document.getElementById('feedContainer');
            try {
                const snap = await db.collection('forum_posts').orderBy('timestamp', 'desc').limit(20).get();
                if (snap.empty) {
                    container.innerHTML = `<div style="text-align:center; color:#94a3b8;">No announcements yet.</div>`;
                    return;
                }
                container.innerHTML = '';
                gameViewers = {};

                snap.forEach(doc => {
                    const data = doc.data();
                    const postId = doc.id;
                    const time = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleDateString() : 'Just now';

                    let postHtml = `
                        <div class="card">
                            <div class="post-header">
                                <div>
                                    <h2 class="post-title">${data.title}</h2>
                                    <div class="post-date"><i class="far fa-calendar-alt"></i> ${time}</div>
                                </div>
                                ${isAdmin ? `<i class="fas fa-trash-alt delete-btn" onclick="deletePost('${postId}')"></i>` : ''}
                            </div>
                            <div class="post-body">${escapeHtml(data.body)}</div>
                    `;

                    if (data.imageUrl) { postHtml += `<img src="${data.imageUrl}" class="post-flyer" onerror="this.style.display='none'">`; }
                    if (data.pgn) {
                        postHtml += `
                            <div class="chess-viewer">
                                <div id="board-${postId}" style="width: 100%;"></div>
                                <div class="move-history" id="moveText-${postId}">Game Start</div>
                                <div class="board-controls">
                                    <button onclick="navigateGame('${postId}', -1)">Prev</button>
                                    <button onclick="navigateGame('${postId}', 1)">Next</button>
                                </div>
                            </div>
                        `;
                    }
                    postHtml += `
                            <div class="comments-section">
                                <div id="comments-${postId}" style="margin-bottom: 1rem; max-height: 250px; overflow-y: auto;"></div>
                                <div style="display:flex; gap:0.5rem;">
                                    <input type="text" id="commentInput-${postId}" class="input-field" style="margin:0; padding:0.5rem;" placeholder="Add a comment...">
                                    <button class="btn" style="padding:0.5rem 1rem;" onclick="addComment('${postId}')"><i class="fas fa-paper-plane"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += postHtml;
                });

                snap.forEach(doc => {
                    const data = doc.data();
                    if(data.pgn) { setupChessBoard(doc.id, data.pgn); }
                    loadComments(doc.id);
                });
            } catch (e) { container.innerHTML = `<div style="text-align:center; color:red;">Error loading feed.</div>`; }
        }

        function setupChessBoard(postId, pgnString) {
            let gameLogic = new Chess();
            if (!gameLogic.load_pgn(pgnString)) return;
            let history = gameLogic.history({ verbose: true });
            let displayGame = new Chess();
            let board = Chessboard(`board-${postId}`, {
                position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png', draggable: false
            });
            gameViewers[postId] = { moves: history, currentIndex: -1, game: displayGame, board: board };
        }

        function navigateGame(postId, direction) {
            const viewer = gameViewers[postId];
            if (!viewer) return;
            if (direction === 1 && viewer.currentIndex < viewer.moves.length - 1) {
                viewer.currentIndex++;
                viewer.game.move(viewer.moves[viewer.currentIndex].san);
            } else if (direction === -1 && viewer.currentIndex >= 0) {
                viewer.game.undo();
                viewer.currentIndex--;
            }
            viewer.board.position(viewer.game.fen());
            document.getElementById(`moveText-${postId}`).innerText = viewer.currentIndex === -1 ? "Game Start" : `Move ${Math.floor(viewer.currentIndex/2)+1}: ${viewer.moves[viewer.currentIndex].san}`;
        }

        async function loadComments(postId) {
            const container = document.getElementById(`comments-${postId}`);
            db.collection('forum_comments').where('postId', '==', postId).orderBy('timestamp', 'asc').onSnapshot(snap => {
                let html = '';
                snap.forEach(doc => {
                    const c = doc.data();
                    html += `
                        <div class="comment">
                            <div class="comment-avatar">${c.name.charAt(0).toUpperCase()}</div>
                            <div class="comment-content">
                                <div class="comment-header">
                                    <div><span class="comment-name">${c.name}</span> <span class="comment-class">(${c.class})</span></div>
                                    ${isAdmin ? `<i class="fas fa-trash delete-btn" onclick="deleteComment('${doc.id}')"></i>` : ''}
                                </div>
                                <div class="comment-text">${escapeHtml(c.text)}</div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html || '<div style="color:rgba(255,255,255,0.2); font-size:0.8rem;">No comments.</div>';
            });
        }

        async function addComment(postId) {
            if(!currentUser) return alert("Please save your profile to comment!");
            const input = document.getElementById(`commentInput-${postId}`);
            const text = input.value.trim();
            if(!text) return;
            input.value = '';
            await db.collection('forum_comments').add({
                postId: postId, name: currentUser.name, class: currentUser.class, text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        // === DELETE FUNCTIONS ===
        async function deleteComment(id) {
            if(confirm("Delete this comment?")) {
                await db.collection('forum_comments').doc(id).delete();
            }
        }

        async function deletePost(id) {
            if(confirm("Delete this entire post and all its comments?")) {
                await db.collection('forum_posts').doc(id).delete();
                // Optional: Batch delete associated comments here if desired
                loadPosts();
            }
        }

        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    </script>
</body>
</html>
