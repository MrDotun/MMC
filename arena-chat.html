<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum & Announcements | Mind Masters</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-dark: #0b0e14; --panel-dark: #161b22; --accent-gold: #c5a059;
            --accent-blue: #2979ff; --accent-green: #4cde80; --accent-red: #ef4444;
        }

        body { background-color: var(--bg-dark); color: #e6edf3; font-family: 'Plus Jakarta Sans', sans-serif; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
        .card { background: var(--panel-dark); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 1.25rem; padding: 1.5rem; margin-bottom: 2rem; position: relative; }
        
        /* Gallery System: Auto-adjusts based on number of images */
        .image-gallery { display: grid; gap: 10px; margin: 15px 0; }
        .gallery-1 { grid-template-columns: 1fr; }
        .gallery-2 { grid-template-columns: 1fr 1fr; }
        .gallery-3 { grid-template-columns: 1fr 1fr 1fr; }
        .gallery-4 { grid-template-columns: repeat(2, 1fr); }

        .img-wrapper { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); background: #000; }
        .post-img { width: 100%; height: 250px; object-fit: cover; transition: 0.3s; cursor: pointer; }
        .post-img:hover { transform: scale(1.05); filter: brightness(1.2); }
        
        .save-btn {
            position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.6);
            color: white; padding: 4px 8px; border-radius: 6px; font-size: 0.65rem;
            backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2);
        }

        .input-field { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 0.75rem; border-radius: 0.75rem; margin-bottom: 10px; outline: none; }
        .btn { background: var(--accent-gold); color: black; border-radius: 0.75rem; padding: 0.75rem 1.5rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .chess-viewer { background: #0f172a; padding: 1rem; border-radius: 1rem; max-width: 450px; margin: 20px auto; border: 1px solid #1e293b; }
        .comment { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <div>
                <h1 style="font-weight:900; font-size:1.8rem; letter-spacing:-1px;">MIND MASTERS <span style="color:var(--accent-gold)">HQ</span></h1>
                <p style="font-size:0.8rem; color:gray;">Tournaments, Highlights & Games</p>
            </div>
            <button class="btn" onclick="adminLogin()" style="background:transparent; border:1px solid #334155; color:#94a3b8; padding:6px 16px; font-size:0.75rem;">ADMIN PANEL</button>
        </header>

        <div class="card" id="identityCard">
            <h3 style="color:var(--accent-gold); margin-bottom:12px; font-weight:700;">👤 Join the Conversation</h3>
            <div style="display:flex; gap:10px;">
                <input id="joinName" class="input-field" placeholder="Your Name" style="margin:0;">
                <input id="joinClass" class="input-field" placeholder="Class (e.g. Primary 5)" style="margin:0;">
                <button class="btn" onclick="saveIdentity()">Save Profile</button>
            </div>
        </div>

        <div class="card hidden" id="adminPanel" style="border: 2px solid var(--accent-blue);">
            <h3 style="color:var(--accent-blue); margin-bottom:15px; font-weight:800;"><i class="fas fa-paper-plane"></i> Publish to Forum</h3>
            <input id="postTitle" class="input-field" placeholder="Announcement Title (e.g. May Tournament Updates)">
            <textarea id="postBody" class="input-field" placeholder="Write your highlights or news here..." rows="4"></textarea>
            
            <div style="background:rgba(255,255,255,0.03); padding:10px; border-radius:10px; margin-bottom:10px;">
                <label style="font-size:0.75rem; color:var(--accent-blue); font-weight:bold;">IMAGE LINKS (Separated by commas)</label>
                <input id="postImages" class="input-field" style="margin-top:5px;" placeholder="URL1, URL2, URL3...">
            </div>

            <div style="background:rgba(255,255,255,0.03); padding:10px; border-radius:10px; margin-bottom:15px;">
                <label style="font-size:0.75rem; color:var(--accent-green); font-weight:bold;">PGN GAME DATA (Optional)</label>
                <textarea id="postPGN" class="input-field" style="margin-top:5px;" placeholder="Paste PGN here for interactive replay"></textarea>
            </div>

            <button class="btn" style="background:var(--accent-blue); color:white; width:100%;" onclick="createPost()">POST TO FORUM</button>
        </div>

        <div id="feedContainer"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
            authDomain: "assignments-de95a.firebaseapp.com",
            projectId: "assignments-de95a",
            storageBucket: "assignments-de95a.firebasestorage.app",
            messagingSenderId: "1088073398299",
            appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = null, isAdmin = false, gameViewers = {};

        window.onload = () => { loadIdentity(); loadPosts(); };

        function loadIdentity() {
            const stored = localStorage.getItem('mmForumUser');
            if (stored) {
                currentUser = JSON.parse(stored);
                document.getElementById('identityCard').innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>Welcome back, <b style="color:var(--accent-gold)">${currentUser.name}</b> <small>(${currentUser.class})</small></span>
                    <button onclick="logout()" style="text-decoration:underline; font-size:0.7rem; color:#ef4444;">Logout</button>
                </div>`;
            }
        }

        function saveIdentity() {
            const name = document.getElementById('joinName').value.trim();
            if (name) {
                currentUser = { name, class: document.getElementById('joinClass').value || "Student" };
                localStorage.setItem('mmForumUser', JSON.stringify(currentUser));
                loadIdentity();
            } else { alert("Please enter your name!"); }
        }

        function logout() { localStorage.removeItem('mmForumUser'); location.reload(); }

        function adminLogin() { if(prompt("Enter Admin Key:") === "dotun1234") { isAdmin = true; document.getElementById('adminPanel').classList.remove('hidden'); loadPosts(); } }

        async function createPost() {
            const title = document.getElementById('postTitle').value.trim();
            const body = document.getElementById('postBody').value.trim();
            if (!title || !body) return alert("Title and Body are required!");

            const imagesArr = document.getElementById('postImages').value.split(',').map(u => u.trim()).filter(u => u !== "");
            
            await db.collection('forum_posts').add({
                title, body, pgn: document.getElementById('postPGN').value,
                images: imagesArr,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            // Clear inputs and refresh
            document.getElementById('postTitle').value = "";
            document.getElementById('postBody').value = "";
            document.getElementById('postImages').value = "";
            document.getElementById('postPGN').value = "";
            loadPosts();
            alert("Published successfully!");
        }

        async function loadPosts() {
            const container = document.getElementById('feedContainer');
            const snap = await db.collection('forum_posts').orderBy('timestamp', 'desc').get();
            container.innerHTML = '';

            snap.forEach(doc => {
                const data = doc.data();
                const postId = doc.id;
                const imgs = data.images || [];
                
                // Logic to set gallery columns based on image count
                let gridClass = "gallery-1";
                if(imgs.length === 2) gridClass = "gallery-2";
                if(imgs.length === 3) gridClass = "gallery-3";
                if(imgs.length >= 4) gridClass = "gallery-4";

                let galleryHtml = `<div class="image-gallery ${gridClass}">`;
                imgs.forEach(url => {
                    galleryHtml += `
                        <div class="img-wrapper">
                            <img src="${url}" class="post-img" onclick="window.open('${url}', '_blank')">
                            <div class="save-btn"><i class="fas fa-expand"></i> View</div>
                        </div>`;
                });
                galleryHtml += `</div>`;

                container.innerHTML += `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <h2 style="font-size:1.6rem; color:var(--accent-gold); font-weight:800; line-height:1.2;">${data.title}</h2>
                            ${isAdmin ? `<i class="fas fa-trash-alt" onclick="deletePost('${postId}')" style="cursor:pointer; color:var(--accent-red); opacity:0.6;"></i>` : ''}
                        </div>
                        <p style="margin:15px 0; line-height:1.6; color:#cbd5e1; white-space:pre-wrap;">${data.body}</p>
                        
                        ${imgs.length > 0 ? galleryHtml : ''}

                        ${data.pgn ? `
                            <div class="chess-viewer">
                                <div id="board-${postId}" style="width:100%"></div>
                                <div id="move-${postId}" style="text-align:center; padding:12px; font-weight:bold; color:var(--accent-green); font-family:monospace;">Game Replay</div>
                                <div style="display:flex; gap:8px;">
                                    <button class="btn" style="flex:1; background:#1e293b; color:white; font-size:0.7rem;" onclick="nav('${postId}',-1)">PREV</button>
                                    <button class="btn" style="flex:1; background:#1e293b; color:white; font-size:0.7rem;" onclick="nav('${postId}',1)">NEXT</button>
                                </div>
                            </div>` : ''}

                        <div style="background:rgba(0,0,0,0.15); padding:15px; border-radius:12px; margin-top:20px; border:1px solid rgba(255,255,255,0.05);">
                            <div id="comments-${postId}"></div>
                            <div style="display:flex; gap:10px; margin-top:12px;">
                                <input id="ci-${postId}" class="input-field" style="margin:0; font-size:0.85rem;" placeholder="Write a comment...">
                                <button class="btn" style="padding:0.5rem 1rem;" onclick="addComment('${postId}')"><i class="fas fa-paper-plane"></i></button>
                            </div>
                        </div>
                    </div>`;
                
                if(data.pgn) setupBoard(postId, data.pgn);
                loadComments(postId);
            });
        }

        // --- Chess Engine Logic ---
        function setupBoard(id, pgn) {
            let chess = new Chess();
            if (!chess.load_pgn(pgn)) return;
            let history = chess.history({verbose:true});
            let board = Chessboard(`board-${id}`, { position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
            gameViewers[id] = { moves: history, index: -1, g: new Chess(), b: board };
        }

        function nav(id, d) {
            let v = gameViewers[id];
            if(d===1 && v.index < v.moves.length-1) { v.index++; v.g.move(v.moves[v.index].san); }
            else if(d===-1 && v.index >= 0) { v.g.undo(); v.index--; }
            v.b.position(v.g.fen());
            document.getElementById(`move-${id}`).innerText = v.index === -1 ? "Start" : `${Math.floor(v.index/2)+1}. ${v.moves[v.index].san}`;
        }

        // --- Comments Logic ---
        function loadComments(id) {
            db.collection('forum_comments').where('postId', '==', id).orderBy('timestamp', 'asc').onSnapshot(s => {
                let h = '';
                s.forEach(d => { 
                    const c = d.data();
                    h += `<div class="comment">
                            <div style="width:32px; height:32px; background:linear-gradient(to bottom, #475569, #1e293b); color:white; border-radius:8px; text-align:center; line-height:32px; font-weight:bold; font-size:0.8rem;">${c.name[0].toUpperCase()}</div>
                            <div style="flex:1;">
                                <div style="display:flex; justify-content:space-between;">
                                    <span style="font-weight:bold; font-size:0.85rem; color:var(--accent-gold);">${c.name} <small style="color:gray; font-weight:normal;">(${c.class})</small></span>
                                    ${isAdmin ? `<i class="fas fa-times" onclick="delC('${d.id}')" style="color:red; cursor:pointer; font-size:0.7rem;"></i>` : ''}
                                </div>
                                <div style="font-size:0.85rem; color:#e2e8f0; margin-top:2px;">${c.text}</div>
                            </div>
                          </div>`; 
                });
                document.getElementById(`comments-${id}`).innerHTML = h;
            });
        }

        async function addComment(id) {
            if(!currentUser) return alert("Please set your profile name first!");
            const inp = document.getElementById(`ci-${id}`);
            if(!inp.value.trim()) return;
            await db.collection('forum_comments').add({ postId: id, name: currentUser.name, class: currentUser.class, text: inp.value, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
            inp.value = '';
        }

        async function deletePost(id) { if(confirm("Permanently delete this announcement?")) { await db.collection('forum_posts').doc(id).delete(); loadPosts(); } }
        async function delC(id) { if(confirm("Delete this comment?")) await db.collection('forum_comments').doc(id).delete(); }
    </script>
</body>
</html>
