<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum & Announcements | Mind Masters</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-dark: #0b0e14; --panel-dark: #161b22; --accent-gold: #c5a059;
            --accent-blue: #2979ff; --accent-green: #4cde80; --accent-red: #ef4444;
        }

        body { background-color: var(--bg-dark); color: #e6edf3; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }

        .nav-bar {
            background: var(--bg-dark)/90; backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; }

        .card { background: var(--panel-dark); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 1.25rem; padding: 1.5rem; margin-bottom: 1.5rem; }

        .input-field {
            width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 0.75rem 1rem; border-radius: 0.75rem; margin-bottom: 1rem; outline: none;
        }
        
        .btn { background: var(--accent-gold); color: black; border-radius: 0.75rem; padding: 0.75rem 1.5rem; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 0.85rem; }

        /* Gallery Grid */
        .image-gallery { display: grid; gap: 10px; margin-bottom: 1.5rem; }
        .gallery-1 { grid-template-columns: 1fr; }
        .gallery-2 { grid-template-columns: 1fr 1fr; }
        .gallery-3 { grid-template-columns: 1fr 1fr; }
        .gallery-3 img:first-child { grid-column: span 2; }
        .gallery-4 { grid-template-columns: 1fr 1fr; }
        .post-img { width: 100%; height: 250px; object-fit: cover; border-radius: 0.75rem; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s; }
        .post-img:hover { transform: scale(1.02); }

        .chess-viewer { background: #0f172a; padding: 1rem; border-radius: 1rem; margin-bottom: 1.5rem; max-width: 450px; margin: 0 auto 1.5rem auto; }
        .move-history { font-family: monospace; color: var(--accent-green); text-align: center; margin-top: 10px; font-weight: bold; }
        
        .comment { display: flex; gap: 0.75rem; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem; }
        .delete-btn { color: var(--accent-red); cursor: pointer; font-size: 0.8rem; margin-left: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <div style="font-weight: 900; color: white;">MIND MASTERS <span style="color:var(--accent-gold)">HQ</span></div>
        <button class="btn" id="adminLockBtn" onclick="adminLogin()" style="background:transparent; border:1px solid rgba(255,255,255,0.2); color:white; padding:5px 15px;">Admin</button>
    </div>

    <div class="container">
        <div class="card" id="identityCard">
            <h3 style="color: var(--accent-gold); margin-bottom:10px;">👤 Join the Discussion</h3>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="joinName" class="input-field" placeholder="Full Name" style="margin:0;">
                <input type="text" id="joinClass" class="input-field" placeholder="Class" style="margin:0;">
                <button class="btn" onclick="saveIdentity()">Save</button>
            </div>
        </div>

        <div class="card hidden" id="adminPanel">
            <h3 style="color: var(--accent-blue);">🚀 Post an Announcement</h3>
            <input type="text" id="postTitle" class="input-field" placeholder="Title">
            <textarea id="postBody" class="input-field" placeholder="Details..." rows="3"></textarea>
            <input type="text" id="postImages" class="input-field" placeholder="Paste Image URLs (Separate with commas for a gallery)">
            <textarea id="postPGN" class="input-field" placeholder="Paste PGN here" rows="2"></textarea>
            <button class="btn" style="background: var(--accent-blue); color:white;" onclick="createPost()">Publish</button>
        </div>

        <div id="feedContainer"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
            authDomain: "assignments-de95a.firebaseapp.com",
            projectId: "assignments-de95a",
            storageBucket: "assignments-de95a.firebasestorage.app",
            messagingSenderId: "1088073398299",
            appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = null, isAdmin = false, gameViewers = {};

        window.onload = () => { loadIdentity(); loadPosts(); };

        function loadIdentity() {
            const stored = localStorage.getItem('mmForumUser');
            if (stored) {
                currentUser = JSON.parse(stored);
                document.getElementById('identityCard').innerHTML = `<b>${currentUser.name}</b> (${currentUser.class}) <button onclick="logout()" style="font-size:0.7rem; color:var(--accent-gold); margin-left:10px;">Change</button>`;
            }
        }

        function saveIdentity() {
            const name = document.getElementById('joinName').value.trim();
            const pclass = document.getElementById('joinClass').value.trim();
            if (name) {
                currentUser = { name, class: pclass || "Student" };
                localStorage.setItem('mmForumUser', JSON.stringify(currentUser));
                loadIdentity();
            }
        }

        function logout() { localStorage.removeItem('mmForumUser'); location.reload(); }

        function adminLogin() {
            if(prompt("Admin Password:") === "dotun1234") {
                isAdmin = true;
                document.getElementById('adminPanel').classList.remove('hidden');
                loadPosts();
            }
        }

        async function createPost() {
            const title = document.getElementById('postTitle').value;
            const body = document.getElementById('postBody').value;
            const imgs = document.getElementById('postImages').value;
            const pgn = document.getElementById('postPGN').value;
            
            await db.collection('forum_posts').add({
                title, body, pgn,
                images: imgs.split(',').map(s => s.trim()).filter(s => s !== ""),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            location.reload();
        }

        async function loadPosts() {
            const container = document.getElementById('feedContainer');
            const snap = await db.collection('forum_posts').orderBy('timestamp', 'desc').get();
            container.innerHTML = '';

            snap.forEach(doc => {
                const data = doc.data();
                const postId = doc.id;
                const imgs = data.images || [];
                
                let imgHtml = '';
                if (imgs.length > 0) {
                    const gridClass = imgs.length > 4 ? 'gallery-4' : `gallery-${imgs.length}`;
                    imgHtml = `<div class="image-gallery ${gridClass}">`;
                    imgs.slice(0, 4).forEach(url => {
                        imgHtml += `<img src="${url}" class="post-img" onclick="window.open('${url}')">`;
                    });
                    imgHtml += `</div>`;
                }

                container.innerHTML += `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between;">
                            <h2 style="font-size:1.5rem; font-weight:900;">${data.title}</h2>
                            ${isAdmin ? `<i class="fas fa-trash delete-btn" onclick="deletePost('${postId}')"></i>` : ''}
                        </div>
                        <p style="white-space:pre-wrap; margin:15px 0;">${data.body}</p>
                        ${imgHtml}
                        ${data.pgn ? `<div class="chess-viewer"><div id="board-${postId}"></div><div class="move-history" id="moveText-${postId}">Start</div><div style="display:flex; gap:10px; margin-top:10px;"><button class="btn" style="flex:1; background:#334155; color:white;" onclick="navigateGame('${postId}', -1)">Prev</button><button class="btn" style="flex:1; background:#334155; color:white;" onclick="navigateGame('${postId}', 1)">Next</button></div></div>` : ''}
                        <div class="comments-section">
                            <div id="comments-${postId}"></div>
                            <div style="display:flex; gap:10px; margin-top:15px;">
                                <input id="commentInput-${postId}" class="input-field" style="margin:0;" placeholder="Write a comment...">
                                <button class="btn" onclick="addComment('${postId}')">Send</button>
                            </div>
                        </div>
                    </div>`;
                
                if(data.pgn) setupChessBoard(postId, data.pgn);
                loadComments(postId);
            });
        }

        function setupChessBoard(postId, pgn) {
            let chess = new Chess();
            if (!chess.load_pgn(pgn)) return;
            let history = chess.history({ verbose: true });
            let board = Chessboard(`board-${postId}`, { position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
            gameViewers[postId] = { moves: history, index: -1, game: new Chess(), board: board };
        }

        function navigateGame(postId, dir) {
            const v = gameViewers[postId];
            if (dir === 1 && v.index < v.moves.length - 1) { v.index++; v.game.move(v.moves[v.index].san); }
            else if (dir === -1 && v.index >= 0) { v.game.undo(); v.index--; }
            v.board.position(v.game.fen());
            document.getElementById(`moveText-${postId}`).innerText = v.index === -1 ? "Start" : v.moves[v.index].san;
        }

        function loadComments(postId) {
            db.collection('forum_comments').where('postId', '==', postId).orderBy('timestamp', 'asc').onSnapshot(snap => {
                let html = '';
                snap.forEach(doc => {
                    const c = doc.data();
                    html += `<div class="comment">
                        <div style="width:30px; height:30px; background:var(--accent-gold); color:black; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; flex-shrink:0;">${c.name[0]}</div>
                        <div style="flex:1;">
                            <b>${c.name}</b> <span style="font-size:0.7rem; opacity:0.5;">(${c.class})</span>
                            ${isAdmin ? `<i class="fas fa-trash-alt delete-btn" onclick="deleteComment('${doc.id}')"></i>` : ''}
                            <div style="font-size:0.9rem;">${c.text}</div>
                        </div>
                    </div>`;
                });
                document.getElementById(`comments-${postId}`).innerHTML = html;
            });
        }

        async function addComment(postId) {
            if(!currentUser) return alert("Save your name first!");
            const input = document.getElementById(`commentInput-${postId}`);
            if(!input.value) return;
            await db.collection('forum_comments').add({ postId, name: currentUser.name, class: currentUser.class, text: input.value, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
            input.value = '';
        }

        async function deletePost(id) { if(confirm("Delete post?")) { await db.collection('forum_posts').doc(id).delete(); location.reload(); } }
        async function deleteComment(id) { if(confirm("Delete comment?")) await db.collection('forum_comments').doc(id).delete(); }
    </script>
</body>
</html>
