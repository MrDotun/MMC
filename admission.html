<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Portal | Dotun.Dev Demo</title>
    <style>
        body {
            background-color: #1a1a2e; /* Matches your dark theme */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .admission-form-container {
            max-width: 500px;
            width: 100%;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header-area {
            text-align: center;
            margin-bottom: 25px;
        }
        .header-area h2 {
            color: #2D1B4D; /* Deep purple */
            margin: 0;
            font-size: 24px;
        }
        .header-area p {
            color: #4ade80; /* Your signature green */
            font-weight: bold;
            margin-top: 5px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #4ade80;
            box-shadow: 0 0 5px rgba(74, 222, 128, 0.3);
        }
        button {
            width: 100%;
            background: #2D1B4D;
            color: #4ade80;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }
        button:hover {
            background: #3d2666;
            transform: translateY(-2px);
        }
        .footer-link {
            text-align: center;
            margin-top: 20px;
        }
        .footer-link a {
            color: #2D1B4D;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="admission-form-container">
        <div class="header-area">
            <h2>School Admission Portal</h2>
            <p>2026/2027 Academic Session</p>
        </div>

        <form action="https://formspree.io/f/mnjboanq" method="POST">
            
            <label for="student_name">Student's Full Name</label>
            <input type="text" id="student_name" name="student_name" placeholder="e.g. John Doe" required>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>

            <label for="class_entry">Class Applied For</label>
            <select id="class_entry" name="class_entry" required>
                <option value="">-- Choose Class --</option>
                <option>Creche / Nursery</option>
                <option>Primary 1 - 6</option>
                <option>Junior Secondary (JSS 1-3)</option>
                <option>Senior Secondary (SSS 1-3)</option>
            </select>

            <label for="parent_contact">Parent/Guardian WhatsApp No.</label>
            <input type="tel" id="parent_contact" name="parent_contact" placeholder="080..." required>

            <input type="hidden" name="_next" value="https://mrdotun.name.ng/thankyou.html">
            
            <input type="hidden" name="_subject" value="New School Lead: Admission Demo">

            <button type="submit">Submit Application</button>
        </form>

        <div class="footer-link">
            <a href="index.html">← Back to Dotun.Dev</a>
        </div>
    </div>

</body>
</html>
