<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Variation Master Pro | Decipher Chess Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chunk-card { border-left: 4px solid #d4af37; transition: all 0.2s; cursor: pointer; }
        .chunk-card.completed { border-left-color: #10b981; opacity: 0.5; }
        textarea { background: #0f172a !important; border: 1px solid #334155 !important; font-family: 'Fira Code', monospace; scrollbar-width: thin; }
        textarea:focus { border-color: #d4af37 !important; outline: none; }
        #progress-fill { height: 100%; background: #d4af37; width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-bold gold-text tracking-tight italic">DECIPHER <span class="text-white not-italic">GM-MASTER PRO</span></h1>
                <p class="text-slate-400 text-sm font-light uppercase tracking-widest">Precision 4-Move Stride + Engine Eval</p>
            </div>
            <nav class="flex gap-2 p-1 bg-slate-900 rounded-lg">
                <button onclick="switchTab('fragmenter')" id="tab-f" class="px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg">1. Fragmenter</button>
                <button onclick="switchTab('reassembler')" id="tab-r" class="px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white">2. Re-assembler</button>
            </nav>
        </header>

        <div id="view-fragmenter" class="space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-xs font-bold uppercase text-slate-500">Master PGN Input</label>
                    <div class="text-right">
                        <div id="stats" class="text-[10px] text-slate-400 uppercase tracking-widest">Ready</div>
                        <div class="w-48 h-1 bg-slate-800 mt-1 rounded-full overflow-hidden"><div id="progress-fill"></div></div>
                    </div>
                </div>
                <textarea id="pgn-input" rows="6" class="w-full p-4 rounded-xl text-sm mb-4" placeholder="Paste PGN here..."></textarea>
                
                <div class="flex flex-wrap gap-3">
                    <button onclick="processPgn()" class="px-6 py-3 bg-white text-black font-bold rounded-xl hover:bg-slate-200 uppercase text-xs">Initialize Engine</button>
                    <button onclick="copyNextBatch()" id="batch-btn" class="px-6 py-3 gold-bg rounded-xl font-bold hidden uppercase text-xs">Copy Next 10</button>
                    <button onclick="copyAllRemaining()" id="all-btn" class="px-6 py-3 bg-slate-800 text-white rounded-xl font-bold hidden uppercase text-xs">Copy All Remaining</button>
                    <button onclick="clearAll()" class="px-6 py-3 bg-red-900/30 text-red-400 rounded-xl font-bold uppercase text-xs">Reset</button>
                </div>
            </div>
            <div id="chunks-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
        </div>

        <div id="view-reassembler" class="hidden space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 1: Paste Gemini's JSON</label>
                        <textarea id="ai-json" rows="14" class="w-full p-4 rounded-xl text-xs" placeholder="Paste the JSON response here..."></textarea>
                    </div>
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 2: Final Re-Assembled PGN</label>
                        <textarea id="final-pgn" rows="14" class="w-full p-4 rounded-xl text-xs text-emerald-400" readonly></textarea>
                        <div class="flex gap-2">
                            <button onclick="copyToClipboard('final-pgn')" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase">Copy Final</button>
                            <button onclick="downloadPgn()" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase">Download</button>
                        </div>
                    </div>
                </div>
                <button onclick="rebuildPgn()" class="mt-6 w-full py-4 gold-bg rounded-xl font-bold uppercase tracking-widest shadow-lg shadow-yellow-900/20">Inject Annotations & Rebuild File</button>
            </div>
        </div>
    </div>

    <script>
        const engine = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
        let globalChunks = [];
        let pgnTokens = [];
        let currentBatchStart = 0;

        function switchTab(tab) {
            document.getElementById('view-fragmenter').classList.toggle('hidden', tab !== 'fragmenter');
            document.getElementById('view-reassembler').classList.toggle('hidden', tab !== 'reassembler');
        }

        function getEngineAnalysis(fen) {
            return new Promise((resolve) => {
                engine.postMessage(`position fen ${fen}`);
                engine.postMessage('go depth 12');
                engine.onmessage = (e) => {
                    if (e.data.includes('pv')) {
                        const parts = e.data.split(' ');
                        const scoreIdx = parts.indexOf('cp');
                        const evalScore = scoreIdx !== -1 ? (parts[scoreIdx + 1] / 100).toFixed(1) : "0.0";
                        const pvIdx = parts.indexOf('pv');
                        const line = parts.slice(pvIdx + 1, pvIdx + 5).join(" "); 
                        resolve({ eval: evalScore, line: line });
                    }
                };
            });
        }

        async function processPgn() {
            const input = document.getElementById('pgn-input').value;
            if (!input) return;
            document.getElementById('stats').innerText = "ENGINE ANALYZING...";
            
            const chess = new Chess();
            chess.loadPgn(input);
            const history = chess.history({ verbose: true });
            pgnTokens = input.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|[a-zA-Z0-9\-+=#$?!/]+)/g) || [];
            
            chess.reset();
            let chunks = [];

            for (let i = 0; i < history.length; i++) {
                const move = history[i];
                chess.move(move);
                if ((i + 1) % 4 === 0 || move.san.includes('!') || move.san.includes('?')) {
                    const analysis = await getEngineAnalysis(chess.fen());
                    chunks.push({
                        id: `CHUNK_${chunks.length}`,
                        target: move.san,
                        tokenIndex: i,
                        context: history.slice(Math.max(0, i-8), i).map(m => m.san).join(" "),
                        engineLine: analysis.line,
                        evaluation: analysis.eval
                    });
                    updateUIProgress(chunks.length, history.length);
                }
            }
            globalChunks = chunks;
            document.getElementById('batch-btn').classList.remove('hidden');
            document.getElementById('all-btn').classList.remove('hidden');
            updateUI();
        }

        function updateUIProgress(current, total) {
            document.getElementById('stats').innerText = `ANALYZED ${current} POSITIONS`;
        }

        function formatBatch(start, end) {
            const batch = globalChunks.slice(start, end).map(c => 
                `ID: ${c.id}\nContext: ${c.context}\nTARGET: ${c.target}\nENGINE EVAL: ${c.evaluation}\nNEXT 4 MOVES: ${c.engineLine}`
            ).join("\n---\n");

            return `Role: 2700 ELO GM & Engine Analyst.
Task: Explain the TARGET move based on the ENGINE EVAL and the NEXT 4 MOVES provided.

STRICT RULES:
1. Simple English. No complex words.
2. Explain the plan using the next 4 moves.
3. FORMAT: ONLY JSON {"CHUNK_ID": "Your analysis"}

${batch}`;
        }

        function copyNextBatch() {
            const end = Math.min(currentBatchStart + 10, globalChunks.length);
            navigator.clipboard.writeText(formatBatch(currentBatchStart, end));
            currentBatchStart = end;
            updateUI();
            alert("Copied 10 moves to clipboard!");
        }

        function copyAllRemaining() {
            navigator.clipboard.writeText(formatBatch(currentBatchStart, globalChunks.length));
            currentBatchStart = globalChunks.length;
            updateUI();
            alert("Copied all moves!");
        }

        function updateUI() {
            const container = document.getElementById('chunks-container');
            container.innerHTML = "";
            globalChunks.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = `chunk-card glass p-2 rounded-lg ${i < currentBatchStart ? 'completed' : ''}`;
                div.innerHTML = `<p class="text-[8px] gold-text font-bold">${c.id}</p><p class="text-[10px] truncate">${c.target} (${c.evaluation})</p>`;
                container.appendChild(div);
            });
            const perc = (currentBatchStart / globalChunks.length) * 100 || 0;
            document.getElementById('progress-fill').style.width = perc + "%";
        }

        function rebuildPgn() {
            const raw = document.getElementById('ai-json').value;
            let aiData = {};
            const matches = raw.match(/\{[\s\S]*?\}/g);
            if (matches) { matches.forEach(m => { try { Object.assign(aiData, JSON.parse(m)); } catch(e){} }); }
            
            let workingTokens = [...pgnTokens];
            globalChunks.forEach(chunk => {
                if (aiData[chunk.id]) {
                    let moveCount = 0;
                    for(let j=0; j < workingTokens.length; j++) {
                        if(/^[a-zA-Z]/.test(workingTokens[j]) && !workingTokens[j].startsWith('{')) {
                            if(moveCount === chunk.tokenIndex) {
                                workingTokens[j] += ` { ${aiData[chunk.id]} }`;
                                break;
                            }
                            moveCount++;
                        }
                    }
                }
            });
            document.getElementById('final-pgn').value = workingTokens.join(" ");
        }

        function clearAll() { location.reload(); }
        function copyToClipboard(id) { navigator.clipboard.writeText(document.getElementById(id).value); alert("Copied!"); }
        function downloadPgn() {
            const blob = new Blob([document.getElementById('final-pgn').value], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "Analyzed_Game.pgn";
            a.click();
        }
    </script>
</body>
</html>
