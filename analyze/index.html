<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM-Master Pro | Decipher Chess</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: sans-serif; }
        .gold-text { color: #d4af37; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        #progress-fill { height: 100%; background: #d4af37; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold gold-text italic">DECIPHER <span class="text-white not-italic">GM-MASTER PRO</span></h1>
                <p class="text-slate-400 text-[10px] uppercase tracking-widest">Lite Single-Thread (Mobile Guaranteed)</p>
            </div>
            <div id="stats" class="text-right text-[10px] gold-text font-bold uppercase tracking-tighter">Ready</div>
        </header>

        <div class="glass p-5 rounded-2xl mb-6 text-center">
            <div class="w-full h-1 bg-slate-800 mb-6 rounded-full overflow-hidden">
                <div id="progress-fill"></div>
            </div>
            <textarea id="pgn-input" rows="5" class="w-full p-3 rounded-xl text-sm bg-slate-900 border border-slate-700 mb-4 focus:outline-none" placeholder="Paste PGN here..."></textarea>
            <div class="flex gap-2">
                <button onclick="startAnalysis()" class="flex-1 py-4 gold-bg font-bold rounded-xl text-xs uppercase shadow-lg shadow-yellow-900/40">Analyze Game</button>
                <button onclick="copyToGemini()" id="copy-btn" class="flex-1 py-4 bg-slate-800 text-white font-bold rounded-xl text-xs uppercase hidden border border-slate-600">Copy Results</button>
            </div>
        </div>

        <div id="results-grid" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>
    </div>

    <script>
        let stockfishWorker = null;
        let globalChunks = [];

        // The "Surest" engine link for mobile
        const LITE_ENGINE_URL = 'https://cdn.jsdelivr.net/npm/stockfish.js@16.1.0/stockfish-nnue-16-lite-single.js';

        async function initEngine() {
            return new Promise((resolve) => {
                document.getElementById('stats').innerText = "LOADING ENGINE...";
                stockfishWorker = new Worker(LITE_ENGINE_URL);
                stockfishWorker.onmessage = (e) => {
                    if (e.data === 'uciok') resolve();
                };
                stockfishWorker.postMessage('uci');
            });
        }

        function analyzeFen(fen) {
            return new Promise((resolve) => {
                stockfishWorker.postMessage(`position fen ${fen}`);
                stockfishWorker.postMessage('go depth 12');
                
                stockfishWorker.onmessage = (e) => {
                    if (e.data.includes('pv')) {
                        const parts = e.data.split(' ');
                        const cpIdx = parts.indexOf('cp');
                        const score = cpIdx !== -1 ? (parts[cpIdx + 1] / 100).toFixed(1) : "0.0";
                        const pvIdx = parts.indexOf('pv');
                        const line = parts.slice(pvIdx + 1, pvIdx + 5).join(" ");
                        resolve({ eval: score, line: line });
                    }
                };
            });
        }

        async function startAnalysis() {
            const pgnInput = document.getElementById('pgn-input').value;
            const chess = new Chess();
            if (!chess.loadPgn(pgnInput)) return alert("PGN Error: Check for missing spaces.");

            if (!stockfishWorker) await initEngine();

            const history = chess.history({ verbose: true });
            chess.reset();
            globalChunks = [];
            document.getElementById('results-grid').innerHTML = "";

            for (let i = 0; i < history.length; i++) {
                const move = history[i];
                chess.move(move);
                
                // Logic: Capture every 4th ply or annotated moves (!, ?)
                if ((i + 1) % 4 === 0 || move.san.includes('!') || move.san.includes('?')) {
                    document.getElementById('stats').innerText = `CALCULATING: MOVE ${i+1}`;
                    const res = await analyzeFen(chess.fen());
                    
                    const chunk = {
                        id: `CHUNK_${globalChunks.length + 1}`,
                        target: move.san,
                        eval: res.eval,
                        line: res.line,
                        context: history.slice(Math.max(0, i-4), i).map(m => m.san).join(" ")
                    };
                    
                    globalChunks.push(chunk);
                    renderCard(chunk);
                    document.getElementById('progress-fill').style.width = ((i / history.length) * 100) + "%";
                }
            }

            document.getElementById('stats').innerText = "DONE";
            document.getElementById('copy-btn').classList.remove('hidden');
        }

        function renderCard(c) {
            const div = document.createElement('div');
            div.className = "glass p-3 rounded-xl border-l-4 border-yellow-500 shadow-xl";
            div.innerHTML = `<p class="text-[8px] gold-text font-bold uppercase">${c.id}</p><p class="text-xs font-bold text-white">${c.target} <span class="text-slate-400">[${c.eval}]</span></p>`;
            document.getElementById('results-grid').appendChild(div);
        }

        function copyToGemini() {
            const prompt = `Task: Explain chess moves in 8-year-old simple English.
Structure: Use EVAL and NEXT 4 MOVES for context.
Format: JSON only {"ID": "Your analysis"}.

` + globalChunks.map(c => `ID: ${c.id} | Move: ${c.target} | Eval: ${c.eval} | Engine Line: ${c.line}`).join("\n---\n");
            
            navigator.clipboard.writeText(prompt);
            alert("Analysis data copied. Paste it into Gemini now!");
        }
    </script>
</body>
</html>
