<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Variation Master Pro | Decipher Chess Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chunk-card { border-left: 4px solid #d4af37; transition: all 0.2s; }
        .chunk-card.completed { border-left-color: #10b981; opacity: 0.5; }
        textarea { background: #0f172a !important; border: 1px solid #334155 !important; font-family: 'monospace'; }
        #progress-fill { height: 100%; background: #d4af37; width: 0%; transition: width 0.4s; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-bold gold-text tracking-tight italic">DECIPHER <span class="text-white not-italic">GM-MASTER PRO</span></h1>
                <p class="text-slate-400 text-sm font-light uppercase tracking-widest">Engine-Powered Stride + 2700 GM Analysis</p>
            </div>
            <div id="engine-status" class="px-4 py-2 rounded-full bg-red-900/30 text-red-400 text-xs font-bold uppercase">Engine: Disconnected</div>
        </header>

        <div id="view-fragmenter" class="space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-xs font-bold uppercase text-slate-500">PGN Input</label>
                    <div class="text-right">
                        <div id="stats" class="text-[10px] text-slate-400 uppercase tracking-widest">0/0 ANALYZED</div>
                        <div class="w-48 h-1 bg-slate-800 mt-1 rounded-full overflow-hidden"><div id="progress-fill"></div></div>
                    </div>
                </div>
                <textarea id="pgn-input" rows="6" class="w-full p-4 rounded-xl text-sm mb-4" placeholder="Paste PGN here..."></textarea>
                
                <div class="flex flex-wrap gap-3">
                    <button id="init-btn" onclick="processPgn()" class="px-6 py-3 bg-white text-black font-bold rounded-xl hover:bg-slate-200 uppercase text-xs">Start Engine Analysis (3s/move)</button>
                    <button onclick="copyNextBatch()" id="batch-btn" class="px-6 py-3 gold-bg rounded-xl font-bold hidden uppercase text-xs">Copy Next 10 (AI Prompt)</button>
                    <button onclick="location.reload()" class="px-6 py-3 bg-slate-800 text-white rounded-xl font-bold uppercase text-xs">Reset</button>
                </div>
            </div>
            <div id="chunks-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
        </div>

        <div id="view-reassembler" class="mt-10 space-y-6 border-t border-slate-800 pt-10">
            <h2 class="text-xl font-bold gold-text uppercase tracking-widest">Re-Assembler</h2>
            <div class="glass p-6 rounded-2xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <textarea id="ai-json" rows="10" class="w-full p-4 rounded-xl text-xs" placeholder="Paste Gemini's JSON response here..."></textarea>
                    <textarea id="final-pgn" rows="10" class="w-full p-4 rounded-xl text-xs text-emerald-400" placeholder="Final PGN will appear here..." readonly></textarea>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button onclick="rebuildPgn()" class="flex-1 py-4 gold-bg rounded-xl font-bold uppercase shadow-lg">Merge AI Analysis</button>
                    <button onclick="copyFinalPgn()" class="px-6 py-4 bg-slate-700 text-white rounded-xl font-bold uppercase text-xs">Copy PGN</button>
                    <button onclick="downloadPgn()" class="px-6 py-4 bg-emerald-600 text-white rounded-xl font-bold uppercase text-xs">Download .pgn</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let globalChunks = [];
        let pgnTokens = [];
        let currentBatchStart = 0;
        let garboWorker;

        try {
            garboWorker = new Worker('garbochess.js');
            garboWorker.onmessage = (e) => {
                if (e.data === "readyok") {
                    document.getElementById('engine-status').innerText = "Engine: Connected";
                    document.getElementById('engine-status').classList.replace('text-red-400', 'text-green-400');
                }
            };
            garboWorker.postMessage("uci");
        } catch (e) {
            document.getElementById('engine-status').innerText = "Worker Blocked: Use Live Server";
        }

        async function getAnalysis(fen) {
            return new Promise((resolve) => {
                garboWorker.postMessage("position " + fen);
                garboWorker.postMessage("search 3000"); // 3 Seconds for proper analysis
                garboWorker.onmessage = (e) => {
                    if (e.data.startsWith("pv")) {
                        const parts = e.data.split(" ");
                        const scorePart = parts.find(p => p.startsWith("Score:"));
                        const score = scorePart ? (parseInt(scorePart.split(":")[1]) / 100).toFixed(2) : "0.00";
                        resolve({ score: score, pv: e.data });
                    }
                };
            });
        }

        async function processPgn() {
            const input = document.getElementById('pgn-input').value;
            if (!input || !garboWorker) { alert("Input PGN required!"); return; }

            const btn = document.getElementById('init-btn');
            btn.innerText = "Analyzing (Main Line Only)...";
            btn.disabled = true;

            const chess = new Chess();
            pgnTokens = input.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|[a-zA-Z0-9\-+=#$?!/]+)/g) || [];
            
            let moveCount = 0;
            let variationLevel = 0;
            let fenStack = [];

            for (let i = 0; i < pgnTokens.length; i++) {
                const t = pgnTokens[i];
                if (t === "(") { variationLevel++; fenStack.push(chess.fen()); continue; }
                if (t === ")") { variationLevel--; chess.load(fenStack.pop()); continue; }
                if (/^\d+\./.test(t)) continue;

                if (/^[a-zA-Z]/.test(t) && !t.startsWith('{')) {
                    const m = chess.move(t);
                    if (m) {
                        // Only analyze if variationLevel is 0 (Main Line)
                        if (variationLevel === 0) {
                            moveCount++;
                            const hasSymbol = pgnTokens[i+1]?.includes('!') || pgnTokens[i+1]?.includes('?');
                            if (moveCount % 3 === 0 || hasSymbol) {
                                const data = await getAnalysis(chess.fen());
                                globalChunks.push({
                                    id: `CHUNK_${globalChunks.length}`,
                                    target: t,
                                    score: data.score,
                                    pv: data.pv,
                                    tokenIndex: i,
                                    context: chess.history().slice(-6).join(" ")
                                });
                                updateUI();
                            }
                        }
                    }
                }
            }
            btn.innerText = "Analysis Complete";
            document.getElementById('batch-btn').classList.remove('hidden');
        }

        function formatBatch(start, end) {
            const batch = globalChunks.slice(start, end).map(c => 
                `ID: ${c.id} | Move: ${c.target} | Score: ${c.score}\nEngine Line: ${c.pv}\nLast Moves: ${c.context}`
            ).join("\n---\n");

            return `Role: 2700 GM. JUDGMENT RULES:
1. USE 4 MOVES: Look at the first 4 moves in "Subsequent" while keeping the current position in mind to prove if the TARGET is good or bad.
2. SYMBOL LOGIC: If TARGET has a sign like !, ?, or !!, explain why that sign was given using the next 4 moves. Do not add thw symbols to your comments. 
3. PIECE QUALITY: Explain which pieces will likely be moved once in a while. Also give in simole English the plans for both sides, once in a while. 
4. Start your sentence with " This move.." or "A..." or " White..." or "Black..." or something else. 5 out of the 10 comments must begin differently. 
5. Be human, dont let your statement at the begining and ending be consistent. 
STRICT LANGUAGE RULES:
- Use simple words.Use common chess terms, no uncommon chess words.Like a 2700 GM. 
- Avoid "big" or rare words.But simple English than GMs understand. e g Transpose, attack, strong, decisive. 
- Use "center" NOT "central".
- Use "structure" NOT "structural".
- Use "exchange" NOT "liquidate".
- No "storytelling". Only clear chess reasons.Like a 2700 GM.

FORMAT: ONLY JSON
{"CHUNK_ID": "Simple analysis of the move and evaluation sign based on the 4-move variation."}

${batch}`;
        }

        function copyNextBatch() {
            const end = Math.min(currentBatchStart + 10, globalChunks.length);
            navigator.clipboard.writeText(formatBatch(currentBatchStart, end));
            currentBatchStart = end;
            updateUI();
        }

        function updateUI() {
            const container = document.getElementById('chunks-container');
            container.innerHTML = globalChunks.map((c, i) => `
                <div class="chunk-card glass p-2 rounded-lg ${i < currentBatchStart ? 'completed' : ''}">
                    <p class="text-[9px] gold-text font-bold">${c.id}</p>
                    <p class="text-xs font-bold">${c.target} (${c.score})</p>
                </div>
            `).join('');
            document.getElementById('progress-fill').style.width = globalChunks.length > 0 ? (currentBatchStart/globalChunks.length)*100 + "%" : "0%";
            document.getElementById('stats').innerText = `${currentBatchStart}/${globalChunks.length} READY`;
        }

        function rebuildPgn() {
            const raw = document.getElementById('ai-json').value;
            let aiData = {};
            try {
                const matches = raw.match(/\{[\s\S]*?\}/g);
                matches.forEach(m => Object.assign(aiData, JSON.parse(m)));
            } catch(e) { alert("Invalid JSON from AI!"); return; }

            let tokens = [...pgnTokens];
            Object.keys(aiData).forEach(id => {
                const chunk = globalChunks.find(c => c.id === id);
                if (chunk) tokens[chunk.tokenIndex] += ` { ${aiData[id]} }`;
            });
            document.getElementById('final-pgn').value = tokens.join(" ");
        }

        function copyFinalPgn() {
            const pgn = document.getElementById('final-pgn').value;
            if(!pgn) return;
            navigator.clipboard.writeText(pgn);
            alert("PGN Copied!");
        }

        function downloadPgn() {
            const pgn = document.getElementById('final-pgn').value;
            if(!pgn) return;
            const blob = new Blob([pgn], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `analysis_${new Date().getTime()}.pgn`;
            a.click();
        }
    </script>
</body>
</html>
