<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GM Variation Master Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<style>
body{font-family:system-ui,sans-serif;background:#020617;color:#f8fafc;margin:0}
.gold{color:#d4af37}.gold-bg{background:#d4af37;color:#1e293b}
.glass{background:rgba(30,41,59,.75);border:1px solid rgba(255,255,255,.1);border-radius:12px}
.card{border-left:3px solid #334155;cursor:pointer;padding:6px 8px;border-radius:8px;background:rgba(15,23,42,.6)}
.card:hover{border-left-color:#d4af37}
.card.start{border-left-color:#d4af37;background:rgba(212,175,55,.28)}
.card.range{border-left-color:#fde047;background:rgba(212,175,55,.12)}
.card.on{outline:1px solid #38bdf8}
.card.sign{border-left-color:#fb7185}
textarea,input[type=text]{background:#0f172a!important;border:1px solid #334155!important;color:#fff;width:100%;border-radius:8px;padding:8px;font-family:ui-monospace,monospace;font-size:12px}
#progress{height:3px;background:#d4af37;width:0;transition:width .25s}
.board-wrap{width:100%;max-width:300px;margin:0 auto;aspect-ratio:1/1}
#board{width:100%!important}
.chip{padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700;background:#1e293b;border:1px solid #475569;cursor:pointer;color:#cbd5e1}
.chip:hover{border-color:#d4af37;color:#fde68a}
.chip.on{background:#854d0e;border-color:#fbbf24;color:#fef3c7}
</style>
</head>
<body class="p-3 md:p-6">
<div class="max-w-6xl mx-auto">
  <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
    <div>
      <div class="text-xl font-bold gold italic">DECIPHER <span class="text-white not-italic">PRO</span></div>
      <div class="text-[10px] text-slate-500 uppercase">Fast batch annotation</div>
    </div>
    <div class="flex gap-1">
      <button onclick="switchTab('a')" id="tab-a" class="px-4 py-2 rounded-lg text-xs font-bold uppercase gold-bg">Annotate</button>
      <button onclick="switchTab('r')" id="tab-r" class="px-4 py-2 rounded-lg text-xs font-bold uppercase text-slate-400">Re-assemble</button>
    </div>
  </div>

  <div id="view-a">
    <div class="glass p-4 mb-4">
      <div class="flex justify-between text-[10px] text-slate-500 mb-1"><span>PGN</span><span id="stats">Ready</span></div>
      <div class="w-full bg-slate-800 mb-2 rounded overflow-hidden"><div id="progress"></div></div>
      <textarea id="pgn" rows="2" placeholder="Paste PGN..."></textarea>
      <div class="flex flex-wrap gap-2 mt-2">
        <button onclick="processPgn()" class="px-4 py-2 bg-white text-black text-xs font-bold rounded-lg uppercase">Initialize</button>
        <button onclick="runBatch()" id="btn-engine" class="px-4 py-2 bg-emerald-700 text-white text-xs font-bold rounded-lg uppercase hidden">Engine + build prompt</button>
        <button onclick="copyPrompt()" id="btn-copy" class="px-4 py-2 gold-bg text-xs font-bold rounded-lg uppercase hidden">Copy Gemini</button>
        <button onclick="location.reload()" class="px-4 py-2 bg-red-900/40 text-red-400 text-xs font-bold rounded-lg uppercase">Reset</button>
      </div>
      <p class="text-[10px] text-slate-500 mt-2">1) Initialize 2) Click start then end 3) Engine + build prompt 4) Navigate moves, click/type ideas 5) Copy</p>
    </div>

    <div id="workspace" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-4">
      <!-- LEFT: board always visible -->
      <div class="space-y-3">
        <div class="glass p-3">
          <div class="flex justify-between text-[10px] mb-1"><span class="text-slate-500 font-bold uppercase">Board</span><span id="lab" class="text-sky-400 font-bold"></span></div>
          <div class="board-wrap"><div id="board"></div></div>
          <div class="flex gap-2 mt-2">
            <button onclick="nav(-1)" class="flex-1 py-2 bg-slate-800 rounded-lg text-xs font-bold">Prev</button>
            <button onclick="nav(1)" class="flex-1 py-2 bg-slate-800 rounded-lg text-xs font-bold">Next</button>
          </div>
          <input type="text" id="fen" class="mt-2 text-[10px] text-emerald-400" readonly>
        </div>

        <!-- quick idea for current move -->
        <div class="glass p-3" id="idea-box">
          <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">Idea for this move (click chip or type)</div>
          <div class="flex flex-wrap gap-1 mb-2" id="chips"></div>
          <input type="text" id="idea-input" placeholder="Type idea… e.g. with Bb7 and Rac8 next">
          <button onclick="applyIdea()" class="mt-2 w-full py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold">Apply idea to prompt</button>
          <div id="eng-show" class="text-[10px] text-emerald-400/80 mt-2"></div>
        </div>
      </div>

      <!-- RIGHT: moves + prompt -->
      <div class="space-y-3">
        <div class="glass p-3">
          <div class="text-[10px] text-slate-500 mb-1">Click start, then end. Rose edge = GM sign.</div>
          <div id="moves" class="grid grid-cols-3 sm:grid-cols-4 gap-1.5 max-h-[200px] overflow-y-auto"></div>
        </div>
        <div class="glass p-3 hidden" id="prompt-wrap">
          <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">Prompt (edit anything)</div>
          <textarea id="prompt" rows="14"></textarea>
        </div>
      </div>
    </div>
  </div>

  <div id="view-r" class="hidden">
    <div class="glass p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">Gemini JSON</div>
        <textarea id="json" rows="12" placeholder="Paste JSON..."></textarea>
      </div>
      <div>
        <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">Final PGN</div>
        <textarea id="final" rows="12" class="text-emerald-400" readonly></textarea>
        <div class="flex gap-2 mt-2">
          <button onclick="copyEl('final')" class="flex-1 py-2 bg-slate-800 rounded-lg text-xs font-bold uppercase">Copy</button>
          <button onclick="dl()" class="flex-1 py-2 bg-slate-800 rounded-lg text-xs font-bold uppercase">Download</button>
        </div>
      </div>
      <button onclick="inject()" class="md:col-span-2 w-full py-3 gold-bg rounded-xl font-bold uppercase">Inject Annotations</button>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script>
const delay=ms=>new Promise(r=>setTimeout(r,ms));
let chunks=[], tokens=[], board=null, selA=null, selB=null, cur=null;
let eng={}, ideas={}; // id -> engine / id -> user idea string

const CHIPS=[
  'with the idea of Bb7','b6 and Bb7 next','c7-c5 break','preparing d4',
  'Ne4 is the idea','Rac8 and Rfd8','space on the queenside','bishop pair',
  'isolated pawn pressure','king stuck in the centre','transposes',
  'drags the king into the open','favourable exchange','development lead'
];

function isFen(f){try{return!!f&&new Chess().load(f);}catch(e){return false;}}
function hasSign(t){return/[?!]/.test(t)||/\$\d+/.test(t);}

function ensureBoard(fen){
  const p=fen||'start';
  try{
    if(!board) board=Chessboard('board',{pieceTheme:'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',position:p});
    else board.position(p,false);
    setTimeout(()=>{try{board.resize();}catch(e){}},50);
    setTimeout(()=>{try{board.resize();}catch(e){}},200);
  }catch(e){}
}

window.onload=()=>{
  document.getElementById('chips').innerHTML=CHIPS.map(t=>`<button type="button" class="chip" onclick="chip('${t.replace(/'/g,"\\'")}')">${t}</button>`).join('');
  window.addEventListener('resize',()=>{if(board)try{board.resize();}catch(e){}});
  const s=localStorage.getItem('gm_pro');
  if(s){try{const st=JSON.parse(s);document.getElementById('pgn').value=st.pgn||'';if(st.pgn)processPgn();}catch(e){}}
};

function chip(t){
  const inp=document.getElementById('idea-input');
  inp.value=inp.value? (inp.value.replace(/\.$/,'')+'; '+t) : t;
  inp.focus();
}

function applyIdea(){
  if(cur==null) return;
  const c=chunks[cur];
  const text=document.getElementById('idea-input').value.trim();
  if(!text){ alert('Type or click a chip first'); return; }
  ideas[c.id]=text;
  // patch prompt if built
  const ta=document.getElementById('prompt');
  let p=ta.value;
  if(p){
    const re=new RegExp('(\\[ID: '+c.id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\][\\s\\S]*?)(?=\\n\\[ID:|$)');
    if(re.test(p)){
      p=p.replace(re,(block)=>{
        if(/USER_IDEA:/.test(block)) return block.replace(/USER_IDEA:.*$/m,'USER_IDEA: '+text);
        return block.trimEnd()+'\n  USER_IDEA: '+text+'\n';
      });
      ta.value=p;
    }
  }
  document.getElementById('stats').innerText='Idea saved on '+c.moveNum+'. '+c.target;
  save();
}

async function getEngine(fen){
  if(!isFen(fen)) return null;
  for(let a=0;a<4;a++){
    try{
      const res=await fetch('https://chess-api.com/v1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fen,depth:15,maxThinkingTime:70})});
      if(res.status===429){await delay(1200*(a+1));continue;}
      if(!res.ok) return null;
      const d=await res.json();
      if(d.error) return null;
      let line='';
      if(d.continuationArr) line=d.continuationArr.slice(0,7).join(' ');
      else if(d.continuation) line=String(d.continuation).split(/\s+/).slice(0,7).join(' ');
      return {eval:d.eval,line,san:d.san||d.move||''};
    }catch(e){if(a===3)return null;await delay(600);}
  }
  return null;
}

function processPgn(){
  const input=document.getElementById('pgn').value; if(!input) return;
  tokens=input.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|\$\d+|[a-zA-Z0-9\-+=#\/]+[?!]*)/g)||[];
  let out=[], mn=0, lv=0, ply={0:0}, last={}, chess=new Chess(), stack=[], curF=chess.fen(), before=curF, seen={};
  tokens.forEach((tok,idx)=>{
    if(tok==='('){lv++;ply[lv]=0;stack.push({c:curF,b:before});chess.load(before);return;}
    if(tok===')'){if(last[lv])last[lv].isVariationEnd=true;lv--;const st=stack.pop();if(st){chess.load(st.c);curF=st.c;before=st.b;}return;}
    if(/^\d+\./.test(tok)){mn=parseInt(tok);return;}
    if(!/^[a-hA-ZRKNQBO]/.test(tok)||tok[0]==='{'||tok[0]==='[') return;
    ply[lv]=(ply[lv]||0)+1; before=chess.fen();
    let clean=tok.replace(/[^a-zA-Z0-9=\+\-#O]/g,'');
    let m=chess.move(clean,{sloppy:true});
    if(!m){clean=clean.replace(/[+#]/g,'');m=chess.move(clean,{sloppy:true});}
    if(!m){const alt=tok.replace(/[!?]+$/g,'').replace(/\$\d+$/g,'').trim();if(alt)m=chess.move(alt,{sloppy:true});}
    if(m) curF=chess.fen(); else curF=before;
    let sym=''; const n=tokens[idx+1]; if(n&&(n[0]==='$'||/^[!?]+$/.test(n)||/^[\+\-=]+$/.test(n))) sym=' '+n;
    const id='CHK_'+out.length+'_M'+mn+'_V'+lv;
    const key=(curF||'').split(/\s+/).slice(0,4).join(' ');
    let tr=null; if(key&&seen[key]) tr=seen[key]; else if(key) seen[key]=id;
    const ch={id,target:tok+sym,moveNum:mn,tokenIndex:idx,isMainLine:lv===0,isVariationStart:lv>0&&ply[lv]===1,isVariationEnd:false,fen:before,fenAfter:curF,moveParsed:!!m,variationLevel:lv,transposesTo:tr};
    out.push(ch); last[lv]=ch;
  });
  if(last[0]) last[0].isVariationEnd=true;
  chunks=out; selA=selB=null; cur=null; eng={}; ideas={};
  document.getElementById('workspace').classList.remove('hidden');
  document.getElementById('btn-engine').classList.remove('hidden');
  document.getElementById('btn-copy').classList.remove('hidden');
  document.getElementById('prompt-wrap').classList.add('hidden');
  ui();
  setTimeout(()=>{ensureBoard(out[0]?out[0].fenAfter:'start'); if(out.length) go(0);},80);
  save();
}

function go(i){
  if(i==null||i<0||i>=chunks.length) return;
  cur=i; const c=chunks[i];
  document.getElementById('fen').value=c.fenAfter||'';
  document.getElementById('lab').innerText=c.moveNum+'. '+c.target;
  ensureBoard(c.fenAfter||c.fen||'start');
  document.getElementById('idea-input').value=ideas[c.id]||'';
  const e=eng[c.id];
  document.getElementById('eng-show').innerText=e&&e.line?('Engine: '+e.line+(e.eval!=null?'  ('+e.eval+')':'')):'';
  ui();
}
function nav(d){go(cur==null?0:cur+d);}

function select(i){
  go(i);
  if(selA===null||(selA!==null&&selB!==null)){selA=i;selB=null;}
  else{selB=Math.max(selA,i);selA=Math.min(selA,i);}
  ui();
}

function ui(){
  const box=document.getElementById('moves'); box.innerHTML='';
  chunks.forEach((c,i)=>{
    let cls='card';
    if(i===cur) cls+=' on';
    if(hasSign(c.target)) cls+=' sign';
    if(selA!==null){const mx=selB??selA; if(i===selA) cls+=' start'; else if(i>selA&&i<=mx) cls+=' range';}
    const d=document.createElement('div'); d.className=cls; d.onclick=()=>select(i);
    const f=[]; if(c.isVariationEnd) f.push('end'); if(c.transposesTo) f.push('tr');
    d.innerHTML=`<div class="text-[8px] gold font-bold">${c.id}</div><div class="text-[11px] font-semibold truncate">${c.moveNum}. ${c.target}</div>${f.length?`<div class="text-[8px] text-slate-500">${f.join(' · ')}</div>`:''}`;
    box.appendChild(d);
  });
  document.getElementById('stats').innerText=chunks.length+' moves'+(selA!=null?' · batch '+(selA+1)+'-'+((selB??selA)+1):'');
}

async function runBatch(){
  if(selA===null){alert('Click start move, then end move');return;}
  const end=selB??selA, btn=document.getElementById('btn-engine'), fill=document.getElementById('progress'), st=document.getElementById('stats');
  btn.disabled=true;
  const n=end-selA+1; let k=0;
  for(let i=selA;i<=end;i++){
    const c=chunks[i];
    const need=c.isVariationEnd||hasSign(c.target)||c.isVariationStart||c.transposesTo;
    if(need&&isFen(c.fenAfter)&&!eng[c.id]){
      st.innerText='Engine… '+c.moveNum+'. '+c.target;
      const d=await getEngine(c.fenAfter); if(d) eng[c.id]=d;
      await delay(160);
    }
    k++; fill.style.width=((k/n)*100)+'%';
  }
  const startFen=chunks[selA].fen;
  const lines=[];
  for(let i=selA;i<=end;i++){
    const c=chunks[i];
    const b=(c.fen||'').split(/\s+/), a=(c.fenAfter||'').split(/\s+/);
    const played=b[1]==='w'?'White':b[1]==='b'?'Black':'?';
    const toMove=a[1]==='w'?'White':a[1]==='b'?'Black':'?';
    let L=`[ID: ${c.id}] ${c.moveNum}. ${c.target} | Played: ${played} | After: ${toMove} | VarEnd: ${c.isVariationEnd}`;
    if(isFen(c.fenAfter)) L+=`\n  FEN: ${c.fenAfter}`;
    if(hasSign(c.target)) L+=`\n  GM_SIGN: ${c.target}`;
    if(c.transposesTo) L+=`\n  TRANSPOSITION: yes`;
    if(eng[c.id]&&eng[c.id].line) L+=`\n  ENGINE_PLAN: ${eng[c.id].line}`;
    if(ideas[c.id]) L+=`\n  USER_IDEA: ${ideas[c.id]}`;
    if(c.isVariationEnd) L+=`\n  VARIATION_END: next plan required`;
    lines.push(L);
  }
  const prompt=`You are a 2700+ GM writing sparse opening notes. Natural English ~68% skill. British spelling (centre, favour) where natural.

STARTING FEN: ${startFen}

Rules:
- Comment only after the move.
- MUST comment every GM_SIGN move.
- MUST comment every VARIATION_END with a next plan (use ENGINE_PLAN / USER_IDEA).
- Prefer USER_IDEA when present. Else use ENGINE_PLAN for ideas (c5, Bb7, Ne4…).
- TRANSPOSITION → "transposes".
- Correct colour. One short sentence, max two. No engine talk.

Samples:
"with the idea of Bb7"
"Black will continue with b6 and Bb7"
"Aiming to play b5 and develop the bishop to b7"
"transposes to the mainline"
"the sacrifice drags the king into the open"

Output ONLY pure JSON. Keys = IDs. Values = comments. No markdown.

BATCH:
${lines.join('\n\n')}`;

  document.getElementById('prompt').value=prompt;
  document.getElementById('prompt-wrap').classList.remove('hidden');
  btn.disabled=false; st.innerText='Ready — add ideas while browsing, then Copy';
  fill.style.width='100%'; setTimeout(()=>fill.style.width='0%',700);
  if(cur!=null) go(cur);
}

async function copyPrompt(){
  const t=document.getElementById('prompt').value;
  if(!t.trim()){alert('Run Engine + build prompt first');return;}
  try{await navigator.clipboard.writeText(t);alert('Copied');}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('Copied');}
}

function switchTab(t){
  document.getElementById('view-a').classList.toggle('hidden',t!=='a');
  document.getElementById('view-r').classList.toggle('hidden',t!=='r');
  document.getElementById('tab-a').className=t==='a'?'px-4 py-2 rounded-lg text-xs font-bold uppercase gold-bg':'px-4 py-2 rounded-lg text-xs font-bold uppercase text-slate-400';
  document.getElementById('tab-r').className=t==='r'?'px-4 py-2 rounded-lg text-xs font-bold uppercase gold-bg':'px-4 py-2 rounded-lg text-xs font-bold uppercase text-slate-400';
}
function inject(){
  const raw=document.getElementById('json').value; let ai={};
  try{const a=raw.indexOf('{'),b=raw.lastIndexOf('}');ai=JSON.parse(a!==-1&&b>a?raw.slice(a,b+1):raw);}catch(e){alert('Bad JSON');return;}
  const w=[...tokens];
  Object.keys(ai).sort((a,b)=>(chunks.find(c=>c.id===b)?.tokenIndex||0)-(chunks.find(c=>c.id===a)?.tokenIndex||0)).forEach(id=>{
    const ch=chunks.find(c=>c.id===id); if(ch&&ai[id]) w[ch.tokenIndex]+=' { '+ai[id]+' }';
  });
  document.getElementById('final').value=w.join(' ');
}
function copyEl(id){navigator.clipboard.writeText(document.getElementById(id).value);alert('Copied');}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([document.getElementById('final').value],{type:'text/plain'}));a.download='annotated.pgn';a.click();}
function save(){localStorage.setItem('gm_pro',JSON.stringify({pgn:document.getElementById('pgn').value}));}
</script>
</body>
</html>
