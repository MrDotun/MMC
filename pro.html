<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Variation Master Pro | Decipher Chess Academy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chunk-card { border-left: 4px solid #334155; transition: all 0.2s; cursor: pointer; }
        .chunk-card:hover { border-left-color: #d4af37; background: rgba(255,255,255,0.05); }
        .chunk-card.selected-start { border-left-color: #d4af37; background-color: rgba(212, 175, 55, 0.3); }
        .chunk-card.selected-range { border-left-color: #fde047; background-color: rgba(212, 175, 55, 0.15); }
        
        textarea, input[type="text"] { background: #0f172a !important; border: 1px solid #334155 !important; font-family: 'Fira Code', monospace; scrollbar-width: thin; color: #fff; }
        textarea:focus, input[type="text"]:focus { border-color: #d4af37 !important; outline: none; }
        #progress-fill { height: 100%; background: #d4af37; width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .board-container { width: 100%; max-width: 360px; margin: 0 auto; flex-shrink: 0; }
        
        /* Spinner for loading state */
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-left-color: #1e293b; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-bold gold-text tracking-tight italic">DECIPHER <span class="text-white not-italic">GM-MASTER PRO</span></h1>
                <p class="text-slate-400 text-sm font-light uppercase tracking-widest">Selective Annotation Engine</p>
            </div>
            <nav class="flex gap-2 p-1 bg-slate-900 rounded-lg">
                <button onclick="switchTab('fragmenter')" id="tab-f" class="px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg">1. Fragmenter</button>
                <button onclick="switchTab('reassembler')" id="tab-r" class="px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white">2. Re-assembler</button>
            </nav>
        </header>

        <div id="view-fragmenter" class="space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-xs font-bold uppercase text-slate-500">Master PGN Input</label>
                    <div class="text-right flex items-center gap-2">
                        <!-- Loading spinner added here -->
                        <div id="db-spinner" class="spinner hidden"></div>
                        <div id="stats" class="text-[10px] text-slate-400 uppercase tracking-widest">Ready</div>
                    </div>
                </div>
                <!-- Progress bar moved below -->
                <div class="w-full h-1 bg-slate-800 mb-4 rounded-full overflow-hidden"><div id="progress-fill"></div></div>
                
                <textarea id="pgn-input" rows="4" class="w-full p-4 rounded-xl text-sm mb-4" placeholder="Paste PGN here..."></textarea>
                
                <div class="flex flex-wrap items-center gap-3">
                    <button onclick="processPgn()" class="px-6 py-3 bg-white text-black font-bold rounded-xl hover:bg-slate-200 uppercase text-xs">Initialize Data</button>

                    <!-- Database uploader kept but hidden — theory is no longer used in the prompt -->
                    <label class="hidden px-6 py-3 bg-emerald-700 text-white font-bold rounded-xl hover:bg-emerald-600 uppercase text-xs cursor-pointer flex items-center gap-2">
                        <span>Upload Database</span>
                        <input type="file" id="db-file-input" accept=".zip,.pgn" class="hidden" onchange="handleFileUpload(event)">
                    </label>

                    <button onclick="copySelectedBatch()" id="copy-btn" class="px-6 py-3 gold-bg rounded-xl font-bold uppercase text-xs hidden shadow-lg shadow-yellow-900/20"><span id="copy-text">Copy Selected Batch</span></button>
                    <button onclick="clearAll()" class="px-6 py-3 bg-red-900/30 text-red-400 rounded-xl font-bold uppercase text-xs">Reset</button>
                    <button onclick="downloadTool()" class="px-6 py-3 bg-indigo-800 text-indigo-100 rounded-xl font-bold uppercase text-xs hover:bg-indigo-700">Download This Tool</button>
                </div>
            </div>

            <div id="workspace" class="flex flex-col lg:flex-row gap-6 hidden">
                
                <div class="lg:w-1/3 space-y-4">
                    <div class="glass p-4 rounded-xl">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-bold text-slate-500 uppercase">Start Position</span>
                        </div>
                        <div class="board-container">
                            <div id="board" style="width: 100%;"></div>
                        </div>
                        <div class="mt-4">
                            <label class="text-[10px] font-bold text-slate-500 uppercase">FEN (Feed to AI)</label>
                            <input type="text" id="fen-output" class="w-full p-3 rounded-lg text-xs mt-1 text-emerald-400" readonly placeholder="FEN will appear here...">
                        </div>
                    </div>
                </div>

                <div class="lg:w-2/3 glass p-4 rounded-xl">
                    <div class="mb-3 text-xs text-slate-400 italic">
                        <span class="text-yellow-400 font-bold">Instruction:</span> Click a move to set the <span class="text-white">START</span> of your batch, then click another move to set the <span class="text-white">END</span>. Engine is only called on variation ends / critical marks. Comments stay sparse and plan-focused.
                    </div>
                    <div id="chunks-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-2 max-h-[500px] overflow-y-auto pr-2"></div>
                </div>
                
            </div>
        </div>

        <div id="view-reassembler" class="hidden space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 1: Paste AI JSON</label>
                        <textarea id="ai-json" rows="14" class="w-full p-4 rounded-xl text-xs" placeholder="Paste the entire AI response (including thought process and JSON) here..."></textarea>
                    </div>
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 2: Final Re-Assembled PGN</label>
                        <textarea id="final-pgn" rows="14" class="w-full p-4 rounded-xl text-xs text-emerald-400" readonly></textarea>
                        <div class="flex gap-2">
                            <button onclick="copyToClipboard('final-pgn')" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase hover:bg-slate-700">Copy Final</button>
                            <button onclick="downloadPgn()" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase hover:bg-slate-700">Download</button>
                        </div>
                    </div>
                </div>
                <button onclick="rebuildPgn()" class="mt-6 w-full py-4 gold-bg rounded-xl font-bold uppercase tracking-widest shadow-lg shadow-yellow-900/20 hover:bg-yellow-500">Inject Annotations & Rebuild File</button>
            </div>
        </div>
    </div>

    <!-- Core Libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <!-- JSZip Library added for unzipping files on the fly -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        let globalChunks = [];
        let pgnTokens = [];
        let board = null;
        let selStart = null;
        let selEnd = null;
        let isDbLoaded = false;
        let dynamicMasterDb = {};

        const delay = ms => new Promise(res => setTimeout(res, ms));

        // Create Web Worker for parsing PGN files in the background without UI blocking
        function createPgnParserWorker() {
            const workerCode = `
                importScripts('https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js');

                self.onmessage = function(e) {
                    const pgnContent = e.data;
                    const games = pgnContent.split(/\\n\\s*\\n(?=\\[Event)/g);
                    const db = {};
                    let totalGamesParsed = 0;

                    for (let gamePgn of games) {
                        if (!gamePgn.trim()) continue;
                        
                        // Extract Player Names
                        let whiteMatch = gamePgn.match(/\\[White "(.*?)"\\]/);
                        let blackMatch = gamePgn.match(/\\[Black "(.*?)"\\]/);
                        let pWhite = whiteMatch ? whiteMatch[1] : "Unknown";
                        let pBlack = blackMatch ? blackMatch[1] : "Unknown";

                        let chess = new Chess();
                        if (!chess.load_pgn(gamePgn, { sloppy: true })) continue;

                        totalGamesParsed++;
                        let history = chess.history({ verbose: true });
                        let simChess = new Chess();

                        for (let move of history) {
                            let fen = simChess.fen();
                            let parts = fen.split(' ');
                            let key = parts.slice(0, 4).join(' ');

                            if (!db[key]) {
                                db[key] = { totalGames: 0, moves: {}, topPlayers: {} };
                            }

                            db[key].totalGames++;
                            
                            // Track Move Frequencies
                            if (!db[key].moves[move.san]) {
                                db[key].moves[move.san] = 0;
                            }
                            db[key].moves[move.san]++;

                            // Track Players who reached this exact position
                            let currentPlayer = simChess.turn() === 'w' ? pWhite : pBlack;
                            if (currentPlayer !== "Unknown") {
                                if (!db[key].topPlayers[currentPlayer]) {
                                    db[key].topPlayers[currentPlayer] = 0;
                                }
                                db[key].topPlayers[currentPlayer]++;
                            }

                            simChess.move(move);
                        }

                        if (totalGamesParsed % 50 === 0) {
                            self.postMessage({ type: 'progress', count: totalGamesParsed });
                        }
                    }

                    // Format database entries into standard format
                    const formattedDb = {};
                    for (let key in db) {
                        let entry = db[key];
                        
                        // Sort Moves
                        let sortedMoves = Object.keys(entry.moves).sort((a, b) => entry.moves[b] - entry.moves[a]);
                        let topSan = sortedMoves[0] || "";
                        let choicesStr = sortedMoves.slice(0, 5).map(m => \`\${m} (\${entry.moves[m]} games)\`).join(', ');

                        // Sort Top Players for this position
                        let sortedPlayers = Object.keys(entry.topPlayers).sort((a, b) => entry.topPlayers[b] - entry.topPlayers[a]);
                        let notablePlayers = sortedPlayers.slice(0, 3).map(p => \`\${p} (\${entry.topPlayers[p]} times)\`).join(', ');

                        formattedDb[key] = {
                            totalGames: entry.totalGames,
                            mostPlayedSan: topSan,
                            topChoices: choicesStr,
                            notablePlayers: notablePlayers || "None recorded"
                        };
                    }

                    self.postMessage({ type: 'complete', db: formattedDb, count: totalGamesParsed });
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            return new Worker(URL.createObjectURL(blob));
        }

        // Handler when the user selects a zipped database or raw PGN file
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statsEl = document.getElementById('stats');
            const spinnerEl = document.getElementById('db-spinner');

            try {
                statsEl.innerText = "PROCESSING FILE...";
                spinnerEl.classList.remove('hidden');

                let pgnContent = "";

                if (file.name.endsWith('.zip')) {
                    const zip = new JSZip();
                    const unzipped = await zip.loadAsync(file);

                    const jsFilename = Object.keys(unzipped.files).find(name => name.endsWith('.js'));
                    const pgnFilename = Object.keys(unzipped.files).find(name => name.endsWith('.pgn'));

                    if (jsFilename) {
                        const jsContent = await unzipped.file(jsFilename).async("string");
                        const scriptElement = document.createElement('script');
                        scriptElement.textContent = jsContent;
                        document.body.appendChild(scriptElement);
                        isDbLoaded = true;
                        statsEl.innerText = "DATABASE READY";
                        alert("Pre-compiled database loaded successfully!");
                        return;
                    } else if (pgnFilename) {
                        pgnContent = await unzipped.file(pgnFilename).async("string");
                    } else {
                        statsEl.innerText = "NO PGN/JS IN ZIP";
                        alert("No .pgn or .js database file was found in the ZIP.");
                        return;
                    }
                } else if (file.name.endsWith('.pgn')) {
                    pgnContent = await file.text();
                }

                if (pgnContent) {
                    statsEl.innerText = "PARSING PGN IN WORKER...";
                    const worker = createPgnParserWorker();

                    worker.onmessage = function(e) {
                        if (e.data.type === 'progress') {
                            statsEl.innerText = `PARSED ${e.data.count} GAMES...`;
                        } else if (e.data.type === 'complete') {
                            dynamicMasterDb = e.data.db;
                            isDbLoaded = true;
                            statsEl.innerText = `DB READY (${e.data.count} GAMES)`;
                            alert(`Successfully processed ${e.data.count} games into the database!`);
                            spinnerEl.classList.add('hidden');
                        }
                    };

                    worker.postMessage(pgnContent);
                }
            } catch (e) {
                console.error("File loading failed:", e);
                statsEl.innerText = "DB LOAD ERROR";
                alert("Failed to read database file.");
                spinnerEl.classList.add('hidden');
            }
        }

        // Background loader for auto-fetching Sicilian.zip if hosted locally
        async function loadZippedDatabase() {
            if (isDbLoaded) return;
            try {
                const statsEl = document.getElementById('stats');
                const spinnerEl = document.getElementById('db-spinner');
                
                statsEl.innerText = "EXTRACTING DATABASE...";
                spinnerEl.classList.remove('hidden');

                const response = await fetch('Sicilian.zip');
                if (!response.ok) throw new Error("Zip file not found locally. Use the Upload button.");
                
                const blob = await response.blob();
                const zip = new JSZip();
                const unzipped = await zip.loadAsync(blob);

                const jsFilename = Object.keys(unzipped.files).find(name => name.endsWith('.js'));
                const pgnFilename = Object.keys(unzipped.files).find(name => name.endsWith('.pgn'));
                
                if (jsFilename) {
                    const jsContent = await unzipped.file(jsFilename).async("string");
                    const scriptElement = document.createElement('script');
                    scriptElement.textContent = jsContent;
                    document.body.appendChild(scriptElement);
                    isDbLoaded = true;
                    statsEl.innerText = "DATABASE READY";
                } else if (pgnFilename) {
                    const pgnContent = await unzipped.file(pgnFilename).async("string");
                    const worker = createPgnParserWorker();
                    worker.onmessage = function(e) {
                        if (e.data.type === 'complete') {
                            dynamicMasterDb = e.data.db;
                            isDbLoaded = true;
                            statsEl.innerText = "DATABASE READY";
                            spinnerEl.classList.add('hidden');
                        }
                    };
                    worker.postMessage(pgnContent);
                } else {
                    statsEl.innerText = "NO DEFAULT DB (UPLOAD ZIP)";
                }
            } catch (e) {
                document.getElementById('stats').innerText = "READY (UPLOAD DB)";
            } finally {
                document.getElementById('db-spinner').classList.add('hidden');
            }
        }

        window.onload = () => {
            board = Chessboard('board', {
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                position: 'start'
            });

            loadZippedDatabase();

            const saved = localStorage.getItem('gm_master_state');
            if (saved) {
                const state = JSON.parse(saved);
                document.getElementById('pgn-input').value = state.original;
                if(state.original) { processPgn(true); }
            }
        };

        async function getOpeningDatabase(fen) {
            try {
                const parts = fen.split(' ');
                if (parts.length < 4) return null;

                const board = parts[0];
                const turn = parts[1];
                const castling = parts[2];
                const ep = parts[3];

                const formatsToTry = [
                    fen,
                    `${board} ${turn} ${castling} ${ep}`,
                    `${board} ${turn} ${castling} -`,
                    `${board} ${turn} ${castling}`
                ];

                // 1. Check dynamically parsed PGN worker database
                for (let f of formatsToTry) {
                    if (dynamicMasterDb[f]) {
                        return dynamicMasterDb[f];
                    }
                }

                // 2. Fallback to global pre-compiled JS database if exists
                if (typeof NAJDORF_G3_MASTER_DB !== 'undefined') {
                    for (let f of formatsToTry) {
                        if (NAJDORF_G3_MASTER_DB[f]) {
                            return NAJDORF_G3_MASTER_DB[f];
                        }
                    }
                }

                return null;
            } catch (e) {
                console.error("Local database fetch failed:", e);
                return null;
            }
        }

        function isValidFen(fen) {
            if (!fen || typeof fen !== "string") return false;
            const parts = fen.trim().split(/\s+/);
            if (parts.length < 4) return false;
            try {
                const c = new Chess();
                return c.load(fen);
            } catch (e) {
                return false;
            }
        }

        async function getEngineRefutation(fen, retries = 2) {
            if (!isValidFen(fen)) {
                return { eval: null, san: "", continuation: "", text: "INVALID FEN - skip engine", invalid: true };
            }
            for (let attempt = 0; attempt <= retries; attempt++) {
                try {
                    const response = await fetch("https://chess-api.com/v1", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ fen: fen, depth: 16, maxThinkingTime: 60 })
                    });
                    
                    if (response.status === 429) {
                        await delay(1400 * (attempt + 1));
                        continue;
                    }

                    if (!response.ok) return null;
                    const data = await response.json();

                    // Reject obvious API errors
                    if (data.error || (data.text && /wrong FEN|Cannot evaluate/i.test(data.text))) {
                        return { eval: null, san: "", continuation: "", text: data.text || "Engine rejected FEN", invalid: true };
                    }

                    let cont = "";
                    if (data.continuationArr && data.continuationArr.length) {
                        cont = data.continuationArr.slice(0, 7).join(" ");
                    } else if (data.continuation) {
                        cont = String(data.continuation).split(" ").slice(0, 7).join(" ");
                    }

                    // Prefer SAN-style continuation if API gives only UCI-ish tokens mixed with SAN
                    return {
                        eval: data.eval,
                        san: data.san || data.move || "",
                        continuation: cont,
                        text: data.text || "",
                        invalid: false
                    };
                } catch (e) {
                    if (attempt === retries) return null;
                    await delay(1000);
                }
            }
            return null;
        }

        function switchTab(tab) {
            document.getElementById('view-fragmenter').classList.toggle('hidden', tab !== 'fragmenter');
            document.getElementById('view-reassembler').classList.toggle('hidden', tab !== 'reassembler');
            const f = document.getElementById('tab-f');
            const r = document.getElementById('tab-r');
            f.className = tab === 'fragmenter' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
            r.className = tab === 'reassembler' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
        }

        function processPgn(isLoad = false) {
            const input = document.getElementById('pgn-input').value;
            if (!input) return;

            pgnTokens = input.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|\$\d+|[a-zA-Z0-9\-+=#\/]+[?!]*)/g) || [];
            
            let chunks = [];
            let moveNumber = 0;
            let variationLevel = 0;
            let depthPlyCounts = { 0: 0 }; 
            let lastChunkAtLevel = {};

            let chess = new Chess();
            let stateStack = [];
            let currentFEN = chess.fen();
            let fenBeforeLastMove = currentFEN;

            pgnTokens.forEach((token, index) => {
                if (token === "(") {
                    variationLevel++;
                    depthPlyCounts[variationLevel] = 0; 
                    stateStack.push({ current: currentFEN, beforeLast: fenBeforeLastMove });
                    chess.load(fenBeforeLastMove);
                    return; 
                }
                if (token === ")") {
                    if (lastChunkAtLevel[variationLevel]) {
                        lastChunkAtLevel[variationLevel].isVariationEnd = true;
                    }
                    variationLevel--;
                    let state = stateStack.pop();
                    if(state) {
                        chess.load(state.current);
                        currentFEN = state.current;
                        fenBeforeLastMove = state.beforeLast;
                    }
                    return; 
                }
                
                const isMoveNum = /^\d+\./.test(token);
                if (isMoveNum) {
                    moveNumber = parseInt(token);
                    return; 
                }

                const isMove = /^[a-hA-ZRKNQBO]/.test(token) && !token.startsWith('{') && !token.startsWith('[');
                
                if (isMove) {
                    depthPlyCounts[variationLevel] = (depthPlyCounts[variationLevel] || 0) + 1;
                    fenBeforeLastMove = chess.fen();

                    let cleanMove = token.replace(/[^a-zA-Z0-9=\+\-#O]/g, ''); 
                    let moveObj = chess.move(cleanMove, { sloppy: true });
                    if (!moveObj) {
                        // try without check/mate symbols
                        cleanMove = cleanMove.replace(/[+#]/g, '');
                        moveObj = chess.move(cleanMove, { sloppy: true });
                    }
                    if (!moveObj) {
                        // last resort: try original token with only trailing annotations stripped
                        const alt = token.replace(/[!?]+$/g, '').replace(/\$\d+$/g, '').trim();
                        if (alt && alt !== cleanMove) {
                            moveObj = chess.move(alt, { sloppy: true });
                        }
                    }
                    let parsedOk = !!moveObj;
                    if (moveObj) {
                        currentFEN = chess.fen();
                    } else {
                        // keep previous FEN so we never send garbage to the engine
                        currentFEN = fenBeforeLastMove;
                        console.warn("Move failed to parse:", token, "at", fenBeforeLastMove);
                    }

                    // Normalize FENs: always produce a loadable 6-field FEN when possible
                    const normalizeFen = (f) => {
                        if (!f || typeof f !== "string") return f;
                        try {
                            const tmp = new Chess();
                            if (tmp.load(f)) return tmp.fen();
                        } catch (e) {}
                        return f;
                    };
                    fenBeforeLastMove = normalizeFen(fenBeforeLastMove);
                    currentFEN = normalizeFen(currentFEN);

                    let evalSymbol = "";
                    let nextToken = pgnTokens[index + 1];
                    if (nextToken && (nextToken.startsWith('$') || /^[!?]+$/.test(nextToken) || /^[\+\-=]+$/.test(nextToken))) {
                        evalSymbol = ` ${nextToken}`;
                    }

                    const isFirstMoveOfVariation = (variationLevel > 0 && depthPlyCounts[variationLevel] === 1);

                    let newChunk = {
                        id: `CHK_${chunks.length}_M${moveNumber}_V${variationLevel}`,
                        target: token + evalSymbol,
                        moveNum: moveNumber,
                        tokenIndex: index,
                        isMainLine: variationLevel === 0,
                        isVariationStart: isFirstMoveOfVariation,
                        isVariationEnd: false,
                        fen: fenBeforeLastMove,
                        fenAfter: currentFEN,
                        moveParsed: parsedOk
                    };

                    chunks.push(newChunk);
                    lastChunkAtLevel[variationLevel] = newChunk;
                }
            });

            if (lastChunkAtLevel[0]) {
                lastChunkAtLevel[0].isVariationEnd = true;
            }

            globalChunks = chunks;
            document.getElementById('workspace').classList.remove('hidden');
            document.getElementById('copy-btn').classList.remove('hidden');
            
            selStart = null;
            selEnd = null;
            board.position('start', false);
            document.getElementById('fen-output').value = "";

            updateUI();
            saveState();
        }

        function selectChunk(index) {
            if (selStart === null || (selStart !== null && selEnd !== null)) {
                selStart = index;
                selEnd = null;
                let fen = globalChunks[index].fen;
                document.getElementById('fen-output').value = fen;
                board.position(fen, false); 
            } else {
                selEnd = Math.max(selStart, index);
                selStart = Math.min(selStart, index);
            }
            updateUI();
        }

        async function copySelectedBatch() {
            if (selStart === null) {
                alert("Please click on a starting move and an ending move first!");
                return;
            }
            
            const btn = document.getElementById('copy-btn');
            const btnText = document.getElementById('copy-text');
            const statsText = document.getElementById('stats');
            const progressFill = document.getElementById('progress-fill');
            
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btn.disabled = true;

            let endIdx = selEnd !== null ? selEnd : selStart;
            let startingFen = globalChunks[selStart].fen;
            let batchData = [];
            let totalSelectedMoves = (endIdx - selStart) + 1;

            for (let i = selStart; i <= endIdx; i++) {
                let currentStep = (i - selStart) + 1;
                let c = globalChunks[i];

                // Determine who just played and who is to move after — only trust when moveParsed
                const fenPartsBefore = (c.fen || "").split(" ");
                const sideJustPlayed = fenPartsBefore[1] === "w" ? "White" : (fenPartsBefore[1] === "b" ? "Black" : "?");
                const fenPartsAfter = (c.fenAfter || "").split(" ");
                const sideToMoveAfter = fenPartsAfter[1] === "w" ? "White" : (fenPartsAfter[1] === "b" ? "Black" : "?");
                const fenOk = c.moveParsed !== false && isValidFen(c.fenAfter);

                let lineOutput = `[ID: ${c.id}] | Move: ${c.moveNum}. ${c.target} | Played by: ${sideJustPlayed} | Side to move AFTER: ${sideToMoveAfter} | FEN OK: ${fenOk} | Main: ${c.isMainLine} | VarStart: ${c.isVariationStart} | VarEnd: ${c.isVariationEnd}`;

                let currentProgress = ((currentStep - 1) / totalSelectedMoves) * 100;
                progressFill.style.width = `${currentProgress}%`;
                
                statsText.innerText = `Analyzing Move: ${c.moveNum}. ${c.target}`;

                // Only call engine on variation ends or critical marks, and only if FEN is valid
                const needsEngine = fenOk && (c.isVariationEnd || /[?!$]/.test(c.target));
                
                if (needsEngine) {
                    btnText.innerHTML = `<div class="spinner"></div>Engine line [${currentStep}/${totalSelectedMoves}]...`;
                    await delay(350); 
                    
                    let engineData = await getEngineRefutation(c.fenAfter);
                    if (engineData && engineData.invalid) {
                        lineOutput += `\n   -> [FEN AFTER MOVE]: ${c.fenAfter}`;
                        lineOutput += `\n   -> [ENGINE]: FEN rejected. Write a short positional plan only if variation end. Respect side to move.`;
                    } else if (engineData) {
                        lineOutput += `\n   -> [FEN AFTER MOVE]: ${c.fenAfter}`;
                        const bestLine = `${engineData.san || ""} ${engineData.continuation || ""}`.trim();
                        lineOutput += `\n   -> [SHORT BEST LINE]: ${bestLine}`;
                        lineOutput += `\n   -> [EVAL]: ${engineData.eval}`;

                        const cont = bestLine;
                        const evalNum = parseFloat(engineData.eval);
                        const isMate = /mate|#/i.test(String(engineData.eval)) || /#/.test(cont);
                        const hasForce = /[x+#]/.test(cont);
                        const bigSwing = !isNaN(evalNum) && Math.abs(evalNum) >= 1.2;

                        if (isMate || (hasForce && bigSwing) || bigSwing) {
                            lineOutput += `\n   -> [TACTICAL FLAG]: Explain the concrete sequence in plain English. Use only moves from the short best line. Respect who is to move.`;
                        }

                        if (c.isVariationEnd) {
                            lineOutput += `\n   -> [VARIATION END FLAG]: Last move of this branch. Give a clear 1-2 sentence plan or idea. Attribute plans only to the correct side.`;
                        }
                        statsText.innerText = `[${c.moveNum}.${c.target}] Line: ${engineData.san || "?"}`;
                    } else {
                        lineOutput += `\n   -> [FEN AFTER MOVE]: ${c.fenAfter}`;
                        lineOutput += `\n   -> [ENGINE]: No data.`;
                        if (c.isVariationEnd) {
                            lineOutput += `\n   -> [VARIATION END FLAG]: Last move of a branch. Write a short positional plan. Respect side to move.`;
                        }
                    }
                } else {
                    // Always include FEN when valid so the AI sees the board correctly
                    if (fenOk) {
                        lineOutput += `\n   -> [FEN AFTER MOVE]: ${c.fenAfter}`;
                    } else {
                        lineOutput += `\n   -> [FEN AFTER MOVE]: UNRELIABLE (move did not parse cleanly — do not invent a position)`;
                    }
                    if (c.isVariationEnd) {
                        lineOutput += `\n   -> [VARIATION END FLAG]: Last move of a branch. Write a short positional plan. Respect side to move.`;
                    }
                    await delay(30);
                }
                
                batchData.push(lineOutput);
            }

            progressFill.style.width = '100%';
            const batchString = batchData.join("\n\n");
            
            const fullPrompt = `You are a strong human coach writing sparse opening notes in the exact style of a modern repertoire book. English natural, about 70%.

STARTING FEN: ${startingFen}

=== HARD RULES ===
1. Comments ONLY AFTER the move. Never before.
2. Most moves get NO comment. Stay very sparse.
3. You MUST comment every move with [VARIATION END FLAG].
4. You MUST comment every move with [TACTICAL FLAG] or marked ?, ??, $2, $4.
5. You may add a short idea on a few key moves before a variation ends if it helps the reader. Otherwise silence.
6. Never start a comment by naming the move just played.
7. Never mention engine, Stockfish, database, eval numbers, or "I calculated".
8. Banned: delve, crucial, fascinating, testament, symphony, orchestrate, tuck, clamp, secure, dynamic, nuanced, paradigm, leverage, robust, seamless, initiative (overuse), pressure (overuse).
9. Spelling: centre, d4-square, pair of bishops.
10. 1-2 short sentences max. Prefer one clear idea.

=== SIDE TO MOVE / COLOUR / FEN (CRITICAL — NEVER GET THIS WRONG) ===
Every chunk tells you:
  Played by: White|Black
  Side to move AFTER: White|Black
  FEN OK: true|false
  [FEN AFTER MOVE]: ...

- Trust the FEN only when FEN OK is true. If FEN is marked UNRELIABLE, do not invent a board position.
- Attribute every plan, idea, threat, or "will continue with" ONLY to the correct colour.
- If it is White to move after the move, do not write plans as if Black is about to play.
- If the move was played by Black, do not say "White is preparing..." for that same move.
- "We" is allowed only when the repertoire is clearly written for that side; otherwise use "White" or "Black" correctly.
- When describing a short best line, the first move of that line is played by the side to move AFTER the current move.
- Double-check the FEN turn indicator (w/b) before writing. Zero colour mistakes. Zero wrong-side plans.

=== TENSE AND VOICE (copy exactly) ===
Use the same tenses as these examples:

Present for what the move does or the current idea:
- "Black is fighting for space, it makes sense to exchange a few pieces."
- "Black goes for the usual central break."
- "Black is preparing to expand with b5."
- "Stops Ne4 as c4 would be hanging after Bxe4."
- "is losing time"
- "Nb3 is the threat..."

Future / plan language for what comes next:
- "Black will continue with …b6–Bb7, taking control of the d5 outpost."
- "Black will actively look to land Ne4 once prepared."
- "Black will continue with Qb7-Rad8 and is very comfortable thereafter."
- "Next, we play Bd7, activate our Rooks, and prepare b5."
- "Next, we plan to play Rad8 and exchange the rooks..."
- "with the idea of Bb7"
- "With the idea of b5, which can't be stopped, we gain valuable space on the queenside."

"We" when speaking as the side the repertoire is written for:
- "We put pressure on the f4-Bishop and aim to exchange pieces as we need space now."
- "We equalize comfortably out of the opening."
- "our idea is to exchange Queens on e4 or b3, and then activate the Rooks with Rfd8 and Rac8."

Conditional for tactics:
- "If Black takes the bishop, Bxf7+ Ke7 Nd5 is mate."

Do NOT write long past-tense recaps of the moves that just happened. Do NOT list forced sequences move-by-move. Turn any short best line into a plan in the present/future voice above.

=== STYLE SAMPLES (match this voice) ===
"as White commits the bishop, Black can simply capture the c4 pawn."
"Black is fighting for space, it makes sense to exchange a few pieces."
"Black goes for the usual central break."
"Black continues with …b6–Bb7, taking control of the d5 outpost; if White plays a3, the knight can always return to d5 otherwise it stays on b4."
"Black will continue with Bf5-Bf8. Black has a strong knight in the center and thus will solidify it."
"Black gains space on the queenside."
"Black will actively look to land Ne4 once prepared."
"Stops Ne4 as c4 would be hanging after Bxe4."
"is losing time"
"Black is preparing to expand with b5"
"White stops b5 but has given away the b4 square in the process."
"Black has no problems here and would simply land the evident ...c5 here to dismantle White in the centre."
"Black immediately hits with c5 and would make the best use of dark squares."
"with the idea of Bb7"
"Nb3 is the threat..."
"Black will continue with Qb7-Rad8 and is very comfortable thereafter."
"We put pressure on the f4-Bishop and aim to exchange pieces as we need space now."
"Black simply gets an extra pawn but is lacking development here."
"Next, we play Bd7, activate our Rooks, and prepare b5."
"White is using the best of his strength to open up the position, as that's what you do when the opponent is lacking in development."
"Although the position is unclear, Bf5 and Rad8 gives Black a clear and active piece play."
"We equalize comfortably out of the opening."
"An interesting novelty from Black to offer an exchange."
"Black centralizes the Queen and our idea is to exchange Queens on e4 or b3, and then activate the Rooks with Rfd8 and Rac8."
"Black is to play Bb7 and double the Rooks on the d-file."
"Next, we plan to play Rad8 and exchange the rooks and go into the queenside majority endgame which is usually better for the side with majority."
"With the idea of b5, which can't be stopped, we gain valuable space on the queenside."

=== BAD (never write like this) ===
"White is better."
"White keeps the initiative."
"The queen check on f3 forces the king further into the open where it has no good squares."
"g6 is met by Bxd5+ and after Ke8 the queen drops back to f3, winning the c6-knight..."
(Any long move-by-move retelling of what is already in the PGN.)
(Any comment that mixes up White and Black or assigns a plan to the side that is not to move.)

=== OUTPUT ===
Return ONLY a pure JSON object. Keys = chunk IDs. Values = comment text.
Omit keys with no comment.
No markdown, no thought process, no extra text.

=== BATCH TO ANALYZE ===
${batchString}`;

            navigator.clipboard.writeText(fullPrompt).then(() => {
                resetCopyBtnUI(btn, btnText, statsText, progressFill, totalSelectedMoves);
                alert(`Selected Batch Copied! Analyzed ${totalSelectedMoves} moves.`);
            }).catch(err => {
                const textArea = document.createElement("textarea");
                textArea.value = fullPrompt;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    resetCopyBtnUI(btn, btnText, statsText, progressFill, totalSelectedMoves);
                    alert(`Selected Batch Copied! Analyzed ${totalSelectedMoves} moves.`);
                } catch (e) {
                    alert("Clipboard error. Please try again or copy manually.");
                    resetCopyBtnUI(btn, btnText, statsText, progressFill, totalSelectedMoves);
                }
                document.body.removeChild(textArea);
            });
        }

        function resetCopyBtnUI(btn, btnText, statsText, progressFill, total) {
            btnText.innerText = "Copy Selected Batch";
            statsText.innerText = `${globalChunks.length} TOTAL MOVES`;
            btn.classList.remove('opacity-80', 'cursor-not-allowed');
            btn.disabled = false;
            setTimeout(() => { progressFill.style.width = '0%'; }, 1500);
        }

        function updateUI() {
            const container = document.getElementById('chunks-container');
            container.innerHTML = "";
            
            globalChunks.forEach((c, i) => {
                const div = document.createElement('div');
                let selectionClass = '';
                if (selStart !== null) {
                    let maxSelect = selEnd !== null ? selEnd : selStart;
                    if (i === selStart) selectionClass = 'selected-start';
                    else if (i > selStart && i <= maxSelect) selectionClass = 'selected-range';
                }

                div.className = `chunk-card glass p-3 rounded-lg ${selectionClass}`;
                div.onclick = () => selectChunk(i);
                div.innerHTML = `<p class="text-[9px] gold-text font-bold mb-1">${c.id}</p><p class="text-xs font-semibold truncate">${c.moveNum}. ${c.target}</p>`;
                container.appendChild(div);
            });
            document.getElementById('stats').innerText = `${globalChunks.length} TOTAL MOVES`;
        }

        function rebuildPgn() {
            const raw = document.getElementById('ai-json').value;
            let aiData = {};
            
            try {
                const firstBrace = raw.indexOf('{');
                const lastBrace = raw.lastIndexOf('}');
                
                if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
                    const jsonStr = raw.substring(firstBrace, lastBrace + 1);
                    aiData = JSON.parse(jsonStr);
                } else {
                    aiData = JSON.parse(raw);
                }
            } catch (e) {
                alert("Failed to parse the JSON. Please ensure the AI provided a valid JSON object mapping chunk IDs to comments.");
                console.error("JSON Parse Error:", e);
                return;
            }
            
            let workingTokens = [...pgnTokens];
            const sortedIds = Object.keys(aiData).sort((a,b) => {
                const idxA = globalChunks.find(c => c.id === a)?.tokenIndex || 0;
                const idxB = globalChunks.find(c => c.id === b)?.tokenIndex || 0;
                return idxB - idxA;
            });

            // Always place comments AFTER the move (never before)
            sortedIds.forEach(id => {
                const chunk = globalChunks.find(c => c.id === id);
                if (chunk) {
                    workingTokens[chunk.tokenIndex] += ` { ${aiData[id]} }`;
                }
            });

            document.getElementById('final-pgn').value = workingTokens.join(" ");
        }

        function saveState() {
            localStorage.setItem('gm_master_state', JSON.stringify({ original: document.getElementById('pgn-input').value }));
        }

        function clearAll() {
            localStorage.removeItem('gm_master_state');
            location.reload();
        }

        function copyToClipboard(id) {
            navigator.clipboard.writeText(document.getElementById(id).value);
            alert("Copied!");
        }

        function downloadPgn() {
            const val = document.getElementById('final-pgn').value;
            const blob = new Blob([val], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "GM_Variation_Analysis.pgn";
            a.click();
        }

        // Download the current tool itself
        function downloadTool() {
            try {
                // Serialize the entire current document (works offline / file://)
                const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
                const blob = new Blob([html], {type: 'text/html'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = "pro.html";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
            } catch (e) {
                alert("Download failed. Right-click the page → Save As… instead.");
            }
        }
    </script>
