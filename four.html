<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Variation Master | Decipher Chess Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chunk-card { border-left: 4px solid #d4af37; transition: all 0.2s; }
        .chunk-card.completed { border-left-color: #10b981; opacity: 0.6; }
        textarea { background: #0f172a !important; border: 1px solid #334155 !important; font-family: 'Fira Code', monospace; }
        textarea:focus { border-color: #d4af37 !important; outline: none; }
        #progress-fill { height: 100%; background: #d4af37; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-bold gold-text tracking-tight italic">DECIPHER <span class="text-white not-italic">GM-MASTER</span></h1>
                <p class="text-slate-400 text-sm font-light">Advanced Pedagogy & Structural PGN Re-assembler</p>
            </div>
            <nav class="flex gap-2 p-1 bg-slate-900 rounded-lg">
                <button onclick="switchTab('fragmenter')" id="tab-f" class="px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg">1. Fragmenter</button>
                <button onclick="switchTab('reassembler')" id="tab-r" class="px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white">2. Re-assembler</button>
            </nav>
        </header>

        <div id="view-fragmenter" class="space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-xs font-bold uppercase text-slate-500">Master PGN Input</label>
                    <div class="text-right">
                        <div id="stats" class="text-[10px] text-slate-400 uppercase tracking-widest">Engine Idle</div>
                        <div class="w-32 h-1 bg-slate-800 mt-1"><div id="progress-fill"></div></div>
                    </div>
                </div>
                <textarea id="pgn-input" rows="8" class="w-full p-4 rounded-xl text-sm" placeholder="Paste your master PGN here..."></textarea>
                
                <div class="mt-6 flex flex-wrap gap-3">
                    <button onclick="processPgn()" class="px-6 py-3 bg-white text-black font-bold rounded-xl hover:bg-slate-200">INITIALIZE ENGINE</button>
                    <button onclick="copyNextBatch()" id="batch-btn" class="px-6 py-3 gold-bg rounded-xl font-bold hidden">COPY NEXT BATCH (10)</button>
                </div>
            </div>
            <div id="chunks-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </div>

        <div id="view-reassembler" class="hidden space-y-6">
            <div class="glass p-6 rounded-2xl">
                <h2 class="text-xl font-bold gold-text mb-4 uppercase tracking-widest">The Re-Assembler</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">AI JSON Batch Response</label>
                        <textarea id="ai-json" rows="12" class="w-full p-4 rounded-xl text-xs" placeholder='{"CHUNK_0": "..."}'></textarea>
                    </div>
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Final Output PGN</label>
                        <textarea id="final-pgn" rows="12" class="w-full p-4 rounded-xl text-xs text-blue-300" readonly></textarea>
                        <div class="flex gap-2">
                            <button onclick="copyFinalPgn()" class="flex-1 py-2 bg-slate-800 text-xs font-bold rounded-lg hover:bg-slate-700 uppercase">Copy to Clipboard</button>
                            <button onclick="downloadPgn()" class="flex-1 py-2 bg-slate-800 text-xs font-bold rounded-lg hover:bg-slate-700 uppercase">Download .pgn</button>
                        </div>
                    </div>
                </div>
                <button onclick="rebuildPgn()" class="mt-6 w-full py-4 gold-bg rounded-xl font-bold">MERGE ANNOTATIONS & REBUILD</button>
            </div>
        </div>
    </div>

    <script>
        let globalChunks = [];
        let originalPgn = "";
        let currentBatchStart = 0;
        const BATCH_SIZE = 10;

        function switchTab(tab) {
            document.getElementById('view-fragmenter').classList.toggle('hidden', tab !== 'fragmenter');
            document.getElementById('view-reassembler').classList.toggle('hidden', tab !== 'reassembler');
            document.getElementById('tab-f').className = tab === 'fragmenter' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
            document.getElementById('tab-r').className = tab === 'reassembler' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
        }

        function processPgn() {
            originalPgn = document.getElementById('pgn-input').value;
            const gameBody = originalPgn.replace(/\[.*?\]/g, '').trim();
            const tokens = gameBody.match(/(\(|\)|\d+\.{1,3}|[a-zA-Z0-9\-+=#$]+|\{.*?\}|\[.*?\])/g);
            if (!tokens) return;

            let chunks = [];
            let variationStack = []; 
            let moveCounter = 0;
            let currentTokens = [];

            tokens.forEach((token, idx) => {
                if (token === "(") { 
                    variationStack.push(moveCounter);
                    moveCounter = 0;
                }
                else if (token === ")") { 
                    moveCounter = variationStack.pop() || 0;
                }
                else {
                    const isMove = /^[a-zA-Z]/.test(token) && !token.startsWith('{') && !token.startsWith('[');
                    if (isMove) moveCounter++;
                    
                    if ((isMove && moveCounter === 3) || idx === tokens.length - 1) {
                        chunks.push({
                            id: `CHUNK_${chunks.length}`,
                            context: tokens.slice(Math.max(0, idx-10), idx).join(" "),
                            target: token 
                        });
                        moveCounter = 0; 
                    }
                }
            });

            globalChunks = chunks;
            document.getElementById('batch-btn').classList.remove('hidden');
            updateUI();
        }

        function copyNextBatch() {
            const end = Math.min(currentBatchStart + BATCH_SIZE, globalChunks.length);
            const batch = globalChunks.slice(currentBatchStart, end).map(c => `ID: ${c.id}\nContext: ...${c.context}\nTarget: ${c.target}`).join("\n---\n");

            const prompt = `Task: Provide GM-level positional analysis for the target move. 
STRICT GUIDELINES:
- No superficial descriptions.
- Use Terminology: "light/dark squares", "pawn structure", "bishop pair".
- Return ONLY JSON: {"CHUNK_ID": "Comment"}`;

            navigator.clipboard.writeText(prompt + "\n\n" + batch);
            alert(`Batch ${currentBatchStart} to ${end - 1} copied!`);
            currentBatchStart = end;
            updateUI();
        }

        function updateUI() {
            const container = document.getElementById('chunks-container');
            container.innerHTML = "";
            globalChunks.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = `chunk-card glass p-3 rounded-lg ${i < currentBatchStart ? 'completed' : ''}`;
                div.innerHTML = `<span class="text-[9px] gold-text font-black">${c.id}</span><p class="text-xs font-bold truncate">After: ${c.target}</p>`;
                container.appendChild(div);
            });
            document.getElementById('progress-fill').style.width = `${(currentBatchStart / globalChunks.length) * 100}%`;
            document.getElementById('stats').innerText = `${currentBatchStart} / ${globalChunks.length} ANALYSES`;
        }

        function rebuildPgn() {
            const rawValue = document.getElementById('ai-json').value;
            let aiData = {};
            const jsonBlocks = rawValue.match(/\{[\s\S]*?\}/g);
            if (jsonBlocks) {
                jsonBlocks.forEach(block => {
                    try {
                        Object.assign(aiData, JSON.parse(block));
                    } catch (e) {}
                });
            }

            let pgn = originalPgn;
            const sortedIds = Object.keys(aiData).sort((a, b) => parseInt(b.split('_')[1]) - parseInt(a.split('_')[1]));

            sortedIds.forEach(id => {
                const chunk = globalChunks.find(c => c.id === id);
                if (chunk) {
                    const comment = ` { ${aiData[id]} }`;
                    pgn = pgn.replace(chunk.target, `${chunk.target}${comment}`);
                }
            });
            document.getElementById('final-pgn').value = pgn;
        }

        // New Helper Functions
        function copyFinalPgn() {
            const output = document.getElementById('final-pgn');
            if (!output.value) return alert("Nothing to copy yet!");
            navigator.clipboard.writeText(output.value);
            alert("PGN copied to clipboard!");
        }

        function downloadPgn() {
            const content = document.getElementById('final-pgn').value;
            if (!content) return alert("Generate the PGN first!");
            const blob = new Blob([content], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Annotated_Game_${new Date().getTime()}.pgn`;
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
