        .white-1e1d7 { background-color: #f0fdaf !important; }
        .black-3c85d { background-color: #3b82f6 !important; }

            <p id="errorMsg" class="text-red-400 text-center text-xs hidden"></p>
        </div>
    </div>

    <div id="game-arena" class="hidden w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-3 space-y-4">
            <div class="bg-slate-900/50 p-6 rounded-2xl border border-white/5">

                    <span class="bg-green-500/20 text-green-400 text-[10px] px-2 py-1 rounded">CONNECTED</span>

        </div>

        <div class="lg:col-span-6 flex flex-col items-center">
            <div id="board-container" class="w-full max-w-[480px] border-[8px] border-slate-800 rounded-xl overflow-hidden shadow-2xl transition-all">

            </div>
            <div class="flex gap-4 mt-6 w-full max-w-[480px]">

                <button id="resetBtn" class="flex-1 bg-white/5 border border-white/10 text-white py-3 rounded-xl font-bold hover:bg-white/10"><i class="fas fa-sync-alt mr-2"></i>RESET</button>

            { fen: '6k1/1p1r1pp1/p1r3b1/3pPqB1/2pP4/Q1P4R/P3P2K/6R1 w - - 1 0', sol: ['Qf8+', 'Kxf8', 'Rh8#'] },

            { fen: 'rnb2b1r/p3kBp1/3pNn1p/2pQN3/1p2PP2/4B3/Pq5P/4K3 w - - 1 0', sol: ['Qxd6+', 'Kxd6', 'Bxc5#'] },

            { fen: 'r2qkb1r/2p1nppp/p2p4/np1NN3/4P3/1BP5/PP1P1PPP/R1B1K2R w - - 1 0', sol: ['Nf6+', 'gxf6', 'Bxf7#'] },
            { fen: 'rnbkn2r/pppp1Qpp/5b2/3NN3/3Pp3/8/PPP1KP1P/R1B4q w - - 1 0', sol: ['Qe7+', 'Bxe7', 'Nf7#'] },
            { fen: '4rk2/2pQn2p/p4p2/1p2pN1P/4q3/2P3R1/5PPK/8 w - - 1 0', sol: ['Rg8+', 'Kf7', 'Nh6#'] },
            { fen: 'r1b2rk1/pp3ppp/3p4/3Q1nq1/2B1R3/8/PP3PPP/R5K1 w - - 1 0', sol: ['Qxf7+', 'Rxf7', 'Re8#'] },
            { fen: '7r/p3ppk1/3p4/2p1P1Kp/2Pb4/3P1QPq/PP5P/R6R b - - 0 1', sol: ['Be3+', 'Qxe3', 'Qg4#'] },
            { fen: 'rn2kb1r/ppp1pppp/8/8/4q3/3P1N1b/PPP1BPnP/RNBQ1K1R b kq - 0 1', sol: ['Nh4+', 'Ke1', 'Nxf3#'] },
            { fen: 'r1b1kb1r/pp1n1pp1/1qp1p2p/6B1/2PPQ3/3B1N2/P4PPP/R4RK1 w - - 1 0', sol: ['Qxe6+', 'fxe6', 'Bg6#'] },
            { fen: '6k1/5p2/1p5p/p4Np1/5q2/Q6P/PPr5/3R3K w - - 1 0', sol: ['Qf8+', 'Kxf8', 'Rd8#'] },
            { fen: 'r3q3/ppp3k1/3p3R/5b2/2PR3Q/2P1PrP1/P7/4K3 w - - 1 0', sol: ['Qf6+', 'Kg8', 'Rh8#'] },
            { fen: 'r3k2r/1Bp2ppp/8/4q1b1/pP1n4/P1KP3P/1BP5/R2Q3R b - - 0 1', sol: ['Nb5+', 'Kc4', 'Nd6#'] },
            { fen: 'r1bq2rk/pp3pbp/2p1p1p6/7P/3P4/2PB1N2/PP3PPR/2KR4 w - - 1 0', sol: ['Qxh7+', 'Kxh7', 'hxg6#'] },
            { fen: 'k1n3rr/Pp3p2/3q4/3N4/3Pp2p/1Q2P1p1/3B1PP1/R4RK1 w - - 1 0', sol: ['Qxb7+', 'Kxb7', 'a8=Q#'] },
            { fen: '8/1p3k2/4p1rp/p3Pp1Q/3qnP2/1P6/P6P/2R2R1K b - - 0 1', sol: ['Qg1+', 'Rxg1', 'Nf2#'] },
            { fen: 'r1bq3r/ppp1b1kp/2n3p1/3B3Q/3p4/8/PPP2PPP/RNB2RK1 w - - 1 0', sol: ['Bh6+', 'Kf6', 'Qg5#'] },
            { fen: '4r3/pbpn2n1/1p1prp1k/8/2PP2PB/P5N1/2B2R1P/R5K1 w - - 1 0', sol: ['Rxf6+', 'Nxf6', 'g5#'] },
            { fen: '1q5r/1b1r1p1k/2p1pPpb/p1Pp4/3B1P1Q/1P4P1/P4KB1/2RR4 w - - 1 0', sol: ['Qxh6+', 'Kxh6', 'Rh1#'] },
            { fen: 'r4R2/1b2n1pp/p2Np1k1/1pn5/4pP1P/8/PPP1B1P1/2K4R w - - 1 0', sol: ['h5+', 'Kh6', 'Nf7#'] }
        ];

        // --- GAME STATE ---
        let user = { name: '', class: '', score: 0, lives: 10, hints: 3 };
        let currentIdx = 0, moveStep = 0, board, game, sourceSquare = null;

        const sounds = {
            move: new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_standard/default/move-self.mp3'),
            wrong: new Audio('https://www.myinstants.com/media/sounds/wrong-answer-126515.mp3'),
            success: new Audio('https://www.myinstants.com/media/sounds/level-up-188970.mp3')
        };

        // --- AUTH LOGIC ---
        $('#startBtn').on('click', async () => {
            const name = $('#stuName').val().trim();
            const pass = $('#stuPass').val().trim();
            if(!name || !pass) return;

            const snap = await db.collection('students').doc(name).get();
            if(snap.exists() && snap.data().password !== pass) {
                $('#errorMsg').text("Wrong password! No impersonation allowed.").show();
                return;
            }
            if(!snap.exists()) {
                await db.collection('students').doc(name).set({ name, password: pass, class: $('#stuClass').val(), score: 0 });
            }
            user.name = name; user.class = $('#stuClass').val();
            launchGame();
        });

        function launchGame() {
            $('#auth-screen').hide();
            $('#game-arena').removeClass('hidden').addClass('grid');
            initBoard();
            syncChat();
            syncLeaderboard();
        }

        function initBoard() {
            game = new Chess();
            loadPuzzle(0);
        }

        function loadPuzzle(idx) {
            if(idx >= puzzleSet.length) {
                $('#moveFeedback').text("🏆 LEGEND STATUS ACHIEVED!").addClass('text-yellow-500');
                return;
            }
            const p = puzzleSet[idx];
            game.load(p.fen);
            moveStep = 0; sourceSquare = null;
            board = Chessboard('board', {
                draggable: true,
                position: p.fen,
                onDrop: handleUserMove,
                pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chesspieces/wikipedia/{piece}.png'
            });
            updateUI();
            $('#moveFeedback').text("White to move & Mate in 2").removeClass('text-red-400 text-green-400');
            attachClickToMove();
        }

        function handleUserMove(source, target) {
            const sol = puzzleSet[currentIdx].sol;
            const valid = game.moves({ square: source, verbose: true });
            const attempt = valid.find(m => m.to === target);

            if(!attempt || attempt.san !== sol[moveStep]) {
                sounds.wrong.play();
                user.lives--;
                $('#board-container').addClass('error-shake');
                setTimeout(() => $('#board-container').removeClass('error-shake'), 400);
                if(user.lives <= 0) restartProgress();
                updateUI();
                return 'snapback';
            }

            // Correct Move
            game.move(attempt.san);
            sounds.move.play();
            moveStep++;

            if(moveStep === sol.length) {
                sounds.success.play();
                user.score += 10;
                $('#board-container').addClass('success-glow');
                db.collection('students').doc(user.name).update({ score: user.score });
                setTimeout(() => {
                    $('#board-container').removeClass('success-glow');
                    currentIdx++;
                    loadPuzzle(currentIdx);
                }, 1000);
            } else {
                setTimeout(() => {
                    game.move(sol[moveStep]);
                    board.position(game.fen());
                    moveStep++;
                }, 500);
            }
        }

        // --- CLICK TO MOVE ---
        function attachClickToMove() {
            $('.square-55d63').off('click').on('click', function() {
                const sq = $(this).data('square');
                const piece = game.get(sq);

                if(!sourceSquare) {
                    if(piece && piece.color === 'w') {
                        sourceSquare = sq;
                        $(this).addClass('highlight-square');
                    }
                } else {
                    const result = handleUserMove(sourceSquare, sq);
                    if(result !== 'snapback') board.position(game.fen());
                    $('.square-55d63').removeClass('highlight-square');
                    sourceSquare = null;
                }
            });
        }

        function updateUI() {
            $('#lives').text(user.lives);
            $('#score').text(user.score);
            $('#hints').text(`${user.hints}/3`);
        }

        function restartProgress() {
            user.lives = 10; user.score = 0; currentIdx = 0;
            db.collection('students').doc(user.name).update({ score: 0 });
            loadPuzzle(0);
        }

        // --- FIREBASE SYNC ---
        function syncChat() {
            db.collection('chat').orderBy('time', 'desc').limit(20).onSnapshot(snap => {
                $('#chat-messages').empty();
                snap.forEach(doc => {
                    const m = doc.data();
                    $('#chat-messages').prepend(`
                        <div><span class="text-yellow-500 font-bold">${m.name}:</span> <span class="text-slate-300">${m.text}</span></div>
                    `);
                });
            });
        }

        $('#sendChat').on('click', () => {
            const text = $('#chatInput').val().trim();
            if(!text) return;
            db.collection('chat').add({ name: user.name, text, time: firebase.firestore.FieldValue.serverTimestamp() });
            $('#chatInput').val('');
        });

        function syncLeaderboard() {
            db.collection('students').orderBy('score', 'desc').onSnapshot(snap => {
                $('#leaderboard').empty();
                let rank = 1;
                snap.forEach(doc => {
                    const s = doc.data();
                    $('#leaderboard').append(`
                        <div class="flex justify-between p-2 rounded ${s.name === user.name ? 'bg-yellow-500/20' : 'bg-white/5'}">
                            <span>${rank++}. ${s.name}</span>
                            <span class="font-bold">${s.score}</span>
                        </div>
                    `);
                });
            });
        }

        $('#hintBtn').on('click', () => {
            if(user.hints > 0) {
                user.hints--;
                const sol = puzzleSet[currentIdx].sol[moveStep];
                $('#moveFeedback').text(`HINT: Try moving the ${sol[0] === 'N' ? 'Knight' : sol[0] === 'B' ? 'Bishop' : 'Piece'}`).addClass('text-yellow-500');
                updateUI();
            }
        });
    </script>
</body>
</html>
