<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Variation Master Pro | Decipher Chess Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #1e293b; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chunk-card { border-left: 4px solid #d4af37; transition: all 0.2s; cursor: pointer; }
        .chunk-card.completed { border-left-color: #10b981; opacity: 0.5; }
        textarea { background: #0f172a !important; border: 1px solid #334155 !important; font-family: 'Fira Code', monospace; scrollbar-width: thin; }
        textarea:focus { border-color: #d4af37 !important; outline: none; }
        #progress-fill { height: 100%; background: #d4af37; width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-bold gold-text tracking-tight italic">DECIPHER <span class="text-white not-italic">GM-MASTER PRO</span></h1>
                <p class="text-slate-400 text-sm font-light uppercase tracking-widest">Visual Vision-AI PGN Re-Assembler</p>
            </div>
            <nav class="flex gap-2 p-1 bg-slate-900 rounded-lg">
                <button onclick="switchTab('fragmenter')" id="tab-f" class="px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg">1. Master Loader</button>
                <button onclick="switchTab('reassembler')" id="tab-r" class="px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white">2. AI Re-assembler</button>
            </nav>
        </header>

        <div id="view-fragmenter" class="space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-xs font-bold uppercase text-slate-500">Master PGN Input</label>
                    <div class="text-right">
                        <div id="stats" class="text-[10px] text-slate-400 uppercase tracking-widest">Ready</div>
                        <div class="w-48 h-1 bg-slate-800 mt-1 rounded-full overflow-hidden"><div id="progress-fill"></div></div>
                    </div>
                </div>
                <textarea id="pgn-input" rows="6" class="w-full p-4 rounded-xl text-sm mb-4" placeholder="Paste full, unannotated PGN here to initialize..."></textarea>
                
                <div class="flex flex-wrap gap-3">
                    <button onclick="processPgn()" class="px-6 py-3 bg-white text-black font-bold rounded-xl hover:bg-slate-200 uppercase text-xs">Initialize PGN Structure</button>
                    <button onclick="clearAll()" class="px-6 py-3 bg-red-900/30 text-red-400 rounded-xl font-bold uppercase text-xs">Reset All Data</button>
                </div>
            </div>
        </div>

        <div id="view-reassembler" class="hidden space-y-6">
            <div class="glass p-6 rounded-2xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 1: Paste Screenshot JSON</label>
                        <textarea id="ai-json" rows="14" class="w-full p-4 rounded-xl text-xs" placeholder="Paste the exact JSON from the AI (e.g. { '10. dxc5': 'Annotation...' })"></textarea>
                    </div>
                    <div class="space-y-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Step 2: Stacked Final PGN</label>
                        <textarea id="final-pgn" rows="14" class="w-full p-4 rounded-xl text-xs text-emerald-400" readonly></textarea>
                        <div class="flex gap-2">
                            <button onclick="copyToClipboard('final-pgn')" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase">Copy Final</button>
                            <button onclick="downloadPgn()" class="flex-1 py-3 bg-slate-800 text-xs font-bold rounded-lg uppercase">Download</button>
                        </div>
                    </div>
                </div>
                <button onclick="rebuildPgn()" class="mt-6 w-full py-4 gold-bg rounded-xl font-bold uppercase tracking-widest shadow-lg shadow-yellow-900/20">Inject Batch & Stack to File</button>
            </div>
        </div>
    </div>

    <script>
        let pgnTokens = [];

        window.onload = () => {
            const saved = localStorage.getItem('gm_master_state');
            if (saved) {
                const state = JSON.parse(saved);
                document.getElementById('pgn-input').value = state.original;
                processPgn(true);
            }
            
            // Restore injected tokens if they exist from previous batches
            const savedTokens = localStorage.getItem('gm_injected_tokens');
            if (savedTokens) {
                pgnTokens = JSON.parse(savedTokens);
                document.getElementById('final-pgn').value = pgnTokens.join(" ").replace(/\s+/g, ' ');
            }
        };

        function switchTab(tab) {
            document.getElementById('view-fragmenter').classList.toggle('hidden', tab !== 'fragmenter');
            document.getElementById('view-reassembler').classList.toggle('hidden', tab !== 'reassembler');
            const f = document.getElementById('tab-f');
            const r = document.getElementById('tab-r');
            f.className = tab === 'fragmenter' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
            r.className = tab === 'reassembler' ? 'px-6 py-2 rounded-md font-bold text-xs uppercase gold-bg' : 'px-6 py-2 rounded-md font-bold text-xs uppercase text-slate-400 hover:text-white';
        }

        function processPgn(isLoad = false) {
            const input = document.getElementById('pgn-input').value;
            if (!input) return;

            // Only parse fresh if we haven't already stacked injections on top of it
            if (!localStorage.getItem('gm_injected_tokens')) {
                pgnTokens = input.match(/(\(|\)|\d+\.{1,3}|\[.*?\]|\{.*?\}|\$\d+|[a-zA-Z0-9\-+=#]+[?!]*)/g) || [];
            }
            
            document.getElementById('progress-fill').style.width = "100%";
            document.getElementById('stats').innerText = `PGN STRUCTURE LOADED`;
            
            if (!isLoad) {
                localStorage.setItem('gm_master_state', JSON.stringify({ original: input }));
                alert("PGN Loaded! Switch to Re-assembler to begin injecting JSON batches.");
            }
        }

        function rebuildPgn() {
            const raw = document.getElementById('ai-json').value;
            let aiData = {};
            
            try {
                const jsonMatch = raw.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    aiData = JSON.parse(jsonMatch[0]);
                } else {
                    alert("Could not detect valid JSON. Please check the AI output.");
                    return;
                }
            } catch (e) {
                alert("Error parsing JSON. Ensure the format is strictly { 'move': 'text' }.");
                return;
            }

            // Copy the tokens array so we can inject safely
            let workingTokens = [...pgnTokens];
            
            for (const [aiMoveKey, annotation] of Object.entries(aiData)) {
                // Parse the AI's key (e.g., extracts "13", "..", and "Bxf3")
                const keyMatch = aiMoveKey.match(/^(\d+)(\.+)\s*(.*)$/);
                
                if (!keyMatch) {
                    console.warn(`Skipping invalid move key format: ${aiMoveKey}`);
                    continue;
                }

                const targetNum = parseInt(keyMatch[1]);
                const isBlackTarget = keyMatch[2].includes('..'); 
                const targetMove = keyMatch[3].replace(/[!?]+$/, '').trim();

                let currentNum = 0;
                let isBlackTurn = false;
                let injected = false;

                // Walk through the PGN tokens to find the exact positional match
                for (let i = 0; i < workingTokens.length; i++) {
                    let token = workingTokens[i];

                    // 1. Update move number and turn tracker
                    if (/^\d+\.+$/.test(token)) {
                        currentNum = parseInt(token);
                        isBlackTurn = token.includes('..');
                        continue; 
                    }

                    // 2. Identify if the token is an actual chess move
                    const isMove = (/^[a-zA-Z]/.test(token) || token.startsWith('0-0') || token.startsWith('O-O')) 
                                   && !token.startsWith('{') && !token.startsWith('[');

                    if (isMove) {
                        const cleanToken = token.replace(/[!?]+$/, '');
                        
                        // 3. Match the number, the move string, AND the color (White/Black)
                        if (currentNum === targetNum && cleanToken === targetMove) {
                            if (isBlackTarget === isBlackTurn && !workingTokens[i+1]?.startsWith('{')) {
                                // Inject the annotation!
                                workingTokens[i] += ` { ${annotation} }`;
                                injected = true;
                                break;
                            }
                        }
                        
                        // Flip the turn tracker after a move is processed
                        isBlackTurn = !isBlackTurn; 
                    }
                }
                
                if (!injected) {
                    console.warn(`Missed injection for: ${aiMoveKey}. Move may not exist in PGN or is already annotated.`);
                }
            }

            // Update array state and save to LocalStorage so it stacks permanently
            pgnTokens = workingTokens;
            localStorage.setItem('gm_injected_tokens', JSON.stringify(pgnTokens));

            // Output the final text
            document.getElementById('final-pgn').value = workingTokens.join(" ").replace(/\s+/g, ' ');
            document.getElementById('ai-json').value = ''; // Clear input for the next batch
            alert("Batch successfully injected and saved! Paste the next JSON or copy the Final PGN.");
        }

        function clearAll() {
            localStorage.removeItem('gm_master_state');
            localStorage.removeItem('gm_injected_tokens');
            location.reload();
        }

        function copyToClipboard(id) {
            const val = document.getElementById(id).value;
            navigator.clipboard.writeText(val);
            alert("Copied!");
        }

        function downloadPgn() {
            const val = document.getElementById('final-pgn').value;
            const blob = new Blob([val], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "GM_Variation_Analysis.pgn";
            a.click();
        }
    </script>
</body>
</html>
