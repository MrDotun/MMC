            { fen: "1r5k/1p5p/p4N2/8/8/8/7R/7K w - - 0 1", solution: "Rxh7#", theme: "Anastasia's Mate" },
            { fen: "1k5r/p6p/N7/8/8/8/R7/7K w - - 0 1", solution: "Rxa7#", theme: "Anastasia's Mate" },
            { fen: "8/8/8/8/8/5N2/7p/R6k w - - 0 1", solution: "Rxa1#", theme: "Anastasia's Mate" },
            { fen: "6rk/6pp/7N/8/8/8/8/7K w - - 0 1", solution: "Nf7#", theme: "Smothered Mate" },
            { fen: "k5rr/pp6/N7/8/8/8/8/7K w - - 0 1", solution: "Nc7#", theme: "Smothered Mate" },
            { fen: "8/8/8/K7/8/8/1N1ppp2/3pkp2 w - - 0 1", solution: "Nd3#", theme: "Smothered Mate" },
            { fen: "8/8/8/K7/8/2N5/5ppp/5pkp w - - 0 1", solution: "Ne2#", theme: "Smothered Mate" },
            { fen: "8/8/8/K7/8/p2N4/6pp/6pk w - - 0 1", solution: "Nf2#", theme: "Smothered Mate" },
            { fen: "4k3/3r1r2/8/8/8/8/8/4Q2K w - - 0 1", solution: "Qe8#", theme: "Epaulette Mate" },
            { fen: "3k4/2r1r3/8/8/8/8/8/3Q3K w - - 0 1", solution: "Qd8#", theme: "Epaulette Mate" },
            { fen: "5k2/4r1r1/8/8/8/8/8/5Q2 w - - 0 1", solution: "Qf8#", theme: "Epaulette Mate" },
            { fen: "2k5/1r1r4/8/8/8/8/8/2Q5 w - - 0 1", solution: "Qc8#", theme: "Epaulette Mate" },
            { fen: "1k6/r1r5/8/8/8/8/8/1Q5K w - - 0 1", solution: "Qb8#", theme: "Epaulette Mate" },
            { fen: "3rkr2/8/8/8/8/8/4Q3/4R2K w - - 0 1", solution: "Qe7#", theme: "Swallow's Tail" },
            { fen: "2rkr3/8/8/8/8/8/3Q4/3R3K w - - 0 1", solution: "Qd7#", theme: "Swallow's Tail" },
            { fen: "4rkr1/8/8/8/8/8/5Q2/5R2 w - - 0 1", solution: "Qf7#", theme: "Swallow's Tail" },
            { fen: "8/2rkr3/8/8/8/8/3Q4/3R3K w - - 0 1", solution: "Qd7#", theme: "Swallow's Tail" },
            { fen: "rkr5/8/8/8/8/8/1Q6/1R5K w - - 0 1", solution: "Qb7#", theme: "Swallow's Tail" },
            { fen: "7k/5p1p/5P2/8/8/8/8/6QK w - - 0 1", solution: "Qg7#", theme: "Damiano's Mate" },
            { fen: "k7/p1p5/2P5/8/8/8/8/KQ6 w - - 0 1", solution: "Qb7#", theme: "Damiano's Mate" },
            { fen: "7k/5p1p/5P2/8/8/8/6Q1/7K w - - 0 1", solution: "Qg7#", theme: "Damiano's Mate" },
            { fen: "k7/p1p5/2P5/8/8/1Q6/8/K7 w - - 0 1", solution: "Qb7#", theme: "Damiano's Mate" },
            { fen: "7k/5p1p/5P2/8/7Q/8/8/7K w - - 0 1", solution: "Qxh7#", theme: "Damiano's Mate" },
            { fen: "7k/7p/8/8/8/8/1B6/6R1 w - - 0 1", solution: "Bf6#", theme: "Morphy's Mate" },
            { fen: "k7/p7/8/8/8/8/6B1/1R6 w - - 0 1", solution: "Bc6#", theme: "Morphy's Mate" },
            { fen: "7k/7p/8/8/8/8/8/B5R1 w - - 0 1", solution: "Bf6#", theme: "Morphy's Mate" },
            { fen: "k7/p7/8/8/8/8/8/1R4B1 w - - 0 1", solution: "Bc6#", theme: "Morphy's Mate" },
            { fen: "7k/7p/8/8/8/2B5/8/6R1 w - - 0 1", solution: "Bf6#", theme: "Morphy's Mate" },
            { fen: "7k/5R1p/8/8/8/8/1B6/7K w - - 0 1", solution: "Rf8#", theme: "Pillsbury's Mate" },
            { fen: "k7/p1R5/8/8/8/8/8/K5B1 w - - 0 1", solution: "Rc8#", theme: "Pillsbury's Mate" },
            { fen: "7k/5R1p/8/8/8/8/B7/7K w - - 0 1", solution: "Rf8#", theme: "Pillsbury's Mate" },
            { fen: "k7/p1R5/8/8/8/8/6B1/K7 w - - 0 1", solution: "Rc8#", theme: "Pillsbury's Mate" },
            { fen: "7k/2R4p/8/8/8/8/1B6/7K w - - 0 1", solution: "Rc8#", theme: "Pillsbury's Mate" },
            { fen: "r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 0 1", solution: "Qxf7#", theme: "Scholar's variants" },
            { fen: "rnbqk1nr/pppp1ppp/8/4p3/1bB1P3/5Q2/PPPP1PPP/RNB1K1NR w KQkq - 0 1", solution: "Qxf7#", theme: "Scholar's variants" },
            { fen: "r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR w KQkq - 0 1", solution: "Qxf7#", theme: "Scholar's variants" },
            { fen: "r1bqk1nr/pppp1ppp/2n5/4p3/1bB1P3/2N2Q2/PPPP1PPP/R1B1KBNR w KQkq - 0 1", solution: "Qxf7#", theme: "Scholar's variants" },
            { fen: "rnbqk1nr/pppp1ppp/8/2b1p3/4P3/2N2Q2/PPPP1PPP/R1B1KBNR w KQkq - 0 1", solution: "Qxf7#", theme: "Scholar's variants" },
            { fen: "rnbqkbnr/ppppp2p/8/5pp1/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2", solution: "Qh5#", theme: "Fool's Mate" },
            { fen: "rnbqkbnr/ppppp2p/8/5pp1/3P4/8/PPP1PPPP/RNBQKBNR w KQkq - 0 2", solution: "Qh5#", theme: "Fool's Mate" },
            { fen: "rnbqkbnr/pppp1p1p/8/6p1/4Pp2/8/PPPP2PP/RNBQKBNR w KQkq - 0 3", solution: "Qh5#", theme: "Fool's Mate" },
            { fen: "rn1qkbnr/ppp1pppp/8/8/2B3b1/4PQ2/PP1P1PPP/RNB1K1NR w KQkq - 0 4", solution: "Qxf7#", theme: "Weak Diagonal" },
            { fen: "rnbqkbnr/pppp1ppp/8/4p3/5PP1/8/PPPPP2P/RNBQKBNR b KQkq - 0 2", solution: "Qh4#", theme: "Fool's Mate" }
        ];

        let currentIndex = 0;
        let game = new Chess();
        let board = null;
        let startTime, timerInterval;
        let selectedSquare = null;
        let timePenalty = 0;

        function loadNext() {
            game.load(chessPuzzles[currentIndex].fen);
            board.position(chessPuzzles[currentIndex].fen);
            document.getElementById('pattern-name').textContent = chessPuzzles[currentIndex].theme;
            selectedSquare = null;
            removeHighlights();
        }

        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight-hint highlight-selected');
        }

        // CLICK TO MOVE LOGIC
        function onSquareClick(square) {
            const piece = game.get(square);

            // If a source square is already selected
            if (selectedSquare) {
                const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                
                if (move === null) {
                    // If clicking same side piece, switch selection
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                        removeHighlights();
                        $(`#board .square-${square}`).addClass('highlight-selected');
                    } else {
                        selectedSquare = null;
                        removeHighlights();
                    }
                } else {
                    // Valid Move
                    board.position(game.fen());
                    if (game.in_checkmate()) {
                        currentIndex++;
                        updateUI();
                        if (currentIndex < chessPuzzles.length) {
                            setTimeout(loadNext, 250);
                        } else {
                            completeMission();
                        }
                    } else {
                        game.undo(); // Not mate, snap back
                        selectedSquare = null;
                        removeHighlights();
                    }
                }
            } else {
                // First click: select piece if it belongs to the player
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    $(`#board .square-${square}`).addClass('highlight-selected');
                }
            }
        }

        window.showHint = () => {
            const solution = chessPuzzles[currentIndex].solution;
            // The solution is usually Algebraic (e.g., Rg8#). Let's highlight the piece to move.
            // Simplified: we highlight the correct piece.
            const moves = game.moves({verbose: true});
            const mateMove = moves.find(m => m.san === solution);
            if (mateMove) {
                removeHighlights();
                $(`#board .square-${mateMove.from}`).addClass('highlight-hint');
            }
        };

        window.concede = () => {
            if (confirm("Skip this puzzle? (20 second penalty will be added)")) {
                timePenalty += 20;
                currentIndex++;
                updateUI();
                if (currentIndex < chessPuzzles.length) {
                    loadNext();
                } else {
                    completeMission();
                }
            }
        };

        function updateUI() {
            document.getElementById('counter').textContent = `${currentIndex + 1} / 50`;
            document.getElementById('bar').style.width = `${(currentIndex / 50) * 100}%`;
        }

        window.startMission = () => {
            if (!document.getElementById('student-name').value) return alert("Enter details!");
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            board = Chessboard('board', {
                position: 'start',
                // FIX: Piece Loading from CDN
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            // Handle Clicks
            $('#board').on('click', '.square-55d63', function() {
                const square = $(this).data('square');
                onSquareClick(square);
            });

            loadNext();
            
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const s = Math.floor((Date.now() - startTime) / 1000) + timePenalty;
                document.getElementById('clock').textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
            }, 1000);
        };

        window.completeMission = async () => {
            clearInterval(timerInterval);
            const totalSeconds = Math.floor((Date.now() - startTime) / 1000) + timePenalty;
            
            await addDoc(collection(db, "mission4_results"), {
                name: document.getElementById('student-name').value,
                school: document.getElementById('student-school').value,
                class: document.getElementById('student-class').value,
                seconds: totalSeconds,
                timestamp: serverTimestamp()
            });

            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('leaderboard-screen').classList.remove('hidden');
        };

        const q = query(collection(db, "mission4_results"), orderBy("seconds", "asc"), limit(5));
        onSnapshot(q, (snap) => {
            const list = document.getElementById('list');
            const top = document.getElementById('champion');
            list.innerHTML = "";
            snap.docs.forEach((doc, i) => {
                const d = doc.data();
                const time = `${String(Math.floor(d.seconds/60)).padStart(2,'0')}:${String(d.seconds%60).padStart(2,'0')}`;
                if (i === 0) {
                    top.innerHTML = `
                        <div class="bg-gradient-to-r from-yellow-400 to-yellow-600 p-1 rounded-2xl">
                            <div class="bg-slate-800 p-4 rounded-xl text-center">
                                <p class="text-yellow-400 text-[10px] font-bold uppercase tracking-[0.2em]">All-Time Leader</p>
                                <h2 class="text-2xl font-black text-white">${d.name}</h2>
                                <p class="text-slate-400 text-xs">${d.school} • ${d.class}</p>
                                <p class="text-2xl font-mono text-yellow-500 mt-2">${time}</p>
                            </div>
                        </div>`;
                }
                list.innerHTML += `<div class="flex justify-between p-3 bg-slate-700 rounded-xl mb-2 border-l-4 border-blue-500">
                    <span class="text-sm font-bold text-white">${i+1}. ${d.name}</span>
                    <span class="font-mono text-blue-300">${time}</span>
                </div>`;
            });
        });
    </script>
    <style>
        #board { width: 100%; max-width: 340px; margin: 0 auto; }
        .highlight-selected { background-color: rgba(255, 255, 0, 0.4) !important; }
        .highlight-hint { background-color: rgba(0, 255, 0, 0.5) !important; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-slate-800 rounded-[2rem] shadow-2xl border border-slate-700 overflow-hidden">
        
        <div class="bg-blue-600 p-5 text-center">
            <h1 class="font-black text-xl tracking-tighter uppercase">Mission 4: 50 Mates</h1>
            <p class="text-blue-200 text-[10px] uppercase tracking-widest">Mind Masters Academy</p>
        </div>

        <div id="start-screen" class="p-8 space-y-4">
            <input type="text" id="student-name" placeholder="Full Name" class="w-full p-4 rounded-2xl bg-slate-700 border border-slate-600 text-white outline-none focus:border-blue-500">
            <input type="text" id="student-school" placeholder="School" class="w-full p-4 rounded-2xl bg-slate-700 border border-slate-600 outline-none">
            <input type="text" id="student-class" placeholder="Class" class="w-full p-4 rounded-2xl bg-slate-700 border border-slate-600 outline-none">
            <button onclick="startMission()" class="w-full bg-blue-600 py-5 rounded-2xl font-black text-lg shadow-xl active:scale-95 transition-transform">BEGIN MISSION</button>
        </div>

        <div id="game-screen" class="hidden p-5">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <p id="pattern-name" class="text-blue-400 text-[10px] font-bold uppercase tracking-widest">Arabian Mate</p>
                    <p id="counter" class="text-2xl font-black">1 / 50</p>
                </div>
                <div id="clock" class="text-3xl font-mono font-bold text-yellow-500">00:00</div>
            </div>

            <div class="w-full bg-slate-700 h-2 rounded-full mb-6 overflow-hidden">
                <div id="bar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
            </div>

            <div id="board" class="mb-6 rounded-lg overflow-hidden border-4 border-slate-700"></div>
            
            <div class="flex gap-4">
                <button onclick="showHint()" class="flex-1 bg-slate-700 py-3 rounded-xl text-xs font-bold uppercase tracking-widest border border-slate-600 hover:bg-slate-600">Hint</button>
                <button onclick="concede()" class="flex-1 bg-red-900/40 py-3 rounded-xl text-xs font-bold uppercase tracking-widest border border-red-800/50 hover:bg-red-900/60 text-red-200">Concede</button>
            </div>
        </div>

        <div id="leaderboard-screen" class="hidden p-8 space-y-6">
            <div id="champion"></div>
            <div id="list"></div>
            <button onclick="location.reload()" class="w-full py-4 text-slate-500 text-sm font-bold uppercase tracking-widest hover:text-white transition-colors">Restart Mission</button>
        </div>

    </div>

</body>
</html>
