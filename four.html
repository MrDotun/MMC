<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Masters | Pro Edition</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        
        body { 
            background: radial-gradient(circle at top right, #1e293b, #0f172a); 
            color: #f8fafc; 
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .white-1e1d7 { background-color: #f0d9b5 !important; }
        .black-3c85d { background-color: #b58863 !important; }
        
        /* Highlight for click-to-move */
        .highlight-square { box-shadow: inset 0 0 0 4px rgba(251, 191, 36, 0.9) !important; }
        
        #wrong-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            background: rgba(225, 29, 72, 0.9);
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: 800;
            display: none;
            color: white;
            pointer-events: none;
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-0 md:p-4">

    <div id="auth-screen" class="mt-20 w-full max-w-md glass-panel p-10 rounded-[2rem] shadow-2xl transition-all">
        <div class="text-center mb-10">
            <div class="inline-block p-4 bg-emerald-500/10 rounded-2xl mb-4">
                <i class="fas fa-chess-knight text-4xl text-emerald-500"></i>
            </div>
            <h1 class="text-4xl font-bold tracking-tighter text-white">MIND MASTERS</h1>
            <p class="text-emerald-400 text-xs font-bold uppercase tracking-[0.3em] mt-2">Elite Chess Tactics</p>
        </div>
        
        <div class="space-y-5">
            <input type="text" id="stuName" placeholder="Player Name" class="w-full bg-slate-800/50 border border-white/5 p-4 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/50">
            <select id="stuClass" class="w-full bg-slate-800/50 border border-white/5 p-4 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/50 text-slate-300">
                <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
                <option>Grade 4</option><option>Grade 5</option><option>Grade 6</option>
            </select>
            <input type="password" id="stuPass" placeholder="Access Code" class="w-full bg-slate-800/50 border border-white/5 p-4 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500/50">
            <button id="startBtn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-lg py-5 rounded-xl transition-all">ENTER ARENA</button>
            <p id="errorMsg" class="text-red-400 text-center text-xs hidden font-medium"></p>
        </div>
    </div>

    <div id="game-arena" class="hidden w-full max-w-7xl grid grid-cols-1 xl:grid-cols-12 gap-6 p-2 md:p-6 h-auto">
        <div class="xl:col-span-3 flex flex-col gap-4">
            <div class="glass-panel p-5 rounded-2xl">
                <div class="grid grid-cols-3 gap-3 text-center">
                    <div><p class="text-[9px] text-slate-400 uppercase font-bold">Lives</p><p id="lives" class="text-rose-500 font-bold text-xl">10</p></div>
                    <div><p class="text-[9px] text-slate-400 uppercase font-bold">Hints</p><p id="hints" class="text-amber-400 font-bold text-xl">3</p></div>
                    <div><p class="text-[9px] text-slate-400 uppercase font-bold">Score</p><p id="score" class="text-emerald-400 font-bold text-xl">0</p></div>
                </div>
            </div>
            <div class="flex-1 glass-panel p-5 rounded-2xl overflow-hidden min-h-[200px]">
                <h3 class="text-[10px] font-black text-slate-400 mb-4 uppercase tracking-widest">Global Rankings</h3>
                <div id="leaderboard" class="space-y-2 custom-scroll overflow-y-auto max-h-[250px]"></div>
            </div>
        </div>

        <div class="xl:col-span-6 flex flex-col items-center">
            <div id="board-container" class="w-full max-w-[500px] aspect-square border-[8px] border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative">
                <div id="board" class="w-full h-full"></div>
                <div id="wrong-toast">WRONG MOVE!</div>
            </div>
            <div class="w-full max-w-[500px] mt-6 flex gap-4">
                <button id="hintBtn" class="flex-1 bg-amber-500/10 border border-amber-500/30 text-amber-500 py-3 rounded-xl font-bold text-sm">HINT</button>
                <button id="giveUpBtn" class="flex-1 bg-rose-500/10 border border-rose-500/30 text-rose-500 py-3 rounded-xl font-bold text-sm">GIVE UP</button>
                <button id="nextBtn" class="hidden flex-1 bg-emerald-500 text-slate-950 py-3 rounded-xl font-black text-sm uppercase">Next Puzzle</button>
                <button id="resetBtn" class="bg-slate-800 px-6 py-3 rounded-xl"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div id="moveFeedback" class="mt-4 text-center font-bold text-slate-400 text-sm uppercase h-6"></div>
        </div>

        <div class="xl:col-span-3 glass-panel rounded-2xl flex flex-col overflow-hidden min-h-[400px]">
            <div class="p-4 border-b border-white/5 bg-slate-800/40 text-[10px] font-black uppercase text-emerald-400">Tactics Comms</div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scroll text-sm"></div>
            <div class="p-4 bg-slate-800/30 border-t border-white/5 flex gap-2">
                <input type="text" id="chatInput" placeholder="Message..." class="flex-1 bg-slate-900 border border-white/10 rounded-xl px-4 py-2 text-xs outline-none">
                <button id="sendChat" class="bg-emerald-600 px-4 rounded-xl text-white"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
            authDomain: "assignments-de95a.firebaseapp.com",
            projectId: "assignments-de95a",
            storageBucket: "assignments-de95a.firebasestorage.app",
            messagingSenderId: "1088073398299",
            appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Puzzle Set (Keep your full array here)
        const puzzleSet = [
            { fen: 'r2qkb1r/pp2nppp/3p4/2pNN1B1/2BnP3/3P4/PPP2PPP/R2bK2R w KQkq - 1 0', sol: ['Nf6+', 'gxf6', 'Bxf7#'] },
            { fen: '1rb4r/pkPp3p/1b1P3n/1Q6/N3Pp2/8/P1P3PP/7K w - - 1 0', sol: ['Qd5+', 'Ka6', 'cxb8=N#'] },
            { fen: '4kb1r/p2n1ppp/4q3/4p1B1/4P3/1Q6/PPP2PPP/2KR4 w k - 1 0', sol: ['Qb8+', 'Nxb8', 'Rd8#'] },
            { fen: 'r1b2k1r/ppp1bppp/8/1B1Q4/5q2/2P5/PPP2PPP/R3R1K1 w - - 1 0', sol: ['Qd8+', 'Bxd8', 'Re8#'] },
            { fen: '5rkr/pp2Rp2/1b1p1Pb1/3P2Q1/2n3P1/2p5/P4P2/4R1K1 w - - 1 0', sol: ['Qxg6+', 'fxg6', 'Rg7#'] }
            // ... add the rest of your puzzles here
        ];

        let user = { name: '', class: '', score: 0, lives: 10, hints: 3 };
        let currentIdx = 0, moveStep = 0, board, game, sourceSquare = null;
        let isSolving = false;

        const sounds = {
            move: new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_standard/default/move-self.mp3'),
            wrong: new Audio('https://www.myinstants.com/media/sounds/wrong-answer-126515.mp3'),
            success: new Audio('https://www.myinstants.com/media/sounds/level-up-188970.mp3')
        };

        $('#startBtn').on('click', () => {
            const name = $('#stuName').val().trim();
            if(!name) return alert("Enter your name");
            user.name = name;
            $('#auth-screen').fadeOut(300, () => {
                $('#game-arena').removeClass('hidden').addClass('grid');
                initGame();
            });
        });

        function initGame() {
            board = Chessboard('board', {
                draggable: false, // Click to move only
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            loadPuzzle(0);
            syncChat();
            syncLeaderboard();
            attachClickEvents();
        }

        function loadPuzzle(idx) {
            if(idx >= puzzleSet.length) {
                $('#moveFeedback').text("👑 CAMPAIGN COMPLETE!");
                return;
            }
            currentIdx = idx;
            moveStep = 0;
            isSolving = false;
            sourceSquare = null;
            
            game = new Chess(puzzleSet[idx].fen);
            board.position(puzzleSet[idx].fen);
            
            $('#nextBtn').addClass('hidden');
            $('#giveUpBtn, #hintBtn').prop('disabled', false).removeClass('opacity-50');
            $('#moveFeedback').text("YOUR MOVE").removeClass('text-rose-400 text-emerald-400');
            $('.square-55d63').removeClass('highlight-square');
            updateUI();
        }

        function handleSquareClick(sq) {
            if(isSolving || $('#nextBtn').is(':visible')) return;

            const piece = game.get(sq);

            if (!sourceSquare) {
                // First click: Select piece
                if (piece && piece.color === game.turn()) {
                    sourceSquare = sq;
                    $(`.square-${sq}`).addClass('highlight-square');
                }
            } else {
                // Second click: Try move
                const moveAttempt = { from: sourceSquare, to: sq, promotion: 'q' };
                const sol = puzzleSet[currentIdx].sol;
                
                // Validate move against logic engine
                const move = game.move(moveAttempt);
                $('.square-55d63').removeClass('highlight-square');

                if (!move || move.san !== sol[moveStep]) {
                    if (move) game.undo(); // Undo illegal puzzle move in engine
                    showWrongMove();
                    sourceSquare = null;
                    return;
                }

                // Correct Move
                board.position(game.fen());
                sounds.move.play();
                moveStep++;
                sourceSquare = null;

                if (moveStep === sol.length) {
                    puzzleComplete();
                } else {
                    // Bot Move
                    setTimeout(() => {
                        game.move(sol[moveStep]);
                        board.position(game.fen());
                        sounds.move.play();
                        moveStep++;
                        if(moveStep === sol.length) puzzleComplete();
                    }, 600);
                }
            }
        }

        function showWrongMove() {
            sounds.wrong.play();
            user.lives--;
            $('#wrong-toast').stop().fadeIn(100).delay(600).fadeOut(200);
            updateUI();
            if(user.lives <= 0) {
                alert("OUT OF LIVES! Restarting arena.");
                user.lives = 10; user.score = 0; loadPuzzle(0);
            }
        }

        function puzzleComplete() {
            sounds.success.play();
            user.score += 10;
            $('#moveFeedback').text("MISSION SUCCESS!").addClass('text-emerald-400');
            $('#nextBtn').removeClass('hidden');
            $('#giveUpBtn, #hintBtn').addClass('opacity-50').prop('disabled', true);
            db.collection('students').doc(user.name).set({ 
                name: user.name, score: user.score, class: $('#stuClass').val() 
            }, {merge: true});
            updateUI();
        }

        function attachClickEvents() {
            $(document).on('click', '.square-55d63', function() {
                const sq = $(this).data('square');
                handleSquareClick(sq);
            });
        }

        $('#giveUpBtn').on('click', async function() {
            isSolving = true;
            user.lives--;
            updateUI();
            $(this).prop('disabled', true).addClass('opacity-50');
            
            const sol = puzzleSet[currentIdx].sol;
            // Reset to puzzle start FEN to show solution correctly
            game = new Chess(puzzleSet[currentIdx].fen);
            board.position(puzzleSet[currentIdx].fen);
            moveStep = 0;

            for (let i = 0; i < sol.length; i++) {
                await new Promise(r => setTimeout(r, 1000));
                game.move(sol[i]);
                board.position(game.fen());
                sounds.move.play();
            }
            $('#nextBtn').removeClass('hidden');
        });

        $('#nextBtn').on('click', () => loadPuzzle(currentIdx + 1));
        $('#resetBtn').on('click', () => loadPuzzle(currentIdx));
        $('#hintBtn').on('click', () => {
            if(user.hints > 0) {
                user.hints--;
                $('#moveFeedback').text("TRY: " + puzzleSet[currentIdx].sol[moveStep]);
                updateUI();
            }
        });

        function updateUI() {
            $('#lives').text(user.lives);
            $('#score').text(user.score);
            $('#hints').text(user.hints);
        }

        function syncChat() {
            db.collection('chat').orderBy('time', 'desc').limit(15).onSnapshot(snap => {
                $('#chat-messages').empty();
                snap.docs.reverse().forEach(doc => {
                    const m = doc.data();
                    $('#chat-messages').append(`<div class="bg-slate-800/40 p-2 rounded-lg border border-white/5"><span class="text-emerald-400 font-bold text-[8px] uppercase">${m.name}</span><p class="text-slate-300 text-xs">${m.text}</p></div>`);
                });
            });
        }

        $('#sendChat').on('click', () => {
            const text = $('#chatInput').val().trim();
            if(text) db.collection('chat').add({ 
                name: user.name, text, time: firebase.firestore.FieldValue.serverTimestamp() 
            });
            $('#chatInput').val('');
        });

        function syncLeaderboard() {
            db.collection('students').orderBy('score', 'desc').onSnapshot(snap => {
                $('#leaderboard').empty();
                snap.forEach(doc => {
                    const s = doc.data();
                    $('#leaderboard').append(`<div class="flex justify-between text-xs p-2 bg-slate-800/30 rounded-lg"><span>${s.name}</span><span class="text-emerald-400 font-bold">${s.score}</span></div>`);
                });
            });
        }
    </script>
</body>
</html>
