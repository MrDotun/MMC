        body { 
            background: radial-gradient(circle at top right, #1e293b, #0f172a); 
            color: #f8fafc; 
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        /* Enhanced Glassmorphism */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Modern Board Colors */
        .white-1e1d7 { background-color: #f1f5f9 !important; color: #64748b !important; }
        .black-3c85d { background-color: #10b981 !important; color: #ecfdf5 !important; }
        
        .highlight-square { box-shadow: inset 0 0 0 4px rgba(251, 191, 36, 0.9); }
        
        @keyframes pulse-gold { 0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(251, 191, 36, 0); } 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); } }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Smooth transitions */
        .transition-all { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

            move: new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_standard/default/move-self.mp3'),
            wrong: new Audio('https://www.myinstants.com/media/sounds/wrong-answer-126515.mp3'),
            success: new Audio('https://www.myinstants.com/media/sounds/level-up-188970.mp3')
        };

        // --- AUTH & LAUNCH FIX ---
        $('#startBtn').on('click', async () => {
            const name = $('#stuName').val().trim();
            const pass = $('#stuPass').val().trim();
            if(!name || !pass) {
                $('#errorMsg').text("Enter Name and Access Code").removeClass('hidden');
                return;
            }

            // Visual feedback for clicking
            const originalBtnText = $('#startBtn').html();
            $('#startBtn').html('<i class="fas fa-circle-notch animate-spin"></i> INITIALIZING...');

            try {
                // Fetch data, but don't block forever
                const snap = await db.collection('students').doc(name).get();
                if(snap.exists() && snap.data().password !== pass) {
                    $('#errorMsg').text("ACCESS DENIED: Credentials Invalid").removeClass('hidden');
                    $('#startBtn').html(originalBtnText);
                    return;
                }
                if(!snap.exists()) {
                    await db.collection('students').doc(name).set({ name, password: pass, class: $('#stuClass').val(), score: 0 });
                }
            } catch (err) {
                console.warn("Connection slow. Launching in Local Mode.");
            }

            user.name = name; 
            user.class = $('#stuClass').val();
            launchGame();
        });

        function launchGame() {
            $('#auth-screen').fadeOut(300, () => {
                $('#game-arena').removeClass('hidden').addClass('grid');
                setTimeout(() => {
                    initBoard();
                    syncChat();
                    syncLeaderboard();
                }, 50); // Timeout ensures container is ready for board dimensions
            });
        }

        function initBoard() {
            game = new Chess();
            loadPuzzle(0);
        }

        function loadPuzzle(idx) {
            if(idx >= puzzleSet.length) {
                $('#moveFeedback').text("👑 CAMPAIGN COMPLETE: LEGENDARY STATUS").addClass('text-emerald-400');
                return;
            }
            const p = puzzleSet[idx];
            game.load(p.fen);
            moveStep = 0; sourceSquare = null;
            
            board = Chessboard('board', {
                draggable: true,
                position: p.fen,
                onDrop: handleUserMove,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            updateUI();
            $('#moveFeedback').text("WHITE TO MOVE • MATE IN 2").removeClass('text-rose-400 text-emerald-400');
            attachClickToMove();
        }

        function handleUserMove(source, target) {
            const sol = puzzleSet[currentIdx].sol;
            const validMoves = game.moves({ square: source, verbose: true });
            const move = validMoves.find(m => m.to === target);

            if(!move || move.san !== sol[moveStep]) {
                sounds.wrong.play();
                user.lives--;
                $('#board-container').addClass('border-rose-500');
                setTimeout(() => $('#board-container').removeClass('border-rose-500'), 500);
                if(user.lives <= 0) restartProgress();
                updateUI();
                return 'snapback';
            }

            game.move(move.san);
            sounds.move.play();
            moveStep++;

            if(moveStep === sol.length) {
                sounds.success.play();
                user.score += 10;
                $('#board-container').addClass('border-emerald-400 shadow-emerald-500/50');
                try { db.collection('students').doc(user.name).update({ score: user.score }); } catch(e){}
                
                setTimeout(() => {
                    $('#board-container').removeClass('border-emerald-400 shadow-emerald-500/50');
                    currentIdx++;
                    loadPuzzle(currentIdx);
                }, 1200);
            } else {
                setTimeout(() => {
                    game.move(sol[moveStep]);
                    board.position(game.fen());
                    moveStep++;
                }, 600);
            }
        }

        function attachClickToMove() {
            $('.square-55d63').off('click').on('click', function() {
                const sq = $(this).data('square');
                const piece = game.get(sq);

                if(!sourceSquare) {
                    if(piece && piece.color === 'w') {
                        sourceSquare = sq;
                        $(this).addClass('highlight-square');
                    }
                } else {
                    const result = handleUserMove(sourceSquare, sq);
                    if(result !== 'snapback') board.position(game.fen());
                    $('.square-55d63').removeClass('highlight-square');
                    sourceSquare = null;
                }
            });
        }

        function updateUI() {
            $('#lives').text(user.lives);
            $('#score').text(user.score);
            $('#hints').text(user.hints);
        }

        function restartProgress() {
            alert("OPERATIONAL FAILURE! Starting over...");
            user.lives = 10; user.score = 0; currentIdx = 0;
            try { db.collection('students').doc(user.name).update({ score: 0 }); } catch(e){}
            loadPuzzle(0);
        }

        function syncChat() {
            try {
                db.collection('chat').orderBy('time', 'desc').limit(20).onSnapshot(snap => {
                    $('#chat-messages').empty();
                    snap.forEach(doc => {
                        const m = doc.data();
                        $('#chat-messages').prepend(`
                            <div class="bg-slate-800/40 p-3 rounded-xl border border-white/5">
                                <span class="text-emerald-400 font-black text-[9px] uppercase tracking-wider">${m.name}</span>
                                <p class="text-slate-300 leading-tight mt-1 text-xs">${m.text}</p>
                            </div>
                        `);
                    });
                    const chat = document.getElementById('chat-messages');
                    chat.scrollTop = chat.scrollHeight;
                });
            } catch(e) {}
        }

        $('#sendChat').on('click', () => {
            const text = $('#chatInput').val().trim();
            if(!text) return;
            try {
                db.collection('chat').add({ name: user.name, text, time: firebase.firestore.FieldValue.serverTimestamp() });
            } catch(e) {}
            $('#chatInput').val('');
        });

        function syncLeaderboard() {
            try {
                db.collection('students').orderBy('score', 'desc').onSnapshot(snap => {
                    $('#leaderboard').empty();
                    let rank = 1;
                    snap.forEach(doc => {
                        const s = doc.data();
                        $('#leaderboard').append(`
                            <div class="flex justify-between items-center p-3 rounded-xl transition-all ${s.name === user.name ? 'bg-emerald-500/20 border border-emerald-500/30' : 'bg-slate-800/30 border border-white/5'}">
                                <span class="text-xs font-medium"><span class="text-slate-500 mr-2 font-bold">${rank++}</span>${s.name}</span>
                                <span class="text-xs font-black text-emerald-400">${s.score}</span>
                            </div>
                        `);
                    });
                });
            } catch(e) {}
        }

        $('#hintBtn').on('click', () => {
            if(user.hints > 0) {
                user.hints--;
                const sol = puzzleSet[currentIdx].sol[moveStep];
                $('#moveFeedback').text(`TACTICAL TIP: LOOK AT ${sol.slice(-2).toUpperCase()}`).addClass('text-amber-400');
                updateUI();
            }
        });

        $('#resetBtn').on('click', () => loadPuzzle(currentIdx));
    </script>
</body>
</html>
