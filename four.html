<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mission 4: 50 Mates | Mind Masters</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
            authDomain: "assignments-de95a.firebaseapp.com",
            projectId: "assignments-de95a",
            storageBucket: "assignments-de95a.firebasestorage.app",
            messagingSenderId: "1088073398299",
            appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let chessPuzzles = [];
        let currentIndex = 0;
        let game = new Chess();
        let board = null;
        let startTime, timerInterval;
        let selectedSquare = null;
        let timePenalty = 0;

        // LOAD DATA FROM VERIFIED LICHESS JSON
        async function loadVerifiedPuzzles() {
            const btn = document.getElementById('start-btn');
            try {
                const response = await fetch('https://raw.githubusercontent.com/pheyre/lichess-puzzles-json/master/puzzles.json');
                const allData = await response.json();
                const mateIn1 = allData.filter(p => p.themes.includes('mateIn1'));
                chessPuzzles = mateIn1.sort(() => 0.5 - Math.random()).slice(0, 50);
                
                btn.disabled = false;
                btn.innerText = "BEGIN MISSION";
                btn.classList.replace('bg-slate-600', 'bg-blue-600');
            } catch (error) {
                console.error("Data fetch failed:", error);
                btn.innerText = "Error Loading Puzzles";
            }
        }

        function onSquareClick(square) {
            const piece = game.get(square);
            if (selectedSquare) {
                const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move === null) {
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                        removeHighlights();
                        $(`#board .square-${square}`).addClass('highlight-selected');
                    } else {
                        selectedSquare = null;
                        removeHighlights();
                    }
                } else {
                    if (game.in_checkmate()) {
                        board.position(game.fen());
                        currentIndex++;
                        updateUI();
                        if (currentIndex < chessPuzzles.length) setTimeout(loadNext, 400);
                        else completeMission();
                    } else {
                        game.undo();
                        selectedSquare = null;
                        removeHighlights();
                    }
                }
            } else {
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    $(`#board .square-${square}`).addClass('highlight-selected');
                }
            }
        }

        function loadNext() {
            game.load(chessPuzzles[currentIndex].fen);
            board.position(chessPuzzles[currentIndex].fen);
            selectedSquare = null;
            removeHighlights();
        }

        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight-hint highlight-selected');
        }

        function updateUI() {
            document.getElementById('counter').textContent = `${currentIndex + 1} / 50`;
            document.getElementById('bar').style.width = `${(currentIndex / 50) * 100}%`;
        }

        window.startMission = () => {
            if (!document.getElementById('student-name').value) return alert("Enter your name!");
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            board = Chessboard('board', {
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            $('#board').on('click', '.square-55d63', function() {
                onSquareClick($(this).data('square'));
            });

            loadNext();
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const s = Math.floor((Date.now() - startTime) / 1000) + timePenalty;
                document.getElementById('clock').textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
            }, 1000);
        };

        window.showHint = () => {
            const moves = game.moves({verbose: true});
            const mateMove = moves.find(m => {
                game.move(m);
                const isMate = game.in_checkmate();
                game.undo();
                return isMate;
            });
            if (mateMove) {
                removeHighlights();
                $(`#board .square-${mateMove.from}`).addClass('highlight-hint');
            }
        };

        window.concede = () => {
            if (confirm("Skip? (+20s penalty)")) {
                timePenalty += 20;
                currentIndex++;
                updateUI();
                if (currentIndex < chessPuzzles.length) loadNext();
                else completeMission();
            }
        };

        window.completeMission = async () => {
            clearInterval(timerInterval);
            const finalTime = Math.floor((Date.now() - startTime) / 1000) + timePenalty;
            await addDoc(collection(db, "mission4_results"), {
                name: document.getElementById('student-name').value,
                school: document.getElementById('student-school').value,
                class: document.getElementById('student-class').value,
                seconds: finalTime,
                timestamp: serverTimestamp()
            });
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('leaderboard-screen').classList.remove('hidden');
        };

        // Leaderboard Listener
        const q = query(collection(db, "mission4_results"), orderBy("seconds", "asc"), limit(5));
        onSnapshot(q, (snap) => {
            const list = document.getElementById('list');
            list.innerHTML = "";
            snap.docs.forEach((doc, i) => {
                const d = doc.data();
                list.innerHTML += `<div class="flex justify-between p-3 bg-slate-700 rounded-xl mb-2 text-white border-l-4 border-blue-500">
                    <span>${i+1}. ${d.name}</span>
                    <span class="font-mono text-blue-300">${d.seconds}s</span>
                </div>`;
            });
        });

        loadVerifiedPuzzles();
    </script>

    <style>
        #board { width: 100%; max-width: 340px; margin: 0 auto; }
        .highlight-selected { background-color: rgba(255, 255, 0, 0.4) !important; }
        .highlight-hint { background-color: rgba(0, 255, 0, 0.5) !important; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-[2rem] shadow-2xl border border-slate-700 overflow-hidden">
        <div class="bg-blue-600 p-5 text-center">
            <h1 class="font-black text-xl uppercase tracking-tighter">Mission 4: 50 Mates</h1>
            <p class="text-blue-200 text-[10px] uppercase tracking-widest">Mind Masters Academy</p>
        </div>

        <div id="start-screen" class="p-8 space-y-4">
            <input type="text" id="student-name" placeholder="Full Name" class="w-full p-4 rounded-2xl bg-slate-700 border border-slate-600 text-white outline-none">
            <input type="text" id="student-school" placeholder="School" class="w-full p-4 rounded-2xl bg-slate-700 border border-slate-600 outline-none">
            <input type="text" id="student-class" placeholder="Class" class="w-full p-4 rounded-2xl bg-slate-700 border border-slate-600 outline-none">
            <button id="start-btn" disabled onclick="startMission()" class="w-full bg-slate-600 py-5 rounded-2xl font-black text-lg shadow-xl text-white">
                LOADING MISSION...
            </button>
        </div>

        <div id="game-screen" class="hidden p-5">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <p class="text-blue-400 text-[10px] font-bold uppercase tracking-widest">Mission Progress</p>
                    <p id="counter" class="text-2xl font-black">1 / 50</p>
                </div>
                <div id="clock" class="text-3xl font-mono font-bold text-yellow-500">00:00</div>
            </div>
            <div class="w-full bg-slate-700 h-2 rounded-full mb-6 overflow-hidden">
                <div id="bar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
            </div>
            <div id="board" class="mb-6 rounded-lg overflow-hidden border-4 border-slate-700"></div>
            <div class="flex gap-4">
                <button onclick="showHint()" class="flex-1 bg-slate-700 py-3 rounded-xl text-xs font-bold uppercase">Hint</button>
                <button onclick="concede()" class="flex-1 bg-red-900/40 py-3 rounded-xl text-xs font-bold uppercase text-red-200">Concede</button>
            </div>
        </div>

        <div id="leaderboard-screen" class="hidden p-8">
            <h2 class="text-xl font-black mb-4 text-center">TOP ACADEMY TIMES</h2>
            <div id="list"></div>
            <button onclick="location.reload()" class="w-full py-4 text-slate-500 text-sm font-bold uppercase tracking-widest hover:text-white">Restart Mission</button>
        </div>
    </div>

</body>
</html>
