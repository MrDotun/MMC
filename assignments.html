<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play against Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body, html {
            margin: 0; 
            padding: 0;
            min-height: 100%; 
            width: 100%;
            overflow-y: auto; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start;
            background-color: #1a1a2e;
        }

        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: white;
            text-align: center;
        }
        .login-card {
            background: #2D1B4D;
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #4ade80;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #4ade80;
            background: #1a1a2e;
            color: white;
            box-sizing: border-box;
        }

        #leaderboard-box {
            margin-top: 20px;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            max-height: 200px; 
            overflow-y: auto;
            border: 1px solid #4ade8044;
            position: relative;
        }
        #leaderboard-box h3 { font-size: 0.9em; margin: 0 0 5px 0; color: #facc15; text-align: center; cursor: pointer; }
        #leaderboardList { list-style: none; padding: 0; margin: 0; font-size: 0.85em; color: #4ade80; }
        #leaderboardList li { border-bottom: 1px solid #ffffff11; padding: 3px 0; }

        .admin-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
        }
        .refresh-btn {
            background: none;
            border: 1px solid #4ade80;
            color: #4ade80;
            border-radius: 4px;
            font-size: 0.7em;
            cursor: pointer;
            padding: 2px 8px;
        }
        .refresh-btn:hover { background: #4ade8022; }

        #game-container {
            display: none; 
            width: 95vmin; 
            max-width: 550px;
            text-align: center;
            padding: 20px 10px;
        }

        #board { 
            width: 100%; 
            margin-bottom: 15px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .info-panel {
            background: #2D1B4D; 
            padding: 20px;
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #4ade80;
            color: white;
        }
        h2 { margin: 0 0 10px 0; color: #4ade80; font-size: 1.4em; }
        .grade { font-size: 1.3em; font-weight: bold; color: #4ade80; }
        
        .submit-btn {
            background-color: #4ade80;
            color: #1a1a2e;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(74, 222, 128, 0.2);
        }
        .submit-btn:hover {
            background-color: #22c55e;
            transform: translateY(-2px);
        }

        .highlight-white { background-color: #f6f669 !important; }
        .highlight-black { background-color: #e6e600 !important; }
        
        #remark { 
            font-style: italic; 
            color: #ff4d4d; 
            min-height: 1.5em; 
            display: block; 
            margin: 10px 0; 
            font-weight: bold;
        }
        #status { font-weight: bold; color: #cbd5e1; }
        .danger-text { color: #ff4d4d !important; text-shadow: 0 0 5px rgba(255, 77, 77, 0.5); }
        .super-gm { color: #facc15 !important; text-shadow: 0 0 10px #facc15; font-size: 1.5em; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80;">Week One Task</h1>
        <p>Welcome, Chess Champion! Please enter your details to start the match.</p>
        <input type="text" id="studentName" placeholder="Enter Your Full Name" required>
        <input type="text" id="studentClass" placeholder="Enter Your Class" required>
        <button class="submit-btn" onclick="startGame()">START GAME</button>

        <div id="leaderboard-box">
            <h3 ondblclick="adminResetLeaderboard()">🏆 Hall of Grandmasters</h3>
            <div class="admin-controls">
                <button class="refresh-btn" onclick="manualRefresh()">🔄 Refresh</button>
            </div>
            <ul id="leaderboardList"><li>Loading...</li></ul>
        </div>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h2 id="welcome-msg">Match: <span id="displayName">Player</span> vs Mr. Dotun</h2>
        <div id="board"></div>
        <p id="remark">"If you don't win, I'll be disappointed"</p>
        <p>Your Grade: <span id="grade" class="grade">Beginner</span></p>
        <p id="status">Your turn! Click a piece to select it.</p>
        
        <hr style="border: 0; border-top: 1px solid #4ade80; margin: 20px 0; opacity: 0.3;">
        
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfduqoEyvRko9-TM2T1SU0WVkr2vCdg2sFPZUTtQLOwSnJbBA/viewform" class="submit-btn">SUBMIT TO MR. DOTUN</a>
    </div>
</div>

<script>
    // --- FIREBASE INTEGRATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
      authDomain: "assignments-de95a.firebaseapp.com",
      projectId: "assignments-de95a",
      storageBucket: "assignments-de95a.firebasestorage.app",
      messagingSenderId: "1088073398299",
      appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    var currentName = "";
    var currentClass = "";
    var hasSavedWin = false;

    const dotunRemarks = [
        "If you don't win, I'll be disappointed",
        "Is that the best you can do?",
        "I've seen beginners play better than that.",
        "Your king looks very exposed right now.",
        "Are you sure you want to make that move?",
        "Don't cry when you lose!",
        "Focus! Chess is a game of the mind.",
        "I'm almost feeling sorry for you.",
        "Nice try, but not good enough.",
        "Checkmate is coming soon, I can feel it."
    ];

    const funnyIllegalRemarks = [
        "That's an illegal move... Did you forget how the pieces move?",
        "Even my grandma moves faster than that piece just tried to!",
        "Nice try! But pieces don't have wings to fly there.",
        "You're playing Chess, not Checkers!",
        "I saw that! You can't just jump over the whole board!"
    ];

    const checkRemarks = [
        "Your King is in check! Save your King before he takes a nap!",
        "Red alert! The King needs a hero!",
        "You can't leave your boss in trouble!",
        "Even a King needs protection sometimes!"
    ];

    function subscribeToLeaderboard() {
        return db.collection("grandmasters").orderBy("timestamp", "desc").limit(100)
          .onSnapshot((snapshot) => {
            const list = document.getElementById('leaderboardList');
            list.innerHTML = "";
            if (snapshot.empty) list.innerHTML = "<li>No Grandmasters yet.</li>";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement('li');
                const title = data.rank === "Super Grandmaster" ? "💎" : "👑";
                li.textContent = `${title} ${data.name} (${data.class})`;
                list.prepend(li);
            });
        });
    }

    let unsubscribe = subscribeToLeaderboard();
    function manualRefresh() { unsubscribe(); unsubscribe = subscribeToLeaderboard(); }
    function adminResetLeaderboard() {
        const pass = prompt("Enter Admin Password:");
        if (pass === "dotun123") {
            db.collection("grandmasters").get().then((s) => s.forEach((d) => d.ref.delete()));
            alert("Cleared.");
        }
    }

    function startGame() {
        currentName = document.getElementById('studentName').value;
        currentClass = document.getElementById('studentClass').value;
        if (!currentName.trim() || !currentClass.trim()) return alert("Enter details!");
        document.getElementById('displayName').textContent = currentName;
        document.getElementById('welcome-overlay').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        board.resize();
    }

    var board = null, game = new Chess(), sourceSquare = null;
    var $status = $('#status'), $grade = $('#grade'), $remark = $('#remark');

    const weights = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

    function evaluateBoard(g) {
        let total = 0;
        const b = g.board();
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                let piece = b[i][j];
                if (piece) {
                    let val = weights[piece.type];
                    total += (piece.color === 'w' ? -val : val);
                }
            }
        }
        return total;
    }

    // Minimax focusing on immediate trade safety
    function minimax(g, depth, alpha, beta, isMax) {
        if (depth === 0 || g.game_over()) return evaluateBoard(g);
        let moves = g.moves();
        if (isMax) {
            let best = -Infinity;
            for (let m of moves) {
                g.move(m);
                best = Math.max(best, minimax(g, depth-1, alpha, beta, false));
                g.undo(); alpha = Math.max(alpha, best);
                if (beta <= alpha) break;
            }
            return best;
        } else {
            let best = Infinity;
            for (let m of moves) {
                g.move(m);
                best = Math.min(best, minimax(g, depth-1, alpha, beta, true));
                g.undo(); beta = Math.min(beta, best);
                if (beta <= alpha) break;
            }
            return best;
        }
    }

    function makeAIMove() {
        if (game.game_over()) return;
        
        setTimeout(() => {
            let moves = game.moves({ verbose: true });
            let bestMove = null;
            let bestValue = -Infinity;

            // PREVENT LOSE PIECES: Look for captures and safe squares
            for (let mObj of moves) {
                game.move(mObj.san);
                
                // Static Penalty if the move leaves ANY piece hanging to your next turn
                let safetyScore = 0;
                let opponentMoves = game.moves({ verbose: true });
                for (let opM of opponentMoves) {
                    if (opM.captured) {
                        // Massive penalty if we just moved a piece into a death trap
                        if (opM.to === mObj.to) safetyScore -= (weights[mObj.piece] * 2);
                        // Penalty for leaving other pieces hanging
                        else safetyScore -= (weights[opM.captured] * 0.5);
                    }
                }

                let boardVal = minimax(game, 2, -100000, 100000, false) + safetyScore;
                
                // Aggression: Prefer winning trades
                if (mObj.captured) boardVal += weights[mObj.captured];

                game.undo();

                if (boardVal > bestValue) {
                    bestValue = boardVal;
                    bestMove = mObj.san;
                }
            }

            game.move(bestMove || moves[0].san);
            board.position(game.fen());
            updateStatus();
        }, 250);
    }

    function updateStatus() {
        var history = game.history();
        var histText = "<br><small>History: " + history.slice(-6).join(' ') + "</small>";
        if (game.in_checkmate()) {
            $status.html(game.turn() === 'b' ? "Incredible! You beat Mr. Dotun!" : "Game Over! Mr. Dotun wins.");
            if (game.turn() === 'b') updateGrade(true);
        } else {
            $status.html("Mr. Dotun moved. Your turn!" + histText);
            $remark.text('"' + dotunRemarks[Math.floor(Math.random() * dotunRemarks.length)] + '"');
        }
    }

    var totalScore = 0;
    function updateGrade(isWin = false) {
        let finalRank = "Beginner";
        if (isWin) finalRank = "Grandmaster";
        $grade.text(finalRank);
        if (isWin && !hasSavedWin && currentName) {
            db.collection("grandmasters").add({
                name: currentName, class: currentClass, rank: finalRank, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            hasSavedWin = true;
        }
    }

    function onSquareClick(square) {
        if (game.game_over() || game.turn() === 'b') return;

        if (sourceSquare === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            }
            return;
        }
        
        var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
        
        if (move === null) {
            let msg = game.in_check() ? checkRemarks : funnyIllegalRemarks;
            $status.html("<span class='danger-text'>Illegal move!</span>");
            $remark.text(msg[Math.floor(Math.random() * msg.length)]);
            sourceSquare = null;
            removeHighlights();
            return;
        }
        
        board.position(game.fen());
        sourceSquare = null;
        removeHighlights();
        
        if (move.captured) totalScore += 10;
        updateGrade();

        if (!game.game_over()) {
            $status.html("Mr. Dotun is thinking...");
            makeAIMove();
        } else {
            updateStatus();
        }
    }

    function addHighlight(s) { $('#board .square-' + s).addClass('highlight-white'); }
    function removeHighlights() { $('#board [class*="square-"]').removeClass('highlight-white'); }

    board = ChessBoard('board', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
    $('#board').on('click', '[class*="square-"]', function() { onSquareClick($(this).attr('data-square')); });
    $(window).resize(board.resize);
</script>
</body>
</html>
