<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play against Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body, html {
            margin: 0; 
            padding: 0;
            min-height: 100%; 
            width: 100%;
            overflow-y: auto; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start;
            background-color: #1a1a2e;
        }

        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: white;
            text-align: center;
        }
        .login-card {
            background: #2D1B4D;
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #4ade80;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #4ade80;
            background: #1a1a2e;
            color: white;
            box-sizing: border-box;
        }

        #leaderboard-box {
            margin-top: 20px;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            max-height: 200px; /* Increased slightly for 100 entries */
            overflow-y: auto;
            border: 1px solid #4ade8044;
            position: relative;
        }
        #leaderboard-box h3 { font-size: 0.9em; margin: 0 0 5px 0; color: #facc15; text-align: center; cursor: pointer; }
        #leaderboardList { list-style: none; padding: 0; margin: 0; font-size: 0.85em; color: #4ade80; }
        #leaderboardList li { border-bottom: 1px solid #ffffff11; padding: 3px 0; }

        .admin-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
        }
        .refresh-btn {
            background: none;
            border: 1px solid #4ade80;
            color: #4ade80;
            border-radius: 4px;
            font-size: 0.7em;
            cursor: pointer;
            padding: 2px 8px;
        }
        .refresh-btn:hover { background: #4ade8022; }

        #game-container {
            display: none; 
            width: 95vmin; 
            max-width: 550px;
            text-align: center;
            padding: 20px 10px;
        }

        #board { 
            width: 100%; 
            margin-bottom: 15px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .info-panel {
            background: #2D1B4D; 
            padding: 20px;
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #4ade80;
            color: white;
        }
        h2 { margin: 0 0 10px 0; color: #4ade80; font-size: 1.4em; }
        .grade { font-size: 1.3em; font-weight: bold; color: #4ade80; }
        
        .submit-btn {
            background-color: #4ade80;
            color: #1a1a2e;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(74, 222, 128, 0.2);
        }
        .submit-btn:hover {
            background-color: #22c55e;
            transform: translateY(-2px);
        }

        .highlight-white { background-color: #f6f669 !important; }
        .highlight-black { background-color: #e6e600 !important; }
        .white-1e1d7 { background-color: #ebecd0 !important; }
        .black-3c85d { background-color: #779556 !important; }
        
        #remark { 
            font-style: italic; 
            color: #facc15; 
            min-height: 1.5em; 
            display: block; 
            margin: 10px 0; 
            font-weight: 500;
        }
        #status { font-weight: bold; color: #cbd5e1; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80;">Week One Task</h1>
        <p>Welcome, Chess Champion! Please enter your details to start the match.</p>
        <input type="text" id="studentName" placeholder="Enter Your Full Name" required>
        <input type="text" id="studentClass" placeholder="Enter Your Class" required>
        <button class="submit-btn" onclick="startGame()">START GAME</button>

        <div id="leaderboard-box">
            <h3 ondblclick="adminResetLeaderboard()">🏆 Hall of Grandmasters</h3>
            <div class="admin-controls">
                <button class="refresh-btn" onclick="manualRefresh()">↻ Refresh</button>
            </div>
            <ul id="leaderboardList"><li>Loading...</li></ul>
        </div>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h2 id="welcome-msg">Playing against: <strong>Mr. Dotun</strong></h2>
        <div id="board"></div>
        <p id="remark">"If you don't win, I'll be disappointed"</p>
        <p>Your Grade: <span id="grade" class="grade">Beginner</span></p>
        <p id="status">Your turn! Click a piece to select it.</p>
        
        <hr style="border: 0; border-top: 1px solid #4ade80; margin: 20px 0; opacity: 0.3;">
        
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfduqoEyvRko9-TM2T1SU0WVkr2vCdg2sFPZUTtQLOwSnJbBA/viewform" class="submit-btn">SUBMIT TO MR. DOTUN</a>
    </div>
</div>

<script>
    // --- FIREBASE INTEGRATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
      authDomain: "assignments-de95a.firebaseapp.com",
      projectId: "assignments-de95a",
      storageBucket: "assignments-de95a.firebasestorage.app",
      messagingSenderId: "1088073398299",
      appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    var currentName = "";
    var currentClass = "";
    var hasSavedWin = false;

    // Real-time listener
    function subscribeToLeaderboard() {
        // Updated limit to 100
        return db.collection("grandmasters").orderBy("timestamp", "desc").limit(100)
          .onSnapshot((snapshot) => {
            const list = document.getElementById('leaderboardList');
            list.innerHTML = "";
            if (snapshot.empty) list.innerHTML = "<li>No Grandmasters yet. Win to be first!</li>";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement('li');
                li.textContent = `👑 ${data.name} (${data.class})`;
                // Prepend logic keeps latest winners at the bottom of the list
                list.prepend(li);
            });
        });
    }

    let unsubscribe = subscribeToLeaderboard();

    function manualRefresh() {
        unsubscribe();
        document.getElementById('leaderboardList').innerHTML = "<li>Refreshing...</li>";
        unsubscribe = subscribeToLeaderboard();
    }

    function adminResetLeaderboard() {
        const pass = prompt("Enter Admin Password to Clear Leaderboard:");
        if (pass === "dotun123") {
            if (confirm("Are you sure you want to wipe the leaderboard?")) {
                db.collection("grandmasters").get().then((snapshot) => {
                    snapshot.forEach((doc) => {
                        db.collection("grandmasters").doc(doc.id).delete();
                    });
                    alert("Leaderboard Cleared.");
                });
            }
        } else {
            alert("Incorrect password.");
        }
    }

    function startGame() {
        currentName = document.getElementById('studentName').value;
        currentClass = document.getElementById('studentClass').value;
        if (currentName.trim() === "" || currentClass.trim() === "") {
            alert("Please enter both your name and class.");
            return;
        }
        document.getElementById('welcome-overlay').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        board.resize();
    }

    var board = null;
    var game = new Chess();
    var $status = $('#status');
    var $grade = $('#grade');
    var $remark = $('#remark');
    var sourceSquare = null; 

    var pieceValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 1000 };
    var totalScore = 0;

    function updateGrade() {
        if (totalScore >= 200) {
            $grade.text("Grandmaster! 👑");
            if (!hasSavedWin && currentName) {
                db.collection("grandmasters").add({
                    name: currentName,
                    class: currentClass,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                hasSavedWin = true;
            }
        }
        else if (totalScore >= 120) $grade.text("Expert 🏆");
        else if (totalScore >= 70) $grade.text("Pro 🌟");
        else if (totalScore >= 30) $grade.text("Advanced 👍");
        else $grade.text("Beginner");
    }

    function mrDotunRemarks(type) {
        var remarks = {
            illegal: "I'll reduce your score if you make an illegal move!",
            bad: ["Control the center!", "Every pawn move creates a weakness.", "Is this what I taught you?", "Hahahha. Nursery 1 moves.", "Castle early, stay safe!"],
            good: ["You're learning!", "Strong move.", "You're going to be world champion!", "Now you're playing real chess.", "Beautiful!"]
        };
        if (type === 'illegal') $remark.text(remarks.illegal);
        else if (type === 'good') $remark.text(remarks.good[Math.floor(Math.random() * remarks.good.length)]);
        else if (type === 'bad') $remark.text(remarks.bad[Math.floor(Math.random() * remarks.bad.length)]);
    }

    function makeAIMove() {
        if (game.game_over()) {
            $status.text('Game Over!');
            return;
        }

        var moves = game.moves({ verbose: true });

        // Helper: Evaluates total board material from Black's (AI's) perspective
        function evaluateBoard(fen) {
            var score = 0;
            var fenChars = fen.split(' ')[0];
            for (var i = 0; i < fenChars.length; i++) {
                var c = fenChars[i];
                if (pieceValues[c.toLowerCase()]) {
                    if (c === c.toLowerCase()) score += pieceValues[c]; // Black piece
                    else score -= pieceValues[c.toLowerCase()]; // White piece
                }
            }
            return score;
        }

        var scoredMoves = moves.map(function(move) {
            // 1. AI temporarily makes a candidate move
            game.move(move);

            // Instant checkmate is always the best move
            if (game.in_checkmate()) {
                game.undo();
                return { move: move, score: 100000 };
            }

            // 2. Evaluate all possible responses the Player can make
            var playerMoves = game.moves({ verbose: true });
            
            // We want to track the worst-case scenario for the AI 
            // (because the player will choose the move that hurts the AI most)
            var worstCaseScore = Infinity; 

            if (playerMoves.length === 0) {
                worstCaseScore = 0; // Draw/Stalemate
            } else {
                playerMoves.forEach(function(playerMove) {
                    game.move(playerMove);
                    var currentScore = evaluateBoard(game.fen());
                    
                    // The player wants to lower Black's score as much as possible
                    if (currentScore < worstCaseScore) {
                        worstCaseScore = currentScore;
                    }
                    game.undo();
                });
            }

            game.undo();

            // 3. Add small positional bonuses
            // Encourage moving to the center
            if (['d4', 'd5', 'e4', 'e5', 'c4', 'c5', 'f4', 'f5'].includes(move.to)) {
                worstCaseScore += 2; 
            }
            // Slight bonus for putting the player in check
            if (move.san.includes('+')) {
                worstCaseScore += 1; 
            }

            // Add a tiny random fraction (0 to 0.1) so it doesn't play the exact same game every time,
            // but keep it small enough that it NEVER overrides a real point value.
            var finalScore = worstCaseScore + (Math.random() * 0.1);

            return { move: move, score: finalScore };
        });

        // Sort moves by highest score
        scoredMoves.sort(function(a, b) { return b.score - a.score; });

        // Play the best move
        game.move(scoredMoves[0].move);
        board.position(game.fen());

        var history = game.history();
        var histText = history.length > 0 ? "<br><small>History: " + history.slice(-6).join(' ') + "</small>" : "";

        if (game.game_over()) {
            $status.html("Mr. Dotun wins!" + histText);
            $remark.text("Go back and study your endgames!");
        } else {
            $status.html("Mr. Dotun moved. Your turn!" + histText);
        }
    }

    function onSquareClick(square) {
        if (game.game_over()) return;
        if (sourceSquare === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            }
            return;
        }
        var moveAttempt = { from: sourceSquare, to: square, promotion: 'q' };
        var move = game.move(moveAttempt);
        if (move === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            } else {
                sourceSquare = null;
                removeHighlights();
                mrDotunRemarks('illegal');
            }
            return;
        }
        board.position(game.fen());
        sourceSquare = null;
        removeHighlights();
        if (move.captured) totalScore += pieceValues[move.captured];
        if (game.in_checkmate()) {
            totalScore = 250; 
            updateGrade();
            $remark.text("Masterful! You checkmated Mr. Dotun!");
        } else {
            updateGrade();
            if (move.captured || move.san.includes('+')) mrDotunRemarks('good');
            else if(Math.random() > 0.7) mrDotunRemarks('bad');
            var history = game.history();
            $status.html("Thinking... <br><small>History: " + history.slice(-6).join(' ') + "</small>");
            window.setTimeout(makeAIMove, 500);
        }
    }

    function addHighlight(square) {
        var $el = $('#board .square-' + square);
        if ($el.hasClass('black-3c85d')) $el.addClass('highlight-black');
        else $el.addClass('highlight-white');
    }

    function removeHighlights() {
        $('#board [class*="square-"]').removeClass('highlight-white highlight-black');
    }

    var config = {
        draggable: false,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };
    board = ChessBoard('board', config);
    $('#board').on('click', '[class*="square-"]', function() {
        onSquareClick($(this).attr('data-square'));
    });
    $(window).resize(board.resize);
</script>
</body>
</html>
