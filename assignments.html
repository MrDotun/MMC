<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play against Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <style>
        body, html {
            margin: 0; 
            padding: 0;
            min-height: 100%; 
            width: 100%;
            overflow-y: auto; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start;
            background-color: #1a1a2e;
        }

        /* Welcome Page Styles */
        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: white;
            text-align: center;
        }
        .login-card {
            background: #2D1B4D;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #4ade80;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #4ade80;
            background: #1a1a2e;
            color: white;
            box-sizing: border-box;
        }

        /* Leaderboard Styles */
        .leaderboard {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }
        .leaderboard h3 {
            margin: 0 0 10px 0;
            font-size: 0.9em;
            color: #facc15;
            text-transform: uppercase;
            border-bottom: 1px solid #4ade80;
            padding-bottom: 5px;
        }
        .leaderboard ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .leaderboard li {
            font-size: 0.85em;
            padding: 3px 0;
            color: #4ade80;
        }

        /* Game Container */
        #game-container {
            display: none; 
            width: 95vmin; 
            max-width: 550px;
            text-align: center;
            padding: 20px 10px;
        }

        #board { 
            width: 100%; 
            margin-bottom: 15px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .info-panel {
            background: #2D1B4D; 
            padding: 20px;
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #4ade80;
            color: white;
        }
        h2 { margin: 0 0 10px 0; color: #4ade80; font-size: 1.4em; }
        .grade { font-size: 1.3em; font-weight: bold; color: #4ade80; }
        
        .submit-btn {
            background-color: #4ade80;
            color: #1a1a2e;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(74, 222, 128, 0.2);
        }
        .submit-btn:hover {
            background-color: #22c55e;
            transform: translateY(-2px);
        }

        .highlight-white { background-color: #f6f669 !important; }
        .highlight-black { background-color: #e6e600 !important; }
        .white-1e1d7 { background-color: #ebecd0 !important; }
        .black-3c85d { background-color: #779556 !important; }
        
        #remark { 
            font-style: italic; 
            color: #facc15; 
            min-height: 1.5em; 
            display: block; 
            margin: 10px 0; 
            font-weight: 500;
        }
        #status { font-weight: bold; color: #cbd5e1; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80;">Week One Task</h1>
        <p>Welcome, Chess Champion! Please enter your details to start the match.</p>
        <input type="text" id="studentName" placeholder="Enter Your Full Name" required>
        <input type="text" id="studentClass" placeholder="Enter Your Class" required>
        <button class="submit-btn" onclick="startGame()">START GAME</button>

        <div class="leaderboard">
            <h3>🏆 Grandmaster Hall of Fame</h3>
            <ul id="leaderboardList">
                </ul>
        </div>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h2 id="welcome-msg">Playing against: <strong>Mr. Dotun</strong></h2>
        <div id="board"></div>
        <p id="remark">"If you don't win, I'll be disappointed"</p>
        <p>Your Grade: <span id="grade" class="grade">Beginner</span></p>
        <p id="status">Your turn! Click a piece to select it.</p>
        
        <hr style="border: 0; border-top: 1px solid #4ade80; margin: 20px 0; opacity: 0.3;">
        
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfduqoEyvRko9-TM2T1SU0WVkr2vCdg2sFPZUTtQLOwSnJbBA/viewform" class="submit-btn">SUBMIT TO MR. DOTUN</a>
    </div>
</div>

<script>
    var currentPlayerName = "";
    var grandmasters = JSON.parse(localStorage.getItem('chessGrandmasters')) || [];

    function updateLeaderboardUI() {
        const list = document.getElementById('leaderboardList');
        list.innerHTML = grandmasters.length === 0 ? "<li>No Grandmasters yet. Be the first!</li>" : "";
        grandmasters.forEach(name => {
            const li = document.createElement('li');
            li.textContent = "👑 " + name;
            list.appendChild(li);
        });
    }

    // Initialize leaderboard on load
    updateLeaderboardUI();

    function startGame() {
        currentPlayerName = document.getElementById('studentName').value;
        const className = document.getElementById('studentClass').value;

        if (currentPlayerName.trim() === "" || className.trim() === "") {
            alert("Please enter both your name and class.");
            return;
        }

        document.getElementById('welcome-overlay').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        board.resize(); 
    }

    var board = null;
    var game = new Chess();
    var $status = $('#status');
    var $grade = $('#grade');
    var $remark = $('#remark');
    var sourceSquare = null; 

    var pieceValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 0 };
    var totalScore = 0;
    var hasAchievedGM = false;

    function updateGrade() {
        if (totalScore >= 200) {
            $grade.text("Grandmaster! 👑");
            checkAndRecordGM();
        }
        else if (totalScore >= 120) $grade.text("Expert 🏆");
        else if (totalScore >= 70) $grade.text("Pro 🌟");
        else if (totalScore >= 30) $grade.text("Advanced 👍");
        else $grade.text("Beginner");
    }

    function checkAndRecordGM() {
        if (!hasAchievedGM && currentPlayerName) {
            if (!grandmasters.includes(currentPlayerName)) {
                grandmasters.push(currentPlayerName);
                localStorage.setItem('chessGrandmasters', JSON.stringify(grandmasters));
                updateLeaderboardUI();
            }
            hasAchievedGM = true;
        }
    }

    // ... [Rest of your mrDotunRemarks and makeAIMove logic remains exactly the same] ...
    function mrDotunRemarks(type) {
        var remarks = {
            illegal: "I'll reduce your score if you make an illegal move!",
            bad: [
                "Control the center, don't just push wood!",
                "Every pawn move creates a permanent weakness.",
                "Is this what I taught you?",
                "Hahahha. You're playing like you're in Nursery 1.",
                "Should I take you back to Creche?",
                "A knight on the rim is dim!",
                "Don't bring your Queen out too early.",
                "Are you even calculating, or just hoping?",
                "Develop your pieces before you start attacking.",
                "Castle early, stay safe!"
            ],
            good: [
                "You're learning! Good vision.",
                "Strong move. You're seeing the board better.",
                "You're going to be world champion someday!",
                "Now you're playing real chess.",
                "Tactical! I didn't see that coming immediately.",
                "Excellent use of the open file.",
                "Pinning that piece was a smart choice.",
                "You're thinking like a candidate master now.",
                "Pressure! Keep the pressure on!",
                "Beautiful! Checkmate is the goal!"
            ]
        };

        if (type === 'illegal') {
            $remark.text(remarks.illegal);
        } else if (type === 'good') {
            $remark.text(remarks.good[Math.floor(Math.random() * remarks.good.length)]);
        } else if (type === 'bad') {
            $remark.text(remarks.bad[Math.floor(Math.random() * remarks.bad.length)]);
        }
    }

    function makeAIMove() {
        if (game.game_over()) {
            $status.text('Game Over!');
            if (game.in_checkmate()) {
                totalScore = 250; 
                updateGrade();
                $remark.text("Checkmate! You've surpassed the master. Grandmaster status achieved!");
            }
            return;
        }

        var moves = game.moves({ verbose: true });
        var threatenedSquares = [];
        var fen = game.fen();
        var tempGame = new Chess(fen);
        var tokens = fen.split(' ');
        tokens[1] = tokens[1] === 'w' ? 'b' : 'w'; 
        tempGame.load(tokens.join(' '));
        tempGame.moves({ verbose: true }).forEach(function(m) {
            if (m.captured) threatenedSquares.push(m.to);
        });

        var scoredMoves = moves.map(function(move) {
            var score = Math.random() * 5; 
            if (move.san.includes('#')) return { move: move, score: 10000 };
            if (threatenedSquares.includes(move.from)) {
                var val = pieceValues[move.piece] || 10;
                score += val * 15;
            }
            if (move.captured) score += pieceValues[move.captured] * 20;
            game.move(move);
            var opponentMoves = game.moves({ verbose: true });
            if (opponentMoves.find(function(m) { return m.to === move.to; })) {
                var val = pieceValues[move.piece] || 10;
                score -= (val * 25);
            }
            game.undo();
            return { move: move, score: score };
        });

        scoredMoves.sort(function(a, b) { return b.score - a.score; });
        game.move(scoredMoves[0].move);
        board.position(game.fen());
        
        if (game.game_over()) {
            $status.text("Mr. Dotun wins! Better luck next time.");
            $remark.text("Go back and study your endgames!");
        } else {
            $status.text("Mr. Dotun moved. Your turn!");
        }
    }

    function onSquareClick(square) {
        if (game.game_over()) return;

        if (sourceSquare === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
                $status.text("Piece selected. Click where to move.");
            }
            return;
        }

        var move = game.move({
            from: sourceSquare,
            to: square,
            promotion: 'q'
        });

        if (move === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            } else {
                sourceSquare = null;
                removeHighlights();
                $status.text("Invalid move.");
                mrDotunRemarks('illegal');
            }
            return;
        }

        board.position(game.fen());
        sourceSquare = null;
        removeHighlights();

        if (move.captured) {
            totalScore += pieceValues[move.captured];
        }

        if (game.in_checkmate()) {
            totalScore = 250; 
            updateGrade();
            $remark.text("Masterful! You checkmated Mr. Dotun!");
            $status.text("Victory! You are a Grandmaster.");
        } else {
            updateGrade();
            if (move.captured || move.san.includes('+')) {
                mrDotunRemarks('good');
            } else {
                if(Math.random() > 0.6) mrDotunRemarks('bad');
            }
            $status.text("Nice move! Mr. Dotun is thinking...");
            window.setTimeout(makeAIMove, 500);
        }
    }

    function addHighlight(square) {
        var $el = $('#board .square-' + square);
        if ($el.hasClass('black-3c85d')) $el.addClass('highlight-black');
        else $el.addClass('highlight-white');
    }

    function removeHighlights() {
        $('#board [class*="square-"]').removeClass('highlight-white highlight-black');
    }

    var config = {
        draggable: false,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };
    
    board = ChessBoard('board', config);

    $('#board').on('click', '[class*="square-"]', function() {
        var square = $(this).attr('data-square');
        onSquareClick(square);
    });

    $(window).resize(board.resize);
</script>
</body>
</html>
