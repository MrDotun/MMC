<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play against Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100%; width: 100%;
            overflow-y: auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; 
            justify-content: flex-start; background-color: #1a1a2e;
        }

        /* Welcome Page Styles */
        #welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a1a2e; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000;
            color: white; text-align: center;
        }
        .login-card {
            background: #2D1B4D; padding: 30px; border-radius: 15px;
            border: 2px solid #4ade80; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%; max-width: 400px;
        }
        .login-card input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px;
            border: 1px solid #4ade80; background: #1a1a2e; color: white; box-sizing: border-box;
        }

        /* Leaderboard Styles */
        .leaderboard {
            margin-top: 20px; background: rgba(0, 0, 0, 0.3); padding: 15px;
            border-radius: 10px; text-align: left; max-height: 160px; overflow-y: auto;
            border: 1px solid #4ade8044;
        }
        .leaderboard h3 { margin: 0 0 10px 0; font-size: 0.9em; color: #facc15; text-transform: uppercase; border-bottom: 1px solid #4ade80; padding-bottom: 5px; }
        .leaderboard ul { list-style: none; padding: 0; margin: 0; }
        .leaderboard li { font-size: 0.85em; padding: 5px 0; color: #4ade80; border-bottom: 1px solid #ffffff11; }

        /* Game Container */
        #game-container { display: none; width: 95vmin; max-width: 550px; text-align: center; padding: 20px 10px; }
        #board { width: 100%; margin-bottom: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .info-panel { background: #2D1B4D; padding: 20px; border-radius: 12px; border: 2px solid #4ade80; color: white; }
        h2 { margin: 0 0 10px 0; color: #4ade80; font-size: 1.4em; }
        .grade { font-size: 1.3em; font-weight: bold; color: #4ade80; }
        
        .submit-btn {
            background-color: #4ade80; color: #1a1a2e; padding: 14px 28px; border: none;
            border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px;
            transition: transform 0.2s; box-shadow: 0 4px 10px rgba(74, 222, 128, 0.2);
        }
        .submit-btn:hover { background-color: #22c55e; transform: translateY(-2px); }
        .highlight-white { background-color: #f6f669 !important; }
        #remark { font-style: italic; color: #facc15; min-height: 1.5em; display: block; margin: 10px 0; }
        #status { font-weight: bold; color: #cbd5e1; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80;">Week One Task</h1>
        <p>Challenge Mr. Dotun and claim your spot on the leaderboard!</p>
        <input type="text" id="studentName" placeholder="Full Name" required>
        <input type="text" id="studentClass" placeholder="Class" required>
        <button class="submit-btn" onclick="startGame()">START GAME</button>

        <div class="leaderboard">
            <h3>🏆 Global Grandmasters</h3>
            <ul id="leaderboardList"><li>Connecting to Hall of Fame...</li></ul>
        </div>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h2 id="welcome-msg">Opponent: <strong>Mr. Dotun</strong></h2>
        <div id="board"></div>
        <p id="remark">"If you don't win, I'll be disappointed"</p>
        <p>Current Grade: <span id="grade" class="grade">Beginner</span></p>
        <p id="status">Your turn! Click a piece.</p>
        <hr style="border: 0; border-top: 1px solid #4ade80; margin: 20px 0; opacity: 0.3;">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfduqoEyvRko9-TM2T1SU0WVkr2vCdg2sFPZUTtQLOwSnJbBA/viewform" class="submit-btn">SUBMIT TO MR. DOTUN</a>
    </div>
</div>

<script>
    // --- 1. FIREBASE SETUP ---
    const firebaseConfig = {
        apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
        authDomain: "assignments-de95a.firebaseapp.com",
        projectId: "assignments-de95a",
        storageBucket: "assignments-de95a.firebasestorage.app",
        messagingSenderId: "1088073398299",
        appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    var currentPlayerName = "";
    var currentPlayerClass = "";
    var hasRecorded = false;

    // Real-time Leaderboard Listener
    db.collection("grandmasters").orderBy("timestamp", "desc").limit(15)
      .onSnapshot((snapshot) => {
          const list = document.getElementById('leaderboardList');
          list.innerHTML = "";
          if (snapshot.empty) list.innerHTML = "<li>No Grandmasters yet. Be the first!</li>";
          snapshot.forEach((doc) => {
              const p = doc.data();
              const li = document.createElement('li');
              li.textContent = `👑 ${p.name} - ${p.class}`;
              list.appendChild(li);
          });
      }, (error) => {
          console.error("Leaderboard error:", error);
          document.getElementById('leaderboardList').innerHTML = "<li>Set Firestore rules to 'public' to see names.</li>";
      });

    function recordWin() {
        if (!hasRecorded && currentPlayerName) {
            db.collection("grandmasters").add({
                name: currentPlayerName,
                class: currentPlayerClass,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => { hasRecorded = true; });
        }
    }

    // --- 2. GAME FUNCTIONS ---
    function startGame() {
        currentPlayerName = document.getElementById('studentName').value;
        currentPlayerClass = document.getElementById('studentClass').value;
        if (!currentPlayerName || !currentPlayerClass) return alert("Fill in your details!");
        document.getElementById('welcome-overlay').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        board.resize();
    }

    var board = null;
    var game = new Chess();
    var totalScore = 0;
    var pieceValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 0 };

    function updateGrade() {
        if (totalScore >= 200) {
            $('#grade').text("Grandmaster! 👑");
            recordWin();
        } else if (totalScore >= 120) $('#grade').text("Expert 🏆");
        else if (totalScore >= 70) $('#grade').text("Pro 🌟");
        else $('#grade').text("Beginner");
    }

    // AI & Chess Logic
    function onSquareClick(square) {
        if (game.game_over()) return;
        if (sourceSquare === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                addHighlight(square);
            }
            return;
        }
        var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
        if (move === null) { sourceSquare = null; removeHighlights(); return; }

        board.position(game.fen());
        if (move.captured) totalScore += pieceValues[move.captured];
        updateGrade();
        sourceSquare = null;
        removeHighlights();
        window.setTimeout(makeAIMove, 500);
    }

    function makeAIMove() {
        var moves = game.moves();
        if (moves.length === 0) return;
        game.move(moves[Math.floor(Math.random() * moves.length)]);
        board.position(game.fen());
        if (game.game_over()) $('#status').text("Game Over!");
    }

    var sourceSquare = null;
    function addHighlight(square) { $('.square-' + square).addClass('highlight-white'); }
    function removeHighlights() { $('#board [class*="square-"]').removeClass('highlight-white'); }

    board = ChessBoard('board', {
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    $('#board').on('click', '[class*="square-"]', function() {
        onSquareClick($(this).attr('data-square'));
    });
</script>
</body>
</html>
