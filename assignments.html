<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play against Mr. Dotun</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100%; width: 100%;
            overflow-y: auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background-color: #1a1a2e;
        }

        #welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a1a2e; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000; color: white; text-align: center;
        }
        .login-card {
            background: #2D1B4D; padding: 40px; border-radius: 15px;
            border: 2px solid #4ade80; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%; max-width: 400px;
        }
        .login-card input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px;
            border: 1px solid #4ade80; background: #1a1a2e; color: white; box-sizing: border-box;
        }

        #leaderboard-box {
            margin-top: 20px; text-align: left; background: rgba(0,0,0,0.2);
            padding: 10px; border-radius: 8px; max-height: 200px; 
            overflow-y: auto; border: 1px solid #4ade8044; position: relative;
        }
        #leaderboardList { list-style: none; padding: 0; margin: 0; font-size: 0.85em; color: #4ade80; }
        #leaderboardList li { border-bottom: 1px solid #ffffff11; padding: 3px 0; }

        #game-container { display: none; width: 95vmin; max-width: 550px; text-align: center; padding: 20px 10px; }
        #board { width: 100%; margin-bottom: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        
        .info-panel {
            background: #2D1B4D; padding: 20px; border-radius: 12px;
            border: 2px solid #4ade80; color: white;
        }
        
        .submit-btn {
            background-color: #4ade80; color: #1a1a2e; padding: 14px 28px;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
            text-decoration: none; display: inline-block; margin-top: 20px;
        }

        /* Highlight styles */
        .highlight-white { background-color: rgba(246, 246, 105, 0.4) !important; }
        .highlight-black { background-color: rgba(230, 230, 0, 0.4) !important; }
        
        #remark { 
            font-style: italic; 
            color: #ff4d4d; /* CHANGED TO RED */
            min-height: 1.5em; 
            display: block; 
            margin: 10px 0; 
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        #status { font-weight: bold; color: #cbd5e1; }
        .illegal-move { color: #ff4d4d !important; }
    </style>
</head>
<body>

<div id="welcome-overlay">
    <div class="login-card">
        <h1 style="color: #4ade80;">Week One Task</h1>
        <p>Welcome, Chess Champion! Enter your details to face Mr. Dotun.</p>
        <input type="text" id="studentName" placeholder="Enter Your Full Name" required>
        <input type="text" id="studentClass" placeholder="Enter Your Class" required>
        <button class="submit-btn" onclick="startGame()">START GAME</button>
        <div id="leaderboard-box">
            <h3 style="color: #facc15;">🏆 Hall of Grandmasters</h3>
            <ul id="leaderboardList"><li>Loading...</li></ul>
        </div>
    </div>
</div>

<div id="game-container">
    <div class="info-panel">
        <h2 id="welcome-msg" style="color:#4ade80;">Playing against: <strong>Mr. Dotun</strong></h2>
        <div id="board"></div>
        <p id="remark">"Show me what you've got!"</p>
        <p>Your Grade: <span id="grade" class="grade" style="color:#4ade80;">Beginner</span></p>
        <p id="status">Your turn! Select a piece.</p>
        <a href="#" class="submit-btn">SUBMIT TO MR. DOTUN</a>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG (Hidden for brevity, keep yours as is) ---
    const firebaseConfig = { apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw", authDomain: "assignments-de95a.firebaseapp.com", projectId: "assignments-de95a", storageBucket: "assignments-de95a.firebasestorage.app", messagingSenderId: "1088073398299", appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    var currentName = "", currentClass = "", hasSavedWin = false;
    var board = null, game = new Chess();
    var $status = $('#status'), $grade = $('#grade'), $remark = $('#remark');
    var sourceSquare = null; 
    var totalScore = 0;

    function startGame() {
        currentName = $('#studentName').val();
        currentClass = $('#studentClass').val();
        if (!currentName || !currentClass) return alert("Enter name and class!");
        $('#welcome-overlay').hide();
        $('#game-container').show();
        board.resize();
    }

    // --- AI LOGIC (Depth 2 for a bit more challenge) ---
    function evaluateBoard(game) {
        const weights = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
        let total = 0;
        game.board().forEach(row => row.forEach(p => { if(p) total += (p.color === 'w' ? -weights[p.type] : weights[p.type]); }));
        return total;
    }

    function makeAIMove() {
        if (game.game_over()) return;
        let moves = game.moves();
        moves.sort(() => Math.random() - 0.5);
        let bestMove = moves[0], bestValue = -Infinity;

        for (let move of moves) {
            game.move(move);
            let val = evaluateBoard(game);
            game.undo();
            if (val > bestValue) { bestValue = val; bestMove = move; }
        }

        game.move(bestMove);
        board.position(game.fen());
        updateStatus();
    }

    function updateStatus() {
        $status.removeClass('illegal-move');
        
        // Random Taunts for Mr. Dotun
        const taunts = [
            "Is that your best move?",
            "I've seen better from a pawn!",
            "You're making this too easy!",
            "Are you sure about that?",
            "Interesting... but wrong!",
            "Check the board again, kid!"
        ];

        if (game.in_checkmate()) {
            $status.html("CHECKMATE! Mr. Dotun wins.");
            $remark.text("Class is dismissed! Better luck next time.");
        } else if (game.in_draw()) {
            $status.html("Draw.");
            $remark.text("A lucky escape for you!");
        } else if (game.in_check()) {
            $status.addClass('illegal-move').html("WARNING: YOU ARE IN CHECK!");
            $remark.text("WATCH YOUR KING!");
        } else {
            $status.html("Your turn!");
            $remark.text(taunts[Math.floor(Math.random() * taunts.length)]);
        }
    }

    function onSquareClick(square) {
        if (game.game_over()) return;
        
        if (sourceSquare === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            }
            return;
        }

        var move = game.move({ from: sourceSquare, to: square, promotion: 'q' });

        if (move === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                // Check for Pinned Piece
                // To check if a piece is pinned, we see if moving it puts king in check
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            } else {
                // ILLEGAL MOVE REMARKS
                let msg = "Illegal Move!";
                if (game.in_check()) {
                    msg = "YOU MUST PROTECT YOUR KING!";
                } else {
                    // Detect potential Absolute Pin
                    let p = game.get(sourceSquare);
                    if (p) {
                        msg = "That piece is pinned! It cannot move!";
                    }
                }
                
                $status.addClass('illegal-move').text(msg);
                $remark.text("Mr. Dotun: 'Stop trying to break the rules!'");
                sourceSquare = null;
                removeHighlights();
            }
            return;
        }

        board.position(game.fen());
        sourceSquare = null;
        removeHighlights();
        
        if (move.captured) totalScore += 20;
        updateGrade();
        $status.html("Thinking...");
        window.setTimeout(makeAIMove, 400);
    }

    function updateGrade() {
        if (totalScore >= 100) $grade.text("Pro 🌟");
        else if (totalScore >= 50) $grade.text("Advanced 👍");
        else $grade.text("Beginner");
    }

    function addHighlight(square) {
        var $el = $('#board .square-' + square);
        if ($el.hasClass('black-3c85d')) $el.addClass('highlight-black');
        else $el.addClass('highlight-white');
    }

    function removeHighlights() {
        $('#board [class*="square-"]').removeClass('highlight-white highlight-black');
    }

    board = ChessBoard('board', {
        draggable: false,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    $('#board').on('click', '[class*="square-"]', function() {
        onSquareClick($(this).attr('data-square'));
    });
    $(window).resize(board.resize);
</script>
</body>
</html>
