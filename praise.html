<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGN to JS Database Compiler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-white p-10 font-sans">

    <div class="max-w-2xl mx-auto bg-slate-800 p-8 rounded-xl shadow-lg border border-slate-700">
        <h1 class="text-2xl font-bold text-yellow-400 mb-2">PGN Database Compiler</h1>
        <p class="text-slate-400 text-sm mb-6">Upload a PGN (or zipped PGN) containing thousands of games. This tool will pre-compile it into a format compatible with your GM Variation Master Pro app.</p>

        <div class="space-y-4">
            <label class="block">
                <span class="sr-only">Choose file</span>
                <input type="file" id="file-input" accept=".zip,.pgn" class="block w-full text-sm text-slate-400
                  file:mr-4 file:py-2 file:px-4
                  file:rounded-full file:border-0
                  file:text-sm file:font-semibold
                  file:bg-yellow-50 file:text-yellow-700
                  hover:file:bg-yellow-100
                "/>
            </label>
            
            <div class="pt-4">
                <button onclick="compileDatabase()" id="compile-btn" class="w-full py-3 bg-yellow-500 hover:bg-yellow-600 text-slate-900 font-bold rounded-lg transition-colors">
                    Compile & Download Zip
                </button>
            </div>
        </div>

        <!-- Progress Bar UI -->
        <div id="progress-container" class="mt-6 hidden">
            <div class="flex justify-between text-xs text-slate-400 mb-1">
                <span id="progress-label">Preparing Download...</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="w-full bg-slate-700 rounded-full h-2.5">
                <div id="progress-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-200" style="width: 0%"></div>
            </div>
        </div>

        <div id="status" class="mt-4 text-sm text-yellow-400 font-mono hidden"></div>
    </div>

    <script>
        const updateStatus = (msg) => {
            const el = document.getElementById('status');
            el.classList.remove('hidden');
            el.innerText = msg;
        };

        const updateProgress = (percent, show = true) => {
            const container = document.getElementById('progress-container');
            const bar = document.getElementById('progress-bar');
            const text = document.getElementById('progress-percent');
            
            if (show) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }

            bar.style.width = percent + '%';
            text.innerText = percent + '%';
        };

        async function compileDatabase() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            
            if (!file) {
                alert("Please select a .pgn or .zip file first.");
                return;
            }

            const btn = document.getElementById('compile-btn');
            btn.disabled = true;
            btn.classList.add('opacity-50');
            updateProgress(0, false);

            try {
                let pgnContent = "";
                
                // 1. Extract PGN content
                if (file.name.endsWith('.zip')) {
                    updateStatus("Unzipping file...");
                    const zip = new JSZip();
                    const unzipped = await zip.loadAsync(file);
                    const pgnFilename = Object.keys(unzipped.files).find(name => name.endsWith('.pgn'));
                    if (!pgnFilename) throw new Error("No .pgn file found inside the zip.");
                    pgnContent = await unzipped.file(pgnFilename).async("string");
                } else if (file.name.endsWith('.pgn')) {
                    updateStatus("Reading PGN file...");
                    pgnContent = await file.text();
                } else {
                    throw new Error("Invalid file type.");
                }

                // 2. Parse games asynchronously with progress updates
                updateStatus("Parsing games... This might take a minute for 2000+ games.");
                document.getElementById('progress-label').innerText = "Parsing Games...";
                updateProgress(0, true);
                
                const db = await parsePgnData(pgnContent, (percent) => {
                    updateProgress(percent, true);
                });
                
                // 3. Package into JS string
                updateStatus("Formatting JavaScript object...");
                const jsContent = `const NAJDORF_G3_MASTER_DB = ${JSON.stringify(db, null, 2)};`;

                // 4. Zip and Download with Progress Tracking
                updateStatus("Compressing database for download...");
                document.getElementById('progress-label').innerText = "Compressing Zip...";
                updateProgress(0, true);

                const outputZip = new JSZip();
                outputZip.file("database.js", jsContent);
                
                const blob = await outputZip.generateAsync({ type: "blob", compression: "DEFLATE" }, (metadata) => {
                    const percent = metadata.percent.toFixed(0);
                    updateProgress(percent, true);
                });

                // Trigger browser download
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = "Compiled_Opening_DB.zip";
                a.click();

                updateStatus("Success! Database compiled and downloaded.");
                
                // Reset UI
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                setTimeout(() => updateProgress(0, false), 2000);

            } catch (err) {
                updateStatus("Error: " + err.message);
                console.error(err);
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                updateProgress(0, false);
            }
        }

        async function parsePgnData(pgnContent, onProgress) {
            const games = pgnContent.split(/\n\s*\n(?=\[Event)/g);
            const db = {};
            const totalGames = games.length;

            for (let i = 0; i < totalGames; i++) {
                let gamePgn = games[i];
                if (!gamePgn.trim()) continue;
                
                let whiteMatch = gamePgn.match(/\[White "(.*?)"\]/);
                let blackMatch = gamePgn.match(/\[Black "(.*?)"\]/);
                let pWhite = whiteMatch ? whiteMatch[1] : "Unknown";
                let pBlack = blackMatch ? blackMatch[1] : "Unknown";

                let chess = new Chess();
                if (!chess.load_pgn(gamePgn, { sloppy: true })) continue;

                let history = chess.history({ verbose: true });
                let simChess = new Chess();

                for (let move of history) {
                    let fen = simChess.fen();
                    let parts = fen.split(' ');
                    let key = parts.slice(0, 4).join(' ');

                    if (!db[key]) {
                        db[key] = { totalGames: 0, moves: {}, topPlayers: {} };
                    }

                    db[key].totalGames++;
                    
                    if (!db[key].moves[move.san]) db[key].moves[move.san] = 0;
                    db[key].moves[move.san]++;

                    let currentPlayer = simChess.turn() === 'w' ? pWhite : pBlack;
                    if (currentPlayer !== "Unknown") {
                        if (!db[key].topPlayers[currentPlayer]) db[key].topPlayers[currentPlayer] = 0;
                        db[key].topPlayers[currentPlayer]++;
                    }

                    simChess.move(move);
                }

                // Yield execution to browser every 25 games so the UI can update the progress bar
                if (i % 25 === 0 || i === totalGames - 1) {
                    if (onProgress) {
                        const percent = Math.floor(((i + 1) / totalGames) * 100);
                        onProgress(percent);
                    }
                    await new Promise(resolve => setTimeout(resolve, 0));
                }
            }

            const formattedDb = {};
            for (let key in db) {
                let entry = db[key];
                
                let sortedMoves = Object.keys(entry.moves).sort((a, b) => entry.moves[b] - entry.moves[a]);
                let topSan = sortedMoves[0] || "";
                let choicesStr = sortedMoves.slice(0, 5).map(m => `${m} (${entry.moves[m]} games)`).join(', ');

                let sortedPlayers = Object.keys(entry.topPlayers).sort((a, b) => entry.topPlayers[b] - entry.topPlayers[a]);
                let notablePlayers = sortedPlayers.slice(0, 3).map(p => `${p} (${entry.topPlayers[p]} times)`).join(', ');

                formattedDb[key] = {
                    totalGames: entry.totalGames,
                    mostPlayedSan: topSan,
                    topChoices: choicesStr,
                    notablePlayers: notablePlayers || "None recorded"
                };
            }
            return formattedDb;
        }
    </script>
</body>
</html>
