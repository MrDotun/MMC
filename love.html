<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigerian Scholastic Grand Prix 2026</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0;
            min-height: 100%; width: 100%;
            overflow-y: auto; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            background-color: #1a1a2e;
            color: white;
        }
        .screen {
            display: none;
            width: 95vmin; 
            max-width: 550px;
            text-align: center;
            padding: 20px 10px;
            margin-top: 50px;
        }
        .active-screen {
            display: block;
        }
        .panel {
            background: #2D1B4D; padding: 30px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #4ade80;
        }
        h1 { color: #4ade80; font-size: 1.8em; margin-bottom: 5px;}
        h2 { margin: 0 0 10px 0; color: #4ade80; font-size: 1.4em; }
        h3 { color: #cbd5e1; margin-top: 0; font-weight: normal; }
        
        input {
            width: 80%; padding: 12px; margin: 10px 0;
            border-radius: 6px; border: 1px solid #cbd5e1;
            background: #1a1a2e; color: white; font-size: 1em;
        }
        .btn {
            background-color: #4ade80; color: #1a1a2e;
            padding: 14px 28px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-size: 1.1em;
            margin-top: 20px; transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(74, 222, 128, 0.2);
            width: 85%;
        }
        .btn:hover { background-color: #22c55e; transform: translateY(-2px); }

        .feed-box {
            background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px;
            text-align: left; margin-bottom: 20px; font-size: 0.95em;
        }
        .feed-box p { margin: 8px 0; border-bottom: 1px solid rgba(74, 222, 128, 0.2); padding-bottom: 8px; }
        .feed-box p:last-child { border-bottom: none; }
        .live-text { color: #facc15; font-weight: bold; }
        .win-text { color: #4ade80; font-weight: bold; }

        #board { width: 100%; margin-bottom: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .highlight-white { background-color: #f6f669 !important; }
        .highlight-black { background-color: #e6e600 !important; }
        
        #remark { font-style: italic; color: #facc15; min-height: 1.5em; display: block; margin: 10px 0; font-weight: 500; }
        #status { font-weight: bold; color: #cbd5e1; margin-bottom: 15px;}
        #error-msg { color: #ef4444; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div id="login-screen" class="screen active-screen">
    <div class="panel">
        <h1>Maryland Convent Private School</h1>
        <h3>National Scholastic Grand Prix Portal</h3>
        <input type="text" id="student-name" placeholder="Enter your first name (e.g., Obi)">
        <input type="password" id="password" placeholder="Tournament Password">
        <button class="btn" onclick="attemptLogin()">ENTER TOURNAMENT</button>
        <p id="error-msg">Invalid password or name not found.</p>
    </div>
</div>

<div id="dashboard-screen" class="screen">
    <div class="panel">
        <h2>Live Team Dashboard</h2>
        <h3>Round 1: Maryland Convent vs Zaria Int'l</h3>
        <div class="feed-box" id="live-feed">
            </div>
        <button class="btn" onclick="startGame()">START MY MATCH</button>
    </div>
</div>

<div id="game-screen" class="screen">
    <div class="panel">
        <h2>Playing against: <strong id="opponent-name">...</strong></h2>
        <div id="status">Waiting for game to start...</div>
        <div id="board"></div>
        <p id="remark">"Let's see if your center is strong enough!"</p>
        
        <hr style="border: 0; border-top: 1px solid #4ade80; margin: 20px 0; opacity: 0.3;">
        
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfduqoEyvRko9-TM2T1SU0WVkr2vCdg2sFPZUTtQLOwSnJbBA/viewform" class="btn" style="text-decoration: none; display: inline-block; width: auto; font-size: 0.9em;">SUBMIT RESULT TO COACH</a>
    </div>
</div>

<script>
    // Tournament Configuration
    const tournamentPassword = "decipherchess";
    const roundRivals = {
        "obi": "Abubakar Musa",
        "onele": "Fatima Ibrahim",
        "beckley": "Bello Garba",
        "andrew": "Zainab Aliyu",
        "oluwaseun": "Idris Mohammed"
    };

    let currentStudent = "";
    let currentOpponent = "";

    // Chess Logic Variables
    var board = null;
    var game = new Chess();
    var $status = $('#status');
    var $remark = $('#remark');
    var sourceSquare = null; 
    var pieceValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 0 };

    // --- SCREEN TRANSITIONS ---
    function showScreen(screenId) {
        $('.screen').removeClass('active-screen');
        $('#' + screenId).addClass('active-screen');
    }

    function attemptLogin() {
        const nameInput = $('#student-name').val().trim().toLowerCase();
        const passInput = $('#password').val();

        if (passInput === tournamentPassword && roundRivals[nameInput]) {
            currentStudent = nameInput;
            currentOpponent = roundRivals[nameInput];
            $('#error-msg').hide();
            setupDashboard();
            showScreen('dashboard-screen');
        } else {
            $('#error-msg').show();
        }
    }

    function setupDashboard() {
        // Build the simulated feed excluding the current student
        let feedHTML = "";
        const simulations = [
            { name: "onele", result: "FINISHED <span class='win-text'>(1 - 0)</span>" },
            { name: "andrew", result: "FINISHED <span class='win-text'>(0.5 - 0.5)</span>" },
            { name: "obi", result: "<span class='live-text'>LIVE: Move 22</span>" },
            { name: "beckley", result: "<span class='live-text'>LIVE: Move 12</span>" },
            { name: "oluwaseun", result: "WAITING" }
        ];

        simulations.forEach(sim => {
            if (sim.name !== currentStudent) {
                // Capitalize first letter
                let formattedName = sim.name.charAt(0).toUpperCase() + sim.name.slice(1);
                feedHTML += `<p><strong>${formattedName}</strong> vs ${roundRivals[sim.name]} - ${sim.result}</p>`;
            }
        });
        
        $('#live-feed').html(feedHTML);
    }

    function startGame() {
        $('#opponent-name').text(currentOpponent);
        $status.text("Connected! You are playing White. Your turn.");
        showScreen('game-screen');
        board.resize(); // Ensure board renders correctly after unhiding
    }

    // --- CHESS LOGIC & ENGINE ---
    function checkGameOver() {
        if (game.in_checkmate()) {
            var winner = game.turn() === 'w' ? currentOpponent : "Maryland Convent";
            $status.text("CHECKMATE! " + winner + " wins!");
            $remark.text(winner === "Maryland Convent" ? "You cracked their structure! Great job." : "They broke through your center. Better luck next round.");
            alert("Game Over: Checkmate!");
            return true;
        } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
            $status.text("Game Over: Draw!");
            $remark.text("A tough battle. A draw is a solid result.");
            alert("Game Over: Draw!");
            return true;
        }
        return false;
    }

    function makeAIMove() {
        if (checkGameOver()) return;

        var moves = game.moves({ verbose: true });
        
        // Depth 1 Evaluation
        var scoredMoves = moves.map(function(move) {
            var score = Math.random() * 2; // Slight randomness
            if (move.captured) score += pieceValues[move.captured] * 10;
            
            // Prioritize checks slightly
            if (move.san.includes('+')) score += 5;
            
            return { move: move, score: score };
        });

        // Sort moves highest score first
        scoredMoves.sort((a, b) => b.score - a.score);
        
        let selectedMove = scoredMoves[0].move;
        
        // 25% Rook Blunder Logic
        let isRookMove = selectedMove.piece === 'r';
        if (isRookMove && Math.random() < 0.25) {
            // Pick a random move instead of the "best" one to simulate a blunder
            selectedMove = moves[Math.floor(Math.random() * moves.length)];
            $remark.text(currentOpponent + " plays aggressively with the Rook!");
        } else {
            $remark.text(currentOpponent + " makes a solid move.");
        }

        // Human-like thinking delay (2 to 5 seconds)
        let delay = Math.floor(Math.random() * 3000) + 2000;
        $status.text(currentOpponent + " is thinking...");

        window.setTimeout(function() {
            game.move(selectedMove);
            board.position(game.fen());
            removeHighlights();
            addHighlight(selectedMove.from);
            addHighlight(selectedMove.to);
            
            if (!checkGameOver()) {
                $status.text(currentOpponent + " moved. Your turn!");
            }
        }, delay);
    }

    function onSquareClick(square) {
        if (game.game_over() || game.turn() === 'b') return; // Prevent moving during AI turn

        if (sourceSquare === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            }
            return;
        }

        var move = game.move({
            from: sourceSquare,
            to: square,
            promotion: 'q'
        });

        if (move === null) {
            var piece = game.get(square);
            if (piece && piece.color === 'w') {
                sourceSquare = square;
                removeHighlights();
                addHighlight(square);
            } else {
                sourceSquare = null;
                removeHighlights();
            }
            return;
        }

        board.position(game.fen());
        sourceSquare = null;
        removeHighlights();
        
        // Highlight player's move
        addHighlight(move.from);
        addHighlight(move.to);

        if (!checkGameOver()) {
            makeAIMove();
        }
    }

    function addHighlight(square) {
        var $el = $('#board .square-' + square);
        if ($el.hasClass('black-3c85d')) $el.addClass('highlight-black');
        else $el.addClass('highlight-white');
    }

    function removeHighlights() {
        $('#board [class*="square-"]').removeClass('highlight-white highlight-black');
    }

    var config = {
        draggable: false,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };
    
    board = ChessBoard('board', config);

    $('#board').on('click', '[class*="square-"]', function() {
        var square = $(this).attr('data-square');
        onSquareClick(square);
    });

    $(window).resize(board.resize);
</script>
</body>
</html>
