<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess FEN Generator for Gemini</title>
    
    <!-- CSS for Chessboard -->
    <link rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
      integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2+BLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU"
      crossorigin="anonymous">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f4f4f9; padding: 20px; }
        #board { width: 400px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .controls { width: 400px; text-align: center; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: monospace; }
        button { padding: 10px 20px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 4px; font-weight: bold; margin: 5px; }
        button:hover { background-color: #45a049; }
        button.clear { background-color: #f44336; }
        .instruction { color: #555; font-size: 0.9em; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Chess Position Builder</h2>
    <p class="instruction">Drag spare pieces onto the board to create a position. Move them around or drag them off to remove.</p>

    <div id="board"></div>

    <div class="controls">
        <label>Current FEN:</label>
        <input type="text" id="fenInput" readonly>
        <button onclick="copyFen()">Copy FEN for Gemini</button>
        <br>
        <button onclick="board.start()">Reset Board</button>
        <button class="clear" onclick="board.clear()">Clear Board</button>
    </div>

    <!-- Dependencies: JQuery and Chessboard.js -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var $fen = $('#fenInput');

        function onDrop (source, target, piece, newPos, oldPos, orientation) {
            // Update the FEN string whenever a piece is moved or added
            $fen.val(ChessBoard.objToFen(newPos) + ' w - - 0 1');
        }

        var config = {
            draggable: true,
            dropOffBoard: 'trash', // dragging off the board removes the piece
            sparePieces: true,     // enables the "bank" of pieces at the bottom/top
            position: 'start',
            onDrop: onDrop
        };

        board = ChessBoard('board', config);

        // Initialize the FEN input
        $fen.val(board.fen() + ' w - - 0 1');

        function copyFen() {
            var copyText = document.getElementById("fenInput");
            copyText.select();
            copyText.setSelectionRange(0, 99999); 
            navigator.clipboard.writeText(copyText.value);
            
            alert("FEN Copied! Now paste it into your chat with Gemini.");
        }
    </script>
</body>
</html>
