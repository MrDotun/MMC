<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mr. Dotun's Strategic Speed Lab</title>
    <style>
        :root {
            /* Light Purple and Green Theme */
            --light-sq: #e0b0ff; 
            --dark-sq: #7a2e9e;  
            --highlight: rgba(124, 252, 0, 0.7); 
            --correct: rgba(50, 205, 50, 0.6);
            --accent: #32cd32;   
            --lab-purple: #2d1b4e;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle, var(--lab-purple), #0a0514);
            background-attachment: fixed;
            color: white;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* UI Screens */
        .screen { display: none; width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; text-align: center; height: 100%; justify-content: center; }
        .active-screen { display: flex; flex-direction: column; }

        .welcome-card { 
            background: rgba(15, 10, 25, 0.95); 
            padding: 20px; 
            border-radius: 20px; 
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px var(--accent);
        }
        
        h1.big-title { 
            font-size: 2.2rem; 
            color: var(--accent); 
            margin: 0 0 10px 0; 
            text-shadow: 2px 2px #000;
            line-height: 1.1;
        }
        
        input { 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--accent); 
            width: 90%; 
            margin: 5px 0; 
            font-size: 1rem; 
            background: #1a1025; 
            color: white; 
        }

        .btn-main { 
            background: var(--accent); 
            color: #000; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-size: 1.2rem; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
            width: 100%; 
        }

        .leaderboard { 
            margin-top: 20px; 
            background: rgba(0,0,0,0.5); 
            padding: 10px; 
            border-radius: 12px; 
            max-height: 180px;
            overflow-y: auto;
        }
        .lb-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .lb-table th { color: var(--accent); border-bottom: 1px solid #444; padding: 5px; }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr); 
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 4px solid #4b0082;
        }

        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .square img { width: 85%; height: 85%; object-fit: contain; }
        .square.light { background-color: var(--light-sq); }
        .square.dark { background-color: var(--dark-sq); }
        .square.selected { background-color: var(--highlight); }
        .square.is-correct { background-color: var(--correct); pointer-events: none; }
        
        .controls { display: flex; gap: 10px; margin: 15px 0; justify-content: center; }
        .btn-small { padding: 10px 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        
        #stats { font-size: 1.1rem; margin: 5px; font-weight: bold; display: flex; justify-content: space-between; width: 100%; }
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen active-screen">
        <div class="welcome-card">
            <h1 class="big-title">STRATEGIC SPEED LAB</h1>
            <p><i>"The clock is ticking. In the endgame, every second is a square. Master your speed to conquer the board."</i></p>
            
            <div class="input-group">
                <input type="text" id="kid-name" placeholder="Assistant Name">
                <input type="number" id="kid-age" placeholder="Age">
                <input type="password" id="kid-code" placeholder="Secret Station Code">
            </div>
            
            <button class="btn-main" onclick="startNewGame()">INITIALIZE SESSION</button>

            <div class="leaderboard">
                <h3>🏆 Lab Elites</h3>
                <table class="lb-table">
                    <tbody id="leaderboard-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="stats">
            <span>👤 <span id="display-name"></span></span>
            <span style="color:var(--accent)">❤️ <span id="display-lives">3</span></span>
            <span style="color:#ffeb3b">⏳ <span id="seconds">0</span>s</span>
        </div>
        <div id="board" class="board"></div>
    </div>

<script>
    // REVERTED TO YOUR ORIGINAL STRUCTURE AND SIMPLE LOGIC
    let currentStage = 1;
    let playerName = "";
    let playerLives = 3;
    let timeLeft = 60;
    let timerInterval;
    let selectedIndex = null;
    let currentBoard = [];

    const pieceImages = {
        'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
        'P': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
        'k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
        'K': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
        'R': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        'Q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg'
    };

    function startNewGame() {
        playerName = document.getElementById('kid-name').value;
        if(!playerName) return alert("Enter Name");
        document.getElementById('welcome-screen').classList.remove('active-screen');
        document.getElementById('game-screen').classList.add('active-screen');
        document.getElementById('display-name').innerText = playerName;
        initStage(1);
    }

    function initStage(num) {
        currentStage = num;
        timeLeft = 60;
        currentBoard = new Array(64).fill('');
        if(num === 1) {
            currentBoard[0] = 'k'; currentBoard[60] = 'K'; currentBoard[63] = 'R';
        }
        startTimer();
        renderBoard();
    }

    function renderBoard() {
        const b = document.getElementById('board');
        b.innerHTML = '';
        currentBoard.forEach((p, i) => {
            const sq = document.createElement('div');
            sq.className = `square ${(Math.floor(i/8)+i)%2?'dark':'light'}`;
            if(selectedIndex === i) sq.classList.add('selected');
            if(p) { const img = document.createElement('img'); img.src = pieceImages[p]; sq.appendChild(img); }
            sq.onclick = () => handleMove(i);
            b.appendChild(sq);
        });
    }

    function handleMove(i) {
        if (selectedIndex === null) {
            if (currentBoard[i] !== '' && currentBoard[i] === currentBoard[i].toUpperCase()) selectedIndex = i;
        } else {
            // Basic Capture/Move Logic from your first structure
            currentBoard[i] = currentBoard[selectedIndex];
            currentBoard[selectedIndex] = '';
            selectedIndex = null;
            // Simple AI response
            setTimeout(basicAI, 500);
        }
        renderBoard();
    }

    function basicAI() {
        let kp = currentBoard.indexOf('k');
        if(kp === -1) return alert("Stage Clear!");
        // King just moves to the next available square
        let next = kp + 1;
        if(currentBoard[next] === '') {
            currentBoard[next] = 'k';
            currentBoard[kp] = '';
        }
        renderBoard();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('seconds').innerText = timeLeft;
            if(timeLeft <= 0) { clearInterval(timerInterval); alert("Time Up!"); }
        }, 1000);
    }
</script>
</body>
</html>
