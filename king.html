<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MASTER CODE - STRATEGIC SPEED LAB</title>
    <style>
        :root {
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --highlight: rgba(255, 235, 59, 0.7);
            --correct: rgba(76, 175, 80, 0.6);
            --accent: #f1c40f;
            --lab-blue: #00d2ff;
            --error-red: #ff4757;
        }

        /* ANIMATIONS */
        @keyframes pulse-blue {
            0% { box-shadow: 0 0 5px var(--lab-blue); }
            50% { box-shadow: 0 0 20px var(--lab-blue); }
            100% { box-shadow: 0 0 5px var(--lab-blue); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle, #1a2a6c, #101010);
            background-attachment: fixed;
            color: white;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .screen { display: none; width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; text-align: center; height: 100%; justify-content: center; }
        .active-screen { display: flex; flex-direction: column; animation: slideIn 0.5s ease-out; }

        .welcome-card, .briefing-card { 
            background: rgba(20, 20, 20, 0.95); 
            padding: 30px; 
            border-radius: 20px; 
            border: 2px solid var(--lab-blue);
            animation: pulse-blue 3s infinite;
        }
        
        h1.big-title { 
            font-size: 2.2rem; 
            color: var(--lab-blue); 
            margin: 0 0 10px 0; 
            text-shadow: 2px 2px #000;
            line-height: 1.1;
        }
        
        .welcome-card p, .briefing-card p { font-size: 1.1rem; color: #ccc; margin-bottom: 20px; line-height: 1.4; }
        
        input { 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--lab-blue); 
            width: 90%; 
            margin: 5px 0; 
            font-size: 1rem; 
            background: #222; 
            color: white; 
            transition: 0.3s;
        }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }

        .btn-main { 
            background: var(--lab-blue); 
            color: #000; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-size: 1.2rem; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
            width: 100%; 
            transition: 0.3s;
        }
        .btn-main:hover { transform: scale(1.02); filter: brightness(1.2); }
        .btn-main:active { transform: scale(0.98); }
        .btn-resume { background: #e67e22 !important; color: white !important; display: none; }

        .leaderboard { 
            margin-top: 20px; 
            background: rgba(0,0,0,0.5); 
            padding: 10px; 
            border-radius: 12px; 
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .leaderboard h3 { color: var(--accent); font-size: 1.2rem; margin: 5px 0; }
        .lb-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .lb-table th { color: var(--lab-blue); border-bottom: 1px solid #444; padding: 5px; }
        .lb-table td { padding: 5px; border-bottom: 1px solid #222; }

        #story-box { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px; border: 2px solid var(--accent); margin-bottom: 10px; }
        #story-box b { font-size: 1.4rem; color: var(--accent); display: block; } 

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr); 
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 4px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: background 0.2s; }
        .square img { width: 85%; height: 85%; object-fit: contain; transition: transform 0.2s; }
        .square:active img { transform: scale(0.8); }
        .square.light { background-color: var(--light-sq); }
        .square.dark { background-color: var(--dark-sq); }
        .square.selected { background-color: var(--highlight); animation: pulse-blue 1s infinite; }
        .square.is-correct { background-color: var(--correct); pointer-events: none; }
        
        .controls { display: flex; gap: 10px; margin: 15px 0; justify-content: center; }
        .btn-small { padding: 10px 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-small:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn-hint { background: #8e44ad; color: white; }
        .btn-exit { background: #c0392b; color: white; }

        #stats { font-size: 1.1rem; margin: 5px; font-weight: bold; display: flex; justify-content: space-between; width: 100%; }
        
        .title-badge { color: #00ff88; font-weight: bold; font-size: 1.1rem; margin-top: 5px; display: block;}
        
        .shake { animation: shake 0.4s; }
        
        .save-note { font-size: 0.85rem; color: #f1c40f; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen active-screen">
        <div class="welcome-card">
            <h1 class="big-title">MASTER CODE:<br>STRATEGIC SPEED LAB</h1>
            <p>Enter your details to begin. <b>Remember your Code to resume your progress later!</b></p>
            
            <div class="input-group">
                <input type="text" id="kid-name" placeholder="Assistant Name">
                <input type="number" id="kid-age" placeholder="Age">
                <input type="password" id="kid-code" placeholder="Secret Recovery Code (Save Key)" oninput="checkReturningPlayer()">
            </div>
            
            <button id="resume-btn" class="btn-main btn-resume" onclick="resumeGame()">RESUME EXPERIMENT</button>
            <button class="btn-main" onclick="startNewGame()">START NEW SESSION</button>

            <div class="leaderboard">
                <h3 style="display: flex; justify-content: center; align-items: center; gap: 8px;">
                    🏆 Lab Elites <span onclick="adminRefresh()" style="cursor:pointer; font-size: 1.1rem; transition: 0.5s;" id="refresh-icon">🔄</span>
                </h3>
                <table class="lb-table">
                    <thead>
                        <tr><th>Rank</th><th>Name & Title</th><th>Score</th></tr>
                    </thead>
                    <tbody id="leaderboard-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="briefing-screen" class="screen">
        <div class="briefing-card">
            <h1 id="brief-title" style="color: var(--accent);">MISSION BRIEFING</h1>
            <p id="brief-text"></p>
            <button class="btn-main" onclick="beginStage()">INITIALIZE EXPERIMENT</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="stats">
            <span>👤 <span id="display-name"></span></span>
            <span style="color:#ff4757">❤️ <span id="display-lives">3</span></span>
            <span style="color:#ffeb3b">⏳ <span id="seconds">0</span>s</span>
        </div>

        <div id="story-box">
            <b id="stage-title">EXPERIMENT 1</b>
            <p id="objective-text"></p>
        </div>

        <div class="board-container">
            <div id="board" class="board"></div>
        </div>

        <div class="controls">
            <button class="btn-small btn-hint" onclick="giveHint()">💡 Hint</button>
            <button class="btn-small btn-exit" onclick="saveAndExit()">💾 Save & Exit</button>
        </div>
    </div>

    <div id="win-modal" class="screen" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; color:#222; border-radius:20px; z-index:100; box-shadow: 0 0 50px rgba(0,0,0,0.8); height: auto; border: 4px solid var(--lab-blue);">
        <h2 id="win-title">⚡ DATA RECOVERED!</h2>
        <span id="rank-award" class="title-badge"></span>
        <p id="score-report" style="font-size: 1.2rem;"></p>
        <button id="next-btn" class="btn-main">PROCEED</button>
    </div>

<script>
    let currentStage = 1;
    let playerName = "";
    let playerAge = "";
    let playerCode = "";
    let playerLives = 3;
    let timeLeft = 40; 
    let timerInterval;
    let selectedIndex = null;
    let currentBoard = [];
    let aiCaptures = 0;

    const stageBriefings = {
        1: "Your first task is <b>Piece Recognition</b>. The Lab systems have scrambled the initial board. You must reorganize the pieces back to their correct starting home squares before the timer hits zero.",
        2: "This is a <b>Velocity Check</b>. You need to sprint your White Pawn to the 8th rank for promotion. Be careful: the Lab AI has 3 attempts to capture you. Move fast and smart!",
        3: "<b>Containment</b> protocols active. You have two Rooks. You must trap the enemy King. But beware: this King is aggressive and will hunt your Rooks if you leave them unprotected!",
        4: "<b>Final Extraction</b>. You have a Queen and a King. Your objective is to deliver Checkmate to the enemy King. He will fight desperately to stay in the center of the board.",
        5: "The <b>Speed Promotion</b> challenge. Advance your Pawn to the end of the board while using your King as a shield. The AI King will try to block your path and capture your assets!"
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if(type === 'move') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        } else if(type === 'capture') {
            osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        } else if(type === 'win') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        } else if(type === 'error') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        }
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    }

    const titles = { 1: "LAB TECHNICIAN", 2: "RESEARCH SPECIALIST", 3: "SENIOR STRATEGIST", 4: "LABORATORY DIRECTOR", 5: "SUPREME GRANDMASTER" };
    const pieceImages = {
        'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
        'P': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
        'r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        'n': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        'b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
        'q': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
        'k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
        'R': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        'N': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        'B': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
        'Q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
        'K': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };
    const s1Starting = ['r','n','b','q','k','b','n','r','p','p','p','p','p','p','p','p','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','P','P','P','P','P','P','P','P','R','N','B','Q','K','B','N','R'];

    function checkReturningPlayer() {
        const name = document.getElementById('kid-name').value.trim();
        const code = document.getElementById('kid-code').value.trim();
        const resumeBtn = document.getElementById('resume-btn');
        if(name && code) {
            const savedData = localStorage.getItem(`dotun_lab_${name}_${code}`);
            resumeBtn.style.display = savedData ? "block" : "none";
        }
    }

    function startNewGame() {
        playerName = document.getElementById('kid-name').value.trim();
        playerAge = document.getElementById('kid-age').value.trim();
        playerCode = document.getElementById('kid-code').value.trim();
        if(!playerName || !playerCode || !playerAge) { 
            document.querySelector('.welcome-card').classList.add('shake');
            setTimeout(()=>document.querySelector('.welcome-card').classList.remove('shake'), 400);
            playSound('error');
            alert("Access Denied: You must enter a Name, Age, and a Secret Code to save progress!"); 
            return; 
        }
        playerLives = 3;
        currentStage = 1;
        launchGame(1);
    }

    function resumeGame() {
        playerName = document.getElementById('kid-name').value.trim();
        playerCode = document.getElementById('kid-code').value.trim();
        const savedData = JSON.parse(localStorage.getItem(`dotun_lab_${playerName}_${playerCode}`));
        if(savedData) {
            playerLives = savedData.lives;
            currentStage = savedData.stage;
            launchGame(currentStage);
        }
    }

    function saveAndExit() {
        if(playerName && playerCode) {
            const saveData = { stage: currentStage, lives: playerLives };
            localStorage.setItem(`dotun_lab_${playerName}_${playerCode}`, JSON.stringify(saveData));
            alert(`Station Locked.\n\nTo continue later, remember:\nName: ${playerName}\nCode: ${playerCode}`);
            location.reload();
        }
    }

    function launchGame(stageNum) {
        currentStage = stageNum;
        document.getElementById('win-modal').classList.remove('active-screen');
        document.getElementById('welcome-screen').classList.remove('active-screen');
        document.getElementById('game-screen').classList.remove('active-screen');
        document.getElementById('briefing-screen').classList.add('active-screen');
        document.getElementById('brief-title').innerText = `EXPERIMENT ${stageNum}: BRIEFING`;
        document.getElementById('brief-text').innerHTML = stageBriefings[stageNum];
    }

    function beginStage() {
        document.getElementById('briefing-screen').classList.remove('active-screen');
        document.getElementById('game-screen').classList.add('active-screen');
        document.getElementById('display-name').innerText = playerName;
        document.getElementById('display-lives').innerText = playerLives;
        if(currentStage === 1) initStage1();
        else if(currentStage === 2) initStage2();
        else if(currentStage === 3) initStage3();
        else if(currentStage === 4) initStage4();
        else if(currentStage === 5) initStage5();
    }

    function handleLoss() {
        playerLives--;
        playSound('error');
        clearInterval(timerInterval);
        document.getElementById('display-lives').innerText = playerLives;
        if(playerLives <= 0) {
            alert("LAB CRITICAL FAILURE! Restarting session.");
            localStorage.removeItem(`dotun_lab_${playerName}_${playerCode}`);
            location.reload();
        } else {
            alert(`Life lost! ${playerLives} remaining.`);
            beginStage();
        }
    }

    // --- GAME LOGIC (Stages 1-5) ---
    function initStage1() {
        timeLeft = 40; 
        document.getElementById('stage-title').innerText = "EXPERIMENT 1: PIECE RECOGNITION";
        document.getElementById('objective-text').innerText = "Restore the board positions.";
        let pieces = s1Starting.filter(p => p !== '');
        let pos = Array.from({length: 64}, (_, i) => i).sort(() => Math.random() - 0.5);
        currentBoard = new Array(64).fill('');
        pos.forEach((p, i) => { if(i < pieces.length) currentBoard[p] = pieces[i]; });
        startTimer();
        renderBoard(handleS1Click);
    }
    function handleS1Click(i) {
        if (currentBoard[i] === s1Starting[i] && currentBoard[i] !== '') return;
        if (selectedIndex === null) { if (currentBoard[i] !== '') { selectedIndex = i; playSound('move'); } }
        else {
            let temp = currentBoard[i]; currentBoard[i] = currentBoard[selectedIndex]; currentBoard[selectedIndex] = temp;
            selectedIndex = null; playSound('move');
        }
        renderBoard(handleS1Click);
        if (currentBoard.every((p, idx) => p === s1Starting[idx])) winGame();
    }

    function initStage2() {
        timeLeft = 40; aiCaptures = 0;
        document.getElementById('stage-title').innerText = "EXPERIMENT 2: VELOCITY CHECK";
        document.getElementById('objective-text').innerText = "Race the Pawn to rank 8.";
        currentBoard = new Array(64).fill('');
        for(let i=8; i<16; i++) currentBoard[i] = 'p'; 
        for(let i=48; i<56; i++) currentBoard[i] = 'P'; 
        startTimer();
        renderBoard(handleS2Click);
    }
    function handleS2Click(i) {
        if (selectedIndex === null) { if (currentBoard[i] === 'P') { selectedIndex = i; playSound('move'); } }
        else {
            const diff = selectedIndex - i;
            if ((diff === 8 && currentBoard[i] === '') || (diff === 16 && selectedIndex >= 48 && currentBoard[i] === '') || ((diff === 7 || diff === 9) && currentBoard[i] === 'p')) {
                currentBoard[i] = 'P'; currentBoard[selectedIndex] = '';
                if (i < 8) winGame(); else setTimeout(aiMoveS2, 400);
            }
            selectedIndex = null;
        }
        renderBoard(handleS2Click);
    }
    function aiMoveS2() {
        for(let i=0; i<64; i++) {
            if(currentBoard[i] === 'p') {
                if(aiCaptures < 3 && (currentBoard[i+7] === 'P' || currentBoard[i+9] === 'P')) {
                    let target = currentBoard[i+7] === 'P' ? i+7 : i+9;
                    currentBoard[target] = 'p'; currentBoard[i] = ''; aiCaptures++; playSound('capture'); break;
                }
                if(currentBoard[i+8] === '') { currentBoard[i+8] = 'p'; currentBoard[i] = ''; break; }
            }
        }
        renderBoard(handleS2Click);
    }

    function initStage3() {
        timeLeft = 40;
        currentBoard = new Array(64).fill('');
        currentBoard[56] = 'R'; currentBoard[63] = 'R'; currentBoard[36] = 'k'; 
        startTimer();
        renderBoard(handleS3Click);
    }
    function handleS3Click(i) {
        if (selectedIndex === null) { if (currentBoard[i] === 'R') { selectedIndex = i; } }
        else {
            if (isLegalRookMove(selectedIndex, i)) {
                currentBoard[i] = 'R'; currentBoard[selectedIndex] = '';
                setTimeout(toughKingMove, 300);
            }
            selectedIndex = null;
        }
        renderBoard(handleS3Click);
    }
    function isLegalRookMove(s, e) {
        let sR = Math.floor(s/8), sC = s%8, eR = Math.floor(e/8), eC = e%8;
        if (sR !== eR && sC !== eC) return false;
        let step = (sR === eR) ? (e > s ? 1 : -1) : (e > s ? 8 : -8);
        for (let c = s + step; c !== e; c += step) if (currentBoard[c] !== '') return false;
        return true;
    }
    function toughKingMove() {
        let kP = currentBoard.indexOf('k');
        let moves = [kP-9, kP-8, kP-7, kP-1, kP+1, kP+7, kP+8, kP+9].filter(m => m>=0 && m<64 && Math.abs(Math.floor(m/8)-Math.floor(kP/8))<=1);
        let rook = moves.find(m => currentBoard[m] === 'R');
        if(rook) { currentBoard[kP] = ''; currentBoard[rook] = 'k'; handleLoss(); return; }
        let safe = moves.filter(m => !currentBoard.some((p,idx) => p==='R' && (Math.floor(idx/8)===Math.floor(m/8) || idx%8===m%8)));
        if(safe.length === 0) { winGame(); return; }
        currentBoard[kP] = ''; currentBoard[safe[0]] = 'k'; renderBoard(handleS3Click);
    }

    function initStage4() {
        timeLeft = 40; currentBoard = new Array(64).fill('');
        currentBoard[56] = 'Q'; currentBoard[57] = 'K'; currentBoard[43] = 'k';
        startTimer(); renderBoard(handleS4Click);
    }
    function handleS4Click(i) {
        if (selectedIndex === null) { if (['Q', 'K'].includes(currentBoard[i])) selectedIndex = i; }
        else {
            let isL = currentBoard[selectedIndex] === 'Q' ? isLegalQueenMove(selectedIndex, i) : isLegalKingMove(selectedIndex, i);
            if(isL) { currentBoard[i] = currentBoard[selectedIndex]; currentBoard[selectedIndex] = ''; setTimeout(difficultAIKing, 400); }
            selectedIndex = null; renderBoard(handleS4Click);
        }
    }
    function isLegalQueenMove(s, e) {
        let sR = Math.floor(s/8), sC = s%8, eR = Math.floor(e/8), eC = e%8;
        let dR = Math.abs(sR - eR), dC = Math.abs(sC - eC);
        if (sR !== eR && sC !== eC && dR !== dC) return false;
        let step = sR === eR ? (e > s ? 1 : -1) : sC === eC ? (e > s ? 8 : -8) : ((eR > sR ? 8 : -8) + (eC > sC ? 1 : -1));
        for (let c = s + step; c !== e; c += step) if (currentBoard[c] !== '') return false;
        return true;
    }
    function isLegalKingMove(s, e) { return Math.abs(Math.floor(s/8) - Math.floor(e/8)) <= 1 && Math.abs((s%8) - (e%8)) <= 1; }
    function difficultAIKing() {
        let kP = currentBoard.indexOf('k');
        let moves = [kP-9, kP-8, kP-7, kP-1, kP+1, kP+7, kP+8, kP+9].filter(m => m>=0 && m<64 && isLegalKingMove(kP, m));
        let safe = moves.filter(m => !isSquareAttacked(m));
        if(safe.length === 0) { if(isSquareAttacked(kP)) winGame(); else handleLoss(); return; }
        currentBoard[kP] = ''; currentBoard[safe[0]] = 'k'; renderBoard(handleS4Click);
    }
    function isSquareAttacked(pos) {
        let pQ = currentBoard.indexOf('Q'), pK = currentBoard.indexOf('K');
        if(isLegalKingMove(pK, pos)) return true;
        if(isLegalQueenMove(pQ, pos)) return true;
        return false;
    }

    function initStage5() {
        timeLeft = 40; currentBoard = new Array(64).fill('');
        currentBoard[52] = 'P'; currentBoard[60] = 'K'; currentBoard[12] = 'k'; 
        startTimer(); renderBoard(handleS5Click);
    }
    function handleS5Click(i) {
        if (selectedIndex === null) { if (['P', 'K', 'Q'].includes(currentBoard[i])) selectedIndex = i; }
        else {
            let p = currentBoard[selectedIndex], isL = false;
            if(p==='P') { if(i===selectedIndex-8 && currentBoard[i]==='') isL=true; else if((i===selectedIndex-7 || i===selectedIndex-9) && currentBoard[i]==='k') isL=true; }
            else if(p==='K') isL = isLegalKingMove(selectedIndex, i);
            else if(p==='Q') isL = isLegalQueenMove(selectedIndex, i);
            if(isL) { currentBoard[i]=p; currentBoard[selectedIndex]=''; if(p==='P' && i<8) currentBoard[i]='Q'; setTimeout(stage5AIKing, 300); }
            selectedIndex = null; renderBoard(handleS5Click);
        }
    }
    function stage5AIKing() {
        let kP = currentBoard.indexOf('k'); if(kP===-1) { winGame(); return; }
        let moves = [kP-9, kP-8, kP-7, kP-1, kP+1, kP+7, kP+8, kP+9].filter(m => m>=0 && m<64 && isLegalKingMove(kP, m));
        let pP = currentBoard.indexOf('P'); if(moves.includes(pP)) { currentBoard[kP]=''; currentBoard[pP]='k'; handleLoss(); return; }
        let safe = moves.filter(m => !isSquareAttacked(m));
        if(safe.length === 0) { if(isSquareAttacked(kP)) winGame(); else handleLoss(); return; }
        currentBoard[kP] = ''; currentBoard[safe[0]] = 'k'; renderBoard(handleS5Click);
    }

    function renderBoard(clickHandler) {
        const b = document.getElementById('board'); b.innerHTML = '';
        currentBoard.forEach((p, i) => {
            const sq = document.createElement('div');
            sq.className = `square ${(Math.floor(i/8)+i)%2?'dark':'light'}`;
            if(currentStage === 1 && p === s1Starting[i] && p !== '') sq.classList.add('is-correct');
            if(selectedIndex === i) sq.classList.add('selected');
            if(p) { const img = document.createElement('img'); img.src = pieceImages[p]; sq.appendChild(img); }
            sq.onclick = () => { if (audioCtx.state === 'suspended') audioCtx.resume(); clickHandler(i); };
            b.appendChild(sq);
        });
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--; document.getElementById('seconds').innerText = timeLeft;
            if(timeLeft <= 0) handleLoss();
        }, 1000);
    }

    function giveHint() { alert("Mr. Dotun says: Stay focused! Remember your path."); }

    function winGame() {
        clearInterval(timerInterval); playSound('win');
        const score = 100 + (timeLeft * 5);
        saveScore(playerName, score, titles[currentStage]); 
        document.getElementById('rank-award').innerText = `🔬 NEW RANK: ${titles[currentStage]}`;
        document.getElementById('score-report').innerHTML = `Assistant <b>${playerName}</b>,<br>Score: <b>${score}</b>`;
        document.getElementById('win-modal').classList.add('active-screen');
        document.getElementById('next-btn').onclick = () => {
            if(currentStage < 5) { currentStage++; launchGame(currentStage); } 
            else { alert("MAXIMUM RANK ATTAINED!"); location.reload(); }
        };
    }

    function saveScore(name, score, title) {
        let s = JSON.parse(localStorage.getItem('dotun_LB') || "[]");
        s.push({name, score, title}); s.sort((a,b) => b.score - a.score);
        localStorage.setItem('dotun_LB', JSON.stringify(s.slice(0, 10)));
        updateLeaderboardDisplay();
    }

    function updateLeaderboardDisplay() {
        let s = JSON.parse(localStorage.getItem('dotun_LB') || "[]");
        document.getElementById('leaderboard-list').innerHTML = s.map((x, i) => 
            `<tr><td>#${i+1}</td><td><b>${x.name}</b><br><small>${x.title}</small></td><td>${x.score}</td></tr>`).join('');
    }

    window.onload = updateLeaderboardDisplay;
</script>
