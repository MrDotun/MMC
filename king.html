<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Quest: Stage 1</title>
    <style>
        :root {
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --highlight: rgba(255, 255, 0, 0.6);
            --correct: rgba(0, 255, 0, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
        }

        h1 { margin-bottom: 10px; color: #f1c40f; }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 5px solid #34495e;
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .square.light { background-color: var(--light-sq); }
        .square.dark { background-color: var(--dark-sq); }
        .square.selected { background-color: var(--highlight) !important; }
        .square.is-correct { background-color: var(--correct) !important; cursor: default; }

        .piece {
            transition: transform 0.1s;
            z-index: 2;
        }

        #ui-panel {
            margin-top: 20px;
            text-align: center;
        }

        #timer { font-size: 24px; font-weight: bold; color: #e74c3c; }
        
        #key-inventory {
            margin-top: 15px;
            padding: 10px;
            background: #34495e;
            border-radius: 10px;
        }

        .key-slot {
            display: inline-block;
            width: 30px;
            height: 30px;
            margin: 5px;
            border: 2px dashed #7f8c8d;
            border-radius: 50%;
            line-height: 30px;
            font-size: 18px;
        }

        .key-earned { border-style: solid; border-color: #f1c40f; color: #f1c40f; }

        .modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <h1>STAGE 1: THE GREAT SCRAMBLE</h1>
    
    <div id="game-container">
        <div id="board" class="board"></div>
        
        <div id="win-modal" class="modal">
            <h2>STAGE CLEAR!</h2>
            <p>You found the first key!</p>
            <div style="font-size: 50px;">🗝️</div>
            <button onclick="location.reload()" style="padding: 10px 20px; cursor: pointer;">Play Again</button>
        </div>
    </div>

    <div id="ui-panel">
        <div id="timer">Time: <span id="seconds">0</span>s</div>
        <p>Click a piece, then click its <b>correct starting square</b>!</p>
        
        <div id="key-inventory">
            <span>Keys: </span>
            <div id="keys-container"></div>
        </div>
    </div>

<script>
    const boardElement = document.getElementById('board');
    const timerElement = document.getElementById('seconds');
    const winModal = document.getElementById('win-modal');
    
    // Chess piece Unicode characters
    const pieces = {
        'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
        'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    // Correct starting setup (Standard Chess)
    const startingBoard = [
        'r','n','b','q','k','b','n','r',
        'p','p','p','p','p','p','p','p',
        '','','','','','','','',
        '','','','','','','','',
        '','','','','','','','',
        '','','','','','','','',
        'P','P','P','P','P','P','P','P',
        'R','N','B','Q','K','B','N','R'
    ];

    let currentBoard = [];
    let selectedIndex = null;
    let startTime = Date.now();
    let solvedCount = 0;
    const totalPieces = startingBoard.filter(p => p !== '').length;

    function initGame() {
        // Create 20 key slots
        const keysCont = document.getElementById('keys-container');
        for(let i=0; i<20; i++) {
            const slot = document.createElement('div');
            slot.className = 'key-slot';
            slot.innerHTML = '🗝️';
            slot.style.opacity = '0.2';
            keysCont.appendChild(slot);
        }

        // Scramble logic: Get all pieces and put them in random wrong squares
        let allPieces = startingBoard.filter(p => p !== '');
        let emptySquares = new Array(64).fill('');
        
        // Randomly distribute pieces
        let positions = Array.from({length: 64}, (_, i) => i);
        positions = positions.sort(() => Math.random() - 0.5);

        positions.forEach((pos, index) => {
            if(index < allPieces.length) {
                // Ensure it doesn't accidentally start in the right spot
                if (allPieces[index] === startingBoard[pos]) {
                    // Simple swap to break correctness
                    let next = (index + 1) % allPieces.length;
                    currentBoard[pos] = allPieces[next];
                } else {
                    currentBoard[pos] = allPieces[index];
                }
            } else {
                currentBoard[pos] = '';
            }
        });

        renderBoard();
        setInterval(updateTimer, 1000);
    }

    function renderBoard() {
        boardElement.innerHTML = '';
        solvedCount = 0;

        currentBoard.forEach((piece, i) => {
            const square = document.createElement('div');
            const isDark = (Math.floor(i / 8) + i) % 2 === 1;
            square.className = `square ${isDark ? 'dark' : 'light'}`;
            
            // Check if piece is already in correct spot
            if (piece !== '' && piece === startingBoard[i]) {
                square.classList.add('is-correct');
                solvedCount++;
            }

            if (selectedIndex === i) square.classList.add('selected');
            
            square.innerHTML = pieces[piece] || '';
            square.onclick = () => handleSquareClick(i);
            boardElement.appendChild(square);
        });

        if (solvedCount === totalPieces) {
            winGame();
        }
    }

    function handleSquareClick(index) {
        // If square is already correct, ignore clicks
        if (currentBoard[index] !== '' && currentBoard[index] === startingBoard[index]) return;

        if (selectedIndex === null) {
            if (currentBoard[index] !== '') {
                selectedIndex = index;
            }
        } else {
            // SWAP pieces
            let temp = currentBoard[index];
            currentBoard[index] = currentBoard[selectedIndex];
            currentBoard[selectedIndex] = temp;
            selectedIndex = null;
        }
        renderBoard();
    }

    function updateTimer() {
        if(solvedCount < totalPieces) {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            timerElement.innerText = elapsed;
        }
    }

    function winGame() {
        winModal.style.display = 'block';
        document.querySelectorAll('.key-slot')[0].style.opacity = '1';
        document.querySelectorAll('.key-slot')[0].classList.add('key-earned');
    }

    initGame();
</script>
</body>
</html>
