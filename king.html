<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mr. Dotun's Strategic Speed Lab</title>
    <style>
        :root {
            --light-sq: #e0b0ff; 
            --dark-sq: #7a2e9e;  
            --highlight: rgba(124, 252, 0, 0.7); 
            --correct: rgba(50, 205, 50, 0.6);
            --check: rgba(255, 0, 0, 0.6);
            --accent: #32cd32;   
            --lab-blue: #bd93f9; 
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle, #2d1b4e, #0a0514);
            background-attachment: fixed;
            color: white;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .screen { display: none; width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; text-align: center; height: 100%; justify-content: center; }
        .active-screen { display: flex; flex-direction: column; }

        .welcome-card { 
            background: rgba(15, 10, 25, 0.95); 
            padding: 20px; 
            border-radius: 20px; 
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px var(--accent);
        }
        
        h1.big-title { 
            font-size: 2.2rem; 
            color: var(--accent); 
            margin: 0 0 10px 0; 
            text-shadow: 2px 2px #000;
            line-height: 1.1;
        }
        
        input { 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--accent); 
            width: 90%; 
            margin: 5px 0; 
            font-size: 1rem; 
            background: #1a1025; 
            color: white; 
        }

        .btn-main { 
            background: var(--accent); 
            color: #000; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-size: 1.2rem; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
            width: 100%; 
            transition: 0.3s;
        }
        .btn-main:hover { transform: scale(1.02); filter: brightness(1.2); }
        .btn-resume { background: #7a2e9e !important; color: white !important; display: none; }

        .leaderboard { 
            margin-top: 20px; 
            background: rgba(0,0,0,0.5); 
            padding: 10px; 
            border-radius: 12px; 
            max-height: 180px;
            overflow-y: auto;
        }
        .lb-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .lb-table th { color: var(--lab-blue); border-bottom: 1px solid #444; padding: 5px; }
        .lb-table td { padding: 5px; border-bottom: 1px solid #222; }
        .rank-tag { color: var(--accent); font-size: 0.7rem; font-style: italic; display: block; }

        #story-box { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px; border: 2px solid var(--accent); margin-bottom: 10px; }
        #story-box b { font-size: 1.4rem; color: var(--accent); display: block; } 

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr); 
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 4px solid #4b0082;
        }

        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .square img { width: 85%; height: 85%; object-fit: contain; }
        .square.light { background-color: var(--light-sq); }
        .square.dark { background-color: var(--dark-sq); }
        .square.selected { background-color: var(--highlight); }
        .square.is-correct { background-color: var(--correct); pointer-events: none; }
        
        .square.in-check { 
            background-color: var(--check) !important; 
            animation: pulse-red 1s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: inset 0 0 5px #ff0000; }
            50% { box-shadow: inset 0 0 20px #ff0000; }
            100% { box-shadow: inset 0 0 5px #ff0000; }
        }
        
        .controls { display: flex; gap: 10px; margin: 15px 0; justify-content: center; }
        .btn-small { padding: 10px 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-hint { background: #4b0082; color: white; }
        .btn-exit { background: #c0392b; color: white; }

        #stats { font-size: 1.1rem; margin: 5px; font-weight: bold; display: flex; justify-content: space-between; width: 100%; }
        .title-badge { color: var(--accent); font-weight: bold; font-size: 1.1rem; margin-top: 5px; display: block;}
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen active-screen">
        <div class="welcome-card">
            <h1 class="big-title">MR. DOTUN'S<br>STRATEGIC SPEED LAB</h1>
            <p><i>"Endgame mastery is the intersection of logic and velocity. Speed is your shield."</i></p>
            
            <div class="input-group">
                <input type="text" id="kid-name" placeholder="Assistant Name">
                <input type="number" id="kid-age" placeholder="Age">
                <input type="password" id="kid-code" placeholder="Secret Station Code" oninput="checkReturningPlayer()">
            </div>
            
            <button id="resume-btn" class="btn-main btn-resume" onclick="resumeGame()">RESUME EXPERIMENT</button>
            <button class="btn-main" onclick="startNewGame()">START NEW SESSION</button>

            <div class="leaderboard">
                <h3>🏆 Lab Elites</h3>
                <table class="lb-table">
                    <thead>
                        <tr><th>Rank</th><th>Name & Title</th><th>Score</th></tr>
                    </thead>
                    <tbody id="leaderboard-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="stats">
            <span>👤 <span id="display-name"></span></span>
            <span style="color:var(--accent)">❤️ <span id="display-lives">3</span></span>
            <span style="color:#ffeb3b">⏳ <span id="seconds">0</span>s</span>
        </div>

        <div id="story-box">
            <b id="stage-title">EXPERIMENT 1</b>
            <p id="objective-text"></p>
        </div>

        <div class="board-container">
            <div id="board" class="board"></div>
        </div>

        <div class="controls">
            <button class="btn-small btn-hint" onclick="giveHint()">💡 Hint</button>
            <button class="btn-small btn-exit" onclick="saveAndExit()">💾 Save & Exit</button>
        </div>
    </div>

    <div id="win-modal" class="screen" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#1a1025; color:white; border: 2px solid var(--accent); border-radius:20px; z-index:100; box-shadow: 0 0 50px rgba(0,0,0,0.8); height: auto;">
        <h2 id="win-title" style="color:var(--accent)">⚡ DATA RECOVERED!</h2>
        <span id="rank-award" class="title-badge"></span>
        <p id="score-report" style="font-size: 1.1rem;"></p>
        <button id="next-btn" class="btn-main">PROCEED</button>
    </div>

<script>
    let currentStage = 1;
    let playerName = "";
    let playerAge = "";
    let playerCode = "";
    let playerLives = 3;
    let timeLeft = 60;
    let timerInterval;
    let selectedIndex = null;
    let currentBoard = [];
    let isKingInCheck = false;
    let totalScore = 0;

    const titles = { 1: "LAB TECHNICIAN", 2: "RESEARCH SPECIALIST", 3: "SENIOR STRATEGIST", 4: "LABORATORY DIRECTOR" };

    const pieceImages = {
        'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
        'P': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
        'r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        'k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
        'R': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        'Q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
        'K': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };

    const s1Starting = ['r','','','','k','','','r','p','p','p','p','p','p','p','p','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','P','P','P','P','P','P','P','P','R','','','','K','','','R'];

    function checkReturningPlayer() {
        const name = document.getElementById('kid-name').value.trim();
        const code = document.getElementById('kid-code').value.trim();
        const resumeBtn = document.getElementById('resume-btn');
        if(name && code) {
            const savedData = localStorage.getItem(`dotun_lab_${name}_${code}`);
            resumeBtn.style.display = savedData ? "block" : "none";
        }
    }

    function startNewGame() {
        playerName = document.getElementById('kid-name').value.trim();
        playerAge = document.getElementById('kid-age').value.trim();
        playerCode = document.getElementById('kid-code').value.trim();
        if(!playerName || !playerCode || !playerAge) { alert("Access Denied!"); return; }
        playerLives = 3; currentStage = 1; totalScore = 0;
        launchGame(1);
    }

    function resumeGame() {
        playerName = document.getElementById('kid-name').value.trim();
        playerCode = document.getElementById('kid-code').value.trim();
        const savedData = JSON.parse(localStorage.getItem(`dotun_lab_${playerName}_${playerCode}`));
        if(savedData) { playerLives = savedData.lives; currentStage = savedData.stage; launchGame(currentStage); }
    }

    function saveAndExit() {
        if(playerName && playerCode) {
            localStorage.setItem(`dotun_lab_${playerName}_${playerCode}`, JSON.stringify({ stage: currentStage, lives: playerLives }));
            location.reload();
        }
    }

    function launchGame(stageNum) {
        currentStage = stageNum; isKingInCheck = false;
        document.getElementById('win-modal').classList.remove('active-screen');
        document.getElementById('welcome-screen').classList.remove('active-screen');
        document.getElementById('game-screen').classList.add('active-screen');
        document.getElementById('display-name').innerText = playerName;
        document.getElementById('display-lives').innerText = playerLives;
        if(stageNum === 1) initStage1();
        else if(stageNum === 2) initStage2();
        else if(stageNum === 3) initStage3();
        else initStage4();
    }

    function handleLoss() {
        playerLives--;
        clearInterval(timerInterval);
        document.getElementById('display-lives').innerText = playerLives;
        if(playerLives <= 0) {
            alert("LAB SHUTDOWN! Restarting...");
            localStorage.removeItem(`dotun_lab_${playerName}_${playerCode}`);
            location.reload();
        } else { launchGame(currentStage); }
    }

    function initStage1() {
        timeLeft = 60; document.getElementById('stage-title').innerText = "EXPERIMENT 1: PIECE RECOGNITION";
        document.getElementById('objective-text').innerText = "Restore the board structure.";
        let pieces = s1Starting.filter(p => p !== '');
        let pos = Array.from({length: 64}, (_, i) => i).sort(() => Math.random() - 0.5);
        currentBoard = new Array(64).fill('');
        pos.forEach((p, i) => { if(i < pieces.length) currentBoard[p] = pieces[i]; });
        startTimer(); renderBoard(handleS1Click);
    }

    function handleS1Click(i) {
        if (currentBoard[i] === s1Starting[i] && currentBoard[i] !== '') return;
        if (selectedIndex === null) { if (currentBoard[i] !== '') selectedIndex = i; }
        else {
            let temp = currentBoard[i]; currentBoard[i] = currentBoard[selectedIndex]; currentBoard[selectedIndex] = temp;
            selectedIndex = null;
        }
        renderBoard(handleS1Click);
        if (currentBoard.every((p, idx) => p === s1Starting[idx])) winGame();
    }

    function initStage2() {
        timeLeft = 45; document.getElementById('stage-title').innerText = "EXPERIMENT 2: VELOCITY CHECK";
        document.getElementById('objective-text').innerText = "Sprint a Pawn to the 8th rank.";
        currentBoard = new Array(64).fill('');
        for(let i=8; i<16; i++) currentBoard[i] = 'p'; 
        for(let i=48; i<56; i++) currentBoard[i] = 'P'; 
        startTimer(); renderBoard(handleS2Click);
    }

    function handleS2Click(i) {
        if (selectedIndex === null) { if (currentBoard[i] === 'P') selectedIndex = i; }
        else {
            const diff = selectedIndex - i;
            if (diff === 8 && currentBoard[i] === '') {
                currentBoard[i] = 'P'; currentBoard[selectedIndex] = '';
                if (i < 8) winGame(); else setTimeout(aiMoveS2, 400);
            }
            selectedIndex = null;
        }
        renderBoard(handleS2Click);
    }

    function aiMoveS2() {
        for(let i=0; i<64; i++) {
            if(currentBoard[i] === 'p' && currentBoard[i+8] === '') { currentBoard[i+8] = 'p'; currentBoard[i] = ''; break; }
        }
        renderBoard(handleS2Click);
    }

    function initStage3() {
        timeLeft = 25; document.getElementById('stage-title').innerText = "EXPERIMENT 3: CONTAINMENT";
        document.getElementById('objective-text').innerText = "Trap the King with Rooks.";
        currentBoard = new Array(64).fill('');
        currentBoard[56] = 'R'; currentBoard[63] = 'R'; currentBoard[36] = 'k'; 
        startTimer(); renderBoard(handleS3Click);
    }

    function handleS3Click(i) {
        if (selectedIndex === null) { if (currentBoard[i] === 'R') selectedIndex = i; }
        else {
            if (isLegalRookMove(selectedIndex, i)) {
                let target = currentBoard[i]; currentBoard[i] = 'R'; currentBoard[selectedIndex] = '';
                if (target === 'k') winGame(); else setTimeout(toughKingMove, 300);
            }
            selectedIndex = null;
        }
        renderBoard(handleS3Click);
    }

    function isLegalRookMove(s, e) {
        let sR = Math.floor(s/8), sC = s%8, eR = Math.floor(e/8), eC = e%8;
        if (sR !== eR && sC !== eC) return false;
        let step = (sR === eR) ? (e > s ? 1 : -1) : (e > s ? 8 : -8);
        for (let c = s + step; c !== e; c += step) if (currentBoard[c] !== '') return false;
        return true;
    }

    function toughKingMove() {
        let kP = currentBoard.indexOf('k');
        let possible = [kP-9, kP-8, kP-7, kP-1, kP+1, kP+7, kP+8, kP+9].filter(m => {
            let rD = Math.abs(Math.floor(m/8) - Math.floor(kP/8)), cD = Math.abs((m%8) - (kP%8));
            return m >= 0 && m < 64 && rD <= 1 && cD <= 1;
        });
        if (possible.length === 0) { winGame(); return; }
        currentBoard[kP] = ''; currentBoard[possible[0]] = 'k'; renderBoard(handleS3Click);
    }

    function initStage4() {
        timeLeft = 30; document.getElementById('stage-title').innerText = "EXPERIMENT 4: ENDGAME VELOCITY";
        document.getElementById('objective-text').innerText = "Checkmate with Queen & King.";
        currentBoard = new Array(64).fill('');
        currentBoard[0] = 'k'; currentBoard[60] = 'K'; currentBoard[61] = 'Q';
        startTimer(); renderBoard(handleS4Click);
    }

    function handleS4Click(i) {
        if (selectedIndex === null) { if (currentBoard[i] === 'Q' || currentBoard[i] === 'K') selectedIndex = i; }
        else {
            let piece = currentBoard[selectedIndex];
            let isLegal = (piece === 'Q') ? isLegalQueenMove(selectedIndex, i) : isLegalKingMove(selectedIndex, i);
            if (isLegal && currentBoard[i] === '') {
                currentBoard[i] = piece; currentBoard[selectedIndex] = ''; selectedIndex = null;
                isKingInCheck = squareAttacked(currentBoard.indexOf('k'));
                renderBoard(handleS4Click); setTimeout(difficultAIKing, 300);
            } else { selectedIndex = null; renderBoard(handleS4Click); }
        }
    }

    function isLegalQueenMove(s, e) {
        let sR = Math.floor(s/8), sC = s%8, eR = Math.floor(e/8), eC = e%8;
        let dR = Math.abs(sR - eR), dC = Math.abs(sC - eC);
        if (sR !== eR && sC !== eC && dR !== dC) return false;
        let step = (sR === eR) ? (e > s ? 1 : -1) : (sC === eC) ? (e > s ? 8 : -8) : ((eR > sR ? 8 : -8) + (eC > sC ? 1 : -1));
        for (let c = s + step; c !== e; c += step) if (currentBoard[c] !== '' && currentBoard[c] !== 'k') return false;
        return true;
    }

    function isLegalKingMove(s, e) { return Math.abs(Math.floor(s/8) - Math.floor(e/8)) <= 1 && Math.abs((s%8) - (e%8)) <= 1; }

    function squareAttacked(pos) {
        let pK = currentBoard.indexOf('K'), pQ = currentBoard.indexOf('Q');
        if (Math.abs(Math.floor(pos/8) - Math.floor(pK/8)) <= 1 && Math.abs((pos%8) - (pK%8)) <= 1) return true;
        let sR = Math.floor(pQ/8), sC = pQ%8, eR = Math.floor(pos/8), eC = pos%8, dR = Math.abs(sR - eR), dC = Math.abs(sC - eC);
        if (sR === eR || sC === eC || dR === dC) {
            let step = (sR === eR) ? (pos > pQ ? 1 : -1) : (sC === eC) ? (pos > pQ ? 8 : -8) : ((eR > sR ? 8 : -8) + (eC > sC ? 1 : -1));
            for (let c = pQ + step; c !== pos; c += step) if (currentBoard[c] !== '' && currentBoard[c] !== 'k') return false;
            return true;
        }
        return false;
    }

    function difficultAIKing() {
        let kP = currentBoard.indexOf('k');
        let possible = [kP-9, kP-8, kP-7, kP-1, kP+1, kP+7, kP+8, kP+9].filter(m => {
            let rD = Math.abs(Math.floor(m/8) - Math.floor(kP/8)), cD = Math.abs((m%8) - (kP%8));
            return m >= 0 && m < 64 && rD <= 1 && cD <= 1;
        });
        let safe = possible.filter(m => !squareAttacked(m));
        if (safe.length === 0) { if (squareAttacked(kP)) winGame(); else handleLoss(); return; }
        currentBoard[kP] = ''; currentBoard[safe[0]] = 'k'; isKingInCheck = squareAttacked(safe[0]);
        renderBoard(handleS4Click);
    }

    function renderBoard(clickHandler) {
        const b = document.getElementById('board'); b.innerHTML = '';
        currentBoard.forEach((p, i) => {
            const sq = document.createElement('div');
            sq.className = `square ${(Math.floor(i/8)+i)%2?'dark':'light'}`;
            if(p === 'k' && isKingInCheck) sq.classList.add('in-check');
            if(selectedIndex === i) sq.classList.add('selected');
            if(p) { const img = document.createElement('img'); img.src = pieceImages[p]; sq.appendChild(img); }
            sq.onclick = () => clickHandler(i); b.appendChild(sq);
        });
    }

    function startTimer() {
        clearInterval(timerInterval); document.getElementById('seconds').innerText = timeLeft;
        timerInterval = setInterval(() => { timeLeft--; document.getElementById('seconds').innerText = timeLeft; if(timeLeft <= 0) handleLoss(); }, 1000);
    }

    function winGame() {
        clearInterval(timerInterval);
        const stageScore = 100 + (timeLeft * 5);
        totalScore += stageScore;
        const currentTitle = titles[currentStage];
        saveScore(playerName, totalScore, currentTitle);
        
        document.getElementById('rank-award').innerText = "NEW RANK: " + currentTitle;
        if (currentStage === 4) {
            document.getElementById('win-title').innerText = "🔬 FINAL ANALYSIS COMPLETE";
            document.getElementById('score-report').innerHTML = `<b>LAB DIRECTOR SUMMARY</b><br>Efficiency Grade: <b>${Math.floor(totalScore/4)}%</b><br>Total Lab Points: <b>${totalScore}</b>`;
            document.getElementById('next-btn').innerText = "FINISH EXPERIMENT";
            document.getElementById('next-btn').onclick = () => location.reload();
        } else {
            document.getElementById('score-report').innerHTML = `Assistant <b>${playerName}</b>,<br>Stage Efficiency: <b>${stageScore}</b>`;
            document.getElementById('next-btn').onclick = () => launchGame(currentStage + 1);
        }
        document.getElementById('win-modal').classList.add('active-screen');
    }

    function saveScore(name, score, rank) {
        let s = JSON.parse(localStorage.getItem('dotun_LB') || "[]");
        let idx = s.findIndex(x => x.name === name);
        if(idx > -1) { if(score > s[idx].score) s[idx] = {name, score, rank}; }
        else s.push({name, score, rank});
        s.sort((a,b) => b.score - a.score);
        localStorage.setItem('dotun_LB', JSON.stringify(s.slice(0, 10)));
        updateLeaderboardDisplay();
    }

    function updateLeaderboardDisplay() {
        let s = JSON.parse(localStorage.getItem('dotun_LB') || "[]");
        document.getElementById('leaderboard-list').innerHTML = s.map((x, i) => 
            `<tr><td>#${i+1}</td><td><b>${x.name}</b><span class="rank-tag">${x.rank}</span></td><td>${x.score}</td></tr>`).join('');
    }

    function giveHint() { alert("Speed is your priority. Don't think, act!"); }
    window.onload = updateLeaderboardDisplay;
</script>
</body>
</html>
