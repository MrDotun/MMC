<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Quest</title>
    <style>
        :root {
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --highlight: rgba(255, 235, 59, 0.7);
            --correct: rgba(76, 175, 80, 0.6);
            --target: rgba(231, 76, 60, 0.4);
            --accent: #f1c40f;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-attachment: fixed;
            color: white;
            margin: 0;
            min-height: 100vh;
        }

        .screen { display: none; width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; text-align: center; }
        .active-screen { display: flex; flex-direction: column; }

        .welcome-card { background: rgba(0,0,0,0.85); padding: 30px; border-radius: 20px; border: 3px solid var(--accent); }
        h1.big-title { font-size: 3rem; color: var(--accent); margin-bottom: 10px; text-shadow: 3px 3px #000; }
        .welcome-card p { font-size: 1.3rem; line-height: 1.6; margin-bottom: 20px; }
        
        input { padding: 15px; border-radius: 8px; border: none; width: 85%; margin: 8px 0; font-size: 1.2rem; }
        .btn-main { background: #27ae60; color: white; padding: 18px 40px; border: none; border-radius: 50px; font-size: 1.5rem; cursor: pointer; font-weight: bold; margin-top: 15px; }

        .leaderboard { margin-top: 30px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; border: 1px solid var(--accent); }
        .leaderboard h3 { color: var(--accent); margin-top: 0; font-size: 1.5rem; }
        .leader-entry { display: flex; justify-content: space-between; padding: 5px 10px; border-bottom: 1px solid rgba(255,255,255,0.2); font-size: 1.1rem; }

        #story-box { background: rgba(0,0,0,0.8); padding: 25px; border-radius: 15px; border: 2px solid var(--accent); margin-bottom: 15px; }
        #story-box b { font-size: 1.8rem; color: var(--accent); display: block; margin-bottom: 10px; } 
        #story-box p { font-size: 1.3rem; margin: 0; line-height: 1.5; }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr); 
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 5px solid #333;
        }

        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .square img { width: 90%; height: 90%; object-fit: contain; }
        .square.light { background-color: var(--light-sq); }
        .square.dark { background-color: var(--dark-sq); }
        .square.selected { background-color: var(--highlight); }
        .square.is-correct { background-color: var(--correct); pointer-events: none; }
        .square.promotion-zone { border: 2px dashed var(--accent); }
        
        .hint-glow { animation: pulse 1s infinite; }
        @keyframes pulse { 0% { box-shadow: inset 0 0 0px gold; } 50% { box-shadow: inset 0 0 30px gold; } 100% { box-shadow: inset 0 0 0px gold; } }

        .controls { display: flex; gap: 15px; margin: 20px 0; justify-content: center; }
        .btn-small { padding: 12px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .btn-hint { background: #8e44ad; color: white; }
        .btn-exit { background: #c0392b; color: white; }

        #stats { font-size: 1.4rem; margin: 10px; font-weight: bold; }
        .timer-text { font-size: 1.8rem; color: #ffeb3b; }
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen active-screen">
        <div class="welcome-card">
            <h1 class="big-title">CHESS QUEST</h1>
            <p>Welcome, Young Grandmaster! Complete 20 stages to unlock the King's Treasure!</p>
            <div class="input-group">
                <input type="text" id="kid-name" placeholder="Enter Your Name">
                <input type="text" id="kid-class" placeholder="Enter Your Class">
            </div>
            <button class="btn-main" onclick="startStage(1)">START STAGE 1</button>
            <button class="btn-main" style="background:#3498db" onclick="startStage(2)">GO TO STAGE 2</button>

            <div class="leaderboard">
                <h3>🏆 Hall of Fame</h3>
                <div id="leaderboard-list"></div>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="story-box">
            <b id="stage-title">STAGE 1</b>
            <p id="objective-text"></p>
        </div>

        <div id="stats">
            Player: <span id="display-name"></span> | <span class="timer-text">⏳ <span id="seconds">0</span>s</span>
        </div>

        <div class="board-container">
            <div id="board" class="board"></div>
        </div>

        <div class="controls">
            <button class="btn-small btn-hint" onclick="giveHint()">💡 Mr. Dotun's Hint</button>
            <button class="btn-small btn-exit" onclick="location.reload()">💾 Main Menu</button>
        </div>
    </div>

    <div id="win-modal" class="screen" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; color:#222; border-radius:20px; z-index:100; box-shadow: 0 0 50px rgba(0,0,0,0.5);">
        <h2 id="win-title">🔑 KEY OBTAINED!</h2>
        <p id="score-report" style="font-size: 1.4rem;"></p>
        <button id="next-btn" class="btn-main">CONTINUE</button>
    </div>

<script>
    let currentStage = 1;
    let playerName = "";
    let playerClass = "";
    let timeLeft = 60;
    let timerInterval;
    let selectedIndex = null;
    let currentBoard = [];
    let aiCaptures = 0;

    const pieceImages = {
        'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
        'P': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
        'r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        'n': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        'b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
        'q': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
        'k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
        'R': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        'N': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        'B': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
        'Q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
        'K': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
    };

    const s1Starting = ['r','n','b','q','k','b','n','r','p','p','p','p','p','p','p','p','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','P','P','P','P','P','P','P','P','R','N','B','Q','K','B','N','R'];

    function startStage(stageNum) {
        playerName = document.getElementById('kid-name').value || "Brave Knight";
        currentStage = stageNum;
        document.getElementById('display-name').innerText = playerName;
        document.getElementById('welcome-screen').classList.remove('active-screen');
        document.getElementById('game-screen').classList.add('active-screen');
        
        if(stageNum === 1) initStage1();
        else initStage2();
    }

    // --- STAGE 1 LOGIC ---
    function initStage1() {
        timeLeft = 60;
        document.getElementById('stage-title').innerText = "STAGE 1: THE GREAT SCRAMBLE";
        document.getElementById('objective-text').innerText = "Quickly! Drag the pieces back to their home squares!";
        let pieces = s1Starting.filter(p => p !== '');
        let pos = Array.from({length: 64}, (_, i) => i).sort(() => Math.random() - 0.5);
        currentBoard = new Array(64).fill('');
        pos.forEach((p, i) => { if(i < pieces.length) currentBoard[p] = pieces[i]; });
        startTimer();
        renderBoard(handleS1Click);
    }

    function handleS1Click(i) {
        if (currentBoard[i] === s1Starting[i] && currentBoard[i] !== '') return;
        if (selectedIndex === null) { if (currentBoard[i] !== '') selectedIndex = i; }
        else {
            let temp = currentBoard[i];
            currentBoard[i] = currentBoard[selectedIndex];
            currentBoard[selectedIndex] = temp;
            selectedIndex = null;
        }
        renderBoard(handleS1Click);
        if (currentBoard.every((p, idx) => p === s1Starting[idx])) winGame();
    }

    // --- STAGE 2 LOGIC ---
    function initStage2() {
        timeLeft = 30;
        aiCaptures = 0;
        document.getElementById('stage-title').innerText = "STAGE 2: PAWN PROMOTION";
        document.getElementById('objective-text').innerText = "Lead a Pawn to the top row! (Mr. Dotun weakened the AI - it can only capture 3 times!)";
        currentBoard = new Array(64).fill('');
        for(let i=8; i<16; i++) currentBoard[i] = 'p'; // AI Pawns
        for(let i=48; i<56; i++) currentBoard[i] = 'P'; // User Pawns
        startTimer();
        renderBoard(handleS2Click);
    }

    function handleS2Click(i) {
        if (selectedIndex === null) {
            if (currentBoard[i] === 'P') selectedIndex = i;
        } else {
            const diff = selectedIndex - i;
            // Simplified Pawn Move: Forward 1 or 2, or Diagonal Capture
            if ((diff === 8 && currentBoard[i] === '') || 
                (diff === 16 && selectedIndex >= 48 && currentBoard[i] === '' && currentBoard[i+8] === '') ||
                ((diff === 7 || diff === 9) && currentBoard[i] === 'p')) {
                
                currentBoard[i] = 'P';
                currentBoard[selectedIndex] = '';
                if (i < 8) winGame(); 
                else setTimeout(aiMove, 500);
            }
            selectedIndex = null;
        }
        renderBoard(handleS2Click);
    }

    function aiMove() {
        let moved = false;
        for(let i=0; i<64; i++) {
            if(currentBoard[i] === 'p') {
                // Try capture if under limit
                if(aiCaptures < 3) {
                    if(currentBoard[i+7] === 'P') { currentBoard[i+7] = 'p'; currentBoard[i] = ''; aiCaptures++; moved = true; break; }
                    if(currentBoard[i+9] === 'P') { currentBoard[i+9] = 'p'; currentBoard[i] = ''; aiCaptures++; moved = true; break; }
                }
                // Move forward
                if(currentBoard[i+8] === '') { currentBoard[i+8] = 'p'; currentBoard[i] = ''; moved = true; break; }
            }
        }
        renderBoard(handleS2Click);
    }

    // --- HELPERS ---
    function renderBoard(clickHandler) {
        const b = document.getElementById('board');
        b.innerHTML = '';
        currentBoard.forEach((p, i) => {
            const sq = document.createElement('div');
            sq.className = `square ${(Math.floor(i/8)+i)%2?'dark':'light'}`;
            if(currentStage === 1 && p === s1Starting[i] && p !== '') sq.classList.add('is-correct');
            if(currentStage === 2 && i < 8) sq.classList.add('promotion-zone');
            if(selectedIndex === i) sq.classList.add('selected');
            if(p) {
                const img = document.createElement('img');
                img.src = pieceImages[p];
                sq.appendChild(img);
            }
            sq.onclick = () => clickHandler(i);
            b.appendChild(sq);
        });
    }

    function giveHint() {
        if(currentStage === 1) alert("Mr. Dotun says: Rook — Knight — Bishop! Check the corners!");
        else alert("Mr. Dotun says: Pawns walk straight but capture diagonally. Aim for the empty lanes!");
    }

    function startTimer() {
        clearInterval(timerInterval);
        document.getElementById('seconds').innerText = timeLeft;
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('seconds').innerText = timeLeft;
            if(timeLeft <= 0) { clearInterval(timerInterval); alert("Out of time!"); location.reload(); }
        }, 1000);
    }

    function winGame() {
        clearInterval(timerInterval);
        const score = 50 + (timeLeft * 3);
        document.getElementById('score-report').innerHTML = `Excellent work, ${playerName}!<br>Points: 50 + (${timeLeft}x3) = <b>${score}</b>`;
        document.getElementById('win-modal').classList.add('active-screen');
        document.getElementById('next-btn').onclick = () => {
            if(currentStage === 1) startStage(2);
            else location.reload();
        };
    }

    window.onload = () => {
        const scores = JSON.parse(localStorage.getItem('chessLeaderboard') || "[]");
        document.getElementById('leaderboard-list').innerHTML = scores.map(s => `<div class="leader-entry"><span>${s.name}</span> <span>${s.score} pts</span></div>`).join('');
    };
</script>
</body>
</html>
