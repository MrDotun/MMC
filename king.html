<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Quest</title>
    <style>
        :root {
            --light-sq: #f0d9b5;
            --dark-sq: #b58863;
            --highlight: rgba(255, 235, 59, 0.7);
            --correct: rgba(76, 175, 80, 0.6);
            --accent: #f1c40f;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-attachment: fixed;
            color: white;
            margin: 0;
            min-height: 100vh;
        }

        /* Screens */
        .screen { display: none; width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; text-align: center; }
        .active-screen { display: flex; flex-direction: column; }

        /* Welcome Page */
        .welcome-card { background: rgba(0,0,0,0.85); padding: 30px; border-radius: 20px; border: 3px solid var(--accent); }
        h1.big-title { font-size: 3rem; color: var(--accent); margin-bottom: 10px; text-shadow: 3px 3px #000; }
        
        /* 3. Bigger Lettering for Instructions */
        .welcome-card p { font-size: 1.3rem; line-height: 1.6; margin-bottom: 20px; }
        
        .input-group { margin: 20px 0; }
        input { padding: 15px; border-radius: 8px; border: none; width: 85%; margin: 8px 0; font-size: 1.2rem; }
        .btn-main { background: #27ae60; color: white; padding: 18px 40px; border: none; border-radius: 50px; font-size: 1.5rem; cursor: pointer; font-weight: bold; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        /* 2. Leaderboard Styling */
        .leaderboard { margin-top: 30px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; border: 1px solid var(--accent); }
        .leaderboard h3 { color: var(--accent); margin-top: 0; font-size: 1.5rem; }
        .leader-entry { display: flex; justify-content: space-between; padding: 5px 10px; border-bottom: 1px solid rgba(255,255,255,0.2); font-size: 1.1rem; }

        /* Game UI */
        #story-box { background: rgba(0,0,0,0.8); padding: 25px; border-radius: 15px; border: 2px solid var(--accent); margin-bottom: 15px; }
        #story-box b { font-size: 1.8rem; color: var(--accent); display: block; margin-bottom: 10px; } 
        #story-box p { font-size: 1.3rem; margin: 0; line-height: 1.5; }

        .board-container { width: 100%; position: relative; }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 5px solid #333;
            grid-template-rows: repeat(8, 1fr); 
        }

        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .square img { width: 90%; height: 90%; object-fit: contain; }
        .square.light { background-color: var(--light-sq); }
        .square.dark { background-color: var(--dark-sq); }
        .square.selected { background-color: var(--highlight); }
        .square.is-correct { background-color: var(--correct); pointer-events: none; }
        .hint-glow { animation: pulse 1s infinite; }

        @keyframes pulse { 0% { box-shadow: inset 0 0 0px gold; } 50% { box-shadow: inset 0 0 30px gold; } 100% { box-shadow: inset 0 0 0px gold; } }

        .controls { display: flex; gap: 15px; margin: 20px 0; justify-content: center; }
        .btn-small { padding: 12px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .btn-hint { background: #8e44ad; color: white; }
        .btn-exit { background: #c0392b; color: white; }

        #stats { font-size: 1.4rem; margin: 10px; font-weight: bold; }
        .timer-text { font-size: 1.8rem; color: #ffeb3b; }
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen active-screen">
        <div class="welcome-card">
            <h1 class="big-title">CHESS QUEST</h1>
            <p>Welcome, Young Grandmaster! Restore order to the Kingdom by fixing the board. Collect 20 keys to win!</p>
            <div class="input-group">
                <input type="text" id="kid-name" placeholder="Enter Your Name">
                <input type="text" id="kid-class" placeholder="Enter Your Class">
            </div>
            <button class="btn-main" onclick="startGame()">START ADVENTURE</button>

            <div class="leaderboard">
                <h3>🏆 Hall of Fame</h3>
                <div id="leaderboard-list">
                    <div class="leader-entry"><span>Wait for first winner...</span></div>
                </div>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="story-box">
            <b>STAGE 1: THE GREAT SCRAMBLE</b>
            <p id="objective-text">The wind scattered the Royal Guard! You have <span id="time-limit">60</span> seconds to put them back!</p>
        </div>

        <div id="stats">
            Player: <span id="display-name"></span> | <span class="timer-text">⏳ <span id="seconds">60</span>s</span>
        </div>

        <div class="board-container">
            <div id="board" class="board"></div>
        </div>

        <div class="controls">
            <button class="btn-small btn-hint" onclick="giveHint()">💡 Mr. Dotun's Hint</button>
            <button class="btn-small btn-exit" onclick="exitGame()">💾 Exit & Save</button>
        </div>
    </div>

    <div id="win-modal" class="screen" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; color:#222; border-radius:20px; z-index:100; box-shadow: 0 0 50px rgba(0,0,0,0.5);">
        <h2 style="font-size: 2rem;">🔑 QUEST COMPLETE!</h2>
        <p id="score-report" style="font-size: 1.4rem;"></p>
        <button class="btn-main" onclick="location.reload()">CLAIM KEY 🔑</button>
    </div>

<script>
    let playerName = "";
    let playerClass = "";
    let timeLimit = 60; 
    let timeLeft = 60;
    let timerInterval;
    let solvedCount = 0;
    let selectedIndex = null;
    let currentBoard = [];

    const pieceImages = {
        'r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        'n': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        'b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
        'q': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
        'k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
        'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
        'R': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        'N': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        'B': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
        'Q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
        'K': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
        'P': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg'
    };

    const startingBoard = [
        'r','n','b','q','k','b','n','r',
        'p','p','p','p','p','p','p','p',
        '','','','','','','','', '','','','','','','','',
        '','','','','','','','', '','','','','','','','',
        'P','P','P','P','P','P','P','P',
        'R','N','B','Q','K','B','N','R'
    ];

    // Initialize Leaderboard on Load
    window.onload = updateLeaderboardDisplay;

    function startGame() {
        playerName = document.getElementById('kid-name').value || "Brave Knight";
        playerClass = document.getElementById('kid-class').value || "Beginner";
        
        document.getElementById('display-name').innerText = playerName;
        document.getElementById('welcome-screen').classList.remove('active-screen');
        document.getElementById('game-screen').classList.add('active-screen');
        
        initGame();
    }

    function initGame() {
        const saved = localStorage.getItem('chessQuest_stage1');
        if(saved) {
            currentBoard = JSON.parse(saved);
        } else {
            let allPieces = startingBoard.filter(p => p !== '');
            let positions = Array.from({length: 64}, (_, i) => i).sort(() => Math.random() - 0.5);
            currentBoard = new Array(64).fill('');
            positions.forEach((pos, index) => {
                if(index < allPieces.length) currentBoard[pos] = allPieces[index];
            });
        }
        renderBoard();
        timerInterval = setInterval(updateTimer, 1000);
    }

    function renderBoard() {
        const boardElement = document.getElementById('board');
        boardElement.innerHTML = '';
        solvedCount = 0;

        currentBoard.forEach((piece, i) => {
            const square = document.createElement('div');
            const isDark = (Math.floor(i / 8) + i) % 2 === 1;
            square.className = `square ${isDark ? 'dark' : 'light'}`;
            
            if (piece !== '' && piece === startingBoard[i]) {
                square.classList.add('is-correct');
                solvedCount++;
            }

            if (selectedIndex === i) square.classList.add('selected');
            if (piece !== '') {
                const img = document.createElement('img');
                img.src = pieceImages[piece];
                square.appendChild(img);
            }
            square.onclick = () => handleSquareClick(i);
            boardElement.appendChild(square);
        });

        if (solvedCount === 32) winGame();
    }

    function handleSquareClick(index) {
        if (currentBoard[index] !== '' && currentBoard[index] === startingBoard[index]) return;

        if (selectedIndex === null) {
            if (currentBoard[index] !== '') selectedIndex = index;
        } else {
            let temp = currentBoard[index];
            currentBoard[index] = currentBoard[selectedIndex];
            currentBoard[selectedIndex] = temp;
            selectedIndex = null;
        }
        renderBoard();
    }

    function updateTimer() {
        timeLeft--;
        document.getElementById('seconds').innerText = timeLeft;
        if(timeLeft <= 0) {
            clearInterval(timerInterval);
            alert("Time's up! Try again!");
            location.reload();
        }
    }

    // 1. Updated Mr. Dotun's Hint
    function giveHint() {
        for(let i=0; i<64; i++) {
            if(currentBoard[i] !== '' && currentBoard[i] !== startingBoard[i]) {
                const squares = document.querySelectorAll('.square');
                squares[i].classList.add('hint-glow');
                setTimeout(() => squares[i].classList.remove('hint-glow'), 2500);
                
                // Updated text
                alert("Mr. Dotun says: Remember the order! \n\n Rook — Knight — Bishop \n\n Look at the glowing piece!");
                break;
            }
        }
    }

    function exitGame() {
        localStorage.setItem('chessQuest_stage1', JSON.stringify(currentBoard));
        alert("Game Saved, " + playerName + "!");
        location.reload();
    }

    function winGame() {
        clearInterval(timerInterval);
        const score = 50 + (timeLeft * 3);
        
        saveScore(playerName, score);

        document.getElementById('score-report').innerHTML = `
            Master <b>${playerName}</b>,<br>
            Points: 50 + (${timeLeft}s x 3)<br>
            <b>Final Score: ${score}</b>
        `;
        document.getElementById('win-modal').classList.add('active-screen');
        localStorage.removeItem('chessQuest_stage1'); // Clear save on win
    }

    function saveScore(name, score) {
        let scores = JSON.parse(localStorage.getItem('chessLeaderboard') || "[]");
        scores.push({name, score});
        scores.sort((a,b) => b.score - a.score);
        scores = scores.slice(0, 5); // Keep top 5
        localStorage.setItem('chessLeaderboard', JSON.stringify(scores));
    }

    function updateLeaderboardDisplay() {
        const scores = JSON.parse(localStorage.getItem('chessLeaderboard') || "[]");
        const list = document.getElementById('leaderboard-list');
        if(scores.length > 0) {
            list.innerHTML = scores.map(s => 
                `<div class="leader-entry"><span>${s.name}</span> <span>${s.score} pts</span></div>`
            ).join('');
        }
    }
</script>
</body>
</html>
