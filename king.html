<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>King Dotun's Quest: The Golden Crown</title>
    <style>
        :root {
            --gold: #d4af37;
            --bg: #121212;
            --parchment: #f2e3c9;
            --purple-glow: rgba(155, 38, 182, 0.7);
            --ice: #00ccff;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Georgia', serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }

        /* --- UI & Overlays --- */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .scroll {
            background: var(--parchment);
            color: #2c1e05;
            padding: 20px;
            width: 85%;
            max-width: 450px;
            border: 8px double #8b5a2b;
            border-radius: 5px;
            text-align: center;
            box-shadow: 0 0 50px #000;
        }

        input {
            padding: 12px;
            font-size: 1rem;
            width: 80%;
            border: 2px solid #8b5a2b;
            margin: 10px 0;
            text-align: center;
        }

        .start-btn {
            background: #8b5a2b;
            color: white;
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        /* --- Responsive Game Interface --- */
        #game-interface {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .stats-bar {
            background: #333;
            padding: 10px;
            width: 90%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            border: 2px solid var(--gold);
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 1rem;
        }

        /* --- The RESPONSIVE Board --- */
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 5px solid #444;
            width: 90vw;
            height: 90vw;
            max-width: 480px;
            max-height: 480px;
            background: #222;
            position: relative;
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(20px, 6vw, 35px);
            cursor: pointer;
            position: relative;
        }

        .white { background: #eeeed2; }
        .black { background: #769656; }

        /* --- Visual Effects --- */
        .ripple {
            position: absolute;
            border: 3px solid var(--gold);
            border-radius: 50%;
            animation: ripple-effect 0.4s ease-out forwards;
            pointer-events: none;
        }

        @keyframes ripple-effect {
            from { width: 0%; height: 0%; opacity: 1; }
            to { width: 200%; height: 200%; opacity: 0; }
        }

        .queen-threat { background: var(--purple-glow) !important; }
        .frozen { background: var(--ice) !important; animation: shake 0.1s infinite; }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, -1px); }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="scroll">
            <h1 id="scroll-title">📜 Hero's Registry</h1>
            <div id="scroll-content">
                <input type="text" id="heroName" placeholder="Enter Hero Name..." maxlength="12">
                <br>
                <button class="start-btn" onclick="processName()">CLAIM QUEST</button>
                <div id="hof-entries" style="margin-top:15px; font-size: 0.8rem; border-top: 1px solid #8b5a2b; padding-top:10px;"></div>
            </div>
        </div>
    </div>

    <div id="game-interface">
        <div class="stats-bar">
            <span>Score: <b id="score-val">250</b></span>
            <span>Time: <b id="timer-val">15.00</b></span>
            <span>Lives: <b id="lives-val">🛡️🛡️🛡️</b></span>
        </div>
        <div id="board" class="board"></div>
    </div>

    <audio id="snd-gallop" src="https://actions.google.com/sounds/v1/foley/horse_gallop_fast.ogg"></audio>
    <audio id="snd-music" loop src="https://actions.google.com/sounds/v1/ambient/dark_forest_wind_loop.ogg"></audio>

    <script>
        let gameState = { active: false, score: 250, lives: 3, time: 15.0, playerPos: { r: 7, c: 7 }, queenPos: { r: 0, c: 0 }, godMode: false };

        function processName() {
            const name = document.getElementById('heroName').value.trim();
            if (!name) return alert("A hero needs a name!");
            if (name.toUpperCase() === "DOTUN") { gameState.godMode = true; gameState.lives = 99; }
            
            document.getElementById('scroll-title').innerText = "Escape the Queen!";
            document.getElementById('scroll-content').innerHTML = `
                <p>Carry the Crown to <b>a1</b> (top-left). Avoid the purple shadows!</p>
                <button class="start-btn" onclick="launchGame()">START</button>
            `;
        }

        function launchGame() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('game-interface').style.display = 'flex';
            document.getElementById('snd-music').play();
            gameState.active = true;
            buildBoard();
            setInterval(tick, 10);
            setInterval(teleportQueen, 2000);
        }

        function buildBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.createElement('div');
                    sq.className = `square ${(r + c) % 2 === 0 ? 'white' : 'black'}`;
                    sq.id = `s-${r}-${c}`;
                    sq.onclick = () => handleMove(r, c);
                    board.appendChild(sq);
                }
            }
            render();
        }

        function handleMove(r, c) {
            if (!gameState.active) return;
            const rDist = Math.abs(gameState.playerPos.r - r);
            const cDist = Math.abs(gameState.playerPos.c - c);

            if (rDist <= 1 && cDist <= 1) {
                document.getElementById('snd-gallop').currentTime = 0;
                document.getElementById('snd-gallop').play();
                gameState.playerPos = { r, c };
                if (document.getElementById(`s-${r}-${c}`).classList.contains('queen-threat')) takeDamage();
                render();
                if (r === 0 && c === 0) alert("Victory!"); 
            }
        }

        function teleportQueen() {
            if (!gameState.active) return;
            document.querySelectorAll('.queen-threat').forEach(s => s.classList.remove('queen-threat'));
            gameState.queenPos = { r: Math.floor(Math.random() * 8), c: Math.floor(Math.random() * 8) };
            for (let i = 0; i < 8; i++) {
                document.getElementById(`s-${gameState.queenPos.r}-${i}`).classList.add('queen-threat');
                document.getElementById(`s-${i}-${gameState.queenPos.c}`).classList.add('queen-threat');
            }
            render();
        }

        function takeDamage() {
            gameState.lives--;
            document.getElementById('lives-val').innerText = "🛡️".repeat(gameState.lives);
            const sq = document.getElementById(`s-${gameState.playerPos.r}-${gameState.playerPos.c}`);
            sq.classList.add('frozen');
            setTimeout(() => sq.classList.remove('frozen'), 1000);
            if (gameState.lives <= 0) location.reload();
        }

        function tick() {
            if (!gameState.active) return;
            gameState.time -= 0.01;
            document.getElementById('timer-val').innerText = Math.max(0, gameState.time).toFixed(2);
            if (gameState.time <= 0) location.reload();
        }

        function render() {
            document.querySelectorAll('.square').forEach(s => s.innerText = '');
            document.getElementById(`s-${gameState.playerPos.r}-${gameState.playerPos.c}`).innerText = '👑';
            document.getElementById(`s-${gameState.queenPos.r}-${gameState.queenPos.c}`).innerText = '👸';
        }
    </script>
</body>
</html>
