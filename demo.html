<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
</head>
<body style="margin:0; background: #000;">
    <div id="game-container"></div>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            physics: { default: 'arcade' },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);
        let ball, goalie, goal, graphics, isDragging = false;
        let startPoint, endPoint;

        function preload() {
            this.load.image('ball', 'https://labs.phaser.io/assets/sprites/shinyball.png');
            this.load.image('goalie', 'https://labs.phaser.io/assets/sprites/phaser-dude.png');
        }

        function create() {
            // 1. The Field & Goal
            this.add.rectangle(400, 300, 800, 600, 0x1b5e20); // Dark Green Turf
            goal = this.add.rectangle(400, 100, 300, 100, 0xffffff, 0.2).setStrokeStyle(4, 0xffffff);
            this.physics.add.existing(goal, true);

            // 2. The Goalkeeper (Simple AI)
            goalie = this.physics.add.sprite(400, 120, 'goalie').setScale(1.5);
            goalie.setCollideWorldBounds(true);
            goalie.setTint(0xff0000); // Red for the opponent

            // 3. The Ball (Premium Gold Glow)
            ball = this.physics.add.sprite(400, 500, 'ball');
            ball.setCircle(16).setCollideWorldBounds(true).setDamping(true).setDrag(0.95);
            if (this.renderer.type === Phaser.WEBGL) ball.postFX.addGlow(0xffd700, 4, 0);

            // 4. The "Pad" & Control Logic
            graphics = this.add.graphics();
            
            this.input.on('pointerdown', (pointer) => {
                if (ball.body.speed < 1) { // Only shoot if ball is still
                    isDragging = true;
                    startPoint = { x: pointer.x, y: pointer.y };
                }
            });

            this.input.on('pointermove', (pointer) => {
                if (isDragging) {
                    graphics.clear();
                    graphics.lineStyle(4, 0xffd700, 0.5);
                    graphics.lineBetween(ball.x, ball.y, ball.x + (startPoint.x - pointer.x), ball.y + (startPoint.y - pointer.y));
                }
            });

            this.input.on('pointerup', (pointer) => {
                if (isDragging) {
                    isDragging = false;
                    graphics.clear();
                    
                    // Calculate Force based on the drag distance
                    const distX = startPoint.x - pointer.x;
                    const distY = startPoint.y - pointer.y;
                    
                    ball.setVelocity(distX * 2, distY * 2);
                    
                    // Trigger Goalkeeper Dive
                    this.time.delayedCall(100, () => goalieDive(distX));
                }
            });

            // 5. Collision: Save or Goal?
            this.physics.add.overlap(ball, goalie, () => {
                ball.setVelocity(0);
                ball.setPosition(400, 500);
                alert("SAVED! The keeper read you like a book.");
            });

            this.physics.add.overlap(ball, goal, () => {
                if (ball.y < 120) {
                    ball.setVelocity(0);
                    ball.setPosition(400, 500);
                    alert("GOAL!!! Top Bins!");
                }
            });
        }

        function goalieDive(targetX) {
            // Simple AI: 50% chance to dive correctly
            const diveDir = Math.random() > 0.5 ? targetX : -targetX;
            goalie.setVelocityX(diveDir * 1.5);
            game.scene.scenes[0].time.delayedCall(1000, () => {
                goalie.setVelocityX(0);
                goalie.x = 400; // Reset keeper
            });
        }

        function update() {
            ball.angle += ball.body.speed / 5;
        }
    </script>
</body>
</html>
