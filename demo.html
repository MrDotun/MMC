<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2700 GM Course Preparer</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; max-width: 1000px; margin: 20px auto; background: var(--bg); color: var(--primary); padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 200px; border: 2px solid #ddd; border-radius: 8px; padding: 15px; font-family: monospace; font-size: 14px; margin-bottom: 10px; transition: border-color 0.3s; }
        textarea:focus { border-color: var(--accent); outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #34495e; transform: translateY(-1px); }
        .game-block { background: #fff; border: 1px solid #eee; border-left: 6px solid var(--accent); padding: 20px; margin-top: 20px; border-radius: 4px; position: relative; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-prompt { background: var(--accent); }
        .btn-prompt:hover { background: #d35400; }
        pre { background: #2d3436; color: #dfe6e9; padding: 15px; border-radius: 6px; overflow-x: auto; font-size: 13px; white-space: pre-wrap; }
        .badge { background: #eee; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        h1 { text-align: center; color: var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏆 2700 GM Course Preparer</h1>
        <p>Paste your raw PGN below. I will split the variations and create high-level prompts for Gemini to annotate them like a world-class Grandmaster.</p>
        
        <textarea id="pgnInput" placeholder="Paste your PGN analysis here..."></textarea>
        <button onclick="processPGN()">Generate GM Study Material</button>

        <div id="output"></div>
    </div>

    <script>
        function processPGN() {
            const input = document.getElementById('pgnInput').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = '';

            const headerRegex = /\[.*?\]/g;
            const headers = input.match(headerRegex) || [];
            const headerText = headers.join('\n');
            let moveText = input.replace(headerRegex, '').trim();

            const variations = [];
            
            function parse(text, history = "") {
                let current = "";
                let i = 0;
                while (i < text.length) {
                    if (text[i] === '(') {
                        let count = 1, start = i + 1, end = start;
                        while (count > 0 && end < text.length) {
                            if (text[end] === '(') count++;
                            if (text[end] === ')') count--;
                            end++;
                        }
                        parse(text.substring(start, end - 1), history + " " + current);
                        i = end;
                    } else {
                        current += text[i];
                        i++;
                    }
                }
                variations.push((history + " " + current).trim());
            }

            parse(moveText);

            variations.forEach((game, idx) => {
                if (game.length < 10) return;
                const cleanGame = game.replace(/\s\s+/g, ' ').trim();
                const fullPgn = `${headerText}\n\n${cleanGame} *`;
                
                // Optimized Prompt with moves included
                const gmPrompt = `Pretend you're a human 2700+ ELO GRANDMASTER. 
You are writing a professional, elite-level course on the Ruy Lopez for White.
Your tone should be human, simple English.

TASK:
1. Review the PGN below.
2. Annotate EVERY key move. 
3. Keep all existing symbols ($1, !, etc.) and highlights ([%csl...]).
4. Provide the final result as a SINGLE PGN BLOCK.

IMPORTANT: Wrap the final PGN in a markdown code block so I can copy it easily.

PGN TO ANNOTATE:
${fullPgn}`;

                const block = document.createElement('div');
                block.className = 'game-block';
                
                // Escaping strings for HTML attributes
                const escapedPrompt = gmPrompt.replace(/`/g, "\\`").replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const escapedPgn = fullPgn.replace(/`/g, "\\`").replace(/'/g, "\\'").replace(/"/g, '&quot;');

                block.innerHTML = `
                    <div class="controls">
                        <span class="badge">Variation ${idx + 1}</span>
                        <button class="btn-prompt" onclick="copyText(this, \`${escapedPrompt}\`)">📋 Copy Prompt for Gemini</button>
                        <button onclick="copyText(this, \`${escapedPgn}\`)">Copy Raw PGN</button>
                    </div>
                    <pre>${fullPgn}</pre>
                `;
                outputDiv.appendChild(block);
            });
        }

        // Updated copy function with fallback for local files
        function copyText(btn, text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showSuccess(btn);
                }).catch(err => {
                    fallbackCopy(btn, text);
                });
            } else {
                fallbackCopy(btn, text);
            }
        }

        function fallbackCopy(btn, text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showSuccess(btn);
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function showSuccess(btn) {
            const original = btn.innerText;
            btn.innerText = "✅ Copied!";
            setTimeout(() => btn.innerText = original, 2000);
        }
    </script>
</body>
</html>
