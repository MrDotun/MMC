<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2700 GM Course Tool v2.0</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --success: #27ae60; --bg: #f1f2f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; max-width: 1100px; margin: 20px auto; background: var(--bg); color: var(--primary); padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px; }
        textarea { width: 100%; height: 200px; border: 2px solid #ddd; border-radius: 8px; padding: 15px; font-family: 'Courier New', Courier, monospace; font-size: 14px; margin-bottom: 10px; transition: 0.3s; resize: vertical; }
        textarea:focus { border-color: var(--accent); outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 12px 22px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #34495e; transform: translateY(-1px); }
        .btn-prompt { background: var(--accent); }
        .btn-assemble { background: var(--success); width: 100%; font-size: 1.2em; margin-top: 15px; }
        .game-block { background: #fff; border: 1px solid #eee; border-left: 6px solid var(--accent); padding: 20px; margin-top: 20px; border-radius: 4px; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        pre { background: #2d3436; color: #dfe6e9; padding: 15px; border-radius: 6px; overflow-x: auto; font-size: 13px; white-space: pre-wrap; border: 1px solid #000; }
        .badge { background: #eee; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #555; }
        h1, h2 { text-align: center; margin-bottom: 10px; }
        .instruction { font-style: italic; color: #666; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏆 2700 GM Course Preparer</h1>
        <p class="instruction">1. Paste PGN with branches. 2. Copy Prompts. 3. Let Gemini add human comments (keeping symbols/highlights).</p>
        
        <textarea id="pgnInput" placeholder="Paste your raw PGN with symbols and branches here..."></textarea>
        <button onclick="processPGN()">1. Split into GM Prompts</button>

        <div id="output"></div>
    </div>

    <div class="container" style="border-top: 8px solid var(--success);">
        <h2>🧩 Master Course Assembler</h2>
        <p class="instruction">Paste Gemini's responses. I will combine them into a single clean PGN file.</p>
        
        <textarea id="geminiOutput" placeholder="Paste Gemini's PGN results here..."></textarea>
        <button class="btn-assemble" onclick="assemblePGN()">2. Export Final Combined PGN</button>
        <pre id="finalPgnPreview" style="display:none; margin-top: 20px;"></pre>
    </div>

    <script>
        function processPGN() {
            const input = document.getElementById('pgnInput').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = '';

            const headerRegex = /\[.*?\]/g;
            const headers = input.match(headerRegex) || [];
            const headerText = headers.join('\n');
            let moveText = input.replace(headerRegex, '').trim();

            const variations = [];
            
            // This parser now correctly handles nested variations and keeps the full path
            function parse(text, history = "") {
                let current = "";
                let i = 0;
                while (i < text.length) {
                    if (text[i] === '(') {
                        let count = 1, start = i + 1, end = start;
                        while (count > 0 && end < text.length) {
                            if (text[end] === '(') count++;
                            if (text[end] === ')') count--;
                            end++;
                        }
                        parse(text.substring(start, end - 1), history + " " + current);
                        i = end;
                    } else {
                        current += text[i];
                        i++;
                    }
                }
                variations.push((history + " " + current).trim());
            }

            parse(moveText);

            variations.forEach((game, idx) => {
                if (game.length < 15) return;
                const cleanMoves = game.replace(/\s\s+/g, ' ').trim();
                const fullPgn = `${headerText}\n\n${cleanMoves} *`;
                
                const gmPrompt = `Pretend you are a 2700+ ELO HUMAN GM. 
Annotate this PGN for a Ruy Lopez course.

CRITICAL RULES:
1. Do NOT add any comments { } to moves 1, 2, 3, or 4.
2. DO NOT delete or change existing symbols ($16, $1, !, etc.) or highlights ([%csl...], [%cal...]).
3. Starting from Move 5, add high-level HUMAN verbal commentary inside curly braces { } in simple English.
4. Output the result ONLY as a single PGN block in a markdown code block.

PGN:
${fullPgn}`;

                const block = document.createElement('div');
                block.className = 'game-block';
                const escapedPrompt = gmPrompt.replace(/`/g, "\\`").replace(/'/g, "\\'").replace(/"/g, '&quot;');
                
                block.innerHTML = `
                    <div class="controls">
                        <span class="badge">Variation ${idx + 1}</span>
                        <button class="btn-prompt" onclick="copyText(this, \`${escapedPrompt}\`)">📋 Copy Prompt</button>
                    </div>
                    <pre>${fullPgn}</pre>
                `;
                outputDiv.appendChild(block);
            });
        }

        function assemblePGN() {
            const input = document.getElementById('geminiOutput').value;
            const preview = document.getElementById('finalPgnPreview');
            
            // Find all PGN sections starting from moves or headers
            const pgnRegex = /(?:\[Event[\s\S]*?\]\s+)?1\.\s[\s\S]*?\*/g;
            const matches = input.match(pgnRegex);

            if (!matches) {
                alert("No valid PGN found in the input.");
                return;
            }

            // Cleanup: ensure move 1-4 comments are removed in the final merge if Gemini slipped up
            let masterPgn = matches.map(pgn => {
                let cleaned = pgn.trim();
                // Regex to remove any {comments} appearing before the 5th move number
                cleaned = cleaned.replace(/^(.*?1\..*?2\..*?3\..*?4\..*?)(\s\{.*?\})/s, '$1');
                return cleaned;
            }).join('\n\n');

            preview.textContent = masterPgn;
            preview.style.display = 'block';

            const blob = new Blob([masterPgn], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "Final_GM_Course.pgn";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function copyText(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const original = btn.innerText;
                btn.innerText = "✅ Copied!";
                setTimeout(() => btn.innerText = original, 2000);
            });
        }
    </script>
</body>
</html>
