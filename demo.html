<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFOC 2500 Trainer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        #board-container { width: 95vw; max-width: 380px; margin: 10px 0; touch-action: none; }
        #board { width: 100%; border: 2px solid #30363d; border-radius: 4px; }
        .game-menu { width: 100%; overflow-x: auto; display: flex; gap: 8px; padding-bottom: 10px; -webkit-overflow-scrolling: touch; }
        .game-btn { background: #1c2128; border: 1px solid #30363d; padding: 10px 15px; border-radius: 6px; color: #58a6ff; white-space: nowrap; font-size: 13px; font-weight: bold; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 95vw; max-width: 380px; }
        button { padding: 14px; background: #21262d; color: #fff; border: 1px solid #30363d; border-radius: 8px; font-weight: bold; font-size: 14px; }
        button:active { background: #30363d; border-color: #ffd700; }
        .hidden { opacity: 0.01 !important; filter: blur(25px); pointer-events: none; }
        #status { background: #1c2128; padding: 12px; width: 90vw; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #ffd700; font-family: monospace; font-size: 14px; text-align: center; }
        .active-mode { background: #8b0000 !important; border-color: #f85149 !important; }
    </style>
</head>
<body>

    <div id="status">SELECT A MASTER GAME</div>

    <div class="game-menu">
        <button class="game-btn" onclick="loadFullGame(0)">London (Carlsen)</button>
        <button class="game-btn" onclick="loadFullGame(1)">London (Kamsky)</button>
        <button class="game-btn" onclick="loadFullGame(2)">French (Uhlmann)</button>
        <button class="game-btn" onclick="loadFullGame(3)">French (Grischuk)</button>
    </div>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <div class="controls">
        <button onclick="prevMove()">◀ PREV</button>
        <button onclick="nextMove()">NEXT ▶</button>
        <button id="visionBtn" onclick="toggleVision()">VISION OFF</button>
        <button id="trainBtn" onclick="toggleTraining()">AUTO-HIDE OFF</button>
        <button onclick="askEngine()" style="grid-column: span 2; background: #238636;">GM HINT / ENGINE</button>
        <button onclick="resetSandbox()" style="grid-column: span 2;">RESET BOARD</button>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var trainingMode = false;
        var moveIndex = -1;
        var history = [];

        const fullGames = [
            "1. d4 Nf6 2. Bf4 d5 3. e3 c5 4. c3 Nc6 5. Nd2 e6 6. Ngf3 Bd6 7. Bxd6 Qxd6 8. Bb5 O-O 9. Qa4 Bd7 10. Qa3 b6 11. O-O a5 12. c4 Nb4 13. Bxd7 Nxd7 14. Rac1 Rfd8 15. cxd5 exd5 16. dxc5 bxc5 17. Rfd1 a4 18. Ne1 Qb6 19. Nd3 Nxd3 20. Qxd3 Nf6 21. Rc2 c4 22. Qd4 Qxd4 23. exd4 Rdb8 24. Nb1 Ne8 25. Nc3 Nc7 26. f3 Kf8 27. Kf2 Ke7 28. Ke3 Kd6 29. Kd2 Nb5 30. Nxb5+ Rxb5 31. Kc1 a3 32. bxa3 Rxa3 33. Rb2 Rxb2 34. Kxb2 Re3 35. Rd2 Kc6 36. Kc2 Kb5 37. Kd1 c3 38. Re2 Rd3+ 39. Kc2 Kc4 40. a4 Rxd4 41. a5 Rd3 42. a6 d4 43. a7 Re3 44. Rxe3 dxe3 45. a8=Q e2 46. Qe4+ 1-0",
            "1. d4 Nf6 2. Bf4 d5 3. e3 c5 4. c3 Nc6 5. Nd2 e6 6. Ngf3 Bd6 7. Bg3 O-O 8. Bd3 b6 9. Ne5 Bb7 10. f4 Ne7 11. Qf3 Nf5 12. Bf2 Be7 13. g4 Nd6 14. g5 Nfe4 15. O-O-O c4 16. Bc2 b5 17. h4 b4 18. Nxe4 dxe4 19. Qh3 bxc3 20. bxc3 Qa5 21. Kd2 Nb5 22. Rc1 Nxc3 23. Kd1 Na2 24. Be1 c3 25. Rb1 Bd5 26. g6 fxg6 27. h5 g5 28. h6 g6 29. Nxg6 hxg6 30. h7+ Kh8 31. Qh6 Nb4 32. Qxg6 Nxc2 33. Rg1 Nxe3+ 34. Ke2 Qa2+ 35. Kxe3 gxf4# 0-1",
            "1. e4 e6 2. d4 d5 3. e5 c5 4. c3 Nc6 5. Nf3 Qb6 6. a3 c4 7. Nbd2 Na5 8. Be2 Bd7 9. O-O Ne7 10. Rb1 Qc7 11. Qe1 Ba4 12. Bd1 Bxd1 13. Qxd1 Nec6 14. b4 cxb3 15. Nxb3 Nc4 16. a4 Be7 17. Nfd2 N6a5 18. Nxa5 Nxa5 19. Bb2 O-O 20. f4 f5 21. exf6 Rxf6 22. g3 Raf8 23. Qe2 Bd6 24. Rbe1 a6 25. Qd3 Qd7 26. c4 Bb4 27. Bc3 Bxc3 28. Qxc3 Nxc4 29. Nxc4 Rc8 30. Nb6 Rxc3 31. Nxd7 Rf7 32. Nc5 1-0",
            "1. e4 e6 2. d4 d5 3. e5 c5 4. c3 Nc6 5. Nf3 Qb6 6. a3 Nh6 7. b4 cxd4 8. cxd4 Nf5 9. Bb2 Bd7 10. g4 Nfe7 11. Nc3 Na5 12. Na4 Qc6 13. Nc5 Nc4 14. Bc3 b6 15. Nxd7 Qxd7 16. Bd3 Rc8 17. O-O Ng6 18. Bd2 Be7 19. Qe2 O-O 20. Kg2 f6 21. exf6 Bxf6 22. g5 Be7 23. Bxg6 hxg6 24. Rfe1 e5 25. Nxe5 Nxe5 26. dxe5 Qf5 27. f4 Rc2 28. Rac1 Rfc8 29. Kg3 a5 30. Rxc2 Rxc2 31. Qe3 a4 32. Rc1 Rb2 33. Rc3 Rb1 34. Qd3 Rg1+ 35. Kf2 Rd1 36. Qxf5 gxf5 37. Ke2 Rh1 38. g6 Rxh2+ 39. Kd1 Rh1+ 40. Kc2 d4 41. Rc8+ Bf8 42. e6 1-0"
        ];

        $(document).ready(function() {
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDrop: function(s, t) {
                    let m = game.move({from: s, to: t, promotion: 'q'});
                    if (!m) return 'snapback';
                    handleMoveDisplay(m.san);
                }
            });
            $(window).resize(board.resize);
        });

        function handleMoveDisplay(san) {
            $('#status').text("MOVE: " + san);
            if (trainingMode) {
                setTimeout(() => { $('#board').addClass('hidden'); }, 300);
            }
        }

        function loadFullGame(i) {
            game.load_pgn(fullGames[i]);
            history = game.history();
            game.reset();
            moveIndex = -1;
            board.position('start');
            $('#status').text("GAME LOADED - PRESS NEXT");
            $('#board').removeClass('hidden');
        }

        function nextMove() {
            if (moveIndex < history.length - 1) {
                moveIndex++;
                let m = game.move(history[moveIndex]);
                board.position(game.fen());
                handleMoveDisplay(m.san);
            } else {
                $('#status').text("END OF GAME");
            }
        }

        function prevMove() {
            if (moveIndex >= 0) {
                game.undo();
                moveIndex--;
                board.position(game.fen());
                $('#board').removeClass('hidden');
                $('#status').text(moveIndex >= 0 ? "BACK: " + history[moveIndex] : "START");
            }
        }

        function toggleVision() {
            $('#board').toggleClass('hidden');
            $('#visionBtn').text($('#board').hasClass('hidden') ? "VISION ON" : "VISION OFF");
        }

        function toggleTraining() {
            trainingMode = !trainingMode;
            $('#trainBtn').toggleClass('active-mode').text(trainingMode ? "AUTO-HIDE ON" : "AUTO-HIDE OFF");
            if (!trainingMode) $('#board').removeClass('hidden');
        }

        function askEngine() {
            let hint = history[moveIndex + 1] ? history[moveIndex + 1] : "Game Finished";
            alert("2500 Logic Hint: " + hint);
        }

        function resetSandbox() {
            game.reset();
            moveIndex = -1;
            board.start();
            $('#board').removeClass('hidden');
            $('#status').text("BOARD RESET");
        }
    </script>
</body>
</html>
