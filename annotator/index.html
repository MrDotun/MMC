<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM AI Annotator | Dotun Akinseye</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <style>
        #gm-stream::-webkit-scrollbar { width: 5px; }
        #gm-stream::-webkit-scrollbar-thumb { background: #16a34a; border-radius: 10px; }
    </style>
</head>
<body class="bg-black text-white font-sans">

    <div id="setup-overlay" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-6">
        <div class="bg-gray-900 border border-green-800 p-8 rounded-2xl max-w-lg w-full shadow-2xl">
            <h2 class="text-green-500 font-mono text-xl mb-6 font-bold tracking-widest">AI ANNOTATOR SETUP</h2>
            <input type="password" id="api-key" placeholder="Enter Gemini API Key" class="w-full bg-black border border-gray-800 p-3 rounded mb-4 outline-none focus:border-green-500">
            <textarea id="pgn-data" placeholder="Paste PGN here..." class="w-full bg-black border border-gray-800 p-3 rounded h-40 mb-6 outline-none focus:border-green-500 font-mono text-sm"></textarea>
            <button onclick="startAnalysis()" class="w-full bg-green-700 hover:bg-green-600 py-3 rounded-lg font-bold transition-all">START ANALYSIS</button>
        </div>
    </div>

    <div id="main-ui" class="hidden grid grid-cols-1 lg:grid-cols-2 h-screen">
        <div class="flex flex-col items-center justify-center p-4 bg-gray-900">
            <div id="myBoard" style="width: 100%; max-width: 500px"></div>
            <div id="status" class="mt-4 font-mono text-xs text-green-600 animate-pulse uppercase">Waiting for engine...</div>
        </div>
        <div class="flex flex-col bg-black border-l border-gray-800">
            <div class="p-4 border-b border-gray-800 bg-gray-900 flex justify-between">
                <span class="text-green-500 font-mono text-sm font-bold">GM CONSOLE OUTPUT</span>
            </div>
            <div id="gm-stream" class="flex-grow overflow-y-auto p-6 space-y-8 scroll-smooth"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
