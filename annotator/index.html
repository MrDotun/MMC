<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chess Annotator | Mr Dotun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <style>
        #gm-stream::-webkit-scrollbar { width: 4px; }
        #gm-stream::-webkit-scrollbar-thumb { background: #16a34a; border-radius: 10px; }
        .variation-log { color: #3b82f6; font-size: 0.7rem; font-style: italic; margin: 8px 0; border-left: 2px solid #1e3a8a; padding-left: 8px; }
    </style>
</head>
<body class="bg-black text-white h-screen overflow-hidden">

    <div id="setup-overlay" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border-2 border-green-900 p-6 rounded-2xl max-w-lg w-full shadow-2xl">
            <h2 class="text-green-500 font-mono text-lg mb-4 font-bold uppercase tracking-tighter text-center">AI Grandmaster Initialization</h2>
            <input type="password" id="api-key" placeholder="Paste Gemini API Key" class="w-full bg-black border border-gray-800 p-3 rounded mb-4 outline-none focus:border-green-500 text-white text-sm">
            <textarea id="pgn-data" placeholder="Paste your PGN game here..." class="w-full bg-black border border-gray-800 p-3 rounded h-40 mb-6 outline-none focus:border-green-500 font-mono text-xs text-white"></textarea>
            <button onclick="startAnalysis()" class="w-full bg-green-700 hover:bg-green-600 py-3 rounded-lg font-bold transition-all uppercase text-sm">Begin Annotation</button>
        </div>
    </div>

    <div id="main-ui" class="hidden grid grid-cols-1 lg:grid-cols-2 h-full">
        <div class="flex flex-col items-center justify-center p-4 bg-gray-900">
            <div id="myBoard" class="w-full max-w-[450px]"></div>
            <div id="engine-status" class="mt-4 font-mono text-[10px] text-green-600 uppercase">Engine Standing By...</div>
        </div>
        <div class="flex flex-col border-l border-gray-800">
            <div class="p-3 bg-black border-b border-gray-800 font-mono text-green-500 text-xs flex justify-between">
                <span>GM ANALYSIS STREAM</span>
                <span id="move-count" class="text-gray-600">0 Moves</span>
            </div>
            <div id="gm-stream" class="flex-grow overflow-y-auto p-4 space-y-6 bg-black">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
