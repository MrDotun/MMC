<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Successful | Dotun.Dev</title>
    <style>
        body {
            background-color: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .success-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }
        .icon {
            font-size: 50px;
            color: #4ade80;
            margin-bottom: 20px;
        }
        h2 {
            color: #2D1B4D;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background: #2D1B4D;
            color: #4ade80;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background: #3d2666;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon">✔</div>
        <h2>Submission Received!</h2>
        <p>Thank you for reaching out. The school admissions office has been notified and will contact you shortly.</p>
        <a href="index.html" class="btn">Return to Home</a>
    </div>

</body>
</html>
