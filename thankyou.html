<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOTUN | Private Collection</title>
    <style>
        :root {
            --gold: #C5A059;
            --dark: #0A0A0B;
            --soft-white: #F4F4F4;
        }

        body {
            background-color: var(--dark);
            color: var(--soft-white);
            font-family: 'Times New Roman', serif;
            margin: 0;
            padding: 0;
        }

        header {
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
        }

        .brand-name {
            font-size: 3rem;
            letter-spacing: 12px;
            color: var(--gold);
            text-transform: uppercase;
            margin: 0;
            font-weight: lighter;
        }

        .tagline {
            font-size: 0.8rem;
            letter-spacing: 5px;
            color: #777;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .gallery {
            max-width: 1100px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            padding: 20px;
        }

        .item-card {
            background: #141416;
            border-radius: 4px;
            padding: 15px;
            text-align: center;
            transition: all 0.5s ease;
            border: 1px solid transparent;
        }

        .item-card:hover {
            border: 1px solid var(--gold);
            background: #1A1A1D;
        }

        .item-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            filter: grayscale(20%);
            transition: 0.5s;
        }

        .item-card:hover img {
            filter: grayscale(0%);
        }

        .name {
            font-size: 1.2rem;
            margin: 20px 0 5px 0;
            letter-spacing: 2px;
            color: var(--gold);
        }

        .price {
            font-size: 1.1rem;
            color: #AAA;
            margin-bottom: 25px;
        }

        /* Beautifully Embedded Checkout */
        .btn-reserve {
            display: block;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 15px;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-reserve:hover {
            background: var(--gold);
            color: var(--dark);
        }

        footer {
            text-align: center;
            padding: 100px 20px 40px;
            opacity: 0.4;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<header>
    <h1 class="brand-name">Dotun</h1>
    <div class="tagline">The Art of Timekeeping</div>
</header>

<div class="gallery">
    <div class="item-card">
        <img src="1.jpg" alt="Luxury Piece">
        <div class="name">Onyx Grandeur</div>
        <div class="price">₦12,000</div>
        <a href="https://wa.me/2348025028105?text=I%20am%20interested%20in%20the%20Onyx%20Grandeur" class="btn-reserve">Secure Item</a>
    </div>

    <div class="item-card">
        <img src="1 (1).jpg" alt="Luxury Piece">
        <div class="name">Ivory Prestige</div>
        <div class="price">₦12,000</div>
        <a href="https://wa.me/2348025028105?text=I%20am%20interested%20in%20the%20Ivory%20Prestige" class="btn-reserve">Secure Item</a>
    </div>

    <div class="item-card">
        <img src="1 (2).jpg" alt="Luxury Piece">
        <div class="name">Celestial Gold</div>
        <div class="price">₦12,000</div>
        <a href="https://wa.me/2348025028105?text=I%20am%20interested%20in%20the%20Celestial%20Gold" class="btn-reserve">Secure Item</a>
    </div>

    <div class="item-card">
        <img src="1 (3).jpg" alt="Luxury Piece">
        <div class="name">Royal Chronos</div>
        <div class="price">₦12,000</div>
        <a href="https://wa.me/2348025028105?text=I%20am%20interested%20in%20the%20Royal%20Chronos" class="btn-reserve">Secure Item</a>
    </div>

    <div class="item-card">
        <img src="1 (4).jpg" alt="Luxury Piece">
        <div class="name">Midnight Heirloom</div>
        <div class="price">₦12,000</div>
        <a href="https://wa.me/2348025028105?text=I%20am%20interested%20in%20the%20Midnight%20Heirloom" class="btn-reserve">Secure Item</a>
    </div>
</div>

<footer>
    &copy; 2026 DOTUN PRIVATE CLIENTELLE | LAGOS
</footer>

</body>
</html>
