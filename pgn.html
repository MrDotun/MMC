<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind Masters | Chess Class</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>

    <style>
        :root { 
            --primary: #2D1B4D; 
            --secondary: #4ade80; 
            --bg: #0f172a; 
            --text: #f8fafc; 
            --card: #1e293b; 
            --danger: #ef4444; 
            --gold: #fbbf24; 
            --glass: rgba(30, 41, 59, 0.7);
        }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            touch-action: manipulation;
            overflow-x: hidden;
        }
        
        .container { 
            width: 100%; 
            max-width: 440px; 
            background: var(--glass); 
            padding: 25px; 
            border-radius: 28px; 
            box-sizing: border-box; 
            border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(15px); 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            margin-bottom: 20px; 
        }

        .hidden { display: none !important; }
        
        /* This keeps the audio call running invisibly in the background */
        #jitsi-container { position: fixed; top: 0; left: 0; width: 1px; height: 1px; z-index: -1; opacity: 0.01; pointer-events: none; }

        #password-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%); 
            z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px); 
        }

        .pass-card { 
            background: rgba(30, 41, 59, 0.4); padding: 40px 30px; border-radius: 32px; 
            border: 1px solid rgba(251, 191, 36, 0.3); text-align: center; width: 350px; 
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5); backdrop-filter: blur(20px);
        }

        .pass-input { 
            text-align: center; font-size: 24px; letter-spacing: 12px; 
            background: rgba(0,0,0,0.4) !important; border: 1px solid rgba(251, 191, 36, 0.2) !important;
            padding: 15px !important; border-radius: 16px !important; margin-bottom: 20px !important;
            color: var(--gold) !important; width: 100%; box-sizing: border-box;
        }

        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 14px 20px; border-radius: 16px; margin-bottom: 12px; }
        
        .live-badge { background: var(--danger); color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        #board-wrapper { position: relative; width: 100%; margin-bottom: 15px; }
        #masterBoard { border: 6px solid #1e293b; border-radius: 12px; width: 100%; }
        
        .btn { padding: 16px; cursor: pointer; border-radius: 14px; border: none; background: linear-gradient(135deg, #4c1d95 0%, #2D1B4D 100%); color: var(--secondary); font-weight: 800; width: 100%; text-transform: uppercase; font-size: 12px; margin-top: 10px; }
        .btn-gold { background: var(--gold); color: #000; }
        
        input[type="text"] { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary); margin: 20px 0; font-weight: 900; letter-spacing: 4px; text-align: center;">MIND MASTERS</h1>

    <div id="password-overlay" class="hidden">
        <div class="pass-card">
            <div class="welcome-text" style="color:var(--gold); font-size:14px; letter-spacing:2px; font-weight:700;">Welcome to</div>
            <div class="classroom-name" style="color:#fff; font-size:24px; font-weight:900; margin-bottom:25px;">Mr Dotun Chess Classroom</div>
            <div style="font-size: 40px; margin-bottom: 20px;">🏰</div>
            <input type="password" id="access-key" class="pass-input" placeholder="••••" maxlength="10">
            <button class="btn btn-gold" onclick="verifyAccess()">ENTER ARENA</button>
        </div>
    </div>

    <div id="section-lobby" class="container" style="text-align:center;">
        <h3 style="color: var(--gold);">VIRTUAL CAMPUS</h3>
        <input type="text" id="user-display-name" placeholder="Enter your name...">
        <button class="btn btn-gold" onclick="showPassScreen()">🚀 JOIN SESSION</button>
    </div>

    <div id="section-masterclass" class="container hidden">
        <div class="status-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="live-badge">LIVE</div>
                <span id="role-text" style="font-weight:bold;">STUDENT</span>
            </div>
            <div id="mic-control-area"></div>
        </div>

        <div id="board-wrapper">
            <div id="masterBoard"></div>
        </div>

        <button class="btn" style="background:transparent; border:1px solid rgba(255,255,255,0.1); color:#94a3b8;" onclick="location.reload()">EXIT CLASS</button>
    </div>

    <div id="jitsi-container"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
            authDomain: "assignments-de95a.firebaseapp.com",
            projectId: "assignments-de95a",
            storageBucket: "assignments-de95a.firebasestorage.app",
            messagingSenderId: "1088073398299",
            appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        
        let myData = { name: "" };
        let jitsiAPI = null;
        let micOn = false;

        function showPassScreen() { 
            const name = $("#user-display-name").val();
            if(!name) { alert("Enter Name"); return; }
            myData.name = name;
            $("#password-overlay").removeClass("hidden"); 
        }

        function verifyAccess() {
            const pass = $("#access-key").val();
            if (pass === "1122" || pass === "dotun1234") {
                $("#password-overlay").addClass("hidden");
                $("#section-lobby").addClass("hidden");
                $("#section-masterclass").removeClass("hidden");
                
                initAudio(); // Starts the "Phone Call" background logic
                // initBoard(); // Trigger your board setup here
            } else { alert("Wrong Key"); }
        }

        function initAudio() {
            // This initializes a real-time voice channel
            jitsiAPI = new JitsiMeetExternalAPI("meet.jit.si", {
                roomName: "MindMasters_Live_Room_2026",
                width: "100%", height: 1,
                parentNode: document.querySelector('#jitsi-container'),
                configOverwrite: { 
                    startWithAudioMuted: true, 
                    prejoinPageEnabled: false // This bypasses the Jitsi join screen for a seamless experience
                },
                userInfo: { displayName: myData.name }
            });

            jitsiAPI.addEventListeners({ 
                audioMuteStatusChanged: (e) => { 
                    micOn = !e.muted; 
                    renderMicUI(); 
                }
            });
            renderMicUI();
        }

        function renderMicUI() {
            const color = micOn ? 'var(--secondary)' : 'var(--danger)';
            const label = micOn ? '🎤 MIC ACTIVE' : '🔇 MIC MUTED';
            $("#mic-control-area").html(`
                <button onclick="jitsiAPI.executeCommand('toggleAudio')" 
                style="background:none; border:1px solid ${color}; color:${color}; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:10px; font-weight:800;">
                ${label}
                </button>`);
        }
    </script>
</body>
</html>
