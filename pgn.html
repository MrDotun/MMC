<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mind Masters | Chess Class</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root { 
            --primary: #2D1B4D; 
            --secondary: #4ade80; 
            --bg: #0f172a; 
            --text: #f8fafc; 
            --card: #1e293b; 
            --danger: #ef4444; 
            --gold: #fbbf24; 
            --glass: rgba(30, 41, 59, 0.7);
        }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at top, #1e293b 0%, #070b14 100%); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            touch-action: manipulation;
            overflow-x: hidden;
        }
        
        .container { 
            width: 100%; 
            max-width: 440px; 
            background: var(--glass); 
            padding: 25px; 
            border-radius: 28px; 
            box-sizing: border-box; 
            border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(15px); 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            margin-bottom: 20px; 
        }
        .hidden { display: none !important; }
        
        #password-overlay { 
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%); 
            z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px); 
        }
        .pass-card { 
            background: rgba(30, 41, 59, 0.4); 
            padding: 40px 30px; 
            border-radius: 32px; 
            border: 1px solid rgba(251, 191, 36, 0.3); 
            text-align: center; 
            width: 350px; 
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(251, 191, 36, 0.05); 
            backdrop-filter: blur(20px);
        }
        .welcome-text { color: var(--gold); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
        .classroom-name { color: #fff; font-size: 24px; font-weight: 900; margin-bottom: 25px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .pass-input { 
            text-align: center; font-size: 24px; letter-spacing: 12px; 
            background: rgba(0,0,0,0.4) !important; border: 1px solid rgba(251, 191, 36, 0.2) !important;
            padding: 15px !important; border-radius: 16px !important; margin-bottom: 20px !important;
            color: var(--gold) !important; transition: 0.3s;
        }

        .master-arena-card { border: 1px solid rgba(251, 191, 36, 0.2); }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 14px 20px; border-radius: 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
        
        .live-badge { background: var(--danger); color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .master-badge { background: var(--gold); color: #000; padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 900; }

        .top-vn-bar { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.4); padding: 10px 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px; transition: background 0.5s; }
        .latest-audio-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }

        #board-wrapper { position: relative; width: 100%; margin-bottom: 15px; touch-action: none; }
        #masterBoard { 
            border: 6px solid #1e293b; 
            border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            width: 100%; 
            touch-action: none; 
        }
        #drawingCanvas { position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none; border-radius: 8px; }

        .analysis-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .tool-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); padding: 12px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.15); }

        .btn { padding: 16px; cursor: pointer; border-radius: 14px; border: none; background: linear-gradient(135deg, #4c1d95 0%, #2D1B4D 100%); color: var(--secondary); font-weight: 800; width: 100%; text-transform: uppercase; transition: 0.3s; font-size: 12px; margin-top: 10px; letter-spacing: 1px; }
        .btn-gold { background: var(--gold); color: #000; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3); }

        #chat-container { margin-top: 15px; background: rgba(2, 6, 23, 0.4); border-radius: 16px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        #master-chat-box { height: 150px; overflow-y: auto; font-size: 12px; margin-bottom: 12px; padding-right: 5px; }
        .chat-name { color: var(--gold); font-weight: bold; margin-bottom: 4px; }
        
        input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; width: 100%; box-sizing: border-box; font-family: inherit;}
        .chat-input-wrap { display: flex; gap: 8px; align-items: center; }

        .vn-btn { background: #334155; color: white; border: none; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; position: relative;}
        .vn-btn.recording { background: var(--danger); animation: pulse 1s infinite; }
        .rec-label { position: absolute; bottom: -18px; font-size: 8px; color: var(--danger); font-weight: 900; white-space: nowrap; }
        
        audio { height: 35px; width: 100%; margin-top: 5px; filter: hue-rotate(90deg) brightness(1.5); }
        .del-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; margin-left: 5px; vertical-align: middle;}
        .highlight-square { box-shadow: inset 0 0 3px 3px yellow; }

        /* Voice Call UI Styles */
        .call-ui { background: rgba(74, 222, 128, 0.1); border: 1px solid var(--secondary); border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .call-btn { background: var(--secondary); color: #000; font-weight: bold; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .hangup-btn { background: var(--danger); color: white; font-weight: bold; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary); margin: 20px 0; font-weight: 900; letter-spacing: 4px; text-align: center;">MIND MASTERS</h1>

    <div id="password-overlay" class="hidden">
        <div class="pass-card">
            <div class="welcome-text">Welcome to</div>
            <div class="classroom-name">Mr Dotun Chess Classroom</div>
            <div style="font-size: 40px; margin-bottom: 20px;">🏰</div>
            <input type="password" id="access-key" class="pass-input" placeholder="••••" maxlength="10">
            <button class="btn btn-gold" onclick="verifyAccess()">ENTER ARENA</button>
            <p style="font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 20px;">SECURITY AUTHORIZATION REQUIRED</p>
        </div>
    </div>

    <div id="section-lobby" class="container">
        <h3 style="text-align: center; color: var(--gold);">VIRTUAL CAMPUS</h3>
        <input type="text" id="user-display-name" placeholder="Enter your name...">
        <button class="btn btn-gold" onclick="showPassScreen()">🚀 JOIN SESSION</button>
    </div>

    <div id="section-masterclass" class="container master-arena-card hidden">
        
        <div id="voice-call-ui" class="call-ui">
            <span id="call-status" style="font-size: 12px; font-weight: bold;">Voice: Ready</span>
            <div id="call-controls">
                <button id="start-call-btn" class="call-btn" onclick="startVoiceCall()">📞 CALL STUDENT</button>
                <button id="end-call-btn" class="hangup-btn hidden" onclick="endVoiceCall()">🛑 END</button>
            </div>
        </div>

        <div class="status-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="live-badge">LIVE</div>
                <span id="role-text">STUDENT</span>
            </div>
        </div>

        <div class="top-vn-bar" id="notif-bar">
            <div style="position:relative; display:flex; flex-direction:column; align-items:center; gap:5px;">
                <button id="top-vn-btn" class="vn-btn" onclick="toggleVN()">🎤</button>
                <button id="cancel-vn-btn" class="hidden" onclick="cancelRecording()" style="background:var(--danger); border:none; color:white; font-size:8px; padding:2px 5px; border-radius:4px; cursor:pointer;">CANCEL</button>
                <span id="rec-indicator" class="rec-label hidden">RECORDING...</span>
            </div>
            <div id="latest-audio-container" class="latest-audio-wrap">
                <span style="font-size: 11px; color: #94a3b8; font-style: italic;">No voice notes yet...</span>
            </div>
        </div>

        <div id="board-wrapper">
            <div id="masterBoard"></div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div id="student-tools" class="analysis-tools">
            <button class="tool-btn" onclick="syncMasterPosition('start')">🔄 RESET POS</button>
            <button id="setup-mode-btn" class="tool-btn" onclick="toggleSetupMode()">🧩 SETUP MODE</button>
            <button id="student-clear-btn" class="tool-btn hidden" onclick="emptyBoard()" style="color:var(--danger); grid-column: span 2;">🕳️ CLEAR BOARD</button>
        </div>

        <div id="master-admin-panel" class="hidden">
            <div class="analysis-tools" style="margin-top: 0;">
                <button id="toggle-draw-btn" class="tool-btn" onclick="toggleDrawMode()">✏️ DRAW MODE</button>
                <button class="tool-btn" onclick="clearDrawing()">🧼 ERASE LINES</button>
                <button class="tool-btn" onclick="emptyBoard()" style="color:var(--danger);">🕳️ EMPTY BOARD</button>
            </div>
        </div>

        <div id="chat-container">
            <div id="master-chat-box"></div>
            <div class="chat-input-wrap">
                <input type="text" id="master-chat-input" placeholder="Type..." onkeypress="if(event.key==='Enter') sendMasterChat()">
                <button class="btn" style="width: 60px; padding: 12px; margin:0;" onclick="sendMasterChat()">➤</button>
            </div>
        </div>
        <button class="btn" style="margin-top:20px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8;" onclick="location.reload()">EXIT CLASS</button>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcSVTifrJhzXvhQ4m1UyObtCKd8QnKEUw",
          authDomain: "assignments-de95a.firebaseapp.com",
          projectId: "assignments-de95a",
          storageBucket: "assignments-de95a.firebasestorage.app",
          messagingSenderId: "1088073398299",
          appId: "1:1088073398299:web:dab1f57ac1d63b10dba0be"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myData = { name: "" }; 
        let masterBoard = null;
        let isCoach = false;
        let isDrawing = false;
        let drawModeActive = false;
        let setupModeActive = false;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let wasCancelled = false;
        let clickSource = null;

        // PeerJS Variables
        let peer;
        let myPeerId;
        let localVoiceStream;
        let currentCall;

        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');

        function showPassScreen() { 
            const name = $("#user-display-name").val();
            if(!name) return;
            myData.name = name;
            $("#password-overlay").removeClass("hidden"); 
        }

        async function verifyAccess() {
            const pass = $("#access-key").val();
            if (pass === "dotun1234") {
                isCoach = true;
                myData.name = "Coach Dotun";
                $("#master-admin-panel").removeClass("hidden");
                $("#role-text").html('<span class="master-badge">COACH</span>');
            } else if (pass === "1122") {
                isCoach = false;
                $("#role-text").text("STUDENT");
                $("#start-call-btn").addClass("hidden"); // Student waits for Coach to call
            } else { alert("Invalid Key"); return; }

            // Initialize Voice & Peer
            initPeerJS();

            // Initialize Recorder for Voice Notes
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                localVoiceStream = stream; // Save stream for PeerJS
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    if(wasCancelled) { audioChunks = []; wasCancelled = false; return; }
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => { sendVN(reader.result); audioChunks = []; };
                };
            } catch (err) { console.error("Mic error:", err); }

            $("#password-overlay").addClass("hidden");
            $("#section-lobby").addClass("hidden");
            $("#section-masterclass").removeClass("hidden");
            
            initBoard();
            initDrawingSync();
            initChat(); 
        }

        // --- PEERJS VOICE CALL LOGIC ---
        function initPeerJS() {
            peer = new Peer();

            peer.on('open', (id) => {
                myPeerId = id;
                console.log("My Peer ID:", id);
                // Update Firebase with current Peer ID so others can call
                if(!isCoach) {
                    db.collection("special_rooms").doc("masterclass_arena").update({ studentPeerId: id });
                }
            });

            // Listen for Incoming Calls (Students will auto-answer the coach)
            peer.on('call', (call) => {
                $("#call-status").text("📞 IN CALL").css("color", "var(--secondary)");
                $("#end-call-btn").removeClass("hidden");
                
                call.answer(localVoiceStream);
                currentCall = call;

                call.on('stream', (remoteStream) => {
                    document.getElementById('remote-audio').srcObject = remoteStream;
                });
            });
        }

        function startVoiceCall() {
            db.collection("special_rooms").doc("masterclass_arena").get().then((doc) => {
                const data = doc.data();
                if (data.studentPeerId) {
                    $("#call-status").text("📡 CONNECTING...");
                    const call = peer.call(data.studentPeerId, localVoiceStream);
                    currentCall = call;

                    call.on('stream', (remoteStream) => {
                        $("#call-status").text("📞 IN CALL").css("color", "var(--secondary)");
                        $("#start-call-btn").addClass("hidden");
                        $("#end-call-btn").removeClass("hidden");
                        document.getElementById('remote-audio').srcObject = remoteStream;
                    });
                } else {
                    alert("No student found in room yet!");
                }
            });
        }

        function endVoiceCall() {
            if (currentCall) currentCall.close();
            $("#call-status").text("Voice: Disconnected").css("color", "white");
            $("#end-call-btn").addClass("hidden");
            if(isCoach) $("#start-call-btn").removeClass("hidden");
        }

        // --- EXISTING CHESS & DRAWING LOGIC (STAYED INTACT) ---

        function initBoard() {
            const config = {
                draggable: true, dropOffBoard: 'snapback', position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDrop: (source, target) => {
                    setTimeout(() => { db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() }); }, 100);
                }
            };
            masterBoard = ChessBoard('masterBoard', config);
            
            document.getElementById('masterBoard').addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

            $('#masterBoard').on('click', '.square-55d63', function() {
                if (setupModeActive) return;
                const square = $(this).attr('data-square');
                const boardPos = masterBoard.position();
                if (!clickSource) {
                    if (boardPos[square]) {
                        clickSource = square;
                        $('.square-55d63').removeClass('highlight-square');
                        $(this).addClass('highlight-square');
                    }
                } else {
                    const move = clickSource + '-' + square;
                    masterBoard.move(move);
                    $('.square-55d63').removeClass('highlight-square');
                    setTimeout(() => { db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() }); }, 100);
                    clickSource = null;
                }
            });

            db.collection("special_rooms").doc("masterclass_arena").onSnapshot(doc => {
                const data = doc.data();
                if(data?.fen && masterBoard.fen() !== data.fen) { masterBoard.position(data.fen); }
            });
            setTimeout(resizeCanvas, 500);
        }

        function toggleSetupMode() {
            setupModeActive = !setupModeActive;
            const currentFen = masterBoard.fen();
            masterBoard = ChessBoard('masterBoard', {
                draggable: true, dropOffBoard: 'trash', sparePieces: setupModeActive, position: currentFen,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDrop: (source, target) => {
                    setTimeout(() => { db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() }); }, 100);
                }
            });
            
            document.getElementById('masterBoard').addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

            const btnText = setupModeActive ? "✅ FINISH SETUP" : "🧩 SETUP MODE";
            $("#setup-mode-btn").text(btnText).css("background", setupModeActive ? "var(--secondary)" : "");
            
            if(!isCoach) {
                if(setupModeActive) $("#student-clear-btn").removeClass("hidden");
                else $("#student-clear-btn").addClass("hidden");
            }

            if(!setupModeActive) db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() });
        }

        function toggleVN() {
            if (!mediaRecorder) { alert("Mic not ready"); return; }
            if (!isRecording) {
                audioChunks = []; wasCancelled = false;
                mediaRecorder.start(); isRecording = true;
                $("#top-vn-btn").addClass("recording").text("🛑");
                $("#rec-indicator, #cancel-vn-btn").removeClass("hidden");
            } else {
                mediaRecorder.stop(); isRecording = false;
                $("#top-vn-btn").removeClass("recording").text("🎤");
                $("#rec-indicator, #cancel-vn-btn").addClass("hidden");
            }
        }

        function cancelRecording() {
            if(isRecording) {
                wasCancelled = true; mediaRecorder.stop(); isRecording = false;
                $("#top-vn-btn").removeClass("recording").text("🎤");
                $("#rec-indicator, #cancel-vn-btn").addClass("hidden");
            }
        }

        function sendVN(base64) {
            db.collection("special_rooms").doc("masterclass_arena").collection("messages").add({
                sender: myData.name, audio: base64, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function deleteVN(docId) {
            if(confirm("Delete this voice note?")) {
                db.collection("special_rooms").doc("masterclass_arena").collection("messages").doc(docId).delete();
            }
        }

        function initChat() {
            db.collection("special_rooms").doc("masterclass_arena").collection("messages").orderBy("timestamp", "asc").onSnapshot(snap => {
                  const box = $("#master-chat-box"); box.empty();
                  let latestAudio = `<span style="font-size: 11px; color: #94a3b8; font-style: italic;">No voice notes yet...</span>`;
                  snap.forEach(doc => {
                      const msg = doc.data();
                      const delBtn = isCoach ? `<button class="del-btn" onclick="deleteVN('${doc.id}')">🗑️</button>` : '';
                      let content = msg.audio ? `<div style="display:flex; align-items:center;"><audio controls src="${msg.audio}"></audio>${delBtn}</div>` : `<span>${msg.text}</span>`;
                      box.append(`<div class="chat-msg"><span class="chat-name">${msg.sender}</span>${content}</div>`);
                      if(msg.audio) latestAudio = `<div style="display:flex; align-items:center;"><audio controls src="${msg.audio}"></audio>${delBtn}</div>`;
                  });
                  $("#latest-audio-container").html(latestAudio); box.scrollTop(box[0].scrollHeight);
            });
        }

        function sendMasterChat() {
            const text = $("#master-chat-input").val().trim(); if(!text) return;
            db.collection("special_rooms").doc("masterclass_arena").collection("messages").add({
                sender: myData.name, text: text, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            $("#master-chat-input").val("");
        }

        function toggleDrawMode() {
            drawModeActive = !drawModeActive;
            canvas.style.pointerEvents = drawModeActive ? 'auto' : 'none';
            $("#toggle-draw-btn").css('background', drawModeActive ? 'var(--gold)' : '').css('color', drawModeActive ? '#000' : '');
            if(drawModeActive) resizeCanvas();
        }

        function clearDrawing() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            db.collection("special_rooms").doc("masterclass_arena").update({ drawing: null });
        }

        function resizeCanvas() {
            const board = document.getElementById('masterBoard');
            if (board) { canvas.width = board.clientWidth; canvas.height = board.clientHeight; }
        }

        function initDrawingSync() { 
            db.collection("special_rooms").doc("masterclass_arena").onSnapshot(doc => {
                const data = doc.data();
                if (data?.drawing) {
                    const img = new Image();
                    img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
                    img.src = data.drawing;
                } else { ctx.clearRect(0, 0, canvas.width, canvas.height); }
            });
        }

        function syncMasterPosition(pos) { 
            masterBoard.position(pos); 
            db.collection("special_rooms").doc("masterclass_arena").update({ fen: masterBoard.fen() });
        }

        function emptyBoard() { 
            masterBoard.clear(); 
            db.collection("special_rooms").doc("masterclass_arena").update({ fen: '8/8/8/8/8/8/8/8 w - - 0 1' });
        }

        function startDrawing(e) {
            if(!drawModeActive || !isCoach) return;
            isDrawing = true; ctx.beginPath();
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
            ctx.moveTo(x, y);
        }

        function draw(e) {
            if(!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
            ctx.lineTo(x, y); ctx.strokeStyle='#fbbf24'; ctx.lineWidth=4; ctx.lineCap = 'round'; ctx.stroke();
        }

        function stopDrawing() {
            if(isDrawing) { isDrawing = false; db.collection("special_rooms").doc("masterclass_arena").update({ drawing: canvas.toDataURL() }); }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
        canvas.addEventListener('touchend', stopDrawing);
        window.addEventListener('resize', resizeCanvas);

    </script>
</body>
</html>
