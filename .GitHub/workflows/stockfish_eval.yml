name: Run Stockfish Analysis

on:
  workflow_dispatch:
    inputs:
      fens:
        description: 'Enter FEN strings (separated by commas)'
        required: true
        default: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'
      move:
        description: 'Enter the move in UCI format (e.g., e2e4, g1f3)'
        required: true
        default: 'e2e4'

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          pip install chess

      - name: Run Stockfish Script and Output to Summary
        run: |
          python run_stockfish.py "${{ github.event.inputs.fens }}" "${{ github.event.inputs.move }}" >> $GITHUB_STEP_SUMMARY
